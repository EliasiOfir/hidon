<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">

<title>חידון התנ"ך - שלב ב'</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    font-size: 2rem;
    margin: 20px 0 10px;
    color: #f0c040;
    text-align: center;
  }
  .subtitle { color: #aaa; margin-bottom: 30px; text-align: center; }

  /* Setup screen */
  #setup {
    background: #16213e;
    border-radius: 16px;
    padding: 30px;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .section-title { color: #f0c040; font-size: 1.1rem; margin-bottom: 12px; font-weight: bold; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
  .btn-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .choice-btn {
    padding: 12px;
    border: 2px solid #334;
    background: #0f3460;
    color: #eee;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    text-align: center;
    transition: all 0.2s;
  }
  .choice-btn:hover { border-color: #f0c040; background: #1a4a7a; }
  .choice-btn.selected { border-color: #f0c040; background: #2a5a8a; color: #f0c040; font-weight: bold; }
  .num-row { display: flex; gap: 10px; align-items: center; margin-bottom: 24px; }
  .num-row label { color: #aaa; white-space: nowrap; }
  input[type=range] { flex: 1; accent-color: #f0c040; }
  #numDisplay { color: #f0c040; font-weight: bold; min-width: 30px; text-align: center; }
  .start-btn {
    width: 100%;
    padding: 16px;
    background: #f0c040;
    color: #1a1a2e;
    border: none;
    border-radius: 12px;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  .start-btn:hover { background: #ffd060; }
  .start-btn:disabled { background: #555; color: #888; cursor: not-allowed; }

  /* Quiz screen */
  #quiz { display: none; width: 100%; max-width: 700px; }
  .progress-bar-wrap { background: #334; border-radius: 8px; height: 8px; margin-bottom: 20px; }
  .progress-bar { height: 8px; background: #f0c040; border-radius: 8px; transition: width 0.3s; }
  .progress-label { text-align: center; color: #aaa; font-size: 0.9rem; margin-bottom: 8px; }
  .card {
    background: #16213e;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    margin-bottom: 20px;
  }
  .source-tag {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 12px;
  }
  .question-text {
    font-size: 1.15rem;
    line-height: 1.7;
    white-space: pre-wrap;
    margin-bottom: 24px;
  }
  .answer-box {
    background: #0f3460;
    border-radius: 10px;
    padding: 16px;
    line-height: 1.7;
    display: none;
    margin-bottom: 20px;
    border-right: 4px solid #f0c040;
    white-space: pre-wrap;
  }
  .action-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .reveal-btn {
    flex: 1;
    padding: 13px;
    background: #0f3460;
    color: #eee;
    border: 2px solid #f0c040;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    transition: background 0.2s;
  }
  .reveal-btn:hover { background: #1a4a7a; }
  .knew-btn {
    flex: 1;
    padding: 13px;
    background: #1a5c3a;
    color: #eee;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    display: none;
  }
  .knew-btn:hover { background: #226644; }
  .didnt-btn {
    flex: 1;
    padding: 13px;
    background: #5c1a1a;
    color: #eee;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    display: none;
  }
  .didnt-btn:hover { background: #882222; }
  .score-live {
    text-align: center;
    color: #aaa;
    font-size: 0.95rem;
    margin-top: 10px;
  }

  /* Results screen */
  #results {
    display: none;
    background: #16213e;
    border-radius: 16px;
    padding: 40px 30px;
    width: 100%;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .big-score { font-size: 3.5rem; font-weight: bold; color: #f0c040; margin: 20px 0; }
  .grade-msg { font-size: 1.3rem; margin-bottom: 30px; }
  .again-btn {
    padding: 14px 40px;
    background: #f0c040;
    color: #1a1a2e;
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
  }
  .again-btn:hover { background: #ffd060; }

  /* Mastered bar */
  .mastered-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: #0f3460; border-radius: 10px; padding: 12px 16px;
    margin-bottom: 24px; gap: 12px;
  }
  .mastered-label { color: #aaa; font-size: 0.9rem; }
  .mastered-count { color: #f0c040; font-weight: bold; font-size: 1rem; }
  .mastered-toggle { display: flex; align-items: center; gap: 7px; font-size: 0.85rem; color: #aaa; cursor: pointer; }
  .mastered-toggle input { accent-color: #f0c040; cursor: pointer; width: 15px; height: 15px; }
  .reset-mastered {
    background: none; border: 1px solid #445; color: #888;
    border-radius: 6px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer;
  }
  .reset-mastered:hover { border-color: #e05; color: #e05; }

  /* Story picker */
  #storySection { display: none; margin-bottom: 24px; }
  .story-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    max-height: 260px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .story-grid::-webkit-scrollbar { width: 5px; }
  .story-grid::-webkit-scrollbar-track { background: #0f3460; border-radius: 4px; }
  .story-grid::-webkit-scrollbar-thumb { background: #f0c040; border-radius: 4px; }

  /* Mastered flash on knew-btn */
  @keyframes masterFlash { 0%{background:#1a5c3a} 50%{background:#2a8a56} 100%{background:#1a5c3a} }
  .knew-btn.flash { animation: masterFlash 0.4s ease; }

  /* Flag button */
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .source-tag { font-size: 0.8rem; color: #888; margin-bottom: 0; }
  .flag-btn {
    background: none;
    border: 1px solid #445;
    color: #888;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .flag-btn:hover { border-color: #e05; color: #e05; }
  .flag-btn.flagged { border-color: #e05; color: #e05; background: #2a0a12; }

  /* Flag panel */
  .flag-panel {
    display: none;
    background: #1a0a14;
    border: 1px solid #e05;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .flag-panel label { font-size: 0.85rem; color: #ccc; display: block; margin-bottom: 8px; }
  .flag-panel textarea {
    width: 100%;
    background: #0d0018;
    border: 1px solid #445;
    border-radius: 6px;
    color: #eee;
    padding: 8px;
    font-size: 0.9rem;
    resize: vertical;
    min-height: 60px;
    font-family: inherit;
    direction: rtl;
  }
  .flag-panel textarea:focus { outline: none; border-color: #e05; }
  .flag-save-btn {
    margin-top: 8px;
    padding: 7px 18px;
    background: #e05;
    color: #fff;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .flag-save-btn:hover { background: #f03070; }

  /* Feedback summary in results */
  .feedback-section {
    display: none;
    margin-top: 28px;
    text-align: right;
    border-top: 1px solid #334;
    padding-top: 22px;
  }
  .feedback-section h3 { color: #e05; font-size: 1rem; margin-bottom: 12px; text-align: center; }
  .feedback-item {
    background: #1a0a14;
    border-right: 3px solid #e05;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    font-size: 0.85rem;
    color: #ccc;
  }
  .feedback-item strong { color: #eee; display: block; margin-bottom: 4px; }
  .feedback-item .note { color: #f08; font-style: italic; margin-top: 4px; }
  .feedback-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .copy-btn {
    flex: 1;
    padding: 10px;
    background: #334;
    color: #eee;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .copy-btn:hover { background: #445; }
  .email-btn {
    flex: 1;
    padding: 10px;
    background: #e05;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: none;
    text-align: center;
    display: block;
  }
  .email-btn:hover { background: #f03070; }
</style>
</head>
<body>

<h1>חידון התנ"ך — שלב ב'</h1>
<p class="subtitle">חידון הלאומי • 2,824 שאלות</p>

<!-- Setup -->
<div id="setup">
  <div class="mastered-bar">
    <div>
      <div class="mastered-label">שאלות שנרכשו</div>
      <div class="mastered-count"><span id="masteredCount">0</span> / 2,824</div>
    </div>
    <label class="mastered-toggle">
      <input type="checkbox" id="includeMastered">
      כלול שאלות שנרכשו
    </label>
    <button class="reset-mastered" onclick="resetMastered()">איפוס</button>
  </div>

  <div class="section-title">בחר ספר</div>
  <div class="btn-grid" id="bookBtns">
    <div class="choice-btn" data-book="bereshit">בראשית</div>
    <div class="choice-btn" data-book="shemot">שמות</div>
    <div class="choice-btn" data-book="bamidbar">במדבר</div>
    <div class="choice-btn" data-book="yehoshua">יהושע</div>
    <div class="choice-btn" data-book="shoftim">שופטים</div>
    <div class="choice-btn" data-book="all">כל הספרים</div>
  </div>

  <div id="storySection">
    <div class="section-title">בחר סיפור</div>
    <div class="story-grid" id="storyGrid"></div>
  </div>

  <div class="section-title">סוג שאלות</div>
  <div class="btn-grid three" id="typeBtns">
    <div class="choice-btn" data-type="story">סיפור</div>
    <div class="choice-btn" data-type="text">טקסט</div>
    <div class="choice-btn" data-type="mixed">מעורב</div>
  </div>

  <div class="section-title">מספר שאלות</div>
  <div class="num-row">
    <label>5</label>
    <input type="range" id="numSlider" min="5" max="50" step="5" value="10">
    <label>50</label>
    <span id="numDisplay">10</span>
  </div>

  <button class="start-btn" id="startBtn" disabled>התחל חידון ▶</button>
</div>

<!-- Quiz -->
<div id="quiz">
  <div class="progress-label" id="progressLabel">שאלה 1 מתוך 10</div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="card">
    <div class="card-header">
      <div class="source-tag" id="sourceTag"></div>
      <button class="flag-btn" id="flagBtn" onclick="toggleFlag()">🚩 דווח</button>
    </div>
    <div class="flag-panel" id="flagPanel">
      <label>מה הבעיה עם השאלה? (אופציונלי)</label>
      <textarea id="flagNote" placeholder="למשל: תשובה שגויה, שאלה לא ברורה, מחוץ לתכנית..."></textarea>
      <button class="flag-save-btn" onclick="saveFlag()">סמן ושמור</button>
    </div>
    <div class="question-text" id="questionText"></div>
    <div class="answer-box" id="answerBox"></div>
    <div class="action-row">
      <button class="reveal-btn" id="revealBtn" onclick="reveal()">הצג תשובה 👁</button>
      <button class="knew-btn" id="knewBtn" onclick="next(true)">ידעתי ✓</button>
      <button class="didnt-btn" id="didntBtn" onclick="next(false)">לא ידעתי ✗</button>
    </div>
    <div class="score-live" id="scoreLive"></div>
  </div>
</div>

<!-- Results -->
<div id="results">
  <div style="font-size:1.4rem;margin-bottom:10px;">סיום החידון!</div>
  <div class="big-score" id="bigScore"></div>
  <div class="grade-msg" id="gradeMsg"></div>
  <button class="again-btn" onclick="restart()">חידון נוסף</button>

  <div class="feedback-section" id="feedbackSection">
    <h3>🚩 שאלות מדווחות (<span id="flagCount">0</span>)</h3>
    <div id="flaggedList"></div>
    <div class="feedback-actions">
      <button class="copy-btn" onclick="copyFeedback()">📋 העתק</button>
      <a class="email-btn" id="emailBtn" href="#" onclick="sendEmail()">✉️ שלח לאופיר</a>
    </div>
  </div>
</div>

let questions = [];
let current = 0;
let score = 0;

let currentFlagged = false;

// Mastery — persisted in localStorage
const MASTERED_KEY = 'hidon_mastered_v1';
let mastered = new Set(JSON.parse(localStorage.getItem(MASTERED_KEY) || '[]'));

function qKey(q) { return q.source + '|||' + q.q; }

function saveMastered() {
  localStorage.setItem(MASTERED_KEY, JSON.stringify([...mastered]));
  document.getElementById('masteredCount').textContent = mastered.size;
}

function resetMastered() {
  if (!confirm('לאפס את כל השאלות שנרכשו?')) return;
  mastered.clear();
  saveMastered();
}

allData = {"bereshit": {"name": "בראשית", "story": [{"q": "1. בן כמה היה אברם כשיצא מחרן?", "a": "75 (בן חמש שנים ושבעים שנה)", "source": "01 lech lecha", "type": "story"}, {"q": "2. מי הלך עם אברם מחרן?", "a": "שרי אשתו, לוט בן אחיו, רכושם והנפש שעשו בחרן", "source": "01 lech lecha", "type": "story"}, {"q": "3. מהן שלוש ההבטחות של ה' לאברם?", "a": "גוי גדול, ברכה, שם גדול", "source": "01 lech lecha", "type": "story"}, {"q": "4. מהו המקום הראשון שאברם הגיע אליו בכנען?", "a": "שכם, עד אלון מורה", "source": "01 lech lecha", "type": "story"}, {"q": "5. מה עשה אברם בשכם?", "a": "בנה מזבח לה' הנראה אליו", "source": "01 lech lecha", "type": "story"}, {"q": "6. מה הבטיח ה' לאברם בשכם?", "a": "\"לזרעך אתן את הארץ הזאת\"", "source": "01 lech lecha", "type": "story"}, {"q": "7. לאן נעתק אברם משכם?", "a": "להר שבין בית אל (ממערב) לעי (ממזרח)", "source": "01 lech lecha", "type": "story"}, {"q": "8. מה עשה אברם בין בית אל לעי?", "a": "נטה אוהלו, בנה מזבח וקרא בשם ה'", "source": "01 lech lecha", "type": "story"}, {"q": "9. מדוע ירד אברם למצרים?", "a": "בגלל רעב כבד בארץ", "source": "01 lech lecha", "type": "story"}, {"q": "10. מה ביקש אברם משרי לפני הכניסה למצרים?", "a": "לומר שהיא אחותו, כדי שלא יהרגו אותו", "source": "01 lech lecha", "type": "story"}, {"q": "11. מה קרה לשרי במצרים?", "a": "שרי פרעה ראו את יופייה, הללו אותה, והיא נלקחה לבית פרעה", "source": "01 lech lecha", "type": "story"}, {"q": "12. מה קיבל אברם מפרעה בעבור שרי?", "a": "צאן, בקר, חמורים, עבדים, שפחות, אתונות וגמלים (7 מתנות)", "source": "01 lech lecha", "type": "story"}, {"q": "13. כיצד נענש פרעה?", "a": "ה' נגע בפרעה ובביתו בנגעים גדולים", "source": "01 lech lecha", "type": "story"}, {"q": "14. מה עשה פרעה כשגילה ששרי היא אשת אברם?", "a": "הוכיח את אברם, החזיר את שרי, ושילח אותם עם כל רכושם", "source": "01 lech lecha", "type": "story"}, {"q": "15. כמה מזבחות בנה אברם בכנען בפרק זה?", "a": "שניים - אחד בשכם ואחד בין בית אל לעי", "source": "01 lech lecha", "type": "story"}, {"q": "16. מהי ההבטחה האוניברסלית שה' הבטיח לאברם?", "a": "\"ונברכו בך כל משפחות האדמה\"", "source": "01 lech lecha", "type": "story"}, {"q": "17. איזה ביטוי בפסוק א' מדגיש את הניתוק מהעבר?", "a": "\"לך לך מארצך וממולדתך ומבית אביך\" - שלוש דרגות ניתוק", "source": "01 lech lecha", "type": "story"}, {"q": "18. מי היה בארץ כנען כשאברם הגיע?", "a": "\"והכנעני אז בארץ\"", "source": "01 lech lecha", "type": "story"}, {"q": "19. ⭐⭐ מהן שבע המתנות שקיבל אברם מפרעה? פרט את כולן.", "a": "צאן, בקר, חמורים, עבדים, שפחות, אתונות וגמלים", "source": "01 lech lecha", "type": "story"}, {"q": "20. ⭐⭐⭐ מי היה לוט ומהו קשר המשפחה המדויק שלו לאברם?", "a": "לוט היה בן אחי אברם (בן הרן) - \"ואת לוט בן אחיו\" (בראשית י\"ב:ה')", "source": "01 lech lecha", "type": "story"}, {"q": "21. ⭐⭐⭐ לאן נסע אברם מבית אל?", "a": "לכיוון הנגב - \"ויסע אברם הלוך ונסוע הנגבה\" (בראשית י\"ב:ט')", "source": "01 lech lecha", "type": "story"}, {"q": "22. ⭐⭐ מה הביטוי המדויק שבו תיאר פרעה את כעסו על אברם?", "a": "\"מה זאת עשית לי, למה לא הגדת לי כי אשתך היא. למה אמרת אחותי היא ואקח אותה לי לאישה\" (בראשית י\"ב:י\"ח-י\"ט)", "source": "01 lech lecha", "type": "story"}, {"q": "1. ⭐ \"לֶךְ לְךָ מֵאַרְצְךָ וּמִמּוֹלַדְתְּךָ\"", "a": "**מי אמר:** ה'\n**למי:** אברם\n**הקשר:** ציווי לאברם לעזוב את חרן וללכת לארץ כנען (בראשית י\"ב:א')", "source": "01 lech lecha", "type": "story"}, {"q": "2. ⭐⭐ \"אִמְרִי נָא אֲחֹתִי אָתְּ\"", "a": "**מי אמר:** אברם\n**למי:** שרי\n**הקשר:** בקשת אברם משרי להציג עצמה כאחותו בירידה למצרים (בראשית י\"ב:י\"ג)", "source": "01 lech lecha", "type": "story"}, {"q": "1. ⭐ אמר על אשתו \"אחותי היא\", חלק את הארץ עם קרובו, ערך ברית עם מלך גרר, עקד את בנו על המזבח", "a": "**הדמות:** אברהם\n**ספר:** בראשית\n**הקשר:** אברהם אמר על שרה \"אחותי היא\" בפני פרעה ובפני אבימלך, חלק את הארץ עם לוט, כרת ברית עם אבימלך בבאר שבע, ועקד את יצחק בארץ המוריה (פרקים י\"ב-כ\"ב)", "source": "01 lech lecha", "type": "story"}, {"q": "2. ⭐⭐ נגעו בנגעים בגללה, הובאה לארמון מלך, שמה שונה מ-שרי", "a": "**הדמות:** שרה (בהקשר מצרים)\n**ספר:** בראשית\n**הקשר:** פרעה ובית פרעה נגעו בנגעים גדולים בגלל שרה שנלקחה לארמונו, ושמה שונה מ-שרי לשרה בברית המילה (פרקים י\"ב, י\"ז)", "source": "01 lech lecha", "type": "story"}, {"q": "1. ⭐ אברם ירד למצרים בגלל רעב בארץ כנען. נכון או לא נכון?", "a": "**נכון.** \"ויהי רעב בארץ וירד אברם מצרימה לגור שם כי כבד הרעב בארץ\" (בראשית י\"ב:י').", "source": "01 lech lecha", "type": "story"}, {"q": "2. ⭐⭐⭐ פרעה גילה בעצמו ששרי היא אשת אברם. נכון או לא נכון?", "a": "**לא נכון.** פרעה גילה את האמת רק בגלל שה' נגע בו ובביתו בנגעים גדולים \"על דבר שרי אשת אברם\" (בראשית י\"ב:י\"ז). הנגעים הם שחשפו את האמת.", "source": "01 lech lecha", "type": "story"}, {"q": "3. ⭐⭐⭐ אברם בנה מזבח וקרא בשם ה' בשכם. נכון או לא נכון?", "a": "**לא נכון.** בשכם (אלון מורה) אברם בנה מזבח אך לא נאמר שקרא בשם ה' (י\"ב:ז'). רק בין בית אל לעי נאמר \"ויבן שם מזבח לה' **ויקרא בשם ה'**\" (י\"ב:ח').", "source": "01 lech lecha", "type": "story"}, {"q": "4. ⭐⭐⭐ אברם ירד למצרים בגלל מלחמה בארץ כנען. נכון או לא נכון?", "a": "**לא נכון.** אברם ירד למצרים בגלל **רעב** ולא מלחמה: \"ויהי רעב בארץ וירד אברם מצרימה לגור שם **כי כבד הרעב בארץ**\" (בראשית י\"ב:י').", "source": "01 lech lecha", "type": "story"}, {"q": "5. ⭐⭐⭐ שרי פרעה הללו את שרי בפני פרעה. נכון או לא נכון?", "a": "**נכון.** \"ויראו אותה שרי פרעה **ויהללו אותה אל פרעה** ותוקח האשה בית פרעה\" (בראשית י\"ב:ט\"ו).", "source": "01 lech lecha", "type": "story"}, {"q": "3. ⭐⭐⭐ \"מַה זֹּאת עָשִׂיתָ לִּי לָמָּה לֹא הִגַּדְתָּ לִּי כִּי אִשְׁתְּךָ הִוא\"", "a": "**מי אמר:** פרעה\n**למי:** אברם\n**הקשר:** פרעה מוכיח את אברם לאחר שגילה ששרי היא אשתו ולא אחותו (בראשית י\"ב:י\"ח)", "source": "01 lech lecha", "type": "story"}, {"q": "3. ⭐⭐⭐ עזב את ארצו בגיל 75, בנה מזבחות בשני מקומות שונים בכנען, אשתו נלקחה ממנו על ידי מלך בגלל יופיה", "a": "**הדמות:** אברם (אברהם)\n**ספר:** בראשית\n**הקשר:** אברם יצא מחרן בגיל 75, בנה מזבחות בשכם ובין בית אל לעי, ושרי נלקחה לבית פרעה (פרק י\"ב)", "source": "01 lech lecha", "type": "story"}, {"q": "1. ⭐⭐ \"לֶךְ לְךָ מֵאַרְצְךָ וּמִמּוֹלַדְתְּךָ וּמִבֵּית _____ אֶל הָאָרֶץ אֲשֶׁר אַרְאֶךָּ\"", "a": "**מילה חסרה:** אָבִיךָ\n**מי אמר:** ה'\n**הקשר:** הציווי הראשון לאברם לעזוב את חרן (בראשית י\"ב:א')", "source": "01 lech lecha", "type": "story"}, {"q": "2. ⭐⭐ \"וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וַאֲבָרֶכְךָ וַאֲגַדְּלָה _____ וֶהְיֵה בְּרָכָה\"", "a": "**מילה חסרה:** שְׁמֶךָ\n**מי אמר:** ה'\n**הקשר:** ההבטחה המרכזית לאברם בתחילת לך לך (בראשית י\"ב:ב')", "source": "01 lech lecha", "type": "story"}, {"q": "3. ⭐⭐⭐ \"אִמְרִי נָא _____ אָתְּ לְמַעַן יִיטַב לִי בַעֲבוּרֵךְ\"", "a": "**מילה חסרה:** אֲחֹתִי\n**מי אמר:** אברם\n**הקשר:** אברם מבקש משרי לומר שהיא אחותו לפני הכניסה למצרים (בראשית י\"ב:י\"ג)", "source": "01 lech lecha", "type": "story"}, {"q": "4. ⭐⭐⭐ \"וַיְנַגַּע יְהוָה אֶת פַּרְעֹה נְגָעִים גְּדֹלִים וְאֶת בֵּיתוֹ עַל דְּבַר שָׂרַי _____ אַבְרָם\"", "a": "**מילה חסרה:** אֵשֶׁת\n**מי אמר:** הכתוב (מספר)\n**הקשר:** ה' מעניש את פרעה בנגעים בגלל לקיחת שרי אשת אברם (בראשית י\"ב:י\"ז)", "source": "01 lech lecha", "type": "story"}, {"q": "5. ⭐⭐ \"לְזַרְעֲךָ אֶתֵּן אֶת הָאָרֶץ _____ וַיִּבֶן שָׁם מִזְבֵּחַ\"", "a": "**מילה חסרה:** הַזֹּאת\n**מי אמר:** ה'\n**הקשר:** ההבטחה הראשונה על הארץ לזרע אברם בשכם (בראשית י\"ב:ז')", "source": "01 lech lecha", "type": "story"}, {"q": "1. מאיפה עלו אברם ולוט בתחילת הפרק?", "a": "ממצרים", "source": "02 avram and lot", "type": "story"}, {"q": "2. במה היה אברם כבד מאוד?", "a": "במקנה, בכסף ובזהב", "source": "02 avram and lot", "type": "story"}, {"q": "3. לאן חזר אברם ממצרים?", "a": "לנגב, ומשם למסעותיו עד בית אל, למקום שבנה מזבח בראשונה", "source": "02 avram and lot", "type": "story"}, {"q": "4. בין אילו שני מקומות היה אוהלו של אברם בתחילה?", "a": "בין בית אל ובין העי", "source": "02 avram and lot", "type": "story"}, {"q": "5. מה היה ללוט מלבד צאן ובקר?", "a": "אוהלים", "source": "02 avram and lot", "type": "story"}, {"q": "6. מדוע לא יכלו אברם ולוט לשבת יחדיו?", "a": "כי רכושם היה רב והארץ לא נשאה אותם לשבת יחד", "source": "02 avram and lot", "type": "story"}, {"q": "7. בין מי למי היה הריב?", "a": "בין רועי מקנה אברם לבין רועי מקנה לוט", "source": "02 avram and lot", "type": "story"}, {"q": "8. אילו שני עמים ישבו אז בארץ?", "a": "הכנעני והפריזי", "source": "02 avram and lot", "type": "story"}, {"q": "9. מה אמר אברם ללוט כדי למנוע את המריבה?", "a": "\"אל נא תהי מריבה ביני ובינך ובין רועי ובין רועיך כי אנשים אחים אנחנו\"", "source": "02 avram and lot", "type": "story"}, {"q": "10. מה הציע אברם ללוט?", "a": "להיפרד - אם לוט ילך שמאלה אברם ילך ימינה, ולהפך", "source": "02 avram and lot", "type": "story"}, {"q": "11. איזה אזור בחר לוט ומדוע?", "a": "את כיכר הירדן, כי כולה היתה משקה, כגן ה' כארץ מצרים", "source": "02 avram and lot", "type": "story"}, {"q": "12. כיצד מתוארים אנשי סדום בפסוק י\"ג?", "a": "\"רעים וחטאים לה' מאוד\"", "source": "02 avram and lot", "type": "story"}, {"q": "13. לאילו ארבעה כיוונים הבטיח ה' לאברם את הארץ?", "a": "צפונה, נגבה, קדמה וימה", "source": "02 avram and lot", "type": "story"}, {"q": "14. למה דימה ה' את זרע אברם?", "a": "לעפר הארץ שלא ניתן למנותו", "source": "02 avram and lot", "type": "story"}, {"q": "15. מה ציווה ה' את אברם לעשות בארץ?", "a": "\"קום התהלך בארץ לארכה ולרחבה\"", "source": "02 avram and lot", "type": "story"}, {"q": "16. איפה התיישב אברם לאחר הפרידה מלוט?", "a": "באלוני ממרא אשר בחברון", "source": "02 avram and lot", "type": "story"}, {"q": "17. מה עשה אברם באלוני ממרא?", "a": "בנה מזבח לה'", "source": "02 avram and lot", "type": "story"}, {"q": "18. מהו הביטוי שבו תיאר הכתוב את כיכר הירדן לפני חורבן סדום?", "a": "\"כגן ה' כארץ מצרים בואכה צוער\"", "source": "02 avram and lot", "type": "story"}, {"q": "19. ⭐⭐ כמה מזבחות בנה אברם בסך הכל עד סוף פרק י\"ג?", "a": "שלושה מזבחות: בשכם (י\"ב:ז'), בין בית אל לעי (י\"ב:ח'), ובאלוני ממרא בחברון (י\"ג:י\"ח)", "source": "02 avram and lot", "type": "story"}, {"q": "20. ⭐⭐⭐ מה היה מוצא לוט ומי היה אביו?", "a": "לוט היה בן הרן, אחי אברם - \"את לוט בן אחיו\" (בראשית י\"ב:ה'). הרן מת באור כשדים.", "source": "02 avram and lot", "type": "story"}, {"q": "21. ⭐⭐⭐ לאיזה כיוון נסע לוט כשנפרד מאברם?", "a": "\"ויסע לוט מקדם\" - נסע מזרחה (בראשית י\"ג:י\"א)", "source": "02 avram and lot", "type": "story"}, {"q": "1. ⭐⭐ \"הִפָּרֶד נָא מֵעָלָי\"", "a": "**מי אמר:** אברם\n**למי:** לוט\n**הקשר:** אברם מציע ללוט להיפרד בגלל הריב בין הרועים (בראשית י\"ג:ט')", "source": "02 avram and lot", "type": "story"}, {"q": "1. ⭐ בחר לגור ליד עיר רשעה, נלקח בשבי במלחמה, הכניס אורחים לביתו בסדום, אשתו הפכה לנציב מלח", "a": "**הדמות:** לוט\n**ספר:** בראשית\n**הקשר:** לוט בחר לגור ליד סדום, נלקח בשבי במלחמת ארבעת המלכים, הכניס את המלאכים לביתו, ואשתו הפכה לנציב מלח כשהביטה לאחור בזמן חורבן סדום (פרקים י\"ג-י\"ט)", "source": "02 avram and lot", "type": "story"}, {"q": "1. ⭐ לוט בחר לגור בסדום כי הכיכר היה \"כגן ה' כארץ מצרים\". נכון או לא נכון?", "a": "**נכון.** \"וישא לוט את עיניו וירא את כל ככר הירדן כי כולה משקה... כגן ה' כארץ מצרים\" (בראשית י\"ג:י').", "source": "02 avram and lot", "type": "story"}, {"q": "2. ⭐⭐⭐ לוט נסע ימינה (דרומה) לכיוון סדום. נכון או לא נכון?", "a": "**לא נכון.** הכתוב אומר \"ויסע לוט **מקדם**\" (בראשית י\"ג:י\"א) - לוט נסע מזרחה, לא דרומה.", "source": "02 avram and lot", "type": "story"}, {"q": "3. ⭐⭐⭐ ה' הבטיח לאברם את הארץ לפני שלוט בחר את כיכר הירדן. נכון או לא נכון?", "a": "**לא נכון.** ההבטחה באה דווקא **אחרי** הפרידה: \"וה' אמר אל אברם **אחרי היפרד לוט מעמו** שא נא עיניך וראה...\" (בראשית י\"ג:י\"ד).", "source": "02 avram and lot", "type": "story"}, {"q": "2. ⭐⭐⭐ \"קוּם הִתְהַלֵּךְ בָּאָרֶץ לְאָרְכָּהּ וּלְרָחְבָּהּ כִּי לְךָ אֶתְּנֶנָּה\"", "a": "**מי אמר:** ה'\n**למי:** אברם\n**הקשר:** ה' מצווה את אברם לסקור את הארץ לאחר פרידת לוט (בראשית י\"ג:י\"ז)", "source": "02 avram and lot", "type": "story"}, {"q": "2. ⭐⭐⭐ רכושו הרב גרם לריב, בחר אזור שנראה פורה אך היה מלא רשעים, ישב בשער עיר שנחרבה", "a": "**הדמות:** לוט\n**ספר:** בראשית\n**הקשר:** רכוש לוט ואברם גרם לריב בין הרועים, לוט בחר את כיכר הירדן ליד סדום למרות שאנשיה \"רעים וחטאים\", ובפרק י\"ט הוא יושב בשער סדום (פרקים י\"ג, י\"ט)", "source": "02 avram and lot", "type": "story"}, {"q": "4. ⭐⭐⭐ אברם בנה מזבח באלוני ממרא וגם קרא שם בשם ה'. נכון או לא נכון?", "a": "**לא נכון.** באלוני ממרא נאמר רק \"ויבן שם מזבח לה'\" (בראשית י\"ג:י\"ח) - **לא** נאמר שקרא בשם ה'. קריאה בשם ה' נאמרה רק בין בית אל לעי (י\"ב:ח') ובחזרה לשם (י\"ג:ד').", "source": "02 avram and lot", "type": "story"}, {"q": "5. ⭐⭐⭐ אברם הציע ללוט לבחור ראשון לאיזה כיוון ללכת. נכון או לא נכון?", "a": "**נכון.** אברם אמר \"הלא כל הארץ לפניך, הפרד נא מעלי, אם השמאל ואימנה ואם הימין ואשמאילה\" (בראשית י\"ג:ט') - נתן ללוט לבחור ראשון.", "source": "02 avram and lot", "type": "story"}, {"q": "1. ⭐⭐ \"אַל נָא תְהִי מְרִיבָה בֵּינִי וּבֵינֶךָ... כִּי אֲנָשִׁים _____ אֲנָחְנוּ\"", "a": "**מילה חסרה:** אַחִים\n**מי אמר:** אברם\n**הקשר:** אברם מציע ללוט להיפרד בשלום בגלל הריב בין הרועים (בראשית י\"ג:ח')", "source": "02 avram and lot", "type": "story"}, {"q": "2. ⭐⭐⭐ \"וְשַׂמְתִּי אֶת זַרְעֲךָ כַּעֲפַר הָאָרֶץ אֲשֶׁר אִם יוּכַל אִישׁ _____ אֶת עֲפַר הָאָרֶץ\"", "a": "**מילה חסרה:** לִמְנוֹת\n**מי אמר:** ה'\n**הקשר:** הבטחת ריבוי הזרע לאברם לאחר פרידת לוט (בראשית י\"ג:ט\"ז)", "source": "02 avram and lot", "type": "story"}, {"q": "3. ⭐⭐ \"קוּם הִתְהַלֵּךְ בָּאָרֶץ לְאָרְכָּהּ וּלְרָחְבָּהּ כִּי לְךָ _____\"", "a": "**מילה חסרה:** אֶתְּנֶנָּה\n**מי אמר:** ה'\n**הקשר:** ה' מצווה את אברם לסקור את הארץ ומבטיח לתת לו אותה (בראשית י\"ג:י\"ז)", "source": "02 avram and lot", "type": "story"}, {"q": "4. ⭐⭐⭐ \"וְאַנְשֵׁי סְדֹם _____ וְחַטָּאִים לַיהוָה מְאֹד\"", "a": "**מילה חסרה:** רָעִים\n**מי אמר:** הכתוב (מספר)\n**הקשר:** תיאור אנשי סדום לאחר שלוט בחר לגור שם (בראשית י\"ג:י\"ג)", "source": "02 avram and lot", "type": "story"}, {"q": "1. כמה מלכים היו בכל צד במלחמה?", "a": "ארבעה מלכים (כדרלעומר ובעלי בריתו) נגד חמישה מלכים (מלכי כיכר הירדן)", "source": "03 war of kings", "type": "story"}, {"q": "2. מי עמד בראש ברית ארבעת המלכים?", "a": "כדרלעומר מלך עילם", "source": "03 war of kings", "type": "story"}, {"q": "3. כמה שנים עבדו חמשת המלכים את כדרלעומר?", "a": "שתים עשרה שנה", "source": "03 war of kings", "type": "story"}, {"q": "4. באיזו שנה מרדו חמשת המלכים?", "a": "בשנה השלוש עשרה", "source": "03 war of kings", "type": "story"}, {"q": "5. באיזו שנה בא כדרלעומר להילחם?", "a": "בשנה הארבע עשרה", "source": "03 war of kings", "type": "story"}, {"q": "6. היכן התנהלה המלחמה בין המלכים?", "a": "בעמק השדים, הוא ים המלח", "source": "03 war of kings", "type": "story"}, {"q": "7. מה היה בעמק השדים שגרם למפלת מלכי סדום ועמורה?", "a": "בארות חמר (בורות זפת)", "source": "03 war of kings", "type": "story"}, {"q": "8. מי נשבה במלחמה?", "a": "לוט בן אחי אברם ורכושו", "source": "03 war of kings", "type": "story"}, {"q": "9. מי סיפר לאברם על שבי לוט?", "a": "הפליט", "source": "03 war of kings", "type": "story"}, {"q": "10. באיזה כינוי נקרא אברם לראשונה בפרק זה?", "a": "\"העברי\" - זהו הכינוי הראשון \"עברי\" במקרא", "source": "03 war of kings", "type": "story"}, {"q": "11. כמה חניכים הוציא אברם למלחמה ומי היו?", "a": "318 חניכים, ילידי ביתו", "source": "03 war of kings", "type": "story"}, {"q": "12. עד לאן רדף אברם את האויבים?", "a": "רדף עד דן, ואחר כך הכה אותם ורדפם עד חובה אשר משמאל לדמשק", "source": "03 war of kings", "type": "story"}, {"q": "13. מי היה מלכי צדק ומה הוציא לאברם?", "a": "מלך שלם, כוהן לאל עליון, הוציא לחם ויין", "source": "03 war of kings", "type": "story"}, {"q": "14. מה נתן אברם למלכי צדק?", "a": "מעשר מכל (עשירית מהשלל)", "source": "03 war of kings", "type": "story"}, {"q": "15. מה הציע מלך סדום לאברם?", "a": "\"תן לי הנפש והרכוש קח לך\"", "source": "03 war of kings", "type": "story"}, {"q": "16. מדוע סירב אברם לקחת רכוש ממלך סדום?", "a": "כדי שמלך סדום לא יאמר \"אני העשרתי את אברם\"", "source": "03 war of kings", "type": "story"}, {"q": "17. מהו הביטוי שאמר אברם לתאר את סירובו המוחלט?", "a": "\"מחוט ועד שרוך נעל\" - לא ייקח דבר", "source": "03 war of kings", "type": "story"}, {"q": "18. מי היו שלושת בעלי ברית אברם?", "a": "ענר, אשכול וממרא", "source": "03 war of kings", "type": "story"}, {"q": "1. ⭐⭐ היה כהן לאל עליון, יצא לקראת מנצח מלחמה עם לחם ויין, קיבל מעשר, מלך שלם", "a": "**הדמות:** מלכי-צדק\n**ספר:** בראשית\n**הקשר:** מלכי-צדק מלך שלם יצא לקראת אברהם אחרי ניצחונו במלחמת המלכים עם לחם ויין, ברכו, ואברהם נתן לו מעשר מכל (פרק י\"ד)", "source": "03 war of kings", "type": "story"}, {"q": "2. ⭐⭐⭐ ביקש ממנצח מלחמה לקחת רכוש, נענה בסירוב מוחלט, שלט בעיר רשעה", "a": "**הדמות:** מלך סדום (ברע)\n**ספר:** בראשית\n**הקשר:** מלך סדום ביקש מאברהם אחרי מלחמת המלכים \"תן לי הנפש והרכוש קח לך\", ואברהם סירב בנחרצות (פרק י\"ד)", "source": "03 war of kings", "type": "story"}, {"q": "1. ⭐⭐⭐ \"תֶּן לִי הַנֶּפֶשׁ וְהָרְכֻשׁ קַח לָךְ\"", "a": "**מי אמר:** מלך סדום\n**למי:** אברם\n**הקשר:** מלך סדום מציע לאברם לקחת את הרכוש ולהחזיר רק את האנשים לאחר הניצחון במלחמה (בראשית י\"ד:כ\"א)", "source": "03 war of kings", "type": "story"}, {"q": "2. ⭐⭐⭐ \"בָּרוּךְ אַבְרָם לְאֵל עֶלְיוֹן קֹנֵה שָׁמַיִם וָאָרֶץ\"", "a": "**מי אמר:** מלכי צדק מלך שלם\n**למי:** אברם\n**הקשר:** מלכי צדק כוהן לאל עליון מברך את אברם לאחר ניצחונו במלחמת המלכים (בראשית י\"ד:י\"ט)", "source": "03 war of kings", "type": "story"}, {"q": "1. ⭐⭐⭐ אברם יצא למלחמה עם 318 חניכים שגויס מהאזור. נכון או לא נכון?", "a": "**לא נכון.** 318 החניכים היו דווקא \"ילידי ביתו\" של אברם - לא מגויסים מבחוץ: \"וירק את חניכיו **ילידי ביתו** שמונה עשר ושלוש מאות\" (בראשית י\"ד:י\"ד).", "source": "03 war of kings", "type": "story"}, {"q": "2. ⭐⭐⭐ אברם סירב לקחת כל דבר ממלך סדום, כולל חלק לאנשיו ענר, אשכול וממרא. נכון או לא נכון?", "a": "**לא נכון.** אברם סירב לקחת לעצמו \"מחוט ועד שרוך נעל\", אבל ביקש במפורש ש**אנשיו** יקבלו חלק: \"רק אשר אכלו הנערים וחלק האנשים אשר הלכו אתי ענר אשכול וממרא הם יקחו חלקם\" (בראשית י\"ד:כ\"ד).", "source": "03 war of kings", "type": "story"}, {"q": "3. ⭐⭐⭐ מלכי צדק היה מלך סדום. נכון או לא נכון?", "a": "**לא נכון.** מלכי צדק היה **מלך שלם** (לא סדום): \"ומלכי צדק מלך **שלם** הוציא לחם ויין והוא כוהן לאל עליון\" (בראשית י\"ד:י\"ח). מלך סדום היה ברע (י\"ד:ב').", "source": "03 war of kings", "type": "story"}, {"q": "19. ⭐⭐ שמות אילו ארבעה מלכים היו בברית כדרלעומר?", "a": "אמרפל מלך שנער, אריוך מלך אלסר, כדרלעומר מלך עילם, ותדעל מלך גויים (בראשית י\"ד:א')", "source": "03 war of kings", "type": "story"}, {"q": "20. ⭐⭐⭐ שמות אילו חמישה מלכים נלחמו נגד כדרלעומר?", "a": "ברע מלך סדום, ברשע מלך עמורה, שנאב מלך אדמה, שמאבר מלך צבויים, ומלך בלע היא צוער (בראשית י\"ד:ב')", "source": "03 war of kings", "type": "story"}, {"q": "21. ⭐⭐⭐ מהו השם המיוחד שבו נקרא עמק השדים?", "a": "\"הוא ים המלח\" (בראשית י\"ד:ג')", "source": "03 war of kings", "type": "story"}, {"q": "1. ⭐⭐ \"וַיָּרֶק אֶת חֲנִיכָיו יְלִידֵי בֵיתוֹ שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ _____ וַיִּרְדֹּף עַד דָּן\"", "a": "**מילה חסרה:** מֵאוֹת\n**מי אמר:** הכתוב (מספר)\n**הקשר:** אברם מגייס 318 חניכיו ילידי ביתו להציל את לוט (בראשית י\"ד:י\"ד)", "source": "03 war of kings", "type": "story"}, {"q": "2. ⭐⭐⭐ \"בָּרוּךְ אַבְרָם לְאֵל _____ קֹנֵה שָׁמַיִם וָאָרֶץ\"", "a": "**מילה חסרה:** עֶלְיוֹן\n**מי אמר:** מלכי צדק\n**הקשר:** ברכת מלכי צדק מלך שלם לאברם לאחר ניצחונו (בראשית י\"ד:י\"ט)", "source": "03 war of kings", "type": "story"}, {"q": "3. ⭐⭐⭐ \"אִם מִחוּט וְעַד שְׂרוֹךְ _____ וְאִם אֶקַּח מִכָּל אֲשֶׁר לָךְ\"", "a": "**מילה חסרה:** נַעַל\n**מי אמר:** אברם\n**הקשר:** סירוב אברם הנחרץ לקחת רכוש ממלך סדום (בראשית י\"ד:כ\"ג)", "source": "03 war of kings", "type": "story"}, {"q": "4. ⭐⭐ \"תֶּן לִי _____ וְהָרְכֻשׁ קַח לָךְ\"", "a": "**מילה חסרה:** הַנֶּפֶשׁ\n**מי אמר:** מלך סדום\n**הקשר:** מלך סדום מציע לאברם לקחת את הרכוש ולהחזיר רק את האנשים (בראשית י\"ד:כ\"א)", "source": "03 war of kings", "type": "story"}, {"q": "1. כיצד בא דבר ה' אל אברם בתחילת הסיפור?", "a": "במחזה", "source": "04 brit bein habetarim", "type": "story"}, {"q": "2. מה אמר ה' לאברם בפתיחת המחזה?", "a": "\"אל תירא אברם, אנכי מגן לך, שכרך הרבה מאוד\"", "source": "04 brit bein habetarim", "type": "story"}, {"q": "3. על מה התלונן אברם בפני ה'?", "a": "שהוא הולך ערירי (ללא ילדים) ויורשו הוא אליעזר הדמשקי, בן ביתו", "source": "04 brit bein habetarim", "type": "story"}, {"q": "4. מי היה אליעזר?", "a": "\"בן משק ביתו\" של אברם, דמשק אליעזר - היורש הפוטנציאלי בהיעדר בן", "source": "04 brit bein habetarim", "type": "story"}, {"q": "5. למה דימה ה' את זרע אברם בברית בין הבתרים?", "a": "לכוכבי השמים (\"הבט נא השמימה וספור הכוכבים... כה יהיה זרעך\")", "source": "04 brit bein habetarim", "type": "story"}, {"q": "6. מה נאמר על אמונת אברם בה'?", "a": "\"והאמין בה' ויחשבה לו צדקה\"", "source": "04 brit bein habetarim", "type": "story"}, {"q": "7. מאיזה מקום הוציא ה' את אברם לפי דבריו?", "a": "מאור כשדים", "source": "04 brit bein habetarim", "type": "story"}, {"q": "8. אילו בהמות ציווה ה' את אברם לקחת לברית?", "a": "עגלה משולשת, עז משולשת, איל משולש, תור וגוזל", "source": "04 brit bein habetarim", "type": "story"}, {"q": "9. מה עשה אברם עם הבהמות ומה לא בתר?", "a": "בתר את הבהמות בתווך ושם כל בתר מול רעהו, אך את הציפור (תור וגוזל) לא בתר", "source": "04 brit bein habetarim", "type": "story"}, {"q": "10. מה ירד על הפגרים ומה עשה אברם?", "a": "העיט ירד על הפגרים ואברם נישב (הרחיק) אותם", "source": "04 brit bein habetarim", "type": "story"}, {"q": "11. מה נפל על אברם כשהשמש עמדה לבוא?", "a": "תרדמה, ואימה חשכה גדולה נופלת עליו", "source": "04 brit bein habetarim", "type": "story"}, {"q": "12. כמה שנה ינבא ה' שזרע אברם יהיה בשעבוד?", "a": "ארבע מאות שנה", "source": "04 brit bein habetarim", "type": "story"}, {"q": "13. באיזה דור ישובו צאצאי אברם לארץ?", "a": "בדור הרביעי", "source": "04 brit bein habetarim", "type": "story"}, {"q": "14. מדוע יש עיכוב בירושת הארץ לפי דברי ה'?", "a": "\"כי לא שלם עוון האמורי עד הנה\"", "source": "04 brit bein habetarim", "type": "story"}, {"q": "15. מה עבר בין הגזרים כשהשמש באה?", "a": "תנור עשן ולפיד אש", "source": "04 brit bein habetarim", "type": "story"}, {"q": "16. מהם גבולות הארץ המובטחת?", "a": "מנהר מצרים עד הנהר הגדול נהר פרת", "source": "04 brit bein habetarim", "type": "story"}, {"q": "17. כמה עמים מנה ה' שארצם תינתן לזרע אברם?", "a": "עשרה עמים: הקיני, הקניזי, הקדמוני, החיתי, הפריזי, הרפאים, האמורי, הכנעני, הגרגשי והיבוסי", "source": "04 brit bein habetarim", "type": "story"}, {"q": "18. מה הבטיח ה' לאברם לגבי סוף חייו?", "a": "\"ואתה תבוא אל אבותיך בשלום, תיקבר בשיבה טובה\"", "source": "04 brit bein habetarim", "type": "story"}, {"q": "1. ⭐⭐ \"אַל תִּירָא אַבְרָם אָנֹכִי מָגֵן לָךְ\"", "a": "**מי אמר:** ה'\n**למי:** אברם\n**הקשר:** ברית בין הבתרים — מראה ה' לאברם לאחר מלחמת המלכים (בראשית ט\"ו:א')", "source": "04 brit bein habetarim", "type": "story"}, {"q": "1. ⭐⭐⭐ ברית בין הבתרים כללה שלושה עגלות, שלוש עזים ושלוש אילים. נכון או לא נכון?", "a": "**לא נכון.** הכתוב אומר: \"עגלה משולשת ועז משולשת ואיל משולש ותור וגוזל\" (בראשית ט\"ו:ט'). \"משולשת\" פירושו בת שלוש שנים - לא שלוש מכל מין. בנוסף, היו גם תור וגוזל.", "source": "04 brit bein habetarim", "type": "story"}, {"q": "2. ⭐⭐⭐ אברם בתר את כל בעלי החיים שה' ציווה עליו. נכון או לא נכון?", "a": "**לא נכון.** אברם בתר רק את הבהמות (עגלה, עז, איל), אך \"את הציפור לא בתר\" (בראשית ט\"ו:י') - את התור והגוזל לא בתר.", "source": "04 brit bein habetarim", "type": "story"}, {"q": "3. ⭐⭐⭐ ה' הבטיח לאברם שזרעו ישוב לארץ בדור השלישי. נכון או לא נכון?", "a": "**לא נכון.** ה' אמר \"ודור **רביעי** ישובו הנה\" (בראשית ט\"ו:ט\"ז), לא דור שלישי.", "source": "04 brit bein habetarim", "type": "story"}, {"q": "2. ⭐⭐⭐ \"אֲדֹנָי יֱהוִה בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה\"", "a": "**מי אמר:** אברם\n**למי:** ה'\n**הקשר:** אברם שואל את ה' כיצד יידע שיירש את הארץ, וה' מצווה אותו להכין את בעלי החיים לברית בין הבתרים (בראשית ט\"ו:ח')", "source": "04 brit bein habetarim", "type": "story"}, {"q": "1. ⭐⭐⭐ מוזכר כיורש פוטנציאלי, מוצאו מדמשק, בן משק ביתו של אדם ללא ילדים", "a": "**הדמות:** אליעזר הדמשקי\n**ספר:** בראשית\n**הקשר:** אברם מציין בפני ה' שבהיעדר בן, \"בן משק ביתי הוא דמשק אליעזר\" יירש אותו (בראשית ט\"ו:ב')", "source": "04 brit bein habetarim", "type": "story"}, {"q": "19. ⭐⭐⭐ מנה את עשרת העמים שארצם הובטחה לזרע אברם.", "a": "הקיני, הקניזי, הקדמוני, החיתי, הפריזי, הרפאים, האמורי, הכנעני, הגרגשי והיבוסי (בראשית ט\"ו:י\"ט-כ\"א)", "source": "04 brit bein habetarim", "type": "story"}, {"q": "20. ⭐⭐ מהם שני הנהרות שהוזכרו כגבולות הארץ המובטחת?", "a": "נהר מצרים ונהר פרת - \"מנהר מצרים עד הנהר הגדול נהר פרת\" (בראשית ט\"ו:י\"ח)", "source": "04 brit bein habetarim", "type": "story"}, {"q": "21. ⭐⭐⭐ מה הסיבה שנתן ה' לעיכוב ירושת הארץ?", "a": "\"כי לא שלם עוון האמורי עד הנה\" (בראשית ט\"ו:ט\"ז) - עוון האמורי עדיין לא הגיע לשיאו", "source": "04 brit bein habetarim", "type": "story"}, {"q": "3. ⭐⭐⭐ \"הַבֶּט נָא הַשָּׁמַיְמָה וּסְפֹר הַכּוֹכָבִים אִם תּוּכַל לִסְפֹּר אֹתָם... כֹּה יִהְיֶה זַרְעֶךָ\"", "a": "**מי אמר:** ה'\n**למי:** אברם\n**הקשר:** ה' מוציא את אברם החוצה ומראה לו את הכוכבים כמשל לריבוי זרעו (בראשית ט\"ו:ה')", "source": "04 brit bein habetarim", "type": "story"}, {"q": "1. ⭐⭐ \"אַל תִּירָא אַבְרָם אָנֹכִי _____ לָךְ שְׂכָרְךָ הַרְבֵּה מְאֹד\"", "a": "**מילה חסרה:** מָגֵן\n**מי אמר:** ה'\n**הקשר:** פתיחת ברית בין הבתרים, ה' בא אל אברם במחזה (בראשית ט\"ו:א')", "source": "04 brit bein habetarim", "type": "story"}, {"q": "2. ⭐⭐⭐ \"גֵר יִהְיֶה זַרְעֲךָ בְּאֶרֶץ לֹא לָהֶם וַעֲבָדוּם וְעִנּוּ אֹתָם אַרְבַּע _____ שָׁנָה\"", "a": "**מילה חסרה:** מֵאוֹת\n**מי אמר:** ה'\n**הקשר:** נבואת השעבוד - ה' מנבא לאברם שזרעו יהיה בגלות 400 שנה (בראשית ט\"ו:י\"ג)", "source": "04 brit bein habetarim", "type": "story"}, {"q": "3. ⭐⭐⭐ \"וְהֶאֱמִן בַּיהוָה וַיַּחְשְׁבֶהָ לּוֹ _____\"", "a": "**מילה חסרה:** צְדָקָה\n**מי אמר:** הכתוב (מספר)\n**הקשר:** אמונת אברם בהבטחת ה' נחשבה לו לזכות (בראשית ט\"ו:ו')", "source": "04 brit bein habetarim", "type": "story"}, {"q": "4. ⭐⭐ \"לְזַרְעֲךָ נָתַתִּי אֶת הָאָרֶץ הַזֹּאת מִנְּהַר מִצְרַיִם עַד הַנָּהָר הַגָּדֹל נְהַר _____\"", "a": "**מילה חסרה:** פְּרָת\n**מי אמר:** ה'\n**הקשר:** כריתת הברית וקביעת גבולות הארץ המובטחת (בראשית ט\"ו:י\"ח)", "source": "04 brit bein habetarim", "type": "story"}, {"q": "1. מה היה מוצאה של הגר?", "a": "שפחה מצרית של שרי", "source": "05 hagar and yishmael", "type": "story"}, {"q": "2. מדוע הציעה שרי לאברם לבוא אל הגר?", "a": "כי שרי לא ילדה לאברם, ואמרה \"אולי אבנה ממנה\"", "source": "05 hagar and yishmael", "type": "story"}, {"q": "3. לאחר כמה שנים בכנען ניתנה הגר לאברם?", "a": "מקץ עשר שנים לישיבת אברם בארץ כנען", "source": "05 hagar and yishmael", "type": "story"}, {"q": "4. מה עשתה הגר כשהרתה?", "a": "זלזלה בגבירתה שרי (\"ותקל גבירתה בעיניה\")", "source": "05 hagar and yishmael", "type": "story"}, {"q": "5. מה אמרה שרי לאברם בכעסה?", "a": "\"חמסי עליך... ישפוט ה' ביני ובינך\"", "source": "05 hagar and yishmael", "type": "story"}, {"q": "6. מה עשה אברם כשנודע לו על הסכסוך?", "a": "מסר את הגר לידי שרי: \"הנה שפחתך בידך, עשי לה הטוב בעיניך\"", "source": "05 hagar and yishmael", "type": "story"}, {"q": "7. מה עשתה שרי להגר ומה היתה תגובת הגר?", "a": "שרי עינתה אותה, והגר ברחה מפניה", "source": "05 hagar and yishmael", "type": "story"}, {"q": "8. היכן מצא מלאך ה' את הגר?", "a": "על עין המים במדבר, על העין בדרך שור", "source": "05 hagar and yishmael", "type": "story"}, {"q": "9. מה ציווה המלאך את הגר לעשות?", "a": "לשוב אל גבירתה שרי ולהתענות תחת ידיה", "source": "05 hagar and yishmael", "type": "story"}, {"q": "10. מה הבטיח המלאך להגר על זרעה?", "a": "\"הרבה ארבה את זרעך ולא יספר מרוב\"", "source": "05 hagar and yishmael", "type": "story"}, {"q": "11. איזה שם אמר המלאך להגר לקרוא לבנה ומדוע?", "a": "ישמעאל - \"כי שמע ה' אל עניך\"", "source": "05 hagar and yishmael", "type": "story"}, {"q": "12. כיצד תואר ישמעאל בנבואת המלאך?", "a": "\"פרא אדם, ידו בכל ויד כל בו, ועל פני כל אחיו ישכון\"", "source": "05 hagar and yishmael", "type": "story"}, {"q": "13. איזה שם קראה הגר לה'?", "a": "\"אל ראי\" (\"אתה אל רואי\")", "source": "05 hagar and yishmael", "type": "story"}, {"q": "14. מה שם הבאר שנקראה על שם המאורע, ואיפה היא?", "a": "באר לחי ראי, בין קדש ובין ברד", "source": "05 hagar and yishmael", "type": "story"}, {"q": "15. בן כמה היה אברם כשנולד ישמעאל?", "a": "בן שמונים שנה ושש שנים (86)", "source": "05 hagar and yishmael", "type": "story"}, {"q": "16. מי קרא את שמו של ישמעאל?", "a": "אברם קרא שם בנו ישמעאל", "source": "05 hagar and yishmael", "type": "story"}, {"q": "1. ⭐⭐ \"בֹּא נָא אֶל שִׁפְחָתִי\"", "a": "**מי אמר:** שרי\n**למי:** אברם\n**הקשר:** שרי מציעה לאברם לבוא אל הגר כדי שייבנו ממנה (בראשית ט\"ז:ב')", "source": "05 hagar and yishmael", "type": "story"}, {"q": "2. ⭐⭐ \"מֵאֵין בָּאת וְאָנָה תֵלֵכִי\"", "a": "**מי אמר:** מלאך ה'\n**למי:** הגר\n**הקשר:** מלאך ה' פוגש את הגר הבורחת ליד עין המים במדבר (בראשית ט\"ז:ח')", "source": "05 hagar and yishmael", "type": "story"}, {"q": "1. ⭐ שפחה מצרית, ברחה מפני גבירתה, מלאך דיבר אליה ליד באר, בנה נולד לפני בן הגבירה", "a": "**הדמות:** הגר\n**ספר:** בראשית\n**הקשר:** הגר היתה שפחת שרי, ברחה מפניה כשעינתה אותה, מלאך ה' מצא אותה ליד באר לחי רואי ובישר לה על ישמעאל (פרקים ט\"ז, כ\"א)", "source": "05 hagar and yishmael", "type": "story"}, {"q": "2. ⭐⭐ נולד לאב זקן ולשפחה, נעשה קשת במדבר, גורש עם אמו, ה' הבטיח שיהיה לגוי גדול", "a": "**הדמות:** ישמעאל\n**ספר:** בראשית\n**הקשר:** ישמעאל נולד לאברהם בן 86 ולהגר, גורש עם אמו לפי דרישת שרה, ה' הבטיח שיהיה לגוי גדול, וישב במדבר פארן (פרקים ט\"ז, כ\"א)", "source": "05 hagar and yishmael", "type": "story"}, {"q": "1. ⭐⭐ אברהם היה בן 100 כשנולד ישמעאל. נכון או לא נכון?", "a": "**לא נכון.** אברם היה בן 86 כשנולד ישמעאל (בראשית ט\"ז:ט\"ז). הוא היה בן 100 כשנולד יצחק (בראשית כ\"א:ה').", "source": "05 hagar and yishmael", "type": "story"}, {"q": "2. ⭐⭐⭐ מלאך ה' מצא את הגר ליד באר לחי ראי. נכון או לא נכון?", "a": "**לא נכון (בדיוק).** המלאך מצא את הגר \"על עין המים במדבר, על העין **בדרך שור**\" (בראשית ט\"ז:ז'). השם \"באר לחי ראי\" ניתן למקום רק **אחרי** המפגש: \"על כן קרא לבאר באר לחי ראי\" (ט\"ז:י\"ד).", "source": "05 hagar and yishmael", "type": "story"}, {"q": "3. ⭐⭐⭐ הגר היא שקראה שם בנה ישמעאל. נכון או לא נכון?", "a": "**לא נכון.** למרות שהמלאך אמר **להגר** \"וקראת שמו ישמעאל\", בפועל \"ויקרא **אברם** שם בנו אשר ילדה הגר ישמעאל\" (בראשית ט\"ז:ט\"ו) - אברם הוא שקרא את השם.", "source": "05 hagar and yishmael", "type": "story"}, {"q": "3. ⭐⭐⭐ \"חֲמָסִי עָלֶיךָ... יִשְׁפֹּט יְהוָה בֵּינִי וּבֵינֶיךָ\"", "a": "**מי אמר:** שרי\n**למי:** אברם\n**הקשר:** שרי כועסת על אברם לאחר שהגר הרתה וזלזלה בה (בראשית ט\"ז:ה')", "source": "05 hagar and yishmael", "type": "story"}, {"q": "17. ⭐⭐⭐ לאחר כמה שנות ישיבה בכנען ניתנה הגר לאברם, ומה היה גילו באותו זמן?", "a": "מקץ עשר שנים לישיבת אברם בכנען (בראשית ט\"ז:ג'). אברם הגיע בגיל 75, כך שהגר ניתנה כשהיה בן 85.", "source": "05 hagar and yishmael", "type": "story"}, {"q": "18. ⭐⭐⭐ היכן בדיוק נמצאת באר לחי ראי?", "a": "\"בין קדש ובין ברד\" (בראשית ט\"ז:י\"ד)", "source": "05 hagar and yishmael", "type": "story"}, {"q": "19. ⭐⭐ מה המשמעות של השם ישמעאל?", "a": "\"כי שמע ה' אל עניך\" - ישמע + אל = אלוהים שמע (בראשית ט\"ז:י\"א)", "source": "05 hagar and yishmael", "type": "story"}, {"q": "3. ⭐⭐⭐ בעלה מסר אותה לידי גבירתה, ברחה למדבר בדרך שור, קראה לה' שם חדש - \"אל ראי\"", "a": "**הדמות:** הגר\n**ספר:** בראשית\n**הקשר:** אברם מסר את הגר לשרי שעינתה אותה, הגר ברחה בדרך שור, ולאחר המפגש עם המלאך קראה \"אתה אל ראי\" (פרק ט\"ז)", "source": "05 hagar and yishmael", "type": "story"}, {"q": "1. ⭐⭐ \"וְקָרָאת שְׁמוֹ יִשְׁמָעֵאל כִּי שָׁמַע יְהוָה אֶל _____\"", "a": "**מילה חסרה:** עָנְיֵךְ\n**מי אמר:** מלאך ה'\n**הקשר:** המלאך מבשר להגר על לידת בנה ומשמעות שמו (בראשית ט\"ז:י\"א)", "source": "05 hagar and yishmael", "type": "story"}, {"q": "2. ⭐⭐⭐ \"וְהוּא יִהְיֶה פֶּרֶא אָדָם יָדוֹ בַכֹּל וְיַד כֹּל בּוֹ וְעַל פְּנֵי כָל _____ יִשְׁכֹּן\"", "a": "**מילה חסרה:** אֶחָיו\n**מי אמר:** מלאך ה'\n**הקשר:** תיאור אופיו של ישמעאל בנבואת המלאך להגר (בראשית ט\"ז:י\"ב)", "source": "05 hagar and yishmael", "type": "story"}, {"q": "3. ⭐⭐ \"הִנֵּה נָא עֲצָרַנִי יְהוָה מִלֶּדֶת בֹּא נָא אֶל שִׁפְחָתִי אוּלַי _____ מִמֶּנָּה\"", "a": "**מילה חסרה:** אִבָּנֶה\n**מי אמר:** שרי\n**הקשר:** שרי מציעה לאברם לקחת את הגר כדי שתיבנה ממנה (בראשית ט\"ז:ב')", "source": "05 hagar and yishmael", "type": "story"}, {"q": "4. ⭐⭐⭐ \"הִנֵּה שִׁפְחָתֵךְ בְּיָדֵךְ עֲשִׂי לָהּ _____ בְּעֵינָיִךְ\"", "a": "**מילה חסרה:** הַטּוֹב\n**מי אמר:** אברם\n**הקשר:** אברם מוסר את הגר לידי שרי (בראשית ט\"ז:ו')", "source": "05 hagar and yishmael", "type": "story"}, {"q": "1. בן כמה היה אברם כשה' התגלה אליו בפרק זה?", "a": "בן 99 שנים", "source": "06 brit milah", "type": "story"}, {"q": "2. באיזה שם הציג ה' את עצמו בהתגלות?", "a": "\"אני אל שדי\"", "source": "06 brit milah", "type": "story"}, {"q": "3. מה ציווה ה' את אברם בתחילת ההתגלות?", "a": "\"התהלך לפני והיה תמים\"", "source": "06 brit milah", "type": "story"}, {"q": "4. מה השם החדש שקיבל אברם ומה משמעותו?", "a": "אברהם - \"כי אב המון גויים נתתיך\"", "source": "06 brit milah", "type": "story"}, {"q": "5. מה השם החדש שקיבלה שרי?", "a": "שרה", "source": "06 brit milah", "type": "story"}, {"q": "6. מהו אות הברית שה' קבע?", "a": "מילה בבשר הערלה (ברית מילה)", "source": "06 brit milah", "type": "story"}, {"q": "7. בן כמה ימים יש למול תינוק?", "a": "ביום השמיני", "source": "06 brit milah", "type": "story"}, {"q": "8. מה העונש על מי שלא נימול?", "a": "\"ונכרתה הנפש ההיא מעמיה\"", "source": "06 brit milah", "type": "story"}, {"q": "9. מה הבטיח ה' לאברהם לגבי ארץ כנען?", "a": "שתהיה לו ולזרעו לאחוזת עולם", "source": "06 brit milah", "type": "story"}, {"q": "10. מדוע צחק אברהם כששמע על הבטחת הבן?", "a": "כי תמה: \"הלבן מאה שנה ייולד, ואם שרה הבת תשעים שנה תלד?\"", "source": "06 brit milah", "type": "story"}, {"q": "11. מה ביקש אברהם מה' לגבי ישמעאל?", "a": "\"לו ישמעאל יחיה לפניך\"", "source": "06 brit milah", "type": "story"}, {"q": "12. מה ענה ה' לגבי הברית - עם מי תהיה?", "a": "הברית תהיה עם יצחק, הבן שייוולד משרה", "source": "06 brit milah", "type": "story"}, {"q": "13. מה הובטח לישמעאל למרות שהברית לא תהיה עמו?", "a": "שיוליד 12 נשיאים ויהיה לגוי גדול", "source": "06 brit milah", "type": "story"}, {"q": "14. בן כמה היה ישמעאל כשנימול?", "a": "בן 13", "source": "06 brit milah", "type": "story"}, {"q": "15. בן כמה תהיה שרה כשתלד לפי דברי ה'?", "a": "בת תשעים שנה", "source": "06 brit milah", "type": "story"}, {"q": "16. מה הצטווה אברהם לעשות לכל זכר בביתו?", "a": "למול אותם - כל זכר בן שמונת ימים", "source": "06 brit milah", "type": "story"}, {"q": "1. ⭐⭐⭐ \"לוּ יִשְׁמָעֵאל יִחְיֶה לְפָנֶיךָ\"", "a": "**מי אמר:** אברהם\n**למי:** ה'\n**הקשר:** תגובת אברהם לבשורה על לידת יצחק – מבקש שישמעאל יחיה (בראשית י\"ז:י\"ח)", "source": "06 brit milah", "type": "story"}, {"q": "2. ⭐⭐⭐ \"הִתְהַלֵּךְ לְפָנַי וֶהְיֵה תָמִים\"", "a": "**מי אמר:** ה' (בשם \"אל שדי\")\n**למי:** אברם (בגיל 99)\n**הקשר:** פתיחת ברית המילה, ה' מתגלה לאברם ומצווה אותו (בראשית י\"ז:א')", "source": "06 brit milah", "type": "story"}, {"q": "1. ⭐⭐⭐ שמו שונה על ידי ה', נימול בגיל 99, צחק כששמע שיהיה לו בן נוסף, ביקש מה' שבנו הראשון יחיה", "a": "**הדמות:** אברהם (אברם)\n**ספר:** בראשית\n**הקשר:** אברם שונה לאברהם, נימול בן 99, צחק ואמר \"הלבן מאה שנה ייולד\", וביקש \"לו ישמעאל יחיה לפניך\" (פרק י\"ז)", "source": "06 brit milah", "type": "story"}, {"q": "1. ⭐⭐⭐ אברהם נימול בגיל 100 וישמעאל נימול בגיל 12. נכון או לא נכון?", "a": "**לא נכון.** אברהם נימול בגיל **99** (לא 100): \"ואברהם בן תשעים ותשע שנה בהימולו\" (י\"ז:כ\"ד). וישמעאל נימול בגיל **13** (לא 12): \"וישמעאל בנו בן שלוש עשרה שנה בהימולו\" (י\"ז:כ\"ה).", "source": "06 brit milah", "type": "story"}, {"q": "2. ⭐⭐⭐ ה' הבטיח שישמעאל יוליד עשרה נשיאים. נכון או לא נכון?", "a": "**לא נכון.** ה' הבטיח שישמעאל יוליד **שנים עשר** נשיאים (לא עשרה): \"שנים עשר נשיאים יוליד ונתתיו לגוי גדול\" (בראשית י\"ז:כ').", "source": "06 brit milah", "type": "story"}, {"q": "3. ⭐⭐⭐ שם \"אברהם\" ניתן לאברם לפני ברית המילה. נכון או לא נכון?", "a": "**לא נכון (בדיוק).** שינוי השם מאברם לאברהם קרה באותו מעמד של ברית המילה, כחלק מהברית: \"ולא יקרא עוד את שמך אברם והיה שמך אברהם\" (י\"ז:ה') - ומיד אחר כך ציווי המילה (י\"ז:י').", "source": "06 brit milah", "type": "story"}, {"q": "17. ⭐⭐⭐ מי מלבד ישמעאל ואברהם נימולו באותו יום?", "a": "כל אנשי ביתו - ילידי בית ומקנת כסף מאת בן נכר: \"וכל אנשי ביתו יליד בית ומקנת כסף מאת בן נכר נמולו אתו\" (בראשית י\"ז:כ\"ז)", "source": "06 brit milah", "type": "story"}, {"q": "18. ⭐⭐ מתי הבטיח ה' שיצחק ייוולד?", "a": "\"למועד הזה בשנה האחרת\" - בשנה הבאה (בראשית י\"ז:כ\"א)", "source": "06 brit milah", "type": "story"}, {"q": "19. ⭐⭐⭐ מה היה ההבדל בין גיל מילת אברהם לגיל מילת ישמעאל?", "a": "אברהם נימול בגיל 99, ישמעאל בגיל 13 - הפרש של 86 שנה. שניהם נימולו \"בעצם היום הזה\" (בראשית י\"ז:כ\"ד-כ\"ו)", "source": "06 brit milah", "type": "story"}, {"q": "1. ⭐⭐ \"אֲנִי אֵל שַׁדַּי הִתְהַלֵּךְ לְפָנַי וֶהְיֵה _____\"", "a": "**מילה חסרה:** תָמִים\n**מי אמר:** ה'\n**הקשר:** פתיחת ברית המילה, ה' מתגלה לאברם בן 99 (בראשית י\"ז:א')", "source": "06 brit milah", "type": "story"}, {"q": "2. ⭐⭐⭐ \"וְלֹא יִקָּרֵא עוֹד אֶת שִׁמְךָ אַבְרָם וְהָיָה שִׁמְךָ _____ כִּי אַב הֲמוֹן גּוֹיִם נְתַתִּיךָ\"", "a": "**מילה חסרה:** אַבְרָהָם\n**מי אמר:** ה'\n**הקשר:** שינוי שם אברם לאברהם כחלק מהברית (בראשית י\"ז:ה')", "source": "06 brit milah", "type": "story"}, {"q": "3. ⭐⭐⭐ \"הַלְּבֶן _____ שָׁנָה יִוָּלֵד וְאִם שָׂרָה הֲבַת תִּשְׁעִים שָׁנָה תֵּלֵד\"", "a": "**מילה חסרה:** מֵאָה\n**מי אמר:** אברהם (בלבו)\n**הקשר:** אברהם צוחק כשנודע לו שייוולד בן משרה (בראשית י\"ז:י\"ז)", "source": "06 brit milah", "type": "story"}, {"q": "4. ⭐⭐ \"וְקָרָאתָ אֶת שְׁמוֹ _____ וַהֲקִמֹתִי אֶת בְּרִיתִי אִתּוֹ לִבְרִית עוֹלָם\"", "a": "**מילה חסרה:** יִצְחָק\n**מי אמר:** ה'\n**הקשר:** ה' מודיע לאברהם ששרה תלד בן ושמו יצחק (בראשית י\"ז:י\"ט)", "source": "06 brit milah", "type": "story"}, {"q": "1. היכן נראה ה' אל אברהם בתחילת הפרק?", "a": "באלוני ממרא", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "2. מה עשה אברהם כשראה את שלושת האנשים?", "a": "רץ לקראתם, השתחווה ואמר \"אל נא תעבור מעל עבדך\"", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "3. אילו מאכלים הגיש אברהם לאורחים?", "a": "מים לרחיצת רגליים, עוגות מסולת, חמאה וחלב, ובן בקר רך וטוב", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "4. כמה אנשים/מלאכים ביקרו את אברהם?", "a": "שלושה", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "5. מה שאלו האורחים את אברהם?", "a": "\"איה שרה אשתך\" - והוא ענה \"הנה באוהל\"", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "6. מה היתה הבשורה שנמסרה לאברהם?", "a": "\"שוב אשוב אליך כעת חיה והנה בן לשרה אשתך\"", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "7. היכן היתה שרה כששמעה את הבשורה?", "a": "בפתח האוהל", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "8. מדוע צחקה שרה?", "a": "כי אמרה \"אחרי בלותי היתה לי עדנה ואדוני זקן\"", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "9. מה אמר ה' כשנודע לו שצחקה שרה?", "a": "\"למה זה צחקה שרה... היפלא מה' דבר\"", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "10. מה עשתה שרה כשה' שאל על הצחוק?", "a": "הכחישה מיראה ואמרה \"לא צחקתי\", וה' אמר \"לא כי צחקת\"", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "11. מדוע החליט ה' לגלות לאברהם את הכוונה לגבי סדום?", "a": "\"המכסה אני מאברהם אשר אני עושה... כי ידעתיו למען אשר יצווה את בניו\"", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "12. מה אמר אברהם כשפתח את הוויכוח עם ה' על סדום?", "a": "\"האף תספה צדיק עם רשע?\"", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "13. ממה התחיל אברהם את המשא ומתן על מספר הצדיקים ועד כמה הגיע?", "a": "התחיל מ-50 צדיקים, הוריד ל-45, 40, 30, 20, ולבסוף 10", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "14. מהו הטיעון המפורסם שאמר אברהם לה' על משפט סדום?", "a": "\"השופט כל הארץ לא יעשה משפט?\"", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "15. מה הסכים ה' בנוגע לעשרה צדיקים?", "a": "\"לא אשחית בעבור העשרה\"", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "16. כמה מהאנשים הלכו לכיוון סדום?", "a": "שני האנשים הלכו לסדום, ואברהם עמד לפני ה'", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "1. ⭐ \"הֲיִפָּלֵא מֵה' דָּבָר\"", "a": "**מי אמר:** ה'\n**למי:** אברהם\n**הקשר:** תגובה לצחוקה של שרה כששמעה שתלד בן (בראשית י\"ח:י\"ד)", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "2. ⭐⭐ \"הַאַף תִּסְפֶּה צַדִּיק עִם רָשָׁע\"", "a": "**מי אמר:** אברהם\n**למי:** ה'\n**הקשר:** אברהם מתווכח עם ה' על הפיכת סדום (בראשית י\"ח:כ\"ג)", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "1. ⭐ היתה עקרה שנים רבות, צחקה כששמעה בשורה, שמה שונה על ידי ה', דרשה לגרש שפחה ובנה", "a": "**הדמות:** שרה\n**ספר:** בראשית\n**הקשר:** שרה היתה עקרה עד גיל 90, צחקה כששמעה את בשורת המלאכים, שמה שונה משרי לשרה בפרק י\"ז, ודרשה מאברהם לגרש את הגר וישמעאל (פרקים ט\"ז-כ\"א)", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "1. ⭐⭐ שרה צחקה כששמעה שתלד בן, ולכן נקרא שמו \"יצחק\". נכון או לא נכון?", "a": "**נכון, אבל חלקי.** שרה אכן צחקה (בראשית י\"ח:י\"ב), אך גם אברהם צחק קודם לכן (בראשית י\"ז:י\"ז). ה' הוא שקבע את השם \"יצחק\" (בראשית י\"ז:י\"ט) - עוד לפני שנאמר לשרה.", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "2. ⭐⭐⭐ אברהם הגיש לאורחים לחם, בשר וחלב. נכון או לא נכון?", "a": "**לא מדויק.** אברהם הגיש **חמאה** וחלב ובן הבקר (י\"ח:ח'), ולפני כן ביקש משרה להכין עוגות מסולת (י\"ח:ו'). לא נאמר \"לחם\" סתם, אלא \"עוגות\" מ\"שלוש סאים קמח סולת\".", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "3. ⭐⭐⭐ אברהם ירד מ-50 צדיקים ל-10 בהורדות שוות של עשר. נכון או לא נכון?", "a": "**לא נכון.** ההורדות לא היו שוות: 50 → 45 (הורדה של 5), 45 → 40 (הורדה של 5), 40 → 30 (הורדה של 10), 30 → 20 (הורדה של 10), 20 → 10 (הורדה של 10). ההורדה הראשונה היתה רק ב-5 (\"אולי יחסרון חמישים הצדיקים חמישה\").", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "3. ⭐⭐⭐ \"אַחֲרֵי בְלֹתִי הָיְתָה לִּי עֶדְנָה וַאדֹנִי זָקֵן\"", "a": "**מי אמר:** שרה (בקרבה/בלבה)\n**למי:** לעצמה\n**הקשר:** שרה צוחקת בקרבה כששומעת את בשורת הלידה מפי האורחים (בראשית י\"ח:י\"ב)", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "2. ⭐⭐⭐ באו בערב, אכלו בביתו של מארח, הכו אנשים בסנוורים, הוציאו משפחה מעיר שנחרבה", "a": "**הדמות:** שני המלאכים (שביקרו את אברהם ואחר כך הגיעו לסדום)\n**ספר:** בראשית\n**הקשר:** שני המלאכים מגיעים לסדום בערב, לוט מארח אותם, הם מכים את אנשי סדום בסנוורים ומוציאים את לוט ומשפחתו (פרקים י\"ח-י\"ט)", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "17. ⭐⭐⭐ כמה סאים קמח סולת ביקש אברהם משרה להכין?", "a": "שלוש סאים קמח סולת - \"מהרי שלוש סאים קמח סולת לושי ועשי עוגות\" (בראשית י\"ח:ו')", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "18. ⭐⭐ באיזה מספר התחיל אברהם את המשא ומתן עם ה' על צדיקי סדום?", "a": "חמישים צדיקים - \"אולי יש חמישים צדיקים בתוך העיר\" (בראשית י\"ח:כ\"ד)", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "19. ⭐⭐⭐ מהו ההבדל בין ההורדה הראשונה לשאר ההורדות במשא ומתן עם ה'?", "a": "ההורדה הראשונה היתה רק ב-5 (מ-50 ל-45), בעוד שההורדות הבאות היו ב-5 שוב (ל-40), ואז ב-10 (ל-30, ל-20, ל-10)", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "4. ⭐⭐⭐ \"הֲשֹׁפֵט כׇּל הָאָרֶץ לֹא יַעֲשֶׂה מִשְׁפָּט\"", "a": "**מי אמר:** אברהם\n**למי:** ה'\n**הקשר:** אברהם טוען כנגד ה' בוויכוח על הפיכת סדום (בראשית י\"ח:כ\"ה)", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "1. ⭐⭐ \"אַחֲרֵי בְלֹתִי הָיְתָה לִּי _____ וַאדֹנִי זָקֵן\"", "a": "**מילה חסרה:** עֶדְנָה\n**מי אמר:** שרה (בקרבה)\n**הקשר:** שרה צוחקת בלבה כששומעת שתלד בן (בראשית י\"ח:י\"ב)", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "2. ⭐⭐ \"הֲיִפָּלֵא מֵיְהוָה _____\"", "a": "**מילה חסרה:** דָּבָר\n**מי אמר:** ה'\n**הקשר:** תגובת ה' לצחוקה של שרה (בראשית י\"ח:י\"ד)", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "3. ⭐⭐⭐ \"הִנֵּה נָא הוֹאַלְתִּי לְדַבֵּר אֶל אֲדֹנָי וְאָנֹכִי _____ וָאֵפֶר\"", "a": "**מילה חסרה:** עָפָר\n**מי אמר:** אברהם\n**הקשר:** אברהם מתנצל על העזתו לדבר עם ה' במשא ומתן על סדום (בראשית י\"ח:כ\"ז)", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "4. ⭐⭐⭐ \"זַעֲקַת סְדֹם וַעֲמֹרָה כִּי רָבָּה וְחַטָּאתָם כִּי _____ מְאֹד\"", "a": "**מילה חסרה:** כָבְדָה\n**מי אמר:** ה'\n**הקשר:** ה' מגלה לאברהם את חטא סדום ועמורה (בראשית י\"ח:כ')", "source": "07 birth of yitzchak and sodom", "type": "story"}, {"q": "1. כמה מלאכים הגיעו לסדום?", "a": "שני מלאכים", "source": "08 sodom and amorah", "type": "story"}, {"q": "2. היכן ישב לוט כשהמלאכים הגיעו לסדום?", "a": "בשער סדום", "source": "08 sodom and amorah", "type": "story"}, {"q": "3. מה הכין לוט למלאכים?", "a": "משתה ואפה מצות", "source": "08 sodom and amorah", "type": "story"}, {"q": "4. מה דרשו אנשי סדום מלוט?", "a": "\"הוציאם אלינו\" - רצו לפגוע באורחים", "source": "08 sodom and amorah", "type": "story"}, {"q": "5. במה הוכו אנשי סדום על ידי המלאכים?", "a": "בסנוורים (עיוורון)", "source": "08 sodom and amorah", "type": "story"}, {"q": "6. כיצד הגיבו חתני לוט לאזהרה לברוח?", "a": "חשבו שלוט מצחק ולא האמינו לו", "source": "08 sodom and amorah", "type": "story"}, {"q": "7. מה ציוו המלאכים את לוט לקחת איתו?", "a": "את אשתו ואת שתי בנותיו הנמצאות", "source": "08 sodom and amorah", "type": "story"}, {"q": "8. מדוע אחזו המלאכים ביד לוט והוציאוהו?", "a": "כי לוט התמהמה, \"בחמלת ה' עליו\"", "source": "08 sodom and amorah", "type": "story"}, {"q": "9. מה הזהירו המלאכים את לוט שלא לעשות?", "a": "\"אל תביט אחריך ואל תעמוד בכל הככר, ההרה הימלט פן תיספה\"", "source": "08 sodom and amorah", "type": "story"}, {"q": "10. לאן ביקש לוט לברוח במקום ההרה?", "a": "לצוער - עיר קטנה", "source": "08 sodom and amorah", "type": "story"}, {"q": "11. במה הושמדו סדום ועמורה?", "a": "ה' המטיר גפרית ואש מן השמים", "source": "08 sodom and amorah", "type": "story"}, {"q": "12. מה קרה לאשת לוט ומדוע?", "a": "הביטה מאחוריו (לאחור) ונהפכה לנציב מלח", "source": "08 sodom and amorah", "type": "story"}, {"q": "13. מה ראה אברהם כשהשקיף למחרת על פני סדום ועמורה?", "a": "\"עלה קיטור הארץ כקיטור הכבשן\"", "source": "08 sodom and amorah", "type": "story"}, {"q": "14. כמה בנות של לוט ניצלו?", "a": "שתי בנות", "source": "08 sodom and amorah", "type": "story"}, {"q": "15. מה הפך חורבן סדום מלבד העיר עצמה?", "a": "את כל הערים, את כל הככר, את כל יושבי הערים ואת צמח האדמה", "source": "08 sodom and amorah", "type": "story"}, {"q": "16. מדוע ניצל לוט מההפיכה?", "a": "\"ויזכור אלוהים את אברהם וישלח את לוט מתוך ההפיכה\"", "source": "08 sodom and amorah", "type": "story"}, {"q": "17. מה קרה ללוט ובנותיו אחרי שברחו מסדום?", "a": "ישבו במערה. בנותיו השקו אותו יין ונולדו מואב (אבי העמונים) ובן-עמי (אבי המואבים)", "source": "08 sodom and amorah", "type": "story"}, {"q": "1. ⭐⭐⭐ אחיה רדף אחרי מלכים, גר בצוער ואחר כך במערה, בנותיו השקוהו יין", "a": "**הדמות:** לוט (אחרי חורבן סדום)\n**ספר:** בראשית\n**הקשר:** אברהם אחיו/קרובו רדף אחרי המלכים להצילו, לוט ברח לצוער ואחר כך למערה, ובנותיו השקוהו יין כי חשבו שנחרב העולם (פרקים י\"ד, י\"ט)", "source": "08 sodom and amorah", "type": "story"}, {"q": "1. ⭐⭐⭐ \"הִמָּלֵט עַל נַפְשְׁךָ אַל תַּבִּיט אַחֲרֶיךָ וְאַל תַּעֲמֹד בְּכָל הַכִּכָּר\"", "a": "**מי אמר:** המלאכים\n**למי:** לוט\n**הקשר:** המלאכים מוציאים את לוט מסדום ומזהירים אותו שלא להביט לאחור ולא לעמוד בכיכר (בראשית י\"ט:י\"ז)", "source": "08 sodom and amorah", "type": "story"}, {"q": "2. ⭐⭐⭐ \"הָאֶחָד בָּא לָגוּר וַיִּשְׁפֹּט שָׁפוֹט\"", "a": "**מי אמר:** אנשי סדום\n**למי:** לוט\n**הקשר:** אנשי סדום כועסים על לוט שמנסה להגן על אורחיו ואומרים שהוא בא כגר ומתנהג כשופט (בראשית י\"ט:ט')", "source": "08 sodom and amorah", "type": "story"}, {"q": "1. ⭐⭐⭐ לוט ניצל בזכות צדקותו שלו. נכון או לא נכון?", "a": "**לא נכון.** הכתוב אומר במפורש \"ויזכור אלוהים את **אברהם** וישלח את לוט מתוך ההפיכה\" (בראשית י\"ט:כ\"ט) - לוט ניצל בזכות אברהם, לא בזכות עצמו.", "source": "08 sodom and amorah", "type": "story"}, {"q": "2. ⭐⭐⭐ הבכירה מבנות לוט ילדה את בן-עמי, אבי בני עמון. נכון או לא נכון?", "a": "**לא נכון.** הבכירה ילדה את **מואב** (אבי מואב), והצעירה ילדה את **בן-עמי** (אבי בני עמון) (בראשית י\"ט:ל\"ז-ל\"ח).", "source": "08 sodom and amorah", "type": "story"}, {"q": "3. ⭐⭐⭐ לוט אפה מצות לאורחיו. נכון או לא נכון?", "a": "**נכון.** \"ויעש להם משתה **ומצות אפה** ויאכלו\" (בראשית י\"ט:ג').", "source": "08 sodom and amorah", "type": "story"}, {"q": "18. ⭐⭐⭐ מה שם העיר הקטנה שלוט ביקש לברוח אליה, ומה היה שמה המקורי?", "a": "צוער - \"על כן קרא שם העיר צוער\" (בראשית י\"ט:כ\"ב). לוט אמר \"הלא מצער היא\" (י\"ט:כ')", "source": "08 sodom and amorah", "type": "story"}, {"q": "19. ⭐⭐⭐ מהם שמות שני הבנים שנולדו לבנות לוט, ומי ילדה את מי?", "a": "הבכירה ילדה את מואב (אבי מואב), והצעירה ילדה את בן-עמי (אבי בני עמון) (בראשית י\"ט:ל\"ז-ל\"ח)", "source": "08 sodom and amorah", "type": "story"}, {"q": "20. ⭐⭐ מדוע ניצל לוט מההפיכה לפי הכתוב?", "a": "\"ויזכור אלוהים את אברהם וישלח את לוט מתוך ההפיכה\" - בזכות אברהם (בראשית י\"ט:כ\"ט)", "source": "08 sodom and amorah", "type": "story"}, {"q": "2. ⭐⭐⭐ הביטה לאחור למרות האזהרה, נהפכה לנציב מלח, בעלה ניצל ממנה", "a": "**הדמות:** אשת לוט\n**ספר:** בראשית\n**הקשר:** המלאכים הזהירו \"אל תביט אחריך\", אך אשת לוט הביטה מאחוריו \"ותהי נציב מלח\" (בראשית י\"ט:י\"ז, כ\"ו)", "source": "08 sodom and amorah", "type": "story"}, {"q": "1. ⭐⭐ \"הִמָּלֵט עַל נַפְשְׁךָ אַל תַּבִּיט _____ וְאַל תַּעֲמֹד בְּכָל הַכִּכָּר\"", "a": "**מילה חסרה:** אַחֲרֶיךָ\n**מי אמר:** המלאכים\n**הקשר:** המלאכים מזהירים את לוט בבריחה מסדום (בראשית י\"ט:י\"ז)", "source": "08 sodom and amorah", "type": "story"}, {"q": "2. ⭐⭐⭐ \"וַיהוָה הִמְטִיר עַל סְדֹם וְעַל עֲמֹרָה _____ וָאֵשׁ מֵאֵת יְהוָה מִן הַשָּׁמָיִם\"", "a": "**מילה חסרה:** גׇּפְרִית\n**מי אמר:** הכתוב (מספר)\n**הקשר:** חורבן סדום ועמורה (בראשית י\"ט:כ\"ד)", "source": "08 sodom and amorah", "type": "story"}, {"q": "3. ⭐⭐ \"וַתַּבֵּט אִשְׁתּוֹ מֵאַחֲרָיו וַתְּהִי _____ מֶלַח\"", "a": "**מילה חסרה:** נְצִיב\n**מי אמר:** הכתוב (מספר)\n**הקשר:** אשת לוט מביטה לאחור ונהפכת לנציב מלח (בראשית י\"ט:כ\"ו)", "source": "08 sodom and amorah", "type": "story"}, {"q": "4. ⭐⭐⭐ \"הָאֶחָד בָּא לָגוּר וַיִּשְׁפֹּט _____ עַתָּה נָרַע לְךָ מֵהֶם\"", "a": "**מילה חסרה:** שָׁפוֹט\n**מי אמר:** אנשי סדום\n**הקשר:** אנשי סדום כועסים על לוט שמנסה להגן על אורחיו (בראשית י\"ט:ט')", "source": "08 sodom and amorah", "type": "story"}, {"q": "1. לאן נסע אברהם בתחילת הפרק?", "a": "לגרר", "source": "09 avraham and avimelech", "type": "story"}, {"q": "2. מה אמר אברהם על שרה בגרר?", "a": "\"אחותי היא\"", "source": "09 avraham and avimelech", "type": "story"}, {"q": "3. מי לקח את שרה?", "a": "אבימלך מלך גרר", "source": "09 avraham and avimelech", "type": "story"}, {"q": "4. כיצד הזהיר ה' את אבימלך?", "a": "בא אליו בחלום הלילה ואמר \"הנך מת על האישה אשר לקחת והיא בעולת בעל\"", "source": "09 avraham and avimelech", "type": "story"}, {"q": "5. כיצד הגן אבימלך על עצמו בפני ה'?", "a": "אמר \"בתם לבבי ובנקיון כפי עשיתי זאת\" - הוא לא ידע שהיא נשואה", "source": "09 avraham and avimelech", "type": "story"}, {"q": "6. האם אבימלך קרב אל שרה?", "a": "לא, וה' אמר \"גם אנכי ידעתי כי בתם לבבך... ואמנע גם אנכי אותך מחטוא לי\"", "source": "09 avraham and avimelech", "type": "story"}, {"q": "7. באיזה תואר כינה ה' את אברהם לראשונה?", "a": "נביא - \"כי נביא הוא ויתפלל בעדך\"", "source": "09 avraham and avimelech", "type": "story"}, {"q": "8. מה שאל אבימלך את אברהם כשקרא לו?", "a": "\"מה עשית לנו ומה חטאתי לך\"", "source": "09 avraham and avimelech", "type": "story"}, {"q": "9. מדוע אמר אברהם ששרה אחותו?", "a": "\"כי אמרתי רק אין יראת אלוהים במקום הזה\" - חשש שיהרגוהו בגלל אשתו", "source": "09 avraham and avimelech", "type": "story"}, {"q": "10. מה היה הקשר המשפחתי האמיתי בין אברהם לשרה?", "a": "\"אחותי בת אבי היא אך לא בת אמי\" - אחות מצד האב", "source": "09 avraham and avimelech", "type": "story"}, {"q": "11. מה נתן אבימלך לאברהם כפיצוי?", "a": "צאן ובקר, עבדים ושפחות, והחזיר את שרה", "source": "09 avraham and avimelech", "type": "story"}, {"q": "12. כמה כסף נתן אבימלך לשרה ומה כינוי הכסף?", "a": "אלף כסף, \"כסות עיניים\"", "source": "09 avraham and avimelech", "type": "story"}, {"q": "13. מה עשה אברהם לאחר שאבימלך החזיר את שרה?", "a": "התפלל לה', וה' ריפא את אבימלך ונשותיו", "source": "09 avraham and avimelech", "type": "story"}, {"q": "14. האם זו הפעם הראשונה שאברהם אומר על שרה \"אחותי היא\"?", "a": "לא, הוא עשה זאת גם בפרק י\"ב כשירד למצרים", "source": "09 avraham and avimelech", "type": "story"}, {"q": "15. מה הבטיח ה' שיקרה אם אבימלך ישיב את שרה?", "a": "אברהם יתפלל בעדו ויחיה, ואם לא ישיב - \"מות תמות\"", "source": "09 avraham and avimelech", "type": "story"}, {"q": "1. ⭐⭐⭐ \"כִּי אָמַרְתִּי רַק אֵין יִרְאַת אֱלֹהִים בַּמָּקוֹם הַזֶּה\"", "a": "**מי אמר:** אברהם\n**למי:** אבימלך מלך גרר\n**הקשר:** אברהם מסביר מדוע אמר על שרה שהיא אחותו (בראשית כ':י\"א)", "source": "09 avraham and avimelech", "type": "story"}, {"q": "2. ⭐⭐⭐ \"הִנְּךָ מֵת עַל הָאִשָּׁה אֲשֶׁר לָקַחְתָּ וְהִיא בְּעֻלַת בָּעַל\"", "a": "**מי אמר:** ה' (אלוהים)\n**למי:** אבימלך מלך גרר\n**הקשר:** ה' מזהיר את אבימלך בחלום הלילה שלקח אישה נשואה - שרה אשת אברהם (בראשית כ':ג')", "source": "09 avraham and avimelech", "type": "story"}, {"q": "1. ⭐⭐⭐ ה' בא אליו בחלום, טען שפעל בתום לב ובנקיון כפיים, פיצה באלף כסף, ה' סגר את רחמות ביתו", "a": "**הדמות:** אבימלך מלך גרר\n**ספר:** בראשית\n**הקשר:** אבימלך לקח את שרה, ה' הזהירו בחלום, הוא טען \"בתם לבבי ובנקיון כפי\", נתן אלף כסף לשרה, וה' עצר כל רחם לבית אבימלך (פרק כ')", "source": "09 avraham and avimelech", "type": "story"}, {"q": "1. ⭐⭐⭐ אבימלך קרב אל שרה לפני שה' הזהירו בחלום. נכון או לא נכון?", "a": "**לא נכון.** הכתוב מדגיש \"ואבימלך **לא קרב** אליה\" (בראשית כ':ד'), וה' אישר: \"גם אנכי ידעתי כי בתם לבבך... ואחשוך גם אנכי **אותך מחטוא לי**, על כן **לא נתתיך לנגוע** אליה\" (כ':ו').", "source": "09 avraham and avimelech", "type": "story"}, {"q": "2. ⭐⭐⭐ אברהם שיקר כשאמר ששרה אחותו. נכון או לא נכון?", "a": "**חצי נכון.** אברהם אמר \"וגם אמנה **אחותי בת אבי היא אך לא בת אמי** ותהי לי לאישה\" (בראשית כ':י\"ב) - שרה היתה אחותו למחצה מצד האב, אך הוא הסתיר שהיא אשתו.", "source": "09 avraham and avimelech", "type": "story"}, {"q": "3. ⭐⭐⭐ ה' עצר את רחם בית אבימלך בגלל שרה. נכון או לא נכון?", "a": "**נכון.** \"כי עצור עצר ה' בעד כל רחם לבית אבימלך על דבר שרה אשת אברהם\" (בראשית כ':י\"ח).", "source": "09 avraham and avimelech", "type": "story"}, {"q": "16. ⭐⭐⭐ בין אילו שני מקומות ישב אברהם כשגר בגרר?", "a": "\"בין קדש ובין שור\" - \"ויסע משם אברהם ארצה הנגב וישב בין קדש ובין שור ויגר בגרר\" (בראשית כ':א')", "source": "09 avraham and avimelech", "type": "story"}, {"q": "17. ⭐⭐ מה הובטח לאבימלך אם ישיב את שרה?", "a": "אברהם יתפלל בעדו ויחיה, ואם לא ישיב \"מות תמות אתה וכל אשר לך\" (בראשית כ':ז')", "source": "09 avraham and avimelech", "type": "story"}, {"q": "18. ⭐⭐⭐ מה הבטיח אבימלך לאברהם לגבי הארץ?", "a": "\"הנה ארצי לפניך, בטוב בעיניך שב\" - הציע לו לגור בכל מקום שירצה (בראשית כ':ט\"ו)", "source": "09 avraham and avimelech", "type": "story"}, {"q": "1. ⭐⭐⭐ \"כִּי אָמַרְתִּי רַק אֵין _____ אֱלֹהִים בַּמָּקוֹם הַזֶּה וַהֲרָגוּנִי עַל דְּבַר אִשְׁתִּי\"", "a": "**מילה חסרה:** יִרְאַת\n**מי אמר:** אברהם\n**הקשר:** אברהם מסביר לאבימלך מדוע אמר שרה אחותו (בראשית כ':י\"א)", "source": "09 avraham and avimelech", "type": "story"}, {"q": "2. ⭐⭐ \"בְּתָם לְבָבִי וּבְנִקְיֹן _____ עָשִׂיתִי זֹאת\"", "a": "**מילה חסרה:** כַּפַּי\n**מי אמר:** אבימלך\n**הקשר:** אבימלך מתגונן בפני ה' בחלום, שפעל בתמימות (בראשית כ':ה')", "source": "09 avraham and avimelech", "type": "story"}, {"q": "3. ⭐⭐⭐ \"הָשֵׁב אֵשֶׁת הָאִישׁ כִּי _____ הוּא וְיִתְפַּלֵּל בַּעַדְךָ וֶחְיֵה\"", "a": "**מילה חסרה:** נָבִיא\n**מי אמר:** ה'\n**הקשר:** ה' מצווה את אבימלך להשיב את שרה ומכנה את אברהם נביא לראשונה (בראשית כ':ז')", "source": "09 avraham and avimelech", "type": "story"}, {"q": "4. ⭐⭐⭐ \"וְגַם אׇמְנָה אֲחֹתִי בַת אָבִי הִוא אַךְ לֹא בַת _____ וַתְּהִי לִי לְאִשָּׁה\"", "a": "**מילה חסרה:** אִמִּי\n**מי אמר:** אברהם\n**הקשר:** אברהם מגלה שהוא ושרה אחים מצד האב (בראשית כ':י\"ב)", "source": "09 avraham and avimelech", "type": "story"}, {"q": "1. בן כמה היה אברהם כשנולד יצחק?", "a": "בן מאה שנה", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "2. בן כמה ימים נימול יצחק?", "a": "בן שמונה ימים", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "3. מה אמרה שרה לאחר לידת יצחק?", "a": "\"צחוק עשה לי אלוהים, כל השומע יצחק לי\"", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "4. מה עשה אברהם ביום הגמל את יצחק?", "a": "עשה משתה גדול", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "5. מה ראתה שרה שגרם לה לדרוש את גירוש הגר?", "a": "ראתה את בן הגר \"מצחק\"", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "6. מה אמרה שרה לאברהם?", "a": "\"גרש את האמה הזאת ואת בנה כי לא יירש בן האמה הזאת עם בני עם יצחק\"", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "7. כיצד הגיב אברהם לדרישת שרה?", "a": "הדבר היה רע בעיניו על אודות בנו ישמעאל", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "8. מה אמר ה' לאברהם לגבי דרישת שרה?", "a": "\"כל אשר תאמר אליך שרה שמע בקולה, כי ביצחק יקרא לך זרע\"", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "9. מה נתן אברהם להגר כשנשלחה?", "a": "לחם וחמת מים", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "10. היכן תעתה הגר עם ישמעאל?", "a": "במדבר באר שבע", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "11. מה עשתה הגר כשכלו המים?", "a": "השליכה את הילד תחת אחד השיחים, ישבה מנגד כמטחוי קשת ובכתה", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "12. מי שמע את קול הנער?", "a": "אלוהים שמע את קול הנער, ומלאך אלוהים קרא להגר מן השמים", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "13. מה עשה ה' כדי להציל את הגר וישמעאל?", "a": "פקח את עיניה וראתה באר מים", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "14. היכן גדל ישמעאל ומה היה עיסוקו?", "a": "גדל במדבר פארן והיה רובה קשת", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "15. מאיפה לקחה אם ישמעאל לו אישה?", "a": "מארץ מצרים", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "16. מי כרת ברית עם אברהם בסוף הפרק?", "a": "אבימלך ופיכול שר צבאו", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "17. מה נטע אברהם בבאר שבע?", "a": "אשל (עץ)", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "18. באיזה שם קרא אברהם לה' בבאר שבע?", "a": "\"ה' אל עולם\"", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "1. ⭐⭐⭐ \"גָּרֵשׁ הָאָמָה הַזֹּאת וְאֶת בְּנָהּ כִּי לֹא יִירַשׁ בֶּן הָאָמָה הַזֹּאת עִם בְּנִי עִם יִצְחָק\"", "a": "**מי אמר:** שרה\n**למי:** אברהם\n**הקשר:** שרה דורשת מאברהם לגרש את הגר וישמעאל לאחר שראתה את ישמעאל \"מצחק\" (בראשית כ\"א:י')", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "2. ⭐⭐⭐ \"כֹּל אֲשֶׁר תֹּאמַר אֵלֶיךָ שָׂרָה שְׁמַע בְּקֹלָהּ כִּי בְיִצְחָק יִקָּרֵא לְךָ זָרַע\"", "a": "**מי אמר:** ה'\n**למי:** אברהם\n**הקשר:** ה' מצווה את אברהם לשמוע בקול שרה ולגרש את הגר וישמעאל (בראשית כ\"א:י\"ב)", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "1. ⭐⭐⭐ נולד לאב בן מאה שנה, נימול בן שמונה ימים, ביום שנגמל נערך משתה גדול, אמו צחקה כשנולד", "a": "**הדמות:** יצחק\n**ספר:** בראשית\n**הקשר:** יצחק נולד כשאברהם בן 100, נימול בן 8 ימים, אברהם עשה משתה ביום הגמל, ושרה אמרה \"צחוק עשה לי אלוהים\" (פרק כ\"א)", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "1. ⭐⭐⭐ הגר ראתה באר מים במדבר לאחר שהתפללה לה'. נכון או לא נכון?", "a": "**לא נכון.** הגר לא התפללה - היא **בכתה**. ה' שמע דווקא \"את **קול הנער**\" (לא קול הגר): \"וישמע אלוהים את קול הנער\" (כ\"א:י\"ז). ואז \"ויפקח אלוהים את **עיניה** ותרא באר מים\" (כ\"א:י\"ט) - ה' פקח את עיניה, היא לא מצאה את הבאר בעצמה.", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "2. ⭐⭐⭐ שם \"באר שבע\" נקרא על שם שבע הכבשות שאברהם נתן לאבימלך. נכון או לא נכון?", "a": "**נכון (ויש גם משמעות נוספת).** \"על כן קרא למקום ההוא באר שבע כי **שם נשבעו שניהם**\" (כ\"א:ל\"א). השם נקרא הן על שם **שבע** הכבשות והן על שם ה**שבועה**.", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "19. ⭐⭐⭐ כמה כבשות הפריד אברהם בברית עם אבימלך ומדוע?", "a": "שבע כבשות - \"כי את שבע כבשות תיקח מידי בעבור תהיה לי לעדה כי חפרתי את הבאר הזאת\" (בראשית כ\"א:ל')", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "20. ⭐⭐ מי היה פיכול?", "a": "שר צבא אבימלך - \"ויאמר אבימלך ופיכול שר צבאו\" (בראשית כ\"א:כ\"ב)", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "21. ⭐⭐⭐ מהו הביטוי שבו תיאר ה' את הסיבה שאברהם צריך לשמוע בקול שרה?", "a": "\"כי ביצחק יקרא לך זרע\" - הזרע העיקרי של אברהם ייקרא על שם יצחק (בראשית כ\"א:י\"ב)", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "2. ⭐⭐⭐ בנו נולד כשהיה בן מאה, נטע אשל בבאר שבע, כרת ברית עם מלך, גירש אישה ובנה בפקודת ה'", "a": "**הדמות:** אברהם\n**ספר:** בראשית\n**הקשר:** יצחק נולד כשאברהם בן 100, נטע אשל בבאר שבע, כרת ברית עם אבימלך, ושלח את הגר וישמעאל לפי ציווי ה' (פרק כ\"א)", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "1. ⭐⭐ \"צְחֹק עָשָׂה לִי אֱלֹהִים כׇּל הַשֹּׁמֵעַ _____ לִי\"", "a": "**מילה חסרה:** יִצְחַק\n**מי אמר:** שרה\n**הקשר:** שרה שמחה לאחר לידת יצחק (בראשית כ\"א:ו')", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "2. ⭐⭐⭐ \"גָּרֵשׁ הָאָמָה הַזֹּאת וְאֶת בְּנָהּ כִּי לֹא יִירַשׁ בֶּן הָאָמָה הַזֹּאת עִם בְּנִי עִם _____\"", "a": "**מילה חסרה:** יִצְחָק\n**מי אמר:** שרה\n**הקשר:** שרה דורשת מאברהם לגרש את הגר וישמעאל (בראשית כ\"א:י')", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "3. ⭐⭐ \"כִּי שָׁמַע אֱלֹהִים אֶל קוֹל _____ בַּאֲשֶׁר הוּא שָׁם\"", "a": "**מילה חסרה:** הַנַּעַר\n**מי אמר:** מלאך אלוהים\n**הקשר:** המלאך מרגיע את הגר שה' שמע את קול ישמעאל במדבר (בראשית כ\"א:י\"ז)", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "4. ⭐⭐⭐ \"כֹּל אֲשֶׁר תֹּאמַר אֵלֶיךָ שָׂרָה שְׁמַע בְּקֹלָהּ כִּי בְיִצְחָק יִקָּרֵא לְךָ _____\"", "a": "**מילה חסרה:** זָרַע\n**מי אמר:** ה'\n**הקשר:** ה' מצווה את אברהם לשמוע בקול שרה לגרש את הגר (בראשית כ\"א:י\"ב)", "source": "10 birth of yitzchak and hagar expelled", "type": "story"}, {"q": "1. מהו הפסוק הפותח את סיפור העקדה?", "a": "\"והאלוהים ניסה את אברהם\" - ה' קרא \"אברהם\" והוא ענה \"הנני\"", "source": "11 akedat yitzchak", "type": "story"}, {"q": "2. מה ציווה ה' את אברהם לעשות?", "a": "\"קח נא את בנך את יחידך אשר אהבת את יצחק ולך לך אל ארץ המוריה והעלהו שם לעולה\"", "source": "11 akedat yitzchak", "type": "story"}, {"q": "3. לאן ציווה ה' את אברהם ללכת?", "a": "אל ארץ המוריה, על אחד ההרים שיאמר לו", "source": "11 akedat yitzchak", "type": "story"}, {"q": "4. כמה ימים נמשך המסע עד שאברהם ראה את המקום?", "a": "שלושה ימים - \"ביום השלישי\" ראה את המקום מרחוק", "source": "11 akedat yitzchak", "type": "story"}, {"q": "5. מה אמר אברהם לנערים לפני שעלה להר?", "a": "\"שבו לכם פה עם החמור ואני והנער נלכה עד כה ונשתחווה ונשובה אליכם\"", "source": "11 akedat yitzchak", "type": "story"}, {"q": "6. מי נשא את עצי העולה?", "a": "יצחק", "source": "11 akedat yitzchak", "type": "story"}, {"q": "7. מה נשא אברהם בידו?", "a": "את האש ואת המאכלת (הסכין)", "source": "11 akedat yitzchak", "type": "story"}, {"q": "8. מה שאל יצחק את אברהם בדרך?", "a": "\"אבי... הנה האש והעצים ואיה השה לעולה?\"", "source": "11 akedat yitzchak", "type": "story"}, {"q": "9. מה ענה אברהם ליצחק?", "a": "\"אלוהים יראה לו השה לעולה בני\"", "source": "11 akedat yitzchak", "type": "story"}, {"q": "10. מי עצר את אברהם מלשחוט את יצחק?", "a": "מלאך ה' קרא מן השמים \"אברהם אברהם\" ואמר \"אל תשלח ידך אל הנער\"", "source": "11 akedat yitzchak", "type": "story"}, {"q": "11. מדוע ציווה המלאך להפסיק?", "a": "\"כי עתה ידעתי כי ירא אלוהים אתה ולא חשכת את בנך את יחידך ממני\"", "source": "11 akedat yitzchak", "type": "story"}, {"q": "12. מה מצא אברהם במקום יצחק להקרבה?", "a": "איל אחר נאחז בסבך בקרניו", "source": "11 akedat yitzchak", "type": "story"}, {"q": "13. מה קרא אברהם למקום העקדה?", "a": "\"ה' יראה\" - \"אשר ייאמר היום בהר ה' ייראה\"", "source": "11 akedat yitzchak", "type": "story"}, {"q": "14. למה דימה ה' את זרע אברהם בברכה שלאחר העקדה?", "a": "לכוכבי השמים ולחול אשר על שפת הים", "source": "11 akedat yitzchak", "type": "story"}, {"q": "15. מה הובטח לזרע אברהם בברכה?", "a": "\"ויירש זרעך את שער אויביו, והתברכו בזרעך כל גויי הארץ\"", "source": "11 akedat yitzchak", "type": "story"}, {"q": "16. מהי המאכלת?", "a": "הסכין שאברהם לקח לשחוט את יצחק", "source": "11 akedat yitzchak", "type": "story"}, {"q": "17. כמה פעמים ענה אברהם \"הנני\" בסיפור?", "a": "פעמיים - פעם כשה' קרא לו בתחילה, ופעם כשהמלאך קרא לו לעצור", "source": "11 akedat yitzchak", "type": "story"}, {"q": "18. מה מסופר בסוף פרק כ\"ב לאחר העקדה?", "a": "ייחוס משפחת נחור אחי אברהם, כולל האזכור הראשון של רבקה בת בתואל - שתהיה אשת יצחק", "source": "11 akedat yitzchak", "type": "story"}, {"q": "1. ⭐ \"אֱלֹהִים יִרְאֶה לּוֹ הַשֶּׂה לְעֹלָה בְּנִי\"", "a": "**מי אמר:** אברהם\n**למי:** יצחק\n**הקשר:** תשובת אברהם ליצחק בדרך לעקדה כששאל היכן השה (בראשית כ\"ב:ח')", "source": "11 akedat yitzchak", "type": "story"}, {"q": "2. ⭐ \"אַל תִּשְׁלַח יָדְךָ אֶל הַנַּעַר\"", "a": "**מי אמר:** מלאך ה'\n**למי:** אברהם\n**הקשר:** עצירת אברהם מלשחוט את יצחק בעקדה (בראשית כ\"ב:י\"ב)", "source": "11 akedat yitzchak", "type": "story"}, {"q": "1. ⭐ נעקד על גבי מזבח, אשתו נבחרה על ידי עבד אביו, ברך את בנו הצעיר במקום הבכור", "a": "**הדמות:** יצחק\n**ספר:** בראשית\n**הקשר:** יצחק נעקד בפרק כ\"ב, רבקה נבחרה לו בפרק כ\"ד, וברך את יעקב במקום עשו (פרקים כ\"ב, כ\"ד, כ\"ז)", "source": "11 akedat yitzchak", "type": "story"}, {"q": "3. ⭐⭐⭐ \"קַח נָא אֶת בִּנְךָ אֶת יְחִידְךָ אֲשֶׁר אָהַבְתָּ אֶת יִצְחָק\"", "a": "**מי אמר:** ה'\n**למי:** אברהם\n**הקשר:** ה' מצווה את אברהם לעקוד את יצחק - הציווי כולל ארבעה שלבי דיוק: בנך, יחידך, אשר אהבת, יצחק (בראשית כ\"ב:ב')", "source": "11 akedat yitzchak", "type": "story"}, {"q": "4. ⭐⭐⭐ \"שְׁבוּ לָכֶם פֹּה עִם הַחֲמוֹר וַאֲנִי וְהַנַּעַר נֵלְכָה עַד כֹּה וְנִשְׁתַּחֲוֶה וְנָשׁוּבָה אֲלֵיכֶם\"", "a": "**מי אמר:** אברהם\n**למי:** שני הנערים\n**הקשר:** אברהם משאיר את הנערים למטה לפני שעולה להר המוריה עם יצחק (בראשית כ\"ב:ה')", "source": "11 akedat yitzchak", "type": "story"}, {"q": "1. ⭐⭐⭐ אברהם מצא כבש (שה
