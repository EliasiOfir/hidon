ים של משה ואהרן באותו זמן?", "a": "ה' אומר למשה. משה היה בן שמונים שנה ואהרן בן שלוש ושמונים שנה בדברם אל פרעה (שמות ז':א'-ב', ז')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"לֹא תֹאסִפוּן לָתֵת תֶּבֶן לָעָם\"\nשאלה: מי ציווה את הפקודה הזו ולמי? ומה לא השתנה למרות ההחמרה?", "a": "פרעה ציווה את הנוגשים בעם ואת שוטריו. למרות שהפסיק לספק תבן, מכסת הלבנים נשארה זהה: \"ואת מתכונת הלבנים... תשימו עליהם לא תגרעו ממנו\" (שמות ה':ו'-ח')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וּמֹשֶׁה בֶּן שְׁמֹנִים שָׁנָה וְאַהֲרֹן\"\nשאלה: מה היה המעשה הראשון שעשו משה ואהרן לפני פרעה, ומה היתה תגובת פרעה?", "a": "אהרן השליך את מטהו לפני פרעה ויהי לתנין. פרעה קרא גם לחכמים ולמכשפים - חרטומי מצרים עשו כן בלהטיהם, אך \"ויבלע מטה אהרן את מטותם\" (שמות ז':י'-י\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיַּחְפְּרוּ כׇל מִצְרַיִם סְבִיבֹת הַיְאֹר\"\nשאלה: מדוע חפרו המצרים סביב היאור? מה קרה ליאור עצמו?", "a": "כי \"לא יכלו לשתות ממימי היאור\" - כל המים שביאור הפכו לדם (מכת דם). המצרים חפרו באדמה סביב היאור בתקווה למצוא מים שלא נפגעו (שמות ז':כ\"ד)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְלֹא שָׁת לִבּוֹ גַּם לָזֹאת\"\nשאלה: מה פירוש \"ולא שת ליבו\" ואחרי איזו מכה נאמר הביטוי הזה?", "a": "\"ולא שת ליבו\" - לא שם לב / לא התרשם / לא נתן את ליבו. נאמר אחרי מכת דם - למרות שכל המים הפכו לדם, פרעה לא התרשם (שמות ז':כ\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְהִפְלָה יְהוָה בֵּין מִקְנֵה יִשְׂרָאֵל\"\nשאלה: באיזו מכה מדובר כאן, ומה היתה ההבחנה המפתיעה?", "a": "מכת דבר (מגפת הבהמות). ההבחנה: \"ולא מת ממקנה בני ישראל עד אחד\" - כל מקנה מצרים חלה אך ממקנה ישראל לא מת אפילו אחד. פרעה אף שלח לבדוק וגילה שזה נכון - ובכל זאת הכביד את ליבו (שמות ט':ד'-ז')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְלֹא יָכְלוּ הַחַרְטֻמִּים לַעֲמֹד\"\nשאלה: מה מיוחד בפסוק הזה - מדוע לא יכלו החרטומים לעמוד?", "a": "החרטומים עצמם נפגעו ממכת השחין! \"כי היה השחין בחרטומים ובכל מצרים\" - זו הפעם הראשונה שהחרטומים עצמם נפגעים פיזית מהמכה ולא רק נכשלים לחקות אותה (שמות ט':י\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּמָּלֵא שִׁבְעַת יָמִים\"\nשאלה: מה משמעות \"שבעת ימים\" כאן - לאיזו מכה הפסוק מתייחס ומה הם מודדים?", "a": "הפסוק מתייחס למכת דם. שבעת ימים הם משך הזמן שעבר מאז שה' הכה את היאור - כלומר מכת דם נמשכה שבעה ימים (שמות ז':כ\"ה)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּבְלַע מַטֵּה אַהֲרֹן אֶת מַטֹּתָם\"\nשאלה: את מטות מי בלע מטה אהרן? מה עשו הם לפני כן?", "a": "בלע את מטות חרטומי מצרים. הם השליכו איש מטהו ויהיו לתנינים - חיקו את אות המטה שהפך לתנין (שמות ז':י\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"הַעְתִּירוּ אֶל יְהוָה\"\nשאלה: מי ביקש ממשה להעתיר (להתפלל)? ומה הבטיח בתמורה?", "a": "פרעה ביקש ממשה. הבטיח לשלח את העם לזבוח לה' - אך אחרי שהמכה הוסרה \"ויכבד פרעה את ליבו\" וחזר בו (שמות ח':ד'-י\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיָּסַר אֶת הַשְּׁחִין\"\nשאלה: מה היה הייחוד של מכת שחין לעומת המכות הקודמות ביחס לחרטומים?", "a": "החרטומים עצמם נפגעו מהשחין - \"כי היה השחין בחרטומים ובכל מצרים\" ולא יכלו אפילו לעמוד לפני משה. זו הפעם הראשונה שהם נפגעים פיזית (שמות ט':י\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"לְכוּ לְסִבְלֹתֵיכֶם\"\nשאלה: מי אמר את זה ולמי? מה אמר מיד אחרי?", "a": "פרעה אמר למשה ואהרן. מיד אחרי הוסיף: \"הן רבים עתה עם הארץ והשבתם אותם מסבלותם\" - לא רק סירב לבקשתם, אלא האשים אותם שמפריעים לעם מעבודתו (שמות ה':ד'-ה')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיָּפֶץ הָעָם\"\nשאלה: לאן נפוצו ומדוע? מה חיפשו?", "a": "\"ויפץ העם בכל ארץ מצרים לקושש קש לתבן\" - העם נפוץ בכל ארץ מצרים לחפש קש שישמש כתבן ללבנים, כי פרעה הפסיק לספק להם תבן (שמות ה':י\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיֻּכּוּ שֹׁטְרֵי\"\nשאלה: מי הכה את שוטרי בני ישראל, ומה השאלה שנשאלו?", "a": "נוגשי פרעה הכו את שוטרי בני ישראל ושאלו: \"מדוע לא כליתם חוקכם ללבון כתמול שלשום גם תמול גם היום\" - למה לא השלמתם את מכסת הלבנים כמו פעם (שמות ה':י\"ד)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"פֶּן יִפְגָּעֵנוּ\"\nשאלה: מי אמר \"פן יפגענו\" ולמי? במה איימו שה' יפגע בהם?", "a": "משה ואהרן אמרו לפרעה: \"אלוהי העברים נקרא עלינו, נלכה נא דרך שלושת ימים במדבר ונזבחה לה' אלוהינו פן יפגענו בדבר או בחרב\" - איימו שה' יפגע בהם (בישראל עצמם!) במגפה או בחרב אם לא יזבחו (שמות ה':ג')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"עוֹד נֶגַע אֶחָד אָבִיא\"\nשאלה: מי אומר את הדברים האלה ולמי? ומה ציווה לעשות מיד אחר כך?", "a": "ה' אמר למשה. מיד ציווה \"דבר נא באוזני העם וישאלו איש מאת רעהו ואשה מאת רעותה כלי כסף וכלי זהב\" (שמות י\"א:א'-ב')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"מִבְּכוֹר פַּרְעֹה עַד בְּכוֹר הַשִּׁפְחָה\"\nשאלה: כשהמכה התרחשה בפועל (בפרק י\"ב), מה השתנה בתיאור לעומת ההכרזה המופיעה כאן?", "a": "בהכרזה נאמר \"בכור השפחה אשר אחר הרחיים\", אך בביצוע (י\"ב:כ\"ט) נאמר \"בכור השבי אשר בבית הבור\" - השתנתה הדרגה הנמוכה ביותר (שמות י\"א:ה', י\"ב:כ\"ט)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ\"\nשאלה: מה המטרה של ההבדלה המתוארת בפסוק, לפי ההמשך?", "a": "\"למען תדעון אשר יפלה ה' בין מצרים ובין ישראל\" - המטרה היא להראות את ההבדלה שה' עושה בין שני העמים (שמות י\"א:ז')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"גַּם הָאִישׁ מֹשֶׁה גָּדוֹל מְאֹד\"\nשאלה: כיצד יצא משה מעם פרעה באותו מפגש, לפי הפסוק שמופיע מיד אחרי?", "a": "\"ויצא מעם פרעה בחרי אף\" - למרות מעמדו הרם בעיני המצרים, משה יצא בכעס גדול (שמות י\"א:ח')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"צְעָקָה גְדֹלָה בְּכׇל אֶרֶץ מִצְרַיִם\"\nשאלה: הפסוק הזה הוא חלק מהכרזה או מתיאור המכה עצמה? מי אומר אותו?", "a": "הפסוק הוא חלק מהכרזת משה בפני פרעה (לפני המכה) - משה מנבא מה יקרה. המכה עצמה מתוארת רק בפרק י\"ב (שמות י\"א:ו')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"כְּשַׁלְּחוֹ כָּלָה גָּרֵשׁ יְגָרֵשׁ אֶתְכֶם מִזֶּה\"\nשאלה: מה המשמעות של \"כשלחו כלה\" - מה מייחד את השילוח הזה?", "a": "\"כשלחו כלה\" - כשישלח, ישלח לגמרי (בשלמות). ו\"גרש יגרש\" - לא רק ישלח אלא יגרש בכוח ובחיפזון. לשון כפולה המדגישה שפרעה לא רק ייתן רשות אלא יגרש אותם בכוח (שמות י\"א:א')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּתֵּן יְהוָה אֶת חֵן הָעָם בְּעֵינֵי מִצְרָיִם\"\nשאלה: מה הקשר בין \"נתינת החן\" הזו למה שישראל ביקשו מהמצרים?", "a": "ה' נתן חן בעיני מצרים כדי שייתנו לישראל \"כלי כסף וכלי זהב\" כששאלו מהם - כך הם לא יצאו ריקם ממצרים (שמות י\"א:ב'-ג')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"לְמַעַן רְבוֹת מוֹפְתַי בְּאֶרֶץ מִצְרָיִם\"\nשאלה: מי אמר את הדברים האלה ולמי? מה הסיבה המפתיעה שה' נותן לכך שפרעה לא ישמע?", "a": "ה' אמר למשה. הסיבה: \"למען רבות מופתי בארץ מצרים\" - ה' רוצה שפרעה יסרב כדי שיהיו יותר מופתים! (שמות י\"א:ט')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיֵּצֵא מֵעִם פַּרְעֹה בָּחֳרִי אָף\"\nשאלה: מי יצא בחרי אף, ומה אמר לפרעה ממש לפני שיצא?", "a": "משה יצא בחרי אף. ממש לפני כן אמר: \"וירדו כל עבדיך אלה אלי והשתחוו לי לאמור צא אתה וכל העם אשר ברגליך ואחרי כן אצא\" - ניבא שעבדי פרעה ירדו להשתחוות לו (שמות י\"א:ח')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְכֹל בְּכוֹר בְּהֵמָה\"\nשאלה: הפסוק מוסיף \"וכל בכור בהמה\" בנוסף לבכורות האדם. איזה טווח חברתי של בכורות אדם מוזכר בפסוק?", "a": "\"מבכור פרעה היושב על כסאו עד בכור השפחה אשר אחר הרחיים\" - מהדרגה הגבוהה ביותר (בכור המלך) עד הנמוכה ביותר (בכור השפחה שטוחנת ברחיים) (שמות י\"א:ה')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"כַּחֲצֹת הַלַּיְלָה\"\nשאלה: מי אמר את הביטוי הזה, ולמי? מה הכריז שיקרה?", "a": "משה אמר לפרעה (בשם ה'). הכריז: \"אני יוצא בתוך מצרים ומת כל בכור בארץ מצרים\" (שמות י\"א:ד'-ה')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"גָּרֵשׁ יְגָרֵשׁ אֶתְכֶם\"\nשאלה: מי אמר את זה ולמי? מה ההבדל בין \"שילוח\" ל\"גירוש\"?", "a": "ה' אמר למשה. ההבדל: \"שילוח\" הוא נתינת רשות ללכת, ואילו \"גירוש\" הוא הוצאה בכוח ובחיפזון - פרעה יגרש אותם ממצרים (שמות י\"א:א')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּתֵּן יְהוָה אֶת חֵן הָעָם\"\nשאלה: בעיני מי נתן ה' את חן העם? ומה ביקשו ישראל בזכות חן זה?", "a": "בעיני מצרים. בזכות חן זה ביקשו ישראל כלי כסף וכלי זהב - \"וישאלום\" והמצרים נתנו (שמות י\"א:ב'-ג', י\"ב:ל\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְנָתְנוּ עַל שְׁתֵּי הַמְּזוּזֹת וְעַל הַמַּשְׁקוֹף\"\nשאלה: מה היתה מטרת נתינת הדם במקומות המתוארים כאן?", "a": "\"וראיתי את הדם ופסחתי עליכם ולא יהיה בכם נגף למשחית בהכותי בארץ מצרים\" - הדם היה סימן שה' יפסח על הבית ולא יכנס אליו המשחית (שמות י\"ב:י\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"מׇתְנֵיכֶם חֲגֻרִים נַעֲלֵיכֶם בְּרַגְלֵיכֶם\"\nשאלה: מה צריך לאכול בצורה המתוארת כאן, ואיך - צלי, מבושל, או נא?", "a": "את קרבן הפסח. \"צלי אש\" בלבד - \"אל תאכלו ממנו נא ובשל מבושל במים כי אם צלי אש\", עם מצות ומרורים (שמות י\"ב:ח'-י\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיָּקׇם פַּרְעֹה לַיְלָה\"\nשאלה: מה אמר פרעה למשה ואהרן כשקרא להם באותו לילה?", "a": "\"קומו צאו מתוך עמי גם אתם גם בני ישראל ולכו עבדו את ה' כדברכם. גם צאנכם גם בקרכם קחו כאשר דברתם ולכו - וברכתם גם אותי\" (שמות י\"ב:ל\"א-ל\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"אֶת בְּצֵקוֹ טֶרֶם יֶחְמָץ\"\nשאלה: מדוע הבצק לא הספיק להחמיץ, לפי הכתוב?", "a": "\"כי גורשו ממצרים ולא יכלו להתמהמה וגם צידה לא עשו להם\" - גורשו בחיפזון ולא הספיקו להמתין שהבצק יתפח (שמות י\"ב:ל\"ט)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"הַחֹדֶשׁ הַזֶּה לָכֶם רֹאשׁ חֳדָשִׁים\"\nשאלה: מה הציווי הראשון שבא מיד אחרי הקביעה הזו?", "a": "\"בעשור לחודש הזה ויקחו להם איש שה לבית אבות שה לבית\" - לקיחת השה בעשירי לחודש (שמות י\"ב:ג')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"כִּי אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת\"\nשאלה: מתי התרחשה המכה המתוארת כאן, ומה עשה פרעה מיד אחר כך?", "a": "בחצי הלילה. פרעה קם לילה הוא וכל עבדיו, קרא למשה ולאהרן ואמר \"קומו צאו מתוך עמי... ולכו עבדו את ה' כדברכם\" (שמות י\"ב:כ\"ט-ל\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁאֲלוּ מִמִּצְרַיִם כְּלֵי כֶסֶף\"\nשאלה: כיצד הסכימו המצרים לתת את רכושם, לפי מה שמסופר?", "a": "\"וה' נתן את חן העם בעיני מצרים וישאלום וינצלו את מצרים\" - ה' נתן חן בעיני המצרים והם נתנו מרצונם (שמות י\"ב:ל\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה\"\nשאלה: כמה גברים רגלי יצאו ממצרים לפי הכתוב, ומי עוד יצא עמם?", "a": "\"כשש מאות אלף רגלי הגברים לבד מטף. וגם ערב רב עלה אתם וצאן ובקר מקנה כבד מאוד\" - כ-600,000 גברים, וגם ערב רב (גויים שהצטרפו) (שמות י\"ב:ל\"ז-ל\"ח)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"שֶׂה תָמִים זָכָר בֶּן שָׁנָה יִהְיֶה לָכֶם\"\nשאלה: מאיפה ניתן לקחת את השה - מאילו בעלי חיים?", "a": "\"מן הכבשים ומן העיזים תיקחו\" - ניתן לקחת כבש או עז, כל עוד הוא תמים, זכר ובן שנה (שמות י\"ב:ה')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"לֹא תֵצְאוּ אִישׁ מִפֶּתַח בֵּיתוֹ\"\nשאלה: מדוע נאסר על בני ישראל לצאת מפתח ביתם? מה היה מסתובב בחוץ?", "a": "\"ועבר ה' לנגוף את מצרים וראה את הדם על המשקוף ועל שתי המזוזות ופסח ה' על הפתח ולא יתן המשחית לבוא אל בתיכם לנגוף\" - המשחית היה עובר בחוץ, ורק הדם על הפתח הגן עליהם (שמות י\"ב:כ\"ב-כ\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וּלְקַחְתֶּם אֲגֻדַּת אֵזוֹב\"\nשאלה: מהו \"אזוב\" ומה עשו איתו?", "a": "אזוב הוא צמח. לקחו אגודת אזוב, טבלו אותה בדם שבסף (הכלי/הספל), והגיעו (מרחו) את הדם על המשקוף ועל שתי המזוזות (שמות י\"ב:כ\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ\"\nשאלה: הפסוק הזה הוא חלק מרשימת חוקים על קרבן הפסח. מה החוק שנאמר ממש לפני?", "a": "\"בבית אחד ייאכל, לא תוציא מן הבית מן הבשר חוצה\" - יש לאכול בבית אחד ואסור להוציא את הבשר החוצה (שמות י\"ב:מ\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַתֶּחֱזַק מִצְרַיִם עַל הָעָם\"\nשאלה: מה הסיבה שהמצרים מיהרו לשלח את ישראל, לפי הפסוק?", "a": "\"כי אמרו כולנו מתים\" - המצרים פחדו שכולם ימותו אם ישראל ישארו, ולכן לחצו עליהם לצאת במהירות (שמות י\"ב:ל\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"צְלִי אֵשׁ וּמַצּוֹת עַל מְרֹרִים\"\nשאלה: מה שתי הצורות שבהן אסור לאכול את קרבן הפסח?", "a": "\"אל תאכלו ממנו נא ובשל מבושל במים\" - אסור נא (חי למחצה) ואסור מבושל. רק צלי אש מותר (שמות י\"ב:ט')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"לֵיל שִׁמֻּרִים הוּא לַיהוָה\"\nשאלה: למה מתייחס \"ליל שימורים\"? מה מיוחד בלילה הזה?", "a": "ליל שימורים הוא ליל היציאה ממצרים - \"להוציאם מארץ מצרים, הוא הלילה הזה לה' שימורים לכל בני ישראל לדורותם\" (שמות י\"ב:מ\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"בְּעֶצֶם הַיּוֹם הַזֶּה\"\nשאלה: מה קרה \"בעצם היום הזה\" לפי הפסוק?", "a": "\"הוציא ה' את בני ישראל מארץ מצרים על צבאותם\" - ביום זה ממש יצאו ממצרים, אחרי 430 שנה (שמות י\"ב:נ\"א, מ')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"רֹאשׁוֹ עַל כְּרָעָיו\"\nשאלה: הפסוק מתאר כיצד יש לצלות את קרבן הפסח. מה הכוונה \"ראשו על כרעיו ועל קרבו\"?", "a": "לצלות את השה שלם - \"צלי אש ראשו על כרעיו ועל קרבו\" - הראש, הרגליים והקרביים כולם יחד, לא לחתוך אותו לחלקים. זה חלק מהציווי שגם אוסר לשבור בו עצם (שמות י\"ב:ט')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"תַּשְׁבִּיתוּ שְּׂאֹר\"\nשאלה: מתי צריך להשבית שאור מהבתים? ומה העונש לאוכל חמץ?", "a": "\"אך ביום הראשון תשביתו שאור מבתיכם\" - ביום הראשון של שבעת הימים. העונש: \"כי כל אוכל חמץ ונכרתה הנפש ההיא מישראל מיום הראשון עד יום השביעי\" - כרת (שמות י\"ב:ט\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"מָה הָעֲבֹדָה הַזֹּאת\"\nשאלה: מי ישאל את השאלה הזו, ומה צריך לענות לו?", "a": "\"והיה כי יאמרו אליכם בניכם מה העבודה הזאת לכם\" - הבנים ישאלו בעתיד. התשובה: \"ואמרתם זבח פסח הוא לה' אשר פסח על בתי בני ישראל במצרים בנגפו את מצרים ואת בתינו הציל\" (שמות י\"ב:כ\"ו-כ\"ז)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"תּוֹשָׁב וְשָׂכִיר\"\nשאלה: מה הדין של \"תושב ושכיר\" ביחס לקרבן הפסח? ומה ההבדל בינם לבין \"עבד מקנת כסף\"?", "a": "\"תושב ושכיר לא יאכל בו\" - אסור להם לאכול. לעומת זאת \"וכל עבד איש מקנת כסף ומלתה אותו אז יאכל בו\" - עבד שנקנה בכסף ונימול כן רשאי לאכול (שמות י\"ב:מ\"ד-מ\"ה)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"מֵרַעְמְסֵס סֻכֹּתָה\"\nשאלה: מאיפה לאיפה נסעו בני ישראל בתחנה הראשונה של המסע? וכמה היו?", "a": "\"ויסעו בני ישראל מרעמסס סוכותה\" - מרעמסס לסוכות. היו \"כשש מאות אלף רגלי הגברים לבד מטף. וגם ערב רב עלה אתם\" (שמות י\"ב:ל\"ז-ל\"ח)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם\"\nשאלה: מי אמר/אמרו את הדברים האלה ולמי, ומה ענה הנמען?", "a": "בני ישראל אמרו למשה כשראו את מצרים רודפים אחריהם. משה ענה: \"אל תיראו התייצבו וראו את ישועת ה'... ה' יילחם לכם ואתם תחרישון\" (שמות י\"ד:י\"א-י\"ד)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"מַה תִּצְעַק אֵלָי\"\nשאלה: מי אומר את הדברים האלה ולמי? ומה הוא מצווה לעשות מיד אחר כך?", "a": "ה' אומר למשה. הציווי: \"ואתה הרם את מטך ונטה את ידך על הים ובקעהו ויבואו בני ישראל בתוך הים ביבשה\" (שמות י\"ד:ט\"ו-ט\"ז)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיּוֹלֶךְ יְהוָה אֶת הַיָּם בְּרוּחַ קָדִים\"\nשאלה: מה התוצאה המיידית של הפעולה המתוארת כאן? כיצד עברו בני ישראל?", "a": "\"וישם את הים לחרבה ויבקעו המים. ויבואו בני ישראל בתוך הים ביבשה והמים להם חומה מימינם ומשמאלם\" (שמות י\"ד:כ\"א-כ\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"אָנוּסָה מִפְּנֵי יִשְׂרָאֵל\"\nשאלה: מי אמר/אמרו את הדברים האלה, ומה קרה להם שגרם לכך?", "a": "מצרים (חיילי פרעה) אמרו זאת. ה' השקיף אל מחנה מצרים בעמוד אש וענן ויהם אותם, והסיר את אופן מרכבותיו וינהגהו בכבדות (שמות י\"ד:כ\"ד-כ\"ה)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"לֹא נִשְׁאַר בָּהֶם עַד אֶחָד\"\nשאלה: מה ראו בני ישראל אחרי האירוע המתואר כאן, ומה היתה תגובתם?", "a": "\"וירא ישראל את מצרים מת על שפת הים. וירא ישראל את היד הגדולה... וייראו העם את ה' ויאמינו בה' ובמשה עבדו\" (שמות י\"ד:ל'-ל\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְלֹא נָחָם אֱלֹהִים דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים\"\nשאלה: מה היתה הסיבה שה' לא הנחה את העם בדרך הקרובה, ובאיזו דרך הלכו במקום?", "a": "\"כי אמר אלוהים פן ינחם העם בראותם מלחמה ושבו מצרימה\" - חשש שהעם יחזור למצרים אם יראה מלחמה. במקום זאת: \"ויסב אלוהים את העם דרך המדבר ים סוף\" (שמות י\"ג:י\"ז-י\"ח)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּקַּח מֹשֶׁה אֶת עַצְמוֹת יוֹסֵף עִמּוֹ\"\nשאלה: מדוע לקח משה את עצמות יוסף, לפי הפסוק?", "a": "\"כי השבע השביע את בני ישראל לאמר פקוד יפקוד אלוהים אתכם והעליתם את עצמותי מזה אתכם\" - יוסף השביע את בני ישראל לפני מותו שיעלו את עצמותיו כשייגאלו (שמות י\"ג:י\"ט)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּסַּע מַלְאַךְ הָאֱלֹהִים\"\nשאלה: מה עוד נסע יחד עם מלאך האלוהים, ומה היתה התוצאה?", "a": "\"ויסע עמוד הענן מפניהם ויעמוד מאחריהם. ויבוא בין מחנה מצרים ובין מחנה ישראל... ולא קרב זה אל זה כל הלילה\" - עמוד הענן הפריד בין המחנות כל הלילה (שמות י\"ד:י\"ט-כ')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיֶּאְסֹר אֶת רִכְבּוֹ\"\nשאלה: מי \"אסר את רכבו\" וכמה רכב בחור לקח?", "a": "פרעה אסר את רכבו. \"ויקח שש מאות רכב בחור וכל רכב מצרים ושלישים על כולו\" - 600 רכב מובחר וכל רכב מצרים (שמות י\"ד:ו'-ז')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"בְּאַשְׁמֹרֶת הַבֹּקֶר וַיַּשְׁקֵף יְהוָה\"\nשאלה: מה עשה ה' למחנה מצרים באשמורת הבוקר, ומה קרה למרכבותיהם?", "a": "\"ויהם את מחנה מצרים. ויסר את אופן מרכבותיו וינהגהו בכבדות\" - ה' הפיל מהומה על מחנה מצרים והסיר את גלגלי מרכבותיהם כך שנסעו בכבדות (שמות י\"ד:כ\"ד-כ\"ה)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וּבְנֵי יִשְׂרָאֵל יֹצְאִים בְּיָד רָמָה\"\nשאלה: מה פירוש \"ביד רמה\"? ומה עשה פרעה בדיוק באותו זמן?", "a": "\"ביד רמה\" - בגלוי, בגאון, בחירות. באותו זמן \"ויחזק ה' את לב פרעה מלך מצרים וירדוף אחרי בני ישראל\" - בזמן שישראל יוצאים בגאון, פרעה רודף אחריהם (שמות י\"ד:ח')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיַּחֲמֻשִׁים עָלוּ בְנֵי יִשְׂרָאֵל\"\nשאלה: מה פירוש \"וחמושים\" כאן?", "a": "\"חמושים\" - מזוינים / חמושים בנשק. למרות שה' לא הנחה אותם דרך ארץ פלשתים (כדי שלא יראו מלחמה), הם בכל זאת יצאו מצוידים בנשק (שמות י\"ג:י\"ח)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיָּשׇׁב הַיָּם לִפְנוֹת בֹּקֶר לְאֵיתָנוֹ\"\nשאלה: מה פירוש \"לאיתנו\" ומתי חזר הים? ומה קרה למצרים באותו רגע?", "a": "\"לאיתנו\" - לתוקפו / למצבו הרגיל. הים חזר \"לפנות בוקר\" (לקראת הבוקר). \"ומצרים נסים לקראתו\" - המצרים ניסו לברוח אך רצו דווקא לכיוון המים החוזרים, ו\"וינער ה' את מצרים בתוך הים\" (שמות י\"ד:כ\"ז)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"חוֹמָה מִימִינָם וּמִשְּׂמֹאלָם\"\nשאלה: מה היה \"חומה\" לבני ישראל? באיזה מצב עברו בני ישראל בין החומות?", "a": "המים היו חומה מימינם ומשמאלם. עברו \"בתוך הים ביבשה\" - הים נבקע והקרקע התייבשה (שמות י\"ד:כ\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"עַמּוּד עָנָן וְעַמּוּד אֵשׁ\"\nשאלה: מתי הלך כל עמוד? ומה קרה לעמוד הענן ברגע המכריע לפני קריעת הים?", "a": "עמוד ענן הלך ביום, עמוד אש בלילה. ברגע המכריע, עמוד הענן נסע מלפני מחנה ישראל ועמד מאחריהם - הבדיל בין מחנה מצרים למחנה ישראל כל הלילה (שמות י\"ג:כ\"א-כ\"ב, י\"ד:י\"ט-כ')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"נְבֻכִים הֵם בָּאָרֶץ\"\nשאלה: מי אמר את הדברים האלה ועל מי? ומה עשה בעקבות הערכה זו?", "a": "פרעה אמר על בני ישראל - חשב שהם מבולבלים. בעקבות זאת רדף אחריהם עם 600 רכב בחור וכל רכב מצרים (שמות י\"ד:ג', ו'-ז')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"קַדֶּשׁ לִי כׇל בְּכוֹר\"\nשאלה: מה ציווה ה' מיד אחרי יציאת מצרים לגבי הבכורות? על מי חל הציווי?", "a": "\"קדש לי כל בכור פטר כל רחם בבני ישראל באדם ובבהמה לי הוא\" - לקדש כל בכור שפותח רחם, גם באדם וגם בבהמה - הכל שייך לה' (שמות י\"ג:ב')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"פִּי הַחִירֹת\"\nשאלה: ה' ציווה את ישראל לחנות במקום מסוים לפני הים. ציין את שלושת שמות המקומות שמוזכרים בפסוק.", "a": "\"לפני פי החירות, בין מגדול ובין הים, לפני בעל צפון\" - שלושה שמות: פי החירות, מגדול, ובעל צפון (שמות י\"ד:ב')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"מַה זֹּאת עָשִׂינוּ\"\nשאלה: מי אמר \"מה זאת עשינו\" ועל מה? מה השתנה בלבם?", "a": "פרעה ועבדיו אמרו זאת כשנודע להם \"כי ברח העם\". \"ויהפך לבב פרעה ועבדיו אל העם\" - התחרטו ושאלו \"כי שלחנו את ישראל מעבדנו\" - מדוע שילחנו את העבדים שלנו? (שמות י\"ד:ה')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"חֲדַל מִמֶּנּוּ\"\nשאלה: מה טענו בני ישראל שאמרו למשה \"חדל ממנו\" עוד במצרים?", "a": "\"הלא זה הדבר אשר דיברנו אליך במצרים לאמר חדל ממנו ונעבדה את מצרים כי טוב לנו עבוד את מצרים ממותנו במדבר\" - טענו שכבר במצרים ביקשו ממשה להפסיק, והעדיפו עבדות על מוות (שמות י\"ד:י\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר\"\nשאלה: מי אמר/אמרו את הדברים האלה ולמי, ומה ענה ה' למשה בתגובה?", "a": "בני ישראל אמרו למשה ואהרן. ה' ענה: \"הנני ממטיר לכם לחם מן השמים ויצא העם ולקטו דבר יום ביומו למען אנסנו הילך בתורתי אם לא\" (שמות ט\"ז:ג'-ד')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"מָן הוּא כִּי לֹא יָדְעוּ מַה הוּא\"\nשאלה: כיצד נראה הדבר שגרם לתגובה הזו?", "a": "\"דק מחוספס דק ככפור על הארץ\" - ובהמשך מתואר: \"כזרע גד לבן וטעמו כצפיחית בדבש\" (שמות ט\"ז:י\"ד, ל\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיָּרֻם תּוֹלָעִים וַיִּבְאַשׁ\"\nשאלה: מה קרה למן שנשמר מערב שבת לשבת - האם גם הוא הבאיש כמתואר כאן?", "a": "לא! \"ויניחו אותו עד הבוקר כאשר ציוה משה ולא הבאיש ורמה לא היתה בו\" - ביום רגיל המן הבאיש, אך לשבת נעשה נס ולא התקלקל (שמות ט\"ז:כ\"ד)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"יָצְאוּ מִן הָעָם לִלְקֹט וְלֹא מָצָאוּ\"\nשאלה: מה אמר ה' למשה בתגובה לאירוע המתואר כאן?", "a": "\"עד אנה מאנתם לשמור מצוותי ותורותי. ראו כי ה' נתן לכם השבת על כן הוא נותן לכם ביום השישי לחם יומיים - שבו איש תחתיו אל יצא איש ממקומו ביום השביעי\" (שמות ט\"ז:כ\"ח-כ\"ט)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"קַח צִנְצֶנֶת אַחַת וְתֶן שָׁמָּה\"\nשאלה: מי אומר את הדברים האלה ולמי? ומה המטרה של שמירת המן?", "a": "משה אומר לאהרן. המטרה: \"למען יראו את הלחם אשר האכלתי אתכם במדבר בהוציאי אתכם מארץ מצרים\" - שדורות הבאים יראו את המן (שמות ט\"ז:ל\"ב-ל\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"בַּיּוֹם הַשִּׁשִּׁי וְהָיָה מִשְׁנֶה\"\nשאלה: מדוע היו צריכים ללקוט כפול ביום השישי? מה קרה ביום השביעי?", "a": "כי ביום השביעי (שבת) לא ירד מן בכלל: \"שבתון שבת קודש לה' מחר... ששת ימים תלקטוהו וביום השביעי שבת לא יהיה בו\" (שמות ט\"ז:כ\"ג, כ\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַתַּעַל הַשְּׂלָו וַתְּכַס אֶת הַמַּחֲנֶה\"\nשאלה: מה עלה בבוקר לאחר השלו של הערב?", "a": "\"ובבוקר היתה שכבת הטל סביב למחנה. ותעל שכבת הטל והנה על פני המדבר דק מחוספס דק ככפור על הארץ\" - שכבת טל, ומתחתיה המן (שמות ט\"ז:י\"ג-י\"ד)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"אֶת הַמָּן אַרְבָּעִים שָׁנָה\"\nשאלה: עד מתי אכלו בני ישראל את המן, לפי הפסוק?", "a": "\"עד בואם אל ארץ נושבת, את המן אכלו עד בואם אל קצה ארץ כנען\" - עד שהגיעו לארץ כנען (שמות ט\"ז:ל\"ה)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"לֹא הֶעְדִּיף הַמַּרְבֶּה\"\nשאלה: מה הנס המתואר כאן? מה קרה כשמדדו בעומר?", "a": "הנס: מי שלקט הרבה - לא היה לו יותר מעומר, ומי שלקט מעט - לא חסר לו. \"איש לפי אכלו לקטו\" - כל אחד מצא בדיוק עומר, ללא קשר לכמה לקט (שמות ט\"ז:י\"ח)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְחַם הַשֶּׁמֶשׁ וְנָמָס\"\nשאלה: מה \"נמס\" כשהשמש חממה? ומתי היו חייבים ללקוט?", "a": "המן נמס בחום השמש. לכן \"וילקטו אותו בבוקר בבוקר איש כפי אכלו\" - היו חייבים ללקוט מוקדם בבוקר, לפני שהשמש תחמם ותמיס אותו (שמות ט\"ז:כ\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּקְרְאוּ אֶת שְׁמוֹ מָן\"\nשאלה: כיצד מתואר המראה והטעם של המן בפסוק הזה?", "a": "\"והוא כזרע גד לבן וטעמו כצפיחית בדבש\" - נראה כמו זרע גד (כזרע כוסברה) לבן, וטעמו כמו צפיחית (עוגה שטוחה/רקיק) בדבש (שמות ט\"ז:ל\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"לְמַעַן אֲנַסֶּנּוּ הֲיֵלֵךְ בְּתוֹרָתִי אִם לֹא\"\nשאלה: מה היה הנסיון/המבחן שה' רצה לנסות בו את העם דרך המן?", "a": "ה' ציווה ללקוט \"דבר יום ביומו\" - לא לאגור ליום המחרת (חוץ מערב שבת). המבחן היה האם העם יסמוך על ה' שייתן מן כל יום, או ינסה לאגור ולא ישמע (שמות ט\"ז:ד')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיַּנִּיחֵהוּ אַהֲרֹן לִפְנֵי הָעֵדֻת לְמִשְׁמָרֶת\"\nשאלה: מה הניח אהרן ומה הכוונה \"לפני העדות\"?", "a": "אהרן הניח צנצנת עם מלוא העומר מן. \"לפני העדות\" - לפני ארון העדות (לוחות הברית). הצנצנת נשמרה לדורות כדי שיראו את הלחם שה' האכיל את ישראל במדבר (שמות ט\"ז:ל\"ד)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"עֹמֶר לַגֻּלְגֹּלֶת\"\nשאלה: מה המידה של \"עומר\" לפי הפסוק האחרון בפרק?", "a": "\"והעומר עשירית האיפה הוא\" - עומר שווה עשירית האיפה (שמות ט\"ז:ל\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"דַּק מְחֻסְפָּס דַּק כַּכְּפֹר\"\nשאלה: מה גילו בני ישראל מתחת לשכבת הטל? ומה אמרו איש אל אחיו?", "a": "גילו את המן - \"דק מחוספס דק ככפור על הארץ\". אמרו \"מן הוא\" כי לא ידעו מה הוא (שמות ט\"ז:י\"ד-ט\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"כְּצַפִּיחִת בִּדְבָשׁ\"\nשאלה: מה מתאר הביטוי הזה - מראה או טעם? וכיצד נראה המן?", "a": "מתאר את הטעם של המן. מראהו: \"כזרע גד לבן\" - לבן כמו זרע כוסברה (שמות ט\"ז:ל\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"בַּחֲמִשָּׁה עָשָׂר יוֹם\"\nשאלה: מתי בדיוק הגיעו בני ישראל למדבר סין? ומאיפה נסעו?", "a": "\"ויסעו מאילם ויבואו כל עדת בני ישראל אל מדבר סין אשר בין אילם ובין סיני בחמשה עשר יום לחודש השני לצאתם מארץ מצרים\" - נסעו מאילם, הגיעו ב-15 לחודש השני (אייר) (שמות ט\"ז:א')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"כְּבוֹד יְהוָה נִרְאָה\"\nשאלה: מתי נראה כבוד ה' בענן, ומה גרם להופעתו?", "a": "\"ויהי כדבר אהרן אל כל עדת בני ישראל ויפנו אל המדבר והנה כבוד ה' נראה בענן\" - כבוד ה' נראה בענן ברגע שאהרן דיבר אל העדה, כתגובה לתלונות העם (שמות ט\"ז:י')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיָּבֹאוּ כׇּל נְשִׂיאֵי\"\nשאלה: מה גרם לנשיאי העדה לבוא ולהגיד למשה? מה הפתיע אותם?", "a": "ביום השישי העם לקט \"לחם משנה שני העומר לאחד\" - כפול מהרגיל. נשיאי העדה באו להגיד למשה כי הופתעו מהכמות הכפולה, ומשה הסביר: \"הוא אשר דיבר ה' שבתון שבת קודש לה' מחר\" (שמות ט\"ז:כ\"ב-כ\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"תְּנוּ לָנוּ מַיִם וְנִשְׁתֶּה\"\nשאלה: מה ענה משה לדרישה הזו, ומדוע נקרא המקום \"מסה ומריבה\"?", "a": "משה ענה \"מה תריבון עמדי מה תנסון את ה'\". המקום נקרא \"מסה ומריבה\" על ריב בני ישראל ועל נסותם את ה' לאמור \"היש ה' בקרבנו אם אין\" (שמות י\"ז:ב', ז')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְהִכִּיתָ בַצּוּר וְיָצְאוּ מִמֶּנּוּ מַיִם\"\nשאלה: מי אומר את הדברים האלה ולמי? ולעיני מי בוצעה הפעולה המתוארת?", "a": "ה' אומר למשה. הפעולה בוצעה לעיני זקני ישראל - לא לעיני כל העם, אלא רק הזקנים (שמות י\"ז:ה'-ו')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"בְּחַר לָנוּ אֲנָשִׁים וְצֵא הִלָּחֵם\"\nשאלה: מי אומר את הדברים האלה ולמי?", "a": "משה אומר ליהושע - זו הפעם הראשונה שיהושע מוזכר בתנ\"ך, ומשה ממנה אותו כמפקד המלחמה בעמלק (שמות י\"ז:ט')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"כַּאֲשֶׁר יָרִים מֹשֶׁה יָדוֹ וְגָבַר יִשְׂרָאֵל\"\nשאלה: כיצד נפתרה הבעיה שנוצרה מהמצב המתואר בפסוק?", "a": "\"ויקחו אבן וישימו תחתיו וישב עליה ואהרן וחור תמכו בידיו מזה אחד ומזה אחד, ויהי ידיו אמונה עד בוא השמש\" (שמות י\"ז:י\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיַּחֲלֹשׁ יְהוֹשֻׁעַ אֶת עֲמָלֵק\"\nשאלה: מה ציווה ה' לעשות מיד אחרי הניצחון המתואר כאן?", "a": "\"כתוב זאת זיכרון בספר ושים באוזני יהושע כי מחה אמחה את זכר עמלק מתחת השמים\" - ומשה בנה מזבח וקרא שמו \"ה' נסי\" (שמות י\"ז:י\"ד-ט\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"לְהָמִית אֹתִי וְאֶת בָּנַי בַּצָּמָא\"\nשאלה: מה אמר משה לה' בתגובה לתלונת העם המתוארת כאן?", "a": "\"מה אעשה לעם הזה עוד מעט וסקלוני\" - משה חשש שהעם עומד לסקול אותו (שמות י\"ז:ד')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיָּבֹא עֲמָלֵק וַיִּלָּחֶם עִם יִשְׂרָאֵל\"\nשאלה: מי עלו עם משה לראש הגבעה בזמן שיהושע נלחם למטה?", "a": "\"ומשה אהרן וחור עלו ראש הגבעה\" - אהרן וחור עלו עם משה (שמות י\"ז:י')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"כְּתֹב זֹאת זִכָּרוֹן בַּסֵּפֶר\"\nשאלה: מה ציווה ה' לכתוב, ומה עשה משה מיד לאחר הניצחון?", "a": "ה' ציווה לכתוב את זכר מחיית עמלק: \"כי מחה אמחה את זכר עמלק מתחת השמים\". משה בנה מזבח וקרא שמו \"ה' נסי\" (שמות י\"ז:י\"ד-ט\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"עוֹד מְעַט וּסְקָלֻנִי\"\nשאלה: מי אמר את הדברים האלה ולמי? מה הביא אותו לחשוש כך?", "a": "משה צעק לה'. העם צמא ברפידים ולן על משה: \"למה זה העליתנו ממצרים להמית אותי ואת בני ואת מקני בצמא\" - משה חשש שהעם עומד לסקול אותו (שמות י\"ז:ד')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן\"\nשאלה: הביטוי הזה מסביר את שם המקום. מה שם המקום ומה שני חלקי השם מייצגים?", "a": "\"ויקרא שם המקום מסה ומריבה\" - \"מסה\" על שם שניסו את ה' (שאלו \"היש ה' בקרבנו\"), ו\"מריבה\" על שם שרבו עם משה (שמות י\"ז:ז')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וּמַטְּךָ אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר\"\nשאלה: ה' מתאר את המטה כמטה שהכה את היאור. באיזו מכה הכה המטה את היאור?", "a": "מכת דם - אהרן הרים את המטה והכה את המים אשר ביאור לעיני פרעה ולעיני עבדיו, והמים הפכו לדם (שמות ז':כ'). כאן ה' מזכיר את אותו מטה כדי להכות בצור ולהוציא מים (שמות י\"ז:ה')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"כִּי יָד עַל כֵּס יָהּ\"\nשאלה: מתי נאמרו הדברים האלה - לפני המלחמה, במהלכה, או אחריה? ומי אמר?", "a": "הדברים נאמרו אחרי המלחמה, אחרי שמשה בנה מזבח וקרא שמו \"ה' נסי\". זהו הפסוק האחרון בפרק י\"ז, שמכריז על מלחמת ה' בעמלק לדורי דורות (שמות י\"ז:ט\"ז)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיַּעַשׂ יְהוֹשֻׁעַ כַּאֲשֶׁר אָמַר לוֹ\"\nשאלה: מי נזכר בפסוק שעלה עם משה לראש הגבעה? ומהו \"חור\" - איפה הוא מופיע לראשונה?", "a": "\"ומשה אהרן וחור עלו ראש הגבעה\" - אהרן וחור. זו ההופעה הראשונה של חור בתנ\"ך. הוא תמך ביד משה מצד אחד ואהרן מהצד השני (שמות י\"ז:י')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וִידֵי מֹשֶׁה כְּבֵדִים\"\nשאלה: מה עשו כדי לפתור את הבעיה של ידי משה הכבדות?", "a": "\"ויקחו אבן וישימו תחתיו וישב עליה ואהרן וחור תמכו בידיו מזה אחד ומזה אחד\" - ישב על אבן ושניים תמכו בידיו (שמות י\"ז:י\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"יְהוָה נִסִּי\"\nשאלה: מה זה \"ה' נסי\"? ומי בנה אותו?", "a": "זה שם המזבח שמשה בנה אחרי הניצחון על עמלק - \"ויבן משה מזבח ויקרא שמו ה' נסי\" (שמות י\"ז:ט\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"מַה תְּרִיבוּן עִמָּדִי\"\nשאלה: מי אמר את זה ולמי? ומה הוסיף מיד אחרי?", "a": "משה אמר לבני ישראל שדרשו מים. הוסיף \"מה תנסון את ה'\" - האשים אותם שבנוסף לריב עמו, הם גם מנסים את ה' (שמות י\"ז:ב')", "source": "text_questions/shemot.md", "type": "text"}]}, "bamidbar": {"name": "במדבר", "story": [{"q": "1. מה קרה כשהעם התאונן, ומה שם המקום שנקרא בעקבות זאת?", "a": "אש ה' בערה בקצה המחנה. המקום נקרא \"תבערה\" כי בערה בם אש ה'.", "source": "01 complainers and quail", "type": "story"}, {"q": "2. מי התפלל לה' כדי שהאש תשקע?", "a": "משה התפלל אל ה' והאש שקעה.", "source": "01 complainers and quail", "type": "story"}, {"q": "3. מי היו ה\"אספסוף\" ומה הם רצו?", "a": "האספסוף הוא הערב רב שהצטרף לישראל ביציאת מצרים. הם התאוו תאווה וביקשו בשר.", "source": "01 complainers and quail", "type": "story"}, {"q": "4. אילו מאכלים מצרים זכר העם בתלונתו? (מנה את כולם)", "a": "הדגה, הקישואים, האבטיחים, החציר, הבצלים והשומים.", "source": "01 complainers and quail", "type": "story"}, {"q": "5. כיצד תיאר הכתוב את המן?", "a": "המן היה כזרע גד ועינו כעין הבדולח. העם לקט אותו, טחן ברחיים או דך במדוכה, בישל בפרור ועשה עוגות, וטעמו כטעם לשד השמן.", "source": "01 complainers and quail", "type": "story"}, {"q": "6. מה ביקש משה מה' כשלא יכול לשאת את משא העם לבדו?", "a": "משה ביקש מה' שיהרגהו: \"הרגני נא הרוג אם מצאתי חן בעיניך ואל אראה ברעתי\".", "source": "01 complainers and quail", "type": "story"}, {"q": "7. כמה זקנים ציווה ה' את משה לאסוף, ומה היה תפקידם?", "a": "שבעים איש מזקני ישראל. תפקידם היה לשאת עם משה את משא העם.", "source": "01 complainers and quail", "type": "story"}, {"q": "8. מה קרה לשבעים הזקנים כשנאספו סביב אוהל מועד?", "a": "ה' ירד בענן, אצל מן הרוח שעל משה ונתן עליהם, והם התנבאו ולא יספו (לא הוסיפו להתנבאות).", "source": "01 complainers and quail", "type": "story"}, {"q": "9. מי הם אלדד ומידד, ומה המיוחד בהם?", "a": "שני זקנים שנשארו במחנה ולא יצאו לאוהל מועד, אך הרוח נחה עליהם והתנבאו במחנה.", "source": "01 complainers and quail", "type": "story"}, {"q": "10. מה ביקש יהושע בן נון ממשה בנוגע לאלדד ומידד?", "a": "יהושע ביקש ממשה לכלוא אותם (\"אדני משה כלאם\").", "source": "01 complainers and quail", "type": "story"}, {"q": "11. מה ענה משה ליהושע כשביקש לכלוא את אלדד ומידד?", "a": "\"המקנא אתה לי ומי יתן כל עם ה' נביאים כי יתן ה' את רוחו עליהם\" - ביטוי לענוותנותו של משה.", "source": "01 complainers and quail", "type": "story"}, {"q": "12. כמה זמן אמור היה העם לאכול בשר לפי דבר ה'?", "a": "חודש ימים, עד שייצא מאפם ויהיה להם לזרא (לגועל).", "source": "01 complainers and quail", "type": "story"}, {"q": "13. כמה רגלי (גברים) היו בעם ישראל לפי דברי משה?", "a": "שש מאות אלף רגלי.", "source": "01 complainers and quail", "type": "story"}, {"q": "14. מה היה טווח פיזור השלווים סביב המחנה, ובאיזה גובה היו?", "a": "כדרך יום מכל צד סביב המחנה, ובגובה כאמתיים (כמטר) על פני הארץ.", "source": "01 complainers and quail", "type": "story"}, {"q": "15. מהי הכמות המינימלית של שלו שאסף כל אדם?", "a": "הממעיט אסף עשרה חומרים.", "source": "01 complainers and quail", "type": "story"}, {"q": "16. מה קרה לעם בזמן שאכלו את הבשר?", "a": "בעוד הבשר בין שיניהם, טרם יכרת, אף ה' חרה בעם והכה אותם מכה רבה מאוד.", "source": "01 complainers and quail", "type": "story"}, {"q": "17. מדוע נקרא המקום \"קברות התאווה\"?", "a": "כי שם קברו את העם המתאווים שנענשו על תאוות הבשר.", "source": "01 complainers and quail", "type": "story"}, {"q": "18. לאן נסעו בני ישראל מקברות התאווה?", "a": "לחצרות.", "source": "01 complainers and quail", "type": "story"}, {"q": "19. מאיזה פסוק: \"הֲיַד יְהוָה תִּקְצָר\"?", "a": "פסוק כ\"ג - תשובת ה' למשה כשתהה כיצד יספק בשר לשש מאות אלף איש.", "source": "01 complainers and quail", "type": "story"}, {"q": "20. כיצד תיאר הכתוב את יהושע בן נון בפרק זה?", "a": "\"משרת משה מבחוריו\" - משרת משה מנעוריו.", "source": "01 complainers and quail", "type": "story"}, {"q": "21. ⭐⭐ מהם חמשת מאכלי מצרים שהעם התגעגע אליהם (לפי הסדר)?", "a": "הדגה, הקישואים, האבטיחים, החציר, הבצלים והשומים (במדבר י\"א:ה').", "source": "01 complainers and quail", "type": "story"}, {"q": "22. ⭐⭐⭐ כמה זמן אסף העם את השלו ומתי?", "a": "\"כל היום ההוא וכל הלילה וכל יום המחרת\" - יום שלם, לילה שלם ועוד יום (במדבר י\"א:ל\"ב).", "source": "01 complainers and quail", "type": "story"}, {"q": "23. ⭐⭐⭐ מה היה טעם המן?", "a": "\"כטעם לשד השמן\" (במדבר י\"א:ח').", "source": "01 complainers and quail", "type": "story"}, {"q": "24. ⭐⭐⭐ מתי ירד המן ומתי?", "a": "\"וברדת הטל על המחנה לילה ירד המן עליו\" - המן ירד בלילה יחד עם הטל (במדבר י\"א:ט').", "source": "01 complainers and quail", "type": "story"}, {"q": "1. ⭐ \"מִי יַאֲכִלֵנוּ בָּשָׂר\"", "a": "**מי אמר:** בני ישראל (האספסוף)\n**למי:** משה (תלונה כללית)\n**הקשר:** תלונת העם על המן ובקשת בשר במדבר (במדבר י\"א:ד')", "source": "01 complainers and quail", "type": "story"}, {"q": "2. ⭐⭐ \"מֵאַיִן לִי בָּשָׂר לָתֵת לְכָל הָעָם הַזֶּה\"", "a": "**מי אמר:** משה\n**למי:** ה'\n**הקשר:** תלונת משה לה' שאינו יכול לשאת את נטל העם לבדו (במדבר י\"א:י\"ג)", "source": "01 complainers and quail", "type": "story"}, {"q": "3. ⭐⭐⭐ \"אֲדֹנִי מֹשֶׁה כְּלָאֵם\"", "a": "**מי אמר:** יהושע בן נון\n**למי:** משה\n**הקשר:** יהושע מבקש ממשה לכלוא את אלדד ומידד שמתנבאים במחנה (במדבר י\"א:כ\"ח)", "source": "01 complainers and quail", "type": "story"}, {"q": "4. ⭐⭐⭐ \"הֲיַד יְהוָה תִּקְצָר\"", "a": "**מי אמר:** ה'\n**למי:** משה\n**הקשר:** תשובת ה' למשה כשתהה כיצד יספיק בשר לשש מאות אלף איש (במדבר י\"א:כ\"ג)", "source": "01 complainers and quail", "type": "story"}, {"q": "1. ⭐⭐ התנבא במחנה ולא יצא אל האוהל, גם חברו התנבא, יהושע ביקש לכלוא אותם", "a": "**הדמות:** אלדד (ומידד)\n**ספר:** במדבר\n**הקשר:** אלדד ומידד נשארו במחנה ומתנבאים, יהושע רצה לעצור אותם, ומשה אמר \"מי ייתן כל עם ה' נביאים\" (פרק י\"א)", "source": "01 complainers and quail", "type": "story"}, {"q": "2. ⭐⭐⭐ ערב רב שהצטרף לישראל, הם יזמו את התאווה לבשר, גרמו לכל העם לבכות", "a": "**הדמות:** האספסוף\n**ספר:** במדבר\n**הקשר:** \"והאספסוף אשר בקרבו התאוו תאווה וישובו ויבכו גם בני ישראל\" (פרק י\"א:ד')", "source": "01 complainers and quail", "type": "story"}, {"q": "3. ⭐⭐⭐ נער שרץ לספר למשה על נבואה בלתי צפויה במחנה", "a": "**הדמות:** הנער (לא נקרא בשם)\n**ספר:** במדבר\n**הקשר:** \"וירץ הנער ויגד למשה ויאמר אלדד ומידד מתנבאים במחנה\" (פרק י\"א:כ\"ז)", "source": "01 complainers and quail", "type": "story"}, {"q": "1. ⭐⭐ אלדד ומידד התנבאו באוהל מועד עם שבעים הזקנים. נכון או לא נכון?", "a": "**לא נכון.** אלדד ומידד נשארו במחנה ולא יצאו אל האוהל, אך התנבאו בכל זאת במחנה: \"וישארו שני אנשים במחנה... ויתנבאו במחנה\" (במדבר י\"א:כ\"ו).", "source": "01 complainers and quail", "type": "story"}, {"q": "2. ⭐⭐⭐ שבעים הזקנים המשיכו להתנבא לאחר שהרוח נחה עליהם. נכון או לא נכון?", "a": "**לא נכון.** הכתוב אומר במפורש \"ויתנבאו ולא יספו\" (במדבר י\"א:כ\"ה) - כלומר, התנבאו באותה פעם בלבד ולא הוסיפו להתנבאות.", "source": "01 complainers and quail", "type": "story"}, {"q": "3. ⭐⭐⭐ העם אכל את השלו וה' הכה בהם רק לאחר חודש ימים. נכון או לא נכון?", "a": "**לא נכון.** למרות שה' אמר שיאכלו בשר \"חודש ימים\", בפועל \"הבשר עודנו בין שיניהם טרם יכרת ואף ה' חרה בעם\" (במדבר י\"א:ל\"ג) - כלומר, המכה באה כבר בעודם אוכלים, לפני שהספיקו לסיים.", "source": "01 complainers and quail", "type": "story"}, {"q": "4. ⭐⭐⭐ \"הֶאָנֹכִי הָרִיתִי אֵת כָּל הָעָם הַזֶּה אִם אָנֹכִי יְלִדְתִּיהוּ\"", "a": "**מי אמר:** משה\n**למי:** ה'\n**הקשר:** משה מתלונן על כובד משא העם ומבקש שלא ישאנו לבדו, כאילו הוא אביו או אמו של העם (במדבר י\"א:י\"ב)", "source": "01 complainers and quail", "type": "story"}, {"q": "1. ⭐⭐ \"הַמְקַנֵּא אַתָּה לִי וּמִי יִתֵּן כָּל עַם יְהוָה _____ כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם\"", "a": "**מילה חסרה:** נְבִיאִים\n**מי אמר:** משה\n**הקשר:** תשובת משה ליהושע כשביקש לכלוא את אלדד ומידד (במדבר י\"א:כ\"ט)", "source": "01 complainers and quail", "type": "story"}, {"q": "2. ⭐⭐ \"וַיִּקְרָא אֶת שֵׁם הַמָּקוֹם הַהוּא _____ כִּי בָעֲרָה בָם אֵשׁ יְהוָה\"", "a": "**מילה חסרה:** תַּבְעֵרָה\n**מי אמר:** הכתוב (תיאור)\n**הקשר:** שם המקום שבו בערה אש ה' בקצה המחנה בגלל תלונות העם (במדבר י\"א:ג')", "source": "01 complainers and quail", "type": "story"}, {"q": "3. ⭐⭐⭐ \"עַד חֹדֶשׁ יָמִים עַד אֲשֶׁר יֵצֵא מֵאַפְּכֶם וְהָיָה לָכֶם _____ כִּי מְאַסְתֶּם אֶת יְהוָה\"", "a": "**מילה חסרה:** לְזָרָא\n**מי אמר:** ה'\n**הקשר:** ה' אומר לעם שיאכלו בשר עד שייצא מאפם ויהיה להם לגועל (במדבר י\"א:כ')", "source": "01 complainers and quail", "type": "story"}, {"q": "4. ⭐⭐⭐ \"וְהַמָּן כִּזְרַע גַּד הוּא וְעֵינוֹ כְּעֵין _____\"", "a": "**מילה חסרה:** הַבְּדֹלַח\n**מי אמר:** הכתוב (תיאור)\n**הקשר:** תיאור מראה המן (במדבר י\"א:ז')", "source": "01 complainers and quail", "type": "story"}, {"q": "5. ⭐⭐⭐ \"וְאָצַלְתִּי מִן הָרוּחַ אֲשֶׁר עָלֶיךָ וְשַׂמְתִּי עֲלֵיהֶם וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם וְלֹא תִשָּׂא אַתָּה _____\"", "a": "**מילה חסרה:** לְבַדֶּךָ\n**מי אמר:** ה'\n**הקשר:** ה' מבטיח למשה שהזקנים ישאו עמו את משא העם (במדבר י\"א:י\"ז)", "source": "01 complainers and quail", "type": "story"}, {"q": "1. על מה דיברו מרים ואהרן נגד משה?", "a": "על אודות האישה הכושית שלקח, ובנוסף טענו \"הרק אך במשה דיבר ה' הלא גם בנו דיבר\" - כלומר ראו עצמם שווים למשה ברמת הנבואה.", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "2. מי היה/היתה היוזם/ת של הדיבור נגד משה, וכיצד אנו יודעים זאת?", "a": "מרים היתה היוזמת. הפועל \"ותדבר\" כתוב בלשון נקבה יחיד למרות ששניהם מוזכרים.", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "3. כיצד מתאר הכתוב את משה בפסוק ג'?", "a": "\"והאיש משה עניו מאוד מכל האדם אשר על פני האדמה\".", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "4. לאן קרא ה' את משה, אהרן ומרים?", "a": "לאוהל מועד. ה' אמר להם \"צאו שלשתכם אל אוהל מועד\".", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "5. כיצד ירד ה' לדבר עם אהרן ומרים?", "a": "ה' ירד בעמוד ענן ועמד פתח האוהל, וקרא לאהרן ומרים ויצאו שניהם.", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "6. מה ההבדל בין נבואת משה לנבואת שאר הנביאים לפי דברי ה'?", "a": "לנביאים אחרים ה' מתגלה במראה ובחלום, אך עם משה הוא מדבר \"פה אל פה\", \"ומראה ולא בחידות ותמונת ה' יביט\".", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "7. כיצד כינה ה' את משה בדבריו למרים ואהרן?", "a": "\"עבדי משה, בכל ביתי נאמן הוא\".", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "8. מה היה עונשה של מרים?", "a": "מרים לקתה בצרעת כשלג והוסגרה שבעת ימים מחוץ למחנה.", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "9. מדוע אהרן לא נענש בצרעת כמו מרים?", "a": "לפי הכתוב, מרים היתה היוזמת העיקרית (הפועל \"ותדבר\" בלשון נקבה יחיד). אהרן הכיר בחטאו ואמר \"אשר נואלנו ואשר חטאנו\".", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "10. מה אמר אהרן למשה כשראה את מרים מצורעת?", "a": "\"בי אדני אל נא תשת עלינו חטאת אשר נואלנו ואשר חטאנו. אל נא תהי כמת אשר בצאתו מרחם אמו ויאכל חצי בשרו.\"", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "11. מהי התפילה הקצרה שהתפלל משה לרפואת מרים?", "a": "\"אל נא רפא נא לה\" - חמש מילים בלבד, אחת התפילות הקצרות ביותר בתנ\"ך.", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "12. כמה ימים הוסגרה מרים מחוץ למחנה?", "a": "שבעת ימים.", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "13. מה עשה העם בזמן שמרים הוסגרה מחוץ למחנה?", "a": "העם לא נסע עד שמרים נאספה חזרה למחנה. כל העם המתין לה.", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "14. מה הקל וחומר שה' השתמש בו כלפי מרים?", "a": "\"ואביה ירוק ירק בפניה הלא תכלם שבעת ימים\" - אם אביה היה יורק בפניה, היתה מתביישת שבעה ימים; קל וחומר כשה' כעס עליה.", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "15. לאן נסעו בני ישראל אחרי שמרים נאספה חזרה?", "a": "נסעו מחצרות וחנו במדבר פארן.", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "16. באיזה מקום התרחש כל סיפור מרים ואהרן?", "a": "בחצרות.", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "17. מאיזה פסוק: \"פֶּה אֶל פֶּה אֲדַבֶּר בּוֹ וּמַרְאֶה וְלֹא בְחִידֹת\"?", "a": "פסוק ח' - תיאור ה' של ייחוד נבואת משה.", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "18. מדוע לא הגיב משה לעלבון מרים ואהרן?", "a": "כי משה היה עניו מאוד מכל האדם אשר על פני האדמה.", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "19. ⭐⭐ כמה אנשים נקראו לצאת אל אוהל מועד?", "a": "שלושה: משה, אהרן ומרים. \"צאו שלשתכם אל אוהל מועד\" (במדבר י\"ב:ד').", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "20. ⭐⭐⭐ מהיכן נסעו בני ישראל ולאן חנו לאחר שמרים נאספה חזרה?", "a": "נסעו מחצרות וחנו במדבר פארן (במדבר י\"ב:ט\"ז).", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "21. ⭐⭐⭐ כיצד מתאר הכתוב את צרעת מרים?", "a": "\"מצורעת כשלג\" (במדבר י\"ב:י').", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "1. ⭐⭐ \"הֲרַק אַךְ בְּמֹשֶׁה דִּבֶּר ה'\"", "a": "**מי אמר:** מרים ואהרן\n**למי:** (ביניהם, כנגד משה)\n**הקשר:** מרים ואהרן מדברים נגד משה בגלל האישה הכושית (במדבר י\"ב:ב')", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "2. ⭐⭐⭐ \"אֵל נָא רְפָא נָא לָהּ\"", "a": "**מי אמר:** משה\n**למי:** ה'\n**הקשר:** תפילת משה הקצרה לרפואת מרים מצרעתה, חמש מילים בלבד (במדבר י\"ב:י\"ג)", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "3. ⭐⭐⭐ \"לֹא כֵן עַבְדִּי מֹשֶׁה בְּכָל בֵּיתִי נֶאֱמָן הוּא\"", "a": "**מי אמר:** ה'\n**למי:** אהרן ומרים\n**הקשר:** ה' מסביר את ייחוד משה ומבדיל אותו משאר הנביאים (במדבר י\"ב:ז')", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "1. ⭐ דיבר/ה נגד אחיו/ה בגלל אשתו הכושית, נענש/ה בצרעת שבעה ימים, נביאה", "a": "**הדמות:** מרים\n**ספר:** במדבר\n**הקשר:** מרים דיברה באהרן נגד משה בגלל האישה הכושית, נענשה בצרעת ונסגרה מחוץ למחנה שבעה ימים (פרק י\"ב)", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "2. ⭐⭐⭐ עניו מכל אדם, נבואתו ייחודית \"פה אל פה\", לא הגיב לעלבון אחיו ואחותו, התפלל לרפואתה", "a": "**הדמות:** משה\n**ספר:** במדבר\n**הקשר:** משה מתואר כ\"עניו מאוד מכל האדם\", נבואתו ייחודית (\"פה אל פה... ולא בחידות\"), לא הגיב לדיבור מרים ואהרן נגדו, והתפלל \"אל נא רפא נא לה\" (פרק י\"ב)", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "1. ⭐⭐⭐ ה' ירד בעמוד אש וקרא לאהרן ומרים. נכון או לא נכון?", "a": "**לא נכון.** ה' ירד בעמוד **ענן** ולא בעמוד אש: \"וירד ה' בעמוד ענן ויעמוד פתח האהל ויקרא אהרן ומרים\" (במדבר י\"ב:ה').", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "2. ⭐⭐⭐ גם אהרן נענש בצרעת כמו מרים. נכון או לא נכון?", "a": "**לא נכון.** רק מרים נענשה בצרעת: \"והנה מרים מצורעת כשלג\" (במדבר י\"ב:י'). אהרן לא לקה בצרעת אלא הכיר בחטאו ופנה למשה: \"אשר נואלנו ואשר חטאנו\".", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "3. ⭐⭐⭐ משה נקרא לאוהל מועד בנפרד מאהרן ומרים. נכון או לא נכון?", "a": "**לא נכון.** שלושתם נקראו יחד: \"צאו שלשתכם אל אוהל מועד ויצאו שלשתם\" (במדבר י\"ב:ד'). אך לאחר מכן ה' קרא לאהרן ומרים בנפרד: \"ויקרא אהרן ומרים ויצאו שניהם\" (י\"ב:ה').", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "4. ⭐⭐⭐ \"אַל נָא תְהִי כַּמֵּת אֲשֶׁר בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ וַיֵּאָכֵל חֲצִי בְשָׂרוֹ\"", "a": "**מי אמר:** אהרן\n**למי:** משה\n**הקשר:** אהרן מתחנן למשה שלא ישאיר את מרים במצב הצרעת, ומשווה אותה לוולד מת שחצי בשרו אכול (במדבר י\"ב:י\"ב)", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "1. ⭐⭐ \"וְהָאִישׁ מֹשֶׁה _____ מְאֹד מִכֹּל הָאָדָם אֲשֶׁר עַל פְּנֵי הָאֲדָמָה\"", "a": "**מילה חסרה:** עָנָיו\n**מי אמר:** הכתוב (תיאור)\n**הקשר:** תיאור תכונתו המרכזית של משה (במדבר י\"ב:ג')", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "2. ⭐⭐ \"פֶּה אֶל פֶּה אֲדַבֶּר בּוֹ וּמַרְאֶה וְלֹא בְ_____ וּתְמֻנַת יְהוָה יַבִּיט\"", "a": "**מילה חסרה:** חִידֹת\n**מי אמר:** ה'\n**הקשר:** ה' מתאר את ייחוד נבואת משה לעומת שאר הנביאים (במדבר י\"ב:ח')", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "3. ⭐⭐⭐ \"וְאָבִיהָ יָרֹק יָרַק בְּפָנֶיהָ הֲלֹא תִכָּלֵם _____ יָמִים\"", "a": "**מילה חסרה:** שִׁבְעַת\n**מי אמר:** ה'\n**הקשר:** קל וחומר של ה' על עונש מרים - אם אביה היה יורק בפניה היתה נכלמת שבעת ימים (במדבר י\"ב:י\"ד)", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "4. ⭐⭐⭐ \"לֹא כֵן עַבְדִּי מֹשֶׁה בְּכָל _____ נֶאֱמָן הוּא\"", "a": "**מילה חסרה:** בֵּיתִי\n**מי אמר:** ה'\n**הקשר:** ה' מכנה את משה \"נאמן בכל ביתי\" ומבדיל אותו משאר הנביאים (במדבר י\"ב:ז')", "source": "02 miriam and aharon speak against moshe", "type": "story"}, {"q": "1. כמה מרגלים נשלחו לתור את הארץ, וכיצד נבחרו?", "a": "שנים עשר מרגלים, איש אחד מכל שבט, כולם נשיאים.", "source": "03 sin of the spies", "type": "story"}, {"q": "2. מהיכן נשלחו המרגלים?", "a": "ממדבר פארן.", "source": "03 sin of the spies", "type": "story"}, {"q": "3. מה היה שמו המקורי של יהושע בן נון, ומי שינה את שמו?", "a": "שמו המקורי היה הושע בן נון, ומשה קרא לו יהושע.", "source": "03 sin of the spies", "type": "story"}, {"q": "4. מאיזה שבט היה כלב בן יפונה?", "a": "משבט יהודה.", "source": "03 sin of the spies", "type": "story"}, {"q": "5. כמה ימים תרו המרגלים את הארץ?", "a": "ארבעים יום.", "source": "03 sin of the spies", "type": "story"}, {"q": "6. מהם הגבולות שבין תרו המרגלים את הארץ?", "a": "ממדבר צין (בדרום) עד רחוב לבוא חמת (בצפון).", "source": "03 sin of the spies", "type": "story"}, {"q": "7. מי הם שלושת ילידי הענק שישבו בחברון?", "a": "אחימן, ששי ותלמי.", "source": "03 sin of the spies", "type": "story"}, {"q": "8. כמה שנים לפני צוען מצרים נבנתה חברון?", "a": "שבע שנים.", "source": "03 sin of the spies", "type": "story"}, {"q": "9. אילו פירות כרתו המרגלים בנחל אשכול?", "a": "אשכול ענבים גדול שנשאוהו במוט בשניים, ורימונים ותאנים.", "source": "03 sin of the spies", "type": "story"}, {"q": "10. מה אמר כלב כשניסה לעודד את העם?", "a": "\"עלה נעלה וירשנו אותה כי יכול נוכל לה\".", "source": "03 sin of the spies", "type": "story"}, {"q": "11. כיצד תיארו המרגלים את עצמם בעיני ילידי הענק?", "a": "\"ונהי בעינינו כחגבים וכן היינו בעיניהם\".", "source": "03 sin of the spies", "type": "story"}, {"q": "12. כיצד כינו המרגלים את הארץ בדיבתם הרעה?", "a": "\"ארץ אוכלת יושביה היא\".", "source": "03 sin of the spies", "type": "story"}, {"q": "13. מה הציעו בני ישראל לעשות לאחר שמיעת דיבת המרגלים?", "a": "\"נתנה ראש ונשובה מצרימה\" - למנות מנהיג חדש ולחזור למצרים.", "source": "03 sin of the spies", "type": "story"}, {"q": "14. מה עשו יהושע וכלב כשהעם רצה לחזור למצרים?", "a": "קרעו את בגדיהם ואמרו לעם \"טובה הארץ מאוד מאוד... סר צלם מעליהם וה' אתנו אל תיראום\".", "source": "03 sin of the spies", "type": "story"}, {"q": "15. מה הציע ה' למשה לעשות עם העם, ומה ענה משה?", "a": "ה' הציע להכות את העם בדבר ולעשות ממשה גוי גדול. משה התפלל וביקש סליחה, והזכיר את י\"ג מידות הרחמים ושהגויים ישמעו ויאמרו \"מבלתי יכולת ה' להביא את העם הזה אל הארץ\".", "source": "03 sin of the spies", "type": "story"}, {"q": "16. מה ענה ה' לתפילת משה?", "a": "\"סלחתי כדברך\" - סלח לעם אך גזר עונש.", "source": "03 sin of the spies", "type": "story"}, {"q": "17. מהו העונש שנגזר על דור המדבר?", "a": "כל הגברים מבן עשרים שנה ומעלה ימותו במדבר ולא יראו את הארץ, מלבד כלב ויהושע. נגזרו ארבעים שנה של נדודים - יום לשנה על כל יום מארבעים ימי הריגול.", "source": "03 sin of the spies", "type": "story"}, {"q": "18. כיצד תיאר ה' את כלב בן יפונה?", "a": "\"עבדי כלב עקב היתה רוח אחרת עמו וימלא אחרי\" - היתה בו רוח שונה ומילא אחר ה'.", "source": "03 sin of the spies", "type": "story"}, {"q": "19. מה קרה לעשרת המרגלים שהוציאו דיבה רעה?", "a": "מתו מיד במגפה לפני ה'.", "source": "03 sin of the spies", "type": "story"}, {"q": "20. מי הם \"המעפילים\" ומה עלה בגורלם?", "a": "חלק מהעם שניסו למחרת לעלות בכוח אל ראש ההר למרות אזהרת משה, בלי שארון ברית ה' ומשה יצאו מהמחנה. העמלקי והכנעני הכו אותם עד החרמה.", "source": "03 sin of the spies", "type": "story"}, {"q": "21. ⭐⭐ מהם שלושת סוגי הפירות שהמרגלים הביאו מנחל אשכול?", "a": "ענבים (אשכול ענבים שנשאוהו במוט בשניים), רימונים ותאנים (במדבר י\"ג:כ\"ג).", "source": "03 sin of the spies", "type": "story"}, {"q": "22. ⭐⭐⭐ מי היה המרגל של שבט בנימין?", "a": "פלטי בן רפוא (במדבר י\"ג:ט').", "source": "03 sin of the spies", "type": "story"}, {"q": "23. ⭐⭐⭐ כמה פעמים ניסו ישראל את ה' לפי דבריו?", "a": "עשר פעמים: \"וינסו אותי זה עשר פעמים ולא שמעו בקולי\" (במדבר י\"ד:כ\"ב).", "source": "03 sin of the spies", "type": "story"}, {"q": "24. ⭐⭐ מהו הגיל ממנו ומעלה נגזרה מיתה במדבר?", "a": "מבן עשרים שנה ומעלה: \"מבן עשרים שנה ומעלה אשר הלינותם עלי\" (במדבר י\"ד:כ\"ט).", "source": "03 sin of the spies", "type": "story"}, {"q": "1. ⭐⭐ \"אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ הִיא\"", "a": "**מי אמר:** עשרת המרגלים (מוציאי דיבת הארץ)\n**למי:** בני ישראל\n**הקשר:** דיבת המרגלים על ארץ כנען (במדבר י\"ג:ל\"ב)", "source": "03 sin of the spies", "type": "story"}, {"q": "2. ⭐ \"עָלֹה נַעֲלֶה וְיָרַשְׁנוּ אֹתָהּ כִּי יָכוֹל נוּכַל לָהּ\"", "a": "**מי אמר:** כלב בן יפונה\n**למי:** בני ישראל\n**הקשר:** כלב מעודד את העם לעלות לארץ כנגד דעת שאר המרגלים (במדבר י\"ג:ל')", "source": "03 sin of the spies", "type": "story"}, {"q": "3. ⭐⭐ \"לוּ מַתְנוּ בְּאֶרֶץ מִצְרַיִם\"", "a": "**מי אמר:** בני ישראל (כל העדה)\n**למי:** משה ואהרן\n**הקשר:** בכי העם לאחר שמיעת דיבת המרגלים הרעה (במדבר י\"ד:ב')", "source": "03 sin of the spies", "type": "story"}, {"q": "4. ⭐⭐⭐ \"סָלַחְתִּי כִּדְבָרֶךָ\"", "a": "**מי אמר:** ה'\n**למי:** משה\n**הקשר:** ה' סולח לעם בעקבות תפילת משה לאחר חטא המרגלים (במדבר י\"ד:כ')", "source": "03 sin of the spies", "type": "story"}, {"q": "1. ⭐ ריגל את הארץ והביא דיבה רעה, היה מנהיג שבט, מת במגפה לפני ה'", "a": "**הדמות:** המרגלים (עשרת המרגלים שהביאו דיבה)\n**ספר:** במדבר\n**הקשר:** עשרה מרגלים הביאו דיבה רעה על הארץ ואמרו \"לא נוכל לעלות\", מתו במגפה. רק כלב ויהושע ניצלו (פרקים י\"ג-י\"ד)", "source": "03 sin of the spies", "type": "story"}, {"q": "2. ⭐ ריגל את הארץ, אמר \"עלה נעלה\", היה משבט יהודה, נכנס לארץ ישראל", "a": "**הדמות:** כלב בן יפונה\n**ספר:** במדבר\n**הקשר:** כלב היה מרגל משבט יהודה, התנגד לדיבת המרגלים ואמר \"עלה נעלה וירשנו אותה\", ונבחר יחד עם יהושע להיכנס לארץ (פרקים י\"ג-י\"ד)", "source": "03 sin of the spies", "type": "story"}, {"q": "3. ⭐⭐⭐ שמו שונה על ידי משה, היה משבט אפרים, ריגל את הארץ, קרע בגדיו עם כלב, ניצל מעונש המרגלים", "a": "**הדמות:** יהושע בן נון (הושע בן נון)\n**ספר:** במדבר\n**הקשר:** משה שינה שמו מהושע ליהושע (י\"ג:ט\"ז), היה מרגל שבט אפרים, קרע בגדיו עם כלב ואמר \"טובה הארץ מאוד מאוד\", חי מכל המרגלים (פרקים י\"ג-י\"ד)", "source": "03 sin of the spies", "type": "story"}, {"q": "1. ⭐ המרגלים ריגלו את הארץ 40 יום, ובגלל חטאם נגזר על ישראל 40 שנות נדודים. נכון או לא נכון?", "a": "**נכון.** \"ויתורו את הארץ... ארבעים יום\" (במדבר י\"ג:כ\"ה), ו\"במספר הימים אשר תרתם את הארץ ארבעים יום יום לשנה יום לשנה תשאו את עוונותיכם ארבעים שנה\" (במדבר י\"ד:ל\"ד).", "source": "03 sin of the spies", "type": "story"}, {"q": "2. ⭐⭐ משה שלח 10 מרגלים לתור את הארץ. נכון או לא נכון?", "a": "**לא נכון.** משה שלח 12 מרגלים - נשיא אחד מכל שבט: \"שנים עשר אנשים איש אחד לשבט\" (במדבר י\"ג:ב'-ט\"ז). עשרה מהם חזרו עם דיבה רעה, ורק יהושע וכלב נתנו דו\"ח חיובי.", "source": "03 sin of the spies", "type": "story"}, {"q": "3. ⭐⭐⭐ כלב היה מרגל שבט אפרים. נכון או לא נכון?", "a": "**לא נכון.** כלב בן יפונה היה מרגל שבט **יהודה** (במדבר י\"ג:ו'). המרגל של שבט אפרים היה הושע (יהושע) בן נון (י\"ג:ח').", "source": "03 sin of the spies", "type": "story"}, {"q": "4. ⭐⭐⭐ כשהמעפילים ניסו לעלות לארץ, ארון ברית ה' יצא עמהם מהמחנה. נכון או לא נכון?", "a": "**לא נכון.** הכתוב מדגיש שדווקא ארון ברית ה' ומשה **לא** זזו מקרב המחנה: \"וארון ברית ה' ומשה לא משו מקרב המחנה\" (במדבר י\"ד:מ\"ד), ולכן המעפילים הובסו.", "source": "03 sin of the spies", "type": "story"}, {"q": "5. ⭐⭐⭐ העם רצה לרגום את משה ואהרן באבנים. נכון או לא נכון?", "a": "**לא נכון.** העם רצה לרגום את **יהושע וכלב** באבנים, לא את משה ואהרן: \"ויאמרו כל העדה לרגום אותם באבנים\" (במדבר י\"ד:י') - כלומר את יהושע וכלב שניסו לעודד את העם.", "source": "03 sin of the spies", "type": "story"}, {"q": "6. ⭐⭐⭐ ה' הציע למשה להכות את העם בדבר ולעשות ממנו גוי גדול. נכון או לא נכון?", "a": "**נכון.** \"אכנו בדבר ואורישנו ואעשה אותך לגוי גדול ועצום ממנו\" (במדבר י\"ד:י\"ב). משה סירב והתפלל בעד העם.", "source": "03 sin of the spies", "type": "story"}, {"q": "5. ⭐⭐⭐ \"נִתְּנָה רֹאשׁ וְנָשׁוּבָה מִצְרָיְמָה\"", "a": "**מי אמר:** בני ישראל\n**למי:** איש אל אחיו\n**הקשר:** לאחר שמיעת דיבת המרגלים, העם מציע למנות מנהיג חדש ולחזור למצרים (במדבר י\"ד:ד')", "source": "03 sin of the spies", "type": "story"}, {"q": "6. ⭐⭐⭐ \"כִּי לַחְמֵנוּ הֵם סָר צִלָּם מֵעֲלֵיהֶם וַיהוָה אִתָּנוּ אַל תִּירָאֻם\"", "a": "**מי אמר:** יהושע וכלב\n**למי:** כל עדת בני ישראל\n**הקשר:** יהושע וכלב מנסים לשכנע את העם שלא לפחד מעמי הארץ ושה' איתם (במדבר י\"ד:ט')", "source": "03 sin of the spies", "type": "story"}, {"q": "1. ⭐⭐ \"וַנְּהִי בְעֵינֵינוּ כַּ_____ וְכֵן הָיִינוּ בְּעֵינֵיהֶם\"", "a": "**מילה חסרה:** חֲגָבִים\n**מי אמר:** עשרת המרגלים\n**הקשר:** דברי המרגלים על הנפילים בני ענק (במדבר י\"ג:ל\"ג)", "source": "03 sin of the spies", "type": "story"}, {"q": "2. ⭐⭐ \"הָאָרֶץ אֲשֶׁר עָבַרְנוּ בָהּ לָתוּר אֹתָהּ אֶרֶץ _____ יוֹשְׁבֶיהָ הִוא\"", "a": "**מילה חסרה:** אֹכֶלֶת\n**מי אמר:** עשרת המרגלים (מוציאי דיבת הארץ)\n**הקשר:** דיבת המרגלים הרעה על ארץ כנען (במדבר י\"ג:ל\"ב)", "source": "03 sin of the spies", "type": "story"}, {"q": "3. ⭐⭐⭐ \"וְעַבְדִּי כָלֵב עֵקֶב הָיְתָה רוּחַ _____ עִמּוֹ וַיְמַלֵּא אַחֲרָי\"", "a": "**מילה חסרה:** אַחֶרֶת\n**מי אמר:** ה'\n**הקשר:** ה' מתאר את כלב בן יפונה ומבטיח שייכנס לארץ (במדבר י\"ד:כ\"ד)", "source": "03 sin of the spies", "type": "story"}, {"q": "4. ⭐⭐⭐ \"יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה תִּשְׂאוּ אֶת עֲוֹנֹתֵיכֶם _____ שָׁנָה\"", "a": "**מילה חסרה:** אַרְבָּעִים\n**מי אמר:** ה'\n**הקשר:** הגזרה על דור המדבר, ארבעים שנות נדודים כנגד ארבעים ימי הריגול (במדבר י\"ד:ל\"ד)", "source": "03 sin of the spies", "type": "story"}, {"q": "5. ⭐⭐ \"סָלַחְתִּי _____\"", "a": "**מילה חסרה:** כִּדְבָרֶךָ\n**מי אמר:** ה'\n**הקשר:** תשובת ה' למשה, סליחה לעם אך עם עונש (במדבר י\"ד:כ')", "source": "03 sin of the spies", "type": "story"}, {"q": "1. מי היה קורח ומאיזה שבט?", "a": "קורח בן יצהר בן קהת בן לוי - משבט לוי.", "source": "04 korach rebellion", "type": "story"}, {"q": "2. מי הצטרפו לקורח במרד מלבד נשיאי העדה?", "a": "דתן ואבירם בני אליאב ואון בן פלת, כולם משבט ראובן.", "source": "04 korach rebellion", "type": "story"}, {"q": "3. כמה נשיאי עדה הצטרפו למרד קורח?", "a": "מאתיים וחמישים נשיאי עדה, קריאי מועד אנשי שם.", "source": "04 korach rebellion", "type": "story"}, {"q": "4. מה הייתה הטענה המרכזית של קורח ועדתו כנגד משה ואהרן?", "a": "\"כי כל העדה כולם קדושים ובתוכם ה' ומדוע תתנשאו על קהל ה'\" - שמשה ואהרן לקחו לעצמם יותר מדי סמכות.", "source": "04 korach rebellion", "type": "story"}, {"q": "5. מה הציע משה כדי להכריע מי הנבחר?", "a": "מבחן קטורת: כל אחד יקח מחתה, יתן בה אש וקטורת לפני ה', והאיש אשר יבחר ה' הוא הקדוש.", "source": "04 korach rebellion", "type": "story"}, {"q": "6. מה ענו דתן ואבירם כשמשה קרא להם?", "a": "\"לא נעלה\" - סירבו לבוא, והאשימו את משה שהעלם מ\"ארץ זבת חלב ודבש\" (כינוי למצרים!) כדי להמיתם במדבר ולהשתרר עליהם.", "source": "04 korach rebellion", "type": "story"}, {"q": "7. מה אמר משה לה' בתגובה לסירוב דתן ואבירם?", "a": "\"אל תפן אל מנחתם, לא חמור אחד מהם נשאתי ולא הרעותי את אחד מהם\".", "source": "04 korach rebellion", "type": "story"}, {"q": "8. כיצד נענשו קורח, דתן ואבירם?", "a": "האדמה פצתה את פיה ובלעה אותם ואת כל אשר להם, וירדו חיים שאולה.", "source": "04 korach rebellion", "type": "story"}, {"q": "9. מה קרה למאתיים וחמישים מקריבי הקטורת?", "a": "אש יצאה מאת ה' ואכלה אותם.", "source": "04 korach rebellion", "type": "story"}, {"q": "10. מה נעשה עם המחתות של מאתיים וחמישים האיש?", "a": "אלעזר בן אהרן הכהן הרים אותן, ורקעו אותן לציפוי למזבח כזיכרון לבני ישראל שלא יקרב איש זר להקטיר קטורת.", "source": "04 korach rebellion", "type": "story"}, {"q": "11. מה התלונן העם למחרת אירוע קורח?", "a": "\"אתם המתם את עם ה'\" - האשימו את משה ואהרן בהריגת עדת קורח.", "source": "04 korach rebellion", "type": "story"}, {"q": "12. כמה מתו במגפה שפרצה למחרת?", "a": "ארבעה עשר אלף ושבע מאות (14,700), מלבד המתים על דבר קורח.", "source": "04 korach rebellion", "type": "story"}, {"q": "13. כיצד עצר אהרן את המגפה?", "a": "לקח מחתה עם אש מהמזבח ושם קטורת, רץ אל תוך הקהל ועמד בין המתים ובין החיים, וכיפר על העם.", "source": "04 korach rebellion", "type": "story"}, {"q": "14. מה היה מבחן המטות ומה תוצאתו?", "a": "כל שבט הניח מטה באוהל מועד (שנים עשר מטות). מטה אהרן לבית לוי פרח בלילה אחד - הוציא פרח, הציץ ציץ וגמל שקדים.", "source": "04 korach rebellion", "type": "story"}, {"q": "15. מהם שלושת השלבים בפריחת מטה אהרן?", "a": "פרח, ציץ, שקדים.", "source": "04 korach rebellion", "type": "story"}, {"q": "16. מה נעשה עם מטה אהרן לאחר שפרח?", "a": "הושב לפני העדות למשמרת, לאות לבני מרי, כדי שתיכלינה תלונותם.", "source": "04 korach rebellion", "type": "story"}, {"q": "17. מי היה אלעזר ומה היה תפקידו בפרשה זו?", "a": "אלעזר בן אהרן הכהן. הוא הרים את המחתות מבין השרפה ורקעום לציפוי המזבח כזיכרון.", "source": "04 korach rebellion", "type": "story"}, {"q": "18. מהי ה\"בריאה\" שמשה ניבא שתקרה?", "a": "\"ואם בריאה יברא ה' ופצתה האדמה את פיה ובלעה אותם\" - פתיחת האדמה ובליעת קורח ועדתו, דבר חדש שלא היה כמותו.", "source": "04 korach rebellion", "type": "story"}, {"q": "19. מי אמר \"האיש אחד יחטא ועל כל העדה תקצוף\"?", "a": "משה ואהרן אמרו זאת לה' כשה' רצה לכלות את כל העדה, והם נפלו על פניהם ופנו לה' כ\"אל אלהי הרוחות לכל בשר\".", "source": "04 korach rebellion", "type": "story"}, {"q": "20. מהו המיוחד בשם \"און בן פלת\" בסיפור?", "a": "הוא מוזכר בתחילת הסיפור כשותף למרד אך אינו מוזכר שוב בהמשך.", "source": "04 korach rebellion", "type": "story"}, {"q": "21. ⭐⭐ מהו שם אביו של קורח ומה ייחוסו המלא?", "a": "קורח בן יצהר בן קהת בן לוי (במדבר ט\"ז:א').", "source": "04 korach rebellion", "type": "story"}, {"q": "22. ⭐⭐⭐ מה עשו המחתות של מאתיים וחמישים האיש לאחר שנשרפו?", "a": "אלעזר בן אהרן הרים אותן ורקעום לציפוי למזבח, כזיכרון שלא יקרב איש זר להקטיר קטורת (במדבר י\"ז:ב'-ה').", "source": "04 korach rebellion", "type": "story"}, {"q": "23. ⭐⭐⭐ מהו הפרי שגמל על מטה אהרן?", "a": "שקדים: \"ויוצא פרח ויצץ ציץ ויגמול שקדים\" (במדבר י\"ז:כ\"ג).", "source": "04 korach rebellion", "type": "story"}, {"q": "1. ⭐⭐⭐ \"רַב לָכֶם בְּנֵי לֵוִי\"", "a": "**מי אמר:** משה\n**למי:** קורח ועדתו\n**הקשר:** משה מוכיח את קורח ועדתו שמורדים כנגד אהרן (במדבר ט\"ז:ז')", "source": "04 korach rebellion", "type": "story"}, {"q": "2. ⭐⭐⭐ \"הֵרָמּוּ מִתּוֹךְ הָעֵדָה הַזֹּאת\"", "a": "**מי אמר:** ה'\n**למי:** משה ואהרן\n**הקשר:** ה' מבקש לכלות את עדת קורח ומשה ואהרן נופלים על פניהם (במדבר ט\"ז:כ\"א)", "source": "04 korach rebellion", "type": "story"}, {"q": "1. ⭐ לוי שמרד נגד משה ואהרן, טען שכל העדה קדושים, האדמה בלעה אותו ואת ביתו", "a": "**הדמות:** קורח\n**ספר:** במדבר\n**הקשר:** קורח בן יצהר מבני לוי מרד במשה ואהרן וטען \"כי כל העדה כולם קדושים\", והאדמה פתחה פיה ובלעה אותו ואת כל אשר לו (פרקים ט\"ז-י\"ז)", "source": "04 korach rebellion", "type": "story"}, {"q": "2. ⭐⭐ בני ראובן שהצטרפו למרד נגד משה, האדמה בלעה גם אותם", "a": "**הדמות:** דתן ואבירם\n**ספר:** במדבר\n**הקשר:** דתן ואבירם בני אליאב לשבט ראובן הצטרפו למרד קורח, סירבו לעלות אל משה ואמרו \"לא נעלה\", ונבלעו באדמה (פרק ט\"ז)", "source": "04 korach rebellion", "type": "story"}, {"q": "3. ⭐ מטהו פרח שקדים, הוכח ככהן הנבחר, עמד בין המתים ובין החיים ועצר מגפה", "a": "**הדמות:** אהרן\n**ספר:** במדבר\n**הקשר:** מטה אהרן פרח ונתן שקדים כהוכחה שנבחר לכהונה, ועמד עם הקטורת בין המתים ובין החיים לעצור את המגפה (פרקים ט\"ז-י\"ז)", "source": "04 korach rebellion", "type": "story"}, {"q": "1. ⭐⭐ קורח ועדתו נבלעו באדמה. נכון או לא נכון?", "a": "**נכון חלקית.** דתן ואבירם ומשפחותיהם נבלעו באדמה (במדבר ט\"ז:ל\"ב-ל\"ג), ומאתיים וחמישים איש שהקריבו קטורת נשרפו באש (ט\"ז:ל\"ה). לגבי קורח עצמו - ישנה מחלוקת פרשנית האם נבלע או נשרף.", "source": "04 korach rebellion", "type": "story"}, {"q": "1. ⭐⭐ קורח, דתן, אבירם, און בן פלת, אלדד - מי לא היה חלק ממרד קורח?", "a": "**התשובה:** אלדד - הוא אחד משני הזקנים שהתנבאו במחנה (במדבר י\"א:כ\"ו), ולא היה קשור למרד קורח. קורח, דתן, אבירם ואון בן פלת מוזכרים בבמדבר ט\"ז:א' כמי שקמו על משה (אם כי און בן פלת לא מוזכר שוב אחרי הפסוק הראשון).", "source": "04 korach rebellion", "type": "story"}, {"q": "2. ⭐⭐⭐ שבט ראובן, שבט שמעון, שבט גד, שבט לוי - מי מהשבטים לא היה מעורב במרד קורח?", "a": "**התשובה:** שבט גד - דתן ואבירם היו משבט ראובן (במדבר ט\"ז:א'), קורח היה משבט לוי (ט\"ז:א'). שבט גד לא מוזכר כמעורב במרד קורח.", "source": "04 korach rebellion", "type": "story"}, {"q": "2. ⭐⭐⭐ דתן ואבירם כינו את מצרים \"ארץ זבת חלב ודבש\". נכון או לא נכון?", "a": "**נכון.** דתן ואבירם אכן קראו למצרים \"ארץ זבת חלב ודבש\": \"המעט כי העליתנו מארץ זבת חלב ודבש להמיתנו במדבר\" (במדבר ט\"ז:י\"ג) - ביטוי שבדרך כלל מתאר את ארץ ישראל, אך כאן השתמשו בו לתיאור מצרים בצורה מעוותת.", "source": "04 korach rebellion", "type": "story"}, {"q": "3. ⭐⭐⭐ מטה אהרן הוציא שקדים, תאנים ורימונים. נכון או לא נכון?", "a": "**לא נכון.** מטה אהרן הוציא **שקדים** בלבד (בשלושה שלבים: פרח, ציץ, שקדים): \"ויוצא פרח ויצץ ציץ ויגמול שקדים\" (במדבר י\"ז:כ\"ג). תאנים ורימונים לא מוזכרים.", "source": "04 korach rebellion", "type": "story"}, {"q": "3. ⭐⭐⭐ \"הַמְעַט כִּי הֶעֱלִיתָנוּ מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ לַהֲמִיתֵנוּ בַּמִּדְבָּר\"", "a": "**מי אמר:** דתן ואבירם\n**למי:** משה (דרך שליחיו)\n**הקשר:** דתן ואבירם מסרבים לעלות אל משה ומכנים את מצרים \"ארץ זבת חלב ודבש\" (במדבר ט\"ז:י\"ג)", "source": "04 korach rebellion", "type": "story"}, {"q": "4. ⭐⭐⭐ \"אֵל אֱלֹהֵי הָרוּחֹת לְכָל בָּשָׂר הָאִישׁ אֶחָד יֶחֱטָא וְעַל כָּל הָעֵדָה תִּקְצֹף\"", "a": "**מי אמר:** משה ואהרן\n**למי:** ה'\n**הקשר:** משה ואהרן נפלו על פניהם ומבקשים מה' שלא יעניש את כל העדה בגלל חטא אדם אחד (במדבר ט\"ז:כ\"ב)", "source": "04 korach rebellion", "type": "story"}, {"q": "4. ⭐⭐⭐ הרים את המחתות מבין השרפה, רקעם לציפוי למזבח, בן הכהן הגדול", "a": "**הדמות:** אלעזר בן אהרן הכהן\n**ספר:** במדבר\n**הקשר:** אלעזר הרים את מחתות מאתיים וחמישים האיש שנשרפו ורקעם לציפוי למזבח כזיכרון (פרק י\"ז:ב'-ד')", "source": "04 korach rebellion", "type": "story"}, {"q": "1. ⭐⭐ \"רַב לָכֶם כִּי כָל הָעֵדָה כֻּלָּם _____ וּבְתוֹכָם יְהוָה וּמַדּוּעַ תִּתְנַשְּׂאוּ עַל קְהַל יְהוָה\"", "a": "**מילה חסרה:** קְדֹשִׁים\n**מי אמר:** קורח ועדתו\n**הקשר:** הטענה המרכזית של קורח כנגד משה ואהרן (במדבר ט\"ז:ג')", "source": "04 korach rebellion", "type": "story"}, {"q": "2. ⭐⭐⭐ \"וַיַּעֲמֹד בֵּין הַ_____ וּבֵין הַ_____ וַתֵּעָצַר הַמַּגֵּפָה\"", "a": "**מילים חסרות:** מֵּתִים / חַיִּים\n**מי אמר:** הכתוב (תיאור אהרן)\n**הקשר:** אהרן עומד עם הקטורת בין המתים ובין החיים ועוצר את המגפה (במדבר י\"ז:י\"ג)", "source": "04 korach rebellion", "type": "story"}, {"q": "3. ⭐⭐⭐ \"וְאִם _____ יִבְרָא יְהוָה וּפָצְתָה הָאֲדָמָה אֶת פִּיהָ וּבָלְעָה אֹתָם\"", "a": "**מילה חסרה:** בְּרִיאָה\n**מי אמר:** משה\n**הקשר:** משה מכריז שאם ה' יברא דבר חדש והאדמה תבלע את קורח ועדתו, זו הוכחה שה' שלחו (במדבר ט\"ז:ל')", "source": "04 korach rebellion", "type": "story"}, {"q": "4. ⭐⭐ \"פָּרַח מַטֵּה אַהֲרֹן לְבֵית לֵוִי וַיֹּצֵא פֶרַח וַיָּצֵץ צִיץ וַיִּגְמֹל _____\"", "a": "**מילה חסרה:** שְׁקֵדִים\n**מי אמר:** הכתוב (תיאור)\n**הקשר:** פריחת מטה אהרן בשלושה שלבים כהוכחה לבחירתו (במדבר י\"ז:כ\"ג)", "source": "04 korach rebellion", "type": "story"}, {"q": "1. היכן מתה מרים ונקברה?", "a": "בקדש, במדבר צין.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "2. מה קרה מיד לאחר מות מרים?", "a": "לא היה מים לעדה. חז\"ל קישרו זאת ל\"בארה של מרים\" שליוותה את ישראל בזכותה.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "3. על מה התלונן העם כשלא היו מים?", "a": "שהמדבר הוא \"מקום רע\" ללא זרע, תאנה, גפן, רימון ומים לשתות, ושמשה ואהרן הביאו אותם למדבר למות.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "4. מה ציווה ה' את משה לעשות כדי להוציא מים מהסלע?", "a": "לקחת את המטה, להקהיל את העדה ולדבר אל הסלע לעיניהם.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "5. מה עשה משה בפועל במקום לדבר אל הסלע?", "a": "קרא לעם \"שמעו נא המורים\" והכה את הסלע במטהו פעמיים.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "6. כמה פעמים הכה משה את הסלע?", "a": "פעמיים.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "7. מה היה העונש של משה ואהרן על חטא מי מריבה?", "a": "לא יביאו את הקהל אל הארץ המובטחת, כי \"לא האמנתם בי להקדישני לעיני בני ישראל\".", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "8. מדוע נקרא המקום \"מי מריבה\"?", "a": "כי רבו בני ישראל את ה'.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "9. לאן שלח משה מלאכים, ומה ביקש?", "a": "למלך אדום. ביקש לעבור בארצו, תוך הבטחה ללכת בדרך המלך בלבד, לא לסטות לשדה או כרם ולא לשתות מי באר.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "10. כיצד כינה משה את ישראל בפנייתו למלך אדום?", "a": "\"אחיך ישראל\" - כי אדום הוא צאצא עשיו, אחי יעקב.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "11. מה הייתה תשובת מלך אדום?", "a": "\"לא תעבור בי פן בחרב אצא לקראתך\" - סירב בתוקף ואף יצא לקראתם בעם כבד וביד חזקה.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "12. היכן מת אהרן?", "a": "בהר ההר, על גבול ארץ אדום.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "13. מה קרה לפני מות אהרן בהר ההר?", "a": "משה הפשיט את בגדי הכהונה מאהרן והלביש אותם את אלעזר בנו.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "14. מי הפך לכהן גדול אחרי אהרן?", "a": "אלעזר בנו של אהרן.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "15. כמה ימים בכו בני ישראל את אהרן?", "a": "שלושים יום, כל בית ישראל.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "16. מהי \"דרך המלך\" שהוזכרה בפנייה לאדום?", "a": "הדרך הראשית שביקשו ישראל ללכת בה דרך ארץ אדום.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "17. מאיזה פסוק: \"שִׁמְעוּ נָא הַמֹּרִים הֲמִן הַסֶּלַע הַזֶּה נוֹצִיא לָכֶם מָיִם\"?", "a": "פסוק י' - פנייתו הכעוסה של משה אל העם.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "18. מי עלו להר ההר ומי ירד ממנו?", "a": "עלו: משה, אהרן ואלעזר בנו. ירדו: משה ואלעזר בלבד (אהרן מת בראש ההר).", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "19. ⭐⭐ מהם ארבעת הדברים שחסרו לפי תלונת העם?", "a": "זרע, תאנה, גפן, רימון (ומים לשתות): \"לא מקום זרע ותאנה וגפן ורימון ומים אין לשתות\" (במדבר כ':ה').", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "20. ⭐⭐⭐ כיצד כינה משה את קדש בפנייתו למלך אדום?", "a": "\"עיר קצה גבולך\" (במדבר כ':ט\"ז).", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "21. ⭐⭐⭐ באיזה חודש מתה מרים?", "a": "בחודש הראשון: \"ויבאו בני ישראל כל העדה מדבר צין בחודש הראשון\" (במדבר כ':א').", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "1. ⭐⭐ \"שִׁמְעוּ נָא הַמֹּרִים\"", "a": "**מי אמר:** משה\n**למי:** בני ישראל\n**הקשר:** משה מכה בסלע במי מריבה במקום לדבר אליו (במדבר כ':י')", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "2. ⭐⭐⭐ \"יַעַן לֹא הֶאֱמַנְתֶּם בִּי לְהַקְדִּישֵׁנִי לְעֵינֵי בְּנֵי יִשְׂרָאֵל לָכֵן לֹא תָבִיאוּ אֶת הַקָּהָל הַזֶּה אֶל הָאָרֶץ\"", "a": "**מי אמר:** ה'\n**למי:** משה ואהרן\n**הקשר:** גזר הדין על משה ואהרן לאחר חטא מי מריבה (במדבר כ':י\"ב)", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "3. ⭐⭐⭐ \"לֹא תַעֲבֹר בִּי פֶּן בַּחֶרֶב אֵצֵא לִקְרָאתֶךָ\"", "a": "**מי אמר:** מלך אדום\n**למי:** ישראל (משה)\n**הקשר:** סירובו התקיף של מלך אדום לתת לישראל לעבור בארצו (במדבר כ':י\"ח)", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "1. ⭐⭐ הוכה על סלע במקום לדבר אליו, נענש שלא ייכנס לארץ, מת בהר ההר", "a": "**הדמות:** משה (ואהרן - במי מריבה)\n**ספר:** במדבר\n**הקשר:** משה הכה על הסלע במי מריבה במקום לדבר אליו, ונגזר עליו ועל אהרן שלא ייכנסו לארץ. אהרן מת בהר ההר (פרק כ')", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "2. ⭐⭐ הופשט מבגדיו בראש הר, בגדיו הולבשו על בנו, מת שם ולא נכנס לארץ", "a": "**הדמות:** אהרן (מותו בהר ההר)\n**ספר:** במדבר\n**הקשר:** אהרן עלה להר ההר, בגדי הכהונה הופשטו ממנו והולבשו על אלעזר בנו, ומת שם (פרק כ')", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "3. ⭐⭐⭐ מתה בקדש במדבר צין, מותה גרם להיעלמות המים, אחות שני המנהיגים", "a": "**הדמות:** מרים\n**ספר:** במדבר\n**הקשר:** מרים מתה בקדש במדבר צין ונקברה שם, ומיד לאחר מותה \"לא היה מים לעדה\" (פרק כ':א'-ב')", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "1. ⭐⭐ משה הוציא מים מהסלע בכך שדיבר אליו, כפי שה' ציווה אותו. נכון או לא נכון?", "a": "**לא נכון.** ה' ציווה את משה לדבר אל הסלע, אך משה הכה בסלע פעמיים: \"וירם משה את ידו ויך את הסלע במטהו פעמים\" (במדבר כ':י\"א). בגלל זה נענש ולא נכנס לארץ.", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "2. ⭐⭐⭐ מרים מתה במדבר צין בחודש הראשון. נכון או לא נכון?", "a": "**נכון.** \"ויבאו בני ישראל כל העדה מדבר צין **בחודש הראשון** ויישב העם בקדש ותמת שם מרים ותיקבר שם\" (במדבר כ':א').", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "3. ⭐⭐⭐ אדום הסכים בסוף לתת לישראל לעבור בדרך המלך. נכון או לא נכון?", "a": "**לא נכון.** אדום סירב בתוקף גם בפעם השנייה ואף יצא לקראת ישראל \"בעם כבד וביד חזקה\": \"וימאן אדום נתון את ישראל עבור בגבולו ויט ישראל מעליו\" (במדבר כ':כ'-כ\"א).", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "4. ⭐⭐⭐ משה הכה את הסלע פעם אחת בלבד. נכון או לא נכון?", "a": "**לא נכון.** משה הכה את הסלע **פעמיים**: \"וירם משה את ידו ויך את הסלע במטהו **פעמים**\" (במדבר כ':י\"א).", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "5. ⭐⭐⭐ כל בית ישראל בכו את אהרן שלושים יום. נכון או לא נכון?", "a": "**נכון.** \"ויראו כל העדה כי גוע אהרן ויבכו את אהרן שלשים יום כל בית ישראל\" (במדבר כ':כ\"ט).", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "4. ⭐⭐⭐ \"כֹּה אָמַר אָחִיךָ יִשְׂרָאֵל אַתָּה יָדַעְתָּ אֵת כָּל הַתְּלָאָה אֲשֶׁר מְצָאָתְנוּ\"", "a": "**מי אמר:** משה (דרך מלאכים)\n**למי:** מלך אדום\n**הקשר:** משה פונה למלך אדום בבקשה לעבור בארצו ומכנה את ישראל \"אחיך\" כי אדום הוא עשיו, אחי יעקב (במדבר כ':י\"ד)", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "1. ⭐⭐ \"וְ_____ אֶל הַסֶּלַע לְעֵינֵיהֶם וְנָתַן מֵימָיו\"", "a": "**מילה חסרה:** דִבַּרְתֶּם\n**מי אמר:** ה'\n**הקשר:** הציווי האלוהי למשה לדבר אל הסלע, אך משה הכה אותו במקום זאת (במדבר כ':ח')", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "2. ⭐⭐⭐ \"וְהַפְשֵׁט אֶת אַהֲרֹן אֶת בְּגָדָיו וְהִלְבַּשְׁתָּם אֶת _____ בְּנוֹ וְאַהֲרֹן יֵאָסֵף וּמֵת שָׁם\"", "a": "**מילה חסרה:** אֶלְעָזָר\n**מי אמר:** ה'\n**הקשר:** ה' מצווה את משה להעביר את בגדי הכהונה מאהרן לבנו אלעזר לפני מותו בהר ההר (במדבר כ':כ\"ו)", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "3. ⭐⭐⭐ \"נַעְבְּרָה נָּא בְאַרְצֶךָ... דֶּרֶךְ _____ נֵלֵךְ לֹא נִטֶּה יָמִין וּשְׂמֹאול\"", "a": "**מילה חסרה:** הַמֶּלֶךְ\n**מי אמר:** משה (דרך מלאכים)\n**הקשר:** בקשת ישראל ממלך אדום לעבור בארצו בדרך המלך בלבד (במדבר כ':י\"ז)", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "4. ⭐⭐ \"יַעַן לֹא הֶאֱמַנְתֶּם בִּי _____ לְעֵינֵי בְּנֵי יִשְׂרָאֵל\"", "a": "**מילה חסרה:** לְהַקְדִּישֵׁנִי\n**מי אמר:** ה'\n**הקשר:** סיבת העונש של משה ואהרן - שלא הקדישו את ה' לעיני בני ישראל (במדבר כ':י\"ב)", "source": "05 mei meriva and deaths", "type": "story"}, {"q": "1. מי תקף את ישראל בתחילת הפרק ומה קרה?", "a": "הכנעני מלך ערד יושב הנגב תקף את ישראל ושבה מהם שבי.", "source": "06 copper snake and well song", "type": "story"}, {"q": "2. מה נדרו ישראל לה' במלחמה עם מלך ערד?", "a": "\"אם נתון תיתן את העם הזה בידי והחרמתי את עריהם\" - נדרו להחרים את עריו.", "source": "06 copper snake and well song", "type": "story"}, {"q": "3. מדוע נקרא המקום \"חרמה\"?", "a": "כי ישראל החרימו את הכנעני ואת עריו לאחר שה' שמע בקולם ונתן אותם בידם.", "source": "06 copper snake and well song", "type": "story"}, {"q": "4. מדוע קצרה נפש העם בדרך מהר ההר?", "a": "כי נסעו דרך ים סוף כדי לעקוף את ארץ אדום, והדרך הייתה ארוכה.", "source": "06 copper snake and well song", "type": "story"}, {"q": "5. כיצד כינה העם את המן בתלונתו?", "a": "\"הלחם הקלוקל\".", "source": "06 copper snake and well song", "type": "story"}, {"q": "6. מה שלח ה' כעונש על תלונת העם?", "a": "נחשים שרפים שנשכו את העם ומתו עם רב מישראל.", "source": "06 copper snake and well song", "type": "story"}, {"q": "7. מה אמר העם למשה כשהודה בחטאו?", "a": "\"חטאנו כי דיברנו בה' ובך, התפלל אל ה' ויסר מעלינו את הנחש\".", "source": "06 copper snake and well song", "type": "story"}, {"q": "8. מה ציווה ה' את משה לעשות כדי לרפא את הנשוכים?", "a": "\"עשה לך שרף ושים אותו על נס, והיה כל הנשוך וראה אותו וחי\".", "source": "06 copper snake and well song", "type": "story"}, {"q": "9. ממה עשה משה את הנחש ואיפה שם אותו?", "a": "משה עשה נחש נחושת ושם אותו על הנס (מוט גבוה).", "source": "06 copper snake and well song", "type": "story"}, {"q": "10. מה היה צריך אדם שנשכו נחש לעשות כדי לחיות?", "a": "להביט אל נחש הנחושת שעל הנס.", "source": "06 copper snake and well song", "type": "story"}, {"q": "11. מה הייתה שירת הבאר?", "a": "\"עלי באר ענו לה, באר חפרוה שרים כרוה נדיבי העם במחוקק במשענותם\".", "source": "06 copper snake and well song", "type": "story"}, {"q": "12. מי חפרו את הבאר לפי השירה?", "a": "\"שרים\" ו\"נדיבי העם\" במחוקק ובמשענותם.", "source": "06 copper snake and well song", "type": "story"}, {"q": "13. מי היה סיחון ומה קרה כשישראל ביקש לעבור בארצו?", "a": "סיחון מלך האמורי, ששלט בחשבון. הוא סירב לתת לישראל לעבור, אסף את כל עמו ויצא להילחם בישראל ביהצה.", "source": "06 copper snake and well song", "type": "story"}, {"q": "14. מה היו גבולות הארץ שכבשו ישראל מסיחון?", "a": "מארנון (בדרום) עד יבוק (בצפון), עד גבול בני עמון.", "source": "06 copper snake and well song", "type": "story"}, {"q": "15. מהי חשבון ומה חשיבותה?", "a": "עיר סיחון מלך האמורי, שנכבשה על ידי ישראל וישבו בה ובכל בנותיה (עריה).", "source": "06 copper snake and well song", "type": "story"}, {"q": "16. מי היה עוג והיכן נלחם בישראל?", "a": "עוג מלך הבשן. יצא לקראת ישראל למלחמה באדרעי.", "source": "06 copper snake and well song", "type": "story"}, {"q": "17. מה אמר ה' למשה לפני המלחמה עם עוג?", "a": "\"אל תירא אותו כי בידך נתתי אותו ואת כל עמו ואת ארצו, ועשית לו כאשר עשית לסיחון מלך האמורי אשר יושב בחשבון\".", "source": "06 copper snake and well song", "type": "story"}, {"q": "18. מה היה גורלו של עוג מלך הבשן?", "a": "ישראל הכו אותו ואת בניו ואת כל עמו עד בלתי השאיר לו שריד, וירשו את ארצו.", "source": "06 copper snake and well song", "type": "story"}, {"q": "19. מי היה כמוש ובאיזה הקשר הוא מוזכר?", "a": "כמוש היה אלוהי מואב. הוא מוזכר בשירת המושלים בהקשר שסיחון כבש קודם את מואב ולקח את ארצו.", "source": "06 copper snake and well song", "type": "story"}, {"q": "20. מהן תחנות המסע שמוזכרות בשירת הבאר?", "a": "ממדבר מתנה, ומתנה נחליאל, ומנחליאל במות, ומבמות הגיא אשר בשדה מואב ראש הפסגה.", "source": "06 copper snake and well song", "type": "story"}, {"q": "21. ⭐⭐ מהם גבולות ארץ סיחון שכבש ישראל?", "a": "מארנון (בדרום) עד יבוק (בצפון), עד גבול בני עמון (במדבר כ\"א:כ\"ד).", "source": "06 copper snake and well song", "type": "story"}, {"q": "22. ⭐⭐⭐ מהו שם אלוהי מואב המוזכר בשירת המושלים?", "a": "כמוש: \"אוי לך מואב אבדת עם כמוש\" (במדבר כ\"א:כ\"ט).", "source": "06 copper snake and well song", "type": "story"}, {"q": "23. ⭐⭐⭐ היכן נלחם סיחון בישראל (לא בחשבון)?", "a": "ביהצה: \"ויצא לקראת ישראל המדברה ויבוא יהצה וילחם בישראל\" (במדבר כ\"א:כ\"ג).", "source": "06 copper snake and well song", "type": "story"}, {"q": "24. ⭐⭐ לאן שלח משה מרגלים לפני כיבוש עוג?", "a": "ליעזר: \"וישלח משה לרגל את יעזר וילכדו בנותיה\" (במדבר כ\"א:ל\"ב).", "source": "06 copper snake and well song", "type": "story"}, {"q": "1. ⭐⭐ נחש נחושת שנעשה בפקודת ה', כל מי שהביט בו נרפא, הוקם על נס", "a": "**הדמות:** נחש הנחושת\n**ספר:** במדבר\n**הקשר:** כשנחשים שרפים נשכו את העם, ה' ציווה את משה לעשות נחש נחושת ולשים אותו על נס, וכל הנשוך שהביט בו חי (פרק כ\"א)", "source": "06 copper snake and well song", "type": "story"}, {"q": "2. ⭐⭐⭐ מלך אמורי, שלט בחשבון, סירב לתת מעבר לישראל, יצא להילחם בהם והובס", "a": "**הדמות:** סיחון מלך האמורי\n**ספר:** במדבר\n**הקשר:** סיחון לא נתן לישראל לעבור בגבולו, אסף את כל עמו ויצא למלחמה ביהצה, הוכה לפי חרב וארצו נכבשה (פרק כ\"א:כ\"א-כ\"ה)", "source": "06 copper snake and well song", "type": "story"}, {"q": "3. ⭐⭐⭐ מלך, יצא להילחם באדרעי, ה' אמר למשה \"אל תירא אותו\", הוכה ללא שריד", "a": "**הדמות:** עוג מלך הבשן\n**ספר:** במדבר\n**הקשר:** עוג יצא לקראת ישראל למלחמה באדרעי, ה' הבטיח ניצחון, ישראל הכו אותו ואת כל עמו ללא שריד (פרק כ\"א:ל\"ג-ל\"ה)", "source": "06 copper snake and well song", "type": "story"}, {"q": "1.
