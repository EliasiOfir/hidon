⭐⭐⭐ ה' ציווה את משה \"עשה לך נחש נחושת\". נכון או לא נכון?", "a": "**לא נכון.** ה' ציווה \"עשה לך **שרף**\" (במדבר כ\"א:ח'), ומשה הוא זה שבחר לעשות **נחש נחושת**: \"ויעש משה נחש נחושת\" (כ\"א:ט'). ההבדל בין הציווי לביצוע הוא פרט עדין שקל לפספס.", "source": "06 copper snake and well song", "type": "story"}, {"q": "2. ⭐⭐⭐ סיחון מלך האמורי נלחם בישראל בחשבון. נכון או לא נכון?", "a": "**לא נכון.** סיחון יצא להילחם בישראל ב**יהצה**, לא בחשבון: \"ויצא לקראת ישראל המדברה ויבוא יהצה וילחם בישראל\" (במדבר כ\"א:כ\"ג). חשבון הייתה עיר סיחון (בירתו) אך הקרב עצמו התרחש ביהצה.", "source": "06 copper snake and well song", "type": "story"}, {"q": "1. ⭐⭐⭐ \"חָטָאנוּ כִּי דִבַּרְנוּ בַה' וָבָךְ הִתְפַּלֵּל אֶל ה' וְיָסֵר מֵעָלֵינוּ אֶת הַנָּחָשׁ\"", "a": "**מי אמר:** בני ישראל (העם)\n**למי:** משה\n**הקשר:** העם מודה בחטאו לאחר עונש הנחשים השרפים ומבקש ממשה להתפלל לה' (במדבר כ\"א:ז')", "source": "06 copper snake and well song", "type": "story"}, {"q": "1. ⭐⭐ בסיפור המתאוננים (פרק י\"א) ובסיפור נחש הנחושת (פרק כ\"א), העם מתלונן על המן. כיצד שונה התלונה בכל סיפור, ומה היה העונש בכל מקרה?", "a": "בפרק י\"א העם אמר \"נפשנו יבשה אין כל בלתי אל המן עינינו\" וביקש בשר, והעונש היה מכה רבה בזמן אכילת השלו. בפרק כ\"א העם כינה את המן \"הלחם הקלוקל\", והעונש היה נחשים שרפים. בשני המקרים העם זלזל במתנת ה' (המן) ונענש.", "source": "cross chapter", "type": "story"}, {"q": "2. ⭐⭐ במרד קורח (פרק ט\"ז) ובחטא המרגלים (פרק י\"ד), ה' מציע להשמיד את העם. כיצד הגיב משה בכל מקרה?", "a": "בחטא המרגלים, משה התפלל ארוכות, הזכיר את י\"ג מידות הרחמים וטען שהגויים יאמרו \"מבלתי יכולת ה' להביא את העם הזה אל הארץ\". במרד קורח, משה ואהרן נפלו על פניהם ואמרו \"האיש אחד יחטא ועל כל העדה תקצוף\" - כלומר ביקשו להעניש רק את החוטאים ולא את כולם.", "source": "cross chapter", "type": "story"}, {"q": "3. ⭐⭐⭐ השוו בין תלונת העם בסיפור המתאוננים (פרק י\"א) לתלונת העם במי מריבה (פרק כ'). מה משותף ומה שונה?", "a": "בשני המקרים העם מתלונן על תנאי המדבר ומתגעגע למצרים (\"למה העליתנו ממצרים\"). בפרק י\"א התלונה היא על חוסר בשר ורצון למאכלי מצרים (דגה, קישואים, אבטיחים, חציר, בצלים, שומים). בפרק כ' התלונה על חוסר מים ועל כך שאין \"מקום זרע ותאנה וגפן ורימון ומים אין לשתות\". בפרק י\"א העונש בא על העם, ואילו בפרק כ' העונש נפל דווקא על משה ואהרן.", "source": "cross chapter", "type": "story"}, {"q": "4. ⭐⭐ בפרשת קורח (פרק ט\"ז) ובפרשת המרגלים (פרק י\"ד), העם רצה לרגום באבנים. את מי ביקשו לרגום בכל מקרה?", "a": "בחטא המרגלים, העם רצה לרגום את יהושע וכלב שניסו לעודד אותם ולומר \"טובה הארץ מאוד מאוד\". בפרשת קורח, העם לא ביקש במפורש לרגום, אבל בשני המקרים כבוד ה' נראה באוהל מועד כתגובה להתנהגות העם.", "source": "cross chapter", "type": "story"}, {"q": "5. ⭐⭐ יהושע בן נון מופיע בפרק י\"א (סיפור אלדד ומידד) ובפרק י\"ד (חטא המרגלים). כיצד מתוארת נאמנותו למשה ולה' בכל סיפור?", "a": "בפרק י\"א, יהושע מבקש ממשה לכלוא את אלדד ומידד שמתנבאים במחנה - מתוך קנאה לכבוד משה. בפרק י\"ג-י\"ד, יהושע הוא אחד משני המרגלים הנאמנים (יחד עם כלב) שקרע בגדיו ואמר לעם \"טובה הארץ מאוד מאוד... אל תיראום\". בשני המקרים הוא מגלה נאמנות למשה ולה'.", "source": "cross chapter", "type": "story"}, {"q": "6. ⭐⭐⭐ אהרן מופיע בסיפורים רבים בבמדבר. השוו את תפקידו בסיפור מרים (פרק י\"ב), במרד קורח (פרק ט\"ז-י\"ז) ובמי מריבה (פרק כ').", "a": "בפרק י\"ב, אהרן חוטא יחד עם מרים בדיבור נגד משה, אך מכיר בחטאו ומתחנן למשה. בפרק ט\"ז-י\"ז, אהרן הוא גיבור - עוצר את המגפה כשעומד בין המתים לחיים עם הקטורת, ומטהו פורח כהוכחה לבחירתו. בפרק כ', אהרן נענש יחד עם משה על חטא מי מריבה, ומת בהר ההר כשבגדיו עוברים לאלעזר בנו.", "source": "cross chapter", "type": "story"}, {"q": "7. ⭐⭐ מרים מופיעה בשני פרקים: פרק י\"ב (דיבור נגד משה) ופרק כ' (מותה). מה הקשר בין שני האירועים לפי חז\"ל?", "a": "בפרק י\"ב מרים נענשת בצרעת והוסגרה שבעה ימים מחוץ למחנה, וכל העם המתין לה. בפרק כ' מרים מתה בקדש, ומיד לאחר מותה לא היו מים לעדה. חז\"ל קישרו זאת ל\"בארה של מרים\" - באר שליוותה את ישראל בזכות מרים ונעלמה עם מותה.", "source": "cross chapter", "type": "story"}, {"q": "8. ⭐⭐ אלעזר בן אהרן מופיע בפרשת קורח (פרק י\"ז) ובמות אהרן (פרק כ'). מה היה תפקידו בכל אירוע?", "a": "בפרשת קורח, אלעזר הרים את מחתות הנחושת של מאתיים וחמישים האיש שנשרפו, ורקעם לציפוי למזבח כזיכרון. בפרק כ', אלעזר עלה עם אביו אהרן להר ההר, הולבש בבגדי הכהונה של אביו והפך לכהן הגדול. בשני המקרים הוא ממלא תפקיד של המשכיות הכהונה.", "source": "cross chapter", "type": "story"}, {"q": "9. ⭐⭐ סדרו את האירועים הבאים לפי הסדר הכרונולוגי: חטא המרגלים, סיפור המתאוננים, מרד קורח, מרים מדברת במשה, מי מריבה, נחש הנחושת.", "a": "הסדר הנכון: (1) המתאוננים והשלו (פרק י\"א), (2) מרים ואהרן מדברים במשה (פרק י\"ב), (3) חטא המרגלים (פרקים י\"ג-י\"ד), (4) מרד קורח (פרקים ט\"ז-י\"ז), (5) מי מריבה ומות מרים ואהרן (פרק כ'), (6) נחש הנחושת ושירת הבאר (פרק כ\"א).", "source": "cross chapter", "type": "story"}, {"q": "10. ⭐⭐⭐ מהו מסלול הנסיעות של בני ישראל מסוף פרק י\"א ועד תחילת חטא המרגלים (פרק י\"ג)?", "a": "בסוף פרק י\"א, בני ישראל נסעו מקברות התאווה לחצרות. בפרק י\"ב, בחצרות התרחש סיפור מרים ואהרן, ולאחר שמרים נאספה חזרה, נסעו מחצרות וחנו במדבר פארן. ממדבר פארן נשלחו המרגלים (פרק י\"ג).", "source": "cross chapter", "type": "story"}, {"q": "11. ⭐⭐ הביטוי \"למה העליתנו ממצרים\" חוזר בכמה סיפורים. באילו סיפורים מופיעה תלונה זו, ומה ההבדל בין המקרים?", "a": "הביטוי מופיע בסיפור המתאוננים (פרק י\"א - \"למה זה יצאנו ממצרים\"), בחטא המרגלים (פרק י\"ד - \"לו מתנו בארץ מצרים... נתנה ראש ונשובה מצרימה\"), במי מריבה (פרק כ' - \"ולמה העליתנו ממצרים להביא אותנו אל המקום הרע הזה\") ובסיפור הנחשים (פרק כ\"א - \"למה העליתנו ממצרים למות במדבר\"). בכל פעם העם מציג את מצרים כמקום טוב יותר מהמדבר.", "source": "cross chapter", "type": "story"}, {"q": "12. ⭐⭐⭐ משה נופל על פניו בכמה סיפורים בבמדבר. באילו אירועים ומה הסיבה בכל מקרה?", "a": "(1) בפרק ט\"ז, משה נפל על פניו כשקורח ועדתו ערערו על סמכותו. (2) בפרק י\"ד, משה ואהרן נפלו על פניהם לפני כל קהל עדת בני ישראל כשהעם רצה לחזור למצרים. (3) בפרק כ', משה ואהרן נפלו על פניהם בפתח אוהל מועד כשהעם התלונן על חוסר מים. (4) בפרק ט\"ז-י\"ז, משה ואהרן נפלו על פניהם כשה' רצה לכלות את העדה.", "source": "cross chapter", "type": "story"}, {"q": "13. ⭐⭐⭐ כיצד חטא המרגלים (פרק י\"ג-י\"ד) קשור לסיפור \"המעפילים\" (סוף פרק י\"ד) ולסיפור נחש הנחושת (פרק כ\"א)?", "a": "חטא המרגלים גרם לגזרת ארבעים שנה במדבר. המעפילים ניסו לתקן את החטא ולעלות לארץ בכוח, אך נכשלו והוכו על ידי העמלקי והכנעני \"עד החרמה\". בפרק כ\"א, דווקא המקום \"חרמה\" מוזכר שוב - הפעם ישראל מנצחים את מלך ערד ומחרימים את עריו. כך הניצחון בחרמה בפרק כ\"א מתקן את התבוסה בחרמה בפרק י\"ד.", "source": "cross chapter", "type": "story"}, {"q": "14. ⭐⭐ כיצד סירוב אדום לתת לישראל מעבר (פרק כ') קשור לסיפור נחש הנחושת (פרק כ\"א)?", "a": "בפרק כ', מלך אדום סירב לתת לישראל לעבור בארצו. בגלל כך, בני ישראל נאלצו לנסוע מהר ההר דרך ים סוף כדי לעקוף את ארץ אדום, וקצרה נפשם בדרך הארוכה. תסכול זה הוביל לתלונה נגד ה' ומשה ולעונש הנחשים השרפים בפרק כ\"א.", "source": "cross chapter", "type": "story"}, {"q": "15. ⭐ מדוע משה ואהרן לא נכנסו לארץ ישראל? ציינו את כל האירועים מבמדבר הקשורים לעונש זה.", "a": "העונש נגזר במי מריבה (פרק כ') כי \"לא האמנתם בי להקדישני לעיני בני ישראל\" - משה הכה את הסלע פעמיים במקום לדבר אליו. אהרן מת בהר ההר (סוף פרק כ') ובגדיו עברו לאלעזר. ה' ציין במפורש שזה \"על אשר מריתם את פי למי מריבה\".", "source": "cross chapter", "type": "story"}, {"q": "16. ⭐ המספר 40 מופיע בכמה הקשרים בסיפורי במדבר. ציינו לפחות שני הקשרים שונים וההבדל ביניהם.", "a": "(1) בחטא המרגלים - המרגלים תרו את הארץ ארבעים יום (פרק י\"ג). (2) העונש: ארבעים שנה במדבר, \"יום לשנה יום לשנה\" (פרק י\"ד). המספר 40 בריגול הפך למספר 40 בעונש.", "source": "cross chapter", "type": "story"}, {"q": "17. ⭐⭐ בפרשת המתאוננים (פרק י\"א) נבחרו 70 זקנים, ובפרשת המרגלים (פרק י\"ג) נשלחו 12 מרגלים. מה היה תפקיד כל קבוצה ומה קרה להם?", "a": "70 הזקנים נבחרו לסייע למשה בנשיאת משא העם, קיבלו מרוח הנבואה שעל משה והתנבאו. הם מילאו את תפקידם בהצלחה. 12 המרגלים נשלחו לתור את ארץ כנען, אך 10 מהם הוציאו דיבת הארץ רעה ומתו במגפה, ורק כלב ויהושע נשארו בחיים.", "source": "cross chapter", "type": "story"}, {"q": "18. ⭐⭐⭐ השוו את מספרי הנפגעים בעונשים השונים: קברות התאווה (פרק י\"א), חטא המרגלים (פרק י\"ד), ומרד קורח (פרקים ט\"ז-י\"ז).", "a": "בקברות התאווה - \"מכה רבה מאוד\" אך לא מצוין מספר מדויק. בחטא המרגלים - עשרת המרגלים מתו מיד במגפה, ובנוסף כל הדור מבן 20 ומעלה נגזר עליהם למות במדבר במשך 40 שנה. במרד קורח - קורח, דתן ואבירם ומשפחותיהם נבלעו באדמה, 250 מקריבי הקטורת נשרפו באש, ו-14,700 מתו במגפה שלמחרת. מרד קורח כולל את המספרים המדויקים הגבוהים ביותר.", "source": "cross chapter", "type": "story"}, {"q": "1. ⭐ מן, שליו, מים מהסלע, ענני כבוד, לחם ויין - מה לא סיפק ה' לעם ישראל במדבר?", "a": "**התשובה:** לחם ויין - ה' לא סיפק לחם ויין במדבר. המן ירד מהשמים (שמות ט\"ז, במדבר י\"א), השליו ניתן בתבערה (במדבר י\"א:ל\"א-ל\"ב), ומים מהסלע נתן ה' במי מריבה (במדבר כ':ח'-י\"א).", "source": "cross chapter", "type": "story"}, {"q": "2. ⭐ נחש הנחושת, מטה אהרן שפרח, עשר המכות, בליעת קורח באדמה - מה לא התרחש בספר במדבר?", "a": "**התשובה:** עשר המכות - הן התרחשו בספר שמות (פרקים ז'-י\"ב), לא בבמדבר. נחש הנחושת נעשה בבמדבר כ\"א:ח'-ט', מטה אהרן פרח בבמדבר י\"ז:כ\"ג, וקורח ועדתו נבלעו באדמה בבמדבר ט\"ז:ל\"ב.", "source": "cross chapter", "type": "story"}], "text": [{"q": "טקסט: \"וַיִּקְרָא אֶת שֵׁם הַמָּקוֹם הַהוּא תַּבְעֵרָה\"\nשאלה: מה עשה העם שגרם לאירוע המתואר כאן, ומי עצר אותו?", "a": "העם התאוננו רע באזני ה', וה' שמע ואפו חרה ואש ה' בערה בקצה המחנה. האש נעצרה כאשר העם צעק אל משה, ומשה התפלל אל ה' והאש שקעה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הֶאָנֹכִי הָרִיתִי אֵת כָּל הָעָם הַזֶּה\"\nשאלה: מי אמר את הדברים האלה, למי, ומה הפתרון שהוצע לו?", "a": "משה אמר את הדברים לה', בתלונתו שאינו יכול לשאת לבדו את משא העם. הפתרון: ה' ציווה לאסוף שבעים איש מזקני ישראל, והבטיח לאצול מן הרוח שעל משה ולשים עליהם, כדי שיישאו עמו במשא העם.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"אֲדֹנִי מֹשֶׁה כְּלָאֵם\"\nשאלה: מי אמר את הדברים האלה, על מי דיבר, ומה ענה לו משה?", "a": "יהושע בן נון (משרת משה) אמר זאת למשה, על אלדד ומידד שנשארו במחנה והתנבאו שם ולא יצאו לאוהל מועד. משה ענה: \"המקנא אתה לי ומי יתן כל עם ה' נביאים כי יתן ה' את רוחו עליהם.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הַבָּשָׂר עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם\"\nשאלה: איזה בשר מתואר כאן, וכיצד הוא הגיע למחנה?", "a": "מדובר בבשר השלו (שלווים). רוח נסעה מאת ה' וגזה שלווים מן הים, ונפלו על המחנה כדרך יום מכל צד ובגובה כאמתיים מעל הארץ. העם אסף אותם יומיים ולילה, אך עוד בטרם כרתו (גמרו) לאכול, ה' הכה בעם מכה רבה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"שֵׁשׁ מֵאוֹת אֶלֶף רַגְלִי הָעָם\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה היתה התשובה?", "a": "משה אמר זאת לה', כשהטיל ספק ביכולת לספק בשר לכל העם. ה' ענה: \"הֲיַד יְהוָה תִּקְצָר? עַתָּה תִרְאֶה הֲיִקְרְךָ דְבָרִי אִם לֹא\" - כלומר, אין גבול ליכולת ה'.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הָרְגֵנִי נָא הָרֹג אִם מָצָאתִי חֵן\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה הסיבה שהביאה אותו לבקשה קיצונית זו?", "a": "משה אמר זאת לה'. הסיבה: משה לא יכול היה לשאת לבדו את משא כל העם שבכו למשפחותיהם ודרשו בשר. הוא הרגיש שה' הטיל עליו נטל כבד מדי - \"לא אוכל אנוכי לבדי לשאת את כל העם הזה כי כבד ממני.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"זָכַרְנוּ אֶת הַדָּגָה אֲשֶׁר נֹאכַל\"\nשאלה: מי אמרו את הדברים האלה, ומה היה המאכל שעליו התלוננו שאין להם מלבדו?", "a": "בני ישראל (בעקבות האספסוף שהתאוו תאווה) אמרו זאת. הם התלוננו שאין להם דבר מלבד המן: \"ועתה נפשנו יבשה אין כל בלתי אל המן עינינו.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיִּשָּׁאֲרוּ שְׁנֵי אֲנָשִׁים בַּמַּחֲנֶה\"\nשאלה: מדוע נחה עליהם הרוח למרות שנשארו במחנה, ומה קרה לשבעים הזקנים שכן יצאו לאוהל?", "a": "אלדד ומידד היו בכתובים (ברשימת הזקנים שנבחרו) אך לא יצאו האוהלה, ובכל זאת הרוח נחה עליהם והתנבאו במחנה. שבעים הזקנים שיצאו לאוהל מועד קיבלו מן הרוח שעל משה, התנבאו - ולא יספו (לא המשיכו להתנבאות אחר כך).", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"עַד חֹדֶשׁ יָמִים עַד אֲשֶׁר יֵצֵא\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה הסיבה שניתנה לעונש הזה?", "a": "ה' אמר זאת לבני ישראל (דרך משה). הסיבה: \"כי מאסתם את ה' אשר בקרבכם ותבכו לפניו לאמר למה זה יצאנו ממצרים\" - העם מאס בה' ובמן שנתן להם, ודרש בשר תוך געגוע למצרים.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"שֵׁם הַמָּקוֹם הַהוּא קִבְרוֹת הַתַּאֲוָה\"\nשאלה: לאן נסע העם מהמקום הזה, ואיזה אירוע חמור התרחש בתחנה הבאה?", "a": "מקברות התאווה נסעו לחצרות. בחצרות התרחש הסיפור של מרים ואהרן שדיברו נגד משה - מרים נענשה בצרעת והוסגרה שבעת ימים מחוץ למחנה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְהָאסַפְסֻף אֲשֶׁר בְּקִרְבּוֹ הִתְאַוּוּ תַּאֲוָה\"\nשאלה: מי הם \"האספסוף\" המוזכרים כאן, ומה בדיוק ביקשו מיד אחרי שבכו?", "a": "האספסוף הם הערב רב שהצטרף לישראל ביציאת מצרים. מיד אחרי שבכו אמרו: \"מי יאכילנו בשר\" - ואז פירטו את מאכלי מצרים שזכרו: הדגה, הקישואים, האבטיחים, החציר, הבצלים והשומים.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְהַמָּן כִּזְרַע גַּד הוּא\"\nשאלה: מהו \"לשד השמן\" שמוזכר בהמשך הפסוקים בקשר למן, ומה עשה העם עם המן לפני שאכל אותו?", "a": "\"לשד השמן\" הוא תיאור טעם המן - כטעם לשד (מיץ/שומן) השמן. העם היה שוטה ולוקט את המן, ואז טוחן ברחיים או דך במדוכה, מבשל בפרור ועושה ממנו עוגות.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיָּרָץ הַנַּעַר וַיַּגֵּד לְמֹשֶׁה\"\nשאלה: מה בדיוק הגיד הנער למשה, ומי הוא האיש שהגיב ראשון לחדשות האלה?", "a": "הנער הגיד למשה: \"אלדד ומידד מתנבאים במחנה.\" האיש שהגיב ראשון היה יהושע בן נון, משרת משה מבחוריו, שאמר: \"אדני משה כלאם\" - ביקש לכלוא אותם.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הֲצֹאן וּבָקָר יִשָּׁחֵט לָהֶם וּמָצָא לָהֶם\"\nשאלה: מי אמר את הדברים האלה ולמי, ומהי התשובה בת שלוש המילים שקיבל?", "a": "משה אמר זאת לה', כשהטיל ספק ביכולת לספק בשר לשש מאות אלף רגלי. ה' ענה: \"הֲיַד יְהוָה תִּקְצָר\" - וכך הוכיח שאין גבול ליכולתו.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַתִּבְעַר בָּם אֵשׁ יְהוָה\"\nשאלה: מה עשה העם כדי לעצור את האש, ומי פעל בפועל להשקיעה?", "a": "העם צעק אל משה. משה התפלל אל ה' - ואז האש שקעה. כלומר, העם פנה למשה ומשה פנה לה'. המקום נקרא \"תבערה\" כי בערה בם אש ה'.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְהֵמָּה בַּכְּתֻבִים וְלֹא יָצְאוּ הָאֹהֱלָה\"\nשאלה: על מי נאמר \"והמה בכתובים\", ומה המשמעות של \"בכתובים\" כאן?", "a": "נאמר על אלדד ומידד. \"בכתובים\" פירושו שהיו ברשימת שבעים הזקנים שנבחרו, אך למרות שהיו ברשימה הם לא יצאו אל אוהל מועד, ובכל זאת הרוח נחה עליהם והתנבאו במחנה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הַמַּמְעִיט אָסַף עֲשָׂרָה חֳמָרִים\"\nשאלה: מה אסף העם במשך כמה זמן, ומה קרה להם עוד לפני שסיימו לאכול?", "a": "העם אסף את השלו (שלווים) כל אותו יום, כל הלילה וכל יום המחרת. עוד בטרם כרתו (גמרו) לאכול את הבשר, אף ה' חרה בעם ויך בהם מכה רבה מאוד. המקום נקרא קברות התאווה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְלֹא יָסָפוּ\"\nשאלה: על מי נאמר \"ולא יספו\", מה עשו לפני כן, וכמה היו?", "a": "נאמר על שבעים הזקנים שנאספו סביבות האוהל. הם קיבלו מן הרוח שאצל ה' ממשה עליהם, והתנבאו - אך \"ולא יספו\" - לא המשיכו להתנבא אחר כך. היו שבעים איש.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"כְּמִתְאֹנְנִים רַע\"\nשאלה: מה הפועל המדויק שמתאר את התנהגות העם כאן, ומה העונש שבא מיד - והיכן בדיוק פגעה האש?", "a": "הפועל הוא \"כמתאוננים\" - כאילו מתלוננים, בצורה מעורפלת ללא תלונה ספציפית. האש בערה \"בקצה המחנה\" - לא במרכז, אלא בשולי המחנה בלבד.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְעֵינוֹ כְּעֵין הַבְּדֹלַח\"\nשאלה: על מה נאמר \"עינו כעין הבדולח\", ומהו הדבר הנוסף שהכתוב משווה אותו אליו באותו פסוק?", "a": "נאמר על המן. באותו פסוק נאמר גם \"והמן כזרע גד הוא\" - כלומר המן דומה לזרע גד בצורתו, ומראהו (עינו) כמראה הבדולח.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"לֹא יוֹם אֶחָד תֹּאכְלוּן\"\nשאלה: רשום את כל פרקי הזמן שה' מונה בסדר עולה לפני שמגיע ל\"חודש ימים\".", "a": "ה' מונה: לא יום אחד, ולא יומיים, ולא חמישה ימים, ולא עשרה ימים, ולא עשרים יום - עד חודש ימים. חמישה שלבים לפני \"חודש ימים.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וּבְרֶדֶת הַטַּל\"\nשאלה: מתי בדיוק ירד המן ביחס לטל, ובאיזה זמן ביממה?", "a": "המן ירד בלילה, ביחד עם הטל: \"וברדת הטל על המחנה לילה ירד המן עליו\" - כלומר המן ירד על הטל בלילה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"בֹּכֶה לְמִשְׁפְּחֹתָיו\"\nשאלה: היכן בדיוק עמד כל אחד כשבכה, ומה היו שתי התגובות המיידיות - של ה' ושל משה?", "a": "כל אחד בכה \"לפתח אהלו\" - איש לפתח אהלו למשפחותיו. שתי התגובות: (1) \"ויחר אף ה' מאוד\" - ה' כעס, (2) \"ובעיני משה רע\" - גם משה ראה את הדבר כרע. ומיד אחרי כן פנה משה לה' בתלונתו.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הֲרַק אַךְ בְּמֹשֶׁה דִּבֶּר יְהוָה\"\nשאלה: מי אמרו את הדברים האלה, ומה היה הנושא שעורר את הטענה?", "a": "מרים ואהרן אמרו זאת. הטענה עלתה על רקע הדיבור נגד משה בגלל האישה הכושית שלקח. הם טענו שגם הם נביאים כמו משה ושאין לו מעמד מיוחד.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"אִם יִהְיֶה נְבִיאֲכֶם יְהוָה בַּמַּרְאָה אֵלָיו\"\nשאלה: מי אמר את הדברים, ומה ההבדל שהוא מציין מיד אחרי כן?", "a": "ה' אמר זאת למרים ואהרן. מיד אחרי כן הוא מבדיל את משה: \"לא כן עבדי משה, בכל ביתי נאמן הוא. פה אל פה אדבר בו ומראה ולא בחידות ותמונת ה' יביט\" - נבואת משה ישירה ולא דרך חלום ומראה כשאר הנביאים.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"אֵל נָא רְפָא נָא לָהּ\"\nשאלה: מי אמר את הדברים האלה, למי, ובשביל מי?", "a": "משה אמר זאת לה', והתפלל בעד מרים אחותו שלקתה בצרעת כשלג. זו אחת התפילות הקצרות ביותר בתנ\"ך - חמש מילים בלבד.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"בִּי אֲדֹנִי אַל נָא תָשֵׁת עָלֵינוּ\"\nשאלה: מי אמר את הדברים האלה ולמי, ובאיזה דימוי המשיך מיד אחרי?", "a": "אהרן אמר למשה, אחרי שראה את מרים מצורעת. מיד אחרי דברים אלה אהרן הוסיף: \"אל נא תהי כמת אשר בצאתו מרחם אמו ויאכל חצי בשרו\" - השווה את מרים המצורעת לוולד מת שחצי בשרו נאכל.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַתִּסָּגֵר מִרְיָם מִחוּץ לַמַּחֲנֶה\"\nשאלה: מה קרה אחרי שהתקיים מה שמתואר כאן?", "a": "אחרי שמרים נאספה חזרה למחנה, נסעו בני ישראל מחצרות וחנו במדבר פארן.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַתְּדַבֵּר מִרְיָם וְאַהֲרֹן בְּמֹשֶׁה\"\nשאלה: מה מיוחד בצורת הפועל \"ותדבר\" כאן, ומהי התכונה שהכתוב מייחס למשה מיד לאחר מכן?", "a": "הפועל \"ותדבר\" כתוב בלשון נקבה יחיד, למרות ששני דוברים מוזכרים (מרים ואהרן), מה שמלמד שמרים היתה היוזמת העיקרית. מיד אחרי כן הכתוב מציין: \"והאיש משה עניו מאוד מכל האדם אשר על פני האדמה\" - מסביר מדוע משה לא הגיב לעלבון.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְאָבִיהָ יָרֹק יָרַק בְּפָנֶיהָ\"\nשאלה: מי אמר את הדברים האלה ולמי, ומהו הטיעון ההגיוני (קל וחומר) שעומד מאחורי דברים אלה?", "a": "ה' אמר למשה. הטיעון: אם אביה (אדם רגיל) היה יורק בפניה, היתה מתביישת ומוסגרת שבעת ימים. קל וחומר כשה' עצמו כעס עליה - לפחות שבעת ימים תיסגר מחוץ למחנה. ואכן מרים הוסגרה שבעת ימים.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְהֶעָנָן סָר מֵעַל הָאֹהֶל\"\nשאלה: מה קרה ממש לפני שהענן סר, ומה עשה אהרן כשראה את מה שמתואר כאן?", "a": "לפני שהענן סר - ה' חרה אפו במרים ואהרן והלך (ויחר אף ה' בם וילך). כשאהרן פנה אל מרים וראה שהיא מצורעת, הוא פנה אל משה והתחנן: \"בי אדני אל נא תשת עלינו חטאת אשר נואלנו ואשר חטאנו. אל נא תהי כמת אשר בצאתו מרחם אמו ויאכל חצי בשרו.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיִּקְרָא אַהֲרֹן וּמִרְיָם\"\nשאלה: כמה אנשים נקראו בתחילה לצאת אל אוהל מועד, וכמה נקראו בנפרד בפסוק הזה? מי לא נקרא כאן ומדוע?", "a": "בתחילה נקראו שלושה: \"צאו שלשתכם אל אוהל מועד\" (משה, אהרן ומרים). אך אחר כך ה' קרא רק לאהרן ומרים - שניים בלבד. משה לא נקרא כי ה' רצה לדבר עם אהרן ומרים בנפרד, להוכיח אותם על שדיברו נגד משה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיִּחַר אַף יְהוָה בָּם וַיֵּלַךְ\"\nשאלה: \"בם\" מתייחס לאהרן ומרים, אך מה גילו מיד לאחר ש\"הלך\" ומי גילה זאת ראשון?", "a": "מיד לאחר שה' הלך והענן סר מעל האוהל, גילו שמרים מצורעת כשלג. אהרן הוא שגילה זאת ראשון: \"ויפן אהרן אל מרים והנה מצורעת\" - אהרן פנה אליה וראה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"כִּי אִשָּׁה כֻשִׁית לָקָח\"\nשאלה: מה התכונה שהתורה מייחסת למשה מיד לאחר התלונה על האישה הכושית, ומהו הפועל המיוחד בפסוק הפותח שמלמד מי יזם את הדיבור?", "a": "מיד לאחר התלונה, התורה מציינת: \"והאיש משה עניו מאוד מכל האדם אשר על פני האדמה.\" הפועל \"ותדבר\" כתוב בלשון נקבה יחיד, למרות שמוזכרים מרים ואהרן, מה שמלמד שמרים היתה היוזמת.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"אַל נָא תְהִי כַּמֵּת\"\nשאלה: מי אמר את הדברים האלה, ועל מי מדבר הכינוי \"אמו\" כאן? ומה הבקשה שקדמה לדימוי הזה?", "a": "אהרן אמר זאת למשה, על מרים אחותם. \"אמו\" מתייחס לאם של הוולד המת שמשמש כדימוי - לא לאמם של משה ואהרן. הבקשה שקדמה: \"בי אדני אל נא תשת עלינו חטאת אשר נואלנו ואשר חטאנו.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְהָעָם לֹא נָסַע עַד הֵאָסֵף\"\nשאלה: כמה ימים נאלץ כל העם להמתין במקום, ומהו הטיעון ההגיוני (קל וחומר) שה' השתמש בו כדי לקבוע את משך ההסגר?", "a": "העם המתין שבעת ימים. הקל וחומר של ה': \"ואביה ירוק ירק בפניה הלא תכלם שבעת ימים\" - אם אביה (בשר ודם) היה יורק בפניה, היתה נכלמת שבעה ימים; קל וחומר כשה' עצמו כעס עליה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"צְאוּ שְׁלָשְׁתְּכֶם אֶל אֹהֶל מוֹעֵד\"\nשאלה: מי אמר את הדברים האלה, ומי מבין השלושה לא נקרא שוב בנפרד לאחר שיצאו?", "a": "ה' אמר פתאום אל משה ואל אהרן ואל מרים. לאחר שיצאו שלושתם, ה' קרא רק את אהרן ומרים בנפרד (\"ויקרא אהרן ומרים ויצאו שניהם\") - משה לא נקרא שוב, כי ה' רצה להוכיח את אהרן ומרים.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיֵּרֶד יְהוָה בְּעַמּוּד עָנָן\"\nשאלה: היכן עמד עמוד הענן, ומה עשה ה' מיד לאחר שירד בו?", "a": "עמוד הענן עמד פתח האוהל (אוהל מועד). מיד לאחר שירד בו, ה' קרא לאהרן ומרים בנפרד ויצאו שניהם, ואז הסביר להם את ייחוד נבואת משה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"בְּכָל בֵּיתִי נֶאֱמָן הוּא\"\nשאלה: על מי נאמר \"בכל ביתי נאמן הוא\", ומה שתי הדרכים שבהן נבואתו שונה משאר הנביאים לפי אותו דובר?", "a": "נאמר על משה, על ידי ה'. שתי הדרכים: (1) \"פה אל פה אדבר בו\" - נבואה ישירה ולא דרך חלום ומראה, ו-(2) \"ומראה ולא בחידות ותמונת ה' יביט\" - רואה בבירור ולא בחידות.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"עָלֹה נַעֲלֶה וְיָרַשְׁנוּ אֹתָהּ\"\nשאלה: מי אמר את הדברים האלה, ומה ענו לו שאר המרגלים?", "a": "כלב בן יפונה אמר זאת כשהשתיק את העם אל מול משה. שאר המרגלים ענו: \"לא נוכל לעלות אל העם כי חזק הוא ממנו\", והוציאו דיבת הארץ רעה ואמרו \"ונהי בעינינו כחגבים וכן היינו בעיניהם.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"אַכֶּנּוּ בַדֶּבֶר וְאוֹרִשֶׁנּוּ\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה היה הטיעון שנאמר בתגובה?", "a": "ה' אמר למשה שיכה את העם בדבר ויעשה את משה לגוי גדול. משה ענה שאם ה' ישמיד את העם, הגויים יאמרו \"מבלתי יכולת ה' להביא את העם הזה אל הארץ אשר נשבע להם וישחטם במדבר\" - יחשבו שה' לא היה מסוגל. משה גם הזכיר את י\"ג מידות הרחמים.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"סָלַחְתִּי כִּדְבָרֶךָ\"\nשאלה: מי אמר את הדברים ולמי, ומה בכל זאת היה העונש למרות דברים אלה?", "a": "ה' אמר למשה שסלח לעם. אך למרות הסליחה, כל הגברים מבן עשרים שנה ומעלה (חוץ מכלב ויהושע) נגזר עליהם למות במדבר ולא לראות את הארץ. ארבעים שנות נדודים - \"יום לשנה יום לשנה\" כנגד ארבעים ימי הריגול.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיַּעְפִּלוּ לַעֲלוֹת אֶל רֹאשׁ הָהָר\"\nשאלה: מי \"העפילו לעלות\" ולמרות איזו אזהרה, ומה קרה להם?", "a": "בני ישראל העפילו לעלות להר למרות אזהרת משה: \"אל תעלו כי אין ה' בקרבכם ולא תנגפו לפני אויביכם.\" הפסוק מדגיש שארון ברית ה' ומשה לא זזו מהמחנה - כלומר, עלו ללא תמיכה אלוהית. העמלקי והכנעני הכו אותם ויכתום עד החרמה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"עֵקֶב הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ\"\nשאלה: על מי מדובר בפסוק, ומה קרה לעשרת האחרים שחזרו איתו מאותה משימה?", "a": "מדובר על כלב בן יפונה, שה' מכנה אותו \"עבדי\" כי היתה בו רוח אחרת ומילא אחרי ה'. עשרת המרגלים שהוציאו דיבת הארץ רעה מתו במגפה לפני ה'. רק כלב ויהושע בן נון שרדו מכל המרגלים.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ הִוא\"\nשאלה: מי אמרו את הדברים האלה, ובאיזה דימוי קיצוני הם תיארו את עצמם מיד אחרי?", "a": "המרגלים (עשרה מתוך שנים עשר, ללא כלב ויהושע) הוציאו דיבת הארץ רעה ואמרו זאת. מיד אחרי הם הוסיפו: \"ושם ראינו את הנפילים בני ענק מן הנפלים ונהי בעינינו כחגבים וכן היינו בעיניהם\" - השוו עצמם לחגבים מול הנפילים.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"נִתְּנָה רֹאשׁ וְנָשׁוּבָה מִצְרָיְמָה\"\nשאלה: מי אמרו את הדברים האלה, ומה עשו משה ואהרן בתגובה, ומה עשו יהושע וכלב?", "a": "בני ישראל אמרו איש אל אחיו. בתגובה - משה ואהרן נפלו על פניהם לפני כל קהל עדת בני ישראל. יהושע בן נון וכלב בן יפונה קרעו את בגדיהם ואמרו לעדה שהארץ \"טובה מאוד מאוד\" וש\"אך בה' אל תמרודו.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"כִּי לַחְמֵנוּ הֵם סָר צִלָּם\"\nשאלה: מי אמרו את הדברים האלה, ומה רצתה העדה לעשות להם בתגובה?", "a": "יהושע בן נון וכלב בן יפונה אמרו זאת לכל עדת בני ישראל, בניסיון לעודד את העם לעלות לארץ. בתגובה - \"ויאמרו כל העדה לרגום אותם באבנים\" - העדה רצתה לסקול אותם, אך כבוד ה' נראה באוהל מועד.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה\"\nשאלה: מי אמר את הדברים האלה ולמי, ומי היו שני האנשים שהוחרגו מהעונש הזה?", "a": "ה' אמר זאת למשה ולאהרן, כגזר דין על העם. כל הגברים מבן עשרים שנה ומעלה שהלינו על ה' נגזר עליהם למות במדבר. שני האנשים שהוחרגו: כלב בן יפונה ויהושע בן נון - כי הם לא הוציאו דיבת הארץ.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיִּכְרְתוּ מִשָּׁם זְמוֹרָה וְאֶשְׁכּוֹל עֲנָבִים\"\nשאלה: כמה ימים תרו המרגלים את הארץ, ומאיפה עד איפה הם הגיעו?", "a": "המרגלים תרו את הארץ ארבעים יום. הם עלו ממדבר צין (בדרום) עד רחוב לבוא חמת (בצפון) - כלומר חצו את כל ארץ כנען מדרומה לצפונה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיִּקְרָא מֹשֶׁה לְהוֹשֵׁעַ בִּן נוּן\"\nשאלה: מה היה שמו המקורי של יהושע לפני ששינה משה, ומאיזה שבט היה?", "a": "שמו המקורי היה הושע בן נון, והוא היה משבט אפרים. משה שינה את שמו ליהושע לפני שליחת המרגלים.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיַּהַס כָּלֵב אֶת הָעָם\"\nשאלה: מה פירוש \"ויהס\" כאן, ומה אמר כלב מיד אחרי שהשתיק את העם?", "a": "\"ויהס\" פירושו השתיק, החריש. מיד אחרי שהשתיק את העם, כלב אמר: \"עלה נעלה וירשנו אותה כי יכול נוכל לה\" - עודד את העם לעלות ולכבוש את הארץ.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיְנַסּוּ אֹתִי זֶה עֶשֶׂר פְּעָמִים\"\nשאלה: מי אמר את הדברים האלה ועל מי, ומה הגזרה שנגזרה מיד אחרי?", "a": "ה' אמר זאת למשה, על בני ישראל שניסו את ה' עשר פעמים ולא שמעו בקולו. מיד אחרי גזר: \"אם יראו את הארץ אשר נשבעתי לאבותם\" - נשבע שדור המדבר לא יראה את הארץ. רק כלב, שהיתה בו \"רוח אחרת\", הובטח שייכנס לארץ.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הִנֶּנּוּ וְעָלִינוּ אֶל הַמָּקוֹם\"\nשאלה: מתי אמרו את הדברים האלה - לפני או אחרי גזר הדין, ומה אמר להם משה בתגובה?", "a": "אמרו זאת אחרי גזר הדין, כשהשכימו בבוקר שלמחרת. משה הזהיר אותם: \"למה זה אתם עוברים את פי ה' והיא לא תצלח? אל תעלו כי אין ה' בקרבכם ולא תנגפו לפני אויביכם.\" למרות זאת העפילו לעלות - והעמלקי והכנעני הכום ויכתום עד החרמה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְטַפְּכֶם אֲשֶׁר אֲמַרְתֶּם לָבַז יִהְיֶה\"\nשאלה: מה טענו בני ישראל על הטף שה' הפך כאן לאירוניה, ומה בדיוק גזר ה' שיקרה לבניהם במדבר?", "a": "בני ישראל טענו: \"נשינו וטפנו יהיו לבז\" - שילדיהם יהיו שלל לאויב אם יעלו לארץ. האירוניה: דווקא הטף ייכנס לארץ, והאבות ימותו. ה' גזר: \"ובניכם יהיו רועים במדבר ארבעים שנה ונשאו את זנותיכם עד תום פגריכם במדבר.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיַּהַס כָּלֵב אֶת הָעָם\"\nשאלה: מה פירוש \"ויהס\" ולמי הוא השתיק את העם, ומאיזה שבט היה כלב?", "a": "\"ויהס\" פירושו השתיק. כלב השתיק את העם \"אל משה\" - כלומר לכיוון משה או כלפי משה. כלב בן יפונה היה משבט יהודה (נשיא שבט יהודה ברשימת המרגלים).", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיִּשָּׂאֻהוּ בַמּוֹט בִּשְׁנָיִם\"\nשאלה: מה נשאו במוט בשניים, מאיזה מקום בדיוק כרתו אותו, ומה עוד הביאו משם חוץ מזה?", "a": "נשאו אשכול ענבים אחד שכרתו עם זמורה מנחל אשכול. חוץ מהענבים הביאו גם מן הרימונים ומן התאנים. המקום נקרא נחל אשכול על שם האשכול שכרתו.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"מִמִּדְבַּר צִן עַד רְחֹב\"\nשאלה: מה מתאר הטקסט הזה, כמה ימים נמשכה הפעולה, ומי שלח את האנשים שביצעו אותה?", "a": "הטקסט מתאר את מסלול ריגול הארץ - מדרומה (מדבר צין) עד צפונה (רחוב לבוא חמת). הריגול נמשך ארבעים יום. משה שלח את שנים עשר המרגלים לפי ציווי ה'.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"אֲחִימַן שֵׁשַׁי וְתַלְמַי\"\nשאלה: מי הם שלושת האנשים האלה, באיזו עיר נמצאו, ומה הפרט ההיסטורי המפתיע שהכתוב מזכיר על אותה עיר?", "a": "אחימן, ששי ותלמי הם ילידי הענק (ענקים) שהמרגלים מצאו בחברון. הפרט ההיסטורי: \"וחברון שבע שנים נבנתה לפני צוען מצרים\" - חברון נבנתה שבע שנים לפני העיר צוען שבמצרים.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"עֲמָלֵק יוֹשֵׁב בְּאֶרֶץ הַנֶּגֶב\"\nשאלה: המרגלים מפרטים איזה עם יושב באיזה אזור. מנה את כל חמשת העמים ומיקומיהם לפי דברי המרגלים.", "a": "(1) עמלק - בארץ הנגב, (2) החתי - בהר, (3) היבוסי - בהר, (4) האמורי - בהר, (5) הכנעני - על הים ועל יד הירדן. שלושה עמים בהר, אחד בנגב, ואחד על הים/ירדן.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"אֶרֶךְ אַפַּיִם וְרַב חֶסֶד\"\nשאלה: מי אמר את המילים האלה ולמי, ומה ההבדל בין הנוסח כאן לבין נוסח י\"ג מידות הרחמים המקורי בשמות?", "a": "משה אמר זאת לה', כחלק מטיעונו שלא ישמיד את העם. ההבדל: כאן הנוסח הוא \"ה' ארך אפים ורב חסד נושא עוון ופשע ונקה לא ינקה פוקד עוון אבות על בנים על שלשים ועל רבעים\" - גרסה מקוצרת שאינה כוללת את כל י\"ג המידות (חסר \"רחום וחנון\", \"אמת\", \"נוצר חסד לאלפים\" ועוד).", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"אַנְשֵׁי מִדּוֹת\"\nשאלה: מי הם \"אנשי מידות\", באיזה הקשר מוזכרים, ומה הביטוי שמופיע מיד לפניהם באותו פסוק?", "a": "\"אנשי מידות\" הם אנשים בעלי קומה גבוהה - תושבי הארץ שהמרגלים ראו. הם מוזכרים בהוצאת דיבת הארץ: \"הארץ אשר עברנו בה לתור אותה ארץ אוכלת יושביה הוא וכל העם אשר ראינו בתוכה אנשי מידות\" - מיד לפני \"אנשי מידות\" מופיע \"כל העם אשר ראינו בתוכה.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"שַׁמּוּעַ בֶּן זַכּוּר\"\nשאלה: מאיזה שבט היה שמוע בן זכור, ומי היה המרגל משבט בנימין?", "a": "שמוע בן זכור היה המרגל משבט ראובן - הראשון ברשימה. המרגל משבט בנימין היה פלטי בן רפוא.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"רַב לָכֶם כִּי כָל הָעֵדָה כֻּלָּם\"\nשאלה: מי אמרו את הדברים האלה ולמי, ומה היתה תגובת השומע?", "a": "קורח ועדתו (מאתיים וחמישים נשיאי עדה) אמרו זאת למשה ולאהרן. תגובת משה: נפל על פניו, ואז הציע מבחן קטורת - כל אחד יקריב קטורת למחרת, וה' יבחר מי הוא הקדוש.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הֶעֱלִיתָנוּ מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ\"\nשאלה: מי אמרו את הדברים האלה, ומה מפתיע בביטוי \"ארץ זבת חלב ודבש\" כאן?", "a": "דתן ואבירם בני אליאב (משבט ראובן) אמרו זאת כשמשה שלח לקרוא להם ענו \"לא נעלה.\" המפתיע: הם כינו את מצרים \"ארץ זבת חלב ודבש\" - ביטוי השמור בדרך כלל לארץ ישראל. בכך הפכו את הסדר וראו את מצרים כארץ המובטחת.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַתִּבָּקַע הָאֲדָמָה אֲשֶׁר תַּחְתֵּיהֶם\"\nשאלה: מי סיים לדבר, ומה היו \"כל הדברים האלה\" שאמר ממש לפני שהאדמה נבקעה?", "a": "משה סיים לדבר. דבריו היו מבחן אלוהי: \"בזאת תדעון כי ה' שלחני... אם כמות כל האדם ימותון אלה - לא ה' שלחני. ואם בריאה יברא ה' ופצתה האדמה את פיה ובלעה אותם... וידעתם כי ניאצו האנשים האלה את ה'.\" מיד כשסיים - האדמה נבקעה ובלעה את קורח, דתן ואבירם.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיַּעֲמֹד בֵּין הַמֵּתִים וּבֵין הַחַיִּים\"\nשאלה: מי עמד בין המתים ובין החיים, ומה עשה כדי לעצור את המגפה?", "a": "אהרן הכהן. משה אמר לו לקחת את המחתה, לתת עליה אש מעל המזבח ולשים קטורת, ולהוליך מהרה אל העדה לכפר עליהם. אהרן רץ אל תוך הקהל, נתן קטורת וכיפר על העם. המגפה הרגה ארבעה עשר אלף ושבע מאות איש.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְהִנֵּה פָּרַח מַטֵּה אַהֲרֹן לְבֵית לֵוִי\"\nשאלה: היכן הונח המטה המתואר כאן, וכמה מטות הונחו שם בסך הכל?", "a": "המטה הונח באוהל העדות (אוהל מועד). הונחו שנים עשר מטות בסך הכל - מטה אחד לכל שבט, ושם אהרן נכתב על מטה לוי. ה' אמר שהמטה של האיש שיבחר בו יפרח - ומטה אהרן הוא שפרח, הציץ ציץ וגמל שקדים, כדי להוכיח את בחירת אהרן לכהונה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הָאִישׁ אֶחָד יֶחֱטָא וְעַל כָּל הָעֵדָה\"\nשאלה: מי אמרו את הדברים האלה ולמי, ומה ביקש מהם ה' לפני שאמרו זאת?", "a": "משה ואהרן אמרו זאת לה', לאחר שנפלו על פניהם. לפני כן ה' אמר: \"הבדלו מתוך העדה הזאת ואכלה אותם כרגע\" - רצה להשמיד את כל העדה. משה ואהרן טענו שאין זה צודק להעניש את כולם בגלל חטא של אדם אחד (קורח).", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה היה האירוע שגרם לו לומר זאת?", "a": "משה אמר זאת לה', לאחר שחרה לו מאוד. הסיבה: דתן ואבירם סירבו לעלות אל משה (אמרו \"לא נעלה\") והאשימו אותו שהוציאם ממצרים כדי להמיתם במדבר ולהשתרר עליהם. משה מגן על עצמו שמעולם לא ניצל את תפקידו.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְאֵשׁ יָצְאָה מֵאֵת יְהוָה\"\nשאלה: מה קרה במקביל לאירוע הזה (עונש אחר שהתרחש באותו זמן), ומה נעשה עם המחתות של אותם אנשים?", "a": "במקביל - האדמה נבקעה ובלעה את קורח, דתן ואבירם ואת כל אשר להם, וירדו חיים שאולה. המחתות של מאתיים וחמישים האיש נאספו על ידי אלעזר בן אהרן הכהן, רוקעו ונעשו ציפוי למזבח כזיכרון - \"למען אשר לא יקרב איש זר אשר לא מזרע אהרן הוא להקטיר קטורת.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"אַתֶּם הֲמִתֶּם אֶת עַם יְהוָה\"\nשאלה: מי אמרו את הדברים האלה ולמי, ומה היה העונש שבא בעקבות טענה זו?", "a": "כל עדת בני ישראל אמרו זאת למשה ולאהרן, ממחרת לאירוע בליעת קורח ועדתו. בעקבות טענה זו פרצה מגפה בעם שהרגה ארבעה עשר אלף ושבע מאות איש (מלבד המתים על דבר קורח). המגפה נעצרה רק כשאהרן רץ עם הקטורת ועמד בין המתים ובין החיים.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הֵן גָּוַעְנוּ אָבַדְנוּ כֻּלָּנוּ אָבָדְנוּ\"\nשאלה: מי אמרו את הדברים האלה ולמי, ואיזה אירוע סופי הוכיח להם מי הנבחר לכהונה?", "a": "בני ישראל אמרו זאת למשה, מתוך פחד לאחר כל העונשים. האירוע שהוכיח את בחירת אהרן: ה' ציווה שכל שבט יניח מטה באוהל העדות, ומטה אהרן לבית לוי פרח בלילה אחד - הוציא פרח, הציץ ציץ וגמל שקדים, והוא הושב לאוהל העדות כאות לבני מרי.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְאוֹן בֶּן פֶּלֶת בְּנֵי רְאוּבֵן\"\nשאלה: מה מיוחד בדמות און בן פלת - הוא מוזכר כאן, אך מה קורה לו בהמשך כל הסיפור?", "a": "און בן פלת מוזכר בפסוק הראשון כשותף למרד קורח, אך אינו מוזכר שוב בכל המשך הסיפור - לא בעונש, לא בבליעה ולא בשריפה. הוא נעלם לחלוטין מהסיפור.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר\"\nשאלה: מי אמרו \"לא נעלה\" ולמי, ומה הביטוי \"הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר\" מאשים את משה?", "a": "דתן ואבירם בני אליאב אמרו זאת כשמשה שלח לקרוא להם. הביטוי מאשים את משה שהוא מנסה \"לנקר עיניים\" - כלומר להונות ולעוור את האנשים, להסתיר שלא הביא אותם לארץ זבת חלב ודבש ולא נתן להם נחלת שדה וכרם.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיִּקַּח אֶלְעָזָר הַכֹּהֵן\"\nשאלה: מדוע לא אהרן עצמו אסף את המחתות, ומה המטרה של ציפוי המזבח במחתות?", "a": "ה' ציווה את אלעזר (ולא אהרן) להרים את המחתות \"מבין השרפה\" - ייתכן כי הכהן הגדול לא יכול היה להיטמא למתים. המטרה: \"זכרון לבני ישראל למען אשר לא יקרב איש זר אשר לא מזרע אהרן הוא להקטיר קטורת לפני ה'\" - תזכורת שזרים לא יקריבו קטורת.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"כִּי יָצָא הַקֶּצֶף מִלִּפְנֵי יְהוָה\"\nשאלה: מי אמר משפט זה ולמי, ומה הפעולה המדויקת שנצטווה השומע לעשות?", "a": "משה אמר לאהרן. הפעולה: \"קח את המחתה ותן עליה אש מעל המזבח ושים קטורת והולך מהרה אל העדה וכפר עליהם.\" אהרן רץ אל תוך הקהל, נתן קטורת וכיפר על העם, ועמד בין המתים ובין החיים.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הָשֵׁב אֶת מַטֵּה אַהֲרֹן לִפְנֵי הָעֵדוּת\"\nשאלה: מי אמר את הדברים, ומה היתה המטרה הכפולה של השבת המטה לאוהל העדות?", "a": "ה' אמר למשה. המטרה הכפולה: (1) \"לאות לבני מרי\" - אות למורדים שאהרן הוא הנבחר, ו-(2) \"ותכל תלונותם מעלי ולא ימותו\" - לסיים את תלונות בני ישראל כדי שלא ימותו עוד.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיִּפֹּל עַל פָּנָיו\"\nשאלה: מי נפל על פניו, מה שמע ממש לפני כן שגרם לו לנפול, ומה הציע מיד אחרי שקם?", "a": "משה נפל על פניו כששמע את קורח ועדתו אומרים \"רב לכם כי כל העדה כולם קדושים... ומדוע תתנשאו על קהל ה'.\" מיד אחרי שקם הציע את מבחן הקטורת: כל אחד יקריב קטורת וה' יבחר מי הקדוש.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיֹּאמְרוּ לֹא נַעֲלֶה\"\nשאלה: מי אמרו \"לא נעלה\" ולמי, ואיזה ביטוי מפתיע השתמשו כדי לתאר את מצרים?", "a": "דתן ואבירם בני אליאב אמרו זאת כשמשה שלח לקרוא להם. הם כינו את מצרים \"ארץ זבת חלב ודבש\" - ביטוי השמור בדרך כלל לארץ ישראל, ובכך הפכו את הסדר.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"זִכָּרוֹן לִבְנֵי יִשְׂרָאֵל\"\nשאלה: מהו ה\"זיכרון\" המדובר כאן, ממה הוא עשוי, ומי הוא האיש שאסף את החומר הגולמי?", "a": "הזיכרון הוא ציפוי המזבח שנעשה מהמחתות של מאתיים וחמישים מקריבי הקטורת שנשרפו. המחתות רוקעו לפחים לציפוי. אלעזר בן אהרן הכהן הוא שאסף את מחתות הנחושת מבין השרפה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"בֶּן יִצְהָר בֶּן קְהָת\"\nשאלה: השלם את שושלת היוחסין המלאה של קורח כפי שמופיעה בפסוק הראשון.", "a": "קורח בן יצהר בן קהת בן לוי - ארבעה דורות. קורח היה לוי, מבני קהת, ובן של יצהר.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"קְרִאֵי מוֹעֵד אַנְשֵׁי שֵׁם\"\nשאלה: על מי נאמרו שני הכינויים \"קריאי מועד אנשי שם\", כמה היו, ומהו תפקידם שמוזכר לפני כן?", "a": "נאמר על מאתיים וחמישים האנשים מבני ישראל שקמו עם קורח נגד משה. תפקידם: \"נשיאי עדה\" - הם היו נשיאי העדה, אנשים מוכרים וידועי שם שנבחרו למועד.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"בֹּקֶר וְיֹדַע יְהוָה\"\nשאלה: מי אמר \"בוקר ויודע ה'\", ומה המבחן המדויק שהציע מיד לאחר מכן?", "a": "משה אמר לקורח ולכל עדתו. המבחן: \"קחו לכם מחתות... ותנו בהן אש ושימו עליהן קטורת לפני ה' מחר, והיה האיש אשר יבחר ה' הוא הקדוש\" - כל אחד יקריב קטורת, וה' יראה מי הנבחר.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"פֶּן תִּבְלָעֵנוּ הָאָרֶץ\"\nשאלה: מי אמרו \"פן תבלענו הארץ\", ומה עשו מיד לפני שאמרו זאת?", "a": "כל ישראל אשר סביבותיהם (סביב קורח, דתן ואבירם) אמרו זאת. מיד לפני כן הם נסו לקולם - ברחו כששמעו את קול הנבלעים: \"וכל ישראל אשר סביבותיהם נסו לקולם כי אמרו פן תבלענו הארץ.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הַאִם תַּמְנוּ לִגְוֹעַ\"\nשאלה: מי אמרו את הדברים \"האם תמנו לגווע\", ומה הביטוי המלא שקדם לדברים אלה?", "a": "בני ישראל אמרו למשה, בפחד לאחר כל האירועים. הביטוי המלא שקדם: \"הן גוענו אבדנו כולנו אבדנו. כל הקרב הקרב אל משכן ה' ימות - האם תמנו לגווע\" - שלוש צעקות יאוש ברצף.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַתָּמָת שָׁם מִרְיָם וַתִּקָּבֵר שָׁם\"\nשאלה: היכן התרחש האירוע המתואר, ומה קרה מיד אחריו?", "a": "מרים מתה ונקברה בקדש, במדבר צין. מיד לאחר מותה לא היה מים לעדה, והעם נקהל על משה ואהרן. חז\"ל קישרו זאת ל\"בארה של מרים\" - הבאר שליוותה את ישראל בזכותה, ועם מותה נעלמו המים.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"שִׁמְעוּ נָא הַמֹּרִים\"\nשאלה: מי אמר את הדברים האלה, ומה היה ההבדל בין מה שנצטווה לעשות לבין מה שעשה בפועל?", "a": "משה אמר זאת לעם. ה' ציווה עליו \"ודברתם אל הסלע לעיניהם ונתן מימיו\" - לדבר אל הסלע. אך משה הכה את הסלע במטהו פעמיים במקום לדבר אליו. העונש: \"יען לא האמנתם בי להקדישני... לכן לא תביאו את הקהל הזה אל הארץ.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"לֹא תַעֲבֹר בִּי פֶּן בַּחֶרֶב\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה היה הקשר הבקשה שנדחתה?", "a": "מלך אדום אמר זאת לישראל. משה שלח מלאכים מקדש אל מלך אדום, קרא לו \"אחיך ישראל\", והבטיח: \"דרך המלך נלך, לא נטה ימין ושמאול.\" אדום סירב לתת לישראל לעבור בארצו ויצא לקראתם בעם כבד וביד חזקה, וישראל נטה מעליו.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיַּפְשֵׁט מֹשֶׁה אֶת אַהֲרֹן אֶת בְּגָדָיו\"\nשאלה: באיזה הר מתרחש האירוע המתואר, ומה הסיבה שה' נתן למה שקרה כאן?", "a": "הר ההר, על גבול ארץ אדום. הסיבה שה' נתן: \"על אשר מריתם את פי למי מריבה\" - בגלל חטא הכאת הסלע במי מריבה, נגזר על אהרן (ועל משה) שלא ייכנסו לארץ.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיִּבְכּוּ אֶת אַהֲרֹן שְׁלֹשִׁים יוֹם\"\nשאלה: מי ירד מההר לפני שהעם ראה את מה שמתואר כאן, ומה היה תפקידו החדש?", "a": "משה ואלעזר בן אהרן ירדו מן ההר. אלעזר, שהולבש בבגדי הכהונה של אביו על ההר, הפך לכהן הגדול החדש במקום אהרן אביו.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְלוּ גָוַעְנוּ בִּגְוַע אַחֵינוּ\"\nשאלה: מי אמרו את הדברים האלה ולמי, ומה היתה התלונה המלאה שלהם?", "a": "העם אמר זאת למשה ולאהרן, כשרבו עמהם על חוסר המים בקדש. התלונה המלאה: \"ולמה הבאתם את קהל ה' אל המדבר הזה למות שם אנחנו ובעירנו. ולמה העליתנו ממצרים להביא אותנו אל המקום הרע הזה, לא מקום זרע ותאנה וגפן ורימון ומים אין לשתות.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְדִבַּרְתֶּם אֶל הַסֶּלַע לְעֵינֵיהֶם\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה עשה משה ואהרן לפני שקיבלו את הציווי הזה?", "a": "ה' אמר למשה. לפני כן, משה ואהרן באו מפני הקהל אל פתח אוהל מועד ונפלו על פניהם, וכבוד ה' נראה אליהם. רק אז ה' נתן להם את ההוראה לדבר אל הסלע.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"נַעְבְּרָה נָּא בְאַרְצֶךָ דֶּרֶךְ הַמֶּלֶךְ\"\nשאלה: מי שלח את הבקשה הזו ולמי, וכיצד כינה השולח את עצמו בפנייה?", "a": "משה שלח מלאכים מקדש אל מלך אדום. בפנייה, משה כינה את ישראל \"אחיך ישראל\" - כי אדום הוא צאצא עשיו אחי יעקב. הוא גם סיפר על התלאות שמצאו את ישראל, על הירידה למצרים והיציאה ממנה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"יֵאָסֵף אַהֲרֹן אֶל עַמָּיו\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה הציווי המעשי שניתן מיד אחרי?", "a": "ה' אמר למשה ולאהרן בהר ההר, על גבול ארץ אדום. הציווי המעשי: \"קח את אהרן ואת אלעזר בנו והעל אותם הר ההר. והפשט את אהרן את בגדיו והלבשתם את אלעזר בנו, ואהרן ייאסף ומת שם\" - להעביר את בגדי הכהונה מאהרן לאלעזר בנו.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיַּעֲלוּ אֶל הֹר הָהָר\"\nשאלה: כמה אנשים עלו להר, ומי מהם ירד חזרה?", "a": "שלושה אנשים עלו להר ההר: משה, אהרן ואלעזר בנו של אהרן. רק שניים ירדו חזרה: משה ואלעזר. אהרן מת בראש ההר לאחר שמשה הפשיט ממנו את בגדי הכהונה והלבישם את אלעזר.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"לֹא מְקוֹם זֶרַע וּתְאֵנָה וְגֶפֶן\"\nשאלה: מי אמרו את הדברים, ואיזה אירוע מוזכר בפסוק הראשון של הפרק שחז\"ל קישרו ישירות לתלונה על חוסר המים?", "a": "העם אמר זאת למשה ולאהרן בקדש. האירוע: מות מרים - \"ותמת שם מרים ותקבר שם\", ומיד לאחר מכן \"ולא היה מים לעדה.\" חז\"ל קישרו זאת ל\"בארה של מרים\" שנעלמה עם מותה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיַּךְ אֶת הַסֶּלַע בְּמַטֵּהוּ פַּעֲמָיִם\"\nשאלה: למרות שמשה חטא, מה קרה בפועל לאחר שהכה את הסלע - האם יצאו מים או לא? ומה בדיוק הביטוי שבו ה' מנסח את העונש?", "a": "כן, יצאו מים רבים וגם העדה וגם בעירם שתו. למרות שהתוצאה הושגה, העונש ניתן: \"יען לא האמנתם בי להקדישני לעיני בני ישראל, לכן לא תביאו את הקהל הזה אל הארץ אשר נתתי להם.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁלַח מַלְאָךְ וַיֹּצִאֵנוּ מִמִּצְרָיִם\"\nשאלה: משפט זה הוא חלק מפנייה ארוכה. מי שלח את הפנייה ולמי, ובאיזה כינוי משפחתי פנה השולח למקבל?", "a": "משה שלח מלאכים מקדש אל מלך אדום. הכינוי: \"אחיך ישראל\" - כי אדום (עשיו) הוא אחי יעקב (ישראל). משה סיפר על התלאות שמצאום, על הירידה למצרים ועל היציאה ממנה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיֵּרֶד מֹשֶׁה וְאֶלְעָזָר מִן הָהָר\"\nשאלה: מי נשאר בראש ההר ולא ירד, ומה הפעולה האחרונה שמשה עשה כלפיו לפני שנשאר שם?", "a": "אהרן נשאר בראש ההר - הוא מת שם. הפעולה האחרונה: משה הפשיט את אהרן את בגדיו (בגדי הכהונה) והלביש אותם את אלעזר בנו. רק אז מת אהרן בראש ההר.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"בַּמְסִלָּה נַעֲלֶה וְאִם מֵימֶיךָ נִשְׁתֶּה\"\nשאלה: מי אמרו את הדברים האלה ולמי, ומה הציעו לשלם? ומה היתה התשובה שקיבלו?", "a": "בני ישראל אמרו למלך אדום, בניסיון שני לשכנעו. הציעו לשלם עבור המים שישתו (\"ונתתי מכרם\" - אתן את דמיהם). התשובה: אדום אמר שוב \"לא תעבור\" ויצא לקראתם בעם כבד וביד חזקה. ישראל נאלץ לנטות ולעקוף את ארץ אדום.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"כֹּה אָמַר אָחִיךָ יִשְׂרָאֵל\"\nשאלה: מי שלח את הפנייה הזו ולמי, ומדוע השתמש בכינוי \"אחיך\"?", "a": "משה שלח מלאכים מקדש אל מלך אדום. הכינוי \"אחיך\" מבוסס על כך שאדום הוא צאצא עשיו, אחי יעקב (ישראל). משה השתמש בכינוי משפחתי כדי לשכנע את אדום להרשות מעבר.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"עַל אֲשֶׁר מְרִיתֶם אֶת פִּי\"\nשאלה: מי אמר את הדברים האלה ולמי, ובאיזה אירוע ספציפי \"מרו את פיו\"?", "a": "ה' אמר למשה ולאהרן בהר ההר. המרייה היתה באירוע מי מריבה - שם משה הכה את הסלע פעמיים במקום לדבר אליו כפי שנצטווה, ובגלל זה נגזר עליהם שלא ייכנסו לארץ.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְלֹא הָיָה מַיִם לָעֵדָה\"\nשאלה: איזה אירוע מוזכר בפסוק הקודם שחז\"ל קישרו ישירות להיעלמות המים, ובאיזה מקום התרחש הדבר?", "a": "בפסוק הקודם מוזכר מות מרים: \"ותמת שם מרים ותקבר שם.\" חז\"ל קישרו את היעלמות המים ל\"בארה של מרים\" שליוותה את ישראל בזכותה. האירוע התרחש בקדש, במדבר צין.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"בַּחֹדֶשׁ הָרִאשׁוֹן\"\nשאלה: איזה אירוע מתרחש \"בחודש הראשון\", ומהם שני האירועים שמתרחשים מיד אחריו באותו מקום?", "a": "בחודש הראשון הגיעו בני ישראל למדבר צין וישבו בקדש. מיד אחרי: (1) מות מרים וקבורתה - \"ותמת שם מרים ותקבר שם\", (2) חוסר מים לעדה - \"ולא היה מים לעדה\" שהוביל לאירוע מי מריבה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְנָתַתִּי מִכְרָם\"\nשאלה: מי אמרו \"ונתתי מכרם\" ולמי, ומה בדיוק הציעו לשלם עבורו?", "a": "בני ישראל אמרו למלך אדום, בניסיון השני לשכנעו להרשות מעבר. הם הציעו לשלם עבור המים שישתו: \"ואם מימיך נשתה אני ומקני ונתתי מכרם\" - אתן את מחירם/דמיהם. אך אדום סירב שוב.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"עִיר קְצֵה גְבוּלֶךָ\"\nשאלה: איזו עיר מכונה \"עיר קצה גבולך\", ובאיזה הקשר מוזכר תיאור זה?", "a": "קדש מכונה \"עיר קצה גבולך\" - עיר בקצה גבול אדום. התיאור מופיע בפנייה של משה למלך אדום: \"והנה אנחנו בקדש עיר קצה גבולך\" - משה מציין שישראל כבר נמצא בגבול אדום ורק מבקש מעבר.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְנַפְשֵׁנוּ קָצָה בַּלֶּחֶם הַקְּלֹקֵל\"\nשאלה: מי אמרו את הדברים האלה ונגד מי, ומה היה העונש שבא בעקבותיהם?", "a": "העם דיבר באלוהים ובמשה. הם כינו את המן \"לחם הקלוקל.\" העונש: ה' שלח בעם נחשים שרפים שנשכו את העם ומת עם רב מישראל.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"עֲשֵׂה לְךָ שָׂרָף וְשִׂים אֹתוֹ\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה ההבדל בין הציווי לבין מה שנעשה בפועל?", "a": "ה' אמר למשה. ה' אמר \"עשה לך שרף\" (סוג נחש), אך משה עשה \"נחש נחושת\" ושמו על הנס. ההבדל: משה בחר בחומר הנחושת (נְחֹשֶׁת) בגלל הדמיון בצליל למילה \"נחש.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"עֲלִי בְאֵר עֱנוּ לָהּ\"\nשאלה: מה שם השירה שהטקסט הזה לקוח ממנה, ומה היה ההקשר שבו ה' הבטיח מים?", "a": "זוהי \"שירת הבאר\" שישראל שרו. ההקשר: ה' אמר למשה \"אסוף את העם ואתנה להם מים.\" לפי השירה, הבאר נחפרה על ידי השרים ונדיבי העם במחוקק ובמשענותם.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְלֹא נָתַן סִיחֹן אֶת יִשְׂרָאֵל עֲבֹר\"\nשאלה: מה ביקש ישראל מסיחון לפני האירוע המתואר, ומה היתה תוצאת המלחמה שפרצה?", "a": "ישראל שלח מלאכים לסיחון מלך האמורי וביקש לעבור בארצו בדרך המלך, בלי לנטות בשדה ובכרם ובלי לשתות מי באר. סיחון סירב ויצא להילחם. ישראל הכה אותו לפי חרב וירש את ארצו מארנון עד יבוק, וישב בחשבון ובכל עריה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"אַל תִּירָא אֹתוֹ כִּי בְיָדְךָ נָתַתִּי\"\nשאלה: מי אמר את הדברים האלה ולמי, ועל מי מדובר?", "a": "ה' אמר למשה על עוג מלך הבשן, שיצא לקראת ישראל למלחמה באדרעי. ה' הרגיע את משה והבטיח ניצחון כמו על סיחון מלך האמורי. ישראל הכו את עוג ואת בניו ואת כל עמו עד בלתי השאיר לו שריד, וירשו את ארצו.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"חָטָאנוּ כִּי דִבַּרְנוּ בַיהוָה וָבָךְ\"\nשאלה: מי אמרו את הדברים האלה ולמי, ומה היה הפתרון שניתן לבעיה?", "a": "העם אמר למשה, לאחר שנחשים שרפים נשכו בעם ומת עם רב. משה התפלל בעד העם, וה' ציווה אותו לעשות שרף ולשים אותו על נס - וכל הנשוך שיביט אליו יחיה. משה עשה נחש נחושת ושם אותו על הנס.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיִּדַּר יִשְׂרָאֵל נֶדֶר לַיהוָה\"\nשאלה: נגד מי נלחמו כאן, ומה שם המקום שנקרא בעקבות הניצחון?", "a": "ישראל נלחם נגד הכנעני מלך ערד יושב הנגב, שתקף את ישראל ושבה מהם שבי. ה' שמע בקול ישראל ונתן את הכנעני בידם, והם החרימו אותם ואת עריהם. המקום נקרא \"חרמה\" - על שם ההחרמה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"אֶעְבְּרָה בְאַרְצֶךָ בְּדֶרֶךְ הַמֶּלֶךְ נֵלֵךְ\"\nשאלה: למי נשלחה הבקשה הזו (לא לאדום!), ומה היתה תוצאת המלחמה שפרצה בעקבות הסירוב?", "a": "ישראל שלח מלאכים אל סיחון מלך האמורי. סיחון סירב, אסף את כל עמו ויצא לקראת ישראל למלחמה ביהצה. ישראל הכה אותו לפי חרב, ירש את ארצו מארנון עד יבוק, וישב בחשבון ובכל עריה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַתִּקְצַר נֶפֶשׁ הָעָם בַּדָּרֶךְ\"\nשאלה: מאיזה מקום נסעו כשקצרה נפשם, ומדוע נאלצו ללכת בדרך ארוכה זו?", "a": "נסעו מהר ההר דרך ים סוף. הסיבה: הם נאלצו לסבוב את ארץ אדום, כי מלך אדום סירב לתת להם לעבור בארצו ויצא לקראתם בעם כבד וביד חזקה. הדרך הארוכה העקיפה גרמה לקוצר רוח.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיַּעַשׂ מֹשֶׁה נְחַשׁ נְחֹשֶׁת\"\nשאלה: ה' ציווה \"עשה לך שרף\" - אך משה עשה \"נחש נחושת\". מה ההבדל בין הציווי לביצוע, ומה היה צריך הנשוך לעשות כדי לחיות?", "a": "ה' אמר \"שרף\" (תיאור כללי של סוג הנחש), ומשה בחר לעשות אותו מנחושת - בגלל דמיון הצלילים בין \"נחש\" ל\"נחושת.\" כל מי שנשכו נחש היה צריך להביט אל נחש הנחושת שעל הנס - \"והביט אל נחש הנחושת וחי.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וּמִמִּדְבָּר מַתָּנָה וּמִמַּתָּנָה נַחֲלִיאֵל\"\nשאלה: מאיזו שירה לקוחים שמות המקומות האלה, ומה היה האירוע שגרם לשירה?", "a": "שמות המקומות לקוחים משירת הבאר. האירוע: ה' אמר למשה \"אסוף את העם ואתנה להם מים\" - ואז ישראל שר \"עלי באר ענו לה, באר חפרוה שרים כרוה נדיבי העם במחוקק במשענותם.\" התחנות מתנה, נחליאל ובמות הן חלק ממסלול המסע שמופיע בהמשך השירה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ לְסִיחֹן\"\nשאלה: על מי מדובר ב\"לו\" ומי אמר את הדברים? ובאיזו עיר התרחשה המלחמה נגד אותו מלך?", "a": "ה' אמר למשה, ו\"לו\" מתייחס לעוג מלך הבשן. המלחמה נגד עוג התרחשה באדרעי - \"ויצא עוג מלך הבשן לקראתם הוא וכל עמו למלחמה אדרעי.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁמַע הַכְּנַעֲנִי מֶלֶךְ עֲרָד\"\nשאלה: מה עשה מלך ערד כשנודע לו שישראל מתקרב, ומה נדר ישראל לה' בתגובה, ומה שם המקום שנקרא בעקבות הניצחון?", "a": "מלך ערד נלחם בישראל ושבה ממנו שבי. ישראל נדר: \"אם נתון תתן את העם הזה בידי והחרמתי את עריהם.\" ה' שמע, נתן את הכנעני, וישראל החרים אותם ואת עריהם. המקום נקרא \"חרמה\" - על שם ההחרמה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"הַנְּחָשִׁים הַשְּׂרָפִים וַיְנַשְּׁכוּ אֶת הָעָם\"\nשאלה: מי שלח את הנחשים השרפים, ומה בדיוק אמר העם למשה שגרם לו להתפלל?", "a": "ה' שלח את הנחשים השרפים בעם. העם בא אל משה ואמר: \"חטאנו כי דברנו בה' ובך, התפלל אל ה' ויסר מעלינו את הנחש\" - הודו בחטאם וביקשו ממשה להתפלל.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"בְּאֵר חֲפָרוּהָ שָׂרִים\"\nשאלה: מי הם ה\"שרים\" שחפרו את הבאר לפי השירה, ובאיזה כלי כרו אותה?", "a": "לפי שירת הבאר, השרים ונדיבי העם חפרו וכרו את הבאר \"במחוקק במשענותם\" - כלומר בשרביט (מחוקק) ובמשענות. ה' הוא שהבטיח את המים: \"אסוף את העם ואתנה להם מים.\"", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"מֵאַרְנוֹן עַד יַבֹּק\"\nשאלה: מאיזה מלך נלקח השטח שמארנון עד יבוק, באיזו עיר הוא ישב, ומי הם שלא נכבשו בגלל ש\"עז גבולם\"?", "a": "השטח נלקח מסיחון מלך האמורי, שישב בחשבון. ישראל לא נכנס מעבר ליבוק כי \"עז גבול בני עמון\" - גבול בני עמון היה מוגן ומבוצר. ישראל ישב בכל ערי האמורי, בחשבון ובכל בנותיה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"דֶּרֶךְ הָאֲתָרִים\"\nשאלה: מי בא \"דרך האתרים\", ומה עשה מי ששמע על כך מיד?", "a": "ישראל בא דרך האתרים. הכנעני מלך ערד, יושב הנגב, שמע שישראל בא דרך האתרים - ומיד נלחם בישראל וישב ממנו שבי.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"אוֹי לְךָ מוֹאָב\"\nשאלה: מי הם \"המושלים\" שאומרים \"אוי לך מואב\", ומהו שם האל הזר המוזכר בדבריהם?", "a": "\"המושלים\" הם מושלי משלים/שירים עתיקים. בדבריהם מוזכר כמוש - אלוהי מואב: \"אוי לך מואב אבדת עם כמוש, נתן בניו פליטים ובנותיו בשבית למלך אמורי סיחון\" - כמוש לא הצליח להגן על מואב מפני סיחון.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁלַח מֹשֶׁה לְרַגֵּל\"\nשאלה: לאיזו עיר שלח משה מרגלים, ומה קרה כתוצאה מהריגול?", "a": "משה שלח מרגלים ליעזר. כתוצאה: לכדו את בנותיה (עריה הנלוות) והורישו את האמורי אשר שם - כלומר גרשו את האמורי מיעזר וכבשו אותה.", "source": "text_questions/bamidbar.md", "type": "text"}, {"q": "טקסט: \"וַיַּחֲנוּ בְּאֹבֹת\"\nשאלה: מנה את ארבע תחנות המסע ברצף מאובות ועד ארנון.", "a": "(1) אובות, (2) עיי העברים - במדבר אשר על פני מואב ממזרח השמש, (3) נחל זרד, (4) מעבר ארנון - אשר במדבר היוצא מגבול האמורי, כי ארנון גבול מואב בין מואב ובין האמורי.", "source": "text_questions/bamidbar.md", "type": "text"}]}, "yehoshua": {"name": "יהושע", "story": [{"q": "1. מי מתמנה למנהיג ישראל לאחר מות משה?", "a": "יהושע בן נון, משרת משה", "source": "01 preparations to enter land", "type": "story"}, {"q": "2. באיזה תואר מכונה משה בפרק זה?", "a": "עבד ה'", "source": "01 preparations to enter land", "type": "story"}, {"q": "3. באיזה תואר מכונה יהושע בתחילת הפרק?", "a": "משרת משה", "source": "01 preparations to enter land", "type": "story"}, {"q": "4. מהם גבולות הארץ שה' מגדיר ליהושע?", "a": "מהמדבר והלבנון עד נהר פרת (הנהר הגדול), כל ארץ החתים ועד הים הגדול (הים התיכון) במערב", "source": "01 preparations to enter land", "type": "story"}, {"q": "5. כמה פעמים ה' אומר ליהושע \"חזק ואמץ\" בפרק זה?", "a": "שלוש פעמים (פסוקים ו, ז, ט)", "source": "01 preparations to enter land", "type": "story"}, {"q": "6. מה ה' מבטיח ליהושע בפסוק ה'?", "a": "שאיש לא יתייצב לפניו כל ימי חייו, וכשם שהיה עם משה כן יהיה עמו - \"לא ארפך ולא אעזבך\"", "source": "01 preparations to enter land", "type": "story"}, {"q": "7. מה ה' מצווה את יהושע לעשות עם ספר התורה?", "a": "שלא ימוש מפיו ויהגה בו יומם ולילה, למען ישמור לעשות ככל הכתוב בו", "source": "01 preparations to enter land", "type": "story"}, {"q": "8. בעוד כמה ימים אמורים ישראל לעבור את הירדן?", "a": "בעוד שלושת ימים", "source": "01 preparations to enter land", "type": "story"}, {"q": "9. מה יהושע מצווה את שוטרי העם לומר לעם?", "a": "\"הכינו לכם צידה כי בעוד שלושת ימים אתם עוברים את הירדן הזה\"", "source": "01 preparations to enter land", "type": "story"}, {"q": "10. לאילו שבטים יהושע פונה באופן מיוחד?", "a": "שבטי ראובן, גד וחצי שבט מנשה", "source": "01 preparations to enter land", "type": "story"}, {"q": "11. מדוע יהושע פונה במיוחד לשבטי עבר הירדן?", "a": "כי הם קיבלו נחלה בעבר הירדן המזרחי וצריכים לקיים את התחייבותם למשה לעבור חמושים לפני אחיהם ולעזור בכיבוש", "source": "01 preparations to enter land", "type": "story"}, {"q": "12. מה יישאר בעבר הירדן המזרחי לפי דברי יהושע לשבטים?", "a": "נשותיהם, טפם ומקניהם", "source": "01 preparations to enter land", "type": "story"}, {"q": "13. כיצד אמורים הגברים משבטי עבר הירדן לעבור?", "a": "חמושים לפני אחיהם, כל גיבורי החיל", "source": "01 preparations to enter land", "type": "story"}, {"q": "14. מה שבטי עבר הירדן עונים ליהושע?", "a": "\"כל אשר ציוויתנו נעשה ואל כל אשר תשלחנו נלך\" - ושכשם ששמעו למשה כן ישמעו ליהושע", "source": "01 preparations to enter land", "type": "story"}, {"q": "15. מה העונש שקובעים שבטי עבר הירדן למי שימרה את פי יהושע?", "a": "מוות - \"כל איש אשר ימרה את פיך ולא ישמע את דבריך לכל אשר תצוונו יומת\"", "source": "01 preparations to enter land", "type": "story"}, {"q": "16. מהו \"הנהר הגדול\" המוזכר בפסוק ד'?", "a": "נהר פרת", "source": "01 preparations to enter land", "type": "story"}, {"q": "17. מהו \"הים הגדול מבוא השמש\"?", "a": "הים התיכון - הגבול המערבי של הארץ המובטחת", "source": "01 preparations to enter land", "type": "story"}, {"q": "18. מאיזה פסוק: \"לא ימוש ספר התורה הזה מפיך והגית בו יומם ולילה\"?", "a": "פרק א פסוק ח", "source": "01 preparations to enter land", "type": "story"}, {"q": "19. ⭐⭐ מהו התואר שבו מכונה הירדן בפרק זה ביחס לנחלת שבטי עבר הירדן?", "a": "\"עבר הירדן מזרח השמש\" - שם ישבו נשי, טף ומקנה של שבטי ראובן, גד וחצי מנשה", "source": "01 preparations to enter land", "type": "story"}, {"q": "20. ⭐⭐⭐ כמה פעמים נאמר הביטוי \"חזק ואמץ\" בסך הכול בפרק א', ומי אומר אותו?", "a": "ארבע פעמים: שלוש פעמים ה' אומר ליהושע (פסוקים ו, ז, ט) ופעם רביעית שבטי עבר הירדן אומרים ליהושע (פסוק יח)", "source": "01 preparations to enter land", "type": "story"}, {"q": "21. ⭐⭐⭐ מה ההבדל בין שלוש האמירות של \"חזק ואמץ\" שה' אומר ליהושע?", "a": "פסוק ו - בהקשר הנחלת הארץ, פסוק ז - בהקשר שמירת התורה (\"רק חזק ואמץ מאוד לשמור לעשות\"), פסוק ט - חיזוק כללי (\"אל תערוץ ואל תחת\")", "source": "01 preparations to enter land", "type": "story"}, {"q": "22. ⭐⭐ מי מקבל את פקודות יהושע ומעביר אותן לעם?", "a": "שוטרי העם", "source": "01 preparations to enter land", "type": "story"}, {"q": "1. ⭐ \"חִזְקוּ וֶאֱמָצוּ... כִּי אַתָּה תַּנְחִיל אֶת הָעָם הַזֶּה\"", "a": "**מי אמר:** ה'\n**למי:** יהושע\n**הקשר:** ציווי ה' ליהושע לאחר מות משה להנהיג את העם (יהושע א':ו')", "source": "01 preparations to enter land", "type": "story"}, {"q": "2. ⭐⭐ \"כֹּל אֲשֶׁר צִוִּיתָנוּ נַעֲשֶׂה... רַק חֲזַק וֶאֱמָץ\"", "a": "**מי אמר:** בני ישראל (שבט ראובן, גד וחצי מנשה)\n**למי:** יהושע\n**הקשר:** השבטים מבטיחים ליהושע נאמנות כפי שנהגו עם משה (יהושע א':ט\"ז-י\"ח)", "source": "01 preparations to enter land", "type": "story"}, {"q": "1. ⭐ ציווה על השמש והירח לעמוד, כבש את יריחו בהקפות, הנהיג אחרי משה, שמו שונה מהושע", "a": "**הדמות:** יהושע בן נון\n**ספר:** יהושע\n**הקשר:** יהושע ציווה \"שמש בגבעון דום וירח בעמק איילון\", כבש את יריחו בשבע הקפות, מונה על ידי ה' להנהיג אחרי משה, ושמו שונה מהושע ליהושע (פרקים א'-י\"א)", "source": "01 preparations to enter land", "type": "story"}, {"q": "1. ⭐⭐⭐ ה' אומר ליהושע \"חזק ואמץ\" פעמיים בפרק א'. נכון או לא נכון?", "a": "**לא נכון.** ה' אומר ליהושע \"חזק ואמץ\" **שלוש** פעמים בפרק א': בפסוק ו' (בהקשר הנחלת הארץ), בפסוק ז' (בהקשר שמירת התורה), ובפסוק ט' (כחיזוק כללי). ופעם רביעית אומרים שבטי עבר הירדן בפסוק י\"ח.", "source": "01 preparations to enter land", "type": "story"}, {"q": "2. ⭐⭐⭐ הגבול הצפוני של הארץ המובטחת לפי פרק א' הוא הר החרמון. נכון או לא נכון?", "a": "**לא נכון.** הגבול הצפוני לפי פרק א' הוא **הלבנון**: \"מהמדבר והלבנון הזה ועד הנהר הגדול נהר פרת\" (יהושע א':ד'). הר החרמון לא מוזכר כאן.", "source": "01 preparations to enter land", "type": "story"}, {"q": "3. ⭐⭐⭐ שבטי עבר הירדן אומרים ליהושע שמי שימרה את פיו יוגלה מישראל. נכון או לא נכון?", "a": "**לא נכון.** שבטי עבר הירדן קבעו עונש **מוות**, לא גלות: \"כל איש אשר ימרה את פיך ולא ישמע את דבריך לכל אשר תצוונו **יומת**\" (יהושע א':י\"ח).", "source": "01 preparations to enter land", "type": "story"}, {"q": "3. ⭐⭐⭐ \"כָּל אִישׁ אֲשֶׁר יַמְרֶה אֶת פִּיךָ... יוּמָת רַק חֲזַק וֶאֱמָץ\"", "a": "**מי אמר:** בני ראובן, גד וחצי שבט מנשה\n**למי:** יהושע\n**הקשר:** שבטי עבר הירדן מבטיחים נאמנות ליהושע, קובעים עונש מוות למורדים, ומחזקים אותו (יהושע א':י\"ח)", "source": "01 preparations to enter land", "type": "story"}, {"q": "4. ⭐⭐⭐ \"לֹא יִתְיַצֵּב אִישׁ לְפָנֶיךָ כֹּל יְמֵי חַיֶּיךָ\"", "a": "**מי אמר:** ה'\n**למי:** יהושע\n**הקשר:** ה' מבטיח ליהושע שאיש לא יוכל לעמוד מולו, כחלק מהחיזוק לקראת הנהגת העם (יהושע א':ה')", "source": "01 preparations to enter land", "type": "story"}, {"q": "5. ⭐⭐⭐ \"זָכוֹר אֶת הַדָּבָר אֲשֶׁר צִוָּה אֶתְכֶם מֹשֶׁה עֶבֶד ה'\"", "a": "**מי אמר:** יהושע\n**למי:** בני ראובן, בני גד וחצי שבט מנשה\n**הקשר:** יהושע מזכיר לשבטי עבר הירדן את התחייבותם למשה לעבור חמושים לפני אחיהם (יהושע א':י\"ג)", "source": "01 preparations to enter land", "type": "story"}, {"q": "1. ⭐⭐ \"מֹשֶׁה עַבְדִּי מֵת וְעַתָּה קוּם עֲבֹר אֶת _____ הַזֶּה\"", "a": "**מילה חסרה:** הַיַּרְדֵּן\n**מי אמר:** ה'\n**הקשר:** ה' פונה ליהושע לאחר מות משה ומצווה אותו לעבור את הירדן (יהושע א':ב')", "source": "01 preparations to enter land", "type": "story"}, {"q": "2. ⭐⭐ \"לֹא יָמוּשׁ סֵפֶר הַתּוֹרָה הַזֶּה מִפִּיךָ וְהָגִיתָ בּוֹ _____ וָלַיְלָה\"", "a": "**מילה חסרה:** יוֹמָם\n**מי אמר:** ה'\n**הקשר:** ה' מצווה את יהושע ללמוד תורה יומם ולילה כדי להצליח (יהושע א':ח')", "source": "01 preparations to enter land", "type": "story"}, {"q": "3. ⭐⭐⭐ \"הָכִינוּ לָכֶם _____ כִּי בְּעוֹד שְׁלֹשֶׁת יָמִים אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן הַזֶּה\"", "a": "**מילה חסרה:** צֵידָה\n**מי אמר:** יהושע (דרך שוטרי העם)\n**הקשר:** יהושע מצווה את העם להכין צידה לקראת חציית הירדן (יהושע א':י\"א)", "source": "01 preparations to enter land", "type": "story"}, {"q": "4. ⭐⭐⭐ \"כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה אֶהְיֶה עִמָּךְ לֹא אַרְפְּךָ וְלֹא _____\"", "a": "**מילה חסרה:** אֶעֶזְבֶךָּ\n**מי אמר:** ה'\n**הקשר:** ה' מבטיח ליהושע שילווה אותו כשם שליווה את משה (יהושע א':ה')", "source": "01 preparations to enter land", "type": "story"}, {"q": "5. ⭐⭐⭐ \"כְּכֹל אֲשֶׁר שָׁמַעְנוּ אֶל מֹשֶׁה כֵּן נִשְׁמַע אֵלֶיךָ רַק יִהְיֶה ה' אֱלֹהֶיךָ _____ כַּאֲשֶׁר הָיָה עִם מֹשֶׁה\"", "a": "**מילה חסרה:** עִמָּךְ\n**מי אמר:** בני ראובן, גד וחצי שבט מנשה\n**הקשר:** שבטי עבר הירדן מבטיחים נאמנות ליהושע ומתנים זאת בכך שה' יהיה עמו (יהושע א':י\"ז)", "source": "01 preparations to enter land", "type": "story"}, {"q": "1. מאיפה שלח יהושע את המרגלים?", "a": "מן השיטים", "source": "02 spies and rachav", "type": "story"}, {"q": "2. כמה מרגלים שלח יהושע?", "a": "שניים", "source": "02 spies and rachav", "type": "story"}, {"q": "3. כיצד נשלחו המרגלים?", "a": "בסתר - \"חרש\"", "source": "02 spies and rachav", "type": "story"}, {"q": "4. מהו שמה של האישה שאצלה התחבאו המרגלים?", "a": "רחב", "source": "02 spies and rachav", "type": "story"}, {"q": "5. כיצד מתוארת רחב בפסוק?", "a": "אישה זונה", "source": "02 spies and rachav", "type": "story"}, {"q": "6. מי גילה שמרגלים ישראלים הגיעו ליריחו?", "a": "מלך יריחו", "source": "02 spies and rachav", "type": "story"}, {"q": "7. היכן הסתירה רחב את המרגלים?", "a": "על הגג, בפשתי העץ הערוכות לה", "source": "02 spies and rachav", "type": "story"}, {"q": "8. לאן שלחה רחב את הרודפים?", "a": "לרדוף בדרך הירדן אל המעברות", "source": "02 spies and rachav", "type": "story"}, {"q": "9. אילו אירועים מזכירה רחב כהוכחה לגבורת ישראל?", "a": "קריעת ים סוף והניצחון על שני מלכי האמורי - סיחון ועוג", "source": "02 spies and rachav", "type": "story"}, {"q": "10. מה רחב מכריזה על ה'?", "a": "\"ה' אלהיכם הוא אלהים בשמים ממעל ועל הארץ מתחת\"", "source": "02 spies and rachav", "type": "story"}, {"q": "11. כיצד הורידה רחב את המרגלים מביתה?", "a": "בחבל בעד החלון, כי ביתה היה בקיר החומה", "source": "02 spies and rachav", "type": "story"}, {"q": "12. מה הסימן שרחב צריכה לקשור בחלון?", "a": "תקוות חוט השני", "source": "02 spies and rachav", "type": "story"}, {"q": "13. מה התנאים שהמרגלים הציבו לרחב?", "a": "לקשור חוט השני בחלון, לאסוף את כל בני משפחתה אל הבית, ולא לגלות על עניינם", "source": "02 spies and rachav", "type": "story"}, {"q": "14. לאן הלכו המרגלים אחרי שירדו מבית רחב?", "a": "להר, שם נחבאו שלושה ימים עד שוב הרודפים", "source": "02 spies and rachav", "type": "story"}, {"q": "15. כמה ימים נחבאו המרגלים בהר?", "a": "שלושה ימים", "source": "02 spies and rachav", "type": "story"}, {"q": "16. מה דיווחו המרגלים ליהושע כשחזרו?", "a": "\"כי נתן ה' בידנו את כל הארץ וגם נמוגו כל יושבי הארץ מפנינו\"", "source": "02 spies and rachav", "type": "story"}, {"q": "17. את מי ביקשה רחב להציל?", "a": "את אביה, את אמה, את אחיה, את אחיותיה ואת כל אשר להם", "source": "02 spies and rachav", "type": "story"}, {"q": "18. מאיזה פסוק: \"ונשמע וימס לבבנו ולא קמה עוד רוח באיש מפניכם\"?", "a": "פרק ב פסוק יא", "source": "02 spies and rachav", "type": "story"}, {"q": "19. ⭐⭐ היכן היה ביתה של רחב ממוקם?", "a": "בקיר החומה - \"כי ביתה בקיר החומה ובחומה היא יושבת\" (פסוק טו)", "source": "02 spies and rachav", "type": "story"}, {"q": "20. ⭐⭐⭐ מי הם שני מלכי האמורי שרחב מזכירה בשמם?", "a": "סיחון ועוג - \"ואשר עשיתם לשני מלכי האמורי אשר בעבר הירדן לסיחון ולעוג\" (פסוק י)", "source": "02 spies and rachav", "type": "story"}, {"q": "21. ⭐⭐⭐ לאן יעצה רחב למרגלים ללכת אחרי שהורידה אותם מהחלון?", "a": "להרים - \"ההרה לכו פן יפגעו בכם הרודפים ונחבתם שמה שלושת ימים\" (פסוק טז)", "source": "02 spies and rachav", "type": "story"}, {"q": "22. ⭐⭐ מה התנאי שהמרגלים הציבו לגבי גילוי סוד?", "a": "אם רחב תגיד את דברם - יהיו נקיים משבועתם: \"ואם תגידי את דברנו זה והיינו נקיים משבועתך\" (פסוק כ)", "source": "02 spies and rachav", "type": "story"}, {"q": "1. ⭐⭐ \"כִּי ה' אֱלֹהֵיכֶם הוּא אֱלֹהִים... מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת\"", "a": "**מי אמר:** רחב\n**למי:** שני המרגלים\n**הקשר:** רחב מצהירה על אמונתה בה' ומבקשת הצלה עבור משפחתה (יהושע ב':י\"א)", "source": "02 spies and rachav", "type": "story"}, {"q": "1. ⭐ הסתירה מרגלים בביתה, גרה על חומת העיר, תלתה חוט שני בחלונה, ניצלה כשהעיר נחרבה", "a": "**הדמות:** רחב\n**ספר:** יהושע\n**הקשר:** רחב הזונה הסתירה את שני המרגלים על גג ביתה ביריחו, גרה על החומה, תלתה חוט שני בחלון כסימן, וניצלה עם משפחתה כשיריחו נכבשה (פרקים ב', ו')", "source": "02 spies and rachav", "type": "story"}, {"q": "1. ⭐⭐ רחב הייתה מלכת יריחו שעזרה למרגלים. נכון או לא נכון?", "a": "**לא נכון.** רחב הייתה זונה, לא מלכה: \"ויבואו בית אשה זונה ושמה רחב\" (יהושע ב':א'). היא החביאה את המרגלים על הגג בפשתי העץ.", "source": "02 spies and rachav", "type": "story"}, {"q": "2. ⭐⭐⭐ רחב שלחה את הרודפים לחפש את המרגלים בהרים. נכון או לא נכון?", "a": "**לא נכון.** רחב שלחה את הרודפים **דרך הירדן אל המעברות**: \"רדפו מהר אחריהם כי תשיגום\" (יהושע ב':ה'). דווקא את המרגלים עצמם היא שלחה **להרים**: \"ההרה לכו פן יפגעו בכם הרודפים ונחבתם שמה שלושת ימים\" (ב':ט\"ז).", "source": "02 spies and rachav", "type": "story"}, {"q": "3. ⭐⭐⭐ רחב הזכירה את קריעת ים סוף ואת הניצחון על סיחון ועוג כהוכחה לגבורת ישראל. נכון או לא נכון?", "a": "**נכון.** \"כי שמענו את אשר הוביש ה' את מי ים סוף מפניכם בצאתכם ממצרים ואשר עשיתם לשני מלכי האמורי אשר בעבר הירדן לסיחון ולעוג אשר החרמתם אותם\" (יהושע ב':י').", "source": "02 spies and rachav", "type": "story"}, {"q": "4. ⭐⭐⭐ רחב הורידה את המרגלים מהחלון בסולם. נכון או לא נכון?", "a": "**לא נכון.** רחב הורידה את המרגלים **בחבל**: \"ותורדם **בחבל** בעד החלון כי ביתה בקיר החומה\" (יהושע ב':ט\"ו).", "source": "02 spies and rachav", "type": "story"}, {"q": "5. ⭐⭐⭐ המרגלים נחבאו בהר ארבעה ימים עד שוב הרודפים. נכון או לא נכון?", "a": "**לא נכון.** המרגלים נחבאו בהר **שלושה** ימים: \"ונחבתם שמה **שלושת ימים** עד שוב הרודפים\" (יהושע ב':ט\"ז).", "source": "02 spies and rachav", "type": "story"}, {"q": "2. ⭐⭐⭐ \"נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת אִם לֹא תַגִּידוּ אֶת דְּבָרֵנוּ זֶה\"", "a": "**מי אמר:** שני המרגלים\n**למי:** רחב\n**הקשר:** המרגלים נשבעים לרחב שישמרו על חייה ועל חיי משפחתה, בתנאי שלא תגלה את עניינם (יהושע ב':י\"ד)", "source": "02 spies and rachav", "type": "story"}, {"q": "3. ⭐⭐⭐ \"הוֹצִיאִי הָאֲנָשִׁים הַבָּאִים אֵלַיִךְ אֲשֶׁר בָּאוּ לְבֵיתֵךְ כִּי לַחְפֹּר אֶת כָּל הָאָרֶץ בָּאוּ\"", "a": "**מי אמר:** מלך יריחו (דרך שליחיו)\n**למי:** רחב\n**הקשר:** מלך יריחו דורש מרחב להוציא את המרגלים הישראלים שהתחבאו בביתה (יהושע ב':ג')", "source": "02 spies and rachav", "type": "story"}, {"q": "1. ⭐⭐ \"יָדַעְתִּי כִּי נָתַן ה' לָכֶם אֶת הָאָרֶץ וְכִי נָפְלָה _____ עָלֵינוּ\"", "a": "**מילה חסרה:** אֵימַתְכֶם\n**מי אמר:** רחב\n**הקשר:** רחב מודה למרגלים שהפחד מישראל נפל על כל תושבי הארץ (יהושע ב':ט')", "source": "02 spies and rachav", "type": "story"}, {"q": "2. ⭐⭐ \"וַתּוֹרִדֵם בַּחֶבֶל בְּעַד הַחַלּוֹן כִּי בֵיתָהּ בְּקִיר _____\"", "a": "**מילה חסרה:** הַחוֹמָה\n**מי אמר:** הכתוב (תיאור)\n**הקשר:** רחב מורידה את המרגלים מביתה שהיה בנוי בתוך חומת העיר (יהושע ב':ט\"ו)", "source": "02 spies and rachav", "type": "story"}, {"q": "3. ⭐⭐⭐ \"אֶת תִּקְוַת חוּט _____ הַזֶּה תִּקְשְׁרִי בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ\"", "a": "**מילה חסרה:** הַשָּׁנִי\n**מי אמר:** המרגלים\n**הקשר:** המרגלים מורים לרחב לקשור חוט שני בחלון כסימן להצלת משפחתה (יהושע ב':י\"ח)", "source": "02 spies and rachav", "type": "story"}, {"q": "4. ⭐⭐⭐ \"ה' אֱלֹהֵיכֶם הוּא אֱלֹהִים בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ _____\"", "a": "**מילה חסרה:** מִתָּחַת\n**מי אמר:** רחב\n**הקשר:** רחב מכריזה על אמונתה בה' כאלוהים של שמים וארץ (יהושע ב':י\"א)", "source": "02 spies and rachav", "type": "story"}, {"q": "5. ⭐⭐ \"כִּי נָתַן ה' בְּיָדֵנוּ אֶת כָּל הָאָרֶץ וְגַם _____ כָּל יֹשְׁבֵי הָאָרֶץ מִפָּנֵינוּ\"", "a": "**מילה חסרה:** נָמֹגוּ\n**מי אמר:** שני המרגלים\n**הקשר:** דיווח המרגלים ליהושע בשובם מיריחו (יהושע ב':כ\"ד)", "source": "02 spies and rachav", "type": "story"}, {"q": "1. מאיפה נסעו יהושע והעם לקראת חציית הירדן?", "a": "מהשיטים", "source": "03 crossing the jordan", "type": "story"}, {"q": "2. מה המרחק שהעם צריך לשמור מארון הברית?", "a": "כאלפיים אמה", "source": "03 crossing the jordan", "type": "story"}, {"q": "3. מה יהושע מצווה את העם לעשות לפני הנס?", "a": "להתקדש - \"התקדשו כי מחר יעשה ה' בקרבכם נפלאות\"", "source": "03 crossing the jordan", "type": "story"}, {"q": "4. מי נשא את ארון הברית בחציית הירדן?", "a": "הכוהנים הלויים", "source": "03 crossing the jordan", "type": "story"}, {"q": "5. מה קרה כשרגלי הכוהנים נגעו במי הירדן?", "a": "המים שירדו מלמעלה עמדו נד אחד, והמים שירדו לים המלח נכרתו, והעם עברו ביבשה", "source": "03 crossing the jordan", "type": "story"}, {"q": "6. באיזו עונה חצו את הירדן, ומה מיוחד בכך?", "a": "בימי קציר, כשהירדן היה מלא על כל גדותיו", "source": "03 crossing the jordan", "type": "story"}, {"q": "7. היכן נערמו המים נד אחד?", "a": "באדם העיר אשר מצד צרתן, הרחק מאוד ממקום החצייה", "source": "03 crossing the jordan", "type": "story"}, {"q": "8. כמה אנשים נבחרו מתוך העם ולמה?", "a": "שנים עשר איש, אחד מכל שבט, כדי לשאת שתים עשרה אבנים מתוך הירדן", "source": "03 crossing the jordan", "type": "story"}, {"q": "9. כמה אבנים הוקמו בגלגל ומה מטרתן?", "a": "שתים עשרה אבנים, לזיכרון לבני ישראל עד עולם על חציית הירדן", "source": "03 crossing the jordan", "type": "story"}, {"q": "10. מה עשה יהושע בתוך הירדן עצמו?", "a": "הקים שתים עשרה אבנים בתוך הירדן תחת מצב רגלי הכוהנים", "source": "03 crossing the jordan", "type": "story"}, {"q": "11. כמה חלוצי צבא עברו משבטי עבר הירדן?", "a": "כארבעים אלף חלוצי צבא", "source": "03 crossing the jordan", "type": "story"}, {"q": "12. מה קרה ביום חציית הירדן ביחס למעמדו של יהושע?", "a": "ה' גידל את יהושע בעיני כל ישראל וייראו אותו כאשר יראו את משה כל ימי חייו", "source": "03 crossing the jordan", "type": "story"}, {"q": "13. מה קרה כשהכוהנים עלו מן הירדן?", "a": "המים שבו למקומם והלכו כתמול שלשום על כל גדותיו", "source": "03 crossing the jordan", "type": "story"}, {"q": "14. באיזה תאריך עלו מהירדן והיכן חנו?", "a": "בעשור לחודש הראשון, וחנו בגלגל בקצה מזרח יריחו", "source": "03 crossing the jordan", "type": "story"}, {"q": "15. כמה עמים מונה יהושע שה' יוריש מפניהם?", "a": "שבעה: הכנעני, החתי, החוי, הפריזי, הגרגשי, האמורי, והיבוסי", "source": "03 crossing the jordan", "type": "story"}, {"q": "16. לאיזה נס דומה נס חציית הירדן?", "a": "לקריעת ים סוף", "source": "03 crossing the jordan", "type": "story"}, {"q": "17. מה המטרה של אבני הזיכרון לפי הכתוב?", "a": "למען ידעו כל עמי הארץ את יד ה' כי חזקה היא, ולמען ייראו את ה'", "source": "03 crossing the jordan", "type": "story"}, {"q": "18. מאיזה פסוק: \"ביום ההוא גידל ה' את יהושע בעיני כל ישראל\"?", "a": "פרק ד פסוק יד", "source": "03 crossing the jordan", "type": "story"}, {"q": "19. ⭐⭐ מה שם העיר שליד צרתן שבה נערמו המים נד אחד?", "a": "אדם - \"הרחק מאוד באדם העיר אשר מצד צרתן\" (פרק ג פסוק טז)", "source": "03 crossing the jordan", "type": "story"}, {"q": "20. ⭐⭐⭐ מה שמו השני של ים המלח המופיע בפרק ג'?", "a": "ים הערבה - \"והיורדים על ים הערבה ים המלח\" (פרק ג פסוק טז)", "source": "03 crossing the jordan", "type": "story"}, {"q": "21. ⭐⭐ היכן הניחו את שתים עשרה האבנים שלקחו מהירדן?", "a": "במלון (מקום הלינה) - שהוא הגלגל: \"והעברתם אותם עמכם והנחתם אותם במלון\" (פרק ד פסוק ג)", "source": "03 crossing the jordan", "type": "story"}, {"q": "22. ⭐⭐⭐ כיצד נשאו שנים עשר האנשים את האבנים מתוך הירדן?", "a": "איש אבן אחת על שכמו - \"והרימו לכם איש אבן אחת על שכמו למספר שבטי בני ישראל\" (פרק ד פסוק ה)", "source": "03 crossing the jordan", "type": "story"}, {"q": "1. ⭐⭐⭐ העם עלו מהירדן בי\"ד בניסן, ביום עשיית הפסח. נכון או לא נכון?", "a": "**לא נכון.** העם עלו מהירדן ב**עשור** לחודש הראשון (י' בניסן): \"והעם עלו מן הירדן בעשור לחודש הראשון\" (יהושע ד':י\"ט). הפסח נעשה רק ארבעה ימים אחר כך, בי\"ד לחודש.", "source": "03 crossing the jordan", "type": "story"}, {"q": "2. ⭐⭐⭐ יהושע הקים שתים עשרה אבנים רק בגלגל. נכון או לא נכון?", "a": "**לא נכון.** יהושע הקים שתים עשרה אבנים **בשני מקומות**: בגלגל (מהאבנים שנלקחו מתוך הירדן) **וגם** בתוך הירדן עצמו: \"ושתים עשרה אבנים הקים יהושע בתוך הירדן תחת מצב רגלי הכוהנים\" (יהושע ד':ט').", "source": "03 crossing the jordan", "type": "story"}, {"q": "3. ⭐⭐⭐ המרחק שהעם שמרו מארון הברית היה כאלף אמה. נכון או לא נכון?", "a": "**לא נכון.** המרחק היה **כאלפיים אמה**: \"אך רחוק יהיה ביניכם ובינו **כאלפים אמה** במידה\" (יהושע ג':ד').", "source": "03 crossing the jordan", "type": "story"}, {"q": "1. ⭐⭐⭐ \"הִתְקַדָּשׁוּ כִּי מָחָר יַעֲשֶׂה ה' בְּקִרְבְּכֶם נִפְלָאוֹת\"", "a": "**מי אמר:** יהושע\n**למי:** בני ישראל\n**הקשר:** יהושע מצווה את העם להתקדש לקראת חציית הירדן, יום לפני הנס (יהושע ג':ה')", "source": "03 crossing the jordan", "type": "story"}, {"q": "2. ⭐⭐⭐ \"הַיּוֹם הַזֶּה אָחֵל גַּדֶּלְךָ בְּעֵינֵי כָּל יִשְׂרָאֵל\"", "a": "**מי אמר:** ה'\n**למי:** יהושע\n**הקשר:** ה' מבטיח ליהושע שנס חציית הירדן יגדיל את מעמדו בעיני העם (יהושע ג':ז')", "source": "03 crossing the jordan", "type": "story"}, {"q": "1. ⭐⭐ \"אַךְ רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵינָיו כְּ_____ אַמָּה בַּמִּדָּה\"", "a": "**מילה חסרה:** אַלְפַּיִם\n**מי אמר:** השוטרים\n**הקשר:** הוראה לעם לשמור מרחק מארון הברית בזמן החצייה (יהושע ג':ד')", "source": "03 crossing the jordan", "type": "story"}, {"q": "2. ⭐⭐ \"וְהַיַּרְדֵּן מָלֵא עַל כָּל גְּדוֹתָיו כֹּל יְמֵי _____\"", "a": "**מילה חסרה:** קָצִיר\n**מי אמר:** הכתוב (תיאור)\n**הקשר:** הירדן היה בשיא מילויו בעונת הקציר כשהכוהנים נכנסו למים (יהושע ג':ט\"ו)", "source": "03 crossing the jordan", "type": "story"}, {"q": "3. ⭐⭐⭐ \"בְּזֹאת תֵּדְעוּן כִּי _____ חַי בְּקִרְבְּכֶם\"", "a": "**מילה חסרה:** אֵל\n**מי אמר:** יהושע\n**הקשר:** יהושע מודיע לעם שנס עצירת המים יוכיח שאל חי בקרבם (יהושע ג':י')", "source": "03 crossing the jordan", "type": "story"}, {"q": "4. ⭐⭐⭐ \"לְמַעַן דַּעַת כָּל עַמֵּי הָאָרֶץ אֶת _____ ה' כִּי חֲזָקָה הִיא\"", "a": "**מילה חסרה:** יַד\n**מי אמר:** יהושע\n**הקשר:** מטרת אבני הזיכרון - שכל העמים ידעו שיד ה' חזקה (יהושע ד':כ\"ד)", "source": "03 crossing the jordan", "type": "story"}, {"q": "5. ⭐⭐ \"וְהָעָם עָלוּ מִן הַיַּרְדֵּן בֶּעָשׂוֹר לַחֹדֶשׁ _____ וַיַּחֲנוּ בַּגִּלְגָּל\"", "a": "**מילה חסרה:** הָרִאשׁוֹן\n**מי אמר:** הכתוב (תיאור)\n**הקשר:** תאריך העלייה מהירדן - י' בניסן, והחנייה בגלגל (יהושע ד':י\"ט)", "source": "03 crossing the jordan", "type": "story"}, {"q": "1. מה ה' מצווה את יהושע לעשות לבני ישראל בחרבות צורים?", "a": "למול את בני ישראל שנית", "source": "04 conquest of jericho", "type": "story"}, {"q": "2. מדוע היה צורך למול את בני ישראל?", "a": "כי כל הנולדים במדבר במשך ארבעים שנה לא נימולו בדרך", "source": "04 conquest of jericho", "type": "story"}, {"q": "3. היכן נערכה המילה?", "a": "בגבעת הערלות", "source": "04 conquest of jericho", "type": "story"}, {"q": "4. מה משמעות השם \"גלגל\" לפי הפרק?", "a": "\"היום גלותי את חרפת מצרים מעליכם\" - ה' גילגל/הסיר את חרפת מצרים", "source": "04 conquest of jericho", "type": "story"}, {"q": "5. מתי עשו בני ישראל את הפסח בארץ?", "a": "בארבעה עשר יום לחודש הראשון, בערב, בערבות יריחו", "source": "04 conquest of jericho", "type": "story"}, {"q": "6. מה אכלו ממחרת הפסח?", "a": "מעבור הארץ - מצות וקלוי", "source": "04 conquest of jericho", "type": "story"}, {"q": "7. מה קרה למן?", "a": "המן שבת ממחרת באכלם מעבור הארץ, ולא היה עוד מן לבני ישראל", "source": "04 conquest of jericho", "type": "story"}, {"q": "8. מי נראה ליהושע ביריחו עם חרב שלופה?", "a": "שר צבא ה'", "source": "04 conquest of jericho", "type": "story"}, {"q": "9. מה שר צבא ה' מצווה את יהושע?", "a": "\"של נעלך מעל רגלך כי המקום אשר אתה עומד עליו קודש הוא\"", "source": "04 conquest of jericho", "type": "story"}, {"q": "10. כמה ימים הקיפו את יריחו פעם אחת ביום?", "a": "שישה ימים", "source": "04 conquest of jericho", "type": "story"}, {"q": "11. כמה כוהנים נשאו שופרות וכמה שופרות היו?", "a": "שבעה כוהנים נשאו שבעה שופרות יובלים", "source": "04 conquest of jericho", "type": "story"}, {"q": "12. מה קרה ביום השביעי?", "a": "הקיפו את העיר שבע פעמים, הכוהנים תקעו בשופרות, העם הריעו תרועה גדולה, והחומה נפלה תחתיה", "source": "04 conquest of jericho", "type": "story"}, {"q": "13. מה הסדר של ההליכה סביב יריחו?", "a": "החלוץ, שבעת הכוהנים עם השופרות, הארון, והמאסף", "source": "04 conquest of jericho", "type": "story"}, {"q": "14. מי ניצלה מחורבן יריחו ומדוע?", "a": "רחב הזונה ומשפחתה, כי החביאה את המרגלים שיהושע שלח", "source": "04 conquest of jericho", "type": "story"}, {"q": "15. מה היה דין הכסף, הזהב וכלי הנחושת והברזל מיריחו?", "a": "קודש לה' - ניתנו לאוצר בית ה'", "source": "04 conquest of jericho", "type": "story"}, {"q": "16. מה הקללה שיהושע השביע על מי שיבנה מחדש את יריחו?", "a": "\"בבכורו ייסדנה ובצעירו יציב דלתיה\" - ימות בכורו כשייסד אותה וצעירו כשיציב דלתותיה", "source": "04 conquest of jericho", "type": "story"}, {"q": "17. מדוע יריחו מתוארת כ\"סוגרת ומסוגרת\"?", "a": "מפני בני ישראל - אין יוצא ואין בא", "source": "04 conquest of jericho", "type": "story"}, {"q": "18. כמה שנה הלכו בני ישראל במדבר לפי פרק ה'?", "a": "ארבעים שנה", "source": "04 conquest of jericho", "type": "story"}, {"q": "19. ⭐⭐ מה שאל יהושע את האיש שעמד לנגדו עם חרב שלופה?", "a": "\"הלנו אתה אם לצרינו\" - האם אתה בצד שלנו או בצד אויבינו (פרק ה פסוק יג)", "source": "04 conquest of jericho", "type": "story"}, {"q": "20. ⭐⭐⭐ מה אכלו בני ישראל ממחרת הפסח?", "a": "מעבור הארץ - מצות וקלוי (פרק ה פסוק יא)", "source": "04 conquest of jericho", "type": "story"}, {"q": "21. ⭐⭐ מה יהושע ציווה את העם לגבי השמעת קול בזמן ההקפות?", "a": "\"לא תריעו ולא תשמיעו את קולכם ולא יצא מפיכם דבר עד יום אמרי אליכם הריעו\" (פרק ו פסוק י)", "source": "04 conquest of jericho", "type": "story"}, {"q": "22. ⭐⭐⭐ מה קרה לרחב אחרי חורבן יריחו?", "a": "יהושע החיה אותה ואת בית אביה ואת כל אשר לה, \"ותשב בקרב ישראל עד היום הזה\" (פרק ו פסוק כה)", "source": "04 conquest of jericho", "type": "story"}, {"q": "1. ⭐ חומות יריחו נפלו אחרי שבני ישראל הקיפו את העיר שבעה ימים. נכון או לא נכון?", "a": "**נכון.** ששה ימים הקיפו פעם אחת ביום, וביום השביעי הקיפו שבע פעמים, תקעו בשופרות והעם הריע, ונפלה החומה (יהושע ו':י\"ד-כ').", "source": "04 conquest of jericho", "type": "story"}, {"q": "2. ⭐⭐⭐ המן שבת ביום חציית הירדן. נכון או לא נכון?", "a": "**לא נכון.** המן שבת **ממחרת הפסח**, כשאכלו מעבור הארץ: \"וישבות המן ממחרת באכלם מעבור הארץ\" (יהושע ה':י\"ב). הם חצו את הירדן בי' בניסן ועשו את הפסח בי\"ד, כך שהמן שבת בט\"ו בניסן.", "source": "04 conquest of jericho", "type": "story"}, {"q": "3. ⭐⭐⭐ שר צבא ה' אמר ליהושע שהוא בצד
