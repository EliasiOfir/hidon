) נאחז בסבך והקריבו תחת יצחק. נכון או לא נכון?", "a": "**לא נכון.** אברהם מצא **איל** (לא כבש/שה): \"והנה **איל** אחר נאחז בסבך בקרניו\" (בראשית כ\"ב:י\"ג). יש לשים לב: למרות שאברהם אמר \"אלוהים יראה לו **השה** לעולה\" (כ\"ב:ח'), מה שנמצא בפועל היה איל.", "source": "11 akedat yitzchak", "type": "story"}, {"q": "2. ⭐⭐⭐ בסוף סיפור העקדה, אברהם חזר לבאר שבע עם יצחק ושני הנערים. נכון או לא נכון?", "a": "**חלקית.** הכתוב אומר \"וישב אברהם אל **נעריו** ויקומו וילכו יחדו אל באר שבע\" (כ\"ב:י\"ט). **יצחק לא מוזכר** בחזרה - רק אברהם ונעריו. זהו פרט שרבים מפספסים.", "source": "11 akedat yitzchak", "type": "story"}, {"q": "3. ⭐⭐⭐ בסוף פרק כ\"ב מוזכר ייחוס משפחת נחור, כולל שמה של רבקה. נכון או לא נכון?", "a": "**נכון.** \"ובתואל ילד את **רבקה** שמונה אלה ילדה מלכה לנחור אחי אברהם\" (כ\"ב:כ\"ג). זהו האזכור הראשון של רבקה במקרא, כהכנה לפרק כ\"ד.", "source": "11 akedat yitzchak", "type": "story"}, {"q": "1. בת כמה מתה שרה?", "a": "בת 127 שנים (מאה שנה ועשרים שנה ושבע שנים)", "source": "12 death of sarah", "type": "story"}, {"q": "2. היכן מתה שרה?", "a": "בקריית ארבע היא חברון, בארץ כנען", "source": "12 death of sarah", "type": "story"}, {"q": "3. מה עשה אברהם לאחר מות שרה?", "a": "בא לספוד לשרה ולבכותה", "source": "12 death of sarah", "type": "story"}, {"q": "4. כיצד הציג אברהם את עצמו בפני בני חת?", "a": "\"גר ותושב אנכי עמכם\"", "source": "12 death of sarah", "type": "story"}, {"q": "5. מה ביקש אברהם מבני חת?", "a": "\"תנו לי אחוזת קבר עמכם\"", "source": "12 death of sarah", "type": "story"}, {"q": "6. כיצד כינו בני חת את אברהם?", "a": "\"נשיא אלוהים אתה בתוכנו\"", "source": "12 death of sarah", "type": "story"}, {"q": "7. איזו מערה ביקש אברהם באופן ספציפי?", "a": "את מערת המכפלה אשר לעפרון בן צוחר, בקצה שדהו", "source": "12 death of sarah", "type": "story"}, {"q": "8. מי היה בעל המערה?", "a": "עפרון בן צוחר החתי", "source": "12 death of sarah", "type": "story"}, {"q": "9. מה הציע עפרון בתחילה?", "a": "לתת את השדה והמערה בחינם: \"השדה נתתי לך והמערה אשר בו לך נתתיה\"", "source": "12 death of sarah", "type": "story"}, {"q": "10. מדוע התעקש אברהם לשלם?", "a": "רצה לשלם \"בכסף מלא\" - לא רצה לקבל מתנה אלא לרכוש את הקבר", "source": "12 death of sarah", "type": "story"}, {"q": "11. כמה שילם אברהם עבור המערה והשדה?", "a": "400 שקל כסף", "source": "12 death of sarah", "type": "story"}, {"q": "12. מהו הביטוי \"עובר לסוחר\"?", "a": "מטבע מקובל בסחר - הכסף ששקל אברהם לעפרון", "source": "12 death of sarah", "type": "story"}, {"q": "13. היכן נמצאת מערת המכפלה?", "a": "על פני ממרא היא חברון", "source": "12 death of sarah", "type": "story"}, {"q": "14. מה קם לאברהם לאחר הרכישה?", "a": "\"השדה והמערה אשר בו לאברהם לאחוזת קבר\" מאת בני חת", "source": "12 death of sarah", "type": "story"}, {"q": "15. מהי המשמעות של רכישת מערת המכפלה?", "a": "זוהי רכישת הקרקע הראשונה של אברהם בארץ ישראל - אחוזת קבר", "source": "12 death of sarah", "type": "story"}, {"q": "1. ⭐⭐ \"גֵּר וְתוֹשָׁב אָנֹכִי עִמָּכֶם\"", "a": "**מי אמר:** אברהם\n**למי:** בני חת\n**הקשר:** אברהם מבקש מקום קבורה לשרה (בראשית כ\"ג:ד')", "source": "12 death of sarah", "type": "story"}, {"q": "2. ⭐⭐⭐ \"נְשִׂיא אֱלֹהִים אַתָּה בְּתוֹכֵנוּ\"", "a": "**מי אמר:** בני חת\n**למי:** אברהם\n**הקשר:** בני חת מכבדים את אברהם ומציעים לו לקבור את שרה במבחר קבריהם (בראשית כ\"ג:ו')", "source": "12 death of sarah", "type": "story"}, {"q": "3. ⭐⭐⭐ \"אֶרֶץ אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף בֵּינִי וּבֵינְךָ מַה הִוא\"", "a": "**מי אמר:** עפרון החתי\n**למי:** אברהם\n**הקשר:** עפרון מציין את מחיר השדה והמערה, כאילו 400 שקל זה דבר קטן ביניהם (בראשית כ\"ג:ט\"ו)", "source": "12 death of sarah", "type": "story"}, {"q": "1. ⭐⭐⭐ הציע את שדהו בחינם אך בסוף קיבל 400 שקל כסף, נקרא בשם אביו \"בן צוחר\", היה חתי", "a": "**הדמות:** עפרון בן צוחר החתי\n**ספר:** בראשית\n**הקשר:** עפרון הציע לאברהם את מערת המכפלה ושדהו בחינם, אך אברהם התעקש לשלם ושקל לו 400 שקל כסף עובר לסוחר (פרק כ\"ג)", "source": "12 death of sarah", "type": "story"}, {"q": "1. ⭐⭐⭐ אברהם קנה רק את מערת המכפלה מעפרון. נכון או לא נכון?", "a": "**לא נכון.** אברהם קנה את **השדה והמערה וכל העץ** אשר בשדה: \"ויקם שדה עפרון... **השדה** **והמערה** אשר בו **וכל העץ** אשר בשדה אשר בכל גבולו סביב\" (בראשית כ\"ג:י\"ז).", "source": "12 death of sarah", "type": "story"}, {"q": "2. ⭐⭐⭐ שרה מתה בבאר שבע. נכון או לא נכון?", "a": "**לא נכון.** שרה מתה ב**קריית ארבע היא חברון** בארץ כנען (בראשית כ\"ג:ב'), לא בבאר שבע.", "source": "12 death of sarah", "type": "story"}, {"q": "1. מה השביע אברהם את עבדו הזקן?", "a": "שלא ייקח אישה ליצחק מבנות הכנעני, אלא ילך אל ארצו ומולדתו", "source": "13 shiduch rivka", "type": "story"}, {"q": "2. מה שאל העבד את אברהם לפני שיצא לדרך?", "a": "מה אם האישה לא תרצה לבוא אחריו לארץ כנען", "source": "13 shiduch rivka", "type": "story"}, {"q": "3. מה ענה אברהם לעבד על חששו?", "a": "\"ה' אלוהי השמים הוא ישלח מלאכו לפניך\", ואם לא תרצה - \"ונקית משבועתי זאת, רק את בני לא תשב שמה\"", "source": "13 shiduch rivka", "type": "story"}, {"q": "4. כמה גמלים לקח העבד למסע?", "a": "עשרה גמלים", "source": "13 shiduch rivka", "type": "story"}, {"q": "5. לאן נסע העבד?", "a": "לארם נהריים, אל עיר נחור", "source": "13 shiduch rivka", "type": "story"}, {"q": "6. מה היה המבחן שהעבד קבע לזהות את הנערה המתאימה?", "a": "הנערה שיאמר לה \"הטי נא כדך ואשתה\" ותאמר \"שתה וגם גמליך אשקה\" - היא המיועדת ליצחק", "source": "13 shiduch rivka", "type": "story"}, {"q": "7. בת מי היתה רבקה?", "a": "בת בתואל בן מלכה אשר ילדה לנחור", "source": "13 shiduch rivka", "type": "story"}, {"q": "8. כיצד מתוארת רבקה?", "a": "\"טובת מראה מאוד, בתולה ואיש לא ידעה\"", "source": "13 shiduch rivka", "type": "story"}, {"q": "9. מה נתן העבד לרבקה לאחר שעברה את המבחן?", "a": "נזם זהב (בקע משקלו) ושני צמידים (עשרה זהב משקלם)", "source": "13 shiduch rivka", "type": "story"}, {"q": "10. מי רץ לקראת העבד כשראה את התכשיטים?", "a": "לבן אחי רבקה", "source": "13 shiduch rivka", "type": "story"}, {"q": "11. מה ענו בתואל ולבן לאחר ששמעו את סיפור העבד?", "a": "\"מה' יצא הדבר, לא נוכל דבר אליך רע או טוב\"", "source": "13 shiduch rivka", "type": "story"}, {"q": "12. מה ענתה רבקה כששאלו אותה \"התלכי עם האיש הזה\"?", "a": "\"אלך\"", "source": "13 shiduch rivka", "type": "story"}, {"q": "13. מה היתה הברכה שבירכו את רבקה?", "a": "\"אחותנו את היי לאלפי רבבה ויירש זרעך את שער שונאיו\"", "source": "13 shiduch rivka", "type": "story"}, {"q": "14. מה עשה יצחק כשרבקה הגיעה?", "a": "יצא \"לשוח בשדה\" לפנות ערב, ראה גמלים באים", "source": "13 shiduch rivka", "type": "story"}, {"q": "15. מה עשתה רבקה כשראתה את יצחק?", "a": "נפלה מעל הגמל והתכסתה בצעיף", "source": "13 shiduch rivka", "type": "story"}, {"q": "16. לאן הביא יצחק את רבקה?", "a": "אל אוהל שרה אמו", "source": "13 shiduch rivka", "type": "story"}, {"q": "17. מה נאמר על יחסי יצחק ורבקה?", "a": "\"ויאהבה, וינחם יצחק אחרי אמו\"", "source": "13 shiduch rivka", "type": "story"}, {"q": "18. היכן ישב יצחק באותו זמן?", "a": "בנגב, ליד באר לחי ראי", "source": "13 shiduch rivka", "type": "story"}, {"q": "1. ⭐⭐ \"הַגְּמִיאִינִי נָא מְעַט מַיִם מִכַּדֵּךְ\"", "a": "**מי אמר:** עבד אברהם (אליעזר)\n**למי:** רבקה\n**הקשר:** מבחן עבד אברהם ליד הבאר לזהות את המיועדת ליצחק (בראשית כ\"ד:י\"ז)", "source": "13 shiduch rivka", "type": "story"}, {"q": "2. ⭐⭐⭐ \"הֲתֵלְכִי עִם הָאִישׁ הַזֶּה\"", "a": "**מי אמר:** לבן ואם רבקה\n**למי:** רבקה\n**הקשר:** שואלים את רבקה אם היא מוכנה ללכת עם עבד אברהם להינשא ליצחק (בראשית כ\"ד:נ\"ח)", "source": "13 shiduch rivka", "type": "story"}, {"q": "1. ⭐ נבחרה ליד הבאר, ירדה מגמל כשראתה את בעלה לעתיד, עזרה לבנה הצעיר לקבל ברכה", "a": "**הדמות:** רבקה\n**ספר:** בראשית\n**הקשר:** רבקה נבחרה על ידי אליעזר ליד הבאר, ירדה מהגמל כשראתה את יצחק בשדה, ועזרה ליעקב לקבל את ברכת יצחק (פרקים כ\"ד, כ\"ז)", "source": "13 shiduch rivka", "type": "story"}, {"q": "2. ⭐⭐ השביע אותו אדוניו, שם יד תחת ירכו, נסע לארם נהריים, בחן מועמדת ליד באר במבחן חסד", "a": "**הדמות:** אליעזר (עבד אברהם)\n**ספר:** בראשית\n**הקשר:** אברהם השביע את אליעזר, שם ידו תחת ירך אברהם, נסע לארם נהריים למצוא אשה ליצחק, ובחן את רבקה ליד הבאר במבחן השקיית גמלים (פרק כ\"ד)", "source": "13 shiduch rivka", "type": "story"}, {"q": "3. ⭐⭐⭐ \"מֵה' יָצָא הַדָּבָר לֹא נוּכַל דַּבֵּר אֵלֶיךָ רַע אוֹ טוֹב\"", "a": "**מי אמר:** לבן ובתואל\n**למי:** עבד אברהם\n**הקשר:** לבן ובתואל מסכימים לשידוך לאחר ששמעו את כל סיפור העבד על ההשגחה האלוהית (בראשית כ\"ד:נ')", "source": "13 shiduch rivka", "type": "story"}, {"q": "1. ⭐⭐⭐ העבד נתן לרבקה את הנזם והצמידים לפני ששאל אותה בת מי היא. נכון או לא נכון?", "a": "**כאן יש סתירה מעניינת בין שני תיאורים.** בתיאור המעשה עצמו (כ\"ד:כ\"ב-כ\"ג) העבד נתן את התכשיטים **לפני** ששאל בת מי היא. אבל כשהעבד מספר מחדש למשפחה (כ\"ד:מ\"ז) הוא אומר ששאל **קודם** ורק אחר כך נתן. פרט חשוב שיכול לבלבל.", "source": "13 shiduch rivka", "type": "story"}, {"q": "2. ⭐⭐⭐ יצחק יצא לשוח בשדה בבוקר כשרבקה הגיעה. נכון או לא נכון?", "a": "**לא נכון.** יצחק יצא לשוח בשדה \"**לפנות ערב**\" (בראשית כ\"ד:ס\"ג), לא בבוקר.", "source": "13 shiduch rivka", "type": "story"}, {"q": "3. ⭐⭐⭐ רבקה קיבלה מהעבד נזם זהב ושלושה צמידים. נכון או לא נכון?", "a": "**לא נכון.** רבקה קיבלה נזם זהב בקע משקלו ו**שני** צמידים על ידיה עשרה זהב משקלם (בראשית כ\"ד:כ\"ב) - שני צמידים, לא שלושה.", "source": "13 shiduch rivka", "type": "story"}, {"q": "1. מדוע לא יכול היה יצחק לראות בתחילת הסיפור?", "a": "כי זקן ועיניו כהו מלראות", "source": "14 stolen blessings", "type": "story"}, {"q": "2. מה ביקש יצחק מעשו לפני שיברכו?", "a": "לצאת לשדה, לצוד ציד ולהכין לו מטעמים", "source": "14 stolen blessings", "type": "story"}, {"q": "3. מי שמעה את דברי יצחק לעשו?", "a": "רבקה", "source": "14 stolen blessings", "type": "story"}, {"q": "4. מה הורתה רבקה ליעקב להביא מהצאן?", "a": "שני גדיי עיזים טובים", "source": "14 stolen blessings", "type": "story"}, {"q": "5. מדוע חשש יעקב מהתוכנית?", "a": "כי עשו איש שעיר והוא איש חלק, ואם אביו ימשש אותו - יתגלה כמתעתע ויביא על עצמו קללה", "source": "14 stolen blessings", "type": "story"}, {"q": "6. מה ענתה רבקה לחששו של יעקב?", "a": "\"עלי קללתך בני, אך שמע בקולי ולך קח לי\"", "source": "14 stolen blessings", "type": "story"}, {"q": "7. כיצד התחפש יעקב לעשו?", "a": "רבקה הלבישה אותו בבגדי עשו החמודות וכיסתה את ידיו ואת חלקת צווארו בעורות גדיי העיזים", "source": "14 stolen blessings", "type": "story"}, {"q": "8. מה אמר יעקב כשנכנס אל אביו ונשאל מי הוא?", "a": "\"אנכי עשו בכורך\"", "source": "14 stolen blessings", "type": "story"}, {"q": "9. מדוע חשד יצחק ביעקב?", "a": "כי מצא את הציד מהר מדי, ושאל \"מה זה מהרת למצוא בני\"", "source": "14 stolen blessings", "type": "story"}, {"q": "10. מהו הפסוק המפורסם שאמר יצחק כשמישש את יעקב?", "a": "\"הקול קול יעקב והידיים ידי עשו\"", "source": "14 stolen blessings", "type": "story"}, {"q": "11. מה כללה ברכת יעקב (הברכה העיקרית)?", "a": "טל השמים, משמני הארץ, רוב דגן ותירוש, עמים יעבדוהו, גביר לאחיו, אוררו ארור ומברכו ברוך", "source": "14 stolen blessings", "type": "story"}, {"q": "12. מה היתה תגובת יצחק כשגילה שיעקב קיבל את הברכה?", "a": "\"ויחרד יצחק חרדה גדולה עד מאוד\" ואמר \"גם ברוך יהיה\" - אישר את הברכה", "source": "14 stolen blessings", "type": "story"}, {"q": "13. מה היתה תגובת עשו כששמע שברכתו נלקחה?", "a": "\"ויצעק צעקה גדולה ומרה עד מאוד\" וביקש \"ברכני גם אני אבי\"", "source": "14 stolen blessings", "type": "story"}, {"q": "14. כמה פעמים טען עשו שיעקב רימה אותו?", "a": "פעמיים - \"ויעקבני זה פעמיים: את בכורתי לקח, והנה עתה לקח ברכתי\"", "source": "14 stolen blessings", "type": "story"}, {"q": "15. מה כללה ברכת עשו (הברכה הפחותה)?", "a": "משמני הארץ ומטל השמים, על חרבו יחיה, את אחיו יעבוד, אך כאשר ירד - יפרוק עולו", "source": "14 stolen blessings", "type": "story"}, {"q": "16. מה תכנן עשו לעשות ליעקב?", "a": "להרוג אותו לאחר ימי אבל אביו", "source": "14 stolen blessings", "type": "story"}, {"q": "17. לאן שלחה רבקה את יעקב לברוח?", "a": "אל לבן אחיה, לחרן", "source": "14 stolen blessings", "type": "story"}, {"q": "18. מהו התירוץ שנתנה רבקה ליצחק לשליחת יעקב?", "a": "\"קצתי בחיי מפני בנות חת\" - אינה רוצה שיעקב יישא אישה מבנות הארץ", "source": "14 stolen blessings", "type": "story"}, {"q": "19. מדוע אמרה רבקה \"למה אשכל גם שניכם יום אחד\"?", "a": "חששה שאם עשו יהרוג את יעקב, גם עשו ייענש במוות - ותאבד את שני בניה", "source": "14 stolen blessings", "type": "story"}, {"q": "1. ⭐ \"הַקֹּל קוֹל יַעֲקֹב וְהַיָּדַיִם יְדֵי עֵשָׂו\"", "a": "**מי אמר:** יצחק\n**למי:** יעקב (שהתחזה לעשו)\n**הקשר:** יצחק מזהה את קולו של יעקב אך ידיו שעירות כעשו (בראשית כ\"ז:כ\"ב)", "source": "14 stolen blessings", "type": "story"}, {"q": "2. ⭐⭐ \"הֲכִי קָרָא שְׁמוֹ יַעֲקֹב וַיַּעְקְבֵנִי זֶה פַעֲמַיִם\"", "a": "**מי אמר:** עשו\n**למי:** יצחק\n**הקשר:** עשו מתלונן שיעקב גנב את ברכתו ואת בכורתו (בראשית כ\"ז:ל\"ו)", "source": "14 stolen blessings", "type": "story"}, {"q": "1. ⭐ היה ציד איש שדה, אביו אהבו, אחיו לקח את ברכתו, רצה להרוג את אחיו", "a": "**הדמות:** עשו\n**ספר:** בראשית\n**הקשר:** עשו היה ציד איש שדה ויצחק אהב אותו, יעקב לקח את ברכתו בערמה, ועשו רצה להרוג את יעקב בגלל הברכה (פרק כ\"ז)", "source": "14 stolen blessings", "type": "story"}, {"q": "2. ⭐ יושב אוהלים, לבש עורות גדיים על ידיו, חלם על סולם המגיע השמימה", "a": "**הדמות:** יעקב\n**ספר:** בראשית\n**הקשר:** יעקב היה איש תם יושב אוהלים, לבש עורות גדיים כדי להתחזות לעשו ולקבל את ברכת אביו, וחלם על סולם בבית אל (פרקים כ\"ז-כ\"ח)", "source": "14 stolen blessings", "type": "story"}, {"q": "1. ⭐ רבקה שמעה את יצחק מבקש מעשו להביא לו מטעמים, ולכן שלחה את יעקב לגנוב את הברכה. נכון או לא נכון?", "a": "**נכון.** \"ורבקה שומעת בדבר יצחק אל עשו בנו\" (בראשית כ\"ז:ה'), ולאחר מכן היא מנחה את יעקב להתחפש ולקחת את הברכה.", "source": "14 stolen blessings", "type": "story"}, {"q": "2. ⭐⭐⭐ ברכת עשו היתה רק קללה ולא כללה דבר חיובי. נכון או לא נכון?", "a": "**לא נכון.** ברכת עשו כללה גם דברים חיוביים: \"הנה **משמני הארץ** יהיה מושבך **ומטל השמים** מעל\" (כ\"ז:ל\"ט), ובנוסף: \"והיה כאשר תריד **ופרקת עולו מעל צווארך**\" (כ\"ז:מ') - הבטחה שיפרוק את שלטון אחיו.", "source": "14 stolen blessings", "type": "story"}, {"q": "3. ⭐⭐⭐ יעקב כיסה רק את ידיו בעורות גדיי העיזים. נכון או לא נכון?", "a": "**לא נכון.** רבקה כיסתה את ידיו **ואת חלקת צווארו**: \"ואת עורות גדיי העיזים הלבישה **על ידיו ועל חלקת צווארו**\" (בראשית כ\"ז:ט\"ז).", "source": "14 stolen blessings", "type": "story"}, {"q": "3. ⭐⭐⭐ \"עָלַי קִלְלָתְךָ בְּנִי אַךְ שְׁמַע בְּקֹלִי\"", "a": "**מי אמר:** רבקה\n**למי:** יעקב\n**הקשר:** רבקה לוקחת על עצמה את האחריות לקללה אפשרית, כדי לשכנע את יעקב להתחפש לעשו (בראשית כ\"ז:י\"ג)", "source": "14 stolen blessings", "type": "story"}, {"q": "3. ⭐⭐⭐ שמעה שיחה שלא יועדה לה, הלבישה בן אחד בבגדי בנה השני, אמרה \"למה אשכל גם שניכם יום אחד\", טענה שקצה בחייה מפני בנות חת", "a": "**הדמות:** רבקה\n**ספר:** בראשית\n**הקשר:** רבקה שמעה את יצחק מדבר לעשו, הלבישה את יעקב בבגדי עשו, חששה לאבד שני בנים, והצדיקה שליחת יעקב בטענה על בנות חת (פרק כ\"ז)", "source": "14 stolen blessings", "type": "story"}, {"q": "1. מה ציווה יצחק את יעקב לפני שיצא?", "a": "שלא ייקח אישה מבנות כנען, אלא ילך לפדן ארם וייקח אישה מבנות לבן אחי אמו", "source": "15 jacobs dream", "type": "story"}, {"q": "2. באיזו ברכה בירך יצחק את יעקב?", "a": "בברכת אברהם - \"ואל שדי יברך אותך ויפרך וירבך... ויתן לך את ברכת אברהם\"", "source": "15 jacobs dream", "type": "story"}, {"q": "3. מה עשה עשו כשראה שבנות כנען רעות בעיני אביו?", "a": "הלך לישמעאל ולקח את מחלת בת ישמעאל לאישה", "source": "15 jacobs dream", "type": "story"}, {"q": "4. מאיפה יצא יעקב ולאן הלך?", "a": "יצא מבאר שבע והלך חרנה", "source": "15 jacobs dream", "type": "story"}, {"q": "5. מדוע לן יעקב במקום שבו חלם?", "a": "כי בא השמש (חשכה)", "source": "15 jacobs dream", "type": "story"}, {"q": "6. מה שם יעקב מראשותיו?", "a": "מאבני המקום", "source": "15 jacobs dream", "type": "story"}, {"q": "7. מה חלם יעקב?", "a": "סולם מוצב ארצה וראשו מגיע השמימה, ומלאכי אלוהים עולים ויורדים בו", "source": "15 jacobs dream", "type": "story"}, {"q": "8. מה אמר ה' ליעקב בחלום על הארץ?", "a": "\"הארץ אשר אתה שוכב עליה לך אתננה ולזרעך\"", "source": "15 jacobs dream", "type": "story"}, {"q": "9. למה דימה ה' את זרע יעקב?", "a": "\"כעפר הארץ\" - ופרצת ימה וקדמה וצפונה ונגבה", "source": "15 jacobs dream", "type": "story"}, {"q": "10. מה הבטיח ה' ליעקב בחלום?", "a": "\"הנה אנכי עמך ושמרתיך בכל אשר תלך והשבותיך אל האדמה הזאת, כי לא אעזבך\"", "source": "15 jacobs dream", "type": "story"}, {"q": "11. מה אמר יעקב כשהתעורר מהחלום?", "a": "\"אכן יש ה' במקום הזה ואנכי לא ידעתי\"", "source": "15 jacobs dream", "type": "story"}, {"q": "12. כיצד תיאר יעקב את המקום?", "a": "\"מה נורא המקום הזה, אין זה כי אם בית אלוהים וזה שער השמים\"", "source": "15 jacobs dream", "type": "story"}, {"q": "13. מה עשה יעקב עם האבן?", "a": "שם אותה מצבה ויצק שמן על ראשה", "source": "15 jacobs dream", "type": "story"}, {"q": "14. מה השם שקרא יעקב למקום ומה היה שמו הקודם?", "a": "קרא לו \"בית אל\", ושם העיר לפנים היה לוז", "source": "15 jacobs dream", "type": "story"}, {"q": "15. מה נדר יעקב?", "a": "אם ה' ישמור אותו בדרך, ייתן לו לחם ומים, וישיבנו בשלום - \"והיה ה' לי לאלוהים, והאבן הזאת יהיה בית אלוהים, וכל אשר תיתן לי עשר אעשרנו לך\"", "source": "15 jacobs dream", "type": "story"}, {"q": "16. לאילו ארבעה כיוונים הבטיח ה' שזרע יעקב יפרוץ?", "a": "ימה, קדמה, צפונה ונגבה", "source": "15 jacobs dream", "type": "story"}, {"q": "1. ⭐⭐ \"וְהִנֵּה ה' נִצָּב עָלָיו... אֲנִי ה' אֱלֹהֵי אַבְרָהָם\"", "a": "**מי אמר:** ה'\n**למי:** יעקב\n**הקשר:** ה' מתגלה ליעקב בחלום הסולם בבית אל ומבטיח לו את הארץ (בראשית כ\"ח:י\"ג)", "source": "15 jacobs dream", "type": "story"}, {"q": "1. ⭐⭐ יעקב חלם את חלום הסולם בבאר שבע. נכון או לא נכון?", "a": "**לא נכון.** חלום הסולם היה בלוז, שיעקב קרא לה בית-אל: \"ויקרא את שם המקום ההוא בית אל ואולם לוז שם העיר לראשונה\" (בראשית כ\"ח:י\"ט).", "source": "15 jacobs dream", "type": "story"}, {"q": "2. ⭐⭐⭐ בחלום הסולם, המלאכים יורדים ועולים. נכון או לא נכון?", "a": "**לא נכון.** הסדר בכתוב הוא דווקא **עולים ויורדים** (לא יורדים ועולים): \"והנה מלאכי אלוהים **עולים ויורדים** בו\" (בראשית כ\"ח:י\"ב). רבים טועים בסדר הזה.", "source": "15 jacobs dream", "type": "story"}, {"q": "3. ⭐⭐⭐ עשו לקח את מחלת בת ישמעאל לאישה במקום נשותיו הכנעניות. נכון או לא נכון?", "a": "**לא נכון.** עשו לקח את מחלת בת ישמעאל **על נשיו** - כלומר בנוסף לנשותיו הכנעניות, לא במקומן: \"ויקח את מחלת בת ישמעאל... **על נשיו** לו לאישה\" (בראשית כ\"ח:ט').", "source": "15 jacobs dream", "type": "story"}, {"q": "2. ⭐⭐⭐ \"לֹא תִקַּח אִשָּׁה מִבְּנוֹת כְּנָעַן. קוּם לֵךְ פַּדֶּנָה אֲרָם\"", "a": "**מי אמר:** יצחק\n**למי:** יעקב\n**הקשר:** יצחק מצווה את יעקב שלא יישא כנענית ושולחו לפדן ארם לקחת אישה מבנות לבן (בראשית כ\"ח:א'-ב')", "source": "15 jacobs dream", "type": "story"}, {"q": "1. ⭐⭐⭐ ברח מפני אחיו, לן עם אבן מתחת לראשו, חלם חלום נבואי, יצק שמן על מצבה, נדר לתת מעשר", "a": "**הדמות:** יעקב\n**ספר:** בראשית\n**הקשר:** יעקב ברח מעשו, לן בלוז/בית אל עם אבן מראשותיו, חלם על הסולם, הקים מצבה ויצק שמן, ונדר לתת מעשר לה' (פרק כ\"ח)", "source": "15 jacobs dream", "type": "story"}, {"q": "1. לאן הלך יעקב לאחר שנשא את רגליו, ומדוע?", "a": "יעקב הלך ארצה בני קדם (חרן) — כדי למצוא אישה מבנות לבן אחי אמו, בהוראת אביו יצחק ואמו רבקה", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "2. מה היתה ההסכמה בין הרועים בנוגע לגלילת האבן?", "a": "לא גוללים את האבן עד שנאספים כל העדרים יחד — רק אז גוללים, משקים, ומחזירים את האבן למקומה", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "3. מה שאל יעקב את הרועים, ומה ענו?", "a": "(א) \"מאין אתם?\" — ענו: \"מחרן אנחנו\". (ב) \"היֵדַעְתֶּם את לבן בן נחור?\" — ענו: \"ידענו\". (ג) \"השלום לו?\" — ענו: \"שלום, והנה רחל בתו באה עם הצאן\"", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "4. מה מיוחד בפעולת גלילת האבן שעשה יעקב?", "a": "הרועים הסבירו שנדרשים כל העדרים יחד לגלול אותה. יעקב גלל אותה לבדו — \"ויגל את האבן מעל פי הבאר לבדו\" — מה שמלמד על כוחו יוצא הדופן ועל הרגשות החזקים שעוררה בו ראיית רחל", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "5. מדוע בכה יעקב לאחר שנישק לרחל?", "a": "פירושים שונים: (א) שמחת מפגש עם קרוב משפחה לאחר הבריחה הארוכה מעשיו. (ב) לפי המדרש — ראה ברוח הקודש שרחל לא תיקבר עמו", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "6. מה הסביר יעקב לרחל לאחר הנשיקה?", "a": "שהוא קרוב משפחה: \"כי אחי אביה הוא וכי בן רבקה הוא\" — כלומר הוא בן אחות לבן", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "7. כיצד קיבל לבן את יעקב?", "a": "לבן רץ לקראת יעקב, חיבקו ונישקו, הביאו אל ביתו. לאחר שיעקב סיפר \"את כל הדברים האלה\", אמר לבן \"אך עצמי ובשרי אתה\" — הכיר בו כבן משפחה. יעקב ישב עמו חודש ימים", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "8. כמה עדרי צאן היו ליד הבאר, ומדוע רבצו שם?", "a": "שלושה עדרי צאן. רבצו ליד הבאר כי משם השקו את העדרים — אך המתינו לאיסוף כל העדרים לפני גלילת האבן", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "1. ⭐⭐ \"הֵן עוֹד הַיּוֹם גָּדוֹל לֹא עֵת הֵאָסֵף הַמִּקְנֶה\"", "a": "**מי אמר:** יעקב\n**למי:** הרועים הישובים ליד הבאר\n**הקשר:** יעקב ביקש מהרועים להמשיך לרעות במקום לשבת בטלים ליד הבאר (בראשית כ\"ט:ז)", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "2. ⭐⭐ \"אַךְ עַצְמִי וּבְשָׂרִי אָתָּה\"", "a": "**מי אמר:** לבן\n**למי:** יעקב\n**הקשר:** לאחר שרחל הגידה ללבן על יעקב, ולאחר שיעקב סיפר ללבן את כל אשר קרה לו — לבן הכיר בו כבן משפחה (בראשית כ\"ט:יד)", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "1. ⭐⭐ יעקב גלל את האבן מפי הבאר לאחר שכל העדרים נאספו. נכון או לא נכון?", "a": "**לא נכון.** יעקב גלל את האבן **לבדו**, מיד כשראה את רחל, ללא המתנה לאיסוף כל העדרים: \"ויגל את האבן מעל פי הבאר לבדו\" (בראשית כ\"ט:י').", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "2. ⭐⭐ הרועים ליד הבאר היו מבאר שבע. נכון או לא נכון?", "a": "**לא נכון.** הרועים היו **מחרן**: \"מחרן אנחנו\" (בראשית כ\"ט:ד).", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "3. ⭐⭐⭐ לבן רץ לקראת יעקב מיד כששמע שהוא בחוץ. נכון או לא נכון?", "a": "**נכון.** \"ויהי כשמֹע לבן את שמע יעקב בן אחֹתו וירץ לקראתו\" — לבן רץ מיד כששמע שבן אחותו הגיע (בראשית כ\"ט:י\"ג).", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "1. ⭐⭐ רועה צאן, בת לבן, רצה לספר לאביה, ראשונה שמגיעה לבאר כשיעקב שם", "a": "**הדמות:** רחל\n**ספר:** בראשית\n**הקשר:** פרק כ\"ט, המפגש הראשון עם יעקב ליד הבאר", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "2. ⭐⭐ גלל אבן גדולה לבדו, נישק אישה שלא אשתו ובכה, אמר שהוא קרוב משפחה", "a": "**הדמות:** יעקב\n**ספר:** בראשית\n**הקשר:** פרק כ\"ט, הגעתו לחרן ומפגשו הראשון עם רחל", "source": "16 yaakov rachel meeting", "type": "story"}, {"q": "1. מה הייתה הצעת יעקב ללבן, ומה השיב לבן?", "a": "יעקב הציע לעבוד שבע שנים בעד רחל בת לבן הקטנה. לבן השיב: \"טוב תתי אֹתה לך מתתי אֹתה לאיש אחר — שבה עמדי\"", "source": "17 yaakov marriages", "type": "story"}, {"q": "2. כיצד מתוארות לאה ורחל בפסוק?", "a": "לאה: \"עיניה רכות\". רחל: \"יפת תואר ויפת מראה\". לאה הגדולה ורחל הקטנה", "source": "17 yaakov marriages", "type": "story"}, {"q": "3. מה עשה לבן בלילת החתונה, ומה גילה יעקב בבוקר?", "a": "לבן ערך משתה, ובערב הביא את לאה (במקום רחל) ליעקב. בבוקר גילה יעקב שהיא לאה — \"והנה היא לאה\"", "source": "17 yaakov marriages", "type": "story"}, {"q": "4. מה הייתה תגובת יעקב כשגילה שנרמה, ומה ענה לבן?", "a": "יעקב אמר: \"מה זאת עשית לי — הלא ברחל עבדתי עמך ולמה רמיתני\". לבן ענה: \"לא יעשה כן במקומנו לתת הצעירה לפני הבכירה\"", "source": "17 yaakov marriages", "type": "story"}, {"q": "5. מה הציע לבן ליעקב לאחר ההחלפה?", "a": "\"מלא שבוע זאת\" — ימלא שבוע ימי חתונת לאה, ואז יקבל גם את רחל. בתמורה יעבוד עוד שבע שנים נוספות", "source": "17 yaakov marriages", "type": "story"}, {"q": "6. מה קיבלה כל אחת מבנות לבן כשפחה בנדן?", "a": "לאה קיבלה את זלפה שפחת לבן. רחל קיבלה את בלהה שפחת לבן", "source": "17 yaakov marriages", "type": "story"}, {"q": "7. כמה שנים עבד יעקב סך הכל עבור שתי נשיו? הסבר את החשבון.", "a": "ארבע עשרה שנים: שבע שנים ראשונות בעד רחל (לפני הנישואין), ועוד שבע שנים לאחר שמילא שבוע חתונת לאה — בעד רחל שוב", "source": "17 yaakov marriages", "type": "story"}, {"q": "8. מדוע נאמר שהשבע שנים היו בעיני יעקב \"כימים אחדים\"?", "a": "מפני אהבתו הגדולה לרחל — \"באהבתו אֹתה\". האהבה עשתה את הזמן קל ומהיר", "source": "17 yaakov marriages", "type": "story"}, {"q": "1. ⭐⭐ \"הָבָה אֶת אִשְׁתִּי כִּי מָלְאוּ יָמַי וְאָבֹאָה אֵלֶיהָ\"", "a": "**מי אמר:** יעקב\n**למי:** לבן\n**הקשר:** לאחר שמלאו שבע שנות עבודה, יעקב תובע לקבל את רחל לאישה (בראשית כ\"ט:כ\"א)", "source": "17 yaakov marriages", "type": "story"}, {"q": "2. ⭐⭐⭐ \"לֹא יֵעָשֶׂה כֵן בִּמְקוֹמֵנוּ לָתֵת הַצְּעִירָה לִפְנֵי הַבְּכִירָה\"", "a": "**מי אמר:** לבן\n**למי:** יעקב\n**הקשר:** לאחר שיעקב גילה בבוקר שנרמה ולאה היא שהובאה אליו, ולא רחל (בראשית כ\"ט:כ\"ו)", "source": "17 yaakov marriages", "type": "story"}, {"q": "3. ⭐⭐ \"מַה זֹּאת עָשִׂיתָ לִּי הֲלֹא בְרָחֵל עָבַדְתִּי עִמָּךְ וְלָמָּה רִמִּיתָנִי\"", "a": "**מי אמר:** יעקב\n**למי:** לבן\n**הקשר:** בבוקר שלאחר לילת החתונה, לאחר שיעקב גילה שלאה היא ולא רחל (בראשית כ\"ט:כ\"ה)", "source": "17 yaakov marriages", "type": "story"}, {"q": "1. ⭐⭐ יעקב עבד שבע שנים ואז קיבל את רחל לאישה לפני שהתחתן עם לאה. נכון או לא נכון?", "a": "**לא נכון.** לאה הובאה ליעקב בלילת החתונה לאחר שבע שנות עבודה. רחל ניתנה לו **לאחר** שמילא שבוע חתונת לאה — ורק אז התחייב לעבוד עוד שבע שנים נוספות (בראשית כ\"ט:כ\"ג-כ\"ח).", "source": "17 yaakov marriages", "type": "story"}, {"q": "2. ⭐⭐ לבן נתן ללאה את בלהה כשפחה ולרחל את זלפה. נכון או לא נכון?", "a": "**לא נכון.** **לאה** קיבלה את **זלפה**, ו**רחל** קיבלה את **בלהה** (בראשית כ\"ט:כ\"ד, כ\"ט).", "source": "17 yaakov marriages", "type": "story"}, {"q": "3. ⭐⭐⭐ יעקב עבד שבע שנים, התחתן עם לאה, ואחר כך עם רחל, ועוד שבע שנים — כלומר עשרים ואחת שנות עבודה. נכון או לא נכון?", "a": "**לא נכון.** יעקב עבד **ארבע עשרה** שנים: שבע לפני הנישואין ועוד שבע לאחר מכן. הנישואין לרחל קדמו לתחילת שבע השנים הנוספות — הוא קיבל את רחל **לפני** שהחל לעבוד אותן (בראשית כ\"ט:כ\"ז-ל').", "source": "17 yaakov marriages", "type": "story"}, {"q": "1. ⭐ בכירה, עיניה רכות, הובאה ליעקב בלילת החתונה במקום אחותה", "a": "**הדמות:** לאה\n**ספר:** בראשית\n**הקשר:** פרק כ\"ט — החתונה המרומה", "source": "17 yaakov marriages", "type": "story"}, {"q": "2. ⭐⭐ שפחה שניתנה לבכירה בת לבן כנדן, לאחר מכן אמם של שבטים", "a": "**הדמות:** זלפה\n**ספר:** בראשית\n**הקשר:** שפחת לאה, ניתנה לה כשלבן נשאה ליעקב (כ\"ט:כ\"ד). בהמשך תלד לגד ואשר", "source": "17 yaakov marriages", "type": "story"}, {"q": "1. מדוע ה' פתח את רחם לאה דווקא?", "a": "\"כי ראה ה' כי שנואה לאה\" — לאה הייתה פחות אהובה, וה' ריחם עליה ופיצה אותה בפריון", "source": "18 birth of tribes", "type": "story"}, {"q": "2. מה ביקשה רחל מיעקב, ומה ענה לה?", "a": "רחל ביקשה: \"הבה לי בנים ואם אין מֵתה אנכי\". יעקב ענה בכעס: \"התחת אלהים אנכי אשר מנע ממך פרי בטן\"", "source": "18 birth of tribes", "type": "story"}, {"q": "3. כיצד ניסתה רחל \"להיבנות\" על ידי שפחתה?", "a": "רחל נתנה את בלהה שפחתה ליעקב לאישה — בלהה תלד על ברכי רחל, ובכך ייחשב הילד לרחל", "source": "18 birth of tribes", "type": "story"}, {"q": "4. מה הם הדודאים, מי מצא אותם, ומה הייתה העסקה?", "a": "דודאים — צמח הנחשב לסגולת פריון. ראובן מצאם בשדה בזמן קציר חיטים והביאם ללאה. רחל ביקשה מהם, ולאה הסכימה לתתם בתמורה לכך שיעקב ישכב עם לאה אותו לילה", "source": "18 birth of tribes", "type": "story"}, {"q": "5. מה אמרה לאה כשיעקב חזר מהשדה?", "a": "\"אלי תבוא כי שכֹר שכרתיך בדודאי בני\" — לאה \"שכרה\" את יעקב מרחל בעד הדודאים", "source": "18 birth of tribes", "type": "story"}, {"q": "6. כמה בנים ילדה לאה ישירות (לא על ידי שפחתה)? מי הם?", "a": "שישה בנים: ראובן, שמעון, לוי, יהודה (לפני הפסקה) ויששכר, זבולון (לאחר הדודאים). ובנוסף ילדה את דינה — בת", "source": "18 birth of tribes", "type": "story"}, {"q": "7. מה פירוש שם יוסף, ומה אמרה רחל כשנולד?", "a": "\"אסף אלהים את חרפתי\" — ה' הסיר את בושת עקרותה. \"יֹסֵף ה' לי בן אחר\" — תקווה לבן נוסף בעתיד", "source": "18 birth of tribes", "type": "story"}, {"q": "8. מי הם ארבעת האמהות של שנים עשר השבטים, וכמה ילדה כל אחת?", "a": "לאה — 6 בנים ודינה. בלהה (שפחת רחל) — 2 בנים. זלפה (שפחת לאה) — 2 בנים. רחל — 1 בן (יוסף, ובהמשך בנימין)", "source": "18 birth of tribes", "type": "story"}, {"q": "1. ⭐⭐ \"הָבָה לִּי בָנִים וְאִם אַיִן מֵתָה אָנֹכִי\"", "a": "**מי אמר:** רחל\n**למי:** יעקב\n**הקשר:** רחל מקנאת בלאה שיולדת ותובעת מיעקב ילדים (בראשית ל':א)", "source": "18 birth of tribes", "type": "story"}, {"q": "2. ⭐⭐⭐ \"הַמְעַט קַחְתֵּךְ אֶת אִישִׁי וְלָקַחַת גַּם אֶת דּוּדָאֵי בְּנִי\"", "a": "**מי אמר:** לאה\n**למי:** רחל\n**הקשר:** רחל ביקשה מדודאי ראובן, ולאה נעלבה שרחל לוקחת גם את האיש וגם את הדודאים (בראשית ל':ט\"ו)", "source": "18 birth of tribes", "type": "story"}, {"q": "3. ⭐⭐ \"הֲתַחַת אֱלֹהִים אָנֹכִי אֲשֶׁר מָנַע מִמֵּךְ פְּרִי בָטֶן\"", "a": "**מי אמר:** יעקב\n**למי:** רחל\n**הקשר:** תגובת יעקב לתביעת רחל שיתן לה בנים — הוא מצביע שהעקרות היא גזירת ה' ולא בידו (בראשית ל':ב)", "source": "18 birth of tribes", "type": "story"}, {"q": "1. ⭐⭐ ראובן מצא דודאים בשדה בזמן קציר שעורים. נכון או לא נכון?", "a": "**לא נכון.** ראובן מצא דודאים בזמן **קציר חיטים**: \"בִּימֵי קְצִיר חִטִּים\" (בראשית ל':י\"ד).", "source": "18 birth of tribes", "type": "story"}, {"q": "2. ⭐⭐ בלהה ילדה ליעקב את גד ואת אשר. נכון או לא נכון?", "a": "**לא נכון.** **בלהה** ילדה את **דן ונפתלי**. **זלפה** ילדה את **גד ואשר** (בראשית ל':ו-יג).", "source": "18 birth of tribes", "type": "story"}, {"q": "3. ⭐⭐⭐ לאה פסקה מלדת לאחר לידת לוי, לפני שנתנה את זלפה ליעקב. נכון או לא נכון?", "a": "**לא נכון.** לאה ילדה **ארבעה** בנים לפני שפסקה (ראובן, שמעון, לוי, יהודה), לא שלושה. הפסוק \"ותעמוד מלדת\" בא לאחר לידת יהודה (כ\"ט:ל\"ה). רק אז נתנה זלפה (בראשית ל':ט).", "source": "18 birth of tribes", "type": "story"}, {"q": "1. ⭐ ילד בדודאים, בן בכור, שמו קשור ל\"ראייה\"", "a": "**הדמות:** ראובן\n**ספר:** בראשית\n**הקשר:** בן לאה הבכור — \"כי ראה ה' בעניי\", ומוצא הדודאים בפרק ל'", "source": "18 birth of tribes", "type": "story"}, {"q": "2. ⭐⭐ עקרה שנים רבות, מקנאה, נותנת שפחתה, בסוף יולדת \"ויזכור אלהים\"", "a": "**הדמות:** רחל\n**ספר:** בראשית\n**הקשר:** פרקים כ\"ט-ל' — יולדת את יוסף לאחר שנות עקרות", "source": "18 birth of tribes", "type": "story"}, {"q": "1. מה ביקש יעקב מלבן לאחר לידת יוסף?", "a": "יעקב ביקש לשוב לארצו: \"שלחני ואלכה אל מקומי ולארצי — תנה את נשי ואת ילדי\"", "source": "19 yaakov lavan flock", "type": "story"}, {"q": "2. מדוע לבן רצה שיעקב ישאר?", "a": "לבן ידע ש\"ויברכני ה' בגללך\" — הצלחתו הכלכלית הגיעה בזכות יעקב ועבודתו", "source": "19 yaakov lavan flock", "type": "story"}, {"q": "3. מה הציע יעקב כשכרו?", "a": "כל שה נקוד, טלוא וחום מן הצאן — הסוג הנדיר והחריג. יעקב אמר: \"כל אשר אינו נקוד וטלוא — גנוב הוא אצלי\"", "source": "19 yaakov lavan flock", "type": "story"}, {"q": "4. מה עשה לבן לאחר שהסכים, ומדוע?", "a": "לבן הסיר **באותו יום** את כל הנקוד והטלוא מהעדר, מסר לידי בניו, ושם מרחק שלושת ימים ביניהם לבין יעקב — כדי שאפשרות הצאן הנקוד להיוולד תתמעט", "source": "19 yaakov lavan flock", "type": "story"}, {"q": "5. מה עשה יעקב עם המקלות, ומהו ההסבר לתוצאה?", "a": "לקח מקלות מלבנה, לוז וערמון, פיצל בהם פסים לבנות, והציב אותם בשקתות המים מול הצאן בעת יחומן. הצאן ראו המקלות ויולדו ולדות נקודים — של יעקב", "source": "19 yaakov lavan flock", "type": "story"}, {"q": "6. מהי האסטרטגיה החכמה שיישם יעקב בנוגע לצאן חזקה לעומת חלשה?", "a": "את המקלות הציב רק מול הצאן ה\"מקושרות\" (החזקות) — לכן הצאן החזקה ילדה נקוד ליעקב. מול ה\"עטופות\" (החלשות) לא הציב מקלות — הן ילדו לבן ונשארו ללבן", "source": "19 yaakov lavan flock", "type": "story"}, {"q": "7. מה הייתה התוצאה הסופית של עסקת הצאן?", "a": "\"ויפרץ האיש מאד מאד ויהי לו צאן רבות ושפחות ועבדים וגמלים וחמורים\" — יעקב התעשר מאוד", "source": "19 yaakov lavan flock", "type": "story"}, {"q": "1. ⭐⭐ \"נִחַשְׁתִּי וַיְבָרְכֵנִי ה' בִּגְלָלֶךָ\"", "a": "**מי אמר:** לבן\n**למי:** יעקב\n**הקשר:** לבן מנסה לשכנע את יעקב להישאר ולא לחזור לארצו — הוא יודע שהצלחתו בגלל יעקב (בראשית ל':כ\"ז)", "source": "19 yaakov lavan flock", "type": "story"}, {"q": "2. ⭐⭐⭐ \"וְעָנְתָה בִּי צִדְקָתִי בְּיוֹם מָחָר\"", "a": "**מי אמר:** יעקב\n**למי:** לבן\n**הקשר:** יעקב מציע את תנאי השכר — הנקוד ישמש ראיה לצדקתו: כל מה שאינו נקוד אצלו — בדאי שהוא גנב (בראשית ל':ל\"ג)", "source": "19 yaakov lavan flock", "type": "story"}, {"q": "1. ⭐⭐ לבן הסיר את הצאן הנקוד מהעדר ומסרם ישירות ליעקב לשמירה. נכון או לא נכון?", "a": "**לא נכון.** לבן מסר את הנקוד לידי **בניו שלו** ושם ביניהם לבין יעקב מרחק שלושת ימים — כדי שלא יוכל לנצל אותם (בראשית ל':ל\"ה-ל\"ו).", "source": "19 yaakov lavan flock", "type": "story"}, {"q": "2. ⭐⭐ יעקב הציב מקלות מול כל הצאן בשווה. נכון או לא נכון?", "a": "**לא נכון.** יעקב הציב מקלות רק מול ה**חזקות** (\"המקושרות\"). מול ה**חלשות** (\"העטופות\") לא הציב — כדי שהצאן החזקה תלד לו ותחלש תלד ללבן (בראשית ל':מ\"א-מ\"ב).", "source": "19 yaakov lavan flock", "type": "story"}, {"q": "1. ⭐⭐ מכיר שמישהו מביא לו ברכה, אך מנסה להונות אותו בהסכם הצאן", "a": "**הדמות:** לבן\n**ספר:** בראשית\n**הקשר:** פרק ל' — לבן מסכים להצעת יעקב ומיד מסיר את הנקוד", "source": "19 yaakov lavan flock", "type": "story"}, {"q": "2. ⭐⭐⭐ משתמש בידע טבעי ואסטרטגיה חכמה כדי להתעשר מהסכם שנוצר לרעתו", "a": "**הדמות:** יעקב\n**ספר:** בראשית\n**הקשר:** פרק ל' — תחבולת המקלות ובחירת הצאן החזקות", "source": "19 yaakov lavan flock", "type": "story"}, {"q": "1. מה שמע יעקב מבני לבן, ומה ראה בפני לבן?", "a": "בני לבן אמרו: \"לקח יעקב את כל אשר לאבינו\". ופני לבן כבר אינם אליו \"כתמול שלשום\" — שינוי ביחס", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "2. מה ציווה ה' את יעקב?", "a": "\"שוב אל ארץ אבותיך ולמולדתך ואהיה עמך\" — חזרה לכנען, עם הבטחת נוכחות ה'", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "3. מה סיפר יעקב לרחל וללאה על יחסו של לבן אליו?", "a": "שעבד בכל כוחו, אך לבן הֵתֶל בו (רימה) ושינה את שכרו עשרת מונים — אך אלהים לא הרשה ללבן להרע עמו", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "4. מה ראה יעקב בחלום, ומה אמר לו המלאך?", "a": "ראה תיישים עקודים, נקודים וברודים עולים על הצאן. המלאך אמר שה' ראה את כל אשר לבן עושה ליעקב, וציווהו לקום ולצאת — \"אנכי האל בית אל אשר משחת שם מצבה\"", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "5. כיצד הגיבו רחל ולאה להצעת יעקב לברוח?", "a": "תמכו בו: אמרו שנחשבות כנוכריות בבית אביהן — שמכר אותן ואכל את כספן. \"כל אשר אמר אלהים אליך עשה\"", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "6. מה גנבה רחל בעת הבריחה, ומדוע?", "a": "רחל גנבה את התרפים (פסלי/אלילי הבית) של לבן אביה. הסיבה אינה מפורשת בתורה — פירושים שונים: כדי למנוע מלבן לנחש את מקומם, או מרגש חיבה כלפיהם", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "7. מה פירוש \"ויגנב יעקב את לב לבן הארמי\"?", "a": "ביטוי: יעקב ברח בסתר בלא לגלות ללבן שהוא עומד לברוח — \"גנב את ליבו\" = הסתיר ממנו", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "8. לאן נסע יעקב לאחר שעבר את הנהר?", "a": "שם פניו להר הגלעד — בדרך לארץ כנען", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "1. ⭐⭐ \"שׁוּב אֶל אֶרֶץ אֲבוֹתֶיךָ וּלְמוֹלַדְתֶּךָ וְאֶהְיֶה עִמָּךְ\"", "a": "**מי אמר:** ה'\n**למי:** יעקב\n**הקשר:** ה' מצווה את יעקב לעזוב את חרן ולשוב לארץ כנען (בראשית ל\"א:ג)", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "2. ⭐⭐ \"אָנֹכִי הָאֵל בֵּית אֵל אֲשֶׁר מָשַׁחְתָּ שָּׁם מַצֵּבָה\"", "a": "**מי אמר:** מלאך האלהים (בחלום)\n**למי:** יעקב\n**הקשר:** המלאך מזכיר את ברית בית אל ומצווה את יעקב לקום ולצאת (בראשית ל\"א:י\"ג)", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "3. ⭐⭐⭐ \"הֲלוֹא נָכְרִיּוֹת נֶחְשַׁבְנוּ לוֹ כִּי מְכָרָנוּ וַיֹּאכַל גַּם אָכוֹל אֶת כַּסְפֵּנוּ\"", "a": "**מי אמר:** רחל ולאה\n**למי:** יעקב\n**הקשר:** כשיעקב קרא להן השדה והסביר שהוא רוצה לברוח — הן תמכו בו ואמרו שלבן נהג בהן כבנוכריות (בראשית ל\"א:ט\"ו)", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "1. ⭐⭐ לבן שינה את שכרו של יעקב שלוש פעמים. נכון או לא נכון?", "a": "**לא נכון.** יעקב אמר שלבן שינה את שכרו \"**עֲשֶׂרֶת מֹנִים**\" — עשר פעמים (בראשית ל\"א:ז).", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "2. ⭐⭐ רחל גנבה את התרפים בידיעת יעקב. נכון או לא נכון?", "a": "**לא נכון.** יעקב לא ידע שרחל גנבה. הפסוק מבחין: \"ויגנב יעקב את לב לבן\" — יעקב ברח בסתר; ו\"ותגנב רחל את התרפים\" — רחל גנבה בנפרד (בראשית ל\"א:י\"ט-כ).", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "3. ⭐ יעקב עבר את הנהר ושם פניו לכיוון ירושלים. נכון או לא נכון?", "a": "**לא נכון.** יעקב שם פניו **להר הגלעד** — לא לירושלים (בראשית ל\"א:כ\"א).", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "1. ⭐⭐ גנבה חפץ של אביה בעת בריחת המשפחה, לא גילתה לבעלה", "a": "**הדמות:** רחל\n**ספר:** בראשית\n**הקשר:** פרק ל\"א — גונבת את תרפי לבן בעת הבריחה", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "2. ⭐⭐ בורח בסתר, קורא לנשיו השדה, מספר על חלום שבו מלאך הורה לו לשוב", "a": "**הדמות:** יעקב\n**ספר:** בראשית\n**הקשר:** פרק ל\"א — ההכנה לבריחה מלבן", "source": "20 yaakov flees lavan", "type": "story"}, {"q": "1. ⭐⭐⭐ אברהם אמר על שרה \"אחותי היא\" בשני מקרים שונים - באילו פרקים זה קרה, ומה ההבדלים בין המקרים? (לך לך, אברהם ואבימלך)", "a": "בפרק י\"ב אברהם אומר זאת בפני פרעה מלך מצרים, ובפרק כ' בפני אבימלך מלך גרר. במצרים פרעה נענש בנגעים, ואילו אבימלך הוזהר בחלום לפני שקרב אליה. בפרק כ' אברהם מסביר שהיא אכן אחותו מצד אביו (\"בת אבי היא אך לא בת אמי\"), ואילו בפרק י\"ב אין הסבר כזה. בנוסף, בפרק כ' ה' מכנה את אברהם \"נביא\" לראשונה.", "source": "cross chapter", "type": "story"}, {"q": "2. ⭐⭐ גם אברהם וגם שרה צחקו כששמעו על לידת יצחק - היכן צחק כל אחד מהם, ומה היה ההבדל בתגובת ה'? (ברית המילה, בשורת לידת יצחק)", "a": "אברהם צחק בפרק י\"ז (ברית המילה) כשה' אמר לו שייוולד בן, ואמר \"הלבן מאה שנה ייולד\". שרה צחקה בפרק י\"ח כששמעה את בשורת המלאכים. על צחוק שרה ה' הגיב \"למה זה צחקה שרה... היפלא מה' דבר\", ואילו על צחוק אברהם לא נאמר שה' הוכיחו.", "source": "cross chapter", "type": "story"}, {"q": "3. ⭐⭐ הגר ברחה/גורשה פעמיים - מה קרה בכל פעם ומה ההבדלים? (הגר וישמעאל, לידת יצחק וגירוש הגר)", "a": "בפרק ט\"ז הגר ברחה מעצמה מפני שרי שעינתה אותה, ומלאך ה' ציווה אותה לשוב. בפרק כ\"א אברהם גירש אותה בפקודת ה', לאחר שדרשה זאת שרה. בפעם הראשונה הגר היתה בהריון ולבד, בפעם השנייה היתה עם ישמעאל. בשתי הפעמים מלאך ה' דיבר אליה ובישר על עתיד ישמעאל.", "source": "cross chapter", "type": "story"}, {"q": "4. ⭐⭐⭐ אברהם סירב לקחת רכוש ממלך סדום, אך קיבל רכוש מפרעה ומאבימלך - מה ההבדל? (מלחמת המלכים, לך לך, אברהם ואבימלך)", "a": "בפרק י\"ד אברהם סירב בנחרצות לקחת \"מחוט ועד שרוך נעל\" ממלך סדום, כי לא רצה שיאמר \"אני העשרתי את אברם\". לעומת זאת, בפרק י\"ב קיבל מפרעה צאן ובקר בזכות שרי, ובפרק כ' קיבל מאבימלך צאן ובקר, עבדים ושפחות כפיצוי.", "source": "cross chapter", "type": "story"}, {"q": "5. ⭐⭐ השוו את הכנסת האורחים של אברהם ושל לוט - מה הדמיון ומה ההבדל? (בשורת לידת יצחק, הפיכת סדום ועמורה)", "a": "בפרק י\"ח אברהם רץ לקראת שלושה אנשים, הכין סעודה מפוארת (בן בקר, חמאה, חלב, עוגות). בפרק י\"ט לוט קם לקראת שני המלאכים בסדום והכין משתה ואפה מצות. שניהם גילו הכנסת אורחים, אך אצל אברהם הביקור הביא בשורה טובה (לידת יצחק), ואצל לוט הביקור הביא הצלה מחורבן.", "source": "cross chapter", "type": "story"}, {"q": "6. ⭐⭐ סדרו את הגילאים: בן כמה היה אברהם בכל אחד מהאירועים הבאים - יציאה מחרן, לידת ישמעאל, ברית המילה, לידת יצחק? (לך לך, הגר וישמעאל, ברית המילה, לידת יצחק)", "a": "יציאה מחרן - בן 75 (פרק י\"ב). לידת ישמעאל - בן 86 (פרק ט\"ז). ברית המילה - בן 99 (פרק י\"ז). לידת יצחק - בן 100 (פרק כ\"א).", "source": "cross chapter", "type": "story"}, {"q": "7. ⭐⭐⭐ מה הקשר הכרונולוגי בין מלחמת המלכים לברית בין הבתרים? כיצד פותחת ברית בין הבתרים? (מלחמת המלכים, ברית בין הבתרים)", "a": "ברית בין הבתרים (פרק ט\"ו) פותחת ב\"אחר הדברים האלה\" - כלומר לאחר מלחמת המלכים (פרק י\"ד). ה' אומר לאברם \"אל תירא, אנכי מגן לך, שכרך הרבה מאוד\" - לפי הפשט, עידוד לאחר המלחמה והסירוב לקחת שלל ממלך סדום.", "source": "cross chapter", "type": "story"}, {"q": "8. ⭐⭐ מה קדם למה: בשורת הלידה של יצחק או חורבן סדום? כיצד שני האירועים קשורים זה לזה? (בשורת לידת יצחק, הפיכת סדום ועמורה)", "a": "בפרק י\"ח שני האירועים מתרחשים באותו מפגש - אותם שלושה אנשים/מלאכים שביקרו את אברהם ובישרו על לידת יצחק המשיכו לסדום להפוך אותה. בשורת הלידה באה ראשונה, ואחריה ה' גילה לאברהם על כוונתו להשמיד את סדום, ואז שניים מהמלאכים הלכו לסדום בפרק י\"ט.", "source": "cross chapter", "type": "story"}, {"q": "9. ⭐⭐ לוט מופיע בארבעה סיפורים שונים - מהו המסלול של לוט מתחילתו ועד סופו? (לך לך, פרידת אברם ולוט, מלחמת המלכים, הפיכת סדום ועמורה)", "a": "לוט יוצא עם אברם מחרן לכנען (פרק י\"ב). נפרד מאברם ובוחר בכיכר הירדן, אוהל עד סדום (פרק י\"ג). נשבה במלחמת המלכים וניצל על ידי אברם (פרק י\"ד). ניצל מחורבן סדום על ידי המלאכים, בזכות אברהם (פרק י\"ט).", "source": "cross chapter", "type": "story"}, {"q": "10. ⭐⭐ אבימלך מלך גרר מופיע בשני סיפורים - מהם ומה הקשר ביניהם? (אברהם ואבימלך, לידת יצחק וגירוש הגר)", "a": "בפרק כ' אבימלך לוקח את שרה ומוזהר בחלום, מחזירה ומפצה את אברהם. בפרק כ\"א אבימלך ופיכול שר צבאו כורתים ברית עם אברהם בבאר שבע - מתוך הכרה בכך שאלוהים עם אברהם בכל אשר הוא עושה.", "source": "cross chapter", "type": "story"}, {"q": "11. ⭐⭐⭐ ישמעאל מוזכר בארבעה פרקים לפחות - מה קורה לו בכל אחד מהם? (הגר וישמעאל, ברית המילה, לידת יצחק וגירוש הגר, חלום יעקב)", "a": "בפרק ט\"ז מלאך ה' מבשר על לידתו ומתאר אותו כ\"פרא אדם\". בפרק י\"ז נימול בגיל 13 ומובטחים לו 12 נשיאים. בפרק כ\"א גורש עם אמו, ניצל במדבר, גדל במדבר פארן ונעשה רובה קשת. בפרק כ\"ח עשו הולך ולוקח את מחלת בת ישמעאל לאישה.", "source": "cross chapter", "type": "story"}, {"q": "12. ⭐⭐ רבקה מופיעה לראשונה בסוף פרק כ\"ב ואחר כך בפרק כ\"ד ופרק כ\"ז - כיצד משתנה דמותה? (עקדת יצחק, שידוך רבקה, גניבת הברכות)", "a": "בסוף פרק כ\"ב רבקה מוזכרת לראשונה כבת בתואל בן נחור. בפרק כ\"ד היא מתוארת כנדיבה וטובת מראה, משקה גמלים ומסכימה ללכת (\"אלך\"). בפרק כ\"ז היא היוזמת של תרמית גניבת הברכות, מתכננת ומבצעת עם יעקב את ההונאה כנגד יצחק.", "source": "cross chapter", "type": "story"}, {"q": "13. ⭐ בית אל מופיעה בשני סיפורים מרכזיים - מה קרה שם בכל פעם? (לך לך, חלום יעקב)", "a": "בפרק י\"ב אברם נטה אוהלו בין בית אל לעי, בנה מזבח וקרא בשם ה'. בפרק כ\"ח יעקב לן שם בדרכו לחרן, חלם את חלום הסולם, הקים מצבה, יצק שמן וקרא למקום \"בית אל\" (ושמו הקודם היה לוז).", "source": "cross chapter", "type": "story"}, {"q": "14. ⭐⭐ באר שבע מופיעה בשלושה סיפורים - מה קרה שם בכל פעם? (לידת יצחק וגירוש הגר, עקדת יצחק, חלום יעקב)", "a": "בפרק כ\"א הגר תעתה במדבר באר שבע, ושם נכרתה ברית בין אברהם לאבימלך ונטע אשל. בפרק כ\"ב אברהם ישב בבאר שבע לאחר העקדה. בפרק כ\"ח יעקב יצא מבאר שבע בדרכו לחרן.", "source": "cross chapter", "type": "story"}, {"q": "15. ⭐⭐ חברון/אלוני ממרא מופיעה בשלושה סיפורים - מה קרה שם? (פרידת אברם ולוט, בשורת לידת יצחק, מות שרה)", "a": "בפרק י\"ג אברם התיישב באלוני ממרא אשר בחברון ובנה מזבח. בפרק י\"ח ה' נראה אל אברהם באלוני ממרא, שם אירח את שלושת המלאכים וקיבל את בשורת לידת יצחק. בפרק כ\"ג שרה מתה בקריית ארבע היא חברון, ושם קנה אברהם את מערת המכפלה.", "source": "cross chapter", "type": "story"}, {"q": "16. ⭐⭐ באר לחי ראי מוזכרת בשני סיפורים שונים - מהם? (הגר וישמעאל, שידוך רבקה)", "a": "בפרק ט\"ז הגר קראה למקום \"באר לחי ראי\" לאחר שמלאך ה' נגלה אליה שם (בין קדש ובין ברד). בפרק כ\"ד יצחק יושב בנגב ליד באר לחי ראי כשרבקה מגיעה - שם הוא יוצא \"לשוח בשדה\".", "source": "cross chapter", "type": "story"}, {"q": "17. ⭐⭐⭐ זרע אברהם הושווה לשלושה דברים שונים בשלושה פרקים - מהם? (פרידת אברם ולוט, ברית בין הבתרים, עקדת יצחק)", "a": "בפרק י\"ג - \"כעפר הארץ\" שאי אפשר למנותו. בפרק ט\"ו - \"ככוכבי השמים\" שאי אפשר לספור. בפרק כ\"ב - \"ככוכבי השמים וכחול אשר על שפת הים\". שלושה דימויים שונים שכולם מבטאים ריבוי עצום.", "source": "cross chapter", "type": "story"}, {"q": "18. ⭐⭐⭐ כמה שנים עברו מיציאת אברם מחרן ועד לידת יצחק, ומה הם האירועים העיקריים שקרו בתקופה זו? (לך לך עד לידת יצחק)", "a": "25 שנה (אברם יצא בגיל 75, יצחק נולד כשאברהם בן 100). בתקופה זו: ירידה למצרים, פרידה מלוט, מלחמת המלכים, ברית בין הבתרים, לידת ישמעאל (בגיל 86), ברית מילה ושינוי שמות (בגיל 99), בשורת המלאכים וחורבן סדום, המעשה עם אבימלך, ולבסוף לידת יצחק (בגיל 100).", "source": "cross chapter", "type": "story"}, {"q": "19. ⭐⭐ שני ציוויים של \"לך לך\" ניתנים לאברהם - מהם ומה הדמיון ביניהם? (לך לך, עקדת יצחק)", "a": "בפרק י\"ב: \"לך לך מארצך וממולדתך ומבית אביך אל הארץ אשר אראך\" - עזיבת הבית. בפרק כ\"ב: \"לך לך אל ארץ המוריה והעלהו שם לעולה\" - הקרבת הבן. בשני המקרים הביטוי \"לך לך\" מופיע, ובשניהם היעד אינו מפורש מיד (\"אשר אראך\" / \"אשר אומר אליך\"). הראשון פותח את דרכו של אברהם והאחרון הוא הניסיון הגדול ביותר.", "source": "cross chapter", "type": "story"}, {"q": "20. ⭐⭐ נושא המרמה/התחבולה חוזר בכמה סיפורים - היכן ומי מבצע אותה? (לך לך, אברהם ואבימלך, גניבת הברכות)", "a": "בפרק י\"ב אברם מבקש משרי לומר \"אחותי היא\" בפני פרעה. בפרק כ' אברהם חוזר על אותה תחבולה בפני אבימלך. בפרק כ\"ז רבקה ויעקב מרמים את יצחק כדי לגנוב את ברכת עשו. בכל המקרים התחבולה \"מצליחה\" אך גורמת לתוצאות מורכבות.", "source": "cross chapter", "type": "story"}, {"q": "21. ⭐⭐ ה' כרת שתי בריתות עם אברהם - מהן ומה ההבדל ביניהן? (ברית בין הבתרים, ברית המילה)", "a": "בפרק ט\"ו - ברית בין הבתרים: ה' עובר כ\"תנור עשן ולפיד אש\" בין בתרי הבהמות, מבטיח את הארץ מנהר מצרים עד נהר פרת, ומנבא 400 שנות גלות. בפרק י\"ז - ברית המילה: אות הברית הוא מילה בבשר הערלה ביום השמיני, שינוי שמות (אברם לאברהם, שרי לשרה), הבטחת ארץ כנען לאחוזת עולם, ובשורת לידת יצחק.", "source": "cross chapter", "type": "story"}, {"q": "22. ⭐⭐⭐ מעשר ניתן פעמיים בסיפורי בראשית - על ידי מי ובאילו נסיבות? (מלחמת המלכים, חלום יעקב)", "a": "בפרק י\"ד אברם נותן מעשר מכל השלל למלכי צדק מלך שלם, כוהן לאל עליון. בפרק כ\"ח יעקב נודר \"וכל אשר תיתן לי עשר אעשרנו לך\" - מעשר לה' כחלק מנדרו בבית אל.", "source": "cross chapter", "type": "story"}, {"q": "23. ⭐⭐⭐ \"שמע בקולה\" - בשני סיפורים שונים ה'/אברהם שומע בקול שרה - מהם ומה התוצאות? (הגר וישמעאל, לידת יצחק וגירוש הגר)", "a": "בפרק ט\"ז: \"וישמע אברם לקול שרי\" - כששרי הציעה לו לקחת את הגר, מה שהוביל ללידת ישמעאל. בפרק כ\"א: ה' אומר לאברהם \"כל אשר תאמר אליך שרה שמע בקולה\" - לגבי גירוש הגר וישמעאל. בפעם הראשונה שרה רצתה להביא ילד, בשנייה רצתה לגרש את אותו ילד.", "source": "cross chapter", "type": "story"}, {"q": "24. ⭐⭐ כיצד בחירת לוט לגור בסדום בפרק י\"ג גרמה לשרשרת אירועים בפרקים הבאים? (פרידת אברם ולוט, מלחמת המלכים, הפיכת סדום)", "a": "בפרק י\"ג לוט בחר בכיכר הירדן ואהל עד סדום. כתוצאה מכך, בפרק י\"ד לוט נשבה במלחמת המלכים ואברם נאלץ להצילו. בפרקים י\"ח-י\"ט אברהם התווכח עם ה' על סדום בגלל לוט, ולוט ניצל מההפיכה רק בזכות אברהם (\"ויזכור אלוהים את אברהם וישלח את לוט\").", "source": "cross chapter", "type": "story"}, {"q": "25. ⭐⭐ כיצד גניבת הברכות בפרק כ\"ז הובילה ישירות לחלום יעקב בפרק כ\"ח? (גניבת הברכות, חלום יעקב)", "a": "בפרק כ\"ז עשו שטם את יעקב ותכנן להרגו. רבקה שלחה את יעקב לברוח לחרן, אל לבן אחיה. בפרק כ\"ח יצחק בירך את יעקב בברכת אברהם ושלחו לפדן ארם. בדרכו, יעקב חלם את חלום הסולם בבית אל וקיבל הבטחה ישירה מה'.", "source": "cross chapter", "type": "story"}, {"q": "26. ⭐⭐⭐ מה הקשר בין העקדה בפרק כ\"ב לבין מות שרה בפרק כ\"ג? (עקדת יצחק, מות שרה)", "a": "פרק כ\"ג פותח מיד לאחר סיפור העקדה בפרק כ\"ב. שרה מתה בחברון, ולפי המסורת מותה קשור לעקדה. יש לציין שלאחר העקדה נאמר שאברהם שב לבאר שבע, ואילו שרה מתה בחברון - הם לא היו באותו מקום.", "source": "cross chapter", "type": "story"}, {"q": "27. ⭐⭐⭐ כיצד הבטחת ה' בברית בין הבתרים על שעבוד 400 שנה קשורה לירידת אברם למצרים? (לך לך, ברית בין הבתרים)", "a": "בפרק י\"ב אברם ירד למצרים בגלל הרעב - זו הירידה הראשונה למצרים. בפרק ט\"ו ה' מנבא \"גר יהיה זרעך בארץ לא להם ועבדום ועינו אותם ארבע מאות שנה\" ומבטיח שיצאו \"ברכוש גדול\". ירידת אברם למצרים נתפסת כרמז מוקדם לגלות מצרים העתידית.", "source": "cross chapter", "type": "story"}, {"q": "28. ⭐⭐ מדוע שלח אברהם את עבדו דווקא לחרן למצוא אישה ליצחק, ומה הקשר לתחילת מסעו? (לך לך, שידוך רבקה)", "a": "בפרק י\"ב אברם יצא מחרן בציווי \"לך לך מארצך וממולדתך ומבית אביך\". בפרק כ\"ד אברהם שולח את עבדו \"אל ארצי ואל מולדתי\" - בדיוק לאותם מקומות שהוא עזב. הוא מסרב שיצחק ייקח אישה מבנות כנען, אך גם מסרב שיצחק יחזור לחרן - \"רק את בני לא תשב שמה\".", "source": "cross chapter", "type": "story"}, {"q": "29. ⭐⭐⭐ עשו נושא את מחלת בת ישמעאל - כיצד זה מחבר בין שתי משפחות שנדחו מהברית? (ברית המילה, לידת יצחק וגירוש הגר, חלום יעקב)", "a": "בפרק י\"ז ה' קבע שהברית תהיה עם יצחק ולא עם ישמעאל. בפרק כ\"א ישמעאל גורש עם הגר. בפרק כ\"ז יעקב קיבל את ברכת עשו. בפרק כ\"ח עשו, שהבין שבנות כנען רעות בעיני אביו, הלך לישמעאל ולקח את בתו - שני \"הנדחים\" מהברית (עשו וישמעאל) מתחברים ביניהם.", "source": "cross chapter", "type": "story"}, {"q": "30. ⭐⭐ הבטחת \"ונברכו בך כל משפחות האדמה\" חוזרת בשני פרקים שונים - היכן ובאילו נסיבות? (לך לך, חלום יעקב)", "a": "בפרק י\"ב ה' מבטיח לאברם \"ונברכו בך כל משפחות האדמה\" בתחילת דרכו, כחלק מציווי \"לך לך\". בפרק כ\"ח ה' חוזר על אותה הבטחה ליעקב בחלום הסולם: \"ונברכו בך כל משפחות האדמה ובזרעך\". ההבטחה עוברת מאברהם לנכדו יעקב, סימן להמשכיות הברית בין הדורות.", "source": "cross chapter", "type": "story"}, {"q": "31. ✨⭐⭐ יעקב עבד שנים רבות בעד נשיו — כמה בדיוק, ועבור מי כל קבוצה? (נישואי יעקב, עסקת הצאן)", "a": "14 שנה בעד הנשים: 7 שנים ראשונות בעד רחל (קיבל לאה בתחבולה), עוד 7 שנים לאחר שבוע חתונת לאה — בעד רחל. בנוסף עבד שש שנים בעד הצאן (לפי ל\"א:מ\"א, אם כי שנות הצאן מוזכרות בפרשת הבריחה).", "source": "cross chapter", "type": "story"}, {"q": "32. ✨⭐⭐⭐ לבן רימה את יעקב בשתי הזדמנויות שונות — מהן, ומה הייתה תגובת יעקב בכל פעם? (נישואי יעקב, עסקת הצאן)", "a": "(א) לילת החתונה — לבן החליף את רחל בלאה. יעקב עימת אותו: \"מה זאת עשית לי?\" — ולבן הצדיק במנהג מקומי. יעקב הסכים לשבוע נוסף ועוד 7 שנות עבודה. (ב) עסקת הצאן — לבן הסיר מיד את הנקוד ורחקו שלושה ימים. יעקב הגיב בתחבולת המקלות ונצח. בפעם הראשונה יעקב נכנע; בשנייה — פעל בחכמה.", "source": "cross chapter", "type": "story"}, {"q": "33. ✨⭐⭐ מה הקשר בין חלום יעקב בבית אל לבין ציווי ה' לשוב? כיצד ה' מחבר בין שתי ההתגלויות? (חלום יעקב, בריחה מלבן)", "a": "בחלום בית אל (כ\"ח) יעקב נדר שאם ה' ישמרנו וישיבנו לארצו — ה' יהיה אלהיו. בפרק ל\"א מלאך ה' אומר ליעקב בחלום: \"אנכי **האל בית אל** אשר משחת שם מצבה ואשר נדרת לי שם נדר — קום צא מן הארץ הזאת\". ה' מזכיר את הנדר ומממש את הבטחתו.", "source": "cross chapter", "type": "story"}, {"q": "34. ✨⭐⭐⭐ רחל ולאה — שתי אחיות שיחסי ה' אליהן שונים. השוו את מעמדן לאורך פרקים כ\"ט-ל'. (נישואי יעקב, לידות שבטי ישראל)", "a": "לאה: אהובה פחות על יעקב אך ה' פותח רחמה — יולדת ראובן, שמעון, לוי, יהודה, ואחר כך יששכר, זבולון ודינה (6+1). רחל: אהובה יותר אך עקרה שנים — מקנאת, נותנת בלהה, בסוף \"ויזכור אלהים את רחל\" ויולדת יוסף. ה' מאזן: הפחות אהובה פורה; האהובה מצטיינת באיכות הבן (יוסף).", "source": "cross chapter", "type": "story"}, {"q": "35. ✨⭐⭐ מה הקשר בין תחינת יעקב \"הבה לי בנים\" לבין הנדר שנדר בבית אל? (חלום יעקב, לידות שבטי ישראל)", "a": "בבית אל יעקב נדר \"אם יהיה אלהים עמדי... ושבתי בשלום\". ה' אמנם שמר עליו — אך רחל עקרה. בפרק ל' כשרחל דורשת מיעקב בנים, הוא מפנה לה: \"התחת אלהים אנכי?\" — מכיר שה' הוא השולט, לא הוא. רחל בסוף מקבלת ב\"ויזכור אלהים\".", "source": "cross chapter", "type": "story"}, {"q": "36. ✨⭐⭐⭐ יעקב רימה שלושה אנשים ונרמה בעצמו. פרטו. (גניבת הברכות, נישואי יעקב, עסקת הצאן, בריחה מלבן)", "a": "יעקב רימה: (א) את יצחק אביו — גנב ברכת עשו בלבוש עורות (כ\"ז). (ב) את לבן — עסקת הצאן בתחבולת המקלות (ל'). (ג) שב ו\"גנב את לב לבן\" בבריחה בסתר (ל\"א). יעקב נרמה: (א) לבן שהחליף רחל בלאה (כ\"ט). בנוסף, רחל רימה את לבן בגנבת התרפים (ל\"א) — אך זו רמייה שיעקב לא ידע עליה.", "source": "cross chapter", "type": "story"}, {"q": "37. ✨⭐⭐ הביטוי \"לא יעשה כן במקומנו\" בפי לבן — כיצד הוא מקביל (ובניגוד) לברכת הבכורה? (גניבת הברכות, נישואי יעקב)", "a": "בפרק כ\"ז יעקב גנב ברכה מעשו הבכור — הפך את סדר הבכורות. בפרק כ\"ט לבן טוען שאי אפשר לתת \"הצעירה לפני הבכירה\" — אותו עיקרון הבכורה שיעקב עצמו הפר. לבן משתמש בכלל שיעקב עצמו עקף — אירוניה מכוונת.", "source": "cross chapter", "type": "story"}, {"q": "38. ✨⭐⭐ גם רחל וגם שרה היו עקרות ונזכרו על ידי ה' — מהי ההקבלה? (לידות שבטי ישראל, בשורת לידת יצחק)", "a": "שרה: עקרה, ה' \"פקד\" אותה — יולדת יצחק (כ\"א:א). רחל: עקרה, \"ויזכור אלהים את רחל וישמע אליה אלהים ויפתח את רחמה\" — יולדת יוסף (ל':כב). בשני המקרים העקרות אינה סוף הסיפור — ה' זוכר ופותח.", "source": "cross chapter", "type": "story"}, {"q": "39. ✨⭐⭐⭐ שלושת האבות — אברהם, יצחק, יעקב — עברו כולם לחרן/פדן ארם. מה ההבדל בין ביקורי כל אחד? (שידוך רבקה, חלום יעקב, בריחה מלבן)", "a": "אברהם: שלח עבדו לחרן (כ\"ד) ולא הלך בעצמו, ואסר שיצחק ייקח אישה מכנען ושלא ישוב לחרן. יצחק: לא הלך לחרן כלל — הרבקה הגיעה אליו. יעקב: הלך בעצמו לחרן (כ\"ח-ל\"א), עבד 20 שנה, נישא שם ובנה את משפחת ישראל, ושב לארץ בציווי ה'.", "source": "cross chapter", "type": "story"}, {"q": "1. ⭐⭐ שכם, בית-אל, חברון, באר שבע, בית לחם - איזה מקום לא קשור להבטחת ה' לאבות?", "a": "**התשובה:** בית לחם - לא מוזכר בפרקים י\"ב-כ\"ד, כ\"ז-כ\"ח בהקשר של הבטחת ה' לאבות. בשכם ה' נגלה לאברם (י\"ב:ז'), בבית-אל אברם ויעקב בנו מזבח (י\"ב:ח', כ\"ח:י\"ט), בחברון ישב אברהם (י\"ג:י\"ח), ובבאר שבע נשבע אברהם עם אבימלך (כ\"א:ל\"א).", "source": "cross chapter", "type": "story"}, {"q": "2. ⭐⭐⭐ ישמעאל, עשו, לוט, יצחק - מי מהם לא בכה כשנפרד מקרוב משפחה?", "a": "**התשובה:** לוט - לא מתואר בוכה בפרידתו מאברם (בראשית י\"ג). הגר ובנה ישמעאל בכו במדבר (כ\"א:ט\"ז), עשו בכה כשאיבד את הברכה (כ\"ז:ל\"ח), ויצחק אמנם לא מתואר בוכה בפירוש - אך עשו \"צעק צעקה גדולה ומרה\". הפריט החריג ביותר הוא **לוט** - הפרידה מאברם מתוארת כעניין עסקי בלבד.", "source": "cross chapter", "type": "story"}, {"q": "3. ⭐⭐ ברית בין הבתרים, ברית מילה, ברית עם אבימלך, עקדת יצחק - מה מבין אלה לא כולל הבטחה על זרע?", "a": "**התשובה:** ברית עם אבימלך (בראשית כ\"א:כ\"ב-ל\"ד) - זו ברית שלום על באר מים בבאר שבע, ללא כל הבטחה על זרע. בברית בין הבתרים (ט\"ו) יש הבטחת זרע כעפר, בברית מילה (י\"ז) יש הבטחת זרע ומלכים, ובעקדה (כ\"ב) יש \"הרבה ארבה את זרעך ככוכבי השמים\".", "source": "cross chapter", "type": "story"}], "text": [{"q": "טקסט: \"וַיִּבֶן שָׁם מִזְבֵּחַ לַיהוָה הַנִּרְאֶה\"\nשאלה: באיזה מקום נאמרו הדברים המתוארים כאן, ומה עשה אברם מיד אחרי?", "a": "הדברים נאמרו במקום שכם, עד אלון מורה. מיד לאחר מכן נעתק אברם ההרה מקדם לבית אל, נטה אוהלו, בנה מזבח נוסף וקרא בשם ה'.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הִנֵּה נָא יָדַעְתִּי כִּי אִשָּׁה\"\nשאלה: מי אמר את הדברים האלה, ולמי? ומה ביקש מיד אחרי?", "a": "אברם אמר לשרי אשתו. מיד אחרי הוא ביקש ממנה: \"אמרי נא אחותי את למען ייטב לי בעבורך וחיתה נפשי בגללך\" - לומר שהיא אחותו כדי שלא יהרגוהו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לֶךְ לְךָ מֵאַרְצְךָ וּמִמּוֹלַדְתְּךָ\"\nשאלה: השלם את הפסוק שבא מיד אחרי: \"וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וַאֲבָרֶכְךָ וַאֲגַדְּלָה...\" - מה ההמשך?", "a": "\"שְׁמֶךָ וֶהְיֵה בְּרָכָה\" - ה' הבטיח לאברם שיגדל את שמו ויהיה ברכה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"מַה זֹּאת עָשִׂיתָ לִּי\"\nשאלה: מי אומר את הדברים האלה ולמי, ומה גרם לו לגלות את האמת?", "a": "פרעה אומר לאברם. הוא גילה את האמת כי ה' נגע בו ובביתו בנגעים גדולים \"על דבר שרי אשת אברם\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיַּעְתֵּק מִשָּׁם הָהָרָה מִקֶּדֶם לְבֵית אֵל\"\nשאלה: הפסוק מתאר את מיקום האוהל בדיוק. לפי הכתוב, לאיזה כיוון היתה בית אל ולאיזה כיוון היתה העי?", "a": "בית אל היתה ממערב (\"מים\" = ממערב) והעי היתה ממזרח (\"מקדם\" = ממזרח). ובמקום זה אברם בנה מזבח וגם קרא בשם ה' - בניגוד לשכם שם רק בנה מזבח.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיְהִי רָעָב בָּאָרֶץ וַיֵּרֶד אַבְרָם\"\nשאלה: מה הסיבה שנתן הכתוב לירידת אברם למצרים, ומה ביקש מאשתו מיד כשהתקרבו למצרים?", "a": "הסיבה: רעב כבד בארץ. מיד כשהתקרבו למצרים ביקש משרי: \"אמרי נא אחותי את למען ייטב לי בעבורך וחיתה נפשי בגללך\" - כי חשש שיהרגוהו בגלל יופייה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּרְאוּ אֹתָהּ שָׂרֵי פַרְעֹה וַיְהַלְלוּ\"\nשאלה: מי הם שהללו את שרי בפני פרעה, ומה קיבל אברם בעקבות לקיחתה?", "a": "שרי פרעה (שרי המלוכה) הם שהללו אותה. אברם קיבל: \"צאן ובקר וחמורים ועבדים ושפחות ואתונות וגמלים\" - שבעה סוגי רכוש.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הִנֵּה אִשְׁתְּךָ קַח וָלֵךְ\"\nשאלה: מי אומר את הדברים האלה, ומה עשה מיד אחרי?", "a": "פרעה אומר לאברם. מיד אחרי: \"ויצו עליו פרעה אנשים וישלחו אותו ואת אשתו ואת כל אשר לו\" - ציווה על אנשיו ללוות את אברם ולשלחו ממצרים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיֵּלֶךְ אַבְרָם כַּאֲשֶׁר דִּבֶּר אֵלָיו\"\nשאלה: בן כמה היה אברם כשיצא מחרן, ומי הלך איתו לפי הפסוק?", "a": "אברם היה בן 75 שנה. לוט הלך איתו. בפסוק הבא מפורט שלקח גם את שרי אשתו, את כל רכושם ואת \"הנפש אשר עשו בחרן\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"עַד מְקוֹם שְׁכֶם... וְהַכְּנַעֲנִי אָז בָּאָרֶץ\"\nשאלה: מהו הפרט שמציין הכתוב על תושבי הארץ באותו זמן, ומה קרה מיד אחרי שהגיע למקום הזה?", "a": "הכתוב מציין \"והכנעני אז בארץ\" - הכנענים כבר ישבו בארץ. מיד אחרי: \"וירא ה' אל אברם ויאמר לזרעך אתן את הארץ הזאת\" - ה' נגלה אליו והבטיח את הארץ לזרעו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְאֶת הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ בְחָרָן\"\nשאלה: מהו הביטוי המסתורי \"הנפש אשר עשו בחרן\" - מה פירושו?", "a": "\"הנפש אשר עשו בחרן\" - אלה האנשים שאברם ושרי השפיעו עליהם/גיירו/קירבו בחרן. לא מדובר ברכוש אלא בנפשות אדם שהצטרפו אליהם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַאֲבָרְכָה מְבָרְכֶיךָ וּמְקַלֶּלְךָ אָאֹר\"\nשאלה: בפסוק הזה יש הבדל דקדוקי מכוון: \"מברכיך\" בלשון רבים אך \"מקללך\" בלשון יחיד. מי אומר את הדברים?", "a": "ה' אומר לאברם. \"מברכיך\" ברבים - כי המברכים רבים, אך \"ומקללך\" ביחיד - כי המקללים מועטים. ההבטחה הזו היא חלק מחמש הבטחות ה' לאברם בציווי \"לך לך\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּסַּע אַבְרָם הָלוֹךְ וְנָסוֹעַ הַנֶּגְבָּה\"\nשאלה: הביטוי \"הלוך ונסוע\" מרמז על תנועה מתמשכת. מה היה היעד הבא של אברם אחרי הנגב, ומה גרם לו לעזוב?", "a": "אחרי הנגב אברם ירד למצרים - \"וירד אברם מצרימה לגור שם\". הסיבה: \"ויהי רעב בארץ... כי כבד הרעב בארץ\" - רעב כבד בכנען.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וּלְאַבְרָם הֵיטִיב בַּעֲבוּרָהּ\"\nשאלה: \"היטיב בעבורה\" - בגלל מי הטיבו לאברם, ומי הטיב לו? ומהי הרשימה המדויקת של מה שקיבל?", "a": "פרעה הטיב לאברם בעבור שרי (שנלקחה לביתו). הרשימה: \"צאן ובקר וחמורים ועבדים ושפחות ואתונות וגמלים\" - שבעה סוגי רכוש בדיוק.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיְנַגַּע יְהוָה אֶת פַּרְעֹה נְגָעִים\"\nשאלה: הפסוק אומר שה' נגע \"את פרעה ואת ביתו\". מי נכלל ב\"ביתו\", ומדוע הם נענשו אם רק פרעה לקח את שרי?", "a": "\"ביתו\" כולל את בני ביתו ומשרתיו. הם נענשו \"על דבר שרי אשת אברם\" - כל הבית נענש בגלל מעשה פרעה. שרי פרעה (שריו) הם שהללו את שרי ותרמו ללקיחתה (י\"ב:ט\"ו).", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אִמְרִי נָא אֲחֹתִי אָתְּ\"\nשאלה: מהן שתי הסיבות שאברם נותן לבקשה הזו?", "a": "\"למען ייטב לי בעבורך\" (שייטיבו לו) ו\"וחיתה נפשי בגללך\" (שלא יהרגוהו). סיבה אחת כלכלית ואחת פיקוח נפש.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיֵּט אָהֳלֹה בֵּית אֵל מִיָּם\"\nשאלה: מהי משמעות המילה \"מים\" בפסוק זה?", "a": "\"מים\" פירושו ממערב (מי\"ם = מערב). בית אל היתה ממערב והעי ממזרח - \"בית אל מים והעי מקדם\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַתֻּקַּח הָאִשָּׁה בֵּית פַּרְעֹה\"\nשאלה: הפסוק משתמש בלשון סביל \"ותוקח\". מי לקח אותה ומי הלל אותה לפני כן?", "a": "שרי פרעה (שריו) הללו אותה אל פרעה, ואז נלקחה לבית פרעה. הלשון הסבילה מרמזת שלא הלכה מרצונה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וּמִבֵּית אָבִיךָ\"\nשאלה: הציווי \"לך לך\" כולל שלוש דרגות ניתוק. מהי הדרגה השלישית ומה הסדר המדויק מהרחוק לקרוב?", "a": "הסדר: \"מארצך\" (הארץ - הרחוק), \"וממולדתך\" (מקום הלידה - האמצעי), \"ומבית אביך\" (המשפחה הקרובה - הקרוב ביותר). שלוש דרגות מהכללי לאישי.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְאֹתָךְ יְחַיּוּ\"\nשאלה: אברם אמר למצרים \"אשתו זאת והרגו אותי ואותך יחיו\". מי ה\"אותך\" שיחיו - ומדוע דווקא המילה \"יחיו\" ולא \"ישאירו\"?", "a": "\"אותך\" מתייחס לשרי - המצרים ישאירו אותה בחיים. המילה \"יחיו\" (ולא \"ישאירו\") מדגישה את הסכנה: יהרגו את הבעל ויקחו את האישה לחיים - לנשואין.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּשָּׂא לוֹט אֶת עֵינָיו וַיַּרְא\"\nשאלה: למה מדמה הכתוב את המקום שלוט ראה, ומה מציין הכתוב מיד לאחר שלוט התיישב שם?", "a": "כיכר הירדן מתוארת \"כגן ה' כארץ מצרים בואכה צוער\". ומיד לאחר שלוט אוהל עד סדום, הכתוב מציין: \"ואנשי סדום רעים וחטאים לה' מאוד\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אַל נָא תְהִי מְרִיבָה בֵּינִי וּבֵינֶיךָ\"\nשאלה: מי אומר את הדברים האלה ולמי, ומה הציע מיד אחרי?", "a": "אברם אומר ללוט. מיד אחרי הציע: \"הלא כל הארץ לפניך, הפרד נא מעלי - אם השמאל ואימנה ואם הימין ואשמאילה\" - נתן ללוט לבחור ראשון.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אַחֲרֵי הִפָּרֶד לוֹט... שָׂא נָא עֵינֶיךָ\"\nשאלה: מתי בדיוק, לפי הפסוק, באה ההבטחה הזו - לפני או אחרי הפרידה מלוט? ולמה דימה ה' את זרע אברם?", "a": "ההבטחה באה דווקא \"אחרי היפרד לוט מעמו\" - אחרי הפרידה. ה' דימה את זרעו לעפר הארץ: \"ושמתי את זרעך כעפר הארץ\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְלֹא נָשָׂא אֹתָם הָאָרֶץ\"\nשאלה: מה קרה בעקבות המצב המתואר בפסוק, ואילו שני עמים מוזכרים כיושבים בארץ באותו זמן?", "a": "בעקבות כך פרץ ריב בין רועי מקנה אברם לרועי מקנה לוט. שני העמים: \"והכנעני והפריזי אז יושב בארץ\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיֵּשֶׁב בְּאֵלֹנֵי מַמְרֵא אֲשֶׁר בְּחֶבְרוֹן\"\nשאלה: הפסוק מתאר את מקום ישיבת אברם אחרי הפרידה. מי הם שלושת האנשים שגרו במקום הזה ותוארו כבעלי ברית אברם?", "a": "שלושת בעלי בריתו היו ממרא, אשכול וענר - האמורי. הם מוזכרים בפרק הבא (י\"ד) כשהפליט בא לספר לאברם על שבי לוט.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיַּעַל אַבְרָם מִמִּצְרַיִם הוּא וְאִשְׁתּוֹ\"\nשאלה: לאן חזר אברם ממצרים, ובאיזו מילה מתואר מצבו הכלכלי?", "a": "חזר לנגב ומשם לבית אל. מצבו הכלכלי: \"ואברם כבד מאוד במקנה בכסף ובזהב\" - הכתוב מדגיש שהיה עשיר מאוד.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּבְחַר לוֹ לוֹט אֵת כָּל כִּכַּר\"\nשאלה: מה בחר לוט לפי הפסוק, ומהו הפרט המיידי שמציין הכתוב על אנשי המקום שלוט בחר?", "a": "לוט בחר את כל ככר הירדן. מיד אחרי שנאמר שלוט \"ויאהל עד סדום\", הכתוב מציין: \"ואנשי סדום רעים וחטאים לה' מאוד\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"קוּם הִתְהַלֵּךְ בָּאָרֶץ לְאָרְכָּהּ וּלְרָחְבָּהּ\"\nשאלה: מי אומר את הדברים ולמי, ומתי בדיוק נאמרו - לפני או אחרי הפרידה מלוט?", "a": "ה' אומר לאברם. נאמרו אחרי הפרידה מלוט - \"ויהוה אמר אל אברם אחרי היפרד לוט מעמו\". ה' ציווה על אברם ללכת בארץ לאורכה ולרוחבה כי היא מובטחת לו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיֵּלֶךְ לְמַסָּעָיו מִנֶּגֶב וְעַד בֵּית אֵל\"\nשאלה: הפסוק אומר שאברם חזר למקום שהיה \"בתחילה\". מה עשה שם שלא עשה במקום הראשון שהגיע אליו בכנען (שכם)?", "a": "בבית אל \"ויקרא שם אברם בשם ה'\" (י\"ג:ד'). בשכם (אלון מורה) הוא רק בנה מזבח (י\"ב:ז') אך לא נאמר שקרא בשם ה'. בחזרה לבית אל הוא חוזר למקום שבו גם קרא בשם ה'.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אַבְרָם יָשַׁב בְּאֶרֶץ כְּנָעַן\"\nשאלה: הפסוק מתאר שלושה שלבים של התקרבות לוט לסדום. מהם, ומה מרמזת המילה \"ויאהל\"?", "a": "(1) \"ישב בערי הככר\" - באזור הכללי, (2) \"ויאהל עד סדום\" - נטה אוהלו עד סדום. \"ויאהל\" מרמז על התקרבות הדרגתית - עדיין באוהל ולא בתוך העיר. מאוחר יותר (י\"ט:א') הוא כבר \"יושב בשער סדום\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְגַם לְלוֹט... הָיָה צֹאן וּבָקָר\"\nשאלה: הכתוב מפרט מה היה ללוט. מה חסר ברשימה הזו בהשוואה לעושרו של אברם (\"כבד מאוד במקנה בכסף ובזהב\")?", "a": "ללוט היו צאן, בקר ואוהלים בלבד. חסרים כסף וזהב - שאצל אברם מוזכרים במפורש. עושר אברם כולל גם כסף וזהב ואילו לוט עשיר רק במקנה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לְךָ אֶתְּנֶנָּה וּלְזַרְעֲךָ עַד עוֹלָם\"\nשאלה: ה' אומר \"אשר אתה רואה\". אך לוט כבר לקח את כיכר הירדן. האם הארץ המובטחת כוללת גם את מה שלוט בחר?", "a": "כן - ה' אומר \"את כל הארץ אשר אתה רואה... צפונה ונגבה וקדמה וימה\" - כל הכיוונים, כולל מזרחה שלשם הלך לוט. ההבטחה כוללת את כל הארץ, גם את חלק לוט.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְהַכְּנַעֲנִי וְהַפְּרִזִּי אָז יֹשֵׁב בָּאָרֶץ\"\nשאלה: בפרק י\"ב (פסוק ו') נאמר \"והכנעני אז בארץ\". כאן נוסף עם שני. מיהו, ומדוע מוזכרים שני עמים דווקא בהקשר של הריב?", "a": "העם הנוסף הוא הפריזי. שני העמים מוזכרים בהקשר הריב כדי להדגיש שהריב בין רועי אברם ולוט היה מסוכן - הם לא לבד בארץ, ומריבה פנימית עלולה להחליש אותם מול יושבי הארץ.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"כִּי אֲנָשִׁים אַחִים אֲנָחְנוּ\"\nשאלה: מי אומר \"אנשים אחים אנחנו\", ומהו הקשר המשפחתי האמיתי ביניהם?", "a": "אברם אומר ללוט. הם לא אחים ממש - לוט הוא בן אחי אברם (בן הרן). \"אחים\" כאן במשמעות קרובי משפחה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּסַּע לוֹט מִקֶּדֶם\"\nשאלה: לאיזה כיוון נסע לוט לפי הפסוק?", "a": "\"מקדם\" פירושו מזרחה. לוט נסע לכיוון מזרח, אל ככר הירדן.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּבֶן שָׁם מִזְבֵּחַ לַיהוָה\"\nשאלה: הפסוק הזה מופיע בסוף סיפור אברם ולוט. באיזה מקום בנה אברם את המזבח הזה?", "a": "באלוני ממרא אשר בחברון - מקום מגוריו לאחר הפרידה מלוט. זהו המזבח השלישי שבנה אברם (אחרי שכם ובית אל).", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיָּבֹא הַפָּלִיט וַיַּגֵּד לְאַבְרָם הָעִבְרִי\"\nשאלה: מה מיוחד בכינוי שניתן לאברם בפסוק הזה, ומה עשה אברם מיד כששמע את הבשורה?", "a": "זהו הכינוי הראשון \"העברי\" במקרא. אברם הריק את חניכיו ילידי ביתו - שמונה עשר ושלוש מאות (318) - ורדף עד דן.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וּמַלְכִּי צֶדֶק מֶלֶךְ שָׁלֵם הוֹצִיא\"\nשאלה: לפי הפסוק, מהם שני התפקידים של האיש הזה, ומה עשה אברם לו מיד לאחר שברכו?", "a": "שני תפקידיו: מלך שלם וכוהן לאל עליון. אברם נתן לו מעשר מכל.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"שְׁתֵּים עֶשְׂרֵה שָׁנָה עָבְדוּ אֶת כְּדָרְלָעֹמֶר\"\nשאלה: לפי המספרים בפסוק - באיזו שנה בדיוק בא כדרלעומר להילחם?", "a": "12 שנה עבדו + שנה 13 מרדו = בשנה הארבע עשרה בא כדרלעומר להילחם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיֵּחָלֵק עֲלֵיהֶם לַיְלָה הוּא וַעֲבָדָיו\"\nשאלה: מה היתה טקטיקת הלחימה המתוארת בפסוק, ומי הלוחם?", "a": "אברם חילק את כוחותיו עליהם בלילה - תקיפת לילה מפתיעה. הכה אותם ורדפם עד חובה שמשמאל לדמשק.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הֲרִמֹתִי יָדִי אֶל יְהוָה\"\nשאלה: מה אמר אברם אחרי הדברים האלה כדי לתאר את סירובו המוחלט, ומה בכל זאת ביקש עבור אחרים?", "a": "אברם אמר \"אם מחוט ועד שרוך נעל\" לא ייקח דבר. אך ביקש עבור אנשיו: \"רק אשר אכלו הנערים וחלק האנשים אשר הלכו אתי ענר אשכול וממרא הם יקחו חלקם\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּקְחוּ אֶת לוֹט וְאֶת רְכֻשׁוֹ\"\nשאלה: מדוע נשבה לוט במלחמה, ומה עוד נלקח מסדום חוץ מלוט?", "a": "לוט נשבה כי ישב בסדום, שנוצחה במלחמה. חוץ מלוט נלקחו: \"את כל רכוש סדום ועמורה ואת כל אוכלם\" - רכוש ומזון.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיָּשֶׁב אֵת כָּל הָרְכֻשׁ\"\nשאלה: מי השיב את כל הרכוש, ומה בדיוק ביקש מלך סדום מהמנצח?", "a": "אברם השיב את הכל. מלך סדום ביקש: \"תן לי הנפש והרכוש קח לך\" - ביקש לקבל את האנשים בלבד ושאברם ייקח את הרכוש.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְעֵמֶק הַשִּׂדִּים בֶּאֱרֹת בֶּאֱרֹת חֵמָר\"\nשאלה: מה היו בארות החמר, ומה קרה למלכי סדום ועמורה לפי הפסוק?", "a": "בארות חמר הן בורות של זפת/ביטומן בעמק השדים (הוא ים המלח). מלכי סדום ועמורה נפלו לתוכן בזמן הבריחה. \"והנשארים הרה נסו\" - השאר ברחו להר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיָּרֶק אֶת חֲנִיכָיו\"\nשאלה: הפסוק מכנה את לוט \"אחיו\" של אברם. אך מהו קשר המשפחה האמיתי בין אברם ללוט?", "a": "לוט אינו אחיו של אברם אלא בן אחיו - \"לוט בן אחי אברם\" (י\"ד:י\"ב). הכתוב משתמש במילה \"אחיו\" במשמעות רחבה (קרוב משפחה), לא אח ממש.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"בָּרוּךְ אַבְרָם לְאֵל עֶלְיוֹן\"\nשאלה: מי מברך את מי בפסוק הזה? ולאחר מכן מברך גם את ה' - מה הברכה השנייה?", "a": "מלכי צדק מברך את אברם. הברכה השנייה: \"וברוך אל עליון אשר מיגן צריך בידך\" - ברכת ה' שמסר את אויבי אברם בידו. ואז אברם נתן לו מעשר מכל.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְלֹא תֹאמַר אֲנִי הֶעֱשַׁרְתִּי אֶת אַבְרָם\"\nשאלה: מי חשש שיאמר \"אני העשרתי את אברם\", ומדוע סירוב זה מפתיע לאור מה שאברם קיבל מפרעה?", "a": "אברם חשש שמלך סדום יאמר כך. זה מפתיע כי בסיפור מצרים אברם קיבל רכוש רב מפרעה בלי להתנגד, ואילו כאן הוא מסרב בנחרצות - \"מחוט ועד שרוך נעל\" - התפתחות באופיו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אֶל עֵין מִשְׁפָּט הִוא קָדֵשׁ\"\nשאלה: הפסוק מזהה \"עין משפט\" עם מקום אחר. מהו המקום, ומי הוכו שם?", "a": "עין משפט הוא קדש. שם הוכו \"את כל שדה העמלקי וגם את האמורי היושב בחצצון תמר\" - הכוח של כדרלעומר הכה עמים רבים בדרכו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"בְּאֵלֹנֵי מַמְרֵא הָאֱמֹרִי\"\nשאלה: ממרא, אשכול וענר מתוארים כ\"בעלי ברית אברם\". מה מוצאם (משבט מה), ומה הדרישה שאברם העלה לגביהם בסוף הסיפור?", "a": "הם אמורים - \"ממרא האמורי\". בסוף הסיפור אברם ביקש שהם יקבלו את חלקם מהשלל: \"חלק האנשים אשר הלכו אתי ענר אשכול וממרא הם יקחו חלקם\" - למרות שלעצמו סירב לקחת.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְהוּא שֹׁכֵן בְּאֵלֹנֵי מַמְרֵא\"\nשאלה: הפסוק מתאר את מקום מגורי אברם כשהפליט הגיע. מהו הכינוי המיוחד שמקבל אברם באותו פסוק?", "a": "\"אברם העברי\" - זוהי הפעם הראשונה שהכינוי \"עברי\" מופיע במקרא.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הוֹצִיא לֶחֶם וָיָיִן\"\nשאלה: מי הוציא לחם ויין, ומה שמו ושני תפקידיו?", "a": "מלכי צדק. תפקידיו: מלך שלם וכוהן לאל עליון.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אַרְבָּעָה מְלָכִים אֶת הַחֲמִשָּׁה\"\nשאלה: מי ניצח - הארבעה או החמישה, ומי ברח להר?", "a": "ארבעת המלכים ניצחו. מלכי סדום ועמורה נפלו בבארות חמר, \"והנשארים הרה נסו\" - השאר ברחו להר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"רְפָאִים בְּעַשְׁתְּרֹת קַרְנַיִם\"\nשאלה: ארבעה עמים הוכו בדרכו של כדרלעומר לפני המלחמה בעמק השדים. פרט את שמות ארבעת העמים ואת המקומות שבהם הוכו.", "a": "(1) רפאים בעשתרות קרנים, (2) זוזים בהם, (3) אימים בשווה קריתיים, (4) חורי בהררם שעיר עד איל פארן.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"שִׁנְאָב מֶלֶךְ אַדְמָה\"\nשאלה: מלך בלע (צוער) הוא היחיד מחמשת המלכים ששמו לא מוזכר. מהם שמות ארבעת המלכים שכן נזכרו ושמות עריהם?", "a": "ברע מלך סדום, ברשע מלך עמורה, שנאב מלך אדמה, שמאבר מלך צבויים. מלך בלע (היא צוער) - שמו לא נזכר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"עֵמֶק שָׁוֵה הוּא\"\nשאלה: הכתוב מזהה \"עמק שווה\" עם שם נוסף. מהו, ומה קרה שם?", "a": "\"עמק שווה הוא עמק המלך\" - שם יצא מלך סדום לקראת אברם אחרי שובו מהכות את כדרלעומר, ושם הופיע גם מלכי צדק.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"קֹנֵה שָׁמַיִם וָאָרֶץ\"\nשאלה: הביטוי \"קונה שמים וארץ\" מופיע פעמיים בסיפור - פעם בפי מלכי צדק ופעם בפי אברם. מה ההבדל בין שתי ההופעות?", "a": "מלכי צדק אומר \"ברוך אברם לאל עליון קונה שמים וארץ\" (ברכה). אברם אומר \"הרימותי ידי אל ה' אל עליון קונה שמים וארץ\" (שבועה). אברם משתמש באותו תואר אך מוסיף את שם ה' המפורש.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְאָנֹכִי הוֹלֵךְ עֲרִירִי וּבֶן מֶשֶׁק\"\nשאלה: מי אומר את הדברים האלה ולמי, ובתגובה לאיזו הבטחה?", "a": "אברם אומר לה'. זו תגובתו להבטחת ה' \"אל תירא אברם אנכי מגן לך שכרך הרבה מאוד\" - אברם מתלונן שאין לו ילדים ויורשו הוא אליעזר הדמשקי.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הַבֶּט נָא הַשָּׁמַיְמָה וּסְפֹר הַכּוֹכָבִים\"\nשאלה: מה היתה תגובת אברם להבטחה המתוארת כאן, וכיצד התייחס הכתוב לתגובתו?", "a": "\"והאמין בה' ויחשבה לו צדקה\" - אברם האמין בהבטחת ה', וה' חשב את אמונתו לצדקה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"קְחָה לִי עֶגְלָה מְשֻׁלֶּשֶׁת וְעֵז\"\nשאלה: לפי הכתוב, מה ההבדל בין מה שנעשה לבהמות לבין מה שנעשה לעופות?", "a": "אברם בתר את הבהמות (עגלה, עז, איל) בתווך ונתן כל בתר מול רעהו, אך \"את הציפור לא בתר\" - התור והגוזל לא נבתרו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְתַרְדֵּמָה נָפְלָה עַל אַבְרָם\"\nשאלה: מה ניבא ה' לאברם מיד לאחר המצב המתואר בפסוק, ובאיזה דור יחזרו צאצאיו?", "a": "ה' ניבא: \"ידע תדע כי גר יהיה זרעך בארץ לא להם ועבדום ועינו אותם ארבע מאות שנה\". צאצאיו ישובו בדור הרביעי, \"כי לא שלם עוון האמורי עד הנה\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"כָּרַת יְהוָה אֶת אַבְרָם בְּרִית\"\nשאלה: מהם שני הנהרות שמוזכרים בפסוק כגבולות הארץ, ומה עבר בין הגזרים לפני כריתת הברית?", "a": "שני הנהרות: נהר מצרים ונהר פרת. תנור עשן ולפיד אש עברו בין הגזרים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לֹא יִירָשְׁךָ זֶה כִּי אִם\"\nשאלה: את מי שלל ה' כיורש בפסוק הזה, ומי הציע אברם כיורש לפני כן?", "a": "ה' שלל את אליעזר הדמשקי (\"בן משק ביתי\") כיורש. אברם הציע אותו כיורש כשאמר: \"אדני ה' מה תיתן לי ואנכי הולך ערירי ובן משק ביתי הוא דמשק אליעזר\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיֵּרֶד הָעַיִט עַל הַפְּגָרִים\"\nשאלה: מה עשה אברם כשהעיט ירד על הפגרים, ומה היו הפגרים האלה?", "a": "אברם הנשיב (גירש) את העיט מעל הפגרים. הפגרים היו חלקי הבהמות שאברם ביתר לקראת כריתת הברית - העגלה, העז והאיל שבותרו בתווך.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"תָּבוֹא אֶל אֲבֹתֶיךָ בְּשָׁלוֹם\"\nשאלה: למי נאמרת ההבטחה האישית הזו, ומה נאמר על הגוי שיעבדו את זרעו?", "a": "ההבטחה נאמרת לאברם - שימות בשלום ובשיבה טובה. על הגוי שיעבדו זרעו נאמר: \"וגם את הגוי אשר יעבודו דן אנכי, ואחרי כן יצאו ברכוש גדול\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אֲשֶׁר הוֹצֵאתִיךָ מֵאוּר כַּשְׂדִּים לְרִשְׁתָּהּ\"\nשאלה: ה' מזכיר שהוציא את אברם מאור כשדים. מה שאל אברם מיד אחרי ההבטחה הזו, ומה גרם לתשובה מעשית?", "a": "אברם שאל: \"אדני ה' במה אדע כי אירשנה\" - ביקש אות/הוכחה. בתגובה ה' ציווה אותו להביא את בעלי החיים לברית בין הבתרים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְדוֹר רְבִיעִי יָשׁוּבוּ הֵנָּה\"\nשאלה: מה הקשר בין \"עוון האמורי\" לבין ירושת הארץ - מדוע צריכים לחכות?", "a": "ה' מסביר שזרע אברם לא יירש את הארץ מיד כי עוון האמורי (יושב הארץ) עדיין לא הגיע לשיאו. רק כשעוון יושבי הארץ ישלם - בדור הרביעי - תהיה הצדקה לגרשם ולרשת את הארץ.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְהִנֵּה תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ\"\nשאלה: מהי \"עלטה\" ומה עבר בין הגזרים? ומי מהשניים - אברם או ה' - עבר בין הגזרים?", "a": "\"עלטה\" היא חשכה כבדה. תנור עשן ולפיד אש עברו בין הגזרים. רק ה' (המיוצג על ידי התנור והלפיד) עבר בין הגזרים - אברם לא עבר, כי הוא היה בתרדמה. זו ברית חד-צדדית.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"דְבַר יְהוָה אֶל אַבְרָם בַּמַּחֲזֶה\"\nשאלה: מהי \"מחזה\" וכיצד זה שונה מהתגלויות קודמות של ה' לאברם?", "a": "\"מחזה\" הוא חזון/מראה נבואי. זוהי הפעם הראשונה שדבר ה' בא לאברם ב\"מחזה\" (ולא בהתגלות רגילה או ציווי ישיר). המילה \"אחר הדברים האלה\" קושרת את ההתגלות למלחמת המלכים שהייתה לפני כן.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הֵן לִי לֹא נָתַתָּה זָרַע\"\nשאלה: אברם אומר \"בן ביתי יורש אותי\". מיהו \"בן ביתי\", ומה ההבדל בין \"בן משק ביתי\" בפסוק הקודם לבין \"בן ביתי\" כאן?", "a": "שניהם מתייחסים לאליעזר הדמשקי. \"בן משק ביתי\" (פסוק ב') פירושו מנהל/ממונה על ביתו, ו\"בן ביתי\" (פסוק ג') פירושו מי שגדל בביתו. אברם חוזר על התלונה בניסוח שונה כדי להדגיש את כאבו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְאֶת הַצִּפֹּר לֹא בָתָר\"\nשאלה: אילו שלוש בהמות נבתרו ואילו שני עופות לא?", "a": "נבתרו: עגלה משולשת, עז משולשת, איל משולש. לא נבתרו: תור וגוזל.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אֵימָה חֲשֵׁכָה גְדֹלָה נֹפֶלֶת\"\nשאלה: מתי נפלה ה\"אימה חשכה\" על אברם, ומה ניבא ה' מיד אחריה?", "a": "נפלה כשהשמש עמדה לבוא (שקיעה) עם התרדמה. ה' ניבא: \"גר יהיה זרעך בארץ לא להם ועבדום ועינו אותם ארבע מאות שנה\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְאַחֲרֵי כֵן יֵצְאוּ בִּרְכֻשׁ גָּדוֹל\"\nשאלה: מי ייצאו \"ברכוש גדול\" ומאיזה גוי?", "a": "זרע אברם ייצאו ברכוש גדול מהגוי שיעבדו אותם (מצרים). ה' הבטיח: \"וגם את הגוי אשר יעבודו דן אנכי\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אֶת הַקֵּינִי וְאֶת הַקְּנִזִּי\"\nשאלה: בברית בין הבתרים מובטחת ארץ עשרה עמים. מנה את כל העשרה בסדר המדויק של הכתוב.", "a": "(1) קיני, (2) קניזי, (3) קדמוני, (4) חתי, (5) פריזי, (6) רפאים, (7) אמורי, (8) כנעני, (9) גרגשי, (10) יבוסי.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אֲשֶׁר יֵצֵא מִמֵּעֶיךָ\"\nשאלה: ה' אמר \"לא יירשך זה כי אם אשר יצא ממעיך הוא יירשך\". הביטוי \"ממעיך\" מופיע כאן לראשונה. מה הוציא ה' את אברם לראות מיד אחרי?", "a": "\"ויוצא אותו החוצה ויאמר הבט נא השמימה וספור הכוכבים\" - הוציאו מהאוהל החוצה והראה לו את הכוכבים כמשל לריבוי זרעו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"תִּקָּבֵר בְּשֵׂיבָה טוֹבָה\"\nשאלה: ההבטחה \"תבוא אל אבותיך בשלום תיקבר בשיבה טובה\" כוללת שלושה מרכיבים. מהם?", "a": "(1) \"תבוא אל אבותיך\" - מוות, (2) \"בשלום\" - בלא ייסורים, (3) \"תיקבר בשיבה טובה\" - בגיל מופלג. שלוש הבטחות על אופן מותו של אברם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"עֲצָרַנִי יְהוָה מִלֶּדֶת בֹּא נָא\"\nשאלה: מי אומרת את הדברים האלה ולמי, ומה קרה לאחר שהמאזין שמע בקולה?", "a": "שרי אומרת לאברם. אברם שמע בקולה, בא אל הגר, היא הרתה - ואז \"ותקל גבירתה בעיניה\" (זלזלה בשרי).", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הָגָר שִׁפְחַת שָׂרַי אֵי מִזֶּה\"\nשאלה: מי שואל את השאלה הזו ומי עונה, והיכן מתרחש המפגש?", "a": "מלאך ה' שואל את הגר. המפגש מתרחש על עין המים במדבר, על העין בדרך שור. המלאך ציווה אותה: \"שובי אל גבירתך והתעני תחת ידיה\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְהוּא יִהְיֶה פֶּרֶא אָדָם\"\nשאלה: הפסוק מתאר את אופיו של מי, ומה משמעות שמו?", "a": "הפסוק מתאר את אופיו של ישמעאל. שמו פירושו \"ישמע אל\" - \"כי שמע ה' אל עניך\", כפי שאמר המלאך להגר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אַתָּה אֵל רֳאִי\"\nשאלה: מי קראה את השם הזה לה', ומה שם הבאר שנקראה על שם המאורע?", "a": "הגר קראה לה' \"אל ראי\". הבאר נקראה \"באר לחי ראי\", והיא נמצאת בין קדש ובין ברד.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּקְרָא אַבְרָם שֶׁם בְּנוֹ... יִשְׁמָעֵאל\"\nשאלה: לפי הפסוק, מי קרא בפועל את שם הילד? ולמי ציווה המלאך לקרוא את השם?", "a": "בפועל \"ויקרא אברם שם בנו\" - אברם הוא שקרא את השם. אך המלאך ציווה דווקא את הגר: \"וקראת שמו ישמעאל\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"חֲמָסִי עָלֶיךָ אָנֹכִי נָתַתִּי שִׁפְחָתִי\"\nשאלה: מי אומרת את הדברים ולמי, ומה ענה הנמען?", "a": "שרי אומרת לאברם. אברם ענה: \"הנה שפחתך בידך, עשי לה הטוב בעיניך\" - מסר את הגר לידי שרי. ואז \"ותענה שרי ותברח מפניה\" - שרי עינתה את הגר עד שברחה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הַרְבָּה אַרְבֶּה אֶת זַרְעֵךְ\"\nשאלה: למי נאמרת ההבטחה הזו, ומה ציווה המלאך לפני שהבטיח את ההבטחה?", "a": "ההבטחה נאמרת להגר. לפני כן המלאך ציווה אותה: \"שובי אל גבירתך והתעני תחת ידיה\" - לחזור לשרי ולסבול תחת ידיה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם\"\nשאלה: לפי הפסוק, אחרי כמה שנות ישיבה בכנען ניתנה הגר לאברם, ובן כמה היה אברם כשנולד ישמעאל?", "a": "שרי נתנה את הגר לאברם מקץ עשר שנים לישיבתם בכנען. אברם היה בן שמונים שנה ושש שנים (86) בלידת ישמעאל.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הָגָר שִׁפְחַת שָׂרַי אֵי מִזֶּה\"\nשאלה: המלאך קורא להגר \"שפחת שרי\" למרות שהיא כבר אשת אברם. מה ענתה הגר - האם ענתה על שתי השאלות?", "a": "הגר ענתה רק \"מפני שרי גבירתי אנכי בורחת\" - ענתה מאין באה אך לא ענתה לאן היא הולכת. הכינוי \"שפחת שרי\" מרמז שמעמדה נותר שפחה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"עַל עֵין הַמַּיִם בַּמִּדְבָּר\"\nשאלה: \"דרך שור\" מובילה לכיוון מצרים. מה זה מלמד על כוונת הגר, ומהו הקשר למוצאה?", "a": "הגר היתה שפחה מצרית. דרך שור מובילה למצרים - מה שמרמז שהגר ברחה בחזרה למולדתה מצרים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הֲגַם הֲלֹם רָאִיתִי אַחֲרֵי רֹאִי\"\nשאלה: מי אומרת את המילים המסתוריות האלה, ומה שם הבאר שנקראה על שמן?", "a": "הגר אומרת זאת לאחר שראתה את מלאך ה'. הבאר נקראה \"באר לחי ראי\" - בין קדש ובין ברד. המילים מביעות תדהמה שראתה מלאך ונותרה בחיים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טק
