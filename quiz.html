אותם כשהתגלתה התרמית?", "a": "הגורל נגזר על הגבעונים. לא יכלו להרוג אותם כי נשיאי העדה נשבעו להם בשם ה', ולא יכלו להפר את השבועה. לכן הפשרה היתה שישמשו כחוטבי עצים ושואבי מים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"מֵאֶרֶץ רְחוֹקָה מְאֹד בָּאוּ עֲבָדֶיךָ\"\nשאלה: מי אומרים את הדברים האלה ולמי, והאם הטענה \"מארץ רחוקה\" נכונה?", "a": "הגבעונים אומרים ליהושע. הטענה שקרית - הם לא באו מארץ רחוקה אלא היו שכנים קרובים, חיוים מגבעון ומסביבתה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כִּי הֻגֵּד הֻגַּד לַעֲבָדֶיךָ\"\nשאלה: מי אומרים את הדברים האלה ולמי, ומה הגורל הסופי שנגזר עליהם?", "a": "הגבעונים אומרים ליהושע כשנשאל מדוע רימו. הם שמעו שה' ציווה את משה להשמיד את כל יושבי הארץ ופחדו. גורלם הסופי: נעשו חוטבי עצים ושואבי מים לעדה ולמזבח ה'.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"זֶה לַחְמֵנוּ חָם הִצְטַיַּדְנוּ אֹתוֹ\"\nשאלה: מי אומרים את הדברים האלה ולמי, ומהי המילה \"נקודים\" - מה היא מתארת?", "a": "הגבעונים אומרים ליהושע ולאנשי ישראל. \"נקודים\" פירושו מלא נקודות של עובש או יובש קיצוני - הם הראו לחם מעופש כדי להוכיח שהגיעו ממרחק רב ושהלחם שלהם ישן.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיַּעֲשׂוּ גַם הֵמָּה בְּעָרְמָה\"\nשאלה: מי הם \"גם המה\" שפעלו בערמה, ואילו חמישה פריטים בלויים הם השתמשו בתחפושת?", "a": "הגבעונים. חמשת הפריטים: (1) שקים בלים לחמוריהם, (2) נאדות יין בלים ומבוקעים ומצוררים, (3) נעלות בלות ומטולאות, (4) שלמות (בגדים) בלות, (5) לחם יבש שהיה נקודים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּלֹּנוּ כָל הָעֵדָה עַל הַנְּשִׂיאִים\"\nשאלה: מדוע העדה הלינה על הנשיאים, ומדוע הנשיאים לא יכלו לתקן את המצב?", "a": "העדה הלינה כי הנשיאים כרתו ברית עם הגבעונים שהתבררו כשכנים קרובים. הנשיאים לא יכלו לתקן כי נשבעו להם בשם ה' אלוהי ישראל, ואין להפר שבועה בשם ה'.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אוּלַי בְּקִרְבִּי אַתָּה יוֹשֵׁב\"\nשאלה: הכינוי \"אתה\" בפסוק זה מדבר לגבעונים. מי הם הגבעונים מבחינת זהותם הלאומית (לאיזה עם הם שייכים), ומהן ארבע הערים שלהם?", "a": "הגבעונים הם חיוים. ארבע הערים שלהם: גבעון, כפירה, בארות וקריית יערים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"חֹטְבֵי עֵצִים וְשֹׁאֲבֵי מַיִם לָעֵדָה\"\nשאלה: הפסוק מציין שתי מטרות לשירות הגבעונים: \"לעדה\" ו\"למזבח ה'\". מה ההבדל - מהו הגורל הכפול שנקבע להם?", "a": "הגבעונים צריכים לשרת הן את צורכי העדה (הקהילה) והן את צורכי העבודה הדתית (המזבח). יהושע ייעד אותם להיות חוטבי עצים ושואבי מים גם לצרכי היום יום של הקהילה וגם לעבודת הקורבנות.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"נָשְׁבַּעְנוּ לָהֶם בַּה'\"\nשאלה: מי נשבעו ולמי, ומדוע לא יכלו להפר את השבועה למרות שהתגלתה תרמית?", "a": "נשיאי העדה נשבעו לגבעונים בשם ה' אלוהי ישראל. לא יכלו להפר כי שבועה בשם ה' אינה ניתנת לביטול, גם אם הושגה במרמה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"נְעָלוֹת בָּלוֹת וּמְטֻלָּאוֹת\"\nשאלה: מי לבשו \"נעלות בלות ומטולאות\" ומדוע, ומהם עוד שני פריטי לבוש בלויים שנשאו?", "a": "הגבעונים לבשו נעלות בלות כדי להיראות כאילו באו ממרחק רב. גם שלמות (בגדים) בלות לבשו, ושקים בלים לחמוריהם נשאו.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"גִּבְעוֹן כְּפִירָה בְאֵרוֹת וְקִרְיַת יְעָרִים\"\nשאלה: מה ארבעת השמות האלה, ואחרי כמה ימים מכריתת הברית נודע שהם שכנים קרובים?", "a": "אלו ארבע ערי הגבעונים (החיוים). אחרי שלושה ימים מכריתת הברית גילו ישראל שהם שכנים קרובים ולא מארץ רחוקה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּקְחוּ הָאֲנָשִׁים מִצֵּידָם\"\nשאלה: מי הם \"האנשים\" שלקחו מצידם, ומה הטעות הקריטית שמתוארת מיד אחרי פעולה זו באותו פסוק?", "a": "אנשי ישראל לקחו מצידם של הגבעונים (בדקו את הלחם היבש והציוד הבלוי). הטעות: \"ואת פי ה' לא שאלו\" - סמכו על הראיות הפיזיות ולא התייעצו עם ה' לפני כריתת הברית.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"מְבֻקָּעִים וּמְצֹרָרִים\"\nשאלה: מה מתואר כ\"מבוקעים ומצוררים\", ומי נשאו אותם ולמה?", "a": "נאדות היין של הגבעונים היו \"בלים ומבוקעים ומצוררים\" - נאדות ישנים שנסדקו ותוקנו (צוררו = קשרו/תפרו). הגבעונים נשאו אותם כדי להוכיח שעשו מסע ארוך מארץ רחוקה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיַּעַשׂ לָהֶם שָׁלוֹם\"\nשאלה: מי עשה שלום עם מי, ומה ההבדל בין \"שלום\" לבין \"ברית\" שמוזכרים שניהם באותו הקשר?", "a": "יהושע עשה שלום עם הגבעונים וכרת להם ברית. \"ויעש להם יהושע שלום ויכרות להם ברית לחיותם\" - השלום הוא הסכם אי-לחימה, והברית היא שבועה בשם ה' שנשבעו נשיאי העדה, שלא ניתנת לביטול.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ\"\nשאלה: מי שולחים את קריאת העזרה הזו ולמי, ומדוע הם בסכנה?", "a": "אנשי גבעון שולחים ליהושע אל המחנה בגלגל. הם בסכנה כי חמישה מלכים אמוריים בהנהגת אדוני צדק מלך ירושלים צרו עליהם - בגלל שגבעון השלימה עם ישראל.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"שֶׁמֶשׁ בְּגִבְעוֹן דּוֹם וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן\"\nשאלה: מי אמר את הדברים האלה, ואיזה נס כבר התרחש באותו קרב לפני שנאמרו?", "a": "יהושע אמר לעיני ישראל. לפני כן ה' השליך אבנים גדולות מן השמים (אבני ברד) על האויבים בדרך מעלה בית חורון - \"ורבים אשר מתו באבני הברד מאשר הרגו בני ישראל בחרב\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְלֹא הָיָה כַּיּוֹם הַהוּא לְפָנָיו וְאַחֲרָיו\"\nשאלה: מה הייחוד של היום המתואר כאן, והיכן התחבאו חמשת המלכים אחרי תבוסתם?", "a": "הייחוד הוא שלא היה יום כזה לפניו ואחריו שבו ה' שמע בקול איש - יהושע ציווה על השמש והירח לעמוד וה' שמע. חמשת המלכים בורחים ומתחבאים במערה במקדה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אַל תִּירָא מֵהֶם כִּי בְיָדְךָ נְתַתִּים\"\nשאלה: מי אומר את הדברים האלה ולמי, ומה עשה מקבל הדברים כדי להגיע למקום הקרב?", "a": "ה' אומר ליהושע. יהושע עלה מן הגלגל כל הלילה - מסע לילי של הפתעה כדי להגיע לגבעון.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כִּי ה' אֱלֹהֵי יִשְׂרָאֵל נִלְחָם לְיִשְׂרָאֵל\"\nשאלה: מי היה מנהיג הקואליציה של \"המלכים האלה\" ומדוע ארגן אותה?", "a": "אדוני צדק מלך ירושלים היה מנהיג הקואליציה. הוא ארגן אותה כי שמע שגבעון השלימה עם ישראל, ופחד מאוד כי גבעון הייתה עיר גדולה \"כאחת ערי הממלכה\" וכל אנשיה גיבורים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיַּשְׁלֵךְ עֲלֵיהֶם אֲבָנִים גְּדֹלוֹת מִן הַשָּׁמַיִם\"\nשאלה: מי השליך את האבנים, ומה המיוחד בהשוואה שהפסוק עושה בין מתי אבני הברד לבין מתי החרב?", "a": "ה' השליך את אבני הברד. הפסוק מדגיש שרבים יותר מתו מאבני הברד מאשר מחרב ישראל - נס שמימי שהכריע יותר מהקרב עצמו.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"גֹּלוּ אֲבָנִים גְּדֹלוֹת אֶל פִּי הַמְּעָרָה\"\nשאלה: מי ציווה לגלול אבנים על המערה, מה היה בתוכה, ומה נעשה בהם לאחר הניצחון?", "a": "יהושע ציווה. בתוך המערה במקדה התחבאו חמשת המלכים האמוריים. אחרי הניצחון הוציאו אותם, שרי ישראל שמו רגליהם על צוואריהם, ויהושע תלה אותם על חמישה עצים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"מִן הַגִּלְגָּל כָּל הַלַּיְלָה\"\nשאלה: לאן עלה יהושע מהגלגל, ומדוע בחר לנסוע כל הלילה?", "a": "עלה לגבעון כדי להציל את הגבעונים שחמשת המלכים צרו עליהם. נסע כל הלילה כדי להפתיע את האויב ולהגיע מהר ככל האפשר לעזרת בעלי בריתו.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי הַמְּלָכִים\"\nשאלה: מי אמר את הדברים האלה ולמי, ובאיזו מערה היו המלכים כלואים לפני כן?", "a": "יהושע אמר לקציני אנשי המלחמה (שרי ישראל). המלכים היו כלואים במערה במקדה, שעל פיה גללו אבנים גדולות.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כִּי ה' אֱלֹהֵי יִשְׂרָאֵל נִלְחָם לְיִשְׂרָאֵל\"\nשאלה: פסוק זה מופיע כסיכום מסע כיבושים. אילו ערים כבש יהושע במסע הדרום שבא אחרי הקרב בגבעון?", "a": "מקדה, לבנה, לכיש, עגלון, חברון ודביר - שש ערים שנכבשו ברצף במסע הדרום.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"בַּמְּעָרָה בְּמַקֵּדָה\"\nשאלה: מי התחבאו במערה במקדה, ומה ציווה יהושע לעשות עם פתח המערה עד סיום הקרב?", "a": "חמשת המלכים האמוריים התחבאו שם. יהושע ציווה לגלול אבנים גדולות על פי המערה ולהפקיד עליה אנשים עד שיסיימו את הרדיפה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אֲדֹנִי צֶדֶק מֶלֶךְ יְרוּשָׁלִַם\"\nשאלה: מי הוא \"אדוני צדק\" ומה הפעולה שביצע שגרמה למלחמה?", "a": "אדוני צדק הוא מלך ירושלים. הוא שלח לארבעה מלכים אמוריים (הוהם, פראם, יפיע, דביר) וארגן קואליציה נגד גבעון כי השלימה עם ישראל.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"בְּדֶרֶךְ מַעֲלֵה בֵית חוֹרוֹן\"\nשאלה: מה קרה בדרך מעלה בית חורון, ומי הפיל את הדבר ההוא?", "a": "ה' השליך אבנים גדולות מן השמים (אבני ברד) על האויבים הבורחים. רבים יותר מתו מאבני הברד מאשר מחרב ישראל.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"הוֹהָם פִּרְאָם יָפִיעַ\"\nשאלה: מי הם הוהם, פראם ויפיע - מהי עירו של כל אחד מהם, ומי המלך הרביעי שהצטרף אליהם?", "a": "הוהם - מלך חברון, פראם - מלך ירמות, יפיע - מלך לכיש. המלך הרביעי: דביר מלך עגלון. כולם הצטרפו לאדוני צדק מלך ירושלים בקואליציה נגד גבעון.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כְּאַחַת עָרֵי הַמַּמְלָכָה\"\nשאלה: איזו עיר מתוארת כ\"אחת ערי הממלכה\", ומדוע פרט זה חשוב להבנת המניע של אדוני צדק?", "a": "גבעון מתוארת כ\"אחת ערי הממלכה\" - עיר גדולה מן העי, וכל אנשיה גיבורים. פרט זה מסביר את הפחד של אדוני צדק: אם עיר כה חזקה השלימה עם ישראל, זה מראה שאין סיכוי להתנגד - לכן הוא מרגיש שחייב לארגן קואליציה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"עַד עֲזֵקָה\"\nשאלה: \"עד עזקה\" מתאר את היכן הוכו האויבים. מהו מסלול הרדיפה המלא שמתואר בפסוק - מאיפה ועד איפה?", "a": "ה' הממם בגבעון, יהושע הכם \"מכה גדולה בגבעון\", רדפם \"דרך מעלה בית חורון\", והכם \"עד עזקה ועד מקדה\". מסלול: גבעון, מעלה בית חורון, עזקה, מקדה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"לִשְׁמֹעַ ה' בְּקוֹל אִישׁ\"\nשאלה: איזה אירוע מתואר כייחודי כך ש\"לא היה כיום ההוא לפניו ואחריו\", ומה בדיוק הייחוד - מה לא קרה מעולם?", "a": "עצירת השמש והירח. הייחוד: \"לשמוע ה' בקול איש\" - לא היה יום שבו ה' שמע לבקשת אדם לשנות את סדרי בראשית (מהלך גרמי שמים). \"כי ה' נלחם לישראל\" מופיע כסיום הפסוק.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"עַם רָב כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם\"\nשאלה: מי ארגן את הקואליציה המתוארת כאן, ומה ה' ציווה את יהושע לעשות עם הסוסים והרכב לאחר הניצחון?", "a": "יבין מלך חצור ארגן את הקואליציה הצפונית. ה' ציווה: \"את סוסיהם תעקר ואת מרכבותיהם תשרוף באש\" - לעקר את הסוסים ולשרוף את המרכבות, ולא לשמור אותם לעצמם.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּלְכֹּד אֶת חָצוֹר וְאֶת מַלְכָּהּ הִכָּה\"\nשאלה: לפי הפסוק, מדוע חצור מקבלת יחס מיוחד, ומה עשו לה שלא עשו לשאר ערי הצפון?", "a": "חצור מקבלת יחס מיוחד כי היא היתה \"ראש כל הממלכות האלה\". חצור הייתה העיר היחידה מערי התלים שנשרפה באש - כל שאר הערים העומדות על תליהן לא נשרפו.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אַל תִּירָא מִפְּנֵיהֶם כִּי מָחָר\"\nשאלה: מי אומר את הדברים האלה ולמי, והיכן התרחש הקרב שעליו מדובר?", "a": "ה' אומר ליהושע. הקרב התרחש על מי מרום, שם התרכזו כל צבאות הצפון. יהושע בא עליהם בהפתעה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כִּי מֵאֵת ה' הָיְתָה לְחַזֵּק אֶת לִבָּם\"\nשאלה: מה הפסוק מסביר כאן - מדוע העמים לא בחרו להשלים עם ישראל, ואיזו עיר הייתה החריגה היחידה?", "a": "הפסוק מסביר שה' חיזק את לבם (כלומר הקשה את לבם) כדי שילחמו ולא ישלימו - למען יחרימו אותם. העיר היחידה שהשלימה עם ישראל מרצון הייתה גבעון (החיוי יושבי גבעון).", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּקַּח יְהוֹשֻׁעַ אֶת כָּל הָאָרֶץ\"\nשאלה: מה עשה יהושע לפני שהארץ שקטה ממלחמה - את מי כרת מאזור ההר, ומאילו מקומות ספציפיים?", "a": "יהושע כרת את הענקים מההר, מחברון, מדביר ומענב - סילק את שארית הענקים מאזור ההר ומערי הדרום.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אֶת סוּסֵיהֶם תְּעַקֵּר וְאֶת מַרְכְּבוֹתֵיהֶם תִּשְׂרֹף בָּאֵשׁ\"\nשאלה: מי מצווה את הציווי הזה ולמי, ומדוע דווקא לעקר ולשרוף במקום לשמור לשימוש עצמי?", "a": "ה' מצווה את יהושע. המטרה היא שישראל לא יסתמכו על כוח צבאי של סוסים ורכב אלא על ה'. יהושע אכן ביצע: עיקר את הסוסים ושרף את המרכבות.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"לֹא הָיָה עִיר אֲשֶׁר הִשְׁלִימָה\"\nשאלה: מי הם \"החיוי יושבי גבעון\" שמוזכרים כאן כחריגים, ובאיזה אופן השלימו עם ישראל - האם ברצון חופשי וביושר?", "a": "הגבעונים. הם לא השלימו ביושר אלא בערמה - התחזו לבאים מארץ רחוקה עם לחם יבש ונעלות בלות, ורימו את יהושע לכרות עמם ברית.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיָּבֹא עֲלֵיהֶם יְהוֹשֻׁעַ פִּתְאֹם\"\nשאלה: נגד מי הגיע יהושע בהפתעה, והיכן היו אותם אויבים חונים כשהגיע?", "a": "נגד הקואליציה הצפונית בראשות יבין מלך חצור. הם היו חונים יחדיו אל מי מרום.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּכְרֹת יְהוֹשֻׁעַ אֶת הָעֲנָקִים מִן הָהָר\"\nשאלה: מי הם ה\"ענקים\" שנזכרים כאן, ומה הפסוק שמיד אחרי כן מסכם על מצב הארץ?", "a": "הענקים הם עם של גיבורים ענקיים שישבו באזור ההר. הפסוק הבא מסכם: \"והארץ שקטה ממלחמה\" - כריתת הענקים סימנה את סיום תקופת הכיבוש.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּלְכֹּד אֶת חָצוֹר\"\nשאלה: מה עשה יהושע לחצור שלא עשה לשאר הערים שכבש בצפון, ומה הסיבה שניתנה ליחס המיוחד הזה?", "a": "יהושע שרף את חצור באש - היא הייתה העיר היחידה מערי התלים שנשרפה. הסיבה: \"כי חצור לפנים היא ראש כל הממלכות האלה\" - היא הייתה הבירה והעיר החשובה ביותר.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אֶת סוּסֵיהֶם תְּעַקֵּר\"\nשאלה: מי מצווה \"את סוסיהם תעקר\" ולמי, ומה עוד צריך לעשות מלבד עיקור הסוסים?", "a": "ה' מצווה את יהושע. מלבד עיקור הסוסים, צריך לשרוף את המרכבות באש - \"ואת מרכבותיהם תשרוף באש\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"עַל מֵי מֵרוֹם\"\nשאלה: מה התרחש על מי מרום, ומי היה מנהיג צבא האויב שהתרכז שם?", "a": "הקרב הגדול של כיבוש הצפון. יבין מלך חצור אסף את כל מלכי הצפון יחדיו על מי מרום, ויהושע בא עליהם בהפתעה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְהָאָרֶץ שָׁקְטָה מִמִּלְחָמָה\"\nשאלה: מה הפעולה האחרונה שיהושע ביצע לפני שנאמר \"והארץ שקטה ממלחמה\"?", "a": "יהושע כרת את הענקים מן ההר, מחברון, מדביר ומענב - סילוק שארית הענקים היה הפעולה האחרונה לפני שהארץ שקטה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"יוֹבָב מֶלֶךְ מָדוֹן\"\nשאלה: מי שלח אל \"יובב מלך מדון\", ומי הם שני המלכים הנוספים שמוזכרים בשמות עריהם באותו פסוק?", "a": "יבין מלך חצור שלח אל יובב מלך מדון \"ואל מלך שמרון ואל מלך אכשף\" - שלושה מלכים נקובים בשם עירם, ומלכים רבים נוספים מאזורי הצפון השונים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"צִידֹן רַבָּה\"\nשאלה: \"צידון רבה\" היא אחד מכיווני הרדיפה. מהם שלושת כיווני הרדיפה שמוזכרים אחרי הקרב על מי מרום?", "a": "שלושת כיווני הרדיפה: (1) עד צידון רבה, (2) עד משרפות מים, (3) עד בקעת מצפה מזרחה. ישראל רדפו לשלושה כיוונים שונים כדי שלא יימלט איש.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"יָמִים רַבִּים\"\nשאלה: מה הדבר שיהושע עשה \"ימים רבים\" לפי סיכום הכיבושים, ומה הקשר לכך שרק עיר אחת השלימה?", "a": "\"ימים רבים עשה יהושע את כל המלכים האלה מלחמה\" - המלחמות נמשכו זמן רב. הקשר: \"לא היה עיר אשר השלימה אל בני ישראל בלתי החיוי יושבי גבעון את הכל לקחו במלחמה\" - כי ה' חיזק את לבם להילחם, אף עיר לא כרתה שלום.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְסוּס וָרֶכֶב רַב מְאֹד\"\nשאלה: הפסוק מתאר \"סוס ורכב רב מאוד\" בצבא האויב. מה ה' ציווה לעשות עם הסוסים והרכב אחרי הניצחון, ומדוע דווקא לא לשמור אותם?", "a": "ה' ציווה \"את סוסיהם תעקר ואת מרכבותיהם תשרוף באש\" - לעקר (לחתוך גידי הרגליים) את הסוסים ולשרוף את המרכבות. המטרה: שישראל יבטחו בה' ולא בכוח צבאי טכנולוגי, ולא יסתמכו על סוסים ורכב כמו הגויים.", "source": "text_questions/yehoshua.md", "type": "text"}]}, "shoftim": {"name": "שופטים", "story": [{"q": "1. מי היה השופט הראשון בספר שופטים?", "a": "עתניאל בן קנז", "source": "01 otniel ben knaz", "type": "story"}, {"q": "2. מה עשו בני ישראל שגרם לה' להענישם?", "a": "עשו את הרע בעיני ה', שכחו את אלוהיהם ועבדו את הבעלים ואת האשרות", "source": "01 otniel ben knaz", "type": "story"}, {"q": "3. מי היה האויב ששעבד את ישראל בתקופת עתניאל?", "a": "כושן רשעתיים מלך ארם נהריים", "source": "01 otniel ben knaz", "type": "story"}, {"q": "4. כמה שנים עבדו בני ישראל את כושן רשעתיים?", "a": "שמונה שנים", "source": "01 otniel ben knaz", "type": "story"}, {"q": "5. מה היחס המשפחתי בין עתניאל לכלב?", "a": "עתניאל היה אחי כלב הקטן ממנו", "source": "01 otniel ben knaz", "type": "story"}, {"q": "6. מה קרה לאחר שבני ישראל זעקו אל ה'?", "a": "ה' הקים להם מושיע - את עתניאל בן קנז", "source": "01 otniel ben knaz", "type": "story"}, {"q": "7. מהו \"רוח ה'\" בהקשר של עתניאל?", "a": "כוח אלוהי שחל על השופט ומעניק לו יכולת מיוחדת. רוח ה' היתה על עתניאל כשיצא למלחמה", "source": "01 otniel ben knaz", "type": "story"}, {"q": "8. כמה שנים שקטה הארץ לאחר ניצחון עתניאל?", "a": "ארבעים שנה", "source": "01 otniel ben knaz", "type": "story"}, {"q": "9. מהו המבנה המחזורי של ספר שופטים כפי שמוצג בסיפור עתניאל?", "a": "חטא, עונש, זעקה, הושעה ושקט", "source": "01 otniel ben knaz", "type": "story"}, {"q": "10. מהיכן היה כושן רשעתיים?", "a": "מארם נהריים - אזור בין שני הנהרות (פרת וחידקל) במסופוטמיה", "source": "01 otniel ben knaz", "type": "story"}, {"q": "11. מאיזה פסוק: \"וַיִּמְכְּרֵם בְּיַד כּוּשַׁן רִשְׁעָתַיִם מֶלֶךְ אֲרַם נַהֲרָיִם\"?", "a": "פסוק ח'", "source": "01 otniel ben knaz", "type": "story"}, {"q": "12. מהי המשמעות של הביטוי \"וַיִּמְכְּרֵם\"?", "a": "ביטוי להסגרת ישראל ביד האויב כעונש", "source": "01 otniel ben knaz", "type": "story"}, {"q": "13. מהי הנוסחה הקבועה הפותחת כל מחזור בספר שופטים?", "a": "\"וַיַּעֲשׂוּ בְנֵי יִשְׂרָאֵל אֶת הָרַע בְּעֵינֵי ה'\"", "source": "01 otniel ben knaz", "type": "story"}, {"q": "14. מה הם \"הבעלים והאשרות\"?", "a": "עבודה זרה כנענית - הבעלים הם אלי הפריון, והאשרות הם עצי או עמודי פולחן", "source": "01 otniel ben knaz", "type": "story"}, {"q": "15. מאיזה פסוק: \"וַתִּשְׁקֹט הָאָרֶץ אַרְבָּעִים שָׁנָה וַיָּמָת עָתְנִיאֵל בֶּן קְנַז\"?", "a": "פסוק י\"א", "source": "01 otniel ben knaz", "type": "story"}, {"q": "16. באיזה פרק ופסוקים מופיע סיפור עתניאל בן קנז?", "a": "פרק ג' פסוקים ז'-י\"א", "source": "01 otniel ben knaz", "type": "story"}, {"q": "17. מהו התואר שניתן לעתניאל בפסוק ט'?", "a": "מושיע", "source": "01 otniel ben knaz", "type": "story"}, {"q": "18. מהי המשמעות של המספר 40 בתנ\"ך?", "a": "מספר המסמל תקופה שלמה (40 שנה במדבר, 40 יום על הר סיני וכו')", "source": "01 otniel ben knaz", "type": "story"}, {"q": "19. ⭐⭐ באיזה אזור גיאוגרפי נמצאת ארם נהריים?", "a": "בין שני הנהרות פרת וחידקל (דג'לה) במסופוטמיה, באזור עיראק של ימינו", "source": "01 otniel ben knaz", "type": "story"}, {"q": "20. ⭐⭐⭐ מה שם האלה הכנענית שעבדו בני ישראל מלבד הבעלים בתקופת עתניאל?", "a": "האשרות - עצי או עמודי פולחן כנעניים. הפסוק אומר \"וַיַּעַבְדוּ אֶת הַבְּעָלִים וְאֶת הָאֲשֵׁרוֹת\" (שופטים ג':ז')", "source": "01 otniel ben knaz", "type": "story"}, {"q": "21. ⭐⭐⭐ מהי המשמעות של הביטוי \"וַתָּעָז יָדוֹ עַל כּוּשַׁן רִשְׁעָתָיִם\" (פסוק י')?", "a": "ידו של עתניאל גברה/התחזקה על כושן רשעתיים - כלומר ניצח אותו במלחמה", "source": "01 otniel ben knaz", "type": "story"}, {"q": "1. ⭐ \"וַיִּזְעֲקוּ בְנֵי יִשְׂרָאֵל אֶל ה'\"", "a": "**מי אמר:** בני ישראל\n**למי:** ה'\n**הקשר:** זעקת בני ישראל לה' בתקופת שעבוד כושן רשעתיים מלך ארם נהריים, ובעקבותיה הקים ה' את עתניאל בן קנז כמושיע (שופטים ג':ט')", "source": "01 otniel ben knaz", "type": "story"}, {"q": "2. ⭐⭐⭐ \"וַיַּעֲשׂוּ בְנֵי יִשְׂרָאֵל אֶת הָרַע בְּעֵינֵי ה' וַיִּשְׁכְּחוּ אֶת ה' אֱלֹהֵיהֶם וַיַּעַבְדוּ אֶת הַבְּעָלִים וְאֶת הָאֲשֵׁרוֹת\" - מאיזה פסוק ומה ייחודי בו?", "a": "**מי אמר:** הכתוב (המספר)\n**למי:** הקורא\n**הקשר:** פסוק ז' - הפסוק הפותח את סיפור עתניאל. הייחוד: זהו הסיפור היחיד בשופטים שבו נאמר במפורש שישראל \"שכחו\" את ה' ועבדו גם בעלים וגם אשרות (שני סוגי עבודה זרה). בסיפורי שופטים אחרים נאמר רק \"ויעשו הרע\" או \"ויוסיפו לעשות הרע\".", "source": "01 otniel ben knaz", "type": "story"}, {"q": "1. ⭐ שופט ראשון, בן קנז, אחיו הצעיר של כלב, הושיע מיד כושן רשעתיים", "a": "**הדמות:** עתניאל בן קנז\n**ספר:** שופטים\n**הקשר:** עתניאל בן קנז אחי כלב הקטן היה השופט הראשון, הושיע את ישראל מיד כושן רשעתיים מלך ארם נהריים, ושפט את ישראל ארבעים שנה (פרק ג')", "source": "01 otniel ben knaz", "type": "story"}, {"q": "2. ⭐⭐⭐ מלך מארם נהריים, שעבד את ישראל פחות מעשור, הובס ע\"י שופט שרוח ה' היתה עליו", "a": "**הדמות:** כושן רשעתיים\n**ספר:** שופטים\n**הקשר:** כושן רשעתיים מלך ארם נהריים שעבד את ישראל 8 שנים (פחות מעשור), והובס ע\"י עתניאל בן קנז שרוח ה' היתה עליו (שופטים ג':ח'-י')", "source": "01 otniel ben knaz", "type": "story"}, {"q": "3. ⭐⭐⭐ השופט הראשון, נקרא \"מושיע\", אחיו הקטן של מרגל שבט יהודה, כבש עיר בשם קרית ספר", "a": "**הדמות:** עתניאל בן קנז\n**ספר:** שופטים\n**הקשר:** עתניאל היה אחי כלב הקטן (כלב בן יפונה הקניזי היה מרגל שבט יהודה). נקרא \"מושיע\" (ג':ט'). כבש את קרית ספר (שופטים א', יהושע ט\"ו) וקיבל את עכסה בת כלב לאישה.", "source": "01 otniel ben knaz", "type": "story"}, {"q": "1. ⭐⭐⭐ עתניאל בן קנז מתואר בפסוקים כ\"אחי כלב הגדול ממנו\". נכון או לא נכון?", "a": "**לא נכון.** הפסוק אומר \"אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ\" (שופטים ג':ט') - עתניאל היה הקטן (הצעיר), לא הגדול.", "source": "01 otniel ben knaz", "type": "story"}, {"q": "2. ⭐⭐⭐ בסיפור עתניאל, הכתוב מפרט את שיטת הלחימה ואת כלי הנשק שבהם ניצח את כושן רשעתיים. נכון או לא נכון?", "a": "**לא נכון.** סיפור עתניאל הוא הקצר והתמציתי ביותר מבין סיפורי השופטים. הכתוב אומר רק \"וַיֵּצֵא לַמִּלְחָמָה וַיִּתֵּן ה' בְּיָדוֹ\" ללא שום פירוט על אופן הלחימה או כלי הנשק - בניגוד לאהוד (חרב), שמגר (מלמד בקר), גדעון (שופרות וכדים) וכו'.", "source": "01 otniel ben knaz", "type": "story"}, {"q": "3. ⭐⭐⭐ בסיפור עתניאל נאמר \"וַיֹּסִפוּ בְנֵי יִשְׂרָאֵל לַעֲשׂוֹת הָרַע\". נכון או לא נכון?", "a": "**לא נכון.** בסיפור עתניאל נאמר \"וַיַּעֲשׂוּ בְנֵי יִשְׂרָאֵל אֶת הָרַע\" (שופטים ג':ז') - עשו, לא \"ויוסיפו\". הביטוי \"וַיֹּסִפוּ\" (הוסיפו/שבו) מופיע בסיפור אהוד (ג':י\"ב) ובסיפור דבורה (ד':א'), כי הם לא הפעם הראשונה. עתניאל הוא הסיפור הראשון, ולכן נאמר רק \"ויעשו\".", "source": "01 otniel ben knaz", "type": "story"}, {"q": "1. ⭐⭐ \"וַיִּמְכְּרֵם בְּיַד כּוּשַׁן רִשְׁעָתַיִם מֶלֶךְ _____\"", "a": "**מילה חסרה:** אֲרַם נַהֲרָיִם\n**מי אמר:** הכתוב (המספר)\n**הקשר:** תיאור העונש שה' הטיל על ישראל בעקבות חטאם (שופטים ג':ח')", "source": "01 otniel ben knaz", "type": "story"}, {"q": "2. ⭐⭐ \"וַיָּקֶם יְהוָה _____ לִבְנֵי יִשְׂרָאֵל... אֵת עָתְנִיאֵל בֶּן קְנַז\"", "a": "**מילה חסרה:** מוֹשִׁיעַ\n**מי אמר:** הכתוב (המספר)\n**הקשר:** ה' מקים את עתניאל בן קנז כמושיע לאחר זעקת בני ישראל (שופטים ג':ט')", "source": "01 otniel ben knaz", "type": "story"}, {"q": "3. ⭐⭐⭐ \"וַתְּהִי עָלָיו _____ וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל\"", "a": "**מילה חסרה:** רוּחַ יְהוָה\n**מי אמר:** הכתוב (המספר)\n**הקשר:** רוח ה' חלה על עתניאל לפני שיצא למלחמה נגד כושן רשעתיים (שופטים ג':י')", "source": "01 otniel ben knaz", "type": "story"}, {"q": "4. ⭐⭐ \"וַיַּעֲשׂוּ בְנֵי יִשְׂרָאֵל אֶת הָרַע בְּעֵינֵי ה' וַיִּשְׁכְּחוּ אֶת ה' אֱלֹהֵיהֶם וַיַּעַבְדוּ אֶת הַבְּעָלִים וְאֶת _____\"", "a": "**מילה חסרה:** הָאֲשֵׁרוֹת\n**מי אמר:** הכתוב (המספר)\n**הקשר:** תיאור חטא בני ישראל - עבדו בעלים וגם אשרות. זהו הסיפור היחיד בשופטים שמוזכרים שני סוגי עבודה זרה (שופטים ג':ז')", "source": "01 otniel ben knaz", "type": "story"}, {"q": "1. ⭐⭐⭐ עתניאל בן קנז, אהוד בן גרא, שמגר בן ענת, דבורה, גדעון - מי לא מופיע בשופטים ג':ז'-ט'?", "a": "**התשובה:** דבורה וגדעון - שופטים ג':ז'-ט' מתאר רק את סיפור עתניאל בן קנז. אהוד (ג':ט\"ו ואילך) ושמגר (ג':ל\"א) מופיעים בהמשך פרק ג' אך אחרי פסוק ט'. בפסוקים ז'-ט' עצמם מופיע רק עתניאל. דבורה מופיעה בפרק ד' וגדעון בפרקים ו'-ח'.", "source": "01 otniel ben knaz", "type": "story"}, {"q": "2. ⭐⭐ כושן רשעתיים, עגלון מלך מואב, יבין מלך חצור, סיסרא - מי מהם מופיע בשופטים ג':ז'-ט'?", "a": "**התשובה:** רק כושן רשעתיים מלך ארם נהריים מופיע בפסוקים אלה. הוא שעבד את ישראל שמונה שנים עד שעתניאל הושיע אותם (שופטים ג':ח'-ט'). עגלון (ג':י\"ב), יבין (ד':ב') וסיסרא (ד':ב') שייכים לפרקים אחרים. כל האחרים **לא שייכים** לקטע הנלמד.", "source": "01 otniel ben knaz", "type": "story"}, {"q": "1. מאיזה שבט היה אהוד בן גרא?", "a": "שבט בנימין (\"בן הימיני\")", "source": "02 ehud ben gera", "type": "story"}, {"q": "2. מה היה הייחוד הפיזי של אהוד?", "a": "היה איטר יד ימינו - כלומר שמאלי", "source": "02 ehud ben gera", "type": "story"}, {"q": "3. מי היה האויב ששעבד את ישראל בתקופת אהוד?", "a": "עגלון מלך מואב", "source": "02 ehud ben gera", "type": "story"}, {"q": "4. כמה שנים שעבד עגלון את בני ישראל?", "a": "שמונה עשרה (18) שנה", "source": "02 ehud ben gera", "type": "story"}, {"q": "5. מי היו בעלי הברית של עגלון מלך מואב?", "a": "בני עמון ועמלק", "source": "02 ehud ben gera", "type": "story"}, {"q": "6. מהי \"עיר התמרים\" שנכבשה על ידי עגלון?", "a": "יריחו", "source": "02 ehud ben gera", "type": "story"}, {"q": "7. מה היה אורך החרב שהכין אהוד ומה מיוחד בה?", "a": "אורכה גומד (כחצי אמה, כ-25 ס\"מ), והיתה בעלת שני פיות (דו-חדית)", "source": "02 ehud ben gera", "type": "story"}, {"q": "8. על איזו ירך חגר אהוד את החרב ומדוע?", "a": "על ירך ימינו, כי היה שמאלי ושלף ביד שמאל - דבר שהפתיע את עגלון", "source": "02 ehud ben gera", "type": "story"}, {"q": "9. כיצד מתואר עגלון בפסוקים?", "a": "\"איש בריא מאוד\" (שמן מאוד)", "source": "02 ehud ben gera", "type": "story"}, {"q": "10. מה אמר אהוד לעגלון כדי להישאר איתו לבד?", "a": "אמר לו \"דבר סתר לי אליך\", ולאחר שכולם יצאו אמר \"דבר אלהים לי אליך\"", "source": "02 ehud ben gera", "type": "story"}, {"q": "11. מה עשה עגלון כששמע \"דבר אלהים לי אליך\"?", "a": "קם מעל הכיסא", "source": "02 ehud ben gera", "type": "story"}, {"q": "12. מה חשבו עבדי עגלון כשמצאו את דלתות העלייה נעולות?", "a": "חשבו שהמלך \"מסיך את רגליו\" (עושה צרכיו)", "source": "02 ehud ben gera", "type": "story"}, {"q": "13. לאן נמלט אהוד לאחר הרצח?", "a": "נמלט דרך הפסילים לשעירה", "source": "02 ehud ben gera", "type": "story"}, {"q": "14. היכן תקע אהוד בשופר כדי לגייס את בני ישראל?", "a": "בהר אפרים", "source": "02 ehud ben gera", "type": "story"}, {"q": "15. מה לכדו בני ישראל כדי למנוע מהמואבים לברוח?", "a": "את מעברות הירדן למואב", "source": "02 ehud ben gera", "type": "story"}, {"q": "16. כמה מואבים נהרגו במלחמה?", "a": "כעשרת אלפים איש - כולם שמנים ואנשי חיל", "source": "02 ehud ben gera", "type": "story"}, {"q": "17. כמה שנים שקטה הארץ לאחר ניצחון אהוד?", "a": "שמונים (80) שנה", "source": "02 ehud ben gera", "type": "story"}, {"q": "18. מהי \"עליית המקרה\"?", "a": "חדר עליון מקורר, מקום פרטי של עגלון. שם נרצח עגלון על ידי אהוד", "source": "02 ehud ben gera", "type": "story"}, {"q": "19. מהי האירוניה בכינוי \"בן הימיני\" של אהוד?", "a": "\"בן ימין\" שהוא דווקא שמאלי (איטר יד ימינו)", "source": "02 ehud ben gera", "type": "story"}, {"q": "20. מאיזה פסוק: \"וַיַּעַשׂ לוֹ אֵהוּד חֶרֶב וְלָהּ שְׁנֵי פֵיוֹת גֹּמֶד אָרְכָּהּ\"?", "a": "פסוק ט\"ז", "source": "02 ehud ben gera", "type": "story"}, {"q": "21. ⭐⭐ מה שם העיר שנקראת גם \"עיר התמרים\"?", "a": "יריחו - נכבשה על ידי עגלון ובעלי בריתו (שופטים ג':י\"ג)", "source": "02 ehud ben gera", "type": "story"}, {"q": "22. ⭐⭐⭐ מהם שני העמים שהצטרפו לעגלון מלך מואב נגד ישראל?", "a": "בני עמון ועמלק (שופטים ג':י\"ג)", "source": "02 ehud ben gera", "type": "story"}, {"q": "23. ⭐⭐⭐ מהי המשמעות של \"גומד\" - אורך החרב של אהוד?", "a": "יחידת מידה קצרה, כחצי אמה, כ-25 ס\"מ (שופטים ג':ט\"ז)", "source": "02 ehud ben gera", "type": "story"}, {"q": "24. ⭐⭐ לאן נמלט אהוד לאחר רצח עגלון, ומאיפה תקע בשופר?", "a": "נמלט לשעירה, ותקע בשופר בהר אפרים (שופטים ג':כ\"ו-כ\"ז)", "source": "02 ehud ben gera", "type": "story"}, {"q": "1. ⭐⭐⭐ \"דְּבַר סֵתֶר לִי אֵלֶיךָ הַמֶּלֶךְ\"", "a": "**מי אמר:** אהוד בן גרא\n**למי:** עגלון מלך מואב\n**הקשר:** אהוד חזר מן הפסילים אשר את הגלגל ואמר למלך שיש לו דבר סתר, כדי להישאר עמו לבד לפני שהרגו (שופטים ג':י\"ט)", "source": "02 ehud ben gera", "type": "story"}, {"q": "2. ⭐⭐⭐ \"דְּבַר אֱלֹהִים לִי אֵלֶיךָ\"", "a": "**מי אמר:** אהוד בן גרא\n**למי:** עגלון מלך מואב\n**הקשר:** לאחר שכל העומדים יצאו, אהוד אמר לעגלון \"דבר אלהים לי אליך\" - וכשעגלון קם מכיסאו מתוך כבוד, אהוד דקר אותו בחרב (שופטים ג':כ')", "source": "02 ehud ben gera", "type": "story"}, {"q": "3. ⭐⭐⭐ \"רִדְפוּ אַחֲרַי כִּי נָתַן ה' אֶת אֹיְבֵיכֶם אֶת מוֹאָב בְּיֶדְכֶם\"", "a": "**מי אמר:** אהוד בן גרא\n**למי:** בני ישראל\n**הקשר:** אהוד תוקע בשופר בהר אפרים ומגייס את בני ישראל לרדוף אחרי מואב ולתפוס את מעברות הירדן (שופטים ג':כ\"ח)", "source": "02 ehud ben gera", "type": "story"}, {"q": "1. ⭐ איטר יד ימינו, הכין חרב קצרה, הרג מלך שמן מאוד, נעל את הדלת ונמלט", "a": "**הדמות:** אהוד בן גרא\n**ספר:** שופטים\n**הקשר:** אהוד בן גרא הבנימיני היה איטר יד ימינו, הכין חרב בת גומד, הרג את עגלון מלך מואב שהיה \"בריא מאוד\", נעל את דלתות העלייה ונמלט (פרק ג')", "source": "02 ehud ben gera", "type": "story"}, {"q": "2. ⭐⭐ מלך מואב, שעבד את ישראל שמונה עשרה שנה, היה \"בריא מאוד\", נהרג בעורמה", "a": "**הדמות:** עגלון מלך מואב\n**ספר:** שופטים\n**הקשר:** עגלון מלך מואב שעבד את בני ישראל 18 שנה, היה שמן מאוד, ונהרג על ידי אהוד בן גרא בחרב שהוסתרה על ירכו הימנית (פרק ג')", "source": "02 ehud ben gera", "type": "story"}, {"q": "3. ⭐⭐⭐ אסף אליו שני עמים כבעלי ברית, ירש את \"עיר התמרים\", קם מכיסאו כששמע \"דבר אלהים\"", "a": "**הדמות:** עגלון מלך מואב\n**ספר:** שופטים\n**הקשר:** עגלון אסף את בני עמון ועמלק, ירש את עיר התמרים (יריחו), וקם מכיסאו כבוד כששמע מאהוד \"דבר אלהים לי אליך\" - ואז נדקר (שופטים ג':י\"ג, כ'-כ\"א)", "source": "02 ehud ben gera", "type": "story"}, {"q": "1. ⭐⭐⭐ אהוד חגר את החרב על ירך שמאלו, כי היה שמאלי. נכון או לא נכון?", "a": "**לא נכון.** אהוד חגר את החרב על ירך **ימינו** דווקא: \"וַיַּחְגֹּר אוֹתָהּ מִתַּחַת לְמַדָּיו עַל יֶרֶךְ יְמִינוֹ\" (שופטים ג':ט\"ז). כאיטר יד ימין (שמאלי), הוא שלף ביד שמאל מירך ימין - ההיפך מלוחם רגיל שחוגר על ירך שמאל ושולף ביד ימין.", "source": "02 ehud ben gera", "type": "story"}, {"q": "2. ⭐⭐⭐ עבדי עגלון חשבו שהמלך ישן כשמצאו את דלתות העלייה נעולות. נכון או לא נכון?", "a": "**לא נכון.** העבדים חשבו שהמלך \"מֵסִיךְ הוּא אֶת רַגְלָיו\" - כלומר עושה את צרכיו, לא ישן (שופטים ג':כ\"ד).", "source": "02 ehud ben gera", "type": "story"}, {"q": "3. ⭐⭐⭐ המואבים שנהרגו מתוארים כ\"כל שמן וכל איש חיל\". נכון או לא נכון?", "a": "**נכון.** \"וַיַּכּוּ אֶת מוֹאָב בָּעֵת הַהִיא כַּעֲשֶׂרֶת אֲלָפִים אִישׁ כָּל שָׁמֵן וְכָל אִישׁ חָיִל וְלֹא נִמְלַט אִישׁ\" (שופטים ג':כ\"ט). המילה \"שמן\" רומזת למלכם עגלון שהיה \"בריא מאוד\".", "source": "02 ehud ben gera", "type": "story"}, {"q": "4. ⭐⭐⭐ אהוד אמר לעגלון \"דבר אלהים לי אליך\" כדי שהעומדים יצאו מהחדר. נכון או לא נכון?", "a": "**לא נכון.** הסדר שונה. **ראשית** אהוד אמר \"דְּבַר סֵתֶר לִי אֵלֶיךָ הַמֶּלֶךְ\" (ג':י\"ט) - וזה מה שגרם לכולם לצאת. רק **אחרי** שנשארו לבד, אהוד אמר \"דְּבַר אֱלֹהִים לִי אֵלֶיךָ\" (ג':כ') - וזה מה שגרם לעגלון לקום מהכיסא, ואז אהוד דקר אותו.", "source": "02 ehud ben gera", "type": "story"}, {"q": "5. ⭐⭐⭐ הארץ שקטה 40 שנה לאחר ניצחון אהוד. נכון או לא נכון?", "a": "**לא נכון.** הארץ שקטה **שמונים שנה** (80) לאחר ניצחון אהוד (שופטים ג':ל'). זהו כפול מ-40 שנה של עתניאל. רבים מבלבלים בין המספרים.", "source": "02 ehud ben gera", "type": "story"}, {"q": "1. ⭐⭐ \"אֵהוּד בֶּן גֵּרָא בֶּן הַיְמִינִי אִישׁ אִטֵּר יַד _____\"", "a": "**מילה חסרה:** יְמִינוֹ\n**מי אמר:** הכתוב (המספר)\n**הקשר:** תיאור אהוד בן גרא - איטר יד ימינו, כלומר שמאלי (שופטים ג':ט\"ו)", "source": "02 ehud ben gera", "type": "story"}, {"q": "2. ⭐⭐⭐ \"וַיִּסְגֹּר הַחֵלֶב בְּעַד הַלַּהַב כִּי לֹא שָׁלַף הַחֶרֶב מִבִּטְנוֹ וַיֵּצֵא _____\"", "a": "**מילה חסרה:** הַפַּרְשְׁדֹנָה\n**מי אמר:** הכתוב (המספר)\n**הקשר:** תיאור דקירת עגלון - החלב סגר על הלהב והחרב נבלעה בגופו (שופטים ג':כ\"ב)", "source": "02 ehud ben gera", "type": "story"}, {"q": "3. ⭐⭐ \"רִדְפוּ אַחֲרַי כִּי נָתַן ה' אֶת _____ אֶת מוֹאָב בְּיֶדְכֶם\"", "a": "**מילה חסרה:** אֹיְבֵיכֶם\n**מי אמר:** אהוד בן גרא\n**הקשר:** אהוד תוקע בשופר בהר אפרים ומגייס את בני ישראל לרדוף אחרי מואב (שופטים ג':כ\"ח)", "source": "02 ehud ben gera", "type": "story"}, {"q": "4. ⭐⭐⭐ \"וַיַּעַשׂ לוֹ אֵהוּד חֶרֶב וְלָהּ שְׁנֵי פֵיוֹת _____ אָרְכָּהּ\"", "a": "**מילה חסרה:** גֹּמֶד\n**מי אמר:** הכתוב (המספר)\n**הקשר:** אהוד מכין חרב דו-חדית באורך גומד (כחצי אמה) (שופטים ג':ט\"ז)", "source": "02 ehud ben gera", "type": "story"}, {"q": "5. ⭐⭐⭐ \"אַךְ _____ הוּא אֶת רַגְלָיו בַּחֲדַר הַמְּקֵרָה\"", "a": "**מילה חסרה:** מֵסִיךְ\n**מי אמר:** עבדי עגלון\n**הקשר:** עבדי עגלון חושבים שהמלך עושה צרכיו כשמוצאים את דלתות העלייה נעולות (שופטים ג':כ\"ד)", "source": "02 ehud ben gera", "type": "story"}, {"q": "1. אחרי מי פעל שמגר בן ענת?", "a": "אחרי אהוד בן גרא", "source": "03 shamgar ben anat", "type": "story"}, {"q": "2. כמה פלישתים הכה שמגר?", "a": "שש מאות (600) איש", "source": "03 shamgar ben anat", "type": "story"}, {"q": "3. באיזה כלי השתמש שמגר להכות את הפלישתים?", "a": "מלמד הבקר (דרבן - כלי חקלאי ארוך ומחודד המשמש להנחיית שוורים בחריש)", "source": "03 shamgar ben anat", "type": "story"}, {"q": "4. כמה פסוקים מוקדשים לסיפור שמגר בן ענת?", "a": "פסוק אחד בלבד (פרק ג' פסוק ל\"א)", "source": "03 shamgar ben anat", "type": "story"}, {"q": "5. מי היו האויבים שנלחם בהם שמגר?", "a": "הפלישתים", "source": "03 shamgar ben anat", "type": "story"}, {"q": "6. מהי המשמעות של \"וַיּוֹשַׁע גַּם הוּא את ישראל\"?", "a": "\"גם הוא\" - כמו אהוד שקדם לו, גם שמגר הושיע את ישראל", "source": "03 shamgar ben anat", "type": "story"}, {"q": "7. מה מיוחד בשם \"ענת\" (אביו של שמגר)?", "a": "\"ענת\" הוא שם אלה כנענית של מלחמה ופריון, מה שהעלה דיון בקרב הפרשנים לגבי מוצאו של שמגר", "source": "03 shamgar ben anat", "type": "story"}, {"q": "8. היכן מוזכר שמגר בן ענת מחוץ לפסוק ל\"א בפרק ג'?", "a": "בשירת דבורה (שופטים ה', ו') כציון זמן: \"בימי שמגר בן ענת, בימי יעל חדלו אורחות\"", "source": "03 shamgar ben anat", "type": "story"}, {"q": "9. מדוע העובדה ששמגר השתמש בכלי חקלאי מדגישה את גבורתו?", "a": "כי הצליח להכות 600 פלישתים בכלי פשוט ולא בנשק מלחמה, מה שמדגיש את גבורתו הנדירה ואת הישועה האלוהית", "source": "03 shamgar ben anat", "type": "story"}, {"q": "10. מה היה ככל הנראה עיסוקו של שמגר?", "a": "ייתכן שהיה חקלאי, בהתחשב בכלי שהשתמש בו (מלמד הבקר)", "source": "03 shamgar ben anat", "type": "story"}, {"q": "11. מדוע שמגר נחשב לאחד השופטים המסתוריים ביותר?", "a": "כי כל מה שידוע עליו מסופר בפסוק אחד בלבד, ושמו ושם אביו אינם עבריים מובהקים", "source": "03 shamgar ben anat", "type": "story"}, {"q": "12. מהי המשמעות של \"חדלו אורחות\" בשירת דבורה בהקשר לימי שמגר?", "a": "ציון זמן של תקופה קשה שבה הדרכים לא היו בטוחות", "source": "03 shamgar ben anat", "type": "story"}, {"q": "13. מהי החשיבות ההיסטורית של סיפור שמגר לגבי הפלישתים?", "a": "זו הפעם הראשונה שהפלישתים מוזכרים כאויבי ישראל בספר שופטים. הם יהפכו לאויב מרכזי בהמשך (שמשון)", "source": "03 shamgar ben anat", "type": "story"}, {"q": "14. באיזה פרק ופסוק מופיע סיפור שמגר?", "a": "פרק ג' פסוק ל\"א", "source": "03 shamgar ben anat", "type": "story"}, {"q": "15. ⭐⭐ כמה פלישתים בדיוק הכה שמגר?", "a": "שש מאות (600) איש (שופטים ג':ל\"א)", "source": "03 shamgar ben anat", "type": "story"}, {"q": "16. ⭐⭐⭐ מה פירוש הביטוי \"חָדְלוּ אֳרָחוֹת\" מתוך שירת דבורה בהקשר לימי שמגר?", "a": "הדרכים לא היו בטוחות - אנשים הפסיקו ללכת בדרכים ראשיות מפני הסכנה (שופטים ה':ו')", "source": "03 shamgar ben anat", "type": "story"}, {"q": "17. ⭐⭐⭐ מי מוזכרת לצד שמגר בן ענת בשירת דבורה כציון זמן?", "a": "יעל - \"בִּימֵי שַׁמְגַּר בֶּן עֲנָת בִּימֵי יָעֵל חָדְלוּ אֳרָחוֹת\" (שופטים ה':ו')", "source": "03 shamgar ben anat", "type": "story"}, {"q": "1. ⭐⭐ הכה שש מאות פלשתים במלמד הבקר, מוזכר בפסוק אחד בלבד, הושיע את ישראל", "a": "**הדמות:** שמגר בן ענת\n**ספר:** שופטים\n**הקשר:** שמגר בן ענת הכה שש מאות פלשתים במלמד בקר, ומוזכר בפסוק אחד בלבד כמושיע ישראל (פרק ג':ל\"א)", "source": "03 shamgar ben anat", "type": "story"}, {"q": "2. ⭐⭐⭐ שם אביו הוא שם של אלה כנענית, פעל אחרי שופט שמאלי, הכתוב מדגיש \"גם הוא\" הושיע", "a": "**הדמות:** שמגר בן ענת\n**ספר:** שופטים\n**הקשר:** \"ענת\" הוא שם אלה כנענית. שמגר פעל אחרי אהוד בן גרא (שהיה איטר יד ימינו/שמאלי). הכתוב אומר \"וַיּוֹשַׁע גַּם הוּא אֶת יִשְׂרָאֵל\" - \"גם הוא\" כמו אהוד שקדם לו (שופטים ג':ל\"א)", "source": "03 shamgar ben anat", "type": "story"}, {"q": "1. ⭐⭐⭐ שמגר בן ענת מתואר בכתוב כ\"שופט\". נכון או לא נכון?", "a": "**לא נכון.** שמגר מתואר בכתוב רק כמי ש\"הושיע\" את ישראל (\"וַיּוֹשַׁע גַּם הוּא אֶת יִשְׂרָאֵל\"), אך המילה \"שופט\" או \"וישפוט\" לא מופיעה בפסוק. גם לא מוזכרות שנות שקט לאחריו (שופטים ג':ל\"א).", "source": "03 shamgar ben anat", "type": "story"}, {"q": "2. ⭐⭐⭐ שמגר בן ענת הכה 600 פלשתים בחרב. נכון או לא נכון?", "a": "**לא נכון.** שמגר הכה את הפלשתים ב\"מלמד הבקר\" - כלי חקלאי (דרבן) להנחיית שוורים, לא בחרב או בנשק מלחמתי (שופטים ג':ל\"א).", "source": "03 shamgar ben anat", "type": "story"}, {"q": "3. ⭐⭐⭐ בשירת דבורה, \"בימי שמגר בן ענת\" מתואר כתקופה של שלום ושגשוג. נכון או לא נכון?", "a": "**לא נכון.** בשירת דבורה נאמר \"בִּימֵי שַׁמְגַּר בֶּן עֲנָת בִּימֵי יָעֵל חָדְלוּ אֳרָחוֹת\" (שופטים ה':ו') - תקופה שבה הדרכים לא היו בטוחות, ההפך משלום ושגשוג.", "source": "03 shamgar ben anat", "type": "story"}, {"q": "4. ⭐⭐⭐ שמגר בן ענת פעל לפני אהוד בן גרא. נכון או לא נכון?", "a": "**לא נכון.** שמגר פעל **אחרי** אהוד בן גרא. הפסוק פותח ב\"וְאַחֲרָיו הָיָה שַׁמְגַּר בֶּן עֲנָת\" (שופטים ג':ל\"א) - \"אחריו\" מתייחס לאהוד.", "source": "03 shamgar ben anat", "type": "story"}, {"q": "5. ⭐⭐⭐ לאחר ניצחון שמגר שקטה הארץ 40 שנה. נכון או לא נכון?", "a": "**לא נכון.** הפסוק לא מזכיר שנות שקט כלל לאחר שמגר. נאמר רק \"וַיּוֹשַׁע גַּם הוּא אֶת יִשְׂרָאֵל\" - אין נוסחת סיום כמו \"ותשקוט הארץ\" שמופיעה אצל שופטים אחרים (שופטים ג':ל\"א).", "source": "03 shamgar ben anat", "type": "story"}, {"q": "1. ⭐⭐ \"שַׁמְגַּר בֶּן עֲנָת וַיַּךְ אֶת פְּלִשְׁתִּים שֵׁשׁ מֵאוֹת אִישׁ בְּ_____\"", "a": "**מילה חסרה:** מַלְמַד הַבָּקָר\n**מי אמר:** הכתוב (המספר)\n**הקשר:** שמגר הכה 600 פלישתים בכלי חקלאי - מלמד הבקר (שופטים ג':ל\"א)", "source": "03 shamgar ben anat", "type": "story"}, {"q": "2. ⭐⭐ \"וַיּוֹשַׁע _____ אֶת יִשְׂרָאֵל\"", "a": "**מילה חסרה:** גַּם הוּא\n**מי אמר:** הכתוב (המספר)\n**הקשר:** הדגשה ששמגר, כמו אהוד שקדם לו, גם הוא הושיע את ישראל (שופטים ג':ל\"א)", "source": "03 shamgar ben anat", "type": "story"}, {"q": "3. ⭐⭐⭐ \"בִּימֵי שַׁמְגַּר בֶּן עֲנָת בִּימֵי יָעֵל חָדְלוּ _____ וְהֹלְכֵי נְתִיבוֹת יֵלְכוּ אֳרָחוֹת עֲקַלְקַלּוֹת\"", "a": "**מילה חסרה:** אֳרָחוֹת\n**מי אמר:** דבורה וברק (בשירת דבורה)\n**הקשר:** בשירת דבורה מתוארים ימי שמגר כתקופה שבה הדרכים לא היו בטוחות (שופטים ה':ו')", "source": "03 shamgar ben anat", "type": "story"}, {"q": "4. ⭐⭐ \"וְ_____ הָיָה שַׁמְגַּר בֶּן עֲנָת\"", "a": "**מילה חסרה:** אַחֲרָיו\n**מי אמר:** הכתוב (המספר)\n**הקשר:** הפסוק פותח בציון שמגר פעל אחרי אהוד בן גרא (שופטים ג':ל\"א)", "source": "03 shamgar ben anat", "type": "story"}, {"q": "1. מי היה מלך כנען שלחץ את ישראל בתקופת דבורה?", "a": "יבין מלך כנען אשר מלך בחצור", "source": "04 devorah and barak", "type": "story"}, {"q": "2. מי היה שר צבאו של יבין?", "a": "סיסרא, שישב בחרושת הגויים", "source": "04 devorah and barak", "type": "story"}, {"q": "3. כמה רכב ברזל היו לסיסרא?", "a": "900 רכב ברזל", "source": "04 devorah and barak", "type": "story"}, {"q": "4. כמה שנים לחץ סיסרא את ישראל?", "a": "20 שנה", "source": "04 devorah and barak", "type": "story"}, {"q": "5. כיצד מתוארת דבורה בפסוקים?", "a": "אישה נביאה, אשת לפידות, שופטת את ישראל", "source": "04 devorah and barak", "type": "story"}, {"q": "6. היכן ישבה דבורה כשהיא שופטת?", "a": "תחת תומר דבורה, בין הרמה ובין בית אל בהר אפרים", "source": "04 devorah and barak", "type": "story"}, {"q": "7. מהיכן היה ברק בן אבינועם?", "a": "מקדש נפתלי", "source": "04 devorah and barak", "type": "story"}, {"q": "8. מה אמר ברק לדבורה כשצוותה עליו לצאת למלחמה?", "a": "\"אם תלכי עמי והלכתי ואם לא תלכי עמי לא אלך\"", "source": "04 devorah and barak", "type": "story"}, {"q": "9. כמה לוחמים לקח ברק ומאילו שבטים?", "a": "10,000 איש מבני נפתלי ומבני זבולון", "source": "04 devorah and barak", "type": "story"}, {"q": "10. מה ניבאה דבורה לברק בגלל סירובו ללכת לבד?", "a": "\"לא תהיה תפארתך על הדרך... כי ביד אישה ימכור ה' את סיסרא\"", "source": "04 devorah and barak", "type": "story"}, {"q": "11. מהיכן ירד ברק עם לוחמיו לקרב?", "a": "מהר תבור", "source": "04 devorah and barak", "type": "story"}, {"q": "12. מי הרגה את סיסרא וכיצד?", "a": "יעל אשת חבר הקיני - תקעה יתד אוהל ברקתו בעזרת מקבת כשהיה ישן", "source": "04 devorah and barak", "type": "story"}, {"q": "13. מה נתנה יעל לסיסרא לפני שהרגה אותו?", "a": "כיסתה אותו בשמיכה ונתנה לו חלב לשתות", "source": "04 devorah and barak", "type": "story"}, {"q": "14. מי היה חבר הקיני?", "a": "נפרד מהקינים בני חובב חותן משה, ונטה אוהלו בצאננים. היה שלום בינו ליבין", "source": "04 devorah and barak", "type": "story"}, {"q": "15. איזה נחל גרף את צבא סיסרא?", "a": "נחל קישון", "source": "04 devorah and barak", "type": "story"}, {"q": "16. אילו שבטים השתתפו במלחמה לפי שירת דבורה?", "a": "אפרים, בנימין, מכיר, זבולון, יששכר, נפתלי", "source": "04 devorah and barak", "type": "story"}, {"q": "17. אילו שבטים לא באו למלחמה לפי שירת דבורה?", "a": "ראובן, גלעד/גד, דן, אשר", "source": "04 devorah and barak", "type": "story"}, {"q": "18. מי מצפה לבנה מהחלון בסוף שירת דבורה?", "a": "אם סיסרא - \"בעד החלון נשקפה ותיבב אם סיסרא\"", "source": "04 devorah and barak", "type": "story"}, {"q": "19. כמה שנים שקטה הארץ אחרי ניצחון דבורה וברק?", "a": "40 שנה", "source": "04 devorah and barak", "type": "story"}, {"q": "20. מאיזה פסוק: \"תְּבֹרַךְ מִנָּשִׁים יָעֵל אֵשֶׁת חֶבֶר הַקֵּינִי מִנָּשִׁים בָּאֹהֶל תְּבֹרָךְ\"?", "a": "שירת דבורה, פרק ה' פסוק כ\"ד", "source": "04 devorah and barak", "type": "story"}, {"q": "21. ⭐⭐ היכן ישב סיסרא (שר צבא יבין)?", "a": "בחרושת הגויים (שופטים ד':ב')", "source": "04 devorah and barak", "type": "story"}, {"q": "22. ⭐⭐⭐ מי היה חובב חותן משה ומה הקשר שלו לחבר הקיני?", "a": "חבר הקיני נפרד מקין מבני חובב חותן משה. כלומר חבר הקיני היה צאצא של חובב חותן משה, מהקינים (שופטים ד':י\"א)", "source": "04 devorah and barak", "type": "story"}, {"q": "23. ⭐⭐⭐ מהו \"מרוז\" ומדוע נארר?", "a": "מרוז הוא מקום שנארר (קולל) על ידי מלאך ה' כי יושביו לא באו לעזרת ה' במלחמה: \"אוֹרוּ מֵרוֹז אָמַר מַלְאַךְ ה' אֹרוּ אָרוֹר יֹשְׁבֶיהָ כִּי לֹא בָאוּ לְעֶזְרַת ה' בַּגִּבּוֹרִים\" (שופטים ה':כ\"ג)", "source": "04 devorah and barak", "type": "story"}, {"q": "24. ⭐⭐ היכן נטה חבר הקיני את אוהלו?", "a": "עד אלון בצאננים אשר את קדש (שופטים ד':י\"א)", "source": "04 devorah and barak", "type": "story"}, {"q": "1. ⭐⭐ \"אִם תֵּלְכִי עִמִּי וְהָלָכְתִּי וְאִם לֹא תֵלְכִי עִמִּי לֹא אֵלֵךְ\"", "a": "**מי אמר:** ברק בן אבינועם\n**למי:** דבורה\n**הקשר:** ברק מסרב ללכת למלחמה נגד סיסרא בלי דבורה (שופטים ד':ח')", "source": "04 devorah and barak", "type": "story"}, {"q": "2. ⭐⭐ \"כִּי בְיַד אִשָּׁה יִמְכֹּר ה' אֶת סִיסְרָא\"", "a": "**מי אמר:** דבורה\n**למי:** ברק\n**הקשר:** דבורה מודיעה לברק שבגלל סירובו, התפארת לא תהיה שלו - סיסרא ייפול ביד אישה (שופטים ד':ט')", "source": "04 devorah and barak", "type": "story"}, {"q": "3. ⭐⭐⭐ \"סוּרָה אֲדֹנִי סוּרָה אֵלַי אַל תִּירָא\"", "a": "**מי אמר:** יעל אשת חבר הקיני\n**למי:** סיסרא\n**הקשר:** יעל מזמינה את סיסרא הבורח לאוהלה לפני שהורגת אותו ביתד (שופטים ד':י\"ח)", "source": "04 devorah and barak", "type": "story"}, {"q": "4. ⭐⭐⭐ \"עֲמֹד פֶּתַח הָאֹהֶל וְהָיָה אִם אִישׁ יָבוֹא וּשְׁאֵלֵךְ וְאָמַר הֲיֵשׁ פֹּה אִישׁ וְאָמַרְתְּ אָיִן\"", "a": "**מי אמר:** סיסרא\n**למי:** יעל אשת חבר הקיני\n**הקשר:** סיסרא מבקש מיעל לעמוד בפתח האוהל ולהכחיש את נוכחותו אם ישאלו. זוהי בקשתו האחרונה לפני שנרדם ויעל הרגה אותו (שופטים ד':כ')", "source": "04 devorah and barak", "type": "story"}, {"q": "5. ⭐⭐⭐ \"קוּם כִּי זֶה הַיּוֹם אֲשֶׁר נָתַן ה' אֶת סִיסְרָא בְּיָדֶךָ הֲלֹא ה' יָצָא לְפָנֶיךָ\"", "a": "**מי אמר:** דבורה\n**למי:** ברק\n**הקשר:** דבורה נותנת לברק את הפקודה לרדת מהר תבור ולהתחיל את הקרב נגד סיסרא (שופטים ד':י\"ד)", "source": "04 devorah and barak", "type": "story"}, {"q": "6. ⭐⭐⭐ \"לֵךְ וְאַרְאֶךָּ אֶת הָאִישׁ אֲשֶׁר אַתָּה מְבַקֵּשׁ\"", "a": "**מי אמר:** יעל אשת חבר הקיני\n**למי:** ברק\n**הקשר:** ברק רודף אחרי סיסרא ומגיע לאוהל יעל. יעל יוצאת לקראתו ומראה לו את סיסרא נופל מת והיתד ברקתו (שופטים ד':כ\"ב)", "source": "04 devorah and barak", "type": "story"}, {"q": "7. ⭐⭐⭐ \"הַשְׁקִינִי נָא מְעַט מַיִם כִּי צָמֵאתִי\"", "a": "**מי אמר:** סיסרא\n**למי:** יעל אשת חבר הקיני\n**הקשר:** סיסרא מבקש מים מיעל אחרי שנס מהקרב ברגליו. יעל פותחת דווקא את נאוד החלב ונותנת לו חלב - לא מים (שופטים ד':י\"ט)", "source": "04 devorah and barak", "type": "story"}, {"q": "1. ⭐ נביאה ושופטת, ישבה תחת עץ תמר, שלחה לקרוא למצביא, ניבאה שהניצחון יהיה ביד אישה", "a": "**הדמות:** דבורה\n**ספר:** שופטים\n**הקשר:** דבורה ישבה תחת תומר דבורה בין הרמה ובין בית אל, קראה לברק בן אבינועם וציוותה עליו ללכת למלחמה, וניבאה שסיסרא ייפול ביד אישה (פרק ד')", "source": "04 devorah and barak", "type": "story"}, {"q": "2. ⭐ שר צבא שהיו לו 900 רכב ברזל, שעבד את ישראל 20 שנה, נס ברגליו מהקרב, נהרג באוהל", "a": "**הדמות:** סיסרא\n**ספר:** שופטים\n**הקשר:** סיסרא היה שר צבא יבין מלך כנען, ישב בחרושת הגויים, נוצח על ידי ברק, נס לאוהל יעל אשת חבר הקיני ונהרג ביתד האוהל (פרק ד')", "source": "04 devorah and barak", "type": "story"}, {"q": "3. ⭐ הרגה מפקד צבא בזמן שנרדם, תקעה יתד ברקתו, בורכה בשירה כ\"מנשים באוהל תבורך\"", "a": "**הדמות:** יעל אשת חבר הקיני\n**ספר:** שופטים\n**הקשר:** יעל הזמינה את סיסרא לאוהלה, נתנה לו חלב, כיסתה אותו, וכשנרדם תקעה יתד ברקתו. דבורה בירכה אותה בשירתה (פרקים ד'-ה')", "source": "04 devorah and barak", "type": "story"}, {"q": "4. ⭐⭐⭐ נפרד מבני משפחתו, נטה אוהלו ליד קדש, היה לו שלום עם מלך כנען, אשתו הרגה שר צבא", "a": "**הדמות:** חבר הקיני\n**ספר:** שופטים\n**הקשר:** חבר הקיני נפרד מקין מבני חובב חותן משה, נטה אוהלו עד אלון בצאננים אשר את קדש. היה שלום בינו ליבין מלך חצור - ולכן סיסרא נס לאוהל אשתו יעל (שופטים ד':י\"א, י\"ז)", "source": "04 devorah and barak", "type": "story"}, {"q": "1. ⭐⭐ דבורה היתה הנביאה היחידה שגם שפטה את ישראל. נכון או לא נכון?", "a": "**נכון (בתוך החומר שלנו).** דבורה מתוארת כ\"אשה נביאה\" וגם \"היא שופטה את ישראל\" (שופטים ד':ד'). היא היחידה שנקראת בשני התארים בחומר הנלמד.", "source": "04 devorah and barak", "type": "story"}, {"q": "2. ⭐ יעל הרגה את סיסרא בחרב. נכון או לא נכון?", "a": "**לא נכון.** יעל הרגה את סיסרא ביתד האוהל ובמקבת: \"ותקח יעל אשת חבר את יתד האוהל ותשם את המקבת בידה... ותתקע את היתד ברקתו\" (שופטים ד':כ\"א).", "source": "04 devorah and barak", "type": "story"}, {"q": "3. ⭐⭐⭐ סיסרא ביקש מיעל מים, והיא נתנה לו מים. נכון או לא נכון?", "a": "**לא נכון.** סיסרא ביקש מעט מים (\"הַשְׁקִינִי נָא מְעַט מַיִם כִּי צָמֵאתִי\") אבל יעל פתחה את **נאוד החלב** והשקתה אותו חלב, לא מים (שופטים ד':י\"ט). בשירת דבורה מפורט עוד: \"מַיִם שָׁאַל חָלָב נָתָנָה בְּסֵפֶל אַדִּירִים הִקְרִיבָה חֶמְאָה\" (ה':כ\"ה).", "source": "04 devorah and barak", "type": "story"}, {"q": "4. ⭐⭐⭐ שבט יהודה מוזכר בשירת דבורה כשבט שהשתתף במלחמה. נכון או לא נכון?", "a": "**לא נכון.** שבט יהודה כלל אינו מוזכר בשירת דבורה. השבטים שהשתתפו: אפרים, בנימין, מכיר (חצי מנשה), זבולון, יששכר, נפתלי. השבטים שנמתחה עליהם ביקורת שלא באו: ראובן, גלעד/גד, דן, אשר. יהודה ושמעון לא מוזכרים כלל (שופטים ה':י\"ד-י\"ח).", "source": "04 devorah and barak", "type": "story"}, {"q": "5. ⭐⭐⭐ בשירת דבורה, מרוז נארר (קולל) על ידי מלאך ה' כי לא בא לעזרת ישראל. נכון או לא נכון?", "a": "**נכון.** \"אוֹרוּ מֵרוֹז אָמַר מַלְאַךְ ה' אֹרוּ אָרוֹר יֹשְׁבֶיהָ כִּי לֹא בָאוּ לְעֶזְרַת ה' לְעֶזְרַת ה' בַּגִּבּוֹרִים\" (שופטים ה':כ\"ג). מרוז הוא המקום היחיד שנארר במפורש ע\"י מלאך ה'.", "source": "04 devorah and barak", "type": "story"}, {"q": "6. ⭐⭐⭐ ברק בן אבינועם היה משבט זבולון. נכון או לא נכון?", "a": "**לא נכון.** ברק בן אבינועם היה מ**קדש נפתלי** (שופטים ד':ו'). הוא גייס לוחמים מנפתלי ומזבולון, אך הוא עצמו היה מנפתלי.", "source": "04 devorah and barak", "type": "story"}, {"q": "7. ⭐⭐⭐ סיסרא נס לאוהל יעל כי היה שלום בין יבין לבין שבט נפתלי. נכון או לא נכון?", "a": "**לא נכון.** סיסרא נס לאוהל יעל \"כִּי שָׁלוֹם בֵּין יָבִין מֶלֶךְ חָצוֹר וּבֵין **בֵּית חֶבֶר הַקֵּינִי**\" (שופטים ד':י\"ז) - השלום היה בין יבין לבית חבר הקיני, לא לשבט נפתלי.", "source": "04 devorah and barak", "type": "story"}, {"q": "1. ⭐⭐ \"אִם תֵּלְכִי עִמִּי וְהָלָכְתִּי וְאִם לֹא תֵלְכִי עִמִּי לֹא _____\"", "a": "**מילה חסרה:** אֵלֵךְ\n**מי אמר:** ברק בן אבינועם\n**הקשר:** ברק מסרב ללכת למלחמה נגד סיסרא בלי דבורה (שופטים ד':ח')", "source": "04 devorah and barak", "type": "story"}, {"q": "2. ⭐⭐⭐ \"כִּי בְיַד _____ יִמְכֹּר ה' אֶת סִיסְרָא\"", "a": "**מילה חסרה:** אִשָּׁה\n**מי אמר:** דבורה\n**הקשר:** דבורה מנבאת לברק שבגלל סירובו ללכת לבד, התפארת לא תהיה שלו - סיסרא ייפול ביד אישה (שופטים ד':ט')", "source": "04 devorah and barak", "type": "story"}, {"q": "3. ⭐⭐ \"עוּרִי עוּרִי דְּבוֹרָה עוּרִי עוּרִי _____ שִׁיר\"", "a": "**מילה חסרה:** דַּבְּרִי\n**מי אמר:** דבורה וברק (בשירת דבורה)\n**הקשר:** קריאה לדבורה לשיר את שירת הניצחון (שופטים ה':י\"ב)", "source": "04 devorah and barak", "type": "story"}, {"q": "4. ⭐⭐⭐ \"בְּעַד הַחַלּוֹן נִשְׁקְפָה וַתְּיַבֵּב _____ בְּעַד הָאֶשְׁנָב\"", "a": "**מילה חסרה:** אֵם סִיסְרָא\n**מי אמר:** דבורה וברק (בשירת דבורה)\n**הקשר:** תיאור אם סיסרא שמצפה לבנה שלא חוזר מהמלחמה (שופטים ה':כ\"ח)", "source": "04 devorah and barak", "type": "story"}, {"q": "5. ⭐⭐ \"כֵּן יֹאבְדוּ כָל אוֹיְבֶיךָ ה' וְאֹהֲבָיו כְּצֵאת _____ בִּגְבֻרָתוֹ\"", "a": "**מילה חסרה:** הַשֶּׁמֶשׁ\n**מי אמר:** דבורה וברק (בשירת דבורה)\n**הקשר:** הפסוק האחרון בשירת דבורה - ברכה לאוהבי ה' ומשאלה שאויבי ה' יאבדו (שופטים ה':ל\"א)", "source": "04 devorah and barak", "type": "story"}, {"q": "1. כמה שנים שעבדה מדין את ישראל?", "a": "7 שנים", "source": "05 gideon", "type": "story"}, {"q": "2. מה עשו בני ישראל כדי להתחבא ממדין?", "a": "התחבאו במערות", "source": "05 gideon", "type": "story"}, {"q": "3. מה עשה גדעון כשמלאך ה' הופיע אליו?", "a": "חבט חיטים בגת כדי להסתיר ממדין", "source": "05 gideon", "type": "story"}, {"q": "4. מאיזה שבט ומשפחה היה גדעון?", "a": "מהאביעזרי שבשבט מנשה", "source": "05 gideon", "type": "story"}, {"q": "5. מה אמר המלאך לגדעון כשהופיע אליו?", "a": "\"ה' עמך גבור החיל\"", "source": "05 gideon", "type": "story"}, {"q": "6. מה ענה גדעון על מעמדו כשנשלח להושיע?", "a": "\"אלפי הדל במנשה ואנכי הצעיר בבית אבי\"", "source": "05 gideon", "type": "story"}, {"q": "7. מה ציווה ה' את גדעון לעשות בלילה בנוגע לעבודה זרה?", "a": "להרוס את מזבח הבעל, לכרות את האשרה ולבנות מזבח לה'", "source": "05 gideon", "type": "story"}, {"q": "8. מדוע נקרא גדעון \"ירובעל\"?", "a": "כי אביו יואש אמר \"אם אלוהים הוא ירב לו\" כשהגן על גדעון מפני אנשי העיר שכעסו על הריסת מזבח הבעל", "source": "05 gideon", "type": "story"}, {"q": "9. מהו מבחן גיזת הצמר שביקש גדעון?", "a": "לילה ראשון - טל רק על הגיזה והארץ יבשה; לילה שני - הגיזה יבשה והארץ רטובה", "source": "05 gideon", "type": "story"}, {"q": "10. כיצד סוננו הלוחמים משלושים ושניים אלף ל-300?", "a": "שלב ראשון: מי שירא הלך הביתה (נשארו 10,000). שלב שני: מבחן המים בעין חרוד - רק מי שלקק בלשונו כלקוק הכלב נבחר (300 איש)", "source": "05 gideon", "type": "story"}, {"q": "11. מי היה פורה?", "a": "נער גדעון, ירד עמו למחנה מדין בלילה", "source": "05 gideon", "type": "story"}, {"q": "12. מהו החלום ששמע גדעון במחנה מדין?", "a": "צליל לחם שעורים מתגלגל ומפיל אוהל", "source": "05 gideon", "type": "story"}, {"q": "13. אילו כלים קיבלו 300 הלוחמים למלחמה?", "a": "שופרות, כדים ריקים ולפידים בתוך הכדים", "source": "05 gideon", "type": "story"}, {"q": "14. מהי קריאת המלחמה של גדעון ולוחמיו?", "a": "\"חרב לה' ולגדעון\"", "source": "05 gideon", "type": "story"}, {"q": "15. מדוע כעסו אנשי אפרים על גדעון?", "a": "כי לא נקראו למלחמה", "source": "05 gideon", "type": "story"}, {"q": "16. כיצד הרגיע גדעון את אנשי אפרים?", "a": "אמר \"הלא טוב עוללות אפרים מבציר אביעזר\" - על כך שתפסו את עורב וזאב שרי מדין", "source": "05 gideon", "type": "story"}, {"q": "17. מי היו זבח וצלמונע?", "a": "מלכי מדין, שנתפסו ונהרגו על ידי גדעון", "source": "05 gideon", "type": "story"}, {"q": "18. מה ענה גדעון כשביקשו ממנו למלוך?", "a": "\"לא אמשול אני בכם ולא ימשול בני בכם, ה' ימשול בכם\"", "source": "05 gideon", "type": "story"}, {"q": "19. מה עשה גדעון מנזמי הזהב ומה היתה התוצאה?", "a": "עשה מהם אפוד ושם בעירו בעפרה. כל ישראל זנו אחריו והיה לגדעון ולביתו למוקש", "source": "05 gideon", "type": "story"}, {"q": "20. כמה בנים היו לגדעון ומי היה בנו מהפילגש?", "a": "70 בנים מנשים רבות, ופילגש בשכם ילדה את אבימלך", "source": "05 gideon", "type": "story"}, {"q": "21. ⭐⭐ כמה אנשים לקח גדעון כשהרס את מזבח הבעל בלילה?", "a": "עשרה אנשים מעבדיו (שופטים ו':כ\"ז)", "source": "05 gideon", "type": "story"}, {"q": "22. ⭐⭐⭐ מהם שמות שני שרי מדין שנתפסו על ידי אנשי אפרים?", "a": "עורב וזאב - עורב נהרג בצור עורב, וזאב נהרג ביקב זאב (שופטים ז':כ\"ה)", "source": "05 gideon", "type": "story"}, {"q": "23. ⭐⭐ כמה הרוגים נפלו במלחמה עם מדין לפי פרק ח'?", "a": "120,000 איש שולף חרב (שופטים ח':י')", "source": "05 gideon", "type": "story"}, {"q": "24. ⭐⭐⭐ מה שם בנו הבכור של גדעון, ומה קרה כשגדעון ביקש ממנו להרוג את זבח וצלמונע?", "a": "יתר - לא שלף חרבו כי ירא, כי עודנו נער (שופטים ח':כ')", "source": "05 gideon", "type": "story"}, {"q": "1. ⭐ \"ה' עִמְּךָ גִּבּוֹר הֶחָיִל\"", "a": "**מי אמר:** מלאך ה'\n**למי:** גדעון\n**הקשר:** מלאך ה' מופיע אל גדעון כשהוא חובט חיטים בגת להסתיר ממדין (שופטים ו':י\"ב)", "source": "05 gideon", "type": "story"}, {"q": "2. ⭐⭐ \"אֲלָפִי הַדַּל בִּמְנַשֶּׁה וְאָנֹכִי הַצָּעִיר בְּבֵית אָבִי\"", "a": "**מי אמר:** גדעון\n**למי:** ה' (מלאך ה')\n**הקשר:** גדעון מתנגד לשליחותו בטענה שמשפחתו חלשה והוא הצעיר בבית אביו (שופטים ו':ט\"ו)", "source": "05 gideon", "type": "story"}, {"q": "3. ⭐ \"לֹא אֶמְשֹׁל אֲנִי בָּכֶם וְלֹא יִמְשֹׁל בְּנִי בָּכֶם, ה' יִמְשֹׁל בָּכֶם\"", "a": "**מי אמר:** גדעון\n**למי:** אנשי ישראל\n**הקשר:** גדעון מסרב להצעת העם למלוך עליהם אחרי ניצחון מדין (שופטים ח':כ\"ג)", "source": "05 gideon", "type": "story"}, {"q": "4. ⭐⭐⭐ \"הֲכַף זֶבַח וְצַלְמֻנָּע עַתָּה בְּיָדֶךָ כִּי נִתֵּן לִצְבָאֲךָ לָחֶם\"", "a": "**מי אמר:** שרי סוכות\n**למי:** גדעון\n**הקשר:** אנשי סוכות מסרבים לתת לחם ללוחמי גדעון העייפים, בטענה שעדיין לא תפס את מלכי מדין. גדעון מאיים שיענישם, ואכן מעניש אותם לאחר הניצחון (שופטים ח':ו'-ז')", "source": "05 gideon", "type": "story"}, {"q": "5. ⭐⭐⭐ \"כָּמוֹךָ כְמוֹהֶם אֶחָד כְּתֹאַר בְּנֵי הַמֶּלֶךְ\"", "a": "**מי אמר:** זבח וצלמונע (מלכי מדין)\n**למי:** גדעון\n**הקשר:** גדעון שואל את מלכי מדין על האנשים שהרגו בתבור - והם עונים שהיו דומים לגדעון, \"כתואר בני המלך\". גדעון מגלה שהם אחיו בני אמו, ולכן הורגם (שופטים ח':י\"ח-י\"ט)", "source": "05 gideon", "type": "story"}, {"q": "6. ⭐⭐⭐ \"רַב הָעָם אֲשֶׁר אִתָּךְ מִתִּתִּי אֶת מִדְיָן בְּיָדָם פֶּן יִתְפָּאֵר עָלַי יִשְׂרָאֵל לֵאמֹר יָדִי הוֹשִׁיעָה לִּי\"", "a": "**מי אמר:** ה'\n**למי:** גדעון\n**הקשר:** ה' מסביר מדוע צריך לצמצם את מספר הלוחמים - כדי שישראל לא יתפארו שניצחו בכוח עצמם (שופטים ז':ב')", "source": "05 gideon", "type": "story"}, {"q": "7. ⭐⭐⭐ \"קוּם אַתָּה וּפְגַע בָּנוּ כִּי כָאִישׁ גְּבוּרָתוֹ\"", "a": "**מי אמר:** זבח וצלמונע (מלכי מדין)\n**למי:** גדעון\n**הקשר:** לאחר שיתר בנו של גדעון ירא מלהורגם, זבח וצלמונע מבקשים מגדעון עצמו שיהרגם - \"כי כאיש גבורתו\" (שופטים ח':כ\"א)", "source": "05 gideon", "type": "story"}, {"q": "1. ⭐ חבט חיטים בגת, מלאך ה' קרא לו \"גיבור החיל\", ביקש אות עם גיזת צמר, ניצח עם 300 לוחמים בלבד", "a": "**הדמות:** גדעון (ירובעל)\n**ספר:** שופטים\n**הקשר:** גדעון בן יואש האביעזרי חבט חיטים בגת מפחד מדין, ה' שלחו להושיע, סינן את צבאו ל-300 לוחמים שלקקו מים, וניצח את מדין בשופרות, כדים ולפידים (פרקים ו'-ח')", "source": "05 gideon", "type": "story"}, {"q": "2. ⭐⭐⭐ הגן על בנו מפני אנשי העיר שרצו להורגו, טען \"אם אלוהים הוא ירב לו\", בעל מזבח בעל", "a": "**הדמות:** יואש (אבי גדעון)\n**ספר:** שופטים\n**הקשר:** יואש אבי גדעון הגן על בנו כשאנשי העיר רצו להורגו בגלל הריסת מזבח הבעל. יואש טען שאם הבעל באמת אלוהים, ירב לעצמו - ולכן נקרא גדעון \"ירובעל\" (שופטים ו':ל\"א-ל\"ב)", "source": "05 gideon", "type": "story"}, {"q": "3. ⭐⭐⭐ ירד עם אדונו למחנה האויב בלילה, שמע חלום על צליל לחם שעורים, שמו מוזכר פעם אחת בלבד", "a": "**הדמות:** פורה נער גדעון\n**ספר:** שופטים\n**הקשר:** ה' אמר לגדעון שאם ירא לרדת למחנה מדין, ירד עם פורה נערו. גדעון ופורה ירדו ושמעו את חלום צליל לחם השעורים שהפיל אוהל - מה שחיזק את גדעון לצאת למלחמה (שופטים ז':י'-י\"ד)", "source": "05 gideon", "type": "story"}, {"q": "1. ⭐⭐ גדעון ניצח את מדין עם 10,000 לוחמים. נכון או לא נכון?", "a": "**לא נכון.** גדעון ניצח עם 300 לוחמים בלבד. התחיל עם 32,000, צמצם ל-10,000 (מי שירא הלך), ואז ל-300 במבחן המים בעין חרוד (שופטים ז':ב'-ז').", "source": "05 gideon", "type": "story"}, {"q": "2. ⭐ גדעון הסכים למלוך על ישראל אחרי שניצח את מדין. נכון או לא נכון?", "a": "**לא נכון.** גדעון סירב: \"לא אמשול אני בכם ולא ימשול בני בכם, ה' ימשול בכם\" (שופטים ח':כ\"ג). אך ביקש את נזמי הזהב ועשה מהם אפוד שהפך למוקש.", "source": "05 gideon", "type": "story"}, {"q": "3. ⭐⭐⭐ במבחן גיזת הצמר, בפעם הראשונה גדעון ביקש שהגיזה תהיה יבשה והארץ רטובה. נכון או לא נכון?", "a": "**לא נכון.** הסדר הפוך: בפעם **הראשונה** גדעון ביקש טל על הגיזה בלבד והארץ חורב. רק בפעם **השנייה** ביקש את ההיפך - חורב על הגיזה וטל על כל הארץ (שופטים ו':ל\"ז-מ'). רבים מבלבלים את הסדר.", "source": "05 gideon", "type": "story"}, {"q": "4. ⭐⭐⭐ גדעון הרס את מזבח הבעל ביום, לעיני כל אנשי העיר. נכון או לא נכון?", "a": "**לא נכון.** גדעון עשה זאת **בלילה** כי ירא מבית אביו ומאנשי העיר: \"וַיְהִי כַּאֲשֶׁר יָרֵא אֶת בֵּית אָבִיו וְאֶת אַנְשֵׁי הָעִיר מֵעֲשׂוֹת יוֹמָם וַיַּעַשׂ לָיְלָה\" (שופטים ו':כ\"ז). לקח עמו עשרה אנשים מעבדיו.", "source": "05 gideon", "type": "story"}, {"q": "5. ⭐⭐⭐ גדעון ביקש מבנו הבכור יתר להרוג את זבח וצלמונע, אך יתר הרג אותם. נכון או לא נכון?", "a": "**לא נכון.** גדעון אמר ליתר בכורו \"קום הרוג אותם\", אבל יתר **לא שלף** את חרבו כי ירא - \"כִּי עוֹדֶנּוּ נָעַר\". בסוף זבח וצלמונע עצמם ביקשו מגדעון \"קום אתה ופגע בנו כי כאיש גבורתו\", וגדעון הרג אותם בעצמו (שופטים ח':כ'-כ\"א).", "source": "05 gideon", "type": "story"}, {"q": "1. ⭐⭐ \"ה' עִמְּךָ _____ הֶחָיִל\"", "a": "**מילה חסרה:** גִּבּוֹר\n**מי אמר:** מלאך ה'\n**הקשר:** מלאך ה' פונה לגדעון כשהוא חובט חיטים בגת להסתיר ממדין (שופטים ו':י\"ב)", "source": "05 gideon", "type": "story"}, {"q": "2. ⭐⭐⭐ \"אַלְפִּי הַדַּל בִּ_____ וְאָנֹכִי הַצָּעִיר בְּבֵית אָבִי\"", "a": "**מילה חסרה:** מְנַשֶּׁה\n**מי אמר:** גדעון\n**הקשר:** גדעון מתנגד לשליחותו, טוען שמשפחתו הדלה ביותר בשבט מנשה והוא הצעיר בבית אביו (שופטים ו':ט\"ו)", "source": "05 gideon", "type": "story"}, {"q": "3. ⭐⭐ \"חֶרֶב לַה' וּ_____\"", "a": "**מילה חסרה:** לְגִדְעוֹן\n**מי אמר:** 300 לוחמי גדעון\n**הקשר:** קריאת המלחמה כשתוקעים בשופרות ושוברים את הכדים מול מחנה מדין (שופטים ז':כ')", "source": "05 gideon", "type": "story"}, {"q": "4. ⭐⭐⭐ \"לֹא אֶמְשֹׁל אֲנִי בָּכֶם וְלֹא יִמְשֹׁל _____ בָּכֶם ה' יִמְשֹׁל בָּכֶם\"", "a": "**מילה חסרה:** בְּנִי\n**מי אמר:** גדעון\n**הקשר:** גדעון מסרב למלוך על ישראל לאחר ניצחון מדין - רק ה' ימשול (שופטים ח':כ\"ג)", "source": "05 gideon", "type": "story"}, {"q": "5. ⭐⭐⭐ \"הֲלֹא טוֹב עֹלְלוֹת _____ מִבְצִיר אֲבִיעֶזֶר\"", "a": "**מילה חסרה:** אֶפְרַיִם\n**מי אמר:** גדעון\n**הקשר:** גדעון מרגיע את אנשי אפרים שכעסו שלא נקראו למלחמה - אומר שמה שאפרים עשו (תפסו את עורב וזאב) חשוב יותר ממה שהוא עשה (שופטים ח':ב')", "source": "05 gideon", "type": "story"}, {"q": "1. מי היה אבימלך ומי היו הוריו?", "a": "בן ירובעל (גדעון) מפילגשו השכמית", "source": "06 avimelech", "type": "story"}, {"q": "2. כיצד שכנע אבימלך את בעלי שכם לתמוך בו?", "a": "אמר להם \"מה טוב לכם, המשול בכם שבעים איש כל בני ירובעל, אם משול בכם איש אחד\"", "source": "06 avimelech", "type": "story"}, {"q": "3. כמה כסף קיבל אבימלך מבית בעל ברית?", "a": "70 כסף", "source": "06 avimelech", "type": "story"}, {"q": "4. את מי שכר אבימלך בכסף?", "a": "\"אנשים ריקים ופוחזים\" - שכירי חרב", "source": "06 avimelech", "type": "story"}, {"q": "5. כמה מאחיו רצח אבימלך ואיך?", "a": "70 אחים, על אבן אחת בעפרה", "source": "06 avimelech", "type": "story"}, {"q": "6. מי היה האח היחיד שניצל מהטבח ומדוע?", "a": "יותם הבן הצעיר, כי נחבא", "source": "06 avimelech", "type": "story"}, {"q": "7. מהיכן נשא יותם את משל העצים?", "a": "מהר גריזים", "source": "06 avimelech", "type": "story"}, {"q": "8. אילו עצים סירבו למלוך במשל יותם ומדוע?", "a": "הזית (סירב - \"החדלתי את דשני\"), התאנה (סירבה - \"החדלתי את מתקי\"), הגפן (סירב - \"החדלתי את תירושי\")", "source": "06 avimelech", "type": "story"}, {"q": "9. מי הסכים למלוך במשל יותם ומה מייצג?", "a": "האטד (שיח קוצים) - מייצג את אבימלך", "source": "06 avimelech", "type": "story"}, {"q": "10. מה ניבא יותם בסוף המשל?", "a": "שתצא אש מאבימלך ותאכל את בעלי שכם, ואש מבעלי שכם תאכל את אבימלך", "source": "06 avimelech", "type": "story"}, {"q": "11. כמה שנים שלט אבימלך?", "a": "3 שנים", "source": "06 avimelech", "type": "story"}, {"q": "12. מה שלח ה' בין אבימלך לבעלי שכם?", "a": "רוח רעה", "source": "06 avimelech", "type": "story"}, {"q": "13. מי הסית את בעלי שכם נגד אבימלך?", "a": "געל בן עבד", "source": "06 avimelech", "type": "story"}, {"q": "14. מי היה זבול ומה עשה?", "a": "פקיד אבימלך בשכם, שהודיע לאבימלך על המרד של געל", "source": "06 avimelech", "type": "story"}, {"q": "15. מה עשה אבימלך לשכם לאחר שכבש אותה?", "a": "השמיד אותה וזרע בה מלח", "source": "06 avimelech", "type": "story"}, {"q": "16. כמה אנשים מתו במגדל שכם (צריח בית אל ברית)?", "a": "כאלף איש ואישה - נשרפו כשאבימלך ואנשיו הציתו את הצריח", "source": "06 avimelech", "type": "story"}, {"q": "17. כיצד נהרג אבימלך?", "a": "אישה אחת מתבץ השליכה פלח רכב (אבן ריחיים עליונה) על ראשו ורוצצה את גולגולתו", "source": "06 avimelech", "type": "story"}, {"q": "18. מה ביקש אבימלך מנושא כליו לפני מותו ומדוע?", "a": "ביקש \"שלוף חרבך ומותתני\" כי לא רצה שיאמרו \"אישה הרגתהו\"", "source": "06 avimelech", "type": "story"}, {"q": "19. מהו \"פלח רכב\"?", "a": "אבן ריחיים עליונה", "source": "06 avimelech", "type": "story"}, {"q": "20. כיצד התקיימה נבואת משל יותם?", "a": "\"וישב אלוהים את רעת אבימלך\" - אבימלך נהרג ובעלי שכם נענשו, בדיוק כפי שניבא יותם שאש תצא ביניהם ותאכלם", "source": "06 avimelech", "type": "story"}, {"q": "21. ⭐⭐ לכמה ראשים (קבוצות) חילק אבימלך את צבאו כשארב על שכם, ולכמה ראשים חילק למחרת?", "a": "בלילה הראשון — **4 ראשים** (ט':ל\"ד); למחרת, כשתקף את אנשי השדה — **3 ראשים** (ט':מ\"ג). רבים מבלבלים עם גדעון שחילק ל-3.", "source": "06 avimelech", "type": "story"}, {"q": "22. ⭐⭐ מהו ההבדל בין \"בעלי שכם\" לבין \"בעלי מגדל שכם\" (אנשי מגדל שכם)?", "a": "בעלי שכם הם תושבי העיר שנהרגו בקרב ושכם נהרסה ונזרעה מלח (ט':מ\"ה). בעלי מגדל שכם (כאלף איש ואישה) נכנסו לצריח בית אל ברית ונשרפו בו חיים (ט':מ\"ו-מ\"ט).", "source": "06 avimelech", "type": "story"}, {"q": "23. ⭐⭐ היכן ישב אבימלך לאחר גירוש געל, ולפני שתקף שוב את שכם?", "a": "**בארומה** — \"וַיֵּשֶׁב אֲבִימֶלֶךְ בָּארוּמָה\" (ט':מ\"א)", "source": "06 avimelech", "type": "story"}, {"q": "24. ⭐⭐⭐ מהיכן כרת אבימלך את ענפי העצים ששרפו את הצריח?", "a": "מ**הר צלמון** — \"וַיַּעַל אֲבִימֶלֶךְ הַר צַלְמוֹן\" וכרת שוכת עצים ושם על שכמו (ט':מ\"ח)", "source": "06 avimelech", "type": "story"}, {"q": "25. ⭐⭐⭐ געל בן עבד ראה אנשים יורדים מכיוונים שונים. מאילו מקומות?", "a": "מ**ראשי ההרים**, מ**טבור הארץ**, ומ**דרך אלון מעוננים** (ט':ל\"ו-ל\"ז). זבול ניסה להרגיע אותו ואמר \"את צל ההרים אתה רואה כאנשים\".", "source": "06 avimelech", "type": "story"}, {"q": "26. ⭐⭐ מי היה \"חמור אבי שכם\" שגעל מזכיר בנאומו?", "a": "חמור היה אבי שכם — ראש השושלת המקורית של העיר שכם. געל טוען שיש לעבוד את אנשי חמור (השושלת המקורית) ולא את אבימלך שהוא זר (ט':כ\"ח).", "source": "06 avimelech", "type": "story"}, {"q": "1. ⭐⭐⭐ \"הֲמָשׁוֹל בָּכֶם שִׁבְעִים אִישׁ... אִם מְשֹׁל בָּכֶם אִישׁ אֶחָד\"", "a": "**מי אמר:** אבימלך\n**למי:** בעלי שכם (אחי אמו)\n**הקשר:** אבימלך משכנע את בעלי שכם לתמוך בו נגד 70 אחיו בני גדעון (שופטים ט':ב')", "source": "06 avimelech", "type": "story"}, {"q": "2. ⭐⭐⭐ \"שְׁלֹף חַרְבְּךָ וּמוֹתְתֵנִי פֶּן יֹאמְרוּ לִי אִשָּׁה הֲרָגָתְהוּ\"", "a": "**מי אמר:** אבימלך\n**למי:** נערו (נושא כליו)\n**הקשר:** אבימלך מבקש מנערו להורגו לאחר שאישה מתבץ רוצצה את גולגולתו בפלח רכב (שופטים ט':נ\"ד)", "source": "06 avimelech", "type": "story"}, {"q": "3. ⭐⭐⭐ \"מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם כִּי נַעַבְדֶנּוּ... עִבְדוּ אֶת אַנְשֵׁי חֲמוֹר אֲבִי שְׁכֶם\"", "a": "**מי אמר:** געל בן עבד\n**למי:** בעלי שכם\n**הקשר:** געל מסית את בעלי שכם נגד אבימלך, ומזלזל בו ובפקידו זבול. הוא מציע שבעלי שכם יעבדו את אנשי חמור (שושלת שכם המקורית) ולא את אבימלך (שופטים ט':כ\"ח)", "source": "06 avimelech", "type": "story"}, {"q": "4. ⭐⭐⭐ \"אַיֵּה אֵפוֹא פִיךָ אֲשֶׁר תֹּאמַר מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ... צֵא נָא עַתָּה וְהִלָּחֶם בּוֹ\"", "a": "**מי אמר:** זבול (שר/פקיד העיר)\n**למי:** געל בן עבד\n**הקשר:** זבול, שהיה נאמן לאבימלך, לועג לגעל כשצבא אבימלך מתקרב - \"איפה הפה הגדול שלך עכשיו?\" ומאתגר אותו לצאת להילחם (שופטים ט':ל\"ח)", "source": "06 avimelech", "type": "story"}, {"q": "5. ⭐⭐⭐ \"מָה רְאִיתֶם עָשִׂיתִי מַהֲרוּ עֲשׂוּ כָמוֹנִי\"", "a": "**מי אמר:** אבימלך\n**למי:** העם אשר עמו\n**הקשר:** אבימלך עלה להר צלמון, כרת שוכת עצים ושם על שכמו, וציווה על העם לעשות כמוהו כדי להעמיס ענפים על צריח מגדל שכם ולהציתו (שופטים ט':מ\"ח)", "source": "06 avimelech", "type": "story"}, {"q": "6. ⭐⭐⭐ \"הִנֵּה גַעַל בֶּן עֶבֶד וְאֶחָיו בָּאִים שְׁכֶמָה וְהִנָּם צָרִים אֶת הָעִיר עָלֶיךָ\"", "a": "**מי אמר:** זבול (שר העיר)\n**למי:** אבימלך\n**הקשר:** זבול שולח מלאכים **בתרמה** לאבימלך להודיע על המרד של געל, וממליץ לו לארוב בשדה בלילה ולתקוף בבוקר (שופטים ט':ל\"א-ל\"ג)", "source": "06 avimelech", "type": "story"}, {"q": "7. ⭐⭐⭐ \"אֵת צֵל הֶהָרִים אַתָּה רֹאֶה כָּאֲנָשִׁים\"", "a": "**מי אמר:** זבול\n**למי:** געל בן עבד\n**הקשר:** געל רואה את צבא אבימלך מתקרב ומזהיר. זבול, שיודע בדיוק מה קורה (הוא תיאם את המארב!), מרגיע אותו בכוונה ומשקר: \"זה רק צל ההרים\". רק כשהצבא כבר קרוב, זבול חושף את פניו ולועג לגעל (שופטים ט':ל\"ו)", "source": "06 avimelech", "type": "story"}, {"q": "1. ⭐ רצח 70 אחיו על אבן אחת, שלט שלוש שנים, אישה רוצצה את גולגולתו בפלח רכב", "a": "**הדמות:** אבימלך בן גדעון\n**ספר:** שופטים\n**הקשר:** אבימלך שכנע את בעלי שכם לתמוך בו, רצח 70 אחיו, שלט 3 שנים עד שרוח רעה הפרידה בינו לבעלי שכם, ונהרג בתבץ על ידי אישה שהשליכה פלח רכב על ראשו (פרק ט')", "source": "06 avimelech", "type": "story"}, {"q": "2. ⭐⭐⭐ הבן הצעיר שניצל מטבח, עלה על הר ונאם משל על עצים, ניבא חורבן הדדי", "a": "**הדמות:** יותם בן גדעון\n**ספר:** שופטים\n**הקשר:** יותם היחיד ששרד את רצח 70 האחים, עלה על הר גריזים ונאם את משל העצים והאטד — נבואה שהתגשמה כשאבימלך ובעלי שכם השמידו זה את זה (פרק ט')", "source": "06 avimelech", "type": "story"}, {"q": "3. ⭐⭐⭐ פקיד נאמן, שמע את דברי ההסתה, שלח הודעה בתרמה, לעג למסית כשהצבא התקרב", "a": "**הדמות:** זבול\n**ספר:** שופטים\n**הקשר:** זבול היה שר העיר שכם ונאמן לאבימלך. כששמע את געל מסית את בעלי שכם, שלח מלאכים בתרמה לאבימלך להזהירו. כשגעל ראה את צבא אבימלך מתקרב, זבול אמר לו \"צל ההרים אתה רואה כאנשים\", ואז אתגר אותו: \"איה פיך?\" (שופטים ט':ל'-ל\"ח)", "source": "06 avimelech", "type": "story"}, {"q": "4. ⭐⭐⭐ בא עם אחיו לעיר, בעלי העיר סמכו עליו, קילל את השליט בחגיגת בציר, אתגר אותו למלחמה — אבל הפסיד וגורש", "a": "**הדמות:** געל בן עבד\n**ספר:** שופטים\n**הקשר:** געל הגיע לשכם, בעלי שכם בטחו בו, בחגיגת הבציר קילל את אבימלך ואמר \"מי אבימלך... רבה צבאך וצאה\". אבל כשנלחם באבימלך — הפסיד, ברח, וזבול גירש אותו מהעיר (ט':כ\"ו-מ\"א)", "source": "06 avimelech", "type": "story"}, {"q": "5. ⭐⭐⭐ השליכה חפץ כבד מגובה, פצעה פציעה קטלנית, לא נזכרת בשם, ובכל זאת הפכה את מהלך הקרב", "a": "**הדמות:** האישה מתבץ\n**ספר:** שופטים\n**הקשר:** כשאבימלך ניגש לפתח מגדל תבץ לשרפו, \"וַתַּשְׁלֵךְ אִשָּׁה אַחַת פֶּלַח רֶכֶב עַל רֹאשׁ אֲבִימֶלֶךְ וַתָּרִץ אֶת גֻּלְגָּלְתּוֹ\". אבימלך כל כך ביזה את העובדה שאישה הרגה אותו, שביקש מנערו להמיתו (ט':נ\"ג-נ\"ד)", "source": "06 avimelech", "type": "story"}, {"q": "1. ⭐⭐ אבימלך היה בנו של גדעון מאשתו הראשית. נכון או לא נכון?", "a": "**לא נכון.** אבימלך היה בן גדעון מפילגשו שבשכם: \"ופילגשו אשר בשכם ילדה לו גם היא בן וישם את שמו אבימלך\" (שופטים ח':ל\"א).", "source": "06 avimelech", "type": "story"}, {"q": "2. ⭐⭐⭐ במשל יותם, הגפן סירב למלוך כי \"החדלתי את דשני\". נכון או לא נכון?", "a": "**לא נכון.** \"החדלתי את דשני\" הוא מה שאמר **הזית**, לא הגפן. הגפן אמר \"הֶחֳדַלְתִּי אֶת תִּירוֹשִׁי הַמְשַׂמֵּחַ אֱלֹהִים וַאֲנָשִׁים\" (שופטים ט':י\"ג). התאנה אמרה \"החדלתי את מתקי ואת תנובתי הטובה\" (ט':י\"א). שלושת העצים הטובים סירבו - כל אחד מסיבה אחרת.", "source": "06 avimelech", "type": "story"}, {"q": "3. ⭐⭐⭐ אבימלך מת בתבץ, אך נהרג בפועל ע\"י נושא כליו. נכון או לא נכון?", "a": "**חצי נכון, חצי לא.** אבימלך אכן מת בתבץ, ונושא כליו אכן דקר אותו - אבל הפציעה הקטלנית היתה מ**אישה** שהשליכה פלח רכב על ראשו ורוצצה את גולגולתו. אבימלך ביקש מנערו \"שלוף חרבך ומותתני\" רק כדי שלא יאמרו \"אישה הרגתהו\" (שופטים ט':נ\"ג-נ\"ד). הכתוב מייחס את מותו לאלוהים כעונש: \"וַיָּשֶׁב אֱלֹהִים אֵת רָעַת אֲבִימֶלֶךְ\" (ט':נ\"ו).", "source": "06 avimelech", "type": "story"}, {"q": "4. ⭐⭐⭐ אבימלך חילק את צבאו ל-3 ראשים כשארב על שכם. נכון או לא נכון?", "a": "**לא נכון.** כשארב על שכם בעקבות מידע מזבול, אבימלך חילק את צבאו ל-**4 ראשים** (אַרְבָּעָה רָאשִׁים, שופטים ט':ל\"ד). רק למחרת, כשחילק שוב לתקיפת אנשי השדה, חילק ל-3 ראשים (ט':מ\"ג). רבים מבלבלים עם גדעון שחילק ל-3 ראשים (ז':ט\"ז).", "source": "06 avimelech", "type": "story"}, {"q": "5. ⭐⭐⭐ יותם נשא את משלו מראש הר עיבל. נכון או לא נכון?", "a": "**לא נכון.** יותם עלה על הר **גריזים**, לא הר עיבל: \"וַיֵּלֶךְ וַיַּעֲמֹד בְּרֹאשׁ הַר גְּרִזִים\" (שופטים ט':ז'). שני ההרים סמוכים ליד שכם וקל לבלבל ביניהם.", "source": "06 avimelech", "type": "story"}, {"q": "6. ⭐⭐⭐ אבימלך שרף את צריח מגדל שכם ואת מגדל תבץ באש. נכון או לא נכון?", "a": "**לא נכון.** אבימלך שרף את **צריח מגדל שכם** בהצלחה (ט':מ\"ט). אבל בתבץ, כש**ניגש** לפתח המגדל לשרפו — אישה השליכה עליו פלח רכב והרגה אותו **לפני** שהספיק להצית (ט':נ\"ב-נ\"ג). אז רק מגדל שכם נשרף, לא מגדל תבץ.", "source": "06 avimelech", "type": "story"}, {"q": "7. ⭐⭐⭐ בעלי מגדל שכם נכנסו לצריח \"בית אל ברית\" — אותו מקום שממנו קיבל אבימלך 70 כסף. נכון או לא נכון?", "a": "**נכון.** בתחילת הסיפור אבימלך מקבל \"שִׁבְעִים כֶּסֶף מִבֵּית **בַּעַל בְּרִית**\" (ט':ד'). בסוף הסיפור בעלי מגדל שכם נכנסים \"אֶל צְרִיחַ בֵּית **אֵל בְּרִית**\" (ט':מ\"ו). \"בעל ברית\" ו\"אל ברית\" הם שמות לאותו מקדש — המקום שמימן את עלייתו לשלטון הוא המקום שבו מתו תומכיו.", "source": "06 avimelech", "type": "story"}, {"q": "1. ⭐⭐ \"הֶחֳדַלְתִּי אֶת דִּשְׁנִי אֲשֶׁר בִּי יְכַבְּדוּ אֱלֹהִים וַאֲנָשִׁים וְהָלַכְתִּי לָנוּעַ עַל הָעֵצִים\"", "a": "**מי אמר:** הזית (במשל יותם)\n**למי:** העצים שביקשו ממנו למלוך\n**הקשר:** העצים מבקשים מהזית למלוך. הזית מסרב — הדשן (השמן) שלו משמש לכבוד אלוהים ואנשים, והוא לא מוכן לוותר על ייעודו כדי \"לנוע על העצים\" (=לשלוט). במשל זה מייצג מנהיג ראוי שיש לו תפקיד חשוב יותר (ט':ט')", "source": "06 avimelech", "type": "story"}, {"q": "2. ⭐⭐ \"הֶחֳדַלְתִּי אֶת תִּירוֹשִׁי הַמְשַׂמֵּחַ אֱלֹהִים וַאֲנָשִׁים וְהָלַכְתִּי לָנוּעַ עַל הָעֵצִים\"", "a": "**מי אמר:** הגפן (במשל יותם)\n**למי:** העצים\n**הקשר:** הגפן הוא העץ השלישי שמסרב. התירוש (יין) משמח אלוהים ואנשים. שימו לב — הזית אומר \"יכבדו\" והגפן אומר \"המשמח\": כבוד vs שמחה. שלושת העצים הטובים מסרבים כי יש להם ערך עצמי (ט':י\"ג)", "source": "06 avimelech", "type": "story"}, {"q": "3. ⭐⭐⭐ \"אִם בֶּאֱמֶת אַתֶּם מֹשְׁחִים אֹתִי לְמֶלֶךְ עֲלֵיכֶם בֹּאוּ חֲסוּ בְצִלִּי וְאִם אַיִן תֵּצֵא אֵשׁ מִן הָאָטָד וְתֹאכַל אֶת אַרְזֵי הַלְּבָנוֹן\"", "a": "**מי אמר:** האטד (= אבימלך במשל)\n**למי:** העצים (= בעלי שכם)\n**הקשר:** האטד — שיח קוצני חסר ערך — הוא היחיד שמסכים למלוך. \"חסו בצלי\" זו אירוניה: לאטד אין צל. ה\"אש\" שמאיים — התגשמה כשאבימלך שרף את מגדל שכם. \"ארזי הלבנון\" = גם החזקים ביותר יושמדו (ט':ט\"ו)", "source": "06 avimelech", "type": "story"}, {"q": "4. ⭐⭐⭐ \"וְאַתֶּם קַמְתֶּם עַל בֵּית אָבִי הַיּוֹם וַתַּהַרְגוּ אֶת בָּנָיו שִׁבְעִים אִישׁ עַל אֶבֶן אֶחָת וַתַּמְלִיכוּ אֶת אֲבִימֶלֶךְ בֶּן אֲמָתוֹ עַל בַּעֲלֵי שְׁכֶם כִּי אֲחִיכֶם הוּא\"", "a": "**מי אמר:** יותם\n**למי:** בעלי שכם\n**הקשר:** אחרי המשל, יותם עובר לדבר ישירות. שימו לב — הוא קורא לאבימלך \"בן אמתו\" (בן השפחה/פילגש), ומאשים את בעלי שכם שהמליכו אותו רק \"כי אחיכם הוא\" — קרבת משפחה דרך אם, לא בגלל כישוריו (ט':י\"ח)", "source": "06 avimelech", "type": "story"}, {"q": "5. ⭐⭐⭐ \"וּמִי יִתֵּן אֶת הָעָם הַזֶּה בְּיָדִי וְאָסִירָה אֶת אֲבִימֶלֶךְ וַיֹּאמֶר לַאֲבִימֶלֶךְ רַבֶּה צְבָאֲךָ וָצֵאָה\"", "a": "**מי אמר:** געל בן עבד\n**למי:** בעלי שכם (בחגיגת הבציר), ובאתגר — לאבימלך (בעקיפין)\n**הקשר:** געל שותה ביין בחגיגת הבציר, מקלל את אבימלך, ומאתגר: \"רבה צבאך וצאה!\" (הגדל את צבאך ובוא להילחם). אבל כשבאמת הגיע הרגע — געל הפסיד וברח (ט':כ\"ט)", "source": "06 avimelech", "type": "story"}, {"q": "6. ⭐⭐ \"וַיִּתֹּץ אֶת הָעִיר וַיִּזְרָעֶהָ מֶלַח\"", "a": "**על מי:** אבימלך\n**איזו עיר:** שכם\n**הקשר:** אחרי שכבש את שכם, אבימלך לא הסתפק בהריגת התושבים — הוא הרס את העיר פיזית וזרע בה מלח. זריעת מלח היא פעולה סמלית של החרמה — שהמקום לא ישוב לשגשג. זו \"האש\" שניבא יותם (ט':מ\"ה)", "source": "06 avimelech", "type": "story"}, {"q": "7. ⭐⭐⭐ \"וַתָּבֹא אֲלֵיהֶם קִלְלַת יוֹתָם בֶּן יְרֻבָּעַל\"", "a": "**על מי:** על אבימלך ועל אנשי שכם\n**הקשר:** הפסוק האחרון בפרק (ט':נ\"ז). הכתוב מסכם שכל מה שקרה — מות אנשי שכם, מות אבימלך — הוא קיום נבואת/קללת יותם ממשל העצים. \"תצא אש מאבימלך ותאכל את בעלי שכם, ותצא אש מבעלי שכם ותאכל את אבימלך\" (ט':כ') — וכך בדיוק קרה.", "source": "06 avimelech", "type": "story"}, {"q": "8. ⭐⭐⭐ \"נִלְחַם אָבִי עֲלֵיכֶם וַיַּשְׁלֵךְ אֶת נַפְשׁוֹ מִנֶּגֶד וַיַּצֵּל אֶתְכֶם מִיַּד מִדְיָן\"", "a": "**מי אמר:** יותם\n**למי:** בעלי שכם\n**הקשר:** יותם מזכיר לבעלי שכם שאביו גדעון (ירובעל) סיכן את חייו כדי להציל אותם ממדין — ובתמורה הם קמו על בית אביו, רצחו 70 בנים, והמליכו את אבימלך בן הפילגש. זוהי הטענה המוסרית של יותם לפני הנבואה (ט':י\"ז)", "source": "06 avimelech", "type": "story"}, {"q": "1. מה ידוע על יאיר הגלעדי?", "a": "שפט ישראל 22 שנה. לו 30 בנים רוכבים על 30 עיירים בעלי 30 ערים בגלעד (\"חוות יאיר\"). נקבר בקמון", "source": "07 tolah yair", "type": "story"}, {"q": "2. באילו אלהים עבדו ישראל כשחזרו לחטוא?", "a": "בעלים ועשתרות, ואלהי ארם, צידון, מואב, עמון ופלשתים — שבעה סוגי אלהי נכר", "source": "07 tolah yair", "type": "story"}, {"q": "3. מה אמר ה' כשישראל זעקו \"חטאנו\"?", "a": "תוכחה: \"הלא הושעתיכם ממצרים, מאמוריים, מעמונים, פלשתים, צידונים, עמלק ומעון — ואתם עזבתם אותי. לא אוסיף להושיע. לכו וזעקו לאלהים שבחרתם\"", "source": "07 tolah yair", "type": "story"}, {"q": "4. כיצד שונה תגובת ישראל בפרק זה מהדפוס הרגיל?", "a": "ה' דוחה את תחינתם בפעם הראשונה. ישראל לא רק זועקים — הם מסירים את אלהי הנכר בפועל ועובדים ה'. רק אז \"ותקצר נפשו בעמל ישראל\"", "source": "07 tolah yair", "type": "story"}, {"q": "5. מה פירוש \"ותקצר נפשו בעמל ישראל\"?", "a": "ה' לא יכול היה עוד לסבול את סבל ישראל — כאב לו עליהם. ביטוי לרחמיו שגרמו לו לסייע למרות הסירוב הראשוני", "source": "07 tolah yair", "type": "story"}, {"q": "6. מה שאלו שרי גלעד בסוף הפרק?", "a": "\"מי האיש אשר יחל להילחם בבני עמון יהיה לראש לכל יושבי גלעד\" — חיפוש מנהיג צבאי שיקבל תמורה: ראשות גלעד", "source": "07 tolah yair", "type": "story"}, {"q": "1. ⭐⭐ \"לָכֵן לֹא-אוֹסִיף לְהוֹשִׁיעַ אֶתְכֶם\"", "a": "**מי אמר:** ה'\n**למי:** בני ישראל\n**הקשר:** תגובת ה' לתחינת ישראל לאחר שחזרו לחטוא ונלחצו — ה' מציין שהושיעם פעמים רבות ועתה הם עזבוהו (שופטים י':י\"ג)", "source": "07 tolah yair", "type": "story"}, {"q": "2. ⭐⭐⭐ \"חָטָאנוּ עֲשֵׂה-אַתָּה לָנוּ כְּכֹל-הַטּוֹב בְּעֵינֶיךָ אַךְ הַצִּילֵנוּ נָא הַיּוֹם הַזֶּה\"", "a": "**מי אמר:** בני ישראל\n**למי:** ה'\n**הקשר:** לאחר שה' דחה את תחינתם הראשונה, ישראל מקבלים עליהם ומסירים אלהי הנכר — ומתחננים שנית (שופטים י':ט\"ו)", "source": "07 tolah yair", "type": "story"}, {"q": "1. ⭐⭐ לתולע היו 30 בנים רוכבים על 30 עיירים. נכון או לא נכון?", "a": "**לא נכון.** לתולע אין מידע על בנים. הסיפור הזה שייך ל**יאיר הגלעדי**: \"ויהי-לו שלשים בנים רוכבים על שלשים עיירים\" (שופטים י':ד).", "source": "07 tolah yair", "type": "story"}, {"q": "2. ⭐⭐ ה' הסכים להושיע את ישראל מיד כשזעקו \"חטאנו\". נכון או לא נכון?", "a": "**לא נכון.** ה' **תחילה דחה** את תחינתם ואמר: \"לא אוסיף להושיע אתכם\". רק לאחר שישראל הסירו את אלהי הנכר ועבדו ה' — \"ותקצר נפשו בעמל ישראל\" — הוא ריחם (שופטים י':י\"ג-ט\"ז).", "source": "07 tolah yair", "type": "story"}, {"q": "1. ⭐⭐ שופט 22 שנה, 30 בנים על 30 עיירים, 30 ערים בגלעד על שמו", "a": "**הדמות:** יאיר הגלעדי\n**ספר:** שופטים\n**הקשר:** פרק י' — שופט קטן, נקבר בקמון", "source": "07 tolah yair", "type": "story"}, {"q": "2. ⭐ שופט 23 שנה, שבט יששכר, ישב בשמיר, נקבר שם", "a": "**הדמות:** תולע בן פואה\n**ספר:** שופטים\n**הקשר:** פרק י' — ראשון השופטים הקטנים לאחר אבימלך", "source": "07 tolah yair", "type": "story"}, {"q": "1. מדוע גורש יפתח מבית אביו, ולאן הלך?", "a": "אחיו הלגיטימיים גרשוהו: \"לא תנחל בבית אבינו כי בן אישה אחרת אתה\" — בן פילגש. יפתח ברח וישב בארץ טוב, שם התלקטו אליו \"אנשים ריקים\"", "source": "08 yiftach", "type": "story"}, {"q": "2. כיצד הגיב יפתח לפנייה של זקני גלעד, ומה ביקש בתמורה?", "a": "העיר: \"הלא אתם שנאתם אותי ותגרשוני — מדוע באתם עתה כאשר צר לכם?\" ביקש: אם ה' יתן בני עמון בידו — יהיה לראש לכל יושבי גלעד", "source": "08 yiftach", "type": "story"}, {"q": "3. מה היה הטיעון המרכזי של יפתח לדיפלומטיה מול עמון?", "a": "ה' נתן את הארץ לישראל לאחר שסיחון מלך האמורי לחם בהם. \"שלש מאות שנה ישבתם — למה לא תבעתם אז?\" ועכשיו לא צדק לתבוע. \"ישפוט ה' השופט\"", "source": "08 yiftach", "type": "story"}, {"q": "4. מה היה נדר יפתח לפני המלחמה?", "a": "\"אם נתון תתן את בני עמון בידי — והיה היוצא אשר יצא מדלתי ביתי לקראתי בשובי בשלום מבני עמון והיה לה' והעליתיהו עולה\"", "source": "08 yiftach", "type": "story"}, {"q": "5. מה קרה כשיפתח שב מהמלחמה?", "a": "בתו יצאה לקראתו בתוף ומחולות — יחידתו. יפתח קרע בגדיו: \"אהה בתי הכה הכאתיני — פציתי פי אל ה' ולא אוכל לשוב\"", "source": "08 yiftach", "type": "story"}, {"q": "6. מה ביקשה הבת לאחר ששמעה על הנדר?", "a": "אמרה לאביה \"עשה לי כאשר יצא מפיך\" — וביקשה בקשה אחת: שני חודשים ללכת עם רעותיה להרים ולבכות על בתוליה", "source": "08 yiftach", "type": "story"}, {"q": "7. מה החוק שנהיה בישראל בעקבות מות בת יפתח?", "a": "\"מימים ימימה תלכנה בנות ישראל לתנות לבת יפתח הגלעדי ארבעת ימים בשנה\"", "source": "08 yiftach", "type": "story"}, {"q": "1. ⭐⭐ \"הֲלֹא אַתֶּם שְׂנֵאתֶם אוֹתִי וַתְּגָרְשׁוּנִי מִבֵּית אָבִי וּמַדּוּעַ בָּאתֶם אֵלַי עַתָּה כַּאֲשֶׁר צַר לָכֶם\"", "a": "**מי אמר:** יפתח\n**למי:** זקני גלעד\n**הקשר:** כשזקני גלעד באו לקרוא ליפתח מארץ טוב לעזור בלחימה בעמון (שופטים י\"א:ז)", "source": "08 yiftach", "type": "story"}, {"q": "2. ⭐⭐⭐ \"אֲהָהּ בִּתִּי הַכֵּה הִכֵּאתִנִי וְאַתְּ הָיִית בְּעֹכְרָי\"", "a": "**מי אמר:** יפתח\n**למי:** בתו\n**הקשר:** כשבתו יצאה לקראתו בתוף ומחולות לאחר הניצחון — ונזכר בנדרו (שופטים י\"א:לה)", "source": "08 yiftach", "type": "story"}, {"q": "3. ⭐⭐ \"אָבִי פָּצִיתָה אֶת-פִּיךָ אֶל-ה' עֲשֵׂה לִי כַּאֲשֶׁר יָצָא מִפִּיךָ\"", "a": "**מי אמר:** בת יפתח\n**למי:** יפתח אביה\n**הקשר:** הבת מקבלת את גזר הנדר בהכנעה ומבקשת רק שני חודשים (שופטים י\"א:לו)", "source": "08 yiftach", "type": "story"}, {"q": "1. ⭐⭐ יפתח שלח מלאכים למלך עמון לפני המלחמה, ומלך עמון הסכים לשלום. נכון או לא נכון?", "a": "**לא נכון.** מלך עמון **לא שמע** לדברי יפתח: \"ולא שמע מלך בני-עמון אל דברי יפתח אשר שלח אליו\" (שופטים י\"א:כח).", "source": "08 yiftach", "type": "story"}, {"q": "2. ⭐⭐ לבת יפתח היו אחים. נכון או לא נכון?", "a": "**לא נכון.** הפסוק מדגיש: \"והיא יחידה — **אין לו ממנה בן או בת**\" (שופטים י\"א:לד).", "source": "08 yiftach", "type": "story"}, {"q": "3. ⭐⭐⭐ יפתח הלך מיד למלחמה ללא ניסיון דיפלומטיה. נכון או לא נכון?", "a": "**לא נכון.** יפתח שלח **מלאכים** למלך עמון ניסיון שלום — ורק לאחר שהמלך לא שמע, ורוח ה' הייתה עליו, יצא למלחמה (שופטים י\"א:יב-כט).", "source": "08 yiftach", "type": "story"}, {"q": "1. ⭐ גיבור חיל, מגורש על ידי אחיו, מנהיג בעת מלחמה, נודר נדר קשה", "a": "**הדמות:** יפתח הגלעדי\n**ספר:** שופטים\n**הקשר:** פרק י\"א — שופט גלעד", "source": "08 yiftach", "type": "story"}, {"q": "2. ⭐⭐⭐ יצאה בתוף ומחולות, מקבלת גזרה, מבקשת שני חודשים, ד' ימים בשנה מוקדשים לה", "a": "**הדמות:** בת יפתח (שמה לא נזכר בתנ\"ך)\n**ספר:** שופטים\n**הקשר:** פרק י\"א — יחידת יפתח", "source": "08 yiftach", "type": "story"}, {"q": "1. מדוע כעסו אנשי אפרים על יפתח?", "a": "טענו שלא הוזמנו להילחם בבני עמון — ואיימו: \"ביתך באש נשרוף עליך\"", "source": "09 shibboleth and small judges", "type": "story"}, {"q": "2. כיצד השיב יפתח לאפרים?", "a": "\"קראתי אתכם ולא הושעתם אותי — ראיתי כי אינך מושיע, ושמתי נפשי בכפי ועברתי אל בני עמון\"", "source": "09 shibboleth and small judges", "type": "story"}, {"q": "3. כיצד בדקו הגלעדים מי הוא אפרתי?", "a": "ביקשו ממנו לומר \"שיבולת\". אפרתי הגה \"סיבולת\" — ולא יכול לדבר כן — ומוצא להורג במעברות הירדן", "source": "09 shibboleth and small judges", "type": "story"}, {"q": "4. כמה אפרים נפלו בפרשה?", "a": "42,000 איש", "source": "09 shibboleth and small judges", "type": "story"}, {"q": "5. מה מיוחד באבצן מבית לחם?", "a": "30 בנים ו-30 בנות — 30 שלח לחוץ (נישאו לחוץ) ו-30 הביא לבניו מן החוץ. שפט 7 שנים, נקבר בבית לחם", "source": "09 shibboleth and small judges", "type": "story"}, {"q": "6. מה מיוחד בעבדון בן ה
