 ישראל. נכון או לא נכון?", "a": "**לא נכון.** כשיהושע שאל \"הלנו אתה אם לצרינו\", שר צבא ה' ענה \"**לא**\" ואמר \"כי אני שר צבא ה' עתה באתי\" (יהושע ה':י\"ד). הוא לא הצהיר שהוא בצד ישראל, אלא שהוא בא כשר צבא ה'.", "source": "04 conquest of jericho", "type": "story"}, {"q": "1. ⭐⭐⭐ \"שַׁל נַעַלְךָ מֵעַל רַגְלֶךָ כִּי הַמָּקוֹם אֲשֶׁר אַתָּה עֹמֵד עָלָיו קֹדֶשׁ הוּא\"", "a": "**מי אמר:** שר צבא ה'\n**למי:** יהושע\n**הקשר:** שר צבא ה' מצווה את יהושע לחלוץ נעלו כי המקום קדוש, בדומה לציווי ה' למשה בסנה הבוער (יהושע ה':ט\"ו)", "source": "04 conquest of jericho", "type": "story"}, {"q": "2. ⭐⭐⭐ \"הָרִיעוּ כִּי נָתַן ה' לָכֶם אֶת הָעִיר\"", "a": "**מי אמר:** יהושע\n**למי:** העם\n**הקשר:** יהושע מצווה את העם להריע בפעם השביעית ביום השביעי, לפני נפילת חומת יריחו (יהושע ו':ט\"ז)", "source": "04 conquest of jericho", "type": "story"}, {"q": "3. ⭐⭐⭐ \"הַיּוֹם גַּלּוֹתִי אֶת חֶרְפַּת מִצְרַיִם מֵעֲלֵיכֶם\"", "a": "**מי אמר:** ה'\n**למי:** יהושע (ובני ישראל)\n**הקשר:** ה' מסביר את משמעות המילה בגלגל - גילגול/הסרת חרפת מצרים (יהושע ה':ט')", "source": "04 conquest of jericho", "type": "story"}, {"q": "1. ⭐⭐ \"וִירִיחוֹ סֹגֶרֶת וּמְסֻגֶּרֶת מִפְּנֵי בְּנֵי יִשְׂרָאֵל אֵין _____ וְאֵין בָּא\"", "a": "**מילה חסרה:** יוֹצֵא\n**מי אמר:** הכתוב (תיאור)\n**הקשר:** תיאור מצב יריחו הסגורה לפני הכיבוש (יהושע ו':א')", "source": "04 conquest of jericho", "type": "story"}, {"q": "2. ⭐⭐⭐ \"אָרוּר הָאִישׁ לִפְנֵי ה' אֲשֶׁר יָקוּם וּבָנָה אֶת הָעִיר הַזֹּאת אֶת יְרִיחוֹ בִּ_____ יְיַסְּדֶנָּה וּבִצְעִירוֹ יַצִּיב דְּלָתֶיהָ\"", "a": "**מילה חסרה:** בְכֹרוֹ\n**מי אמר:** יהושע\n**הקשר:** שבועת הקללה של יהושע על מי שיבנה מחדש את יריחו (יהושע ו':כ\"ו)", "source": "04 conquest of jericho", "type": "story"}, {"q": "3. ⭐⭐ \"עֲשֵׂה לְךָ חַרְבוֹת _____ וְשׁוּב מֹל אֶת בְּנֵי יִשְׂרָאֵל שֵׁנִית\"", "a": "**מילה חסרה:** צֻרִים\n**מי אמר:** ה'\n**הקשר:** ה' מצווה את יהושע למול את בני ישראל בסכיני אבן (יהושע ה':ב')", "source": "04 conquest of jericho", "type": "story"}, {"q": "4. ⭐⭐⭐ \"לֹא כִּי אֲנִי שַׂר _____ ה' עַתָּה בָאתִי\"", "a": "**מילה חסרה:** צְבָא\n**מי אמר:** שר צבא ה'\n**הקשר:** המלאך מזדהה בפני יהושע כשר צבא ה' (יהושע ה':י\"ד)", "source": "04 conquest of jericho", "type": "story"}, {"q": "1. מי מעל בחרם של יריחו?", "a": "עכן בן כרמי בן זבדי בן זרח למטה יהודה", "source": "05 sin of achan", "type": "story"}, {"q": "2. לאיזה שבט שייך עכן?", "a": "שבט יהודה", "source": "05 sin of achan", "type": "story"}, {"q": "3. היכן ממוקמת העי?", "a": "ליד בית און, מקדם לבית אל", "source": "05 sin of achan", "type": "story"}, {"q": "4. כמה לוחמים שלח יהושע לכבוש את העי בפעם הראשונה?", "a": "כשלושת אלפים איש", "source": "05 sin of achan", "type": "story"}, {"q": "5. מדוע המרגלים המליצו לא לשלוח את כל העם?", "a": "כי אנשי העי מעטים - \"אל תייגע שמה את כל העם כי מעט המה\"", "source": "05 sin of achan", "type": "story"}, {"q": "6. כמה הרוגים נפלו מישראל בתבוסה בעי?", "a": "כשלושים ושישה איש", "source": "05 sin of achan", "type": "story"}, {"q": "7. עד היכן רדפו אנשי העי את ישראל?", "a": "לפני השער עד השברים, והיכום במורד", "source": "05 sin of achan", "type": "story"}, {"q": "8. מה עשה יהושע כשנודע לו על התבוסה?", "a": "קרע שמלותיו, נפל על פניו ארצה לפני ארון ה' עד הערב, הוא וזקני ישראל העלו עפר על ראשם", "source": "05 sin of achan", "type": "story"}, {"q": "9. מה ה' אומר ליהושע על סיבת התבוסה?", "a": "\"חטא ישראל\" - גם עברו את בריתו, גם לקחו מן החרם, גם גנבו, גם כיחשו, וגם שמו בכליהם", "source": "05 sin of achan", "type": "story"}, {"q": "10. מהם ארבעת שלבי הגורל לגילוי החוטא ומה היה סדר הלכידה?", "a": "שבט, משפחה, בית, גבר. בפועל: נלכד שבט יהודה, ממנו משפחת הזרחי, ממנה זבדי, ומביתו עכן", "source": "05 sin of achan", "type": "story"}, {"q": "11. מה אמר יהושע לעכן לפני שחשף את חטאו?", "a": "\"בני שים נא כבוד לה' אלוהי ישראל ותן לו תודה והגד נא לי מה עשית אל תכחד ממני\"", "source": "05 sin of achan", "type": "story"}, {"q": "12. מה בדיוק גנב עכן מהשלל?", "a": "אדרת שנער אחת טובה, מאתיים שקלים כסף, ולשון זהב אחד חמישים שקלים משקלו", "source": "05 sin of achan", "type": "story"}, {"q": "13. היכן הטמין עכן את השלל?", "a": "באדמה בתוך אוהלו, והכסף תחת האדרת", "source": "05 sin of achan", "type": "story"}, {"q": "14. מה העונש של עכן?", "a": "נרגם באבנים ונשרף באש, יחד עם בניו, בנותיו, שורו, חמורו, צאנו, אוהלו וכל אשר לו", "source": "05 sin of achan", "type": "story"}, {"q": "15. היכן נענש עכן ומדוע נקרא המקום כך?", "a": "בעמק עכור - על שם \"מה עכרתנו\" שאמר יהושע", "source": "05 sin of achan", "type": "story"}, {"q": "16. מה הוקם על עכן לאחר מותו?", "a": "גל אבנים גדול", "source": "05 sin of achan", "type": "story"}, {"q": "17. מה קרה לאחר עונש עכן?", "a": "ה' שב מחרון אפו", "source": "05 sin of achan", "type": "story"}, {"q": "18. ⭐⭐⭐ מהם ארבעת שלבי הגורל כפי שה' הגדיר אותם?", "a": "שבטים, משפחות, בתים, גברים - \"ונקרבתם בבוקר לשבטיכם... למשפחות... לבתים... לגברים\" (פסוק יד)", "source": "05 sin of achan", "type": "story"}, {"q": "19. ⭐⭐ מה שם משפחתו של עכן?", "a": "משפחת הזרחי (פסוק יז)", "source": "05 sin of achan", "type": "story"}, {"q": "20. ⭐⭐⭐ עד היכן רדפו אנשי העי את ישראל והיכן היכום?", "a": "\"לפני השער עד השברים ויכום במורד\" (פסוק ה)", "source": "05 sin of achan", "type": "story"}, {"q": "21. ⭐⭐ מה עשו יהושע וזקני ישראל כשנודע להם על התבוסה?", "a": "קרעו שמלותיהם, נפלו על פניהם ארצה לפני ארון ה' עד הערב, והעלו עפר על ראשם (פסוק ו)", "source": "05 sin of achan", "type": "story"}, {"q": "1. ⭐⭐⭐ \"קוּם לָךְ לָמָּה זֶּה אַתָּה נֹפֵל עַל פָּנֶיךָ\"", "a": "**מי אמר:** ה'\n**למי:** יהושע\n**הקשר:** ה' מוכיח את יהושע לאחר התבוסה בעי ומגלה שישראל חטאו (יהושע ז':י')", "source": "05 sin of achan", "type": "story"}, {"q": "2. ⭐⭐ \"בְּנִי שִׂים נָא כָבוֹד לַה'... וְהַגֶּד נָא לִי מֶה עָשִׂיתָ\"", "a": "**מי אמר:** יהושע\n**למי:** עכן בן כרמי\n**הקשר:** יהושע חוקר את עכן על גניבת החרם ביריחו (יהושע ז':י\"ט)", "source": "05 sin of achan", "type": "story"}, {"q": "1. ⭐ לקח מן החרם, הסתיר גניבתו באוהלו, גרם לתבוסה בקרב, נסקל בעמק עכור", "a": "**הדמות:** עכן בן כרמי\n**ספר:** יהושע\n**הקשר:** עכן לקח מחרם יריחו אדרת שנער, כסף וזהב, הטמין באוהלו, גרם לתבוסת ישראל בעי, ונסקל בעמק עכור (פרק ז')", "source": "05 sin of achan", "type": "story"}, {"q": "1. ⭐ עכן נענש כי לקח מן השלל של יריחו גם זהב, גם כסף וגם אדרת שנער. נכון או לא נכון?", "a": "**נכון.** \"ואראה בשלל אדרת שנער אחת טובה ומאתים שקלים כסף ולשון זהב אחד חמישים שקלים משקלו\" (יהושע ז':כ\"א).", "source": "05 sin of achan", "type": "story"}, {"q": "1. ⭐ רחב, המרגלים, כלב, אלעזר הכהן, עכן - מי מהם גרם לתבוסה צבאית?", "a": "**התשובה:** עכן - הוא היחיד שגרם לתבוסה. עכן לקח מן החרם ובגלל חטאו ישראל ניגפו בעי (יהושע ז'). רחב הצילה את המרגלים (פרק ב'), המרגלים ריגלו בהצלחה, כלב היה מרגל נאמן, ואלעזר שירת ככהן.", "source": "05 sin of achan", "type": "story"}, {"q": "2. ⭐⭐⭐ עכן הטמין את השלל בתוך אוהלו, כשהכסף היה מעל האדרת. נכון או לא נכון?", "a": "**לא נכון.** עכן הטמין את השלל באדמה בתוך אוהלו, אך **הכסף היה תחת האדרת**, לא מעליה: \"והנם טמונים בארץ בתוך האהלי **והכסף תחתיה**\" (יהושע ז':כ\"א).", "source": "05 sin of achan", "type": "story"}, {"q": "3. ⭐⭐⭐ עכן היה משבט בנימין. נכון או לא נכון?", "a": "**לא נכון.** עכן היה משבט **יהודה**: \"עכן בן כרמי בן זבדי בן זרח **למטה יהודה**\" (יהושע ז':א'). בתהליך הגורל, שבט יהודה נלכד ראשון (ז':ט\"ז).", "source": "05 sin of achan", "type": "story"}, {"q": "4. ⭐⭐⭐ בתבוסה בעי נפלו כשלושים איש מישראל. נכון או לא נכון?", "a": "**לא נכון.** נפלו **כשלושים ושישה** איש: \"ויכו מהם אנשי העי **כשלושים וששה** איש\" (יהושע ז':ה').", "source": "05 sin of achan", "type": "story"}, {"q": "5. ⭐⭐⭐ עכן הודה בחטאו רק לאחר שמצאו את השלל באוהלו. נכון או לא נכון?", "a": "**לא נכון.** עכן הודה **לפני** שנשלחו מלאכים לבדוק באוהלו: קודם יהושע אמר לו \"שים נא כבוד\" ועכן הודה (ז':כ'-כ\"א), ורק אחר כך שלח יהושע מלאכים לאוהל ומצאו שם את השלל (ז':כ\"ב-כ\"ג).", "source": "05 sin of achan", "type": "story"}, {"q": "2. ⭐⭐⭐ שבטו נלכד ראשון בגורל, משפחתו הזרחי, סב-סבו זרח, הודה בגניבת אדרת ומטילי מתכת", "a": "**הדמות:** עכן בן כרמי\n**ספר:** יהושע\n**הקשר:** בתהליך הגורלות נלכד שבט יהודה, ממנו משפחת הזרחי, ממנה זבדי, ולבסוף עכן. הודה שגנב אדרת שנער, כסף ולשון זהב מחרם יריחו (פרק ז')", "source": "05 sin of achan", "type": "story"}, {"q": "1. ⭐⭐ \"חָטָא יִשְׂרָאֵל וְגַם עָבְרוּ אֶת בְּרִיתִי... וְגַם לָקְחוּ מִן הַחֵרֶם וְגַם _____ וְגַם כִּחֲשׁוּ\"", "a": "**מילה חסרה:** גָּנְבוּ\n**מי אמר:** ה'\n**הקשר:** ה' מפרט ליהושע את חטאי ישראל שגרמו לתבוסה בעי (יהושע ז':י\"א)", "source": "05 sin of achan", "type": "story"}, {"q": "2. ⭐⭐⭐ \"וָאֶרְאֶה בַשָּׁלָל אַדֶּרֶת _____ אַחַת טוֹבָה וּמָאתַיִם שְׁקָלִים כֶּסֶף\"", "a": "**מילה חסרה:** שִׁנְעָר\n**מי אמר:** עכן\n**הקשר:** עכן מודה ליהושע ומפרט את הפריטים שגנב מחרם יריחו (יהושע ז':כ\"א)", "source": "05 sin of achan", "type": "story"}, {"q": "3. ⭐⭐ \"מֶה _____ יַעְכָּרְךָ ה' בַּיּוֹם הַזֶּה\"", "a": "**מילה חסרה:** עֲכַרְתָּנוּ\n**מי אמר:** יהושע\n**הקשר:** יהושע פונה לעכן לפני ביצוע העונש, ומשחק על שמו - \"עכרתנו/עכן\" (יהושע ז':כ\"ה)", "source": "05 sin of achan", "type": "story"}, {"q": "4. ⭐⭐⭐ \"וְלֹא יֻכְלוּ בְּנֵי יִשְׂרָאֵל לָקוּם לִפְנֵי אֹיְבֵיהֶם... לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם אִם לֹא תַשְׁמִידוּ _____ מִקִּרְבְּכֶם\"", "a": "**מילה חסרה:** הַחֵרֶם\n**מי אמר:** ה'\n**הקשר:** ה' מזהיר את יהושע שלא ימשיך להיות עם ישראל כל עוד החרם בקרבם (יהושע ז':י\"ב)", "source": "05 sin of achan", "type": "story"}, {"q": "1. מה ה' אומר ליהושע לפני כיבוש העי בפעם השנייה?", "a": "\"אל תירא ואל תחת, קח עמך את כל עם המלחמה\" - ושה' נתן בידו את מלך העי ואת עמו", "source": "06 conquest of ai", "type": "story"}, {"q": "2. מה הטקטיקה שיהושע משתמש בה לכיבוש העי?", "a": "מארב - שלח לוחמים מאחורי העיר בלילה, ויהושע והעם הראשי התקרבו מצפון. כשאנשי העי יצאו נגדם, נסו, וכשהעיר התרוקנה, המארב נכנס והצית אש", "source": "06 conquest of ai", "type": "story"}, {"q": "3. כמה אנשים שלח יהושע למארב?", "a": "30,000 איש (או 5,000 לפי פסוק 12)", "source": "06 conquest of ai", "type": "story"}, {"q": "4. היכן הוצב המארב?", "a": "בין בית אל ובין העי, מאחורי העיר", "source": "06 conquest of ai", "type": "story"}, {"q": "5. כיצד פיתו את אנשי העי לצאת מהעיר?", "a": "יהושע והעם נסו לפניהם כמו בפעם הראשונה, ואנשי העי רדפו אחריהם והעיר התרוקנה", "source": "06 conquest of ai", "type": "story"}, {"q": "6. מה יהושע נטה לעבר העי?", "a": "את הכידון שבידו, ולא הוריד את ידו עד השלמת הניצחון (בדומה למשה מול עמלק)", "source": "06 conquest of ai", "type": "story"}, {"q": "7. מה קרה למלך העי?", "a": "נתפס חי, הובא ליהושע, ונתלה על העץ עד הערב", "source": "06 conquest of ai", "type": "story"}, {"q": "8. כמה אנשי העי נפלו?", "a": "12,000 - כל אנשי העי", "source": "06 conquest of ai", "type": "story"}, {"q": "9. היכן בנה יהושע מזבח לה' אחרי הניצחון?", "a": "בהר עיבל, כאשר ציווה משה", "source": "06 conquest of ai", "type": "story"}, {"q": "10. מה כתב יהושע על האבנים בהר עיבל?", "a": "את משנה תורת משה", "source": "06 conquest of ai", "type": "story"}, {"q": "11. כיצד עמדו ישראל במעמד הר עיבל?", "a": "חציים מול הר גריזים וחציים מול הר עיבל, משני צדי הארון", "source": "06 conquest of ai", "type": "story"}, {"q": "12. מה קרא יהושע במעמד?", "a": "את כל דברי התורה, הברכה והקללה", "source": "06 conquest of ai", "type": "story"}, {"q": "13. מה עשו למלך העי בסוף היום?", "a": "הורידו את גופתו מהעץ עד הערב (כפי שמצווה התורה)", "source": "06 conquest of ai", "type": "story"}, {"q": "14. מאיזה פסוק: \"נטה בכידון אשר בידך אל העי\"?", "a": "פרק ח פסוק יח", "source": "06 conquest of ai", "type": "story"}, {"q": "15. ⭐⭐ כמה היו כל אנשי העי שנפלו ביום הקרב?", "a": "שנים עשר אלף (12,000) - כל אנשי העי, מאיש ועד אשה (פרק ח פסוק כה)", "source": "06 conquest of ai", "type": "story"}, {"q": "16. ⭐⭐⭐ בין אילו שני מקומות הוצב המארב?", "a": "בין בית אל ובין העי, מאחורי העיר", "source": "06 conquest of ai", "type": "story"}, {"q": "17. ⭐⭐ מה עשה יהושע עם גופת מלך העי בערב?", "a": "הורידו מהעץ בערב (כפי שמצווה התורה)", "source": "06 conquest of ai", "type": "story"}, {"q": "18. ⭐⭐⭐ מהם שני המספרים השונים המופיעים בפרק לגבי גודל המארב?", "a": "30,000 איש (פסוק ג) ו-5,000 איש (פסוק יב)", "source": "06 conquest of ai", "type": "story"}, {"q": "1. ⭐⭐ \"אַל תִּירָא וְאַל תֵּחָת... כַּאֲשֶׁר עָשִׂיתָ לִירִיחוֹ\"", "a": "**מי אמר:** ה'\n**למי:** יהושע\n**הקשר:** ה' מעודד את יהושע לפני הקרב השני על העי (יהושע ח':א')", "source": "06 conquest of ai", "type": "story"}, {"q": "2. ⭐⭐⭐ \"נְטֵה בַכִּידוֹן אֲשֶׁר בְּיָדְךָ אֶל הָעָי\"", "a": "**מי אמר:** ה'\n**למי:** יהושע\n**הקשר:** ה' מצווה את יהושע לנטות את הכידון לעבר העי כאות למארב (יהושע ח':י\"ח)", "source": "06 conquest of ai", "type": "story"}, {"q": "1. ⭐⭐⭐ יהושע בנה מזבח בהר גריזים אחרי כיבוש העי. נכון או לא נכון?", "a": "**לא נכון.** יהושע בנה את המזבח בהר **עיבל**, לא בהר גריזים: \"אז יבנה יהושע מזבח לה' אלוהי ישראל **בהר עיבל**\" (יהושע ח':ל'). הר גריזים היה ההר שמולו עמדו חצי ישראל לברכה.", "source": "06 conquest of ai", "type": "story"}, {"q": "2. ⭐⭐⭐ מלך העי נהרג בקרב. נכון או לא נכון?", "a": "**לא נכון.** מלך העי **נתפס חי** ורק אחר כך הובא ליהושע ונתלה על העץ עד הערב (יהושע ח':כ\"ג, כ\"ט). הוא לא נהרג בשדה הקרב עצמו.", "source": "06 conquest of ai", "type": "story"}, {"q": "3. ⭐⭐⭐ כל אנשי העי שנפלו היו 12,000. נכון או לא נכון?", "a": "**נכון.** \"ויהי כל הנופלים ביום ההוא מאיש ועד אשה שנים עשר אלף כל אנשי העי\" (יהושע ח':כ\"ה).", "source": "06 conquest of ai", "type": "story"}, {"q": "1. ⭐⭐⭐ מלך עיר שנכבשה במארב, נתפס חי ולא נהרג בקרב, נתלה על עץ עד הערב", "a": "**הדמות:** מלך העי\n**ספר:** יהושע\n**הקשר:** מלך העי נתפס חי כשהעיר נכבשה במארב, הובא ליהושע, ונתלה על העץ עד הערב (פרק ח')", "source": "06 conquest of ai", "type": "story"}, {"q": "1. ⭐⭐ \"אַל תִּירָא וְאַל תֵּחָת קַח עִמְּךָ אֵת כָּל עַם _____\"", "a": "**מילה חסרה:** הַמִּלְחָמָה\n**מי אמר:** ה'\n**הקשר:** ה' מעודד את יהושע לפני הקרב השני על העי ומורה לו לקחת את כל העם (יהושע ח':א')", "source": "06 conquest of ai", "type": "story"}, {"q": "2. ⭐⭐⭐ \"אָז יִבְנֶה יְהוֹשֻׁעַ מִזְבֵּחַ לַה' אֱלֹהֵי יִשְׂרָאֵל בְּהַר _____\"", "a": "**מילה חסרה:** עֵיבָל\n**מי אמר:** הכתוב (תיאור)\n**הקשר:** יהושע בונה מזבח בהר עיבל כאשר ציווה משה, אחרי כיבוש העי (יהושע ח':ל')", "source": "06 conquest of ai", "type": "story"}, {"q": "3. ⭐⭐ \"נְטֵה בַכִּידוֹן אֲשֶׁר בְּיָדְךָ אֶל _____\"", "a": "**מילה חסרה:** הָעָי\n**מי אמר:** ה'\n**הקשר:** ה' מצווה את יהושע לנטות את הכידון כאות לכוח המארב (יהושע ח':י\"ח)", "source": "06 conquest of ai", "type": "story"}, {"q": "4. ⭐⭐⭐ \"קָרָא אֶת כָּל דִּבְרֵי הַתּוֹרָה הַ_____ וְהַקְּלָלָה\"", "a": "**מילה חסרה:** בְּרָכָה\n**מי אמר:** הכתוב (תיאור)\n**הקשר:** יהושע קורא את כל דברי התורה במעמד הר עיבל והר גריזים (יהושע ח':ל\"ד)", "source": "06 conquest of ai", "type": "story"}, {"q": "1. מה עשו מלכי הכנעני כששמעו על ניצחונות ישראל?", "a": "התאחדו להילחם ביהושע ובישראל", "source": "07 givonite deception", "type": "story"}, {"q": "2. מי פעלו בצורה שונה מכל מלכי כנען?", "a": "יושבי גבעון, שבחרו בערמה במקום מלחמה", "source": "07 givonite deception", "type": "story"}, {"q": "3. מה עשו הגבעונים כדי להיראות כאילו באו מארץ רחוקה?", "a": "לקחו שקים בלים לחמוריהם, נאדות יין בלים ומבוקעים ומצוררים, נעלות בלות ומטולאות, שלמות בלות, ולחם יבש שהיה נקודים", "source": "07 givonite deception", "type": "story"}, {"q": "4. מה הגבעונים ביקשו מיהושע?", "a": "\"מארץ רחוקה באנו, ועתה כרתו לנו ברית\"", "source": "07 givonite deception", "type": "story"}, {"q": "5. מה חשדו אנשי ישראל כלפי הגבעונים?", "a": "\"אולי בקרבי אתה יושב ואיך אכרות לך ברית\"", "source": "07 givonite deception", "type": "story"}, {"q": "6. מה הייתה הטעות הגדולה של ישראל לפי הפסוק?", "a": "\"ויקחו האנשים מצידם ואת פי ה' לא שאלו\" - לא שאלו את ה' לפני כריתת הברית", "source": "07 givonite deception", "type": "story"}, {"q": "7. אחרי כמה ימים גילו ישראל שהגבעונים שכנים קרובים?", "a": "אחרי שלושה ימים", "source": "07 givonite deception", "type": "story"}, {"q": "8. מהן ארבע ערי הגבעונים?", "a": "גבעון, כפירה, בארות וקריית יערים", "source": "07 givonite deception", "type": "story"}, {"q": "9. מדוע לא יכלו ישראל להכות את הגבעונים?", "a": "בגלל השבועה שנשיאי העדה נשבעו להם", "source": "07 givonite deception", "type": "story"}, {"q": "10. מה היה גורלם של הגבעונים?", "a": "נעשו חוטבי עצים ושואבי מים לעדה ולמזבח ה'", "source": "07 givonite deception", "type": "story"}, {"q": "11. מדוע הגבעונים בחרו בערמה לפי דבריהם?", "a": "\"כי הוגד הוגד לעבדיך אשר ציווה ה' אלוהיך את משה\" ופחדו מאוד לנפשותיהם", "source": "07 givonite deception", "type": "story"}, {"q": "12. היכן היה מחנה ישראל כשהגבעונים הגיעו?", "a": "בגלגל", "source": "07 givonite deception", "type": "story"}, {"q": "13. מי הלינו (התלוננו) על הנשיאים?", "a": "העדה - כל ישראל", "source": "07 givonite deception", "type": "story"}, {"q": "14. לאיזה עם שייכים הגבעונים?", "a": "החיוים", "source": "07 givonite deception", "type": "story"}, {"q": "15. מאיזה פסוק: \"ויקחו האנשים מצידם ואת פי ה' לא שאלו\"?", "a": "פרק ט פסוק יד", "source": "07 givonite deception", "type": "story"}, {"q": "16. ⭐⭐ מהן ארבע ערי הגבעונים? (רשום את כולן)", "a": "גבעון, כפירה, בארות וקריית יערים", "source": "07 givonite deception", "type": "story"}, {"q": "17. ⭐⭐⭐ מה הם חמשת הפריטים הבלויים שהגבעונים הביאו כדי להוכיח שבאו מרחוק?", "a": "שקים בלים לחמוריהם, נאדות יין בלים ומבוקעים ומצוררים, נעלות בלות ומטולאות, שלמות בלות, ולחם יבש שהיה נקודים", "source": "07 givonite deception", "type": "story"}, {"q": "18. ⭐⭐ מי התלוננו על הנשיאים בגלל הברית עם הגבעונים?", "a": "כל העדה - כל ישראל", "source": "07 givonite deception", "type": "story"}, {"q": "1. ⭐ ערמו על יהושע עם לחם יבש ונודות בלים, באו מעיר קרובה אך העמידו פנים שבאו מרחוק, נהפכו לחוטבי עצים ושואבי מים", "a": "**הדמות:** הגבעונים\n**ספר:** יהושע\n**הקשר:** הגבעונים הגיעו ליהושע עם לחם יבש, יין ישן ובגדים בלויים, העמידו פנים שהגיעו מארץ רחוקה, וכשהתגלתה התרמית נהפכו לחוטבי עצים ושואבי מים (פרק ט')", "source": "07 givonite deception", "type": "story"}, {"q": "1. ⭐ הגבעונים התחפשו לשגרירים ממדינה רחוקה כדי לכרות ברית עם ישראל. נכון או לא נכון?", "a": "**נכון.** הגבעונים לבשו בגדים בלים, נעלים מטולאות ולחם יבש ומעופש, ואמרו \"מארץ רחוקה באנו\" (יהושע ט':ו'-י\"ג) כדי לכרות ברית שלום.", "source": "07 givonite deception", "type": "story"}, {"q": "2. ⭐⭐ יהושע כרת ברית עם הגבעונים מבלי לשאול את ה'. נכון או לא נכון?", "a": "**נכון.** \"ויקחו האנשים מצידם ואת פי ה' לא שאלו\" (יהושע ט':י\"ד). זו הנקודה המרכזית - הנשיאים נתנו להם שלום מבלי להתייעץ עם ה'.", "source": "07 givonite deception", "type": "story"}, {"q": "3. ⭐⭐⭐ הגבעונים היו כנענים. נכון או לא נכון?", "a": "**לא נכון (חלקית).** הגבעונים היו **חיוים**, לא כנענים במובן הצר: \"לא היה עיר אשר השלימה אל בני ישראל **בלתי החיוי יושבי גבעון**\" (יהושע י\"א:י\"ט). החיוים הם אחד משבעת עמי כנען.", "source": "07 givonite deception", "type": "story"}, {"q": "4. ⭐⭐⭐ הגבעונים נעשו חוטבי עצים ושואבי מים רק לעדה. נכון או לא נכון?", "a": "**לא נכון.** הגבעונים נעשו חוטבי עצים ושואבי מים **לעדה ולמזבח ה'**: \"חוטבי עצים ושואבי מים **לעדה ולמזבח ה'**\" (יהושע ט':כ\"ז). יש להם תפקיד דתי נוסף לתפקיד האזרחי.", "source": "07 givonite deception", "type": "story"}, {"q": "1. ⭐⭐⭐ \"מֵאֶרֶץ רְחוֹקָה מְאֹד בָּאוּ עֲבָדֶיךָ לְשֵׁם ה' אֱלֹהֶיךָ\"", "a": "**מי אמר:** הגבעונים\n**למי:** יהושע\n**הקשר:** הגבעונים משקרים ומתחזים לשגרירים מארץ רחוקה, מזכירים את שם ה' כדי לשכנע את ישראל לכרות עמם ברית (יהושע ט':ט')", "source": "07 givonite deception", "type": "story"}, {"q": "2. ⭐⭐⭐ \"אוּלַי בְּקִרְבִּי אַתָּה יוֹשֵׁב וְאֵיךְ אֶכְרָת לְךָ בְרִית\"", "a": "**מי אמר:** אנשי ישראל\n**למי:** הגבעונים\n**הקשר:** ישראל חושדים שאולי הגבעונים גרים בקרבם ולא מארץ רחוקה (יהושע ט':ז')", "source": "07 givonite deception", "type": "story"}, {"q": "3. ⭐⭐⭐ \"כִּי הֻגֵּד הֻגַּד לַעֲבָדֶיךָ אֵת אֲשֶׁר צִוָּה ה' אֱלֹהֶיךָ אֶת מֹשֶׁה... וַנִּירָא מְאֹד לְנַפְשֹׁתֵינוּ\"", "a": "**מי אמר:** הגבעונים\n**למי:** יהושע\n**הקשר:** הגבעונים מסבירים מדוע בחרו בערמה - שמעו שה' ציווה את משה להשמיד את עמי כנען ופחדו (יהושע ט':כ\"ד)", "source": "07 givonite deception", "type": "story"}, {"q": "1. ⭐⭐ \"וַיִּקְחוּ הָאֲנָשִׁים מִצֵּידָם וְאֶת פִּי ה' לֹא _____\"", "a": "**מילה חסרה:** שָׁאָלוּ\n**מי אמר:** הכתוב (תיאור)\n**הקשר:** הטעות הגדולה של ישראל - לא שאלו את ה' לפני כריתת הברית עם הגבעונים (יהושע ט':י\"ד)", "source": "07 givonite deception", "type": "story"}, {"q": "2. ⭐⭐⭐ \"זֶה לַחְמֵנוּ חָם הִצְטַיַּדְנוּ אֹתוֹ... וְעַתָּה הִנֵּה יָבֵשׁ וְהָיָה _____\"", "a": "**מילה חסרה:** נִקֻּדִים\n**מי אמר:** הגבעונים\n**הקשר:** הגבעונים מראים את הלחם היבש כ\"ראיה\" שבאו ממרחק (יהושע ט':י\"ב)", "source": "07 givonite deception", "type": "story"}, {"q": "3. ⭐⭐ \"יִחְיוּ וַיִּהְיוּ חֹטְבֵי _____ וְשֹׁאֲבֵי מַיִם\"", "a": "**מילה חסרה:** עֵצִים\n**מי אמר:** הנשיאים\n**הקשר:** הפתרון שנמצא לגבעונים - יהיו חוטבי עצים ושואבי מים לעדה (יהושע ט':כ\"א)", "source": "07 givonite deception", "type": "story"}, {"q": "4. ⭐⭐⭐ \"וַיַּעֲשׂוּ גַם הֵמָּה בְּ_____\"", "a": "**מילה חסרה:** עָרְמָה\n**מי אמר:** הכתוב (תיאור)\n**הקשר:** תיאור פעולת הגבעונים - גם הם עשו בערמה, בניגוד למלכי כנען שבחרו במלחמה (יהושע ט':ד')", "source": "07 givonite deception", "type": "story"}, {"q": "1. מי היה מנהיג הקואליציה של חמשת המלכים?", "a": "אדוני צדק מלך ירושלים", "source": "08 war of five kings", "type": "story"}, {"q": "2. מדוע אדוני צדק פחד מגבעון?", "a": "כי גבעון הייתה עיר גדולה \"כאחת ערי הממלכה\" ואנשיה גיבורים, והיא השלימה עם ישראל", "source": "08 war of five kings", "type": "story"}, {"q": "3. מי הם חמשת המלכים שהתאחדו?", "a": "אדוני צדק מלך ירושלים, הוהם מלך חברון, פראם מלך ירמות, יפיע מלך לכיש, ודביר מלך עגלון", "source": "08 war of five kings", "type": "story"}, {"q": "4. על מי צרו חמשת המלכים?", "a": "על גבעון", "source": "08 war of five kings", "type": "story"}, {"q": "5. מה ביקשו הגבעונים מיהושע?", "a": "\"אל תרף ידיך מעבדיך, עלה אלינו מהרה\"", "source": "08 war of five kings", "type": "story"}, {"q": "6. מאיפה עלה יהושע ומתי?", "a": "מן הגלגל, כל הלילה (מסע הפתעה)", "source": "08 war of five kings", "type": "story"}, {"q": "7. מה השליך ה' על האויבים מהשמים?", "a": "אבנים גדולות (אבני ברד)", "source": "08 war of five kings", "type": "story"}, {"q": "8. מי הרגו יותר - אבני הברד או חרב ישראל?", "a": "אבני הברד - \"רבים אשר מתו באבני הברד מאשר הרגו בני ישראל בחרב\"", "source": "08 war of five kings", "type": "story"}, {"q": "9. מה אמר יהושע לשמש ולירח?", "a": "\"שמש בגבעון דום, וירח בעמק אילון\"", "source": "08 war of five kings", "type": "story"}, {"q": "10. מה מיוחד ביום שבו עמדו השמש והירח?", "a": "\"ולא היה כיום ההוא לפניו ואחריו לשמוע ה' בקול איש\"", "source": "08 war of five kings", "type": "story"}, {"q": "11. היכן התחבאו חמשת המלכים?", "a": "במערה במקדה", "source": "08 war of five kings", "type": "story"}, {"q": "12. מה עשה יהושע כשמצאו את המלכים במערה?", "a": "ציווה לגלול אבנים על פי המערה עד סיום הקרב, ואז הוציאם, שרי ישראל שמו רגליהם על צוואריהם, ויהושע תלה אותם על חמישה עצים", "source": "08 war of five kings", "type": "story"}, {"q": "13. על כמה עצים נתלו חמשת המלכים?", "a": "על חמישה עצים", "source": "08 war of five kings", "type": "story"}, {"q": "14. אילו ערים כבש יהושע במסע הדרום?", "a": "מקדה, לבנה, לכיש, עגלון, חברון, דביר", "source": "08 war of five kings", "type": "story"}, {"q": "15. היכן הומם ה' את האויבים?", "a": "בגבעון, ורדפם בדרך מעלה בית חורון", "source": "08 war of five kings", "type": "story"}, {"q": "16. מה המשפט החוזר שמסכם את מלחמות יהושע?", "a": "\"כי ה' אלוהי ישראל נלחם לישראל\"", "source": "08 war of five kings", "type": "story"}, {"q": "17. מאיזה פסוק: \"שמש בגבעון דום וירח בעמק אילון\"?", "a": "פרק י פסוקים יב-יג", "source": "08 war of five kings", "type": "story"}, {"q": "18. ⭐⭐ מה שם מלך ירושלים שהנהיג את הקואליציה?", "a": "אדוני צדק", "source": "08 war of five kings", "type": "story"}, {"q": "19. ⭐⭐⭐ מהם שמות חמשת המלכים ועריהם? (כולם)", "a": "אדוני צדק מלך ירושלים, הוהם מלך חברון, פראם מלך ירמות, יפיע מלך לכיש, ודביר מלך עגלון", "source": "08 war of five kings", "type": "story"}, {"q": "20. ⭐⭐ מדוע גבעון מתוארת כעיר חשובה במיוחד?", "a": "\"כי גבעון עיר גדולה כאחת ערי הממלכה\" ואנשיה גיבורים", "source": "08 war of five kings", "type": "story"}, {"q": "21. ⭐⭐⭐ אילו שש ערים כבש יהושע במסע הדרום?", "a": "מקדה, לבנה, לכיש, עגלון, חברון, דביר", "source": "08 war of five kings", "type": "story"}, {"q": "1. ⭐⭐⭐ מלך ירושלים, ארגן קואליציה של חמישה מלכים, נלחם נגד הגבעונים, נתפס במערה במקדה", "a": "**הדמות:** אדוני-צדק\n**ספר:** יהושע\n**הקשר:** אדוני-צדק מלך ירושלים ארגן קואליציה של חמישה מלכים אמוריים נגד גבעון שעשתה שלום עם ישראל, הובס על ידי יהושע, ונתפס במערה במקדה (פרק י')", "source": "08 war of five kings", "type": "story"}, {"q": "1. ⭐⭐⭐ חרב ישראל הרגה יותר מאשר אבני הברד במלחמת חמשת המלכים. נכון או לא נכון?", "a": "**לא נכון.** הכתוב אומר במפורש ש**אבני הברד** הרגו יותר: \"רבים אשר מתו באבני הברד מאשר הרגו בני ישראל בחרב\" (יהושע י':י\"א).", "source": "08 war of five kings", "type": "story"}, {"q": "2. ⭐⭐⭐ חמשת המלכים נתלו על עץ אחד. נכון או לא נכון?", "a": "**לא נכון.** חמשת המלכים נתלו על **חמישה עצים** - עץ אחד לכל מלך (יהושע י':כ\"ו).", "source": "08 war of five kings", "type": "story"}, {"q": "1. ⭐⭐⭐ \"אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ עֲלֵה אֵלֵינוּ מְהֵרָה\"", "a": "**מי אמר:** הגבעונים\n**למי:** יהושע\n**הקשר:** הגבעונים מבקשים עזרה דחופה מיהושע כשחמשת המלכים האמוריים צרים עליהם (יהושע י':ו')", "source": "08 war of five kings", "type": "story"}, {"q": "1. מי היה מנהיג הקואליציה הצפונית?", "a": "יבין מלך חצור", "source": "09 conquest of the north", "type": "story"}, {"q": "2. מדוע חצור הייתה כל כך חשובה?", "a": "\"כי חצור לפנים היא ראש כל הממלכות האלה\"", "source": "09 conquest of the north", "type": "story"}, {"q": "3. לאילו מלכים שלח יבין?", "a": "אל יובב מלך מדון ואל מלכי שמרון ואכשף ומלכים רבים נוספים בצפון", "source": "09 conquest of the north", "type": "story"}, {"q": "4. כיצד מתואר גודל צבא האויב?", "a": "\"עם רב כחול אשר על שפת הים לרוב וסוס ורכב רב מאוד\"", "source": "09 conquest of the north", "type": "story"}, {"q": "5. היכן התרכזו צבאות הצפון למלחמה?", "a": "על מי מרום", "source": "09 conquest of the north", "type": "story"}, {"q": "6. מה ה' אומר ליהושע לפני הקרב?", "a": "\"אל תירא מפניהם, כי מחר כעת הזאת אנכי נותן את כולם חללים לפני ישראל\"", "source": "09 conquest of the north", "type": "story"}, {"q": "7. מה ה' מצווה לעשות לסוסים ולמרכבות?", "a": "\"את סוסיהם תעקר ואת מרכבותיהם תשרוף באש\"", "source": "09 conquest of the north", "type": "story"}, {"q": "8. כיצד תקף יהושע את האויב?", "a": "בא עליהם פתאום על מי מרום", "source": "09 conquest of the north", "type": "story"}, {"q": "9. עד היכן רדפו ישראל את האויב?", "a": "עד צידון רבה, עד משרפות מים, ועד בקעת מצפה", "source": "09 conquest of the north", "type": "story"}, {"q": "10. מה מיוחד בחצור לעומת שאר הערים שנכבשו?", "a": "חצור היא היחידה מערי התלים שנשרפה באש", "source": "09 conquest of the north", "type": "story"}, {"q": "11. איזו עיר הייתה היחידה שהשלימה עם ישראל?", "a": "גבעון (החיוים יושבי גבעון) - \"לא היה עיר אשר השלימה אל בני ישראל בלתי החיוי יושבי גבעון\"", "source": "09 conquest of the north", "type": "story"}, {"q": "12. אילו אזורים כבש יהושע לפי הסיכום?", "a": "ההר, כל הנגב, כל ארץ הגושן, השפלה, והערבה", "source": "09 conquest of the north", "type": "story"}, {"q": "13. את מי כרת יהושע מההר, מחברון, מדביר ומענב?", "a": "את הענקים", "source": "09 conquest of the north", "type": "story"}, {"q": "14. באיזה משפט מסתיים סיכום הכיבושים?", "a": "\"והארץ שקטה ממלחמה\"", "source": "09 conquest of the north", "type": "story"}, {"q": "15. מדוע לפי הכתוב עמי כנען לא ביקשו שלום?", "a": "\"כי מאת ה' היתה לחזק את לבם לקראת המלחמה\"", "source": "09 conquest of the north", "type": "story"}, {"q": "16. מאיזה פסוק: \"כי חצור לפנים היא ראש כל הממלכות האלה\"?", "a": "פרק יא פסוק י", "source": "09 conquest of the north", "type": "story"}, {"q": "1. ⭐⭐ מלך חצור, ראש קואליציה של מלכי הצפון, יהושע הכה אותו בחרב", "a": "**הדמות:** יבין מלך חצור\n**ספר:** יהושע\n**הקשר:** יבין מלך חצור אסף את כל מלכי הצפון יחד למלחמה נגד ישראל על מי מרום, ויהושע הכה אותם ושרף את חצור באש (פרק י\"א)", "source": "09 conquest of the north", "type": "story"}, {"q": "1. ⭐⭐⭐ יהושע שרף את כל ערי התלים שכבש בצפון. נכון או לא נכון?", "a": "**לא נכון.** יהושע שרף באש רק את **חצור** מערי התלים: \"רק כל הערים העומדות על תלם לא שרפם ישראל זולתי את חצור לבדה שרף יהושע\" (יהושע י\"א:י\"ג). חצור הייתה היחידה שנשרפה כי הייתה \"ראש כל הממלכות האלה\".", "source": "09 conquest of the north", "type": "story"}, {"q": "2. ⭐⭐⭐ ה' ציווה את יהושע לשמור את סוסי האויב ומרכבותיו לשימוש ישראל. נכון או לא נכון?", "a": "**לא נכון.** ה' ציווה את ההפך - **לעקר** את הסוסים ו**לשרוף** את המרכבות: \"את סוסיהם תעקר ואת מרכבותיהם תשרוף באש\" (יהושע י\"א:ו'). ואכן יהושע עשה כן (י\"א:ט').", "source": "09 conquest of the north", "type": "story"}, {"q": "1. ⭐⭐⭐ \"אַל תִּירָא מִפְּנֵיהֶם כִּי מָחָר כָּעֵת הַזֹּאת אָנֹכִי נֹתֵן אֶת כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל\"", "a": "**מי אמר:** ה'\n**למי:** יהושע\n**הקשר:** ה' מרגיע את יהושע לפני הקרב הגדול מול קואליציית מלכי הצפון בראשות יבין מלך חצור על מי מרום (יהושע י\"א:ו')", "source": "09 conquest of the north", "type": "story"}, {"q": "1. ⭐⭐ השוואה: כיצד שונה הגישה הצבאית בכיבוש יריחו (פרקים ה'-ו') מהגישה בכיבוש העי (פרק ח')?", "a": "ביריחו הכיבוש היה בנס גלוי - הקפת העיר עם שופרות וארון הברית, ללא מארב או תכנון צבאי רגיל, והחומה נפלה מעצמה. בעי יהושע השתמש בטקטיקה צבאית של מארב - שלח לוחמים מאחורי העיר, העמיד פנים של בריחה כדי למשוך את אנשי העי החוצה, ואז המארב נכנס והצית את העיר. ביריחו ה' עשה הכול, בעי ה' נתן את ההוראה אבל יהושע תכנן את המארב.", "source": "cross chapter", "type": "story"}, {"q": "2. ⭐⭐ סיבה ותוצאה: כיצד חטא עכן (פרק ז') קשור ישירות לתוצאת הקרב הראשון בעי?", "a": "יהושע ציווה בכיבוש יריחו (פרק ו') שהעיר כולה חרם לה' ואסור לקחת מהשלל. עכן לקח אדרת שנער, כסף וזהב מהחרם. בגלל חטא זה, חרה אף ה' בכל ישראל, ולכן כשנשלחו כשלושת אלפים איש לכבוש את העי - הובסו ונהרגו כשלושים ושישה איש. רק לאחר גילוי עכן ועונשו בעמק עכור, שב ה' מחרון אפו ויהושע הצליח לכבוש את העי בפעם השנייה.", "source": "cross chapter", "type": "story"}, {"q": "3. ⭐ דמויות חוזרות: כיצד מופיעה רחב בשני סיפורים שונים, ומה קורה לה בכל אחד מהם? (פרקים ב', ה'-ו')", "a": "בפרק ב' רחב מחביאה את שני המרגלים בפשתי העץ על הגג, משקרת לשליחי מלך יריחו, ומכריזה שה' הוא אלוהים בשמים ובארץ. היא מבקשת שבועה להציל את משפחתה. בפרקים ה'-ו' (כיבוש יריחו) יהושע מצווה את שני המרגלים להוציא את רחב ומשפחתה מביתה לפני חורבן העיר, כפי שנשבעו לה. רחב ומשפחתה ניצלים, והכתוב מעיד \"ותשב בקרב ישראל עד היום הזה\".", "source": "cross chapter", "type": "story"}, {"q": "4. ⭐⭐⭐ מקומות חוזרים: הגלגל מופיע במספר סיפורים - מה תפקידו בכל אחד מהם? (פרקים ג'-ד', ה'-ו', ט', י')", "a": "בחציית הירדן (פרק ד') - הגלגל הוא מקום החנייה הראשון בארץ, שם הוקמו שתים עשרה אבני הזיכרון. בכיבוש יריחו (פרק ה') - שם נימולו ישראל, נגלתה \"חרפת מצרים\", ונעשה הפסח הראשון בארץ. בערמת הגבעונים (פרק ט') - הגלגל היה מחנה ישראל כשהגבעונים הגיעו בתחפושת. במלחמת חמשת המלכים (פרק י') - יהושע עלה מן הגלגל כל הלילה להציל את גבעון. הגלגל שימש כבסיס הפעולות המרכזי של ישראל.", "source": "cross chapter", "type": "story"}, {"q": "5. ⭐⭐ נושאים מקבילים: ה' אומר \"אל תירא\" ליהושע בשלושה מקרים שונים - מה המצב בכל אחד מהם? (פרקים א', ח', י', י\"א)", "a": "בפרק א' - \"אל תערוץ ואל תחת\" כחלק מהמינוי למנהיגות אחרי מות משה. בפרק ח' - \"אל תירא ואל תחת\" לפני כיבוש העי בפעם השנייה, אחרי התבוסה הקודמת וחטא עכן. בפרק י' - \"אל תירא מהם כי בידך נתתים\" לפני מלחמת חמשת המלכים. בפרק י\"א - \"אל תירא מפניהם\" לפני מלחמת הצפון מול צבא ענק \"כחול אשר על שפת הים\". בכל פעם ה' מחזק את יהושע לפני אתגר גדול.", "source": "cross chapter", "type": "story"}, {"q": "6. ⭐⭐⭐ רצף כרונולוגי: מה סדר האירועים מרגע הגעת ישראל לירדן ועד כיבוש יריחו? (פרקים ב'-ו')", "a": "שליחת המרגלים מהשיטים (פרק ב'), חציית הירדן בעשור לחודש הראשון (פרקים ג'-ד'), חנייה בגלגל והקמת אבני זיכרון, מילת בני ישראל בגבעת הערלות (פרק ה'), עשיית הפסח בי\"ד לחודש, אכילת מעבור הארץ ופסיקת המן, מפגש יהושע עם שר צבא ה', ולבסוף הקפת יריחו שבעה ימים ונפילת החומה (פרק ו').", "source": "cross chapter", "type": "story"}, {"q": "7. ⭐⭐⭐ השוואה: שתי קואליציות מלכים נלחמו נגד ישראל - מה הדמיון והשוני ביניהן? (פרקים י', י\"א)", "a": "בדרום (פרק י') - חמישה מלכים אמוריים בהנהגת אדוני צדק מלך ירושלים התאחדו נגד גבעון שהשלימה עם ישראל. בצפון (פרק י\"א) - קואליציה גדולה בהנהגת יבין מלך חצור עם צבא \"כחול אשר על שפת הים\" וסוסים ומרכבות. בשני המקרים ה' אמר \"אל תירא\" ונלחם לישראל. ההבדל: בדרום ה' השליך אבני ברד והשמש עמדה, בצפון יהושע בא בפתאומיות ועיקר סוסים ושרף מרכבות. בדרום המלכים התחבאו במערה, בצפון חצור נשרפה.", "source": "cross chapter", "type": "story"}, {"q": "8. ⭐⭐ סיבה ותוצאה: כיצד הברית עם הגבעונים (פרק ט') הובילה ישירות למלחמת חמשת המלכים (פרק י')?", "a": "כשאדוני צדק מלך ירושלים שמע שגבעון השלימה עם ישראל וכרתה ברית, הוא פחד מאוד כי גבעון הייתה \"כאחת ערי הממלכה\" ואנשיה גיבורים. לכן גייס ארבעה מלכים נוספים וצרו על גבעון. הגבעונים פנו ליהושע לעזרה בזכות הברית, ויהושע עלה מהגלגל כל הלילה להצילם - מה שהוביל לנס השמש בגבעון ולכיבוש כל הדרום.", "source": "cross chapter", "type": "story"}, {"q": "9. ⭐⭐ נושאים מקבילים: מושג ה\"חרם\" מופיע בכמה סיפורים - מה ההבדלים ביישומו? (פרקים ו', ז', ח')", "a": "ביריחו (פרק ו') - כל העיר חרם לה', הכסף והזהב לאוצר ה', אסור לגעת בשלל. בחטא עכן (פרק ז') - עכן הפר את החרם ולקח מהשלל, מה שגרם לתבוסה ולעונש חמור. בכיבוש העי (פרק ח') - ה' התיר לישראל לקחת שלל ובהמה (\"רק שללה ובהמתה תבוזו לכם\"), בניגוד ליריחו. ההבדל מראה שהחרם המוחלט ביריחו היה מיוחד כעיר הראשונה שנכבשה.", "source": "cross chapter", "type": "story"}, {"q": "10. ⭐⭐⭐ דמויות חוזרות: כיצד משתנה דמותו של יהושע לאורך הספר - ממשרת משה למנהיג עצמאי? (פרקים א', ג'-ד', ו', ח', י')", "a": "בפרק א' הוא מכונה \"משרת משה\" וזקוק לחיזוק שלוש פעמים. בחציית הירדן (פרק ד') \"גידל ה' את יהושע בעיני כל ישראל וייראו אותו כאשר יראו את משה\". בכיבוש יריחו (פרק ו') הוא מנהל מבצע מורכב. בכיבוש העי (פרק ח') הוא מתכנן מארב עצמאי, ונוטה כידון כמו משה שהרים ידיו מול עמלק. בפרק י' הוא מצווה על השמש לעמוד - \"ולא היה כיום ההוא לפניו ואחריו לשמוע ה' בקול איש\".", "source": "cross chapter", "type": "story"}, {"q": "11. ⭐⭐ מקומות חוזרים: יריחו מוזכרת בהקשרים שונים לאורך הספר - מהם? (פרקים ב', ג'-ד', ה'-ו', ז')", "a": "בפרק ב' - יריחו היא יעד הריגול של שני המרגלים, מלכה שולח לתפוס אותם. בפרקים ג'-ד' - העם חוצים את הירדן \"נגד יריחו\" וחונים בגלגל \"בקצה מזרח יריחו\". בפרקים ה'-ו' - יריחו \"סוגרת ומסוגרת\", מוקפת שבעה ימים, חומתה נופלת והיא מוחרמת ונשרפה. בפרק ז' - מיריחו שולח יהושע אנשים לרגל את העי, וחטא עכן קשור לשלל יריחו.", "source": "cross chapter", "type": "story"}, {"q": "12. ⭐⭐ השוואה: נס חציית הירדן (פרקים ג'-ד') מושווה במפורש לנס קריעת ים סוף - מה הדמיון? ומי עוד מזכירה את ים סוף? (פרקים ב', ג'-ד')", "a": "בחציית הירדן (פרק ד') נאמר במפורש \"כאשר עשה ה' אלהיכם לים סוף אשר הובישו מפנינו עד עברנו\" - בשני המקרים המים נבקעו והעם עבר ביבשה. גם רחב (פרק ב') מזכירה את ים סוף: \"כי שמענו את אשר הוביש ה' את מי ים סוף מפניכם בצאתכם ממצרים\". שני הניסים נועדו להראות את כוח ה' לעמי הארץ.", "source": "cross chapter", "type": "story"}, {"q": "13. ⭐⭐ דמויות חוזרות: שבטי ראובן, גד וחצי מנשה - כיצד הם מקיימים את הבטחתם? (פרקים א', ג'-ד')", "a": "בפרק א' יהושע מזכיר להם את התחייבותם למשה: נשותיהם, טפם ומקניהם יישארו בעבר הירדן, אך הם יעברו \"חמושים לפני אחיכם כל גיבורי החיל\". הם עונים בנאמנות מלאה. בפרקים ג'-ד' מסופר שאכן \"ויעברו בני ראובן ובני גד וחצי שבט המנשה חמושים לפני בני ישראל כאשר דיבר אליהם משה\" - כארבעים אלף חלוצי צבא עברו לערבות יריחו.", "source": "cross chapter", "type": "story"}, {"q": "14. ⭐⭐⭐ נושאים מקבילים: הגבעונים ורחב פעלו באופן דומה - שניהם הכירו בכוח ה' וביקשו להינצל. מה הדמיון ומה השוני? (פרקים ב', ט')", "a": "שניהם שמעו על ניצחונות ישראל ופחדו. רחב הכריזה \"ה' אלהיכם הוא אלהים בשמים ממעל ועל הארץ מתחת\", והגבעונים אמרו \"הוגד הוגד לעבדיך אשר ציווה ה' אלוהיך את משה\". ההבדל: רחב פעלה בכנות - עזרה למרגלים וביקשה שבועה בגלוי. הגבעונים פעלו \"בערמה\" - התחפשו כאילו באו מארץ רחוקה. רחב נספחה לעם ישראל, הגבעונים נעשו חוטבי עצים ושואבי מים.", "source": "cross chapter", "type": "story"}, {"q": "15. ⭐⭐⭐ סיבה ותוצאה: הטעות ב\"ואת פי ה' לא שאלו\" (פרק ט') - האם יהושע למד ממנה בהמשך? (פרקים ז', ט', י')", "a": "בחטא עכן (פרק ז') יהושע לא ידע מדוע ישראל הובסו עד שה' גילה לו. בערמת הגבעונים (פרק ט') הטעות הייתה שיהושע והנשיאים כרתו ברית \"ואת פי ה' לא שאלו\". לעומת זאת, במלחמת חמשת המלכים (פרק י') ה' דיבר ישירות ליהושע \"אל תירא מהם כי בידך נתתים\" - ויהושע פעל לפי דבר ה'. הלקח הוא חשיבות שאילת ה' לפני כל החלטה.", "source": "cross chapter", "type": "story"}, {"q": "16. ⭐⭐ רצף כרונולוגי: סדרו את כל הכיבושים הצבאיים של יהושע מהראשון ועד האחרון (פרקים ו'-י\"א)", "a": "יריחו (פרק ו') - העי (פרק ח', בפעם השנייה אחרי חטא עכן) - מלחמת חמשת המלכים והצלת גבעון (פרק י') - מסע כיבוש הדרום: מקדה, לבנה, לכיש, עגלון, חברון, דביר (פרק י') - מלחמת הצפון נגד יבין מלך חצור ובעלי בריתו ליד מי מרום, וכיבוש חצור (פרק י\"א). הספר מסכם: \"ויקח יהושע את כל הארץ... והארץ שקטה ממלחמה\".", "source": "cross chapter", "type": "story"}, {"q": "17. ⭐⭐⭐ השוואה: בשלושה מקרים ה' התערב ישירות בקרב באופן ניסי - מה עשה בכל פעם? (פרקים ו', י', י\"א)", "a": "ביריחו (פרק ו') - החומה נפלה תחתיה אחרי תקיעת השופרות ותרועת העם, ללא שימוש בנשק. במלחמת חמשת המלכים (פרק י') - ה' הומם את האויב, השליך אבני ברד מהשמים (שהרגו יותר מחרב ישראל), ועצר את השמש והירח. בכיבוש הצפון (פרק י\"א) - ה' נתנם ביד ישראל בהתקפת פתע, אך ללא נס גלוי דומה. ככל שהכיבוש מתקדם, ההתערבות הניסית פוחתת.", "source": "cross chapter", "type": "story"}, {"q": "18. ⭐⭐ מקומות חוזרים: העי מופיעה בשני סיפורים עם תוצאות הפוכות - מה השתנה? (פרקים ז', ח')", "a": "בפעם הראשונה (פרק ז') ישראל שלחו רק כשלושת אלפים איש, הובסו ונהרגו שלושים ושישה, כי חטא עכן גרם לכך שה' לא היה עמם. בפעם השנייה (פרק ח') - לאחר עונש עכן, ה' אמר \"קח עמך את כל עם המלחמה\", יהושע שלח שלושים אלף (או חמשת אלפים) למארב, השתמש בתחבולה, וכל שנים עשר אלף אנשי העי נפלו. ההבדל: הסרת החטא, שליחת כוח גדול יותר, ותכנון צבאי חכם.", "source": "cross chapter", "type": "story"}, {"q": "1. ⭐⭐ יריחו, העי, גבעון, חצור, ירושלים - איזו עיר לא נכבשה על ידי יהושע?", "a": "**התשובה:** ירושלים - אף שאדוני-צדק מלך ירושלים יצא להילחם וניגף באיילון (יהושע י'), העיר עצמה לא נכבשה על ידי יהושע. יריחו נפלה (פרק ו'), העי נלכדה (פרק ח'), גבעון כרתה ברית (פרק ט'), וחצור נשרפה (י\"א:י\"א).", "source": "cross chapter", "type": "story"}, {"q": "2. ⭐⭐ הגבעונים, סיחון מלך חשבון, עוג מלך הבשן, יבין מלך חצור, אדוני-צדק מלך ירושלים - מי לא נלחם נגד ישראל?", "a": "**התשובה:** הגבעונים - הם לא נלחמו נגד ישראל אלא השיגו ברית שלום באמצעות ערמה (יהושע ט'). סיחון ועוג נלחמו ונוצחו (במדבר כ\"א), יבין מלך חצור נלחם ונוצח (יהושע י\"א), ואדוני-צדק מלך ירושלים יצא להילחם בגבעון וניגף (יהושע י'). הפריט החריג ביותר הוא **הגבעונים** שפעלו בדיפלומטיה ולא במלחמה.", "source": "cross chapter", "type": "story"}, {"q": "3. ⭐⭐ חציית הירדן, הקפות יריחו, קרב העי, קרב גבעון, קרב מי מרום - באיזה מהם לא היה נס על-טבעי מפורש?", "a": "**התשובה:** קרב העי (הפעם השנייה) - נלכד באסטרטגיה צבאית של מארב (יהושע ח'), ללא נס מפורש. בחציית הירדן המים נעצרו (ג'-ד'), ביריחו החומות נפלו (ו'), בגבעון השמש עמדה ונפלו אבני ברד (י'), ובמי מרום ה' הבטיח ניצחון (י\"א:ו').", "source": "cross chapter", "type": "story"}], "text": [{"q": "טקסט: \"רַק חֲזַק וֶאֱמַץ מְאֹד לִשְׁמֹר\"\nשאלה: מי אומר את הדברים האלה ולמי, ומה ההקשר הספציפי של \"חזק ואמץ\" כאן לעומת שתי הפעמים האחרות שהביטוי מופיע באותו פרק?", "a": "ה' אומר ליהושע. כאן ההקשר הוא שמירת התורה (\"לשמור לעשות ככל התורה\"). הפעם הראשונה (פסוק ו) - בהקשר הנחלת הארץ (\"כי אתה תנחיל את העם\"), והפעם השלישית (פסוק ט) - חיזוק כללי (\"אל תערוץ ואל תחת\").", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כֹּל אֲשֶׁר צִוִּיתָנוּ נַעֲשֶׂה\"\nשאלה: מי אומרים את הדברים האלו ולמי, ומה העונש שהם קובעים בהמשך דבריהם למי שימרה?", "a": "בני ראובן, בני גד וחצי שבט מנשה אומרים ליהושע. הם קבעו עונש מוות: \"כל איש אשר ימרה את פיך ולא ישמע את דבריך לכל אשר תצוונו יומת\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"מֹשֶׁה עַבְדִּי מֵת וְעַתָּה קוּם\"\nשאלה: מי אומר את הדברים האלה, ובאיזה תואר מכונה מקבל הדברים בפתיחת הפרק?", "a": "ה' אומר את הדברים ליהושע בן נון. יהושע מכונה בפתיחת הפרק \"משרת משה\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"הָכִינוּ לָכֶם צֵידָה כִּי בְּעוֹד שְׁלֹשֶׁת יָמִים\"\nשאלה: מי נותן את הפקודה הזו, ולמי היא מופנית?", "a": "יהושע נותן את הפקודה לשוטרי העם, והם צריכים להעביר אותה לעם.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"נְשֵׁיכֶם טַפְּכֶם וּמִקְנֵיכֶם יֵשְׁבוּ בָּאָרֶץ\"\nשאלה: למי נאמרים הדברים האלה, ומה ההבדל בין מה שנשאר מאחור לבין מה שצריך לעבור?", "a": "הדברים נאמרים לשבטי ראובן, גד וחצי שבט מנשה. מאחור בעבר הירדן המזרחי נשארים נשיהם, טפם ומקניהם. הגברים עצמם צריכים לעבור חמושים לפני אחיהם כגיבורי חיל ולעזור בכיבוש.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"לֹא יִתְיַצֵּב אִישׁ לְפָנֶיךָ\"\nשאלה: מי אומר את הדברים האלה ולמי, ומה מצווה הדובר בפסוקים הבאים לגבי \"ספר התורה הזה\"?", "a": "ה' אומר ליהושע. בפסוקים הבאים ה' מצווה אותו: \"לא ימוש ספר התורה הזה מפיך והגית בו יומם ולילה למען תשמור לעשות ככל הכתוב בו כי אז תצליח את דרכך ואז תשכיל\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כְּכֹל אֲשֶׁר שָׁמַעְנוּ אֶל מֹשֶׁה כֵּן נִשְׁמַע אֵלֶיךָ\"\nשאלה: מי אומרים את הדברים האלה ולמי, ומהו התנאי הנסתר שהם מציבים במילה \"רק\"?", "a": "בני ראובן, גד וחצי שבט מנשה אומרים ליהושע. התנאי שהם מציבים הוא שה' יהיה עם יהושע כשם שהיה עם משה - רק אם ה' עמו, הם מתחייבים לשמוע לו.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"הֲלוֹא צִוִּיתִיךָ חֲזַק וֶאֱמָץ\"\nשאלה: מי אומר את הדברים האלה, ומה הפקודה הראשונה שמקבל הדברים נותן מיד אחרי שיחה זו?", "a": "ה' אומר ליהושע. מיד אחרי כן יהושע מצווה את שוטרי העם: \"עברו בקרב המחנה וצוו את העם לאמר הכינו לכם צידה כי בעוד שלושת ימים אתם עוברים את הירדן הזה\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כָּל מָקוֹם אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם\"\nשאלה: מי אומר את הדברים האלה ולמי, ומהם ארבעת גבולות הארץ שמפורטים בפסוק שמיד אחרי?", "a": "ה' אומר ליהושע. ארבעת הגבולות: (1) המדבר בדרום, (2) הלבנון בצפון, (3) נהר פרת (הנהר הגדול) במזרח-צפון, (4) הים הגדול (הים התיכון) מבוא השמש במערב. גם כל ארץ החתים מוזכרת.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ\"\nשאלה: מי אומר את ההבטחה הזו ולמי, ומה המילה הנדירה \"ארפך\" פירושה?", "a": "ה' אומר ליהושע. \"ארפך\" מלשון \"להרפות\" - לעזוב, להניח, לשחרר אחיזה. ה' מבטיח שלא ירפה ממנו (לא ישחרר אותו) ולא יעזבנו - כפילות של הבטחת נוכחות וליווי.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כִּי אָז תַּצְלִיחַ אֶת דְּרָכֶךָ וְאָז תַּשְׂכִּיל\"\nשאלה: מהו התנאי שמופיע לפני הבטחה זו - מה צריך יהושע לעשות כדי \"להצליח ולהשכיל\"?", "a": "התנאי הוא \"לא ימוש ספר התורה הזה מפיך והגית בו יומם ולילה למען תשמור לעשות ככל הכתוב בו\" - ללמוד תורה יומם ולילה ולשמור לעשות ככל הכתוב בה. רק אז יצליח.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כָּל אִישׁ אֲשֶׁר יַמְרֶה אֶת פִּיךָ\"\nשאלה: מי קובעים את עונש המוות הזה ולמי, ומה המילה האחרונה שהם אומרים אחרי גזירת העונש?", "a": "שבטי ראובן, גד וחצי שבט מנשה קובעים את העונש ליהושע (למי שימרה את פי יהושע). המילה האחרונה שלהם היא \"רק חזק ואמץ\" - הם חוזרים על הביטוי שה' אמר ליהושע ומחזקים אותו.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיְהִי אַחֲרֵי מוֹת מֹשֶׁה עֶבֶד ה'\"\nשאלה: הפסוק מכנה את משה \"עבד ה'\" ואת יהושע \"משרת משה\". מה ההבדל בין שני התארים, ולמי ה' פונה ראשון אחרי מות משה?", "a": "\"עבד ה'\" הוא תואר של מנהיג שעובד ישירות את ה', בעוד \"משרת משה\" הוא תואר של מי שמשרת את המנהיג - יהושע עדיין מוגדר ביחס למשה, לא ביחס לה'. ה' פונה ישירות ליהושע - והוא הראשון ששומע מה' אחרי מות משה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"ה' אֱלֹהֵיכֶם מֵנִיחַ לָכֶם\"\nשאלה: מי אומר את הדברים האלה ולמי, ומהי ההתחייבות שמוזכרת מיד אחרי \"מניח לכם\"?", "a": "יהושע אומר לשבטי ראובן, גד וחצי שבט מנשה. ההתחייבות: שנשותיהם, טפם ומקניהם ישבו בעבר הירדן, אך הגברים יעברו חמושים לפני אחיהם.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְהָגִיתָ בּוֹ יוֹמָם וָלַיְלָה\"\nשאלה: מה הוא ה\"בו\" שצריך להגות בו, ומי אומר את הדברים האלה?", "a": "\"בו\" מתייחס לספר התורה. ה' אומר ליהושע: \"לא ימוש ספר התורה הזה מפיך והגית בו יומם ולילה\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיְצַו יְהוֹשֻׁעַ אֶת שֹׁטְרֵי הָעָם\"\nשאלה: מה הפקודה שיהושע מעביר דרך שוטרי העם, ותוך כמה ימים אמורים לבצע אותה?", "a": "הפקודה: \"הכינו לכם צידה כי בעוד שלושת ימים אתם עוברים את הירדן הזה\" - תוך שלושה ימים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אַל תָּסוּר מִמֶּנּוּ\"\nשאלה: \"אל תסור ממנו\" - ממה אסור לסור, ומהן שתי המילים שמשלימות את האיסור הזה בפסוק?", "a": "אסור לסור מספר התורה (\"ככל התורה אשר ציווך משה עבדי\"). שתי המילים המשלימות: \"ימין ושמאול\" - אל תסור ממנו ימין ושמאול.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְשַׁבְתֶּם לְאֶרֶץ יְרֻשַּׁתְכֶם\"\nשאלה: מי יחזרו ל\"ארץ ירושתכם\", ומה התנאי שצריך להתקיים לפני שיוכלו לחזור?", "a": "שבטי ראובן, גד וחצי שבט מנשה. התנאי: \"עד אשר יניח ה' לאחיכם ככם וירשו גם המה את הארץ\" - רק אחרי שגם שאר השבטים ירשו את הארץ, רשאים לחזור לנחלתם בעבר הירדן מזרח השמש.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אַל תַּעֲרֹץ וְאַל תֵּחָת\"\nשאלה: באיזו מתוך שלוש אמירות \"חזק ואמץ\" בפרק מופיעות המילים האלה, ומה הסיבה שניתנת מיד אחריהן?", "a": "באמירה השלישית (פסוק ט) - \"הלוא ציוויתיך חזק ואמץ אל תערוץ ואל תחת\". הסיבה: \"כי עמך ה' אלוהיך בכל אשר תלך\" - נוכחות ה' היא הסיבה לאומץ.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְאֶל כָּל אֲשֶׁר תִּשְׁלָחֵנוּ\"\nשאלה: מי אומרים \"ואל כל אשר תשלחנו נלך\", ואיזה פסוק מופיע מיד לפני כן באותו דיבור?", "a": "שבטי ראובן, גד וחצי שבט מנשה אומרים ליהושע. הפסוק שמיד לפני: \"כל אשר ציוויתנו נעשה\" - קודם ההתחייבות לעשות ואז ההתחייבות ללכת.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"יָדַעְתִּי כִּי נָתַן ה' לָכֶם אֶת הָאָרֶץ\"\nשאלה: מי אומרת את הדברים האלה ולמי, ואילו שני אירועים היסטוריים היא מזכירה בהמשך דבריה כהוכחה?", "a": "רחב אומרת למרגלים. היא מזכירה את קריעת ים סוף (\"אשר הוביש ה' את מי ים סוף מפניכם בצאתכם ממצרים\") ואת הניצחון על שני מלכי האמורי בעבר הירדן - סיחון ועוג.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַתּוֹרִדֵם בַּחֶבֶל בְּעַד הַחַלּוֹן\"\nשאלה: את מי מורידים כאן ולאן יעצה להם ללכת אחרי שירדו, ומה הסימן שהם הורו לה לקשור באותו חלון?", "a": "רחב מורידה את שני המרגלים. היא יעצה להם ללכת להרים ולהיחבא שם שלושה ימים עד שוב הרודפים. הסימן שהמרגלים הורו לה לקשור בחלון הוא תקוות חוט השני.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַתִּקַּח הָאִשָּׁה אֶת שְׁנֵי הָאֲנָשִׁים וַתִּצְפְּנוֹ\"\nשאלה: מה הסתירה בין שני חלקי הפסוק - מה האישה עשתה באמת ומה היא אמרה? והיכן בדיוק הסתירה אותם?", "a": "בחלק הראשון כתוב שהיא לקחה את שני האנשים והצפינה (החביאה) אותם. בחלק השני היא משקרת לשליחי המלך ואומרת שלא ידעה מאיפה הם. היא העלתה אותם לגג והטמינה אותם בפשתי העץ הערוכות לה על הגג.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת\"\nשאלה: מי אומרים את הדברים האלה ולמי, ומהם שלושת התנאים שהם מציבים כדי שהשבועה תהיה בתוקף?", "a": "המרגלים אומרים לרחב. שלושת התנאים: (1) לקשור את תקוות חוט השני בחלון שממנו הורידה אותם, (2) לאסוף את כל בני משפחתה אל תוך הבית, (3) לא לגלות את עניינם - \"ואם תגידי את דברנו זה והיינו נקיים משבועתך\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כִּי נָתַן ה' בְּיָדֵנוּ אֶת כָּל הָאָרֶץ\"\nשאלה: מי אומרים את הדברים האלה ולמי, ומה מיוחד באופן שהם נשלחו למשימה?", "a": "שני המרגלים אומרים ליהושע כשחזרו מיריחו. הם נשלחו בסתר - \"חרש\" - מן השיטים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַנִּשְׁמַע וַיִּמַּס לְבָבֵנוּ\"\nשאלה: מי אומרת את הדברים האלה ולמי, ומה היא מבקשת מהם מיד אחרי הכרזה זו?", "a": "רחב אומרת לשני המרגלים. מיד אחרי כן היא מבקשת: \"השבעו נא לי בה' כי עשיתי עמכם חסד ועשיתם גם אתם עם בית אבי חסד\" - שיחיו את אביה, אמה, אחיה, אחיותיה וכל אשר להם.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"הוֹצִיאִי הָאֲנָשִׁים הַבָּאִים אֵלַיִךְ\"\nשאלה: מי אומר את הדברים האלה ולמי, ומה עשתה מקבלת הדברים בפועל במקום לציית?", "a": "מלך יריחו (דרך שליחיו) אומר לרחב. במקום לציית, רחב הסתירה את שני המרגלים על הגג בפשתי העץ, שיקרה ואמרה שהם כבר יצאו, ושלחה את הרודפים לכיוון הירדן אל המעברות.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"הָהָרָה לֵכוּ פֶּן יִפְגְּעוּ בָכֶם\"\nשאלה: מי נותנת את העצה הזו ולמי, וכיצד הוציאה אותם מביתה?", "a": "רחב נותנת את העצה לשני המרגלים. היא הורידה אותם בחבל בעד החלון כי ביתה היה בקיר החומה, ושלחה אותם להרים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁכְּבוּ שָׁמָּה\"\nשאלה: מי \"שכבו שמה\" ובאיזה בית, וכיצד נודע למלך יריחו על נוכחותם?", "a": "שני המרגלים שכבו בבית רחב הזונה. הפסוק אומר \"ויאמר למלך יריחו... הנה אנשים באו הנה הלילה מבני ישראל לחפור את הארץ\" - מישהו דיווח למלך, אך הכתוב לא מפרט מי.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַתִּצְפְּנוֹ\"\nשאלה: מילה זו כתובה בלשון יחיד (\"ותצפנו\") למרות שמדובר בשני אנשים. מי הצפינה ואת מי, והיכן בדיוק הסתירה אותם?", "a": "רחב הצפינה את שני המרגלים. היא העלתה אותם לגג והטמינה אותם בפשתי העץ הערוכות לה על הגג. לשון היחיד \"ותצפנו\" על שני אנשים היא תופעה לשונית מיוחדת בפסוק.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"רִדְפוּ מַהֵר אַחֲרֵיהֶם כִּי תַשִּׂיגוּם\"\nשאלה: מי אומרת \"רדפו מהר\" ולמי, והאם הכיוון שהיא שולחת אותם הוא הכיוון הנכון?", "a": "רחב אומרת לשליחי מלך יריחו (הרודפים). הכיוון שקרי - היא שלחה אותם דרך הירדן אל המעברות, בעוד המרגלים בכלל היו מוסתרים על גג ביתה. את המרגלים היא שלחה אחר כך לכיוון ההפוך - להרים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כֹּל אֲשֶׁר יֵצֵא מִדַּלְתֵי בֵיתֵךְ\"\nשאלה: מי אומרים את הדברים האלה ולמי, ומה המשמעות של \"דמו בראשו\" - מי נושא באחריות?", "a": "המרגלים אומרים לרחב. \"דמו בראשו\" פירושו שמי שיצא מהבית החוצה - אחריות מותו עליו עצמו, לא על המרגלים. רק מי שיישאר בתוך הבית מוגן על ידי השבועה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיְסַפְּרוּ לוֹ אֵת כָּל הַמֹּצְאוֹת אוֹתָם\"\nשאלה: מי סיפרו ולמי, ומהי המילה הנדירה \"המוצאות\" - מה פירושה?", "a": "שני המרגלים סיפרו ליהושע. \"המוצאות\" פירושה כל מה שקרה להם, כל האירועים שפגשו אותם - מלשון מקרה או מאורע. זהו דיווח מסכם על כל מה שעברו ביריחו.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"בְּפִשְׁתֵּי הָעֵץ הָעֲרֻכוֹת לָהּ\"\nשאלה: מה תפקיד \"פשתי העץ\" בסיפור, ומי הסתתר בהן ועל גג מי?", "a": "רחב הטמינה את שני המרגלים בפשתי העץ הערוכות לה על הגג. זה היה מקום המחבוא שלהם מפני שליחי מלך יריחו.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"מְרַגְּלִים חֶרֶשׁ\"\nשאלה: מי שלח את המרגלים \"חרש\", ומאיזה מקום נשלחו?", "a": "יהושע בן נון שלח שני מרגלים חרש (בסתר) מן השיטים לרגל את הארץ ואת יריחו.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"תִּקְוַת חוּט הַשָּׁנִי הַזֶּה\"\nשאלה: היכן בדיוק צריך לקשור את \"תקוות חוט השני\", ומי הורה לקשור אותו?", "a": "המרגלים הורו לרחב לקשור את תקוות חוט השני בחלון שממנו הורידה אותם - כסימן להצלת משפחתה בעת הכיבוש.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"לַחְפֹּר אֶת הָאָרֶץ\"\nשאלה: מי משתמש בביטוי \"לחפור את הארץ\", ומה פירוש המילה \"לחפור\" בהקשר זה?", "a": "מלך יריחו (דרך שליחיו) אומר לרחב: \"כי לחפור את כל הארץ באו\" - הוא מאשים את המרגלים שבאו \"לחפור\" כלומר לרגל, לחקור, לגלות סודות הארץ. המילה \"לחפור\" משמשת כמטאפורה לריגול.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְהַשַּׁעַר סָגְרוּ\"\nשאלה: מתי נסגר השער, ומה הקשר בין סגירת השער לבין הצלחת התחבולה של רחב?", "a": "השער נסגר אחרי שהרודפים יצאו לרדוף אחרי המרגלים בדרך הירדן אל המעברות. סגירת השער חשובה כי היא מונעת כניסה חוזרת - ברגע שהרודפים יצאו והשער נסגר, אי אפשר לחזור ולבדוק שוב בבית רחב.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"נְקִיִּם אֲנַחְנוּ\"\nשאלה: מי אומרים \"נקיים אנחנו\", מה הדבר שממנו הם \"נקיים\", ובאילו שני מקרים ספציפיים הם יהיו נקיים מהשבועה?", "a": "המרגלים אומרים לרחב. הם נקיים מהשבועה שהשביעה אותם. שני המקרים: (1) אם רחב תגיד את דברם - \"ואם תגידי את דברנו זה\", (2) אם מישהו מבני משפחתה ייצא מדלתות הבית החוצה - \"כל אשר יצא מדלתי ביתך החוצה דמו בראשו\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כְּדִבְרֵיכֶם כֶּן הוּא\"\nשאלה: מי אומרת \"כדבריכם כן הוא\" ולמי, ומה הפעולה שהיא עושה מיד אחרי שהם הלכו?", "a": "רחב אומרת למרגלים - היא מסכימה לכל תנאיהם. מיד אחרי ששילחה אותם והלכו, היא קושרת את תקוות השני בחלון: \"ותשלחם וילכו ותקשור את תקוות השני בחלון\" - לא המתינה אלא קשרה מיד.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"הִתְקַדָּשׁוּ כִּי מָחָר יַעֲשֶׂה ה' בְּקִרְבְּכֶם נִפְלָאוֹת\"\nשאלה: מי אומר את הדברים האלה ולמי, ואילו \"נפלאות\" מתרחשות למחרת?", "a": "יהושע אומר לעם. למחרת מתרחשת חציית הירדן בנס - כשרגלי הכוהנים נושאי הארון נטבלו במים, עמדו מי הירדן נד אחד, והעם עברו ביבשה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיַּעַמְדוּ הַמַּיִם הַיֹּרְדִים מִלְמַעְלָה קָמוּ נֵד אֶחָד\"\nשאלה: מה היה מצב הירדן כשהכוהנים נכנסו למים לפי הפסוקים הקודמים, ומדוע זה מגדיל את הנס המתואר כאן?", "a": "הירדן היה מלא על כל גדותיו כי היו ימי קציר. זה מגדיל את הנס כי הנהר היה בשיא גובהו ובכל זאת המים נעצרו ועמדו נד אחד הרחק מאוד.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כִּי יִשְׁאָלוּן בְּנֵיכֶם מָחָר\"\nשאלה: על איזה \"אות\" מדובר כאן - כמה אבנים הוקמו, מאיפה נלקחו, ולאן הועברו?", "a": "שתים עשרה אבנים נלקחו מתוך הירדן ממצב רגלי הכוהנים, והועברו והוקמו בגלגל כזיכרון לחציית הירדן.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיַּעַבְרוּ בְּנֵי רְאוּבֵן וּבְנֵי גָד חֲמֻשִׁים\"\nשאלה: כמה חלוצי צבא עברו מתוך שבטים אלה לפי הפסוק הבא, ומה היו צריכים להשאיר מאחוריהם בעבר הירדן?", "a": "כארבעים אלף חלוצי צבא עברו. מאחוריהם בעבר הירדן המזרחי השאירו את נשיהם, טפם ומקניהם.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיַּעַמְדוּ הַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן בֶּחָרָבָה\"\nשאלה: מה קרה ברגע שכפות רגלי הכוהנים האלה נתקו מהירדן ועלו ליבשה?", "a": "מי הירדן שבו למקומם והלכו כתמול שלשום על כל גדותיו - הנס הסתיים ברגע שהכוהנים עלו מהנהר.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אַךְ רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵינָיו\"\nשאלה: ממה העם צריך לשמור מרחק לפי פסוק זה, ומדוע ניתנה ההוראה הזו?", "a": "העם צריך לשמור מרחק של כאלפיים אמה מארון ברית ה' שנושאים הכוהנים הלויים. הסיבה: \"למען אשר תדעו את הדרך אשר תלכו בה כי לא עברתם בדרך מתמול שלשום\" - כך יוכלו לראות את הארון ולדעת לאן ללכת.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"הַיּוֹם הַזֶּה אָחֵל גַּדֶּלְךָ\"\nשאלה: מי אומר את הדברים האלה ולמי, ומה הפקודה המעשית שהדובר נותן מיד אחרי?", "a": "ה' אומר ליהושע. מיד אחרי כן ה' מצווה: \"ואתה תצוה את הכוהנים נושאי ארון הברית לאמר כבואכם עד קצה מי הירדן בירדן תעמודו\" - הכוהנים צריכים לעמוד במי הירדן.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"בַּיַּבָּשָׁה עָבַר יִשְׂרָאֵל אֶת הַיַּרְדֵּן\"\nשאלה: מי אומר את הדברים האלה, ולאיזה נס מן העבר הוא משווה את חציית הירדן בהמשך דבריו?", "a": "יהושע אומר לבני ישראל. הוא משווה את חציית הירדן לקריעת ים סוף: \"כאשר עשה ה' אלהיכם לים סוף אשר הובישו מפנינו עד עברנו\" - שני הנסים הם הובשת מים לטובת ישראל.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְהַיַּרְדֵּן מָלֵא עַל כָּל גְּדוֹתָיו\"\nשאלה: מדוע הכתוב מציין את פרט \"ימי קציר\" דווקא כאן, ומה בדיוק קרה ברגע שרגלי הכוהנים נטבלו בקצה המים?", "a": "פרט \"ימי קציר\" מדגיש שהנהר היה בשיא שיטפונו - מלא על כל גדותיו - מה שמגדיל את הנס. ברגע שרגלי הכוהנים נטבלו בקצה המים, עמדו המים היורדים מלמעלה נד אחד הרחק מאוד באדם העיר, והמים שלמטה נכרתו לכיוון ים המלח.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וּשְׁתֵּים עֶשְׂרֵה אֲבָנִים הֵקִים יְהוֹשֻׁעַ בְּתוֹךְ הַיַּרְדֵּן\"\nשאלה: הפסוק מדבר על אבנים שהוקמו בתוך הירדן. אבל הרי היו גם שתים עשרה אבנים אחרות - מה ההבדל בין שתי קבוצות האבנים?", "a": "קבוצה ראשונה: שתים עשרה אבנים נלקחו מתוך הירדן (ממצב רגלי הכוהנים) והוקמו בגלגל כזיכרון. קבוצה שנייה: שתים עשרה אבנים הקים יהושע בתוך הירדן עצמו, תחת מצב רגלי הכוהנים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"בַּיּוֹם הַהוּא גִּדַּל ה' אֶת יְהוֹשֻׁעַ\"\nשאלה: מה הבטיח ה' ליהושע לפני חציית הירדן לגבי מעמדו, ומה כתוב שהייתה תוצאת הנס?", "a": "ה' הבטיח \"היום הזה אחל גדלך בעיני כל ישראל\". התוצאה: \"וייראו אותו כאשר יראו את משה כל ימי חייו\" - העם ירא את יהושע כפי שירא את משה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְהָעָם עָלוּ מִן הַיַּרְדֵּן בֶּעָשׂוֹר לַחֹדֶשׁ הָרִאשׁוֹן\"\nשאלה: מה המשמעות של התאריך \"עשור לחודש הראשון\", וכמה ימים נותרו עד הפסח?", "a": "העשור לחודש הראשון (ניסן) הוא עשרה בניסן. נותרו ארבעה ימים עד הפסח (י\"ד בניסן). בתאריך זה גם לוקחים את שה הפסח - ואכן בהמשך כתוב שעשו את הפסח בי\"ד לחודש.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"לְמַעַן דַּעַת כָּל עַמֵּי הָאָרֶץ\"\nשאלה: לפי פסוק זה, מה המטרה הכפולה של נס חציית הירדן - מה אמור לקרות גם כלפי חוץ וגם כלפי פנים?", "a": "כלפי חוץ: \"למען דעת כל עמי הארץ את יד ה' כי חזקה היא\" - כל עמי העולם יכירו בכוח ה'. כלפי פנים: \"למען יראתם את ה' אלהיכם כל הימים\" - בני ישראל עצמם ייראו את ה'.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיָּשֻׁבוּ מֵי הַיַּרְדֵּן לִמְקוֹמָם\"\nשאלה: מתי בדיוק שבו מי הירדן למקומם - מה הפעולה שגרמה לכך?", "a": "ברגע שכפות רגלי הכוהנים נושאי ארון ברית ה' נתקו מהירדן ועלו ליבשה - המים שבו למקומם והלכו כתמול שלשום על כל גדותיו.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כְּאַרְבָּעִים אֶלֶף חֲלוּצֵי הַצָּבָא\"\nשאלה: מאילו שבטים היו ארבעים אלף חלוצי הצבא, ולאן עברו?", "a": "מבני ראובן, בני גד וחצי שבט מנשה. הם עברו חמושים לפני ה' למלחמה אל ערבות יריחו.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיַּחֲנוּ בַּגִּלְגָּל\"\nשאלה: היכן בדיוק הגלגל ביחס ליריחו, ומה הוקם שם כזיכרון?", "a": "הגלגל נמצא בקצה מזרח יריחו. שם הקים יהושע את שתים עשרה האבנים שנלקחו מתוך הירדן כזיכרון לחציית הירדן.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אֵל חַי בְּקִרְבְּכֶם\"\nשאלה: מי אומר \"אל חי בקרבכם\", ומה הרשימה המלאה של שבעת העמים שמוזכרים מיד אחרי ביטוי זה?", "a": "יהושע אומר לבני ישראל. שבעת העמים: הכנעני, החתי, החוי, הפריזי, הגרגשי, האמורי, והיבוסי - \"והורש יוריש מפניכם\" את כולם.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"בְּאָדָם הָעִיר\"\nשאלה: מהי \"אדם העיר\" ומה מצד מה היא נמצאת, ומה קרה שם בדיוק בזמן חציית הירדן?", "a": "אדם העיר נמצאת \"מצד צרתן\" - זהו המקום שבו נערמו המים ועמדו נד אחד, הרחק מאוד ממקום החצייה. המים שירדו מלמעלה נעצרו באדם ולא המשיכו לזרום דרומה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אִישׁ אֶבֶן אַחַת עַל שִׁכְמוֹ\"\nשאלה: מי הם הנושאים שכל אחד מהם נושא \"אבן אחת על שכמו\", ומאיפה בדיוק הם לוקחים את האבנים?", "a": "שנים עשר איש, איש אחד מכל שבט. הם לוקחים את האבנים מתוך הירדן \"ממצב רגלי הכוהנים הכן\" - מהמקום המדויק שבו עמדו רגלי הכוהנים נושאי הארון.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אֲרוֹן הַבְּרִית אֲדוֹן כָּל הָאָרֶץ\"\nשאלה: מי משתמש בכינוי \"אדון כל הארץ\" ובאיזה הקשר, ומה הפעולה שהארון אמור לבצע לפי דבריו?", "a": "יהושע אומר לבני ישראל: \"הנה ארון הברית אדון כל הארץ עובר לפניכם בירדן\" - הארון עובר לפני העם אל תוך הירדן, ובנוח כפות רגלי הכוהנים נושאיו במים, מי הירדן ייכרתו.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיְמַהֲרוּ הָעָם\"\nשאלה: מי הם \"העם\" שמיהרו, ובאיזה שלב בדיוק של חציית הירדן הם מיהרו?", "a": "כל ישראל מיהרו לעבור את הירדן בעוד הכוהנים נושאי הארון עומדים בתוך הירדן. הם מיהרו כנראה מפחד שהמים ישובו - \"עד תום כל הדבר אשר ציווה ה' את יהושע לדבר אל העם... וימהרו העם ויעברו\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"הֲלָנוּ אַתָּה אִם לְצָרֵינוּ\"\nשאלה: מי שואל את השאלה הזו, כיצד הזדהה האיש שעמד לנגדו, ומה ציווה אותו לעשות?", "a": "יהושע שואל. האיש הזדהה כ\"שר צבא ה'\" וציווה את יהושע: \"של נעלך מעל רגלך כי המקום אשר אתה עומד עליו קודש הוא\" - בדומה למשה בסנה הבוער.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"לֹא תָרִיעוּ וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם\"\nשאלה: מתי ניתנה פקודה זו - באיזה שלב של ההקפות, ומה קרה כשלבסוף אמר להם להריע?", "a": "הפקודה ניתנה לפני ששת ימי ההקפות הראשונים - העם לא השמיע קול במשך כל שישה ימים. כשלבסוף ביום השביעי, בהקפה השביעית, הריעו תרועה גדולה - נפלה חומת יריחו תחתיה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אָרוּר הָאִישׁ לִפְנֵי ה' אֲשֶׁר יָקוּם\"\nשאלה: מה בדיוק הקללה שמשלים פסוק זה - מה יקרה למי שיבנה מחדש את העיר המוזכרת?", "a": "\"בבכורו ייסדנה ובצעירו יציב דלתיה\" - מי שיבנה את יריחו מחדש, בבנו הבכור ייסד אותה ובבנו הצעיר יציב דלתותיה (כלומר, בניו ימותו).", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְהָיְתָה הָעִיר חֵרֶם הִיא וְכָל אֲשֶׁר בָּהּ\"\nשאלה: מי חריג מדין החרם המתואר כאן ומדוע, ומה כן הותר לקחת מהעיר?", "a": "רחב הזונה ומשפחתה חריגים מדין החרם - כי היא החביאה את המרגלים שיהושע שלח. מותר היה לקחת רק כסף וזהב וכלי נחושת וברזל - שהיו קודש לה' ונכנסו לאוצר ה'.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיָּרִיעוּ הָעָם תְּרוּעָה גְדוֹלָה וַתִּפֹּל הַחוֹמָה\"\nשאלה: ביום כמה מתוך ימי ההקפות מתרחש האירוע המתואר כאן, ומהו סדר ההליכה סביב העיר שקדם לרגע הזה?", "a": "ביום השביעי (בהקפה השביעית של אותו יום). סדר ההליכה: החלוץ, שבעת הכוהנים עם שופרות היובלים, ארון ברית ה', והמאסף הולך אחרי הארון.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כִּי אֲנִי שַׂר צְבָא ה' עַתָּה בָאתִי\"\nשאלה: מה שאל יהושע את האיש הזה לפני שהזדהה, ומה ציווה אותו האיש לעשות?", "a": "יהושע שאל \"הלנו אתה אם לצרינו\" - האם אתה מצידנו או מצד אויבינו. שר צבא ה' ציווה אותו: \"של נעלך מעל רגלך כי המקום אשר אתה עומד עליו קודש הוא\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"עֲשֵׂה לְךָ חַרְבוֹת צֻרִים וְשׁוּב מֹל\"\nשאלה: מי אומר את הדברים האלה ולמי, ומדוע היה צורך למול שוב את בני ישראל?", "a": "ה' אומר ליהושע. כל היוצאים ממצרים היו מולים, אך כל הנולדים במדבר בארבעים שנות הנדודים לא נימולו. אנשי המלחמה שיצאו ממצרים מתו במדבר, ואת בניהם שהוקמו תחתם מל יהושע.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁבֹּת הַמָּן מִמָּחֳרָת\"\nשאלה: מה אכלו בני ישראל יום לפני שהמן שבת, ובאיזה תאריך ומקום עשו את הפסח שקדם לכך?", "a": "יום לפני שהמן שבת אכלו ממחרת הפסח מצות וקלוי מעבור הארץ. הפסח נעשה בארבעה עשר יום לחודש הראשון בערב, בערבות יריחו, כשהם חונים בגלגל.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"שַׁל נַעַלְךָ מֵעַל רַגְלֶךָ\"\nשאלה: מי אומר את הדברים האלה ולמי, ולאיזה אירוע מפורסם בחומש דומים הדברים כמעט מילה במילה?", "a": "שר צבא ה' אומר ליהושע. הדברים דומים למה שה' אמר למשה בסנה הבוער: \"של נעליך מעל רגליך כי המקום אשר אתה עומד עליו אדמת קודש הוא\" (שמות ג).", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וִירִיחוֹ סֹגֶרֶת וּמְסֻגֶּרֶת\"\nשאלה: מה המשמעות של הכפילות \"סוגרת ומסוגרת\" - מה היה מצב העיר, ומה ציווה ה' מיד אחרי תיאור זה?", "a": "הכפילות מדגישה שהעיר הייתה סגורה לחלוטין מבפנים ומבחוץ - אף אחד לא יצא ולא נכנס מפחד ישראל. מיד אחרי כן ה' ציווה את יהושע על תוכנית ההקפות: לסובב את העיר פעם אחת ביום שישה ימים, וביום השביעי שבע פעמים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְהֶחָלוּץ הֹלֵךְ לִפְנֵי הַכֹּהֲנִים\"\nשאלה: מי הם ה\"חלוץ\" ומי הם ה\"מאסף\" בסדר ההקפה, ומה עשו הכוהנים תוך כדי הליכה?", "a": "החלוץ הם החיילים הנושאים נשק שהלכו בראש התהלוכה. המאסף הם הלוחמים שהלכו אחרי הארון בסוף. הכוהנים תקעו בשופרות תוך כדי הליכה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"כִּי הֶחְבִּיאָה אֶת הַמַּלְאָכִים\"\nשאלה: הפסוק קורא למרגלים \"מלאכים\" (שליחים). מי הם, ומה נעשה עם רחב ומשפחתה אחרי שהוצאו מהעיר?", "a": "הם שני המרגלים ששלח יהושע. רחב ומשפחתה הוצאו מהעיר על ידי אותם מרגלים (הנערים) והונחו מחוץ למחנה ישראל. רחב ישבה בקרב ישראל \"עד היום הזה\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"הַיּוֹם גַּלּוֹתִי אֶת חֶרְפַּת מִצְרַיִם מֵעֲלֵיכֶם\"\nשאלה: מי אומר את הדברים האלה ולמי, מה פירוש \"חרפת מצרים\", ומה שם המקום שנקרא על שם מאורע זה?", "a": "ה' אומר ליהושע. \"חרפת מצרים\" היא הערלה - המילה שנעשתה גילגלה את החרפה. המקום נקרא גלגל - על שם \"גלותי\" (גילגלתי/הסרתי) את חרפת מצרים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"עֲשֵׂה לְךָ חַרְבוֹת צֻרִים\"\nשאלה: מי מצווה לעשות \"חרבות צורים\" ולאיזו מטרה, והיכן בוצעה הפעולה?", "a": "ה' מצווה את יהושע לעשות חרבות צורים (סכיני אבן צור) כדי למול את בני ישראל שנית. הפעולה בוצעה בגבעת הערלות.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים\"\nשאלה: מי נשאו את שבעת שופרות היובלים, והיכן הלכו ביחס לארון?", "a": "שבעה כוהנים נשאו את שבעת שופרות היובלים לפני ארון ה', הלכו ותקעו בשופרות.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַתֵּשֶׁב בְּקֶרֶב יִשְׂרָאֵל\"\nשאלה: מי \"ישבה בקרב ישראל\", ומה הסיבה שניתנת בפסוק לכך שהחיו אותה?", "a": "רחב הזונה. הסיבה: \"כי החביאה את המלאכים אשר שלח יהושע לרגל את יריחו\" - בזכות שהחביאה את המרגלים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אֵין יוֹצֵא וְאֵין בָּא\"\nשאלה: על איזו עיר מדובר, ומה הסיבה שניתנת בפסוק למצב ש\"אין יוצא ואין בא\"?", "a": "יריחו - \"ויריחו סוגרת ומסוגרת מפני בני ישראל אין יוצא ואין בא\". הסיבה: הפחד מבני ישראל (\"מפני בני ישראל\").", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"פֶּן תַּחֲרִימוּ\"\nשאלה: מי מזהיר \"פן תחרימו\", ומה יקרה למחנה ישראל כולו אם ייקחו מן החרם?", "a": "יהושע מזהיר את העם: \"ורק אתם שמרו מן החרם פן תחרימו ולקחתם מן החרם ושמתם את מחנה ישראל לחרם ועכרתם אותו\" - כל מחנה ישראל ייהפך לחרם ויבוא עליו אסון. זו בדיוק הנבואה שהתגשמה בחטא עכן.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"הַנְּעָרִים הַמְרַגְּלִים\"\nשאלה: הפסוק מכנה את המרגלים \"הנערים\" - מה הם עושים כאן, ואת מי בדיוק הם מוציאים?", "a": "\"הנערים המרגלים\" נכנסים לבית רחב ומוציאים \"את רחב ואת אביה ואת אמה ואת אחיה ואת כל אשר לה ואת כל משפחותיה הוציאו\" - רשימה מפורטת של בני המשפחה. הניחו אותם מחוץ למחנה ישראל.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"עַד חֲיוֹתָם\"\nשאלה: מי ישבו \"תחתם במחנה עד חיותם\", ומה האירוע שגרם להם להישאר במקום?", "a": "כל העם שנימולו בגבעת הערלות ישבו במחנה עד שהחלימו (\"עד חיותם\") - המילה \"חיותם\" מתארת את הריפוי מהמילה. רק אחרי שהחלימו יכלו להמשיך הלאה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ\"\nשאלה: על מי מתואר שחרבו שלופה בידו, ומה הדבר הראשון שיהושע אומר כשרואה אותו?", "a": "שר צבא ה' - \"והנה איש עומד לנגדו וחרבו שלופה בידו\". יהושע שואל אותו: \"הלנו אתה אם לצרינו\" - האם הוא מצד ישראל או מצד האויבים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אַל יַעַל כָּל הָעָם כִּי מְעַט הֵמָּה\"\nשאלה: מי אומרים את הדברים האלה ליהושע, ומה קרה כשפעלו על פי עצה זו?", "a": "המרגלים שנשלחו לרגל את העי אומרים זאת. כשלושת אלפים איש עלו בעקבות העצה ונסו לפני אנשי העי. אנשי העי הכו מהם כשלושים ושישה איש ורדפום עד השברים - התבוסה הראשונה של ישראל.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"בְּנִי שִׂים נָא כָבוֹד לַה'\"\nשאלה: מי אומר את הדברים האלה ולמי, ומהם שלושת הפריטים שהנשאל מודה בגניבתם?", "a": "יהושע אומר לעכן. עכן מודה שגנב אדרת שנער אחת טובה, מאתיים שקלים כסף ולשון זהב אחד חמישים שקלים משקלו. הוא הטמין אותם באדמה בתוך אוהלו.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּקְרַע יְהוֹשֻׁעַ שִׂמְלֹתָיו וַיִּפֹּל עַל פָּנָיו\"\nשאלה: מה גרם ליהושע להגיב בצורה המתוארת כאן, ומה ה' ענה לו?", "a": "התבוסה מול העי - כשלושים ושישה הרוגים מישראל ונסיגה. ה' ענה לו \"קם לך, למה זה אתה נופל על פניך, חטא ישראל\" - גנבו מהחרם, כיחשו ושמו בכליהם.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּמְעֲלוּ בְנֵי יִשְׂרָאֵל מַעַל בַּחֵרֶם\"\nשאלה: הפסוק אומר \"וימעלו בני ישראל\" אבל מזכיר רק אדם אחד. מהם ארבעת השלבים שבהם נלכד האיש בגורל?", "a": "שלב 1: נלכד שבט יהודה. שלב 2: נלכדה משפחת הזרחי. שלב 3: נלכד זבדי. שלב 4: נלכד עכן בן כרמי. אף שרק הוא חטא, כל ישראל נענש כי \"חטא ישראל\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"מֶה עֲכַרְתָּנוּ יַעְכָּרְךָ ה' בַּיּוֹם הַזֶּה\"\nשאלה: מי אומר את הדברים האלה ולמי, ומה הקשר בין מילים אלו לשם המקום שבו מתבצע העונש?", "a": "יהושע אומר לעכן. השם \"עמק עכור\" - מקום העונש - נגזר ממילות יהושע \"מה עכרתנו\", על שם שעכן עכר (הביא צרה) לישראל.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"חָטָא יִשְׂרָאֵל וְגַם עָבְרוּ אֶת בְּרִיתִי\"\nשאלה: מי אומר את הדברים האלה ולמי, ומה יהושע עשה בתגובה לתבוסה שגרמה לדברים אלה?", "a": "ה' אומר ליהושע. לפני כן, אחרי התבוסה בעי, יהושע קרע את שמלותיו ונפל על פניו ארצה לפני ארון ה' עד הערב, הוא וזקני ישראל העלו עפר על ראשם.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וָאֶרְאֶה בַשָּׁלָל אַדֶּרֶת שִׁנְעָר אַחַת\"\nשאלה: מי אומר את הדברים האלה ולמי, והיכן הטמין את הפריטים המתוארים?", "a": "עכן אומר ליהושע כשמודה בחטאו. הוא הטמין את הפריטים באדמה בתוך אוהלו, והכסף מתחת לאדרת: \"והנם טמונים בארץ בתוך האהלי והכסף תחתיה\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"קֻם לָךְ לָמָּה זֶּה אַתָּה נֹפֵל\"\nשאלה: מי אומר את הדברים האלה ולמי, ומהי שיטת הגילוי שהדובר מצווה עליה בהמשך?", "a": "ה' אומר ליהושע. ה' מצווה על תהליך גורלות בארבעה שלבים: קרבו לשבטים, השבט שיילכד יקרב למשפחות, המשפחה שתילכד תקרב לבתים, והבית שיילכד יקרב לגברים - עד שנלכד עכן בן כרמי בן זבדי בן זרח למטה יהודה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיַּכּוּ מֵהֶם אַנְשֵׁי הָעַי כִּשְׁלֹשִׁים וְשִׁשָּׁה\"\nשאלה: מה המקום \"השברים\" שמוזכר כאן, ומה הייתה ההמלצה המקורית של המרגלים שהובילה לתבוסה זו?", "a": "השברים הוא המקום שאליו רדפו אנשי העי את הנסים מישראל (מורד סלעי). ההמלצה המקורית הייתה לשלוח רק אלפיים-שלושת אלפים איש כי \"מעט המה\" - הם זלזלו באויב ושלחו כוח קטן.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְלוּ הוֹאַלְנוּ וַנֵּשֶׁב בְּעֵבֶר הַיַּרְדֵּן\"\nשאלה: מי אומר את הדברים האלה ולמי, ומה מפתיע בהם לאור האירועים שקדמו להם?", "a": "יהושע אומר לה' בתפילתו אחרי התבוסה בעי. המפתיע הוא שיהושע כמעט מתחרט על חציית הירדן - \"לו הואלנו ונשב בעבר הירדן\" - ביטוי ייאוש חסר תקדים מפי מנהיג שזה עתה חווה נסים גדולים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּרְגְּמוּ אֹתוֹ כָל יִשְׂרָאֵל אֶבֶן\"\nשאלה: הפסוק מתחיל ב\"אותו\" (יחיד) ועובר ל\"אותם\" (רבים). מי נענש כאן מלבד עכן עצמו?", "a": "גם בניו, בנותיו, שורו, חמורו, צאנו, אוהלו וכל אשר לו הובאו לעמק עכור ונענשו. המעבר מיחיד לרבים מלמד שכל רכושו ומשפחתו נכללו בעונש.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיָּקִימוּ עָלָיו גַּל אֲבָנִים גָּדוֹל\"\nשאלה: מה הקשר בין הקמת גל האבנים לבין שם המקום, ומה שינה עונש עכן מבחינת יחס ה' לישראל?", "a": "המקום נקרא \"עמק עכור\" על שם \"מה עכרתנו\" שאמר יהושע לעכן. העונש גרם לכך שה' שב מחרון אפו - כלומר, רק אחרי סילוק החוטא חזרה ההגנה האלוהית על ישראל.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְהָיָה הַנִּלְכָּד בַּחֵרֶם יִשָּׂרֵף בָּאֵשׁ\"\nשאלה: מי אומר את הדברים האלה ולמי, ומה מפתיע בשימוש במילה \"ברית\" כאן?", "a": "ה' אומר ליהושע. השימוש במילה \"ברית\" מפתיע כי איסור החרם מוצג לא רק כפקודה אלא כברית - עכן \"עבר את ברית ה'\" - כלומר לקיחה מהחרם היא הפרה של ברית בין ה' לישראל, לא סתם עבירה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּלָּכֵד שֵׁבֶט יְהוּדָה\"\nשאלה: מה היה השלב הבא אחרי שנלכד שבט יהודה בגורל, ומי נלכד בסוף התהליך?", "a": "אחרי שבט יהודה נלכדה משפחת הזרחי, אחר כך נלכד זבדי, ולבסוף נלכד עכן בן כרמי בן זבדי בן זרח.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְהַכֶּסֶף תַּחְתֶּיהָ\"\nשאלה: מה היה מעל הכסף, והיכן בדיוק היה הכול טמון?", "a": "האדרת (אדרת שנער) הייתה מעל הכסף. הכול היה טמון באדמה בתוך אוהלו של עכן - \"והנם טמונים בארץ בתוך האהלי והכסף תחתיה\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּמַּס לְבַב הָעָם וַיְהִי לְמָיִם\"\nשאלה: מה גרם ללבב העם להימס \"ולהיות למים\", וכמה אנשים נפלו באותו אירוע?", "a": "התבוסה מול העי - אנשי העי הכו מהם כשלושים ושישה איש ורדפום עד השברים והכום במורד. זו הייתה תבוסת ישראל הראשונה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"עִם בֵּית אָוֶן\"\nשאלה: הפסוק מתאר את מיקום העי ביחס לשני מקומות. מהם שני המקומות, ומה כיווני המיקום?", "a": "העי נמצאת \"עם בית און מקדם לבית אל\" - ליד בית און, ממזרח לבית אל. שני המקומות הם בית און ובית אל.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אַל תְּכַחֵד מִמֶּנִּי\"\nשאלה: מי אומר \"אל תכחד ממני\" ולמי, ומהן שלוש הבקשות שהוא מבקש באותו דיבור לפני \"אל תכחד\"?", "a": "יהושע אומר לעכן. שלוש הבקשות: (1) \"בני\" - פנייה חמה, (2) \"שים נא כבוד לה' אלוהי ישראל\" - תן כבוד לה', (3) \"ותן לו תודה\" - הודה בחטאך. רק אז \"והגד נא לי מה עשית אל תכחד ממני\".", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וָאֶחְמְדֵם וָאֶקָּחֵם\"\nשאלה: מי אומר \"ואחמדם ואקחם\", ומהם שלושת השלבים שהוא מתאר - ראיתי, חמדתי, ו...?", "a": "עכן מודה ליהושע. שלושת השלבים: (1) \"ואראה בשלל\" - ראיתי, (2) \"ואחמדם\" - חמדתי, (3) \"ואקחם\" - לקחתי. זו שלשלת חטא: עין רואה, לב חומד, יד לוקחת.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וּמַה תַּעֲשֵׂה לְשִׁמְךָ הַגָּדוֹל\"\nשאלה: מי אומר \"ומה תעשה לשמך הגדול\" ולמי, ומה הטיעון שמוצג כאן - מה הדובר חושש שיקרה?", "a": "יהושע אומר לה' בתפילתו אחרי התבוסה. הטיעון: אם הכנעני וכל יושבי הארץ ישמעו על התבוסה, יתאחדו נגד ישראל ויכריתו את שמם - ואז מה יהיה עם שם ה' הגדול? יהושע מנסה \"לשכנע\" את ה' שלישראל ולה' אינטרס משותף.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אַל תִּירָא וְאַל תֵּחָת\"\nשאלה: מי אומר את הדברים האלה ולמי, ומדוע יש צורך בחיזוק \"אל תירא\" - מה קרה קודם לכן?", "a": "ה' אומר ליהושע. קודם לכן ישראל הובסו בעי בגלל חטא עכן - כשלושים ושישה איש נהרגו ולבב העם נמס. לכן ה' מחזק את יהושע לפני הניסיון השני.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"נְטֵה בַכִּידוֹן אֲשֶׁר בְּיָדְךָ אֶל הָעָי\"\nשאלה: מי אומר את הדברים האלה ולמי, ולאיזה אירוע מתקופת משה דומה פעולה זו?", "a": "ה' אומר ליהושע. הרמת הכידון דומה למשה שהרים ידיו במלחמת עמלק ולא הוריד עד הניצחון - גם יהושע לא הוריד את הכידון עד שהושלם כיבוש העי.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אָז יִבְנֶה יְהוֹשֻׁעַ מִזְבֵּחַ בְּהַר עֵיבָל\"\nשאלה: מה קרה מיד לפני בניית המזבח המתוארת כאן, ומה עשה יהושע בטקס שהתקיים במקום הזה?", "a": "מיד לפני כן יהושע סיים את כיבוש העי. בטקס בהר עיבל יהושע כתב על האבנים את משנה תורת משה, כל ישראל עמדו משני צדי הארון - חציים מול הר גריזים וחציים מול הר עיבל, ויהושע קרא את כל דברי התורה, הברכה והקללה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיְהִי בַּיּוֹם הַשְּׁבִיעִי וַיַּשְׁכִּמוּ כַּעֲלוֹת הַשַּׁחַר\"\nשאלה: פסוק זה מתאר את כיבוש יריחו. מה היה שונה לחלוטין באסטרטגיית כיבוש העי לעומת הכיבוש המתואר כאן?", "a": "ביריחו (כאן) הכיבוש היה בנס - הקפות, שופרות ותרועה שגרמו לנפילת החומה. בעי הכיבוש היה בטקטיקה צבאית - מארב מאחורי העיר, נסיגה מדומה כדי למשוך את האויב החוצה, ואז המארב כבש את העיר הריקה והצית אש.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"שְׁנֵים עָשָׂר אָלֶף כֹּל אַנְשֵׁי הָעָי\"\nשאלה: לפי הפסוק, כל אנשי העי נפלו. מה ההבדל בין דין החרם בעיר שתוארה כאן לבין דין החרם ביריחו ביחס לשלל?", "a": "ביריחו כל העיר הייתה חרם ואסור היה לקחת שלל כלל. בעי ה' אמר \"רק שללה ובהמתה תבוזו לכם\" - מותר היה לקחת שלל ובהמות.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְלֹא הֵשִׁיב יְהוֹשֻׁעַ יָדוֹ אֲשֶׁר נָטָה\"\nשאלה: לאיזה אירוע מתקופת משה דומה המעשה המתואר כאן של אי-הורדת היד, ומה ה' ציווה את יהושע לעשות עם הכידון?", "a": "דומה למשה שהרים ידיו במלחמת עמלק ולא הורידן עד הניצחון. ה' ציווה את יהושע \"נטה בכידון אשר בידך אל העי\" - והוא לא הוריד את ידו עד שהושלם הכיבוש.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּתְלֵהוּ עַל הָעֵץ עַד עֵת הָעָרֶב\"\nשאלה: את מי תלו על העץ, ומה עשו עם גופתו בערב?", "a": "את מלך העי שנתפס חי. בערב הורידו את נבלתו מהעץ והשליכו אותה אל פתח שער העיר, והקימו עליה גל אבנים גדול.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּכְתֹּב שָׁם עַל הָאֲבָנִים\"\nשאלה: היכן כתב יהושע את משנה תורת משה, ומה עוד התרחש באותו מקום מיד אחרי כן?", "a": "בהר עיבל, על אבני המזבח. מיד אחרי כן עמדו כל ישראל משני צדי הארון - חציים מול הר גריזים וחציים מול הר עיבל - ויהושע קרא את כל דברי התורה, הברכה והקללה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיָּנֻסוּ דֶּרֶךְ הַמִּדְבָּר\"\nשאלה: מי ה\"הם\" שנסו, וכיצד הגיעו לסיטואציה של אויב מלפנים ומאחור?", "a": "אנשי העי הם שנלכדו בין שני כוחות. יהושע והעם הראשי נסוגו בנסיגה מדומה, ואנשי העי רדפו אחריהם ועזבו את העיר ריקה. אז קם המארב שהיה מאחורי העיר ונכנס אליה, ואנשי העי נלכדו בין הכוח הראשי שהפך לתקוף לבין המארב.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"רַק שְׁלָלָהּ וּבְהֶמְתָּהּ תָּבֹזּוּ לָכֶם\"\nשאלה: מי אומר את הדברים האלה, ומה המילה \"רק\" מלמדת על ההבדל בין העי ליריחו?", "a": "ה' אומר ליהושע. המילה \"רק\" מלמדת שבניגוד ליריחו, שם כל השלל היה חרם ואסור בלקיחה, בעי הותר לקחת את השלל והבהמות - זה ההבדל המרכזי בדין החרם בין שתי הערים.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"בֵּין בֵּית אֵל וּבֵין הָעָי\"\nשאלה: מה הוצב בין בית אל ובין העי, ומתי נשלח לשם?", "a": "המארב - כוח הלוחמים שיהושע שלח בלילה מאחורי העיר כדי לתפוס את העי כשאנשיה ייצאו לרדוף אחרי הכוח הראשי.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"הַבְּרָכָה וְהַקְּלָלָה\"\nשאלה: היכן קרא יהושע את \"הברכה והקללה\", ומול אילו שני הרים עמדו ישראל?", "a": "במעמד הר עיבל. חצי ישראל עמדו מול הר גריזים וחצי מול הר עיבל, ויהושע קרא את כל דברי התורה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וַיִּתְלֵהוּ עַל הָעֵץ עַד עֵת הָעָרֶב\"\nשאלה: מי נתלה על העץ, ומה עשו עם גופתו כשהגיע הערב?", "a": "מלך העי שנתפס חי. בערב הורידו את נבלתו מהעץ והשליכוה אל פתח שער העיר, והקימו עליה גל אבנים גדול.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"קַח עִמְּךָ אֶת כָּל עַם הַמִּלְחָמָה\"\nשאלה: מי אומר \"קח עמך את כל עם המלחמה\", ומה ההבדל הגדול בין ההוראה הזו לבין מה שקרה בפעם הראשונה שניסו לכבוש את אותה עיר?", "a": "ה' אומר ליהושע לפני כיבוש העי בפעם השנייה. בפעם הראשונה המרגלים המליצו \"אל יעל כל העם\" ושלחו רק כשלושת אלפים - וזה נכשל. כאן ה' מצווה במפורש לקחת את \"כל עם המלחמה\" - הפוך מההמלצה הכושלת.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אֶל פֶּתַח שַׁעַר הָעִיר\"\nשאלה: מה הושלך \"אל פתח שער העיר\", ומה הוקם מעליו?", "a": "נבלת מלך העי הושלכה אל פתח שער העיר אחרי שהורידו אותה מהעץ בערב. הקימו עליה \"גל אבנים גדול עד היום הזה\" - בדומה לגל אבנים שהוקם על עכן בעמק עכור.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אֲבָנִים שְׁלֵמוֹת\"\nשאלה: מאיזה סוג אבנים בנה יהושע את המזבח בהר עיבל, ומה האיסור המיוחד שמוזכר לגביהן?", "a": "\"אבנים שלמות אשר לא הניף עליהן ברזל\" - אבנים שלא עובדו בכלי ברזל, כפי שציווה משה עבד ה'. זהו מזבח ללא אבנים מסותתות.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"וְאֶת פִּי ה' לֹא שָׁאָלוּ\"\nשאלה: מה הטעות הגדולה שמתוארת כאן, ומה היו התוצאות של טעות זו?", "a": "ישראל בדקו רק את הראיות הפיזיות (הצידה הבלויה) אך לא שאלו את ה'. כתוצאה מכך כרתו ברית עם הגבעונים שהתחזו לבאים מארץ רחוקה, ולאחר שלושה ימים גילו שהם שכנים קרובים - ולא יכלו להפר את השבועה.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"אוּלַי בְּקִרְבִּי אַתָּה יוֹשֵׁב\"\nשאלה: מי אומר את הדברים האלה ולמי - מה החשד שעולה כאן, והאם החשד התברר כנכון?", "a": "איש ישראל אומר לחיוי (הגבעונים). החשד הוא שאולי הם יושבים בקרב ישראל (שכנים קרובים) ואסור לכרות עמם ברית. החשד התברר כנכון - אחרי שלושה ימים גילו שהם מגבעון, כפירה, בארות וקריית יערים, ערים קרובות.", "source": "text_questions/yehoshua.md", "type": "text"}, {"q": "טקסט: \"יִחְיוּ וַיִּהְיוּ חֹטְבֵי עֵצִים\"\nשאלה: על מי נגזר הגורל המתואר כאן, ומדוע לא ניתן היה פשוט להרוג
