  const sources = [...new Set(bookData.story.map(q => q.source))];

  // Build buttons: "כל הסיפורים" first, then each story
  const allSources = ['all', ...sources];
  allSources.forEach(src => {
    const btn = document.createElement('div');
    btn.className = 'choice-btn' + (src === 'all' ? ' selected' : '');
    btn.textContent = STORY_NAMES[src] || src;
    btn.dataset.story = src;
    btn.addEventListener('click', () => {
      grid.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedStory = src;
      checkReady();
    });
    grid.appendChild(btn);
  });

  section.style.display = 'block';
}

// Type selection
document.querySelectorAll('#typeBtns .choice-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#typeBtns .choice-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedType = btn.dataset.type;
    checkReady();
  });
});

// Slider
const slider = document.getElementById('numSlider');
const numDisplay = document.getElementById('numDisplay');
slider.addEventListener('input', () => { numDisplay.textContent = slider.value; });

function checkReady() {
  document.getElementById('startBtn').disabled = !(selectedBook && selectedType);
}

document.getElementById('startBtn').addEventListener('click', startQuiz);

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function toggleFlag() {
  const panel = document.getElementById('flagPanel');
  const isOpen = panel.style.display === 'block';
  panel.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) document.getElementById('flagNote').focus();
}

function saveFlag() {
  const note = document.getElementById('flagNote').value.trim();
  const q = questions[current];
  // Remove existing entry for this question if re-flagging
  flagged = flagged.filter(f => f.index !== current);
  flagged.push({ index: current, q: q.q, source: q.source, note });
  currentFlagged = true;
  const btn = document.getElementById('flagBtn');
  btn.classList.add('flagged');
  btn.textContent = '🚩 מדווח';
  document.getElementById('flagPanel').style.display = 'none';
}

function startQuiz() {
  let pool = [];
  const books = selectedBook === 'all'
    ? Object.keys(allData)
    : [selectedBook];

  const includeMastered = document.getElementById('includeMastered').checked;
  books.forEach(b => {
    const d = allData[b];
    if (selectedType === 'story' || selectedType === 'mixed') pool.push(...d.story);
    if (selectedType === 'text'  || selectedType === 'mixed') pool.push(...d.text);
  });
  // Filter by story if one is selected
  if (selectedStory && selectedStory !== 'all') {
    pool = pool.filter(q => q.source === selectedStory);
  }

  if (!includeMastered) {
    const filtered = pool.filter(q => !mastered.has(qKey(q)));
    // Fall back to full pool if everything is mastered
    if (filtered.length > 0) pool = filtered;
  }

  shuffle(pool);
  questions = pool.slice(0, parseInt(slider.value));
  current = 0;
  score = 0;
  flagged = [];
  currentFlagged = false;

  document.getElementById('setup').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  showQuestion();
}

function showQuestion() {
  const q = questions[current];
  const total = questions.length;

  document.getElementById('progressLabel').textContent = `שאלה ${current + 1} מתוך ${total}`;
  document.getElementById('progressBar').style.width = `${(current / total) * 100}%`;
  document.getElementById('sourceTag').textContent = q.source || '';
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('answerBox').textContent = q.a;
  document.getElementById('answerBox').style.display = 'none';
  document.getElementById('revealBtn').style.display = 'block';
  document.getElementById('knewBtn').style.display = 'none';
  document.getElementById('didntBtn').style.display = 'none';
  document.getElementById('scoreLive').textContent = `ציון: ${score}/${current}`;
  // Reset flag UI for new question
  currentFlagged = flagged.some(f => f.index === current);
  const flagBtn = document.getElementById('flagBtn');
  flagBtn.classList.toggle('flagged', currentFlagged);
  flagBtn.textContent = currentFlagged ? '🚩 מדווח' : '🚩 דווח';
  document.getElementById('flagPanel').style.display = 'none';
  document.getElementById('flagNote').value = flagged.find(f => f.index === current)?.note || '';
}

function reveal() {
  document.getElementById('answerBox').style.display = 'block';
  document.getElementById('revealBtn').style.display = 'none';
  document.getElementById('knewBtn').style.display = 'block';
  document.getElementById('didntBtn').style.display = 'block';
}

function next(knew) {
  if (knew) {
    score++;
    mastered.add(qKey(questions[current]));
    saveMastered();
    // Brief flash on button
    const kb = document.getElementById('knewBtn');
    kb.classList.add('flash');
    setTimeout(() => kb.classList.remove('flash'), 400);
  }
  current++;
  if (current >= questions.length) {
    showResults();
  } else {
    showQuestion();
  }
}

function showResults() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  document.getElementById('bigScore').textContent = `${score}/${total}`;
  let msg = '';
  if (pct === 100) msg = 'מושלם! 🌟';
  else if (pct >= 80) msg = 'כל הכבוד! 💪';
  else if (pct >= 60) msg = 'טוב, יש מה לשפר 📖';
  else msg = 'כדאי לחזור על החומר 🔄';
  const masteredBefore = mastered.size - questions.filter((q, i) => i < current).filter((q, i) => mastered.has(qKey(q))).length;
  const newlyMastered = mastered.size - masteredBefore;
  document.getElementById('gradeMsg').textContent = msg + ` • ${pct}%` + (newlyMastered > 0 ? ` • ⭐ ${newlyMastered} שאלות נרכשו` : '');

  const sec = document.getElementById('feedbackSection');
  if (flagged.length > 0) {
    sec.style.display = 'block';
    document.getElementById('flagCount').textContent = flagged.length;
    const list = document.getElementById('flaggedList');
    list.innerHTML = flagged.map(f => `
      <div class="feedback-item">
        <strong>${f.source || ''}</strong>
        ${f.q}
        ${f.note ? `<div class="note">💬 ${f.note}</div>` : ''}
      </div>`).join('');
  } else {
    sec.style.display = 'none';
  }
}

function buildFeedbackText() {
  const lines = ['דיווח על שאלות בחידון התנ"ך', '='.repeat(40)];
  flagged.forEach((f, i) => {
    lines.push(`\n${i + 1}. [${f.source || ''}]`);
    lines.push(`שאלה: ${f.q}`);
    if (f.note) lines.push(`הערה: ${f.note}`);
  });
  return lines.join('\n');
}

function copyFeedback() {
  navigator.clipboard.writeText(buildFeedbackText()).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✓ הועתק!';
    setTimeout(() => btn.textContent = '📋 העתק', 2000);
  });
}

function sendEmail() {
  const subject = encodeURIComponent(`דיווח על שאלות - חידון התנ"ך שלב ב'`);
  const body = encodeURIComponent(buildFeedbackText());
  window.location.href = `mailto:ofir@kerberus.com?subject=${subject}&body=${body}`;
}

function restart() {
  document.getElementById('results').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  selectedStory = 'all';
  populateStories();
}
</script>
