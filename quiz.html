 "story"}, {"q": "4. ⭐⭐⭐ משה ברח למדיין מיד אחרי שהרג את המצרי. נכון או לא נכון?", "a": "**לא נכון.** משה לא ברח מיד. למחרת (\"ביום השני\") יצא וראה שני אנשים עבריים ניצים וניסה להפריד ביניהם, ורק כשהבין ש\"אכן נודע הדבר\" ופרעה ביקש להורגו - אז ברח למדיין (שמות ב':י\"ג-ט\"ו).", "source": "02 birth of moshe", "type": "story"}, {"q": "5. ⭐⭐⭐ בנות כהן מדיין זיהו את משה כאיש עברי. נכון או לא נכון?", "a": "**לא נכון.** הבנות תיארו את משה כ\"איש מצרי\": \"איש מצרי הצילנו מיד הרועים\" (שמות ב':י\"ט). הן חשבו שהוא מצרי, לא עברי.", "source": "02 birth of moshe", "type": "story"}, {"q": "6. ⭐⭐⭐ אלוהים שמע את נאקת בני ישראל וזכר את בריתו עם אברהם ויצחק בלבד. נכון או לא נכון?", "a": "**לא נכון.** \"ויזכור אלוהים את בריתו את אברהם את יצחק ואת יעקב\" (שמות ב':כ\"ד) - שלושת האבות, לא שניים.", "source": "02 birth of moshe", "type": "story"}, {"q": "1. ⭐⭐ \"וַתִּקְרָא שְׁמוֹ מֹשֶׁה וַתֹּאמֶר כִּי מִן _____ מְשִׁיתִהוּ\"", "a": "**מילה חסרה:** הַמַּיִם\n**מי אמר:** בת פרעה\n**הקשר:** בת פרעה קוראת שם לתינוק שמצאה ביאור (שמות ב':י')", "source": "02 birth of moshe", "type": "story"}, {"q": "2. ⭐⭐⭐ \"מִי שָׂמְךָ לְאִישׁ שַׂר וְ_____ עָלֵינוּ\"", "a": "**מילה חסרה:** שֹׁפֵט\n**מי אמר:** האיש העברי (הרשע)\n**הקשר:** תגובת העברי למשה כשניסה להפריד בין שני עברים ניצים (שמות ב':י\"ד)", "source": "02 birth of moshe", "type": "story"}, {"q": "3. ⭐⭐ \"וַיִּקְרָא אֶת שְׁמוֹ גֵּרְשֹׁם כִּי אָמַר גֵּר הָיִיתִי בְּאֶרֶץ _____\"", "a": "**מילה חסרה:** נׇכְרִיָּה\n**מי אמר:** משה\n**הקשר:** משה קורא שם לבנו הבכור על שם היותו גר בארץ מדיין (שמות ב':כ\"ב)", "source": "02 birth of moshe", "type": "story"}, {"q": "4. ⭐⭐⭐ \"וַתִּקַּח לוֹ תֵּבַת גֹּמֶא וַתַּחְמְרָה בַחֵמָר וּ_____\"", "a": "**מילה חסרה:** בַזָּפֶת\n**מי אמר:** הכתוב\n**הקשר:** אם משה מכינה את התיבה ומאטמת אותה בחמר ובזפת (שמות ב':ג')", "source": "02 birth of moshe", "type": "story"}, {"q": "5. ⭐⭐ \"וַיִּזְכֹּר אֱלֹהִים אֶת בְּרִיתוֹ אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת _____\"", "a": "**מילה חסרה:** יַעֲקֹב\n**מי אמר:** הכתוב\n**הקשר:** סיום הפרק - אלוהים שומע את נאקת בני ישראל וזוכר את בריתו עם שלושת האבות (שמות ב':כ\"ד)", "source": "02 birth of moshe", "type": "story"}, {"q": "1. את צאן מי רעה משה כשהתגלה אליו ה'?", "a": "את צאן יתרו חותנו כהן מדין", "source": "03 burning bush", "type": "story"}, {"q": "2. לאן הנהיג משה את הצאן?", "a": "אל אחר המדבר, עד הר האלוהים חורבה", "source": "03 burning bush", "type": "story"}, {"q": "3. כיצד נראה ה' למשה בסנה?", "a": "מלאך ה' נראה אליו בלבת אש מתוך הסנה - הסנה בוער באש אך אינו אוכל", "source": "03 burning bush", "type": "story"}, {"q": "4. מה ענה משה כשה' קרא לו \"משה משה\"?", "a": "הנני", "source": "03 burning bush", "type": "story"}, {"q": "5. מה ציווה ה' את משה לעשות כשהתקרב לסנה?", "a": "לחלוץ נעליו כי המקום אדמת קודש", "source": "03 burning bush", "type": "story"}, {"q": "6. כאלוהי מי הציג עצמו ה' למשה?", "a": "אלוהי אברהם, אלוהי יצחק ואלוהי יעקב", "source": "03 burning bush", "type": "story"}, {"q": "7. מה עשה משה כשה' הציג עצמו?", "a": "הסתיר פניו כי ירא מהביט אל האלוהים", "source": "03 burning bush", "type": "story"}, {"q": "8. כיצד תיאר ה' את הארץ שאליה יעלה את בני ישראל?", "a": "ארץ טובה ורחבה, זבת חלב ודבש", "source": "03 burning bush", "type": "story"}, {"q": "9. מה שאל משה כשה' שלח אותו אל פרעה?", "a": "\"מי אנכי כי אלך אל פרעה\"", "source": "03 burning bush", "type": "story"}, {"q": "10. מה ענה ה' למשה כשביקש לדעת את שם האלוהים?", "a": "\"אהיה אשר אהיה\"", "source": "03 burning bush", "type": "story"}, {"q": "11. כמה ימים ביקשו מפרעה ללכת במדבר?", "a": "שלושת ימים", "source": "03 burning bush", "type": "story"}, {"q": "12. כמה עמים יושבים בארץ המובטחת לפי הפרק?", "a": "שישה עמים: כנעני, חתי, אמורי, פריזי, חוי ויבוסי", "source": "03 burning bush", "type": "story"}, {"q": "13. מה שם ההר שבו התגלה ה' למשה?", "a": "הר האלוהים חורב", "source": "03 burning bush", "type": "story"}, {"q": "14. מה הבטיח ה' למשה כשהתקשה לקבל את השליחות?", "a": "\"כי אהיה עמך\"", "source": "03 burning bush", "type": "story"}, {"q": "15. למי ציווה ה' את משה לאסוף לפני הפנייה לפרעה?", "a": "את זקני ישראל", "source": "03 burning bush", "type": "story"}, {"q": "16. ⭐⭐⭐ מה הבטיח ה' שייתן לבני ישראל בעיני מצרים בצאתם?", "a": "חן - \"ונתתי את חן העם הזה בעיני מצרים\" ולא ילכו ריקם, אלא ישאלו כלי כסף וכלי זהב ושמלות (שמות ג':כ\"א-כ\"ב)", "source": "03 burning bush", "type": "story"}, {"q": "17. ⭐⭐ מה ענה משה כשה' קרא אליו מתוך הסנה?", "a": "\"הנני\" (שמות ג':ד')", "source": "03 burning bush", "type": "story"}, {"q": "18. ⭐⭐⭐ מה עשה משה כשה' הציג עצמו כאלוהי אבותיו?", "a": "הסתיר פניו כי ירא מהביט אל האלוהים (שמות ג':ו')", "source": "03 burning bush", "type": "story"}, {"q": "1. ⭐ \"שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ\"", "a": "**מי אמר:** ה'\n**למי:** משה\n**הקשר:** מראה הסנה הבוער – ה' מצווה על משה לחלוץ נעליו (שמות ג':ה')", "source": "03 burning bush", "type": "story"}, {"q": "2. ⭐ \"אֶהְיֶה אֲשֶׁר אֶהְיֶה\"", "a": "**מי אמר:** ה'\n**למי:** משה\n**הקשר:** תשובת ה' למשה כששאל מה שם ה' (שמות ג':י\"ד)", "source": "03 burning bush", "type": "story"}, {"q": "3. ⭐⭐⭐ \"אָסֻרָה נָּא וְאֶרְאֶה אֶת הַמַּרְאֶה הַגָּדֹל הַזֶּה מַדּוּעַ לֹא יִבְעַר הַסְּנֶה\"", "a": "**מי אמר:** משה (לעצמו)\n**למי:** אמירה עצמית / מחשבה בקול\n**הקשר:** משה מתפלא על הסנה הבוער ומחליט לסור ולראות - ורק אחרי שה' ראה ש\"סר לראות\" קרא אליו (שמות ג':ג'-ד')", "source": "03 burning bush", "type": "story"}, {"q": "4. ⭐⭐⭐ \"פָּקֹד פָּקַדְתִּי אֶתְכֶם וְאֶת הֶעָשׂוּי לָכֶם בְּמִצְרָיִם\"", "a": "**מי אמר:** ה' (באמצעות משה)\n**למי:** זקני ישראל\n**הקשר:** ה' מצווה את משה לאסוף את זקני ישראל ולומר להם שה' פקד אותם וראה מה שנעשה להם במצרים (שמות ג':ט\"ז)", "source": "03 burning bush", "type": "story"}, {"q": "1. ⭐ יתרו, ציפורה, גרשום, אליעזר, אהרן - מי לא היה במדיין עם משה?", "a": "**התשובה:** אהרן - הוא נשאר במצרים כל השנים שמשה היה במדיין. ה' שלח את אהרן לקראת משה המדברה רק כשמשה חזר (שמות ד':כ\"ז). יתרו היה חותנו, ציפורה אשתו, וגרשום ואליעזר בניו - כולם היו עימו במדיין.", "source": "03 burning bush", "type": "story"}, {"q": "1. ⭐⭐⭐ ה' קרא למשה מתוך הסנה מיד כשמשה ראה את הסנה. נכון או לא נכון?", "a": "**לא נכון.** ה' קרא למשה רק אחרי שראה שמשה \"סר לראות\" - כלומר, משה ניגש בעצמו לבדוק את התופעה, ורק אז ה' קרא אליו \"משה משה\" (שמות ג':ד').", "source": "03 burning bush", "type": "story"}, {"q": "2. ⭐⭐⭐ ה' ביקש ממשה ומזקני ישראל לומר לפרעה שהם רוצים לצאת ממצרים לצמיתות. נכון או לא נכון?", "a": "**לא נכון.** ה' ציווה לבקש מפרעה ללכת \"דרך שלושת ימים במדבר ונזבחה לה' אלוהינו\" (שמות ג':י\"ח) - לא יציאה לצמיתות אלא בקשה ללכת לזבוח.", "source": "03 burning bush", "type": "story"}, {"q": "3. ⭐⭐⭐ מלאך ה' הוא שדיבר עם משה מתוך הסנה. נכון או לא נכון?", "a": "**מורכב.** \"מלאך ה'\" נראה אליו \"בלבת אש מתוך הסנה\" (שמות ג':ב'), אבל מי שקרא אליו ודיבר עמו היה \"אלוהים\" - \"ויקרא אליו אלוהים מתוך הסנה\" (שמות ג':ד'). ההתגלות הראשונית הייתה של מלאך, אך הדיבור עצמו היה של ה'.", "source": "03 burning bush", "type": "story"}, {"q": "4. ⭐⭐⭐ ה' אמר שישראל ייכנסו לארץ שבה יושבים חמישה עמים. נכון או לא נכון?", "a": "**לא נכון.** ה' מנה שישה עמים: \"הכנעני והחתי והאמורי והפריזי והחוי והיבוסי\" (שמות ג':ח'). שישה, לא חמישה.", "source": "03 burning bush", "type": "story"}, {"q": "1. ⭐⭐⭐ כהן מדין, חותנו של מנהיג, בעל צאן שרועים במדבר, נקרא גם בשם אחר", "a": "**הדמות:** יתרו (נקרא כאן גם \"יתר\" בפרק ד')\n**ספר:** שמות\n**הקשר:** יתרו כהן מדין, חותנו של משה, שרעה משה את צאנו כשהתגלה אליו ה' בסנה (שמות ג':א')", "source": "03 burning bush", "type": "story"}, {"q": "1. ⭐⭐ \"שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ כִּי הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו _____ הוּא\"", "a": "**מילה חסרה:** אַדְמַת קֹדֶשׁ\n**מי אמר:** ה' למשה\n**הקשר:** ה' מצווה את משה לחלוץ נעליו ליד הסנה הבוער (שמות ג':ה')", "source": "03 burning bush", "type": "story"}, {"q": "2. ⭐⭐⭐ \"אֶהְיֶה אֲשֶׁר _____\"", "a": "**מילה חסרה:** אֶהְיֶה\n**מי אמר:** ה' למשה\n**הקשר:** תשובת ה' למשה כששאל מה שם האלוהים (שמות ג':י\"ד)", "source": "03 burning bush", "type": "story"}, {"q": "3. ⭐⭐ \"וָאֵרֵד לְהַצִּילוֹ... אֶל אֶרֶץ טוֹבָה וּרְחָבָה אֶל אֶרֶץ זָבַת _____ וּדְבָשׁ\"", "a": "**מילה חסרה:** חָלָב\n**מי אמר:** ה' למשה\n**הקשר:** ה' מתאר את הארץ המובטחת (שמות ג':ח')", "source": "03 burning bush", "type": "story"}, {"q": "4. ⭐⭐⭐ \"_____ תֹאמַר לִבְנֵי יִשְׂרָאֵל אֶהְיֶה שְׁלָחַנִי אֲלֵיכֶם\"", "a": "**מילה חסרה:** כֹּה\n**מי אמר:** ה' למשה\n**הקשר:** ה' מלמד את משה מה לומר לבני ישראל כשישאלו מה שם האלוהים (שמות ג':י\"ד)", "source": "03 burning bush", "type": "story"}, {"q": "5. ⭐⭐ \"וְנֵלְכָה נָּא דֶּרֶךְ שְׁלֹשֶׁת יָמִים בַּמִּדְבָּר וְ_____ לַה' אֱלֹהֵינוּ\"", "a": "**מילה חסרה:** נִזְבְּחָה\n**מי אמר:** ה' (מלמד את משה מה לומר לפרעה)\n**הקשר:** הבקשה שמשה וזקני ישראל צריכים להציג בפני פרעה (שמות ג':י\"ח)", "source": "03 burning bush", "type": "story"}, {"q": "1. כמה אותות נתן ה' למשה?", "a": "שלושה אותות", "source": "04 mission of moshe", "type": "story"}, {"q": "2. מהם שלושת האותות שנתן ה' למשה?", "a": "מטה שהופך לנחש, יד שנכנסת לחיקו ויוצאת מצורעת כשלג, ומים מהיאור שיהפכו לדם ביבשת", "source": "04 mission of moshe", "type": "story"}, {"q": "3. למה הפך המטה כשהשליך אותו משה ארצה?", "a": "לנחש", "source": "04 mission of moshe", "type": "story"}, {"q": "4. מה טען משה כדי להתחמק מהשליחות?", "a": "שאינו איש דברים וכבד פה וכבד לשון", "source": "04 mission of moshe", "type": "story"}, {"q": "5. מי מונה כדובר של משה?", "a": "אהרן אחיו", "source": "04 mission of moshe", "type": "story"}, {"q": "6. מדוע מינה ה' את אהרן כדובר?", "a": "כי ה' כעס על סירובו של משה והציע את אהרן - משה ידבר אל אהרן ואהרן ידבר אל העם", "source": "04 mission of moshe", "type": "story"}, {"q": "7. ממי ביקש משה רשות לפני שיצא למצרים?", "a": "מיתרו חותנו", "source": "04 mission of moshe", "type": "story"}, {"q": "8. את מי לקח משה עמו כשיצא למצרים?", "a": "את אשתו ואת בניו", "source": "04 mission of moshe", "type": "story"}, {"q": "9. כיצד כינה ה' את עם ישראל בפרק זה?", "a": "\"בני בכורי ישראל\"", "source": "04 mission of moshe", "type": "story"}, {"q": "10. מה עשתה ציפורה בדרך למצרים כשה' ביקש להמית את משה?", "a": "מלה את בנה", "source": "04 mission of moshe", "type": "story"}, {"q": "11. מה אמרה ציפורה אחרי ברית המילה?", "a": "\"כי חתן דמים אתה לי\"", "source": "04 mission of moshe", "type": "story"}, {"q": "12. היכן פגש אהרן את משה?", "a": "בהר האלוהים", "source": "04 mission of moshe", "type": "story"}, {"q": "13. מה ענה ה' למשה כשטען שאינו יודע לדבר?", "a": "\"מי שם פה לאדם או מי ישום אלם או חרש או פקח או עור הלא אנכי ה'\"", "source": "04 mission of moshe", "type": "story"}, {"q": "14. מה שם המטה שנשא משה?", "a": "מטה האלוהים", "source": "04 mission of moshe", "type": "story"}, {"q": "15. מה אמר ה' שיעשה ללב פרעה?", "a": "שיקשה את לבו", "source": "04 mission of moshe", "type": "story"}, {"q": "16. ⭐⭐ על מה הרכיב משה את אשתו ובניו בדרך למצרים?", "a": "על החמור (שמות ד':כ')", "source": "04 mission of moshe", "type": "story"}, {"q": "17. ⭐⭐⭐ מה שם המטה שלקח משה עמו למצרים?", "a": "מטה האלוהים (שמות ד':כ')", "source": "04 mission of moshe", "type": "story"}, {"q": "18. ⭐⭐⭐ מה עשו בני ישראל כששמעו שה' פקד אותם?", "a": "\"ויאמן העם... ויקדו וישתחוו\" (שמות ד':ל\"א)", "source": "04 mission of moshe", "type": "story"}, {"q": "1. ⭐ \"שַׁלַּח אֶת עַמִּי וְיָחֹגּוּ לִי בַּמִּדְבָּר\"", "a": "**מי אמר:** משה ואהרן\n**למי:** פרעה\n**הקשר:** דרישת משה ואהרן מפרעה לשחרר את בני ישראל (שמות ה':א')", "source": "04 mission of moshe", "type": "story"}, {"q": "2. ⭐ \"מִי ה' אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ\"", "a": "**מי אמר:** פרעה\n**למי:** משה ואהרן\n**הקשר:** סירוב פרעה לשלח את ישראל (שמות ה':ב')", "source": "04 mission of moshe", "type": "story"}, {"q": "3. ⭐⭐⭐ \"כִּי חֲתַן דָּמִים אַתָּה לִי\"", "a": "**מי אמר:** ציפורה\n**למי:** משה\n**הקשר:** ציפורה מלה את בנה בדרך למצרים כשה' ביקש להמית את משה, ונוגעת ברגליו ואומרת \"חתן דמים\" (שמות ד':כ\"ה)", "source": "04 mission of moshe", "type": "story"}, {"q": "4. ⭐⭐⭐ \"יֵרֶא ה' עֲלֵיכֶם וְיִשְׁפֹּט אֲשֶׁר הִבְאַשְׁתֶּם אֶת רֵיחֵנוּ\"", "a": "**מי אמר:** שוטרי בני ישראל\n**למי:** משה ואהרן\n**הקשר:** השוטרים מאשימים את משה ואהרן שגרמו להחמרת השעבוד אחרי שבאו אל פרעה (שמות ה':כ\"א)", "source": "04 mission of moshe", "type": "story"}, {"q": "5. ⭐⭐⭐ \"שְׁלַח נָא בְּיַד תִּשְׁלָח\"", "a": "**מי אמר:** משה\n**למי:** ה'\n**הקשר:** משה מסרב בפעם האחרונה לקבל את השליחות ומבקש לשלוח מישהו אחר, דבר שגרם לחרון אף ה' (שמות ד':י\"ג)", "source": "04 mission of moshe", "type": "story"}, {"q": "1. ⭐⭐ נקרא \"פה\" של אחיו, נשא לוי, דיבר אל המלך, נשלח יחד עם אחיו לגאול את העם", "a": "**הדמות:** אהרן\n**ספר:** שמות\n**הקשר:** אהרן נבחר לדבר בשם משה כי משה גמגם, היה לוי, ודיבר יחד עם משה בפני פרעה לשלח את בני ישראל (פרקים ד'-ה')", "source": "04 mission of moshe", "type": "story"}, {"q": "1. ⭐⭐⭐ האות השני שנתן ה' למשה היה הפיכת מים לדם. נכון או לא נכון?", "a": "**לא נכון.** האות השני היה יד שנכנסת לחיקו ויוצאת מצורעת כשלג. הפיכת מים לדם היה האות השלישי (שמות ד':ו'-ט').", "source": "04 mission of moshe", "type": "story"}, {"q": "2. ⭐⭐⭐ משה רכב על חמור כשחזר ממדיין למצרים. נכון או לא נכון?", "a": "**נכון.** הפסוק אומר \"ויקח משה את אשתו ואת בניו וירכיבם על החמור וישב ארצה מצרים\" (שמות ד':כ'). שימו לב שנאמר \"החמור\" בה' הידיעה - חמור אחד ספציפי.", "source": "04 mission of moshe", "type": "story"}, {"q": "3. ⭐⭐⭐ אהרן יצא לקראת משה כי משה שלח לו הודעה. נכון או לא נכון?", "a": "**לא נכון.** ה' הוא שאמר לאהרן \"לך לקראת משה המדברה\" (שמות ד':כ\"ז). לא משה שלח הודעה אלא ה' ציווה את אהרן ישירות.", "source": "04 mission of moshe", "type": "story"}, {"q": "4. ⭐⭐⭐ פרעה הפסיק לספק תבן כדי להחליש את בני ישראל. נכון או לא נכון?", "a": "**לא בדיוק.** פרעה הפסיק לתת תבן אך דרש שמכסת הלבנים תישאר אותו הדבר. הסיבה שנתן: \"כי נרפים הם על כן הם צועקים לאמר נלכה נזבחה לאלוהינו\" (שמות ה':ח') - כלומר, הוא ראה בבקשת משה ואהרן הוכחה שהעם \"נרפה\".", "source": "04 mission of moshe", "type": "story"}, {"q": "1. ⭐⭐ \"כְבַד פֶּה וּכְבַד _____ אָנֹכִי\"", "a": "**מילה חסרה:** לָשׁוֹן\n**מי אמר:** משה לה'\n**הקשר:** משה מתנגד לשליחות וטוען שאינו יודע לדבר (שמות ד':י')", "source": "04 mission of moshe", "type": "story"}, {"q": "2. ⭐⭐⭐ \"מִי שָׂם פֶּה לָאָדָם אוֹ מִי יָשׂוּם אִלֵּם אוֹ חֵרֵשׁ אוֹ פִקֵּחַ אוֹ _____ הֲלֹא אָנֹכִי ה'\"", "a": "**מילה חסרה:** עִוֵּר\n**מי אמר:** ה' למשה\n**הקשר:** תשובת ה' למשה כשטען שאינו יודע לדבר (שמות ד':י\"א)", "source": "04 mission of moshe", "type": "story"}, {"q": "3. ⭐⭐ \"כֹּה אָמַר ה' _____ בְכֹרִי יִשְׂרָאֵל\"", "a": "**מילה חסרה:** בְּנִי\n**מי אמר:** ה' (מלמד את משה מה לומר לפרעה)\n**הקשר:** ה' מכנה את עם ישראל \"בני בכורי\" (שמות ד':כ\"ב)", "source": "04 mission of moshe", "type": "story"}, {"q": "4. ⭐⭐⭐ \"כִּי _____ דָּמִים אַתָּה לִי\"", "a": "**מילה חסרה:** חֲתַן\n**מי אמר:** ציפורה\n**הקשר:** ציפורה אומרת זאת אחרי שמלה את בנה בדרך למצרים כשה' ביקש להמית את משה (שמות ד':כ\"ה)", "source": "04 mission of moshe", "type": "story"}, {"q": "5. ⭐⭐ \"לָמָה _____ לָעָם הַזֶּה לָמָּה זֶּה שְׁלַחְתָּנִי\"", "a": "**מילה חסרה:** הֲרֵעֹתָה\n**מי אמר:** משה לה'\n**הקשר:** משה פונה לה' בתלונה אחרי שפרעה הכביד את העבודה על בני ישראל (שמות ה':כ\"ב)", "source": "04 mission of moshe", "type": "story"}, {"q": "1. מה אמרו משה ואהרן לפרעה כשבאו אליו?", "a": "\"כה אמר ה' אלוהי ישראל שלח את עמי ויחוגו לי במדבר\"", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "2. מה ענה פרעה לדרישת משה ואהרן?", "a": "\"מי ה' אשר אשמע בקולו... לא ידעתי את ה' וגם את ישראל לא אשלח\"", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "3. במה האשים פרעה את משה ואהרן?", "a": "שהם מפריעים לעם מעבודתם", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "4. מה ציווה פרעה את הנוגשים והשוטרים לעשות?", "a": "שלא לתת עוד תבן לעם ללבנים - העם יאסוף תבן בעצמו, אבל מכסת הלבנים לא תפחת", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "5. מה היה התבן משמש?", "a": "חומר גלם ללבנים", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "6. מה אסף העם במקום תבן?", "a": "קש", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "7. מי הם הנוגשים ומי הם השוטרים?", "a": "הנוגשים הם ממונים מצריים על העבודה, והשוטרים הם ממונים ישראליים", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "8. מדוע הוכו השוטרים?", "a": "כי מכסת הלבנים לא הושלמה", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "9. מה אמרו השוטרים למשה ואהרן כשפגשו אותם?", "a": "\"ירא ה' עליכם וישפוט אשר הבאשתם את ריחנו\"", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "10. מה שאל משה את ה' בסוף הפרק?", "a": "\"למה הרעותה לעם הזה, למה זה שלחתני\"", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "11. במה האשים פרעה את העם כשביקשו להקל מהעבודה?", "a": "שהם נרפים (עצלנים)", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "12. האם מכסת הלבנים השתנתה אחרי שפרעה הפסיק לספק תבן?", "a": "לא, מכסת הלבנים לא פחתה", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "13. לאן הלכו השוטרים להתלונן?", "a": "אל פרעה", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "14. האם התלונת השוטרים לפרעה הועילה?", "a": "לא, ללא הועיל", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "15. מהו הפסוק \"מִי ה' אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ\"?", "a": "שמות ה', ב'", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "16. ⭐⭐ בן כמה היה משה כשדיבר אל פרעה?", "a": "בן שמונים שנה (שמות ז':ז')", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "17. ⭐⭐ בן כמה היה אהרן כשדיבר אל פרעה?", "a": "בן שלוש ושמונים שנה (שמות ז':ז')", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "18. ⭐⭐⭐ כמה ימים נמלאו אחרי מכת דם?", "a": "שבעת ימים (שמות ז':כ\"ה)", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "19. ⭐⭐⭐ איזה אזור לא נפגע במכת ברד ובמכת ערוב?", "a": "ארץ גושן - שם היו בני ישראל (שמות ח':י\"ח, ט':כ\"ו)", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "1. ⭐⭐⭐ \"נִרְפִּים אַתֶּם נִרְפִּים עַל כֵּן אַתֶּם אֹמְרִים נֵלְכָה נִזְבְּחָה לַה'\"", "a": "**מי אמר:** פרעה\n**למי:** שוטרי בני ישראל\n**הקשר:** פרעה מאשים את השוטרים בעצלנות כשהם מתלוננים על חוסר תבן, וטוען שבגלל שהם \"נרפים\" הם רוצים ללכת לזבוח (שמות ה':י\"ז)", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "2. ⭐⭐⭐ \"אֶצְבַּע אֱלֹהִים הִוא\"", "a": "**מי אמר:** חרטומי מצרים\n**למי:** פרעה\n**הקשר:** אחרי מכת כינים, כשהחרטומים לא הצליחו לחקות את המכה, הודו שזו \"אצבע אלוהים\" (שמות ח':ט\"ו)", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "3. ⭐⭐⭐ \"חָטָאתִי הַפָּעַם ה' הַצַּדִּיק וַאֲנִי וְעַמִּי הָרְשָׁעִים\"", "a": "**מי אמר:** פרעה\n**למי:** משה ואהרן\n**הקשר:** פרעה מודה בחטאו בזמן מכת ברד ומבקש שיתפללו לה' (שמות ט':כ\"ז)", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "1. ⭐⭐⭐ החרטומים הצליחו לחקות את כל המכות הראשונות. נכון או לא נכון?", "a": "**לא נכון.** החרטומים הצליחו לחקות את דם וצפרדעים, אבל כבר במכת כינים \"לא יכלו\" ואמרו \"אצבע אלוהים היא\" (שמות ח':י\"ד-ט\"ו). בשחין אפילו לא יכלו לעמוד לפני משה כי השחין היה גם בהם (ט':י\"א).", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "2. ⭐⭐⭐ מכת ברד הרסה את כל היבולים במצרים. נכון או לא נכון?", "a": "**לא נכון.** הפשתה והשעורה נוכו, אבל \"החיטה והכוסמת לא נוכו כי אפילות הנה\" (שמות ט':ל\"א-ל\"ב). חלק מהיבולים שרדו - ולכן הארבה אחר כך אכל את \"יתר הפלטה הנשארת מן הברד\".", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "3. ⭐⭐⭐ מכת חושך נמשכה שבעה ימים. נכון או לא נכון?", "a": "**לא נכון.** מכת חושך נמשכה שלושה ימים: \"ויהי חושך אפלה בכל ארץ מצרים שלושת ימים\" (שמות י':כ\"ב).", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "1. ⭐⭐⭐ אמרו \"אצבע אלוהים היא\", חיקו חלק מהמכות, לא הצליחו לחקות את מכת כינים, לקו בשחין", "a": "**הדמות:** חרטומי מצרים\n**ספר:** שמות\n**הקשר:** חרטומי מצרים חיקו את דם וצפרדעים אך נכשלו בכינים ואמרו \"אצבע אלוהים היא\", ובשחין לא יכלו אפילו לעמוד לפני משה (שמות ח'-ט')", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "1. ⭐⭐ \"מִי ה' אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ... לֹא _____ אֶת ה'\"", "a": "**מילה חסרה:** יָדַעְתִּי\n**מי אמר:** פרעה למשה ואהרן\n**הקשר:** סירוב פרעה הראשון לשלח את ישראל (שמות ה':ב')", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "2. ⭐⭐⭐ \"חָטָאתִי הַפָּעַם ה' _____ וַאֲנִי וְעַמִּי הָרְשָׁעִים\"", "a": "**מילה חסרה:** הַצַּדִּיק\n**מי אמר:** פרעה למשה ואהרן\n**הקשר:** פרעה מודה בחטאו במכת ברד (שמות ט':כ\"ז)", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "3. ⭐⭐ \"_____ אֱלֹהִים הִוא\"", "a": "**מילה חסרה:** אֶצְבַּע\n**מי אמר:** חרטומי מצרים לפרעה\n**הקשר:** החרטומים מודים שמכת כינים היא מעשה אלוהים ולא כישוף (שמות ח':ט\"ו)", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "4. ⭐⭐⭐ \"הֲטֶרֶם תֵּדַע כִּי _____ מִצְרָיִם\"", "a": "**מילה חסרה:** אָבְדָה\n**מי אמר:** עבדי פרעה לפרעה\n**הקשר:** עבדי פרעה מפצירים בו לשלח את ישראל לפני מכת ארבה (שמות י':ז')", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "5. ⭐⭐⭐ \"לֹא רָאוּ אִישׁ אֶת אָחִיו וְלֹא קָמוּ אִישׁ מִתַּחְתָּיו _____ יָמִים\"", "a": "**מילה חסרה:** שְׁלֹשֶׁת\n**מי אמר:** הכתוב\n**הקשר:** תיאור מכת חושך - שלושה ימים שלא ראו זה את זה (שמות י':כ\"ג)", "source": "05 moshe and aharon vs pharaoh", "type": "story"}, {"q": "1. מה אמר ה' למשה על הנגע האחרון?", "a": "שיביא עוד נגע אחד על פרעה ועל מצרים, ואחריו ישלחם", "source": "06 plague of firstborn", "type": "story"}, {"q": "2. מה ציווה ה' שידברו באוזני העם לפני המכה?", "a": "לשאול איש מאת רעהו ואישה מאת רעותה כלי כסף וכלי זהב", "source": "06 plague of firstborn", "type": "story"}, {"q": "3. מדוע הסכימו המצרים לתת כלי כסף וזהב?", "a": "כי ה' נתן את חן העם בעיני מצרים", "source": "06 plague of firstborn", "type": "story"}, {"q": "4. מתי הכריז משה שתתרחש המכה?", "a": "כחצות הלילה", "source": "06 plague of firstborn", "type": "story"}, {"q": "5. מי ייפגע במכת בכורות?", "a": "כל בכור בארץ מצרים - מבכור פרעה היושב על כסאו עד בכור השפחה אשר אחר הרחיים, וכל בכור בהמה", "source": "06 plague of firstborn", "type": "story"}, {"q": "6. מה יקרה לבני ישראל בזמן המכה?", "a": "\"לא יחרץ כלב לשונו\" - להראות שה' מבדיל בין מצרים ובין ישראל", "source": "06 plague of firstborn", "type": "story"}, {"q": "7. מה משמעות הביטוי \"גרש יגרש\"?", "a": "שפרעה לא רק ישלח אלא יגרש אותם ממצרים", "source": "06 plague of firstborn", "type": "story"}, {"q": "8. מהו מעמדו של משה בעיני המצרים לפי הפרק?", "a": "משה גדול מאוד בארץ מצרים", "source": "06 plague of firstborn", "type": "story"}, {"q": "9. מה תהיה התוצאה במצרים לפי הכרזת משה?", "a": "צעקה גדולה בכל ארץ מצרים, אשר כמוה לא נהיתה וכמוה לא תוסיף", "source": "06 plague of firstborn", "type": "story"}, {"q": "10. האם פרעה הסכים לשלח את ישראל אחרי האזהרה?", "a": "לא, פרעה עדיין סירב", "source": "06 plague of firstborn", "type": "story"}, {"q": "11. מה פירוש הביטוי \"לא יחרץ כלב לשונו\"?", "a": "הבדלה בין ישראל למצרים - שקט מוחלט בצד בני ישראל", "source": "06 plague of firstborn", "type": "story"}, {"q": "12. כיצד כינה ה' את המכה האחרונה?", "a": "נגע אחד", "source": "06 plague of firstborn", "type": "story"}, {"q": "13. מי הכריז על מכת בכורות בפני פרעה?", "a": "משה", "source": "06 plague of firstborn", "type": "story"}, {"q": "14. מהו הטווח החברתי של הבכורות שייפגעו?", "a": "מבכור פרעה היושב על כסאו עד בכור השפחה - כל שכבות החברה", "source": "06 plague of firstborn", "type": "story"}, {"q": "15. האם רק בכורות אדם ייפגעו במכה?", "a": "לא, גם כל בכור בהמה", "source": "06 plague of firstborn", "type": "story"}, {"q": "16. ⭐⭐ מה ציווה ה' שישראל ישאלו ממצרים לפני המכה?", "a": "כלי כסף וכלי זהב (שמות י\"א:ב')", "source": "06 plague of firstborn", "type": "story"}, {"q": "17. ⭐⭐⭐ מה פירוש \"גרש יגרש\" לגבי שילוח ישראל?", "a": "שפרעה לא רק ישלח אותם אלא יגרש - ישלח בכוח ובחיפזון (שמות י\"א:א')", "source": "06 plague of firstborn", "type": "story"}, {"q": "18. ⭐⭐⭐ מהי ה\"שפחה אשר אחר הרחיים\" שנזכרת בפרק?", "a": "השפחה שטוחנת ברחיים - הדרגה הנמוכה ביותר בחברה, מבכור פרעה ועד בכור השפחה (שמות י\"א:ה')", "source": "06 plague of firstborn", "type": "story"}, {"q": "1. ⭐⭐⭐ \"וְיָרְדוּ כָל עֲבָדֶיךָ אֵלֶּה אֵלַי וְהִשְׁתַּחֲווּ לִי לֵאמֹר צֵא אַתָּה וְכָל הָעָם\"", "a": "**מי אמר:** משה\n**למי:** פרעה\n**הקשר:** משה מנבא לפרעה שעבדיו יבואו להשתחוות לו ולבקש שיצא - ויצא מעם פרעה בחרי אף (שמות י\"א:ח')", "source": "06 plague of firstborn", "type": "story"}, {"q": "1. ⭐⭐⭐ משה אמר שהמכה תתרחש בחצות הלילה. נכון או לא נכון?", "a": "**נכון, אבל בדיוק.** משה אמר \"כחצות הלילה\" (שמות י\"א:ד') - כלומר \"בערך בחצות\", לא \"בחצות\" בדיוק. יש הבדל בין \"כחצות\" ל\"בחצות\".", "source": "06 plague of firstborn", "type": "story"}, {"q": "2. ⭐⭐⭐ בפרק י\"א, הבכור הנמוך ביותר בדרגה שנזכר הוא \"בכור השפחה\". נכון או לא נכון?", "a": "**נכון.** בפרק י\"א (פסוק ה') הטווח הוא \"מבכור פרעה היושב על כסאו עד בכור השפחה אשר אחר הרחיים\". אך בפרק י\"ב (פסוק כ\"ט), כשהמכה מתרחשת, נאמר \"עד בכור השבי אשר בבית הבור\" - שינוי בין ההכרזה לביצוע!", "source": "06 plague of firstborn", "type": "story"}, {"q": "3. ⭐⭐⭐ ה' אמר שאחרי המכה האחרונה פרעה ישלח אותם מרצון. נכון או לא נכון?", "a": "**לא נכון.** ה' אמר \"גרש יגרש אתכם מזה\" (שמות י\"א:א') - פרעה לא רק ישלח, אלא יגרש אותם. זהו שילוח בכפייה, לא מרצון.", "source": "06 plague of firstborn", "type": "story"}, {"q": "1. ⭐⭐⭐ גדול מאוד בארץ מצרים בעיני עבדי פרעה ובעיני העם, יצא מעם פרעה בחרי אף", "a": "**הדמות:** משה\n**ספר:** שמות\n**הקשר:** \"גם האיש משה גדול מאוד בארץ מצרים בעיני עבדי פרעה ובעיני העם\" (שמות י\"א:ג'), ויצא מעם פרעה \"בחרי אף\" (י\"א:ח')", "source": "06 plague of firstborn", "type": "story"}, {"q": "1. ⭐⭐ \"כַּחֲצֹת הַלַּיְלָה אֲנִי יוֹצֵא בְּתוֹךְ _____\"", "a": "**מילה חסרה:** מִצְרָיִם\n**מי אמר:** משה (בשם ה') לפרעה\n**הקשר:** הכרזת משה על מכת בכורות (שמות י\"א:ד')", "source": "06 plague of firstborn", "type": "story"}, {"q": "2. ⭐⭐⭐ \"וּלְכֹל בְּנֵי יִשְׂרָאֵל לֹא יֶחֱרַץ _____ לְשֹׁנוֹ\"", "a": "**מילה חסרה:** כֶּלֶב\n**מי אמר:** משה (בשם ה')\n**הקשר:** ההבדלה בין מצרים לישראל - שקט מוחלט בצד בני ישראל (שמות י\"א:ז')", "source": "06 plague of firstborn", "type": "story"}, {"q": "3. ⭐⭐ \"עוֹד _____ אֶחָד אָבִיא עַל פַּרְעֹה וְעַל מִצְרָיִם\"", "a": "**מילה חסרה:** נֶגַע\n**מי אמר:** ה' למשה\n**הקשר:** ה' מודיע למשה על המכה האחרונה (שמות י\"א:א')", "source": "06 plague of firstborn", "type": "story"}, {"q": "4. ⭐⭐⭐ \"וְיָרְדוּ כָל עֲבָדֶיךָ אֵלֶּה אֵלַי וְ_____ לִי\"", "a": "**מילה חסרה:** הִשְׁתַּחֲווּ\n**מי אמר:** משה לפרעה\n**הקשר:** משה מנבא שעבדי פרעה יבואו להשתחוות לו ולבקש שיצא (שמות י\"א:ח')", "source": "06 plague of firstborn", "type": "story"}, {"q": "1. איזה חודש נקבע כראש חודשים?", "a": "חודש ניסן", "source": "07 seder night and exodus", "type": "story"}, {"q": "2. באיזה יום בחודש יש לקחת את השה?", "a": "בעשור לחודש (י' בניסן)", "source": "07 seder night and exodus", "type": "story"}, {"q": "3. באיזה יום בחודש שוחטים את הפסח?", "a": "בארבעה עשר לחודש (י\"ד בניסן)", "source": "07 seder night and exodus", "type": "story"}, {"q": "4. איזה שה צריך לקחת לקרבן הפסח?", "a": "שה תמים זכר בן שנה", "source": "07 seder night and exodus", "type": "story"}, {"q": "5. היכן שמים את דם הפסח?", "a": "על שתי המזוזות ועל המשקוף", "source": "07 seder night and exodus", "type": "story"}, {"q": "6. באיזה צמח מורחים את הדם?", "a": "אזוב", "source": "07 seder night and exodus", "type": "story"}, {"q": "7. כיצד אוכלים את בשר הפסח?", "a": "צלי אש עם מצות ומרורים - לא נא ולא מבושל", "source": "07 seder night and exodus", "type": "story"}, {"q": "8. כיצד צריך לאכול את הפסח (תיאור הלבוש)?", "a": "בחיפזון - מותניים חגורים, נעלים ברגליים, מקל ביד", "source": "07 seder night and exodus", "type": "story"}, {"q": "9. מדוע פסח ה' על בתי ישראל?", "a": "כי היה דם על פתחם", "source": "07 seder night and exodus", "type": "story"}, {"q": "10. מה אמר פרעה למשה ואהרן בלילה אחרי מכת בכורות?", "a": "\"קומו צאו מתוך עמי\"", "source": "07 seder night and exodus", "type": "story"}, {"q": "11. מדוע אכלו בני ישראל מצות ולא לחם?", "a": "כי הבצק לא הספיק להחמיץ בגלל החיפזון", "source": "07 seder night and exodus", "type": "story"}, {"q": "12. כמה גברים רגלי יצאו ממצרים?", "a": "כשש מאות אלף (600,000) לבד מטף", "source": "07 seder night and exodus", "type": "story"}, {"q": "13. מהיכן לאן נסעו בני ישראל ביציאת מצרים?", "a": "מרעמסס לסוכות", "source": "07 seder night and exodus", "type": "story"}, {"q": "14. כמה שנים ישבו בני ישראל במצרים?", "a": "430 שנה", "source": "07 seder night and exodus", "type": "story"}, {"q": "15. מי הם \"ערב רב\"?", "a": "גויים שהצטרפו ליציאת מצרים", "source": "07 seder night and exodus", "type": "story"}, {"q": "16. מה הכלל לגבי עצמות קרבן הפסח?", "a": "עצם לא תשברו בו", "source": "07 seder night and exodus", "type": "story"}, {"q": "17. מי רשאי לאכול מקרבן הפסח ומי לא?", "a": "בן נכר לא יאכל, עבד מקנת כסף אחרי מילה יאכל", "source": "07 seder night and exodus", "type": "story"}, {"q": "18. היכן צריך לאכול את קרבן הפסח?", "a": "בבית אחד ייאכל", "source": "07 seder night and exodus", "type": "story"}, {"q": "19. ⭐⭐⭐ מה ההבדל בין בכור השפחה (פרק י\"א) לבכור השבי (פרק י\"ב)?", "a": "בפרק י\"א (פסוק ה') נאמר \"עד בכור השפחה אשר אחר הרחיים\", ובפרק י\"ב (פסוק כ\"ט) נאמר \"עד בכור השבי אשר בבית הבור\" - שינוי בין ההכרזה לביצוע", "source": "07 seder night and exodus", "type": "story"}, {"q": "20. ⭐⭐ מהיכן לאן נסעו בני ישראל מיד אחרי היציאה?", "a": "מרעמסס לסוכות (שמות י\"ב:ל\"ז)", "source": "07 seder night and exodus", "type": "story"}, {"q": "21. ⭐⭐⭐ כמה שנים ישבו בני ישראל במצרים לפי הפרק?", "a": "שלושים שנה וארבע מאות שנה (430 שנה) (שמות י\"ב:מ')", "source": "07 seder night and exodus", "type": "story"}, {"q": "1. ⭐⭐⭐ בני ישראל יצאו ממצרים בלילה. נכון או לא נכון?", "a": "**נכון, אבל דורש דיוק.** פרעה קרא למשה ואהרן בלילה (שמות י\"ב:ל\"א), אך בשמות י\"ב:מ\"א נאמר \"ויהי בעצם היום הזה\" - משמע היציאה בפועל הייתה ביום. הדיון מורכב - הקריאה הייתה בלילה אך היציאה בפועל ביום.", "source": "07 seder night and exodus", "type": "story"}, {"q": "2. ⭐⭐⭐ קרבן הפסח יכול להיות מכבשים בלבד. נכון או לא נכון?", "a": "**לא נכון.** קרבן הפסח יכול להיות \"מן הכבשים ומן העזים\" - שה מאחד משני המינים (שמות י\"ב:ה').", "source": "07 seder night and exodus", "type": "story"}, {"q": "3. ⭐⭐⭐ פרעה ביקש ממשה ואהרן לברך אותו כשגירש אותם. נכון או לא נכון?", "a": "**נכון.** פרעה אמר \"גם צאנכם גם בקרכם קחו כאשר דברתם ולכו וברכתם גם אותי\" (שמות י\"ב:ל\"ב). פרעה ביקש ברכה!", "source": "07 seder night and exodus", "type": "story"}, {"q": "1. ⭐⭐⭐ \"קוּמוּ צְּאוּ מִתּוֹךְ עַמִּי... וּבֵרַכְתֶּם גַּם אֹתִי\"", "a": "**מי אמר:** פרעה\n**למי:** משה ואהרן\n**הקשר:** פרעה בלילה אחרי מכת בכורות, שבור ומבקש שיצאו ואף מבקש ברכה (שמות י\"ב:ל\"א-ל\"ב)", "source": "07 seder night and exodus", "type": "story"}, {"q": "2. ⭐⭐⭐ \"כֻּלָּנוּ מֵתִים\"", "a": "**מי אמר:** מצרים (העם המצרי)\n**למי:** (אמירה כללית / זה לזה)\n**הקשר:** המצרים דחקו בבני ישראל לצאת מהר \"כי אמרו כולנו מתים\" - פחדו שכולם ימותו אחרי מכת בכורות (שמות י\"ב:ל\"ג)", "source": "07 seder night and exodus", "type": "story"}, {"q": "3. ⭐⭐⭐ \"מָה הָעֲבֹדָה הַזֹּאת לָכֶם\"", "a": "**מי אמר:** הבנים (לדורות הבאים)\n**למי:** אבותיהם\n**הקשר:** שאלת הבנים על משמעות קרבן הפסח, שעליה יש לענות \"זבח פסח הוא לה'\" (שמות י\"ב:כ\"ו-כ\"ז)", "source": "07 seder night and exodus", "type": "story"}, {"q": "1. ⭐⭐ \"הַחֹדֶשׁ הַזֶּה לָכֶם רֹאשׁ _____ רִאשׁוֹן הוּא לָכֶם לְחׇדְשֵׁי הַשָּׁנָה\"", "a": "**מילה חסרה:** חֳדָשִׁים\n**מי אמר:** ה' למשה ואהרן\n**הקשר:** קביעת חודש ניסן כראש חודשים (שמות י\"ב:ב')", "source": "07 seder night and exodus", "type": "story"}, {"q": "2. ⭐⭐⭐ \"וַאֲכַלְתֶּם אֹתוֹ בְּ_____ פֶּסַח הוּא לַה'\"", "a": "**מילה חסרה:** חִפָּזוֹן\n**מי אמר:** ה'\n**הקשר:** הוראות אכילת קרבן הפסח - בחיפזון (שמות י\"ב:י\"א)", "source": "07 seder night and exodus", "type": "story"}, {"q": "3. ⭐⭐ \"קוּמוּ צְּאוּ מִתּוֹךְ _____ גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל\"", "a": "**מילה חסרה:** עַמִּי\n**מי אמר:** פרעה למשה ואהרן\n**הקשר:** פרעה משלח את ישראל בלילה אחרי מכת בכורות (שמות י\"ב:ל\"א)", "source": "07 seder night and exodus", "type": "story"}, {"q": "4. ⭐⭐⭐ \"וְ_____ לֹא תִשְׁבְּרוּ בוֹ\"", "a": "**מילה חסרה:** עֶצֶם\n**מי אמר:** ה'\n**הקשר:** חוק קרבן הפסח - אסור לשבור עצם (שמות י\"ב:מ\"ו)", "source": "07 seder night and exodus", "type": "story"}, {"q": "5. ⭐⭐ \"כְּשֵׁשׁ מֵאוֹת אֶלֶף _____ הַגְּבָרִים לְבַד מִטָּף\"", "a": "**מילה חסרה:** רַגְלִי\n**מי אמר:** הכתוב\n**הקשר:** מספר היוצאים ממצרים (שמות י\"ב:ל\"ז)", "source": "07 seder night and exodus", "type": "story"}, {"q": "1. מדוע לא הנחה ה' את העם דרך ארץ פלשתים?", "a": "כי קרובה היא, ופן ינחם העם בראותם מלחמה ושבו מצרימה", "source": "08 splitting of the sea", "type": "story"}, {"q": "2. את עצמות מי לקח משה עמו ביציאת מצרים?", "a": "את עצמות יוסף", "source": "08 splitting of the sea", "type": "story"}, {"q": "3. כיצד הנחה ה' את בני ישראל במדבר?", "a": "יומם בעמוד ענן ולילה בעמוד אש", "source": "08 splitting of the sea", "type": "story"}, {"q": "4. היכן ציווה ה' את ישראל לחנות לפני הים?", "a": "לפני פי החירות, בין מגדול ובין הים, לפני בעל צפון", "source": "08 splitting of the sea", "type": "story"}, {"q": "5. כמה רכב בחור לקח פרעה כשרדף אחרי ישראל?", "a": "600 רכב בחור", "source": "08 splitting of the sea", "type": "story"}, {"q": "6. מה אמר משה לעם כשפחדו מהמצרים הרודפים?", "a": "\"אל תיראו, התייצבו וראו את ישועת ה'... ה' יילחם לכם ואתם תחרישון\"", "source": "08 splitting of the sea", "type": "story"}, {"q": "7. מה אמר ה' למשה כשצעק אליו?", "a": "\"מה תצעק אלי, דבר אל בני ישראל ויסעו\"", "source": "08 splitting of the sea", "type": "story"}, {"q": "8. מה עשה עמוד הענן כשהמצרים התקרבו?", "a": "עבר מלפני בני ישראל לאחריהם, והבדיל בין מחנה מצרים למחנה ישראל", "source": "08 splitting of the sea", "type": "story"}, {"q": "9. איזו רוח בקעה את הים?", "a": "רוח קדים עזה כל הלילה", "source": "08 splitting of the sea", "type": "story"}, {"q": "10. כיצד עברו בני ישראל בתוך הים?", "a": "ביבשה, והמים חומה להם מימינם ומשמאלם", "source": "08 splitting of the sea", "type": "story"}, {"q": "11. מה קרה למצרים כשרדפו אחרי ישראל לתוך הים?", "a": "ה' הממם את מחנה מצרים, המים שבו וכיסו אותם - לא נשאר בהם עד אחד", "source": "08 splitting of the sea", "type": "story"}, {"q": "12. מה הייתה תגובת בני ישראל אחרי שראו את ישועת ה'?", "a": "יראו את ה' והאמינו בה' ובמשה עבדו", "source": "08 splitting of the sea", "type": "story"}, {"q": "13. מי נטה את ידו על הים כדי לבקוע אותו?", "a": "משה", "source": "08 splitting of the sea", "type": "story"}, {"q": "14. מדוע התחרט פרעה ורדף אחרי ישראל?", "a": "כי התחרט על שילוח בני ישראל", "source": "08 splitting of the sea", "type": "story"}, {"q": "15. מהי מצוות קידוש בכורות ומדוע נצטוו עליה?", "a": "מצווה הנובעת ממכת בכורות", "source": "08 splitting of the sea", "type": "story"}, {"q": "16. מהו הפסוק \"ה' יִלָּחֵם לָכֶם וְאַתֶּם תַּחֲרִשׁוּן\"?", "a": "שמות י\"ד, י\"ד", "source": "08 splitting of the sea", "type": "story"}, {"q": "17. ⭐⭐ מהן התחנות במסע לפני הגעה לים? (פרק י\"ג)", "a": "מסוכות לאתם בקצה המדבר (שמות י\"ג:כ')", "source": "08 splitting of the sea", "type": "story"}, {"q": "18. ⭐⭐⭐ באיזו משמרת הביט ה' אל מחנה מצרים?", "a": "באשמורת הבוקר (שמות י\"ד:כ\"ד)", "source": "08 splitting of the sea", "type": "story"}, {"q": "19. ⭐⭐⭐ כמה רכב בחור לקח פרעה כשרדף אחרי ישראל?", "a": "שש מאות רכב בחור (שמות י\"ד:ז')", "source": "08 splitting of the sea", "type": "story"}, {"q": "1. ⭐⭐ \"הַמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם\"", "a": "**מי אמר:** בני ישראל\n**למי:** משה\n**הקשר:** תלונת העם כשראו את מצרים רודפים אחריהם ליד ים סוף (שמות י\"ד:י\"א)", "source": "08 splitting of the sea", "type": "story"}, {"q": "2. ⭐⭐ \"הִתְיַצְּבוּ וּרְאוּ אֶת יְשׁוּעַת ה'\"", "a": "**מי אמר:** משה\n**למי:** בני ישראל\n**הקשר:** משה מרגיע את העם הפוחד מהמצרים הרודפים ליד ים סוף (שמות י\"ד:י\"ג)", "source": "08 splitting of the sea", "type": "story"}, {"q": "1. ⭐ ביציאת מצרים, בני ישראל עברו בים סוף ברגל יבשה, והמים היו להם חומה מימינם ומשמאלם. נכון או לא נכון?", "a": "**נכון.** \"ויבואו בני ישראל בתוך הים ביבשה והמים להם חומה מימינם ומשמאלם\" (שמות י\"ד:כ\"ב).", "source": "08 splitting of the sea", "type": "story"}, {"q": "2. ⭐⭐⭐ ה' לא הוביל את בני ישראל דרך ארץ פלשתים כי חשש שהפלשתים יתקפו אותם. נכון או לא נכון?", "a": "**לא בדיוק.** הסיבה לא הייתה שהפלשתים יתקפו, אלא שבני ישראל יראו מלחמה ויחזרו למצרים: \"פן ינחם העם בראותם מלחמה ושבו מצרימה\" (שמות י\"ג:י\"ז). החשש היה מתגובת ישראל, לא מהפלשתים.", "source": "08 splitting of the sea", "type": "story"}, {"q": "3. ⭐⭐⭐ משה בקע את הים במטהו. נכון או לא נכון?", "a": "**לא בדיוק.** משה נטה את ידו על הים (שמות י\"ד:כ\"א), אבל ה' הוליך את הים \"ברוח קדים עזה כל הלילה\". ה' אמר למשה \"הרם את מטך ונטה את ידך על הים\" (י\"ד:ט\"ז) - אבל הבקיעה עצמה נעשתה על ידי ה' ברוח קדים.", "source": "08 splitting of the sea", "type": "story"}, {"q": "3. ⭐⭐⭐ \"מַה תִּצְעַק אֵלָי דַּבֵּר אֶל בְּנֵי יִשְׂרָאֵל וְיִסָּעוּ\"", "a": "**מי אמר:** ה'\n**למי:** משה\n**הקשר:** ה' אומר למשה להפסיק להתפלל ולפעול - לדבר אל העם שיתקדמו אל הים (שמות י\"ד:ט\"ו)", "source": "08 splitting of the sea", "type": "story"}, {"q": "4. ⭐⭐⭐ \"אָנוּסָה מִפְּנֵי יִשְׂרָאֵל כִּי ה' נִלְחָם לָהֶם בְּמִצְרָיִם\"", "a": "**מי אמר:** מצרים (חיילי פרעה)\n**למי:** זה לזה\n**הקשר:** כשה' הממם את מחנה מצרים בתוך הים, הסיר אופני מרכבותיהם, והם הבינו שה' נלחם נגדם (שמות י\"ד:כ\"ה)", "source": "08 splitting of the sea", "type": "story"}, {"q": "5. ⭐⭐⭐ \"מַה זֹּאת עָשִׂינוּ כִּי שִׁלַּחְנוּ אֶת יִשְׂרָאֵל מֵעׇבְדֵנוּ\"", "a": "**מי אמר:** פרעה ועבדיו\n**למי:** זה לזה\n**הקשר:** פרעה ועבדיו מתחרטים על שילוח ישראל ומחליטים לרדוף אחריהם (שמות י\"ד:ה')", "source": "08 splitting of the sea", "type": "story"}, {"q": "1. ⭐⭐ \"הִתְיַצְּבוּ וּרְאוּ אֶת _____ ה' אֲשֶׁר יַעֲשֶׂה לָכֶם הַיּוֹם\"", "a": "**מילה חסרה:** יְשׁוּעַת\n**מי אמר:** משה לבני ישראל\n**הקשר:** משה מעודד את העם כשפחדו מהמצרים הרודפים ליד ים סוף (שמות י\"ד:י\"ג)", "source": "08 splitting of the sea", "type": "story"}, {"q": "2. ⭐⭐⭐ \"ה' יִלָּחֵם לָכֶם וְאַתֶּם _____\"", "a": "**מילה חסרה:** תַּחֲרִשׁוּן\n**מי אמר:** משה לבני ישראל\n**הקשר:** משה אומר לעם שה' ילחם בעדם והם צריכים לשתוק (שמות י\"ד:י\"ד)", "source": "08 splitting of the sea", "type": "story"}, {"q": "3. ⭐⭐ \"וְהַמַּיִם לָהֶם _____ מִימִינָם וּמִשְּׂמֹאלָם\"", "a": "**מילה חסרה:** חוֹמָה\n**מי אמר:** הכתוב\n**הקשר:** תיאור מעבר בני ישראל בתוך הים - המים עמדו כחומות משני הצדדים (שמות י\"ד:כ\"ב)", "source": "08 splitting of the sea", "type": "story"}, {"q": "4. ⭐⭐⭐ \"וַיַּאֲמִינוּ בַּה' וּבְ_____ עַבְדּוֹ\"", "a": "**מילה חסרה:** מֹשֶׁה\n**מי אמר:** הכתוב\n**הקשר:** אמונת העם אחרי שראו את ישועת ה' בקריעת ים סוף (שמות י\"ד:ל\"א)", "source": "08 splitting of the sea", "type": "story"}, {"q": "5. ⭐⭐ \"וַיִּקַּח מֹשֶׁה אֶת _____ יוֹסֵף עִמּוֹ\"", "a": "**מילה חסרה:** עַצְמוֹת\n**מי אמר:** הכתוב\n**הקשר:** משה מקיים את שבועת יוסף ולוקח את עצמותיו ביציאת מצרים (שמות י\"ג:י\"ט)", "source": "08 splitting of the sea", "type": "story"}, {"q": "1. היכן נמצא מדבר סין?", "a": "בין אילים ובין סיני", "source": "09 the manna", "type": "story"}, {"q": "2. מתי הגיעו בני ישראל למדבר סין?", "a": "בחמישה עשר לחודש השני ליציאתם ממצרים", "source": "09 the manna", "type": "story"}, {"q": "3. על מה התלוננו בני ישראל במדבר?", "a": "על חוסר אוכל - \"מי יתן מותנו ביד ה' בארץ מצרים בשבתנו על סיר הבשר באכלנו לחם לשובע\"", "source": "09 the manna", "type": "story"}, {"q": "4. מה ירד בערב ומה ירד בבוקר?", "a": "בערב עלה השלו (ציפורים), ובבוקר ירד המן", "source": "09 the manna", "type": "story"}, {"q": "5. כיצד נראה המן?", "a": "דבר דק מחוספס, דק ככפור, כזרע גד לבן", "source": "09 the manna", "type": "story"}, {"q": "6. מה טעם המן?", "a": "כצפיחית בדבש", "source": "09 the manna", "type": "story"}, {"q": "7. מדוע נקרא \"מן\"?", "a": "כי העם שאל \"מן הוא\" - לא ידעו מה הוא", "source": "09 the manna", "type": "story"}, {"q": "8. כמה מן היה כל אדם אוסף ליום?", "a": "עומר לגולגולת", "source": "09 the manna", "type": "story"}, {"q": "9. מה קרה למן כשניסו לשמור אותו ליום המחרת?", "a": "התליע והבאיש", "source": "09 the manna", "type": "story"}, {"q": "10. מה מיוחד ביום השישי לגבי ליקוט המן?", "a": "לוקטים לחם משנה (כפול) לכבוד השבת", "source": "09 the manna", "type": "story"}, {"q": "11. האם ירד מן ביום השבת?", "a": "לא, ביום השביעי אין מן", "source": "09 the manna", "type": "story"}, {"q": "12. מה קרה לאנשים שיצאו ללקוט מן בשבת?", "a": "לא מצאו", "source": "09 the manna", "type": "story"}, {"q": "13. מה ציווה ה' לשמור לדורות מהמן?", "a": "צנצנת מן למשמרת", "source": "09 the manna", "type": "story"}, {"q": "14. כמה שנים אכלו בני ישראל את המן?", "a": "ארבעים שנה, עד בואם לארץ נושבת", "source": "09 the manna", "type": "story"}, {"q": "15. מהו שיעור העומר?", "a": "עשירית האיפה", "source": "09 the manna", "type": "story"}, {"q": "16. מהם השלו?", "a": "ציפורי בשר שעלו בערב", "source": "09 the manna", "type": "story"}, {"q": "17. כמה ימים בשבוע לוקטים מן?", "a": "שישה ימים", "source": "09 the manna", "type": "story"}, {"q": "18. ⭐⭐⭐ מה קרה למן כשהשמש חממה?", "a": "נמס (שמות ט\"ז:כ\"א)", "source": "09 the manna", "type": "story"}, {"q": "19. ⭐⭐ למי ציווה משה להניח צנצנת מן למשמרת?", "a": "לאהרן (שמות ט\"ז:ל\"ג)", "source": "09 the manna", "type": "story"}, {"q": "20. ⭐⭐⭐ מי הגיעו למשה כשליקטו לחם משנה ביום השישי?", "a": "כל נשיאי העדה (שמות ט\"ז:כ\"ב)", "source": "09 the manna", "type": "story"}, {"q": "1. ⭐⭐⭐ \"מִי יִתֵּן מוּתֵנוּ בְיַד ה' בְּאֶרֶץ מִצְרַיִם בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר\"", "a": "**מי אמר:** בני ישראל\n**למי:** משה ואהרן\n**הקשר:** תלונת העם במדבר סין על חוסר אוכל - העדיפו למות במצרים ליד סיר הבשר מאשר למות ברעב במדבר (שמות ט\"ז:ג')", "source": "09 the manna", "type": "story"}, {"q": "2. ⭐⭐⭐ \"עַד אָנָה מֵאַנְתֶּם לִשְׁמֹר מִצְוֹתַי וְתוֹרֹתָי\"", "a": "**מי אמר:** ה'\n**למי:** משה (ובני ישראל)\n**הקשר:** ה' כועס כשאנשים יוצאים ללקוט מן בשבת למרות האיסור (שמות ט\"ז:כ\"ח)", "source": "09 the manna", "type": "story"}, {"q": "1. ⭐⭐⭐ המן שנשמר מערב שבת הבאיש והתליע כמו המן שנשמר בימי חול. נכון או לא נכון?", "a": "**לא נכון.** המן שנשמר מיום רגיל ליום המחרת \"וירום תולעים ויבאש\" (ט\"ז:כ'), אבל המן שנשמר מיום שישי לשבת \"לא הבאיש ורימה לא היתה בו\" (ט\"ז:כ\"ד).", "source": "09 the manna", "type": "story"}, {"q": "2. ⭐⭐⭐ השלו ירד בבוקר והמן ירד בערב. נכון או לא נכון?", "a": "**לא נכון - הפוך!** השלו עלה בערב והמן ירד בבוקר: \"בערב תאכלו בשר ובבוקר תשבעו לחם\" (ט\"ז:י\"ב). \"ויהי בערב ותעל השלו... ובבוקר היתה שכבת הטל\" (ט\"ז:י\"ג).", "source": "09 the manna", "type": "story"}, {"q": "3. ⭐⭐⭐ מי שליקט הרבה מן קיבל יותר ממי שליקט מעט. נכון או לא נכון?", "a": "**לא נכון.** \"וימודו בעומר ולא העדיף המרבה והממעיט לא החסיר, איש לפי אכלו לקטו\" (ט\"ז:י\"ח) - נס! לא משנה כמה ליקטת, בסוף היה בדיוק עומר לגולגולת.", "source": "09 the manna", "type": "story"}, {"q": "1. ⭐⭐⭐ מלין על חוסר אוכל, מתגעגע לסיר הבשר במצרים, לוקט מן בשבת למרות האיסור", "a": "**הדמות:** בני ישראל (העם)\n**ספר:** שמות\n**הקשר:** העם מתלונן במדבר סין על חוסר מזון, ה' נותן להם מן ושלו, אך חלק מהעם מפר את הכללים - שומר מן ליום המחרת או יוצא ללקוט בשבת (פרק ט\"ז)", "source": "09 the manna", "type": "story"}, {"q": "1. ⭐⭐ \"הִנְנִי מַמְטִיר לָכֶם _____ מִן הַשָּׁמָיִם\"", "a": "**מילה חסרה:** לֶחֶם\n**מי אמר:** ה' למשה\n**הקשר:** ה' מבטיח להמטיר מן מהשמים (שמות ט\"ז:ד')", "source": "09 the manna", "type": "story"}, {"q": "2. ⭐⭐⭐ \"_____ הוּא כִּי לֹא יָדְעוּ מַה הוּא\"", "a": "**מילה חסרה:** מָן\n**מי אמר:** בני ישראל (איש אל אחיו)\n**הקשר:** העם רואה את המן לראשונה ולא יודע מה זה (שמות ט\"ז:ט\"ו)", "source": "09 the manna", "type": "story"}, {"q": "3. ⭐⭐ \"כְּזֶרַע גַּד לָבָן וְטַעְמוֹ כְּצַפִּיחִת בִּ_____\"", "a": "**מילה חסרה:** דְבָשׁ\n**מי אמר:** הכתוב\n**הקשר:** תיאור מראה וטעם המן (שמות ט\"ז:ל\"א)", "source": "09 the manna", "type": "story"}, {"q": "4. ⭐⭐⭐ \"שֵׁשֶׁת יָמִים תִּלְקְטֻהוּ וּבַיּוֹם הַשְּׁבִיעִי _____ לֹא יִהְיֶה בּוֹ\"", "a": "**מילה חסרה:** שַׁבָּת\n**מי אמר:** משה\n**הקשר:** כלל ליקוט המן - שישה ימים לוקטים וביום השביעי שבת (שמות ט\"ז:כ\"ו)", "source": "09 the manna", "type": "story"}, {"q": "5. ⭐⭐⭐ \"עַד אָנָה מֵאַנְתֶּם לִשְׁמֹר _____ וְתוֹרֹתָי\"", "a": "**מילה חסרה:** מִצְוֺתַי\n**מי אמר:** ה' (למשה ולבני ישראל)\n**הקשר:** ה' כועס כשאנשים יוצאים ללקוט מן בשבת (שמות ט\"ז:כ\"ח)", "source": "09 the manna", "type": "story"}, {"q": "1. היכן חנו בני ישראל כשלא היו מים?", "a": "ברפידים", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "2. מה דרשו בני ישראל ממשה ברפידים?", "a": "\"תנו לנו מים ונשתה\"", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "3. מה ענה משה לעם כשרבו עמו?", "a": "\"מה תריבון עמדי, מה תנסון את ה'\"", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "4. כיצד הוציא משה מים מהסלע?", "a": "ה' ציווהו להכות בצור בחורב במטהו, ויצאו מים", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "5. מדוע נקרא המקום \"מסה ומריבה\"?", "a": "על ריב בני ישראל ועל נסותם את ה'", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "6. מי נלחם בישראל ברפידים?", "a": "עמלק", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "7. למי אמר משה לבחור אנשים ולצאת להילחם בעמלק?", "a": "ליהושע", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "8. מה קרה כשמשה הרים את ידו?", "a": "גבר ישראל", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "9. מה קרה כשמשה הניח את ידו?", "a": "גבר עמלק", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "10. מי תמכו בידי משה ומדוע?", "a": "אהרן וחור, כי ידי משה כבדו", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "11. מה שמו אהרן וחור תחת משה כשידיו כבדו?", "a": "אבן", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "12. עד מתי היו ידי משה מורמות?", "a": "עד בוא השמש", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "13. מה עשה יהושע לעמלק?", "a": "החליש את עמלק", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "14. מה ציווה ה' לכתוב לגבי עמלק?", "a": "זיכרון בספר - \"כי מחה אמחה את זכר עמלק מתחת השמים\"", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "15. מה שם המזבח שבנה משה ומה משמעותו?", "a": "\"ה' נסי\"", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "16. היכן היה הצור שממנו יצאו מים?", "a": "בחורב", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "17. היכן עמד משה בזמן המלחמה בעמלק?", "a": "על ראש הגבעה, ומטה האלוהים בידו", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "18. ⭐⭐⭐ מי עלו עם משה לראש הגבעה במלחמת עמלק?", "a": "אהרן וחור (שמות י\"ז:י')", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "19. ⭐⭐ מה שם המזבח שבנה משה אחרי מלחמת עמלק?", "a": "\"ה' נסי\" (שמות י\"ז:ט\"ו)", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "20. ⭐⭐⭐ מה ציווה ה' לכתוב בספר לגבי עמלק?", "a": "זיכרון - \"כי מחה אמחה את זכר עמלק מתחת השמים\" (שמות י\"ז:י\"ד)", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "1. ⭐ נלחם בישראל ברפידים, ישראל ניצחו אותו כשידי משה היו מורמות, ה' נשבע למחות את זכרו", "a": "**הדמות:** עמלק\n**ספר:** שמות\n**הקשר:** עמלק תקף את ישראל ברפידים, ישראל ניצחו כשמשה הרים ידיו ויהושע נלחם, וה' נשבע למחות את זכר עמלק (פרק י\"ז)", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "2. ⭐⭐ נבחר להוביל את הלחימה כנגד אויב ברפידים, מנהיג צבאי צעיר, שמו המקורי הושע", "a": "**הדמות:** יהושע\n**ספר:** שמות\n**הקשר:** משה בחר ביהושע להילחם בעמלק ברפידים, שמו המקורי היה הושע בן נון ומשה שינה שמו ליהושע (פרק י\"ז, במדבר י\"ג)", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "3. ⭐⭐ תמך בידי משה מצד אחד בזמן מלחמה, היה כהן, אחי משה", "a": "**הדמות:** אהרן (במלחמת עמלק)\n**ספר:** שמות\n**הקשר:** אהרן וחור תמכו בידי משה במלחמת עמלק - אהרן מצד אחד וחור מצד שני, כדי שידיו יישארו מורמות (פרק י\"ז)", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "1. ⭐⭐⭐ \"בְּחַר לָנוּ אֲנָשִׁים וְצֵא הִלָּחֵם בַּעֲמָלֵק\"", "a": "**מי אמר:** משה\n**למי:** יהושע\n**הקשר:** משה מצווה את יהושע לבחור לוחמים ולצאת להילחם בעמלק ברפידים (שמות י\"ז:ט')", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "2. ⭐⭐⭐ \"לָמָּה זֶּה הֶעֱלִיתָנוּ מִמִּצְרַיִם לְהָמִית אֹתִי וְאֶת בָּנַי וְאֶת מִקְנַי בַּצָּמָא\"", "a": "**מי אמר:** העם (בני ישראל)\n**למי:** משה\n**הקשר:** תלונת העם ברפידים כשלא היו מים - שימו לב שהזכירו גם \"מקני\" (בהמות), לא רק בני אדם (שמות י\"ז:ג')", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "1. ⭐⭐⭐ משה הכה בסלע ברפידים כדי להוציא מים. נכון או לא נכון?", "a": "**לא בדיוק.** משה הכה בצור ב**חורב** - לא ברפידים עצמה. בני ישראל חנו ברפידים, אבל ה' אמר למשה \"הנני עומד לפניך שם על הצור בחורב\" (שמות י\"ז:ו').", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "2. ⭐⭐⭐ יהושע הרג את עמלק במלחמה ברפידים. נכון או לא נכון?", "a": "**לא נכון.** יהושע \"החליש\" את עמלק - לא הרג או השמיד: \"ויחלוש יהושע את עמלק ואת עמו לפי חרב\" (שמות י\"ז:י\"ג). \"ויחלוש\" - לא \"ויכה\" או \"וישמד\".", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "3. ⭐⭐⭐ משה הוציא מים מהסלע לעיני כל העם. נכון או לא נכון?", "a": "**לא נכון.** משה הוציא מים \"לעיני זקני ישראל\" (שמות י\"ז:ו') - לא לעיני כל העם, אלא רק לעיני הזקנים.", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "1. ⭐⭐ \"וְהִכִּיתָ _____ וְיָצְאוּ מִמֶּנּוּ מַיִם וְשָׁתָה הָעָם\"", "a": "**מילה חסרה:** בַצּוּר\n**מי אמר:** ה' למשה\n**הקשר:** ה' מצווה את משה להכות בצור בחורב להוציא מים (שמות י\"ז:ו')", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "2. ⭐⭐⭐ \"כִּי מָחֹה אֶמְחֶה אֶת _____ עֲמָלֵק מִתַּחַת הַשָּׁמָיִם\"", "a": "**מילה חסרה:** זֵכֶר\n**מי אמר:** ה' למשה\n**הקשר:** ה' מצווה לכתוב זיכרון בספר ונשבע למחות את זכר עמלק (שמות י\"ז:י\"ד)", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "3. ⭐⭐ \"הֲיֵשׁ ה' _____ אִם אָיִן\"", "a": "**מילה חסרה:** בְּקִרְבֵּנוּ\n**מי אמר:** בני ישראל\n**הקשר:** שאלת העם שבגללה נקרא המקום \"מסה ומריבה\" (שמות י\"ז:ז')", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "4. ⭐⭐⭐ \"וַיְהִי _____ אֱמוּנָה עַד בֹּא הַשָּׁמֶשׁ\"", "a": "**מילה חסרה:** יָדָיו\n**מי אמר:** הכתוב\n**הקשר:** ידי משה היו מורמות ויציבות עד השקיעה בזכות תמיכת אהרן וחור (שמות י\"ז:י\"ב)", "source": "10 masa meriva and amalek", "type": "story"}, {"q": "1. ⭐⭐ פרעה גזר להשליך את הבנים ליאור (פרק א'), אך דווקא היאור הציל את משה (פרק ב'). כיצד הפכה גזרת פרעה נגד עצמו?", "a": "פרעה ציווה להשליך כל בן הנולד ליאור כדי להשמיד את בני ישראל, אך אם משה שמה את בנה בתיבת גומא ביאור - ודווקא בת פרעה עצמה מצאה אותו שם, אימצה אותו וגידלה אותו בארמון. כך המושיע של ישראל גדל בבית פרעה עצמו.", "source": "cross chapter", "type": "story"}, {"q": "2. ⭐⭐ משה ברח למדיין בפרק ב' וחזר למצרים בפרק ד'. מה השתנה בין שתי הנקודות שאיפשר את החזרה?", "a": "בפרק ב' משה ברח כי פרעה ביקש להרגו. בסוף פרק ב' נאמר \"וימת מלך מצרים\", ובפרק ד' ה' אומר למשה \"לך שוב מצרים כי מתו כל האנשים המבקשים את נפשך\". מות המלך שביקש להרגו, בשילוב ציווי ה' בסנה הבוער, איפשרו את חזרת משה למצרים.", "source": "cross chapter", "type": "story"}, {"q": "3. ⭐⭐ בפרק ב' משה הציל את בנות יתרו מהרועים על הבאר, ובפרק י\"ז הוציא מים מהסלע ברפידים. מה המשותף והשונה בין שני אירועי המים? (פרקים ב', י\"ז)", "a": "בשני המקרים משה פועל להשיג מים עבור אחרים. בפרק ב' הוא עושה זאת ביוזמתו האישית ובכוח גופני מול הרועים. בפרק י\"ז הוא עושה זאת בציווי ה' ובכוח על-טבעי - מכה בצור במטה האלוהים. ההתפתחות משקפת את המעבר ממנהיג אנושי לשליח אלוהי.", "source": "cross chapter", "type": "story"}, {"q": "4. ⭐⭐ בני ישראל התלוננו מספר פעמים במדבר. על מה התלוננו בכל פעם, ומה היה הפתרון? (פרקים י\"ד, ט\"ז, י\"ז)", "a": "בים סוף (פרק י\"ד) - פחדו מהמצרים הרודפים, והפתרון היה קריעת הים. במדבר סין (פרק ט\"ז) - התלוננו על חוסר אוכל וזכרו את \"סיר הבשר\" במצרים, והפתרון היה ירידת המן והשלו. ברפידים (פרק י\"ז) - התלוננו על חוסר מים, והפתרון היה הוצאת מים מהצור בחורב.", "source": "cross chapter", "type": "story"}, {"q": "5. ⭐⭐ המטה של משה מופיע בכמה סיפורים. באילו אירועים שימש המטה ומה עשה בכל אחד מהם? (פרקים ד', י\"ד, י\"ז)", "a": "בפרק ד' - המטה הפך לנחש כאות לפני ה'. בפרק י\"ד - משה נטה את ידו (עם המטה) על הים כדי לבקוע אותו ולהשיב את המים. בפרק י\"ז - משה הכה בצור בחורב במטהו כדי להוציא מים, ולאחר מכן החזיק את \"מטה האלוהים\" בידו בראש הגבעה במלחמת עמלק.", "source": "cross chapter", "type": "story"}, {"q": "6. ⭐⭐ ה' הבטיח בסנה הבוער שישראל יקבלו כלי כסף וזהב ממצרים (פרק ג'). מתי התממשה הבטחה זו? (פרקים ג', י\"א, י\"ב)", "a": "בפרק ג' ה' הבטיח שכשיצאו לא יצאו ריקם ושאלו כלי כסף וזהב. בפרק י\"א ה' ציווה שישאלו ממצרים כלי כסף וזהב, וה' נתן את חן העם בעיני מצרים. בפרק י\"ב, ביציאה עצמה, בני ישראל שאלו ממצרים וקיבלו - כך התממשה ההבטחה.", "source": "cross chapter", "type": "story"}, {"q": "7. ⭐⭐⭐ בפרק ד' ה' אמר למשה \"בני בכורי ישראל\" והזהיר על בכור פרעה. כיצד מתקשר הכינוי הזה למכת בכורות? (פרקים ד', י\"א, י\"ב)", "a": "בפרק ד' ה' מצווה את משה לומר לפרעה \"בני בכורי ישראל... שלח את בני ויעבדני, ואם מאן אתה לשלח, הנה אנכי הורג את בנך בכורך\". זו התראה מוקדמת על מכת בכורות שמתממשת בפרקים י\"א-י\"ב: מות כל בכור במצרים כעונש על סירוב פרעה לשלח את \"בכורו\" של ה'.", "source": "cross chapter", "type": "story"}, {"q": "8. ⭐⭐ השוו בין גזרת פרעה על הבנים (פרק א') לבין מכת בכורות (פרקים י\"א-י\"ב). מהי ההקבלה? (פרקים א', י\"א, י\"ב)", "a": "בפרק א' פרעה גזר להשמיד את בכורי ישראל (הבנים הנולדים) ביאור. במכת בכורות ה' הכה את בכורי מצרים - מבכור פרעה עד בכור השפחה. זוהי מידה כנגד מידה: פרעה שניסה להרוג ילדי ישראל נענש בהריגת הבכורות של מצרים.", "source": "cross chapter", "type": "story"}, {"q": "9. ⭐⭐ יוסף נזכר בתחילת הספר ולאחר מכן ביציאת מצרים. מהם שני האזכורים ומה הקשר ביניהם? (פרקים א', י\"ג)", "a": "בפרק א' נאמר \"וימת יוסף וכל אחיו\" ו\"ויקם מלך חדש אשר לא ידע את יוסף\" - מות יוסף סימל את תחילת השעבוד. בפרק י\"ג נאמר \"ויקח משה את עצמות יוסף עמו כי השבע השביע את בני ישראל\" - ביציאת מצרים משה מכבד את שבועת יוסף. הסיפור נפתח בשכחת יוסף ונסגר בזכירתו.", "source": "cross chapter", "type": "story"}, {"q": "10. ⭐⭐⭐ בפרק ג' ה' אמר למשה שיבקשו מפרעה \"דרך שלושת ימים במדבר\", ובפרק ה' משה ואהרן באו אל פרעה. כיצד הבקשה השתנתה? (פרקים ג', ה')", "a": "בפרק ג' ה' ציווה לבקש מפרעה לצאת לדרך שלושת ימים במדבר לזבוח לה'. בפרק ה' משה ואהרן אמרו \"שלח את עמי ויחוגו לי במדבר\". פרעה סירב באומרו \"מי ה' אשר אשמע בקולו\". התוצאה הייתה הפוכה - פרעה לא רק סירב אלא הכביד את העבודה והפסיק לספק תבן.", "source": "cross chapter", "type": "story"}, {"q": "11. ⭐⭐ בפרק ד' ה' אמר שיקשה את לב פרעה. כיצד הקשיית הלב באה לידי ביטוי בפרק ה' ובפרקים י\"א-י\"ב? (פרקים ד', ה', י\"א, י\"ב)", "a": "בפרק ד' ה' הודיע מראש שיקשה את לב פרעה. בפרק ה' פרעה מסרב ומכביד את העבודה. בפרק י\"א, אחרי כל המכות, פרעה עדיין מסרב. רק בפרק י\"ב, אחרי מכת בכורות שפגעה בבנו שלו, פרעה נשבר ואמר \"קומו צאו מתוך עמי\".", "source": "cross chapter", "type": "story"}, {"q": "12. ⭐⭐⭐ עם ישראל מכונה \"שש מאות אלף רגלי\" ביציאת מצרים (פרק י\"ב), ופרעה רדף אחריהם עם \"שש מאות רכב בחור\" (פרק י\"ד). מה ניתן ללמוד מההשוואה בין המספרים? (פרקים י\"ב, י\"ג-י\"ד)", "a": "600,000 רגלי ישראליים יצאו ממצרים (לבד מטף), ופרעה רדף עם 600 רכב בחור. היחס הוא 1000:1 לטובת ישראל מבחינת מספרים, אך ישראל פחדו מאוד כי לא היו חמושים ומאורגנים למלחמה. הניצחון על הים הוכיח שהכוח האלוהי, ולא המספרים, הוא הקובע.", "source": "cross chapter", "type": "story"}, {"q": "13. ⭐⭐ השוו בין עבודת הפרך במצרים - \"בחומר ובלבנים\" (פרק א') - לבין הכבדת העבודה כשפרעה הפסיק לתת תבן (פרק ה'). כיצד השעבוד הוחמר? (פרקים א', ה')", "a": "בפרק א' העבודה הייתה קשה אך מאורגנת - \"בחומר ובלבנים ובכל עבודה בשדה\". בפרק ה', אחרי שמשה ואהרן באו אל פרעה, השעבוד הוחמר: פרעה הפסיק לספק תבן אך דרש את אותה מכסת לבנים. העם נאלץ להתפזר לאסוף קש, והשוטרים הישראליים הוכו על אי-עמידה במכסה.", "source": "cross chapter", "type": "story"}, {"q": "14. ⭐⭐ מרים, שפרה, פועה, בתיה (בת פרעה), יוכבד - מי מהנשים לא פעלה להציל חיים בספר שמות?", "a": "**התשובה:** מרים - בפרקים א'-ה' מרים מתוארת כ\"אחותו\" ששמרה על התיבה (ב':ד'), אך לא מתוארת כמצילה באופן ישיר. שפרה ופועה סירבו להרוג תינוקות (א':ט\"ו-י\"ז), בת פרעה הצילה את משה מהיאור (ב':ה-י'), ויוכבד הטמינה את משה ושמה אותו בתיבה (ב':ב'-ג'). אמנם מרים סייעה בקישור בין בת פרעה ליוכבד, אך לא \"הצילה\" באופן ישיר.", "source": "cross chapter", "type": "story"}], "text": [{"q": "טקסט: \"הִנֵּה עַם בְּנֵי יִשְׂרָאֵל רַב וְעָצוּם\"\nשאלה: מי אמר את הדברים האלה, ולמי?", "a": "פרעה (מלך מצרים החדש) אמר לעמו - המצרים (שמות א':ט'-י')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"כִּי חָיוֹת הֵנָּה בְּטֶרֶם תָּבוֹא\"\nשאלה: מי אמר/אמרו את הדברים האלה, למי, ומה היו מנסים להסתיר?", "a": "המיילדות שפרה ופועה אמרו לפרעה. הן הסתירו את העובדה שסירבו בכוונה לציית לפקודתו להמית את הבנים הנולדים (שמות א':י\"ט)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְכַאֲשֶׁר יְעַנּוּ אֹתוֹ כֵּן יִרְבֶּה וְכֵן יִפְרֹץ\"\nשאלה: מה מתואר בפסוק הזה - מה היתה התוצאה המפתיעה של העינויים?", "a": "ככל שהמצרים עינו את בני ישראל, כך הם רבו ופרצו יותר - תוצאה הפוכה ממה שפרעה תכנן (שמות א':י\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיַּעַשׂ לָהֶם בָּתִּים\"\nשאלה: מה הסיבה ומה התוצאה המתוארות בפסוק? מה עשו המיילדות שזכו לשכר הזה?", "a": "הסיבה: המיילדות יראו את האלוהים. מה שעשו: סירבו לציית לפרעה ולא המיתו את הילדים. התוצאה/שכר: אלוהים עשה להן בתים (שמות א':כ\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"כׇּל הַבֵּן הַיִּלּוֹד הַיְאֹרָה תַּשְׁלִיכֻהוּ\"\nשאלה: למי נאמרה הגזרה הזו? (רמז: זו לא הפקודה למיילדות)", "a": "הגזרה נאמרה \"לכל עמו\" של פרעה - לכל המצרים, לא רק למיילדות. זו הגזרה האחרונה והחמורה ביותר (שמות א':כ\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיָּשִׂימוּ עָלָיו שָׂרֵי מִסִּים\"\nשאלה: מה בנו בני ישראל כתוצאה מעבודת הפרך המתוארת כאן?", "a": "ערי מסכנות לפרעה - את פיתום ואת רעמסס (שמות א':י\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וּרְאִיתֶן עַל הָאׇבְנָיִם אִם בֵּן הוּא\"\nשאלה: מה עשו המיילדות בפועל כשקיבלו את הפקודה הזו, ומדוע?", "a": "\"ותיראן המילדות את האלוהים ולא עשו כאשר דיבר אליהן מלך מצרים ותחיין את הילדים\" - סירבו לציית כי יראו את האלוהים (שמות א':י\"ז)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיָּקׇם מֶלֶךְ חָדָשׁ עַל מִצְרָיִם\"\nשאלה: מה היה החשש של המלך החדש שגרם לו לפעול נגד בני ישראל?", "a": "\"פן ירבה והיה כי תקראנה מלחמה ונוסף גם הוא על שונאינו ונלחם בנו ועלה מן הארץ\" - חשש שבני ישראל יצטרפו לאויביו בעת מלחמה (שמות א':י')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיָּקֻצוּ מִפְּנֵי בְּנֵי יִשְׂרָאֵל\"\nשאלה: מה פירוש המילה \"וַיָּקֻצוּ\" כאן, ומה הביא לתחושה הזו?", "a": "\"ויקוצו\" - חשו סלידה/גועל/חשש. הסיבה: \"וכאשר יענו אותו כן ירבה וכן יפרוץ\" - ככל שעינו את בני ישראל הם רבו יותר, וזה גרם למצרים לקוץ בהם (שמות א':י\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"בַּעֲבֹדָה קָשָׁה בְּחֹמֶר וּבִלְבֵנִים\"\nשאלה: הפסוק מזכיר \"בחומר ובלבנים\" - מה סוג העבודה הנוסף שמוזכר מיד אחרי?", "a": "\"ובכל עבודה בשדה את כל עבודתם אשר עבדו בהם בפרך\" - מלבד חומר ולבנים היתה גם עבודת שדה, והכל בפרך (שמות א':י\"ד)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וּרְאִיתֶן עַל הָאׇבְנָיִם\"\nשאלה: מה הן \"האובניים\" המוזכרות בפסוק?", "a": "אבני הלידה / כסא הלידה - המקום שעליו יושבת היולדת. פרעה ציווה את המיילדות להסתכל שם כדי לדעת מיד אם נולד בן או בת (שמות א':ט\"ז)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיֵּיטֶב אֱלֹהִים לַמְיַלְּדֹת\"\nשאלה: הפסוק מזכיר שני דברים שקרו - מה הקשר ביניהם, ומה השכר הנוסף שמוזכר בפסוק הבא?", "a": "הקשר: בזכות שהמיילדות יראו את האלוהים ולא המיתו את הילדים - גם ה' היטיב להן וגם העם רבה. השכר הנוסף בפסוק הבא: \"ויעש להם בתים\" (שמות א':כ'-כ\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְאֵלֶּה שְׁמוֹת בְּנֵי יִשְׂרָאֵל\"\nשאלה: מי מבני יעקב לא מופיע ברשימת השמות בתחילת הפרק, ומדוע?", "a": "יוסף לא מופיע ברשימה כי \"יוסף היה במצרים\" - הוא כבר היה שם, לא \"בא\" עם האחרים (שמות א':ה')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"פָּרוּ וַיִּשְׁרְצוּ וַיִּרְבּוּ וַיַּעַצְמוּ\"\nשאלה: על מי מדובר בפסוק? ומה קרה מיד אחרי ריבויים?", "a": "על בני ישראל במצרים. מיד אחרי כך \"ויקם מלך חדש על מצרים אשר לא ידע את יוסף\" - ריבויים הוא שגרם לחשש המלך החדש (שמות א':ז'-ח')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"שֵׁם הָאַחַת שִׁפְרָה\"\nשאלה: מה שם השנייה? ומי ציווה עליהן ומה בדיוק ציווה?", "a": "שם השנייה פועה. מלך מצרים ציווה עליהן להמית את הבנים הנולדים על האובניים ולהחיות את הבנות (שמות א':ט\"ו-ט\"ז)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַתִּמָּלֵא הָאָרֶץ אֹתָם\"\nשאלה: כמה נפשות ירדו למצרים מלכתחילה, לפי הפסוקים הקודמים?", "a": "שבעים נפש - \"ויהי כל נפש יוצאי ירך יעקב שבעים נפש\" (שמות א':ה')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְהִנֵּה נַעַר בֹּכֶה וַתַּחְמֹל עָלָיו\"\nשאלה: מי פתחה את התיבה ואמרה את הדברים האלה? ומה קרה מיד אחר כך?", "a": "בת פרעה. מיד אחר כך אחות משה הציעה להביא מינקת עברית, ובכך הוחזר משה לאמו שלו שהניקה אותו בשכר (שמות ב':ו'-ט')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"כִּי מִן הַמַּיִם מְשִׁיתִהוּ\"\nשאלה: מי קראה את השם הזה, ומה הקשר בין השם לסיבה המצוינת בפסוק?", "a": "בת פרעה קראה לו \"משה\" כי משתה (הוציאה) אותו מן המים - השם מבוסס על פועל המשייה מהמים (שמות ב':י')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"מִי שָׂמְךָ לְאִישׁ שַׂר וְשֹׁפֵט\"\nשאלה: מי אמר את הדברים האלה ולמי? ומה גרם למשה לנסות להתערב מלכתחילה?", "a": "איש עברי אמר למשה. משה ניסה להפריד בין שני אנשים עבריים שנצו ביניהם. התגובה הזו חשפה שמעשה הריגת המצרי נודע (שמות ב':י\"ג-י\"ד)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"אִישׁ מִצְרִי הִצִּילָנוּ מִיַּד הָרֹעִים\"\nשאלה: מי אמר/אמרו את הדברים האלה ולמי? מהי הטעות בתיאור האיש?", "a": "בנות רעואל (כהן מדיין) אמרו לאביהן. הטעות: הן כינו את משה \"איש מצרי\" - בעוד שבפועל הוא עברי שגדל בארמון פרעה (שמות ב':י\"ח-י\"ט)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּזְכֹּר אֱלֹהִים אֶת בְּרִיתוֹ\"\nשאלה: מה גרם לאלוהים לזכור את בריתו, לפי מה שכתוב ממש לפני הפסוק הזה?", "a": "\"וימת מלך מצרים ויאנחו בני ישראל מן העבודה ויזעקו ותעל שוועתם אל האלוהים מן העבודה\" - מות מלך מצרים וצעקת בני ישראל (שמות ב':כ\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"כִּי טוֹב הוּא וַתִּצְפְּנֵהוּ\"\nשאלה: מה עשתה האם כשלא יכלה עוד להצפינו?", "a": "\"ותקח לו תיבת גומא ותחמרה בחמר ובזפת ותשם בה את הילד ותשם בסוף על שפת היאור\" - הכינה תיבת גומא והניחה אותה בין צמחי הסוף ביאור (שמות ב':ג')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"הַאֵלֵךְ וְקָרָאתִי לָךְ אִשָּׁה מֵינֶקֶת\"\nשאלה: מה ענתה בת פרעה, ואת מי הלכה האחות לקרוא בפועל?", "a": "בת פרעה ענתה \"לכי\". האחות הלכה וקראה את אם הילד עצמה - כך הוחזר משה לאמו שהניקה אותו בשכר (שמות ב':ח'-ט')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּפֶן כֹּה וָכֹה וַיַּרְא כִּי אֵין אִישׁ\"\nשאלה: מה ראה משה שגרם לו לפעול כפי שמתואר כאן?", "a": "\"וירא איש מצרי מכה איש עברי מאחיו\" - ראה מצרי שמכה איש עברי (שמות ב':י\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיְבַקֵּשׁ לַהֲרֹג אֶת מֹשֶׁה\"\nשאלה: לאן ברח משה, ומה עשה מיד כשהגיע לשם?", "a": "\"ויברח משה מפני פרעה וישב בארץ מדין וישב על הבאר\" - ברח לארץ מדיין וישב על הבאר (שמות ב':ט\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְאַיּוֹ לָמָּה זֶּה עֲזַבְתֶּן אֶת הָאִישׁ\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה קרה בעקבות ההזמנה?", "a": "רעואל (כהן מדיין) אמר לבנותיו. בעקבות ההזמנה, \"ויואל משה לשבת את האיש ויתן את ציפורה בתו למשה\" - משה התיישב אצלו ונשא את ציפורה (שמות ב':כ'-כ\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַתִּשְׁלַח אֶת אֲמָתָהּ וַתִּקָּחֶהָ\"\nשאלה: מי שלחה, ומה המשמעות הכפולה של המילה \"אמתה\"?", "a": "בת פרעה שלחה. המילה \"אמתה\" יכולה להתפרש כ\"שפחתה\" (שלחה את שפחתה להביא את התיבה) או כ\"ידה\" (שלחה את ידה). שני הפירושים מתאימים (שמות ב':ה')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיּוֹאֶל מֹשֶׁה לָשֶׁבֶת אֶת הָאִישׁ\"\nשאלה: מה פירוש המילה \"ויואל\" כאן, ומי הוא \"האיש\" המוזכר?", "a": "\"ויואל\" - הואיל/הסכים. \"האיש\" הוא רעואל (יתרו) כהן מדיין. משה הסכים להישאר אצלו, ורעואל נתן לו את ציפורה בתו לאשה (שמות ב':כ\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"שְׁנֵי אֲנָשִׁים עִבְרִים נִצִּים\"\nשאלה: את מי פנה משה מבין השניים - ומה בדיוק אמר לו?", "a": "משה פנה \"לָרָשָׁע\" ואמר \"למה תכה רעך\" - הוא זיהה מי מהשניים הוא התוקף ופנה אליו ישירות (שמות ב':י\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיֵּלֶךְ אִישׁ מִבֵּית לֵוִי וַיִּקַּח אֶת בַּת לֵוִי\"\nשאלה: הפסוק לא מזכיר שמות - מי הם \"איש מבית לוי\" ו\"בת לוי\"?", "a": "\"איש מבית לוי\" הוא עמרם, ו\"בת לוי\" היא יוכבד - הורי משה. שמותיהם לא נזכרים בפרק ב' אלא רק מאוחר יותר (שמות ו':כ')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיַּרְא אֱלֹהִים אֶת בְּנֵי יִשְׂרָאֵל וַיֵּדַע אֱלֹהִים\"\nשאלה: מה מיוחד בביטוי \"וידע אלוהים\" - הפסוק לא מסיים את המשפט. מה \"ידע\" אלוהים?", "a": "הפסוק נגמר ב\"וידע אלוהים\" בלי מושא - בלי לומר מה בדיוק ידע. זהו הפסוק האחרון בפרק ב', והוא מרמז שאלוהים ידע את סבלם / הכיר בצרתם, גם בלי שזה נאמר במפורש (שמות ב':כ\"ה)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַתֵּתַצַּב אֲחֹתוֹ מֵרָחֹק\"\nשאלה: מה רצתה לדעת, ומה הציעה כשהזדמנה לה ההזדמנות?", "a": "רצתה \"לדעה מה ייעשה לו\". כשבת פרעה מצאה את התינוק, הציעה להביא מינקת עברייה - ובכך החזירה את משה לאמו (שמות ב':ד', ז')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"תֵּבַת גֹּמֶא וַתַּחְמְרָה\"\nשאלה: באילו שני חומרים נחמרה (נאטמה) התיבה?", "a": "בחמר ובזפת - \"ותחמרה בחמר ובזפת\" (שמות ב':ג')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"גֵּר הָיִיתִי בְּאֶרֶץ נׇכְרִיָּה\"\nשאלה: למי קרא משה את השם המבוסס על הביטוי הזה, ומה השם?", "a": "לבנו - קרא לו גרשום, כי היה גר בארץ נכריה (מדיין) (שמות ב':כ\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"שְׁלֹשָׁה יְרָחִים\"\nשאלה: מה קרה מיד אחרי שלא יכלה עוד להצפינו שלושה ירחים? תאר את כל הפעולות שהאם עשתה בפסוק אחד.", "a": "\"ותקח לו תיבת גומא ותחמרה בחמר ובזפת ותשם בה את הילד ותשם בסוף על שפת היאור\" - ארבע פעולות ברצף: לקחה תיבה, חמרה אותה, שמה את הילד בתוכה, והניחה בסוף על שפת היאור (שמות ב':ג')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַתִּדְלֶנָה וַתְּמַלֶּאנָה\"\nשאלה: מי דלו ומילאו, ומה מילאו? ומה קרה מיד אחר כך שגרם למשה לפעול?", "a": "שבע בנות כהן מדיין דלו ומילאו את הרהטים (שוקתות המים) להשקות צאן אביהן. מיד אחר כך \"ויבואו הרועים ויגרשום\" - רועים באו וגירשו אותן, ומשה קם והושיען (שמות ב':ט\"ז-י\"ז)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"בַּיּוֹם הַשֵּׁנִי\"\nשאלה: מה קרה \"ביום השני\" - מה ראה משה, ומה המשמעות של התזמון?", "a": "ביום השני (יום אחרי שהרג את המצרי), משה יצא וראה \"שני אנשים עברים ניצים\" - שני עברים רבים זה עם זה. התזמון חשוב כי מראה שהריגת המצרי היתה יום קודם, ודבר ההריגה כבר נודע (שמות ב':י\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"הַסְּנֶה בֹּעֵר בָּאֵשׁ וְהַסְּנֶה אֵינֶנּוּ אֻכָּל\"\nשאלה: מה אמר משה לעצמו כשראה את המראה הזה?", "a": "\"אסורה נא ואראה את המראה הגדול הזה - מדוע לא יבער הסנה\" (שמות ג':ג')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ\"\nשאלה: מה אמר ה' מיד אחרי הציווי על הנעליים - כיצד הזדהה?", "a": "\"אנכי אלוהי אביך אלוהי אברהם אלוהי יצחק ואלוהי יעקב\" - ומשה הסתיר פניו כי ירא מהביט אל האלוהים (שמות ג':ו')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"מִי אָנֹכִי כִּי אֵלֵךְ אֶל פַּרְעֹה\"\nשאלה: מי אמר את הדברים האלה, ומה היתה התשובה שקיבל?", "a": "משה אמר לאלוהים. התשובה: \"כי אהיה עמך וזה לך האות כי אנכי שלחתיך - בהוציאך את העם ממצרים תעבדון את האלוהים על ההר הזה\" (שמות ג':י\"א-י\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיֹּאמֶר אֱלֹהִים אֶל מֹשֶׁה אֶהְיֶה אֲשֶׁר אֶהְיֶה\"\nשאלה: מה שאל משה שגרם לתשובה הזו?", "a": "\"הנה אנכי בא אל בני ישראל ואמרתי להם אלוהי אבותיכם שלחני אליכם ואמרו לי מה שמו - מה אומר אליהם\" (שמות ג':י\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וָאֵרֵד לְהַצִּילוֹ מִיַּד מִצְרַיִם\"\nשאלה: השלם - מה אמר ה' ממש לפני הדברים האלה, שמסביר למה הוא יורד?", "a": "\"ראה ראיתי את עוני עמי אשר במצרים ואת צעקתם שמעתי מפני נוגשיו כי ידעתי את מכאוביו\" - ה' מתאר שראה את הסבל ושמע את הצעקה (שמות ג':ז')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְשָׁאֲלָה אִשָּׁה מִשְּׁכֶנְתָּהּ וּמִגָּרַת בֵּיתָהּ\"\nשאלה: מי אומר את הדברים האלה ולמי? ומה מבטיח ה' שיקרה לפני כן שיאפשר זאת?", "a": "ה' אומר למשה. ה' מבטיח: \"ונתתי את חן העם הזה בעיני מצרים והיה כי תלכון לא תלכו ריקם\" - שהמצרים ייתנו להם מרצון (שמות ג':כ\"א-כ\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיֹּאמֶר מֹשֶׁה מֹשֶׁה וַיֹּאמֶר הִנֵּנִי\"\nשאלה: מאיפה נשמעה הקריאה הזו, ומה היה הציווי הראשון שקיבל משה מיד אחרי?", "a": "הקריאה נשמעה מתוך הסנה. הציווי הראשון: \"אל תקרב הלום, של נעליך מעל רגליך כי המקום אשר אתה עומד עליו אדמת קודש הוא\" (שמות ג':ד'-ה')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"לֹא יִתֵּן אֶתְכֶם מֶלֶךְ מִצְרַיִם\"\nשאלה: מה אומר ה' שיעשה כדי להתגבר על סירוב פרעה המתואר כאן?", "a": "\"ושלחתי את ידי והכיתי את מצרים בכל נפלאותי אשר אעשה בקרבו ואחרי כן ישלח אתכם\" - ה' מבטיח שיכה את מצרים בנפלאות ואז ישלח אותם (שמות ג':י\"ט-כ')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיַּרְא יְהוָה כִּי סָר לִרְאוֹת\"\nשאלה: מה עשה ה' רק אחרי שראה שמשה \"סר לראות\"? מה מלמד אותנו הדבר?", "a": "רק אחרי שה' ראה שמשה סר (נטה מדרכו) לראות את הסנה - אז קרא אליו מתוך הסנה \"משה משה\". כלומר, הקריאה לא באה מאליה - ה' חיכה שמשה יגלה עניין ויתקרב בעצמו (שמות ג':ד')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיַּסְתֵּר מֹשֶׁה פָּנָיו\"\nשאלה: מה אמר ה' למשה ממש לפני שמשה הסתיר פניו?", "a": "\"אנכי אלוהי אביך אלוהי אברהם אלוהי יצחק ואלוהי יעקב\" - ה' הזדהה כאלוהי האבות, ובתגובה משה הסתיר פניו מיראה (שמות ג':ו')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ\"\nשאלה: כמה עמים מונה הפסוק שגרים בארץ המובטחת? מנה אותם.", "a": "שישה עמים: הכנעני, החיתי, האמורי, הפריזי, החווי והיבוסי (שמות ג':ח')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְשָׁאֲלָה אִשָּׁה מִשְּׁכֶנְתָּהּ וּמִגָּרַת בֵּיתָהּ\"\nשאלה: מה הם שלושת סוגי הדברים שבני ישראל צריכים לשאול מהמצרים?", "a": "\"כלי כסף וכלי זהב ושמלות\" - שלושה סוגים: כלי כסף, כלי זהב ובגדים (שמות ג':כ\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"זֶה שְּׁמִי לְעֹלָם וְזֶה זִכְרִי לְדֹר דֹּר\"\nשאלה: איזה שם נאמר ממש לפני הביטוי הזה? ולמי ה' מצווה את משה לדבר?", "a": "\"ה' אלוהי אבותיכם אלוהי אברהם אלוהי יצחק ואלוהי יעקב שלחני אליכם\" - ה' מצווה את משה לומר זאת לבני ישראל (שמות ג':ט\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"רֹעֶה אֶת צֹאן יִתְרוֹ חֹתְנוֹ\"\nשאלה: לאן הנהיג משה את הצאן, ומה ראה שם?", "a": "\"אחר המדבר ויבוא אל הר האלוהים חורבה\" - שם ראה את הסנה בוער באש ואינו אוכל (שמות ג':א'-ב')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"אֶהְיֶה אֲשֶׁר אֶהְיֶה\"\nשאלה: מה שאל משה שגרם לתשובה הזו?", "a": "\"ואמרו לי מה שמו - מה אומר אליהם\" - משה שאל מה שם האלוהים כדי לומר לבני ישראל (שמות ג':י\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"פָּקֹד פָּקַדְתִּי אֶתְכֶם\"\nשאלה: למי ציווה ה' את משה לומר את הדברים האלה?", "a": "לזקני ישראל - \"לך ואספת את זקני ישראל ואמרת אליהם... פקוד פקדתי אתכם ואת העשוי לכם במצרים\" (שמות ג':ט\"ז)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"בְּלַבַּת אֵשׁ\"\nשאלה: מי נראה אל משה \"בלבת אש מתוך הסנה\"? (שימו לב: לא ה' עצמו!)", "a": "\"וירא מלאך ה' אליו בלבת אש מתוך הסנה\" - מלאך ה', לא ה' ישירות. רק אחר כך, כשמשה סר לראות, קרא אליו \"אלוהים\" מתוך הסנה (שמות ג':ב', ד')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"דֶּרֶךְ שְׁלֹשֶׁת יָמִים\"\nשאלה: מה ביקשו משה ואהרן מפרעה - מה הבקשה הספציפית שה' ציווה אותם לומר?", "a": "\"נלכה נא דרך שלושת ימים במדבר ונזבחה לה' אלוהינו\" - לא ביקשו שחרור מוחלט אלא יציאה לשלושה ימים לזבוח לה' במדבר (שמות ג':י\"ח)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְשַׂמְתֶּם עַל בְּנֵיכֶם\"\nשאלה: מה ציווה ה' לעשות עם כלי הכסף, כלי הזהב והשמלות שישאלו מהמצרים?", "a": "\"ושמתם על בניכם ועל בנותיכם ונצלתם את מצרים\" - לשים אותם על בניהם ובנותיהם, וכך \"ניצלו\" (רוקנו/שללו) את מצרים (שמות ג':כ\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"כִּי כְבַד פֶּה וּכְבַד לָשׁוֹן אָנֹכִי\"\nשאלה: מה ענה ה' ישירות על הטענה הזו?", "a": "\"מי שם פה לאדם או מי ישום אלם או חרש או פקח או עור - הלא אנכי ה'\" (שמות ד':י\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּחַר אַף יְהוָה בְּמֹשֶׁה\"\nשאלה: מה אמר משה שגרם לחרון אף ה' שמתואר כאן?", "a": "משה אמר \"שלח נא ביד תשלח\" - כלומר ביקש שה' ישלח מישהו אחר במקומו. זה היה הסירוב האחרון שגרם לה' לכעוס (שמות ד':י\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּפְגְּשֵׁהוּ יְהוָה וַיְבַקֵּשׁ הֲמִיתוֹ\"\nשאלה: מי הצילה את משה מהאירוע המתואר כאן, ומה עשתה?", "a": "ציפורה לקחה צור וכרתה את ערלת בנה ונגעה לרגליו ואמרה \"כי חתן דמים אתה לי\" (שמות ד':כ\"ה)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַאֲנִי אֲחַזֵּק אֶת לִבּוֹ וְלֹא יְשַׁלַּח אֶת הָעָם\"\nשאלה: על מי מדובר בפסוק, ומה ציווה ה' את משה לומר לאותו אדם מיד אחרי האזהרה הזו?", "a": "על פרעה. ה' ציווה לומר לו: \"כה אמר ה' בני בכורי ישראל... שלח את בני ויעבדני ותמאן לשלחו - הנה אנכי הורג את בנך בכורך\" (שמות ד':כ\"א-כ\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיַּאֲמֵן הָעָם וַיִּשְׁמְעוּ כִּי פָקַד\"\nשאלה: מה קרה לפני הרגע המתואר כאן - מה גרם לעם להאמין?", "a": "משה ואהרן אספו את כל זקני בני ישראל, אהרן דיבר את כל דברי ה', ומשה עשה את האותות לעיני העם (שמות ד':כ\"ט-ל')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְהֵן לֹא יַאֲמִינוּ לִי\"\nשאלה: מה נתן ה' למשה כדי לפתור את החשש המתואר כאן? תאר את האות הראשון.", "a": "ה' שאל \"מה זה בידך\" ומשה ענה \"מטה\". ה' ציווה \"השליכהו ארצה\" - והמטה הפך לנחש. כשאחז בזנבו חזר להיות מטה. זה היה האות הראשון מתוך שלושה (שמות ד':ב'-ה')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"הִבְאַשְׁתֶּם אֶת רֵיחֵנוּ בְּעֵינֵי פַרְעֹה\"\nשאלה: מי אמר/אמרו את הדברים האלה ולמי, ומה קרה שגרם לתלונה הזו?", "a": "שוטרי בני ישראל אמרו למשה ואהרן. פרעה הכביד את העבודה - הפסיק לתת תבן ודרש את אותה מכסת לבנים, בעקבות בקשת משה ואהרן לשלח את העם (שמות ה':כ\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"לָמָה הֲרֵעֹתָה לָעָם הַזֶּה\"\nשאלה: מי אמר את הדברים האלה ולמי? ומה היתה הטענה המלאה שהוסיף?", "a": "משה אמר לה'. הטענה: \"ומאז באתי אל פרעה לדבר בשמך הרע לעם הזה והצל לא הצלת את עמך\" - מאז שבא לפרעה המצב רק הורע (שמות ה':כ\"ב-כ\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיָּנָס מֹשֶׁה מִפָּנָיו\"\nשאלה: ממה בדיוק נס משה, ומה ציווה ה' אותו לעשות מיד אחר כך?", "a": "משה נס מפני הנחש - המטה שהשליך ארצה הפך לנחש ומשה ברח ממנו. ה' ציווה: \"שלח ידך ואחוז בזנבו\" - ומשה אחז בזנבו והנחש חזר להיות מטה (שמות ד':ג'-ד')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"הוּא יִהְיֶה לְּךָ לְפֶה\"\nשאלה: על מי מדובר - מי יהיה \"לפה\" ומי \"לאלוהים\"? מה הכוונה?", "a": "אהרן יהיה \"לפה\" למשה (ידבר בשמו), ומשה יהיה \"לאלוהים\" לאהרן (יצווה עליו). כלומר, משה מעביר את דבר ה' לאהרן, ואהרן מדבר אל העם ואל פרעה (שמות ד':ט\"ז)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"מֵתוּ כׇּל הָאֲנָשִׁים הַמְבַקְשִׁים\"\nשאלה: מי אמר את הדברים האלה ולמי? ומה עשה הנמען בעקבות זאת?", "a": "ה' אמר למשה במדיין. בעקבות זאת, משה לקח את אשתו ואת בניו, הרכיבם על החמור ושב ארצה מצרים עם מטה האלוהים בידו (שמות ד':י\"ט-כ')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"נִצָּבִים לִקְרָאתָם בְּצֵאתָם מֵאֵת פַּרְעֹה\"\nשאלה: מי \"פגעו\" את משה ואהרן, ומה אמרו להם?", "a": "שוטרי בני ישראל פגעו בהם בצאתם מאת פרעה ואמרו: \"ירא ה' עליכם וישפוט אשר הבאשתם את ריחנו בעיני פרעה... לתת חרב בידם להרגנו\" (שמות ה':כ'-כ\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"נִרְפִּים אַתֶּם נִרְפִּים\"\nשאלה: מי אמר את הדברים האלה ולמי? ומה הוסיף מיד אחר כך?", "a": "פרעה אמר לשוטרי בני ישראל. הוסיף: \"ועתה לכו עבדו ותבן לא יינתן לכם ותוכן לבנים תתנו\" - דרש עבודה מלאה בלי תבן (שמות ה':י\"ז-י\"ח)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"שְׁלַח נָא בְּיַד תִּשְׁלָח\"\nשאלה: מי אמר את זה ולמי? ומה היתה התגובה?", "a": "משה אמר לה' - ביקש שישלח מישהו אחר. התגובה: \"ויחר אף ה' במשה\" - ה' כעס ומינה את אהרן כדובר (שמות ד':י\"ג-י\"ד)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּשַּׁק לוֹ\"\nשאלה: מי נשק למי? והיכן התרחשה הפגישה?", "a": "אהרן נשק למשה כשפגשו. הפגישה היתה בהר האלוהים, אחרי שה' אמר לאהרן \"לך לקראת משה המדברה\" (שמות ד':כ\"ז)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"חֲתַן דָּמִים אַתָּה לִי\"\nשאלה: מי אמרה את הדברים האלה, ומה עשתה ממש לפני כן?", "a": "ציפורה אמרה זאת. ממש לפני כן \"ותקח צפורה צור ותכרות את ערלת בנה ותגע לרגליו\" - מלה את בנה כדי להציל את משה (שמות ד':כ\"ה)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"מְצֹרַעַת כַּשָּׁלֶג\"\nשאלה: תאר את האות השני שנתן ה' למשה - מה עשה ומה קרה?", "a": "ה' אמר \"הבא נא ידך בחיקך\", משה הכניס ידו לחיקו, והוציאה \"מצורעת כשלג\". אז ה' אמר \"השב ידך אל חיקך\" והוציאה - \"והנה שבה כבשרו\" (שמות ד':ו'-ז')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וְהָיוּ לְדָם בַּיַּבָּשֶׁת\"\nשאלה: זהו האות השלישי - מה בדיוק צריך לעשות? ומתי ישתמש בו?", "a": "\"ולקחת ממימי היאור ושפכת היבשה והיו המים אשר תקח מן היאור והיו לדם ביבשת\" - לקחת מים מהיאור ולשפוך ביבשה, והם יהפכו לדם. ישתמש בו רק \"אם לא יאמינו גם לשני האותות האלה\" - כגיבוי אחרון (שמות ד':ח'-ט')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיֹּאמֶר יִתְרוֹ לְמֹשֶׁה לֵךְ לְשָׁלוֹם\"\nשאלה: מה אמר משה ליתרו כסיבה לעזיבתו? (שימו לב: לא גילה את השליחות האמיתית!)", "a": "\"אלכה נא ואשובה אל אחי אשר במצרים ואראה העודם חיים\" - משה אמר ליתרו שרוצה לחזור לראות אם אחיו עוד חיים, לא חשף את השליחות האלוהית (שמות ד':י\"ח)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּרֶף מִמֶּנּוּ\"\nשאלה: מי \"הרף\" ממי? ומה אמרה ציפורה מיד אחרי ש\"וירף ממנו\"?", "a": "ה' הרף ממשה (הפסיק לבקש להמיתו). ציפורה אמרה \"חתן דמים למולות\" - הפעם השנייה שאמרה \"חתן דמים\", ונוספה המילה \"למולות\" שמפרשת שהביטוי נאמר בגלל המילה (שמות ד':כ\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיִּקְּדוּ וַיִּשְׁתַּחֲוּוּ\"\nשאלה: מי \"קדו וישתחוו\" ומתי? מה גרם לתגובה הזו?", "a": "העם קד והשתחווה אחרי שהאמין ושמע \"כי פקד ה' את בני ישראל וכי ראה את עניים\" - זה קרה אחרי שאהרן דיבר את כל דברי ה' ומשה עשה את האותות לעיני העם (שמות ד':ל'-ל\"א)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"מִי יְהוָה אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ\"\nשאלה: מי אמר את הדברים האלה, ומה היתה הדרישה שהוצגה לו לפני כן?", "a": "פרעה אמר זאת למשה ואהרן. הדרישה שהוצגה: \"כה אמר ה' אלוהי ישראל שלח את עמי ויחוגו לי במדבר\" (שמות ה':א'-ב')", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"וַיַּשְׁלֵךְ אַהֲרֹן אֶת מַטֵּהוּ וַיְהִי לְתַנִּין\"\nשאלה: מה קרה מיד אחרי המעשה המתואר כאן?", "a": "גם חרטומי מצרים השליכו איש מטהו ויהיו לתנינים, אך \"ויבלע מטה אהרן את מטותם\" (שמות ז':י\"ב)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"אֶצְבַּע אֱלֹהִים הִוא\"\nשאלה: מי אמר את הדברים האלה ולמי? מה קרה שגרם להם לומר זאת?", "a": "החרטומים אמרו לפרעה. הם ניסו לחקות את מכת הכינים בלהטיהם ולא יכלו - וזו היתה המכה הראשונה שלא הצליחו לשחזר (שמות ח':ט\"ו)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"חָטָאתִי הַפָּעַם יְהוָה הַצַּדִּיק\"\nשאלה: מי אמר את הדברים האלה, ואיזו מכה גרמה לו להודות כך?", "a": "פרעה אמר זאת. מכת הברד גרמה לו - ברד ואש מתלקחת בתוכו, כבד מאוד אשר לא היה כמוהו בכל ארץ מצרים (שמות ט':כ\"ז)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"לֹא רָאוּ אִישׁ אֶת אָחִיו\"\nשאלה: איזו מכה מתוארת כאן, ומה היה המצב אצל בני ישראל באותו זמן?", "a": "מכת החושך. \"ולכל בני ישראל היה אור במושבותם\" - ההפך הגמור ממה שהמצרים חוו (שמות י':כ\"ב-כ\"ג)", "source": "text_questions/shemot.md", "type": "text"}, {"q": "טקסט: \"נְתַתִּיךָ אֱלֹהִים לְפַרְעֹה\"\nשאלה: מי אומר את הדברים האלה ולמי? מה היו הגילא
