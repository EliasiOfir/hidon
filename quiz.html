לל?", "a": "40 בנים ו-30 נכדים — כולם רוכבים על 70 עיירים. שפט 8 שנים, נקבר בפרעתון בארץ אפרים בהר העמלקי", "source": "09 shibboleth and small judges", "type": "story"}, {"q": "1. ⭐⭐ \"בֵּיתְךָ בָּאֵשׁ נִשְׂרֹף עָלֶיךָ\"", "a": "**מי אמר:** אנשי אפרים\n**למי:** יפתח\n**הקשר:** כעס אפרים שלא הוזמן ללחום בעמון (שופטים י\"ב:א)", "source": "09 shibboleth and small judges", "type": "story"}, {"q": "2. ⭐⭐⭐ \"אֱמָר-נָא שִׁבֹּלֶת\"", "a": "**מי אמר:** אנשי גלעד\n**למי:** פליטי אפרים שניסו לעבור את הירדן\n**הקשר:** מבחן הגייה לאיתור אפרתים במעברות הירדן (שופטים י\"ב:ו)", "source": "09 shibboleth and small judges", "type": "story"}, {"q": "1. ⭐⭐ 42,000 מגלעד נפלו בפרשת שיבולת. נכון או לא נכון?", "a": "**לא נכון.** 42,000 נפלו מ**אפרים** — \"ויפול בעת ההיא מאפרים ארבעים ושניים אלף\" (שופטים י\"ב:ו).", "source": "09 shibboleth and small judges", "type": "story"}, {"q": "2. ⭐⭐ אבצן היה מן הגלעד. נכון או לא נכון?", "a": "**לא נכון.** אבצן היה **מבית לחם** (שופטים י\"ב:ח).", "source": "09 shibboleth and small judges", "type": "story"}, {"q": "3. ⭐⭐⭐ לעבדון היו 30 בנים ו-40 נכדים. נכון או לא נכון?", "a": "**לא נכון.** לעבדון היו **40 בנים ו-30 נכדים** — \"ארבעים בנים ושלשים בני בנים\" (שופטים י\"ב:יד).", "source": "09 shibboleth and small judges", "type": "story"}, {"q": "1. ⭐⭐ שופט מבית לחם, 30 בנים ו-30 בנות, שיגר את הבנות ל\"חוץ\" והביא בנות לבניו", "a": "**הדמות:** אבצן\n**ספר:** שופטים\n**הקשר:** פרק י\"ב — שופט קטן לאחר יפתח", "source": "09 shibboleth and small judges", "type": "story"}, {"q": "2. ⭐⭐ פרעתוני, 40 בנים ו-30 נכדים על 70 עיירים, שפט 8 שנים", "a": "**הדמות:** עבדון בן הלל\n**ספר:** שופטים\n**הקשר:** פרק י\"ב — שופט קטן, נקבר בפרעתון", "source": "09 shibboleth and small judges", "type": "story"}, {"q": "1. כמה שנים נתן ה' את ישראל ביד פלשתים לפני לידת שמשון?", "a": "ארבעים שנה", "source": "10 birth of shimshon", "type": "story"}, {"q": "2. מה הוראות המלאך לאשת מנוח?", "a": "לא לשתות יין ושכר, לא לאכול טמא — כי הבן יהיה נזיר אלהים מהבטן. ומורה לא יעלה על ראשו", "source": "10 birth of shimshon", "type": "story"}, {"q": "3. מה ביקש מנוח מה' לאחר ששמע מאשתו?", "a": "\"יבוא-נא עוד אלינו ויורנו מה-נעשה לנער היולד\" — בקשה שהמלאך ישוב ויסביר כיצד לגדל את הילד", "source": "10 birth of shimshon", "type": "story"}, {"q": "4. מה שאל מנוח את המלאך, ומה ענה?", "a": "שאל: \"מי שמך?\" — המלאך ענה: \"למה זה תשאל לשמי והוא פלאי\"", "source": "10 birth of shimshon", "type": "story"}, {"q": "5. כיצד נגלה לבסוף שהמבקר היה מלאך?", "a": "כשמנוח הקריב — \"ויעל מלאך ה' בלהב המזבח השמימה\". מנוח ואשתו ראו ונפלו על פניהם. לאחר מכן לא נגלה שוב — \"ואז ידע מנוח כי מלאך ה' הוא\"", "source": "10 birth of shimshon", "type": "story"}, {"q": "6. מה ההבדל בתגובת מנוח ואשתו לאחר שהמלאך עלה בלהב?", "a": "מנוח נבהל: \"מות נמות כי אלהים ראינו\". אשתו הרגיעה בהיגיון: \"לו חפץ ה' להמיתנו — לא לקח עולה ומנחה ולא הראנו כזאת\"", "source": "10 birth of shimshon", "type": "story"}, {"q": "7. מה פירוש \"יחל להושיע\" לגבי שמשון?", "a": "שמשון לא יושיע את ישראל לחלוטין — הוא \"יחל\" (יתחיל) את תהליך ההצלה מפלשתים. ההצלה השלמה תבוא בהמשך", "source": "10 birth of shimshon", "type": "story"}, {"q": "1. ⭐⭐ \"מוֹת נָמוּת כִּי אֱלֹהִים רָאִינוּ\"", "a": "**מי אמר:** מנוח\n**למי:** אשתו\n**הקשר:** לאחר שראו את המלאך עולה בלהב המזבח ונפלו על פניהם (שופטים י\"ג:כב)", "source": "10 birth of shimshon", "type": "story"}, {"q": "2. ⭐⭐⭐ \"לוּ חָפֵץ ה' לַהֲמִיתֵנוּ לֹא-לָקַח מִיָּדֵנוּ עֹלָה וּמִנְחָה\"", "a": "**מי אמר:** אשת מנוח\n**למי:** מנוח בעלה\n**הקשר:** הרגעתו לאחר שנבהל ואמר \"מות נמות\" — הסברה שאם ה' רצה להמיתם, לא היה מקבל קרבנם ומגלה להם כזאת (שופטים י\"ג:כג)", "source": "10 birth of shimshon", "type": "story"}, {"q": "3. ⭐⭐ \"לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי וְהוּא פֶלִאי\"", "a": "**מי אמר:** מלאך ה'\n**למי:** מנוח\n**הקשר:** מנוח שאל לשם המלאך כדי לכבדו — המלאך השיב שאין לגלות שמו (שופטים י\"ג:יח)", "source": "10 birth of shimshon", "type": "story"}, {"q": "1. ⭐⭐ המלאך נגלה לראשונה למנוח. נכון או לא נכון?", "a": "**לא נכון.** המלאך נגלה תחילה **לאשת מנוח** — \"וירא מלאך ה' אל האשה\" (שופטים י\"ג:ג). גם בהתגלות השנייה הוא בא אל האישה בשדה, לא אל מנוח.", "source": "10 birth of shimshon", "type": "story"}, {"q": "2. ⭐⭐ מנוח ידע שהמבקר הוא מלאך ה' מלכתחילה. נכון או לא נכון?", "a": "**לא נכון.** \"כי לא-ידע מנוח כי מלאך ה' הוא\" — הוא הבין רק לאחר שהמלאך עלה בלהב: \"ואז ידע מנוח כי מלאך ה' הוא\" (שופטים י\"ג:טז,כא).", "source": "10 birth of shimshon", "type": "story"}, {"q": "3. ⭐ שמשון היה משבט אפרים. נכון או לא נכון?", "a": "**לא נכון.** שמשון היה משבט **דן**: \"ויהי איש אחד מצרעה ממשפחת **הדני**\" (שופטים י\"ג:ב).", "source": "10 birth of shimshon", "type": "story"}, {"q": "1. ⭐⭐ עקרה, קיבלה בשורה לפני בעלה, חכמה ורגועה, לא ידעה שמו", "a": "**הדמות:** אשת מנוח (שמה לא נזכר)\n**ספר:** שופטים\n**הקשר:** פרק י\"ג — אמו של שמשון", "source": "10 birth of shimshon", "type": "story"}, {"q": "2. ⭐⭐⭐ עלה בלהב המזבח, שמו \"פלאי\", הוראותיו: לא יין, לא טמא, לא מורה על הראש", "a": "**הדמות:** מלאך ה'\n**ספר:** שופטים\n**הקשר:** פרק י\"ג — מבשר לידת שמשון", "source": "10 birth of shimshon", "type": "story"}, {"q": "1. מה הייתה חידת שמשון, ומה הייתה פשרה האמיתית?", "a": "החידה: \"מהאוכל יצא מאכל ומעז יצא מתוק\" — הפשר: דבש שמצא בגווית הארי שהרג. הרעים פתרו רק לאחר שלחצו על אשתו", "source": "11 shimshon", "type": "story"}, {"q": "2. מה עשה שמשון עם 300 השועלים?", "a": "קשר זנב לזנב עם לפיד ביניהם, הדליק וישלח בשדות פלשתים — שרף קמות, גדישים, כרמי זית", "source": "11 shimshon", "type": "story"}, {"q": "3. מה הייתה ההצעה של סרני פלשתים לדלילה, ומדוע?", "a": "אלף ומאה כסף מכל סרן — סך הכל 5,500 כסף (חמישה סרנים) — אם תגלה את סוד כוחו של שמשון כדי שיוכלו לכבשו", "source": "11 shimshon", "type": "story"}, {"q": "4. כמה פעמים ריימה דלילה את שמשון לפני שגילה את סוד כוחו?", "a": "שלוש פעמים: פעם ביתדות רטובות, פעם ביריעות ואורג, פעם בעבות חדשים — בכל פעם ניצל", "source": "11 shimshon", "type": "story"}, {"q": "5. מה גרם לשמשון לגלות את סוד כוחו לבסוף?", "a": "\"ויהי כי-הציקתו בדבריה כל-הימים ותאלצהו ותקצר נפשו למות\" — דלילה הפציצה עד שלא יכול עוד", "source": "11 shimshon", "type": "story"}, {"q": "6. מה קרה כשעיני שמשון נוקרו, ומה אירע לאחר מכן?", "a": "פלשתים אסרוהו בנחושתיים והוא טחן בבית האסורים. שערו החל לצמוח שוב", "source": "11 shimshon", "type": "story"}, {"q": "7. מה הייתה תפילת שמשון לפני שדחף את העמודים?", "a": "\"זכרני נא וחזקני נא אך הפעם הזה — ואנקמה נקם אחת משתי עיני מפלשתים\"", "source": "11 shimshon", "type": "story"}, {"q": "8. מדוע מוות שמשון חשוב יותר מחייו מבחינת ישראל?", "a": "\"ויהיו המתים אשר המית במותו רבים מאשר המית בחייו\" — הפיל את כל הסרנים ו-3,000 פלשתים במכה אחת", "source": "11 shimshon", "type": "story"}, {"q": "1. ⭐⭐ \"מֵהָאֹכֵל יָצָא מַאֲכָל וּמֵעַז יָצָא מָתוֹק\"", "a": "**מי אמר:** שמשון\n**למי:** 30 מרעיו בחתונה בתמנה\n**הקשר:** חידת הארי והדבש — שמשון מאתגר אותם להימור (שופטים י\"ד:יד)", "source": "11 shimshon", "type": "story"}, {"q": "2. ⭐⭐⭐ \"לוּלֵא חֲרַשְׁתֶּם בְּעֶגְלָתִי לֹא מְצָאתֶם חִידָתִי\"", "a": "**מי אמר:** שמשון\n**למי:** 30 הרעים\n**הקשר:** כשפתרו את החידה ביום השביעי — שמשון מגלה שאשתו גילתה (שופטים י\"ד:יח)", "source": "11 shimshon", "type": "story"}, {"q": "3. ⭐⭐⭐ \"זָכְרֵנִי נָא וְחַזְּקֵנִי נָא אַךְ הַפַּעַם הַזֶּה\"", "a": "**מי אמר:** שמשון\n**למי:** ה' (תפילה)\n**הקשר:** בבית דגון, עם ידיו על שני עמודי התווך, לפני שדחף (שופטים ט\"ז:כח)", "source": "11 shimshon", "type": "story"}, {"q": "4. ⭐⭐ \"תָּמֹת נַפְשִׁי עִם-פְּלִשְׁתִּים\"", "a": "**מי אמר:** שמשון\n**למי:** (בקול / לעצמו)\n**הקשר:** רגע לפני שדחף את עמודי הבית — ביטוי לנכונותו למות עם אויביו (שופטים ט\"ז:ל)", "source": "11 shimshon", "type": "story"}, {"q": "1. ⭐⭐ שמשון הרג 1,000 פלשתים בחרב. נכון או לא נכון?", "a": "**לא נכון.** שמשון הרג 1,000 איש ב**לסת חמור**: \"ויפול בה אלף איש\" (שופטים ט\"ו:טו-טז).", "source": "11 shimshon", "type": "story"}, {"q": "2. ⭐⭐ דלילה הייתה אשת שמשון הרשמית. נכון או לא נכון?", "a": "**לא נכון.** הפסוק אומר \"ויאהב אישה בנחל שורק ושמה דלילה\" — אך לא קראה לה אשתו. היא לא נישאה לו רשמית לפי הכתוב.", "source": "11 shimshon", "type": "story"}, {"q": "3. ⭐⭐⭐ כ-3,000 פלשתים נפלו כשמשון הפיל את הבית. נכון או לא נכון?", "a": "**חלקית נכון.** \"כשלשת אלפים איש ואישה\" היו על הגג בלבד — בתוך הבית היו גם הסרנים ואנשים נוספים. סך הכל \"המתים אשר המית במותו רבים מאשר המית בחייו\" (שופטים ט\"ז:כז-ל).", "source": "11 shimshon", "type": "story"}, {"q": "1. ⭐ מנחל שורק, מקבלת כסף מסרנים, מגלחת שבע מחלפות, גורמת לנפילת שמשון", "a": "**הדמות:** דלילה\n**ספר:** שופטים\n**הקשר:** פרק ט\"ז — הנשים הפלישתיות בחיי שמשון", "source": "11 shimshon", "type": "story"}, {"q": "2. ⭐⭐⭐ פלשתית, בכתה שבעת ימים, גילתה חידה, ניתנה לרעהו לאחר כן", "a": "**הדמות:** אשת שמשון התמנאית\n**ספר:** שופטים\n**הקשר:** פרק י\"ד — חתונת שמשון הראשונה", "source": "11 shimshon", "type": "story"}, {"q": "1. ⭐ מי מבין השופטים הביא את תקופת השקט הארוכה ביותר, ומי את הקצרה ביותר? (אהוד, אבימלך)", "a": "אהוד בן גרא הביא את תקופת השקט הארוכה ביותר - 80 שנה (ג':30), ואילו אבימלך שלט רק 3 שנים (ט':22) - התקופה הקצרה ביותר, שגם לא היתה תקופת שקט אמיתית אלא שלטון אלים שנגמר בחורבן.", "source": "cross chapter", "type": "story"}, {"q": "2. ⭐⭐ גם עתניאל וגם גדעון מתוארים כמי ש\"רוח ה'\" היתה עליהם. מה ההבדל באופן שבו כל אחד מהם פעל לאחר מכן? (עתניאל, גדעון)", "a": "על עתניאל נאמר \"ותהי עליו רוח ה' וישפוט את ישראל ויצא למלחמה\" (ג':10) - פעל מיד בביטחון. גדעון לעומתו, גם לאחר שרוח ה' לבשה אותו, ביקש אותות נוספים (מבחן גיזת הצמר פעמיים, ו':36-40), מה שמעיד על ספקנות גדולה יותר.", "source": "cross chapter", "type": "story"}, {"q": "3. ⭐⭐ כיצד שונה אופן הריגת המנהיג האויב בסיפור אהוד לעומת סיפור דבורה? (אהוד, דבורה)", "a": "בשני המקרים המנהיג נהרג בתחבולה ובמקום סגור: אהוד רצח את עגלון בעליית המקרה בחרב קצרה שהסתיר (ג':21), ויעל הרגה את סיסרא באוהלה ביתד אוהל ומקבת כשהוא ישן (ד':21). בשני המקרים הקורבן הרגיש בטוח ולא חשד.", "source": "cross chapter", "type": "story"}, {"q": "4. ⭐⭐ השוו בין גדעון לאבימלך ביחסם לשלטון ומלוכה. (גדעון, אבימלך)", "a": "גדעון סירב למלוך כשהעם ביקש ממנו ואמר \"לא אמשול אני בכם... ה' ימשול בכם\" (ח':23). לעומתו, בנו אבימלך חתר לשלטון בכוח, שכנע את בעלי שכם לתמוך בו ורצח 70 מאחיו כדי לבסס את מלכותו (ט':1-5). האב סירב למלוכה והבן רצח למענה.", "source": "cross chapter", "type": "story"}, {"q": "5. ⭐⭐⭐ המחזור החוזר (חטא, עונש, זעקה, ישועה, שקט) מופיע אצל עתניאל, אהוד, דבורה וגדעון. באיזה סיפור המחזור נשבר לראשונה, ומדוע? (גדעון, אבימלך)", "a": "המחזור נשבר בסיפור אבימלך (פרק ט'). אין חטא של עבודה זרה שמוביל לשעבוד חיצוני, אין זעקה לה', ואין שופט מושיע. במקום זאת, מדובר במלחמה פנימית הנובעת מרצח האחים ושחיתות השלטון. הסיבה: אבימלך עצמו הוא תוצאה של כישלון פנימי - האפוד שעשה גדעון שהיה \"למוקש\" (ח':27).", "source": "cross chapter", "type": "story"}, {"q": "6. ⭐⭐⭐ בכל מחזור בני ישראל \"זועקים\" אל ה'. בסיפור גדעון, מה שונה בתגובת ה' לזעקה לעומת עתניאל ואהוד? (עתניאל, אהוד, גדעון)", "a": "אצל עתניאל ואהוד, מיד לאחר הזעקה ה' מקים מושיע (ג':9, ג':15). אצל גדעון, לפני שה' שולח מושיע, הוא שולח קודם נביא להוכיח את העם (ו':8-10) - זו הפעם הראשונה שיש שלב ביניים של תוכחה לפני הישועה.", "source": "cross chapter", "type": "story"}, {"q": "7. ⭐⭐⭐ השוו את משך השעבוד בארבעת המחזורים: עתניאל, אהוד, דבורה וגדעון. מהו הקשר בין אורך השעבוד לאופי הישועה? (עתניאל, אהוד, דבורה, גדעון)", "a": "עתניאל: 8 שנים, אהוד: 18 שנה, דבורה: 20 שנה, גדעון: 7 שנים. דווקא אצל גדעון, שהשעבוד הכי קצר (7 שנים), הישועה הכי מורכבת ודרמטית - עם סינון לוחמים, אותות, ותכנית מלחמה יצירתית. אצל עתניאל, שגם הוא סבל שעבוד קצר יחסית (8 שנים), הישועה מתוארת בקיצור רב.", "source": "cross chapter", "type": "story"}, {"q": "8. ⭐⭐ שלוש נשים פועלות בצורה מכרעת בספר שופטים: דבורה, יעל, והאישה מתבץ. מהו הקו המשותף ביניהן? (דבורה, אבימלך)", "a": "שלושתן משנות את מהלך ההיסטוריה באופן מכריע: דבורה מנהיגה את המלחמה ומנבאת את תוצאתה, יעל הורגת את סיסרא שר הצבא (ד':21), והאישה מתבץ הורגת את אבימלך (ט':53). דבורה אף ניבאה שהכבוד ילך לאישה: \"כי ביד אישה ימכור ה' את סיסרא\" (ד':9), ואכן גם מות אבימלך בא ביד אישה.", "source": "cross chapter", "type": "story"}, {"q": "9. ⭐⭐ גם יעל וגם האישה מתבץ הרגו מנהיג צבאי. מה ההבדל בין שני המקרים? (דבורה, אבימלך)", "a": "יעל פעלה בתחבולה מתוכננת - הזמינה את סיסרא לאוהלה, האכילה אותו, כיסתה אותו, המתינה שיירדם, ואז תקעה יתד ברקתו (ד':17-21). האישה מתבץ פעלה בספונטניות - השליכה פלח רכב מראש המגדל על אבימלך (ט':53). יעל זכתה לשבח בשירת דבורה (\"תבורך מנשים\"), ואילו האישה מתבץ אינה נקראת בשמה כלל.", "source": "cross chapter", "type": "story"}, {"q": "10. ⭐⭐ מהו המשותף לשמגר, אהוד וגדעון בנוגע לכלי הנשק שבהם ניצחו? (שמגר, אהוד, גדעון)", "a": "שלושתם ניצחו בכלים לא שגרתיים: שמגר השתמש במלמד בקר - כלי חקלאי (ג':31), אהוד בחרב קצרה בגודל גומד שהכין במיוחד (ג':16), וגדעון ב-300 לוחמים עם שופרות, כדים ולפידים ללא כלי נשק רגילים (ז':16-20). הכתוב מדגיש שהישועה באה לא בכוח צבאי מסורתי אלא בעזרת ה'.", "source": "cross chapter", "type": "story"}, {"q": "11. ⭐⭐⭐ בסיפורי דבורה ואבימלך, אש ומים משחקים תפקיד מכריע. כיצד? (דבורה, אבימלך)", "a": "בסיפור דבורה, נחל קישון גרף את צבא סיסרא ורכבו (\"נחל קישון גרפם\", ה':21) - המים הביסו את האויב. בסיפור אבימלך, אש היתה הכלי המרכזי - אבימלך שרף את מגדל שכם והרג כאלף איש ואישה (ט':49), ואש מופיעה גם במשל יותם כנבואה: \"תצא אש מן האטד ותאכל את ארזי הלבנון\" (ט':15).", "source": "cross chapter", "type": "story"}, {"q": "12. ⭐⭐ המספר 40 חוזר שוב ושוב בסיפורי השופטים. אצל אילו שופטים שקטה הארץ 40 שנה, ומי חורג ממספר זה? (עתניאל, אהוד, דבורה, גדעון)", "a": "הארץ שקטה 40 שנה אחרי עתניאל (ג':11), 40 שנה אחרי דבורה (ה':31), ו-40 שנה אחרי גדעון (ח':28). החריג הוא אהוד - אחריו שקטה הארץ 80 שנה (ג':30), כפול מהרגיל. 40 הוא מספר סמלי בתנ\"ך המייצג תקופה שלמה.", "source": "cross chapter", "type": "story"}, {"q": "13. ⭐⭐ השוו את מספר ההרוגים בקרבות השונים: שמגר, אהוד, דבורה וגדעון. (שמגר, אהוד, דבורה, גדעון)", "a": "שמגר הרג 600 פלשתים (ג':31), במלחמת אהוד נהרגו כ-10,000 מואבים (ג':29), בקרב דבורה צבא סיסרא כולו הושמד (ד':16), ובמלחמת גדעון נהרגו 120,000 מדינים (ח':10). המספרים הולכים וגדלים, כשהשיא הוא אצל גדעון שדווקא לחם עם המספר הקטן ביותר של לוחמים (300).", "source": "cross chapter", "type": "story"}, {"q": "14. ⭐⭐ שבט אפרים מופיע בכמה סיפורים. מה תפקידו בסיפורי דבורה וגדעון? (דבורה, גדעון)", "a": "בסיפור דבורה, אפרים נמנה בין השבטים שהשתתפו במלחמה (ה':14), ודבורה עצמה ישבה בהר אפרים (ד':5). בסיפור גדעון, אנשי אפרים כעסו שלא נקראו מלכתחילה למלחמה, וגדעון היה צריך להרגיעם בדיפלומטיה: \"הלא טוב עוללות אפרים מבציר אביעזר\" (ח':2). שבט אפרים מציג גאווה ורגישות לכבודו.", "source": "cross chapter", "type": "story"}, {"q": "15. ⭐⭐⭐ סיפור שמגר מוזכר בשירת דבורה. מה הקשר בין שני הסיפורים? (שמגר, דבורה)", "a": "בשירת דבורה נאמר: \"בימי שמגר בן ענת, בימי יעל, חדלו אורחות\" (ה':6). שמגר מוזכר כציון זמן של תקופה קשה שבה הדרכים לא היו בטוחות. הכוונה שלמרות שהושיע את ישראל מהפלשתים, המצב הכללי בארץ היה קשה, ורק לאחר ניצחון דבורה וברק חזר השקט האמיתי.", "source": "cross chapter", "type": "story"}, {"q": "16. ⭐⭐ בסיפור אהוד ובסיפור גדעון, השופט משתמש בתחבולה ובהפתעה. מהן נקודות הדמיון? (אהוד, גדעון)", "a": "שניהם הסתמכו על אלמנט ההפתעה: אהוד הסתיר חרב בצד הלא צפוי (ירך ימינו, כי היה שמאלי) והפתיע את עגלון בחדרו (ג':21). גדעון תקף בלילה עם שופרות, כדים ולפידים - יצר בלבול ופאניקה שגרמו למדינים להילחם זה בזה (ז':22). בשני המקרים, הפתעה ותחבולה גברו על כוח צבאי עדיף.", "source": "cross chapter", "type": "story"}, {"q": "17. ⭐⭐⭐ גם גדעון וגם משל יותם עוסקים בשאלת המלוכה. כיצד שני הסיפורים יחד מציגים עמדה לגבי מלוכה בישראל? (גדעון, אבימלך)", "a": "גדעון מציג את האידיאל: סירוב למלוכה אנושית והכרזה ש\"ה' ימשול בכם\" (ח':23). משל יותם מציג את ההפך: כשמנהיגים ראויים (הזית, התאנה, הגפן) מסרבים למלוך, השלטון נופל בידי האטד - החסר ערך והמסוכן (ט':8-15). יחד, הסיפורים מלמדים שמלוכה שנלקחת בכוח (אבימלך) מובילה לחורבן.", "source": "cross chapter", "type": "story"}, {"q": "18. ⭐⭐ מה המשותף לתיאור עתניאל ואהוד כ\"מושיע\", ומדוע אבימלך לא מקבל תואר זה? (עתניאל, אהוד, אבימלך)", "a": "עתניאל ואהוד שניהם מכונים \"מושיע\" שה' הקים לישראל (ג':9, ג':15) - הם פעלו בשליחות אלוהית כדי להציל את העם משעבוד חיצוני. אבימלך לעומתם לא הוקם על ידי ה', לא הושיע משעבוד, ולא נקרא מושיע - הוא פעל למען עצמו, השתלט בכוח, וגרם לחורבן פנימי. הוא מייצג את ההפך מהשופט המושיע.", "source": "cross chapter", "type": "story"}, {"q": "19. ✨⭐⭐⭐ בפרק י' ה' דוחה תחילה את תחינת ישראל — כיצד זה שונה מהמחזורים הקודמים, ומה גרם לשינוי? (תולע ויאיר, עתניאל, אהוד)", "a": "בכל המחזורים הקודמים (עתניאל, אהוד, דבורה, גדעון) — ישראל זועקים וה' מיד מקים מושיע. בפרק י' ה' מגיב בתוכחה: \"לא אוסיף להושיע אתכם — לכו וזעקו לאלהים שבחרתם\". השינוי נגרם כי ישראל חטאו לשבעה עמים שונים (לא רק לבעל) וה' כבר הציל אותם פעמים רבות. רק לאחר שהסירו בפועל את האלהים הזרים — \"ותקצר נפשו בעמל ישראל\".", "source": "cross chapter", "type": "story"}, {"q": "20. ✨⭐⭐ שבט אפרים כועס על שלא הוזמן למלחמה גם בפרק ח' (גדעון) וגם בפרק י\"ב (יפתח). מה ההבדל בתוצאה? (גדעון, שיבולת ושופטים קטנים)", "a": "בפרק ח' גדעון פייס את אפרים בדיפלומטיה: \"הלא טוב עוללות אפרים מבציר אביעזר?\" — ו\"ותרפה רוחם ממנו\" (ח':ב-ג). בפרק י\"ב יפתח לא פייס — ניהל מלחמה באפרים. גלעד לכד מעברות הירדן, 42,000 אפרים נפלו בפרשת שיבולת. אפרים מגיב לאותו עלבון אבל יפתח אינו גדעון.", "source": "cross chapter", "type": "story"}, {"q": "21. ✨⭐⭐⭐ ה' מוכר את ישראל בידי פלשתים בשני מקרים בספר שופטים: בפרק י\"ג ובפרק ג'. מה ההבדל? (שמגר, לידת שמשון)", "a": "בפרק ג' פלשתים מוזכרים בקצרה יחד עם מואב ועמון, ושמגר בן ענת מכה בהם 600. בפרק י\"ג השעבוד לפלשתים הוא **40 שנה** — הארוך ביותר בספר, ואין זעקה מפורשת ואין שופט מוקים על ידי ה'. במקום זאת — ה' שולח מלאך לבשר על לידת שמשון. תגובה שקטה ומיוחדת.", "source": "cross chapter", "type": "story"}, {"q": "22. ✨⭐⭐ גם יפתח וגם גדעון קיבלו תפקיד ממנהיגים שלא האמינו בהם בתחילה. השוו. (גדעון, יפתח)", "a": "גדעון: המלאך מתגלה אליו עצמו, הוא מהסס (\"במה אושיע את ישראל... אני הקטן\"). ישראל לא גירשו אותו. יפתח: גורש על ידי אחיו, זקני גלעד פנו אליו בעת מצוקה. יפתח ניזכר לדחייה: \"הלא אתם שנאתם אותי?\" ודרש ערבות שיהיה לראש. גדעון הוסס מבחינה עצמית; יפתח — בגלל דחייה חברתית.", "source": "cross chapter", "type": "story"}, {"q": "23. ✨⭐⭐ שמשון ויפתח שניהם \"נדרו\" / ביצעו פעולות הקשורות לבנות. כיצד? (יפתח, שמשון)", "a": "יפתח: נדר \"היוצא מדלתי ביתי\" — בתו יצאה, ובכה: \"אהה בתי הכאתיני\". נהיה חוק — בנות ישראל מתאבלות לה 4 ימים בשנה. שמשון: התחתן עם אישה פלישתית מתמנה — \"אותה קח לי כי היא ישרה בעיני\". בשני המקרים קשר לאישה גרם לו לסבל גדול: יפתח איבד בתו; שמשון — אשתו הבגידה בו.", "source": "cross chapter", "type": "story"}, {"q": "24. ✨⭐⭐⭐ שמשון ממחנה דן — מה הקשר בין שבט דן לגבולות הספר? (שמגר, לידת שמשון)", "a": "שמגר בן ענת — שמו ומוצאו אינם ישראליים בוודאות, ופועל בגבול פלשת. שמשון — מצרעה, שבט דן — באזור גבול פלשת-ישראל. שני הגיבורים בספר שופטים שנלחמו בפלשתים הם שניהם מן הגבול ובמגע ישיר עם פלשתים. זה לא מקרי — פלשת היא האיום הקבוע בדרום-מערב.", "source": "cross chapter", "type": "story"}, {"q": "25. ✨⭐⭐⭐ ה' \"סר מעל\" שמשון בפרק ט\"ז. האם ה' אי פעם \"עזב\" שופט אחר? השוו לגדעון. (גדעון, שמשון)", "a": "\"ולא ידע כי ה' סר מעליו\" — ייחודי לשמשון. אצל גדעון רוח ה' \"לבשה\" אותו (ו':לד) ולא מוזכרת עזיבה. אצל שאול (בספר שמואל) ה' עוזב אחרי חטא. שמשון ייחודי: ה' לא \"מוכיח\" אותו מראש — רוחו פועמת בו, ואז נעצרת בשל בגידת הנזירות. הביטוי \"לא ידע\" מדגיש את שקיעתו.", "source": "cross chapter", "type": "story"}, {"q": "26. ✨⭐⭐ ארבע נשים מרכזיות בפרקים י'-ט\"ז: בת יפתח, אשת שמשון, דלילה, אמו של שמשון. מה מיוחד בכל אחת? (יפתח, שמשון, לידת שמשון)", "a": "אמו של שמשון: קיבלה בשורת המלאך, חכמה יותר ממנוח בעלה, שמה לא נזכר. בת יפתח: שמה לא נזכר, מקבלת גזרה בהכנעה, מבקשת שני חודשים לבכות — גורמת לחוק לאומי. אשת שמשון (תמנאית): לחצה על שמשון לגלות החידה, ניתנה לרעו, שמה לא נזכר. דלילה: שמה נזכר, מקבלת כסף, מגלחת שיערו — גורמת ליפלו.", "source": "cross chapter", "type": "story"}, {"q": "27. ✨⭐⭐⭐ שמשון נזיר — כיצד שלושת מצוות הנזיר מתפרשות לאורך פרקים י\"ג-ט\"ז? (לידת שמשון, שמשון)", "a": "שלושת מצוות הנזיר: (א) לא יין — שמשון נאמר שאמו לא שתתה, אך לגבי שמשון עצמו לא מוזכר שתייה או איסור במפורש בחייו. (ב) לא טמא — שמשון נוגע בגווית האריה (\"ויקח מדבש ביד\") — נגיעה בנבלה, פגיעה בנזירות. (ג) לא מורה — שמשון גילה לדלילה: \"מורה לא עלה על ראשי\". כשגולח — \"ויסר כוחו מעליו\".", "source": "cross chapter", "type": "story"}, {"q": "1. ⭐⭐ עתניאל, אהוד, דבורה, גדעון - מי מהשופטים לא סירב/היסס כשנקרא לשפוט?", "a": "**התשובה:** עתניאל - הכתוב מתאר רק \"ותהי עליו רוח ה' וישפוט את ישראל\" (ג':י') ללא כל סירוב. אהוד פעל בעצמו ללא היסוס, אבל דבורה לא סירבה. הפריט השונה הוא **גדעון** שהיסס וביקש אותות (גיזת הצמר), וגם **ברק** שסירב ללכת בלי דבורה. עתניאל מתואר בצורה הכי פשוטה ללא היסוס.", "source": "cross chapter", "type": "story"}, {"q": "2. ⭐ כושן רשעתיים, עגלון, יבין, סיסרא, אבימלך - מי מהם אינו אויב חיצוני של ישראל?", "a": "**התשובה:** אבימלך - הוא בן גדעון (ירובעל), ישראלי שרצח את אחיו והשתלט על שכם. כל האחרים הם מלכים או מצביאים זרים: כושן רשעתיים מארם, עגלון ממואב, יבין מחצור, וסיסרא שר צבא יבין.", "source": "cross chapter", "type": "story"}, {"q": "3. ⭐⭐ יתד ומקבת, חרב בת גומד, מלמד בקר, שופרות כדים ולפידים, חרב רגילה - איזה כלי נשק לא שימש שופט?", "a": "**התשובה:** חרב רגילה - אף שופט לא מתואר כנלחם בחרב רגילה. יעל השתמשה ביתד ומקבת (ד':כ\"א), אהוד בחרב בת גומד מיוחדת (ג':ט\"ז), שמגר במלמד בקר (ג':ל\"א), וגדעון בשופרות כדים ולפידים (ז':ט\"ז). כל הכלים חריגים ולא שגרתיים.", "source": "cross chapter", "type": "story"}], "text": [{"q": "טקסט: \"וַיָּקֶם יְהוָה מוֹשִׁיעַ לִבְנֵי יִשְׂרָאֵל\"\nשאלה: מה קרה לפני הדברים המתוארים כאן - מה גרם לה' להקים מושיע?", "a": "בני ישראל זעקו אל ה' לאחר ששכחו את ה' אלוהיהם, עבדו בעלים ואשרות, ונמכרו ביד כושן רשעתיים מלך ארם נהריים למשך שמונה שנים", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּמְכְּרֵם בְּיַד כּוּשַׁן רִשְׁעָתַיִם\"\nשאלה: כמה שנים נמשך השעבוד למלך המוזכר בפסוק?", "a": "שמונה שנים", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַתְּהִי עָלָיו רוּחַ יְהוָה וַיִּשְׁפֹּט\"\nשאלה: על מי מדבר הפסוק, ונגד מי יצא למלחמה?", "a": "הפסוק מדבר על עתניאל בן קנז, ויצא למלחמה נגד כושן רשעתיים מלך ארם נהריים", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַתִּשְׁקֹט הָאָרֶץ אַרְבָּעִים שָׁנָה וַיָּמָת\"\nשאלה: מה קרה אחרי האירועים המתוארים כאן - מה עשו בני ישראל?", "a": "בני ישראל הוסיפו לעשות הרע בעיני ה', וה' חיזק את עגלון מלך מואב עליהם", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁכְּחוּ אֶת יְהוָה אֱלֹהֵיהֶם וַיַּעַבְדוּ\"\nשאלה: השלם - הפסוק מזכיר שני סוגי עבודה זרה. מהם?", "a": "הבעלים והאשרות", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיָּקֶם יְהוָה מוֹשִׁיעַ לִבְנֵי יִשְׂרָאֵל\"\nשאלה: מי הוא ה\"מושיע\" שה' הקים, ומה היחס המשפחתי שלו לדמות מפורסמת אחרת?", "a": "עתניאל בן קנז, אחי כלב הקטן ממנו. כלב בן יפונה הקניזי היה מרגל שבט יהודה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּתֵּן יְהוָה בְּיָדוֹ אֶת כּוּשַׁן\"\nשאלה: מה קרה לפני שה' נתן את האויב בידו - מהו הדבר שחל על האיש המנצח?", "a": "רוח ה' היתה עליו (על עתניאל בן קנז) - \"וַתְּהִי עָלָיו רוּחַ יְהוָה וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל וַיֵּצֵא לַמִּלְחָמָה\"", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּחַר אַף יְהוָה בְּיִשְׂרָאֵל וַיִּמְכְּרֵם\"\nשאלה: מה קרה אחרי שישראל נגאלו מהשעבוד המתואר כאן - כמה שנים שקטה הארץ, ומה קרה אחר כך?", "a": "הארץ שקטה ארבעים שנה עד מות עתניאל בן קנז. אחר כך הוסיפו בני ישראל לעשות הרע בעיני ה', וה' חיזק את עגלון מלך מואב עליהם", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּמְכְּרֵם בְּיַד כּוּשַׁן רִשְׁעָתַיִם מֶלֶךְ\"\nשאלה: מי \"מכר\" את בני ישראל, ומהי המשמעות של פעולת ה\"מכירה\" כאן?", "a": "ה' הוא שמכר אותם - \"וַיִּחַר אַף יְהוָה בְּיִשְׂרָאֵל וַיִּמְכְּרֵם\". המשמעות היא הסגרתם ביד האויב כעונש, לא מכירה ממשית. הנושא (ה') לא מופיע בקטע המצוטט אלא בתחילת הפסוק", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל וַיֵּצֵא לַמִּלְחָמָה\"\nשאלה: שתי פעולות מתוארות כאן - מה קרה בין השיפוט ליציאה למלחמה? מה חל על האיש הזה שאיפשר לו את שתי הפעולות?", "a": "רוח ה' היתה עליו - \"וַתְּהִי עָלָיו רוּחַ יְהוָה\" - זוהי הפעולה שקדמה לשיפוט ולמלחמה. רוח ה' היא שנתנה לעתניאל את הכוח לשפוט ולצאת למלחמה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ\"\nשאלה: על מי נאמר תיאור זה, ומה המשמעות המדויקת של \"הקטן ממנו\" - מי קטן ממי?", "a": "נאמר על עתניאל בן קנז. \"הקטן ממנו\" - עתניאל הוא הצעיר מכלב. יש עמימות בפסוק: \"הקטן\" מתייחס לעתניאל ולא לכלב, כלומר עתניאל היה אחיו הצעיר של כלב", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַתָּעָז יָדוֹ עַל כּוּשַׁן רִשְׁעָתָיִם\"\nשאלה: מהי המילה הנדירה \"וַתָּעָז\" - מה פירושה, ומי הוא בעל ה\"יד\" שאינו מוזכר בקטע?", "a": "\"ותעז\" - התחזקה, גברה. בעל היד הוא עתניאל בן קנז. הפסוק המלא אומר \"וַיִּתֵּן יְהוָה בְּיָדוֹ אֶת כּוּשַׁן רִשְׁעָתַיִם מֶלֶךְ אֲרָם וַתָּעָז יָדוֹ\" - ידו של עתניאל גברה על כושן", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁכְּחוּ אֶת יְהוָה אֱלֹהֵיהֶם\"\nשאלה: מה המילה הייחודית בפסוק הזה שלא מופיעה בפתיחת סיפורי שופטים אחרים?", "a": "המילה \"וַיִּשְׁכְּחוּ\" - שכחו את ה'. בסיפורי שופטים אחרים נאמר רק \"ויעשו הרע\" או \"ויוסיפו לעשות הרע\", אך רק בסיפור עתניאל נאמר במפורש שישראל \"שכחו\" את ה'", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיּוֹשִׁיעֵם אֵת עָתְנִיאֵל בֶּן קְנַז\"\nשאלה: מהו התואר שניתן לעתניאל בתחילת הפסוק הזה - כיצד מכונה פעולת ההצלה?", "a": "עתניאל מכונה \"מוֹשִׁיעַ\" - \"וַיָּקֶם יְהוָה מוֹשִׁיעַ לִבְנֵי יִשְׂרָאֵל וַיּוֹשִׁיעֵם\". התואר \"מושיע\" ניתן לו לפני שמו, ומדגיש שה' הוא שהקים אותו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיַּעַבְדוּ בְנֵי יִשְׂרָאֵל אֶת כּוּשַׁן\"\nשאלה: כמה שנים נמשך השעבוד הזה, ומאיזה אזור גיאוגרפי בא המשעבד?", "a": "שמונה שנים. כושן רשעתיים היה מלך ארם נהריים - אזור בין שני הנהרות (פרת וחידקל) במסופוטמיה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיֵּצֵא לַמִּלְחָמָה וַיִּתֵּן יְהוָה בְּיָדוֹ\"\nשאלה: שתי פעולות מוזכרות לפני היציאה למלחמה - מה חל עליו ומה עשה לישראל?", "a": "רוח ה' היתה עליו, והוא שפט את ישראל: \"וַתְּהִי עָלָיו רוּחַ יְהוָה וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל וַיֵּצֵא לַמִּלְחָמָה\"", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"דְּבַר אֱלֹהִים לִי אֵלֶיךָ\"\nשאלה: מי אמר את הדברים האלה, למי, ומה עשה מיד אחרי?", "a": "אהוד בן גרא אמר זאת לעגלון מלך מואב. עגלון קם מעל הכיסא, ואז אהוד שלח את יד שמאלו, לקח את החרב מירך ימינו ותקעה בבטנו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיַּעַשׂ לוֹ אֵהוּד חֶרֶב וְלָהּ\"\nשאלה: מדוע חגר אהוד את החרב דווקא על ירך ימינו ולא על ירך שמאלו כמקובל?", "a": "כי אהוד היה איטר יד ימינו (שמאלי), ולכן שלף את החרב ביד שמאלו מירך ימין. זה גם עזר להסתיר את החרב, כי לא בדקו בצד ימין", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"אַךְ מֵסִיךְ הוּא אֶת רַגְלָיו\"\nשאלה: מי אמר את הדברים האלה, על מי, ומה באמת קרה?", "a": "עבדי עגלון אמרו זאת על עגלון. הם חשבו שהמלך עושה את צרכיו בחדר המקרה כי מצאו את דלתות העלייה נעולות, אבל באמת אהוד כבר רצח אותו ונמלט", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"רִדְפוּ אַחֲרַי כִּי נָתַן יְהוָה\"\nשאלה: מי אמר את הדברים האלה, והיכן אמר אותם?", "a": "אהוד בן גרא, לאחר שתקע בשופר בהר אפרים וגייס את בני ישראל למלחמה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיֶּאֱסֹף אֵלָיו אֶת בְּנֵי עַמּוֹן\"\nשאלה: על מי מדבר הפסוק, ומהי \"עיר התמרים\"?", "a": "על עגלון מלך מואב. \"עיר התמרים\" היא יריחו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"דְּבַר סֵתֶר לִי אֵלֶיךָ הַמֶּלֶךְ\"\nשאלה: מי אמר \"דבר סתר לי אליך\", מהיכן חזר כשאמר זאת, ומה היה ה\"דבר\" באמת?", "a": "אהוד בן גרא אמר זאת לעגלון מלך מואב. הוא חזר מן הפסילים אשר את הגלגל. ה\"דבר\" היה למעשה דקירת החרב בבטנו של עגלון", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּסְגֹּר הַחֵלֶב בְּעַד הַלַּהַב\"\nשאלה: מה מתואר בפסוק הזה, ומדוע נבלעה החרב לגמרי?", "a": "מתואר רגע הרצח של עגלון מלך מואב בידי אהוד. החרב נבלעה כי עגלון היה \"איש בריא מאוד\" (שמן מאוד) - החלב (השומן) סגר בעד הלהב", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיָּחִילוּ עַד בּוֹשׁ וְהִנֵּה אֵינֶנּוּ\"\nשאלה: מי הם ה\"חיכו עד בוש\", ומה גילו כשפתחו?", "a": "עבדי עגלון חיכו עד שהתביישו (התעכבו זמן רב). כשפתחו את הדלתות במפתח, גילו את אדוניהם (עגלון) נופל ארצה מת", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּלְכְּדוּ אֶת מַעְבְּרוֹת הַיַּרְדֵּן לְמוֹאָב\"\nשאלה: מי לכד את מעברות הירדן, ומה היתה המטרה האסטרטגית?", "a": "בני ישראל בהנהגת אהוד לכדו את מעברות הירדן. המטרה היתה למנוע מהמואבים לברוח חזרה לארצם או לקבל תגבורת. כתוצאה הכו כעשרת אלפים איש ולא נמלט איש", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַתִּכָּנַע מוֹאָב בַּיּוֹם הַהוּא תַּחַת\"\nשאלה: כמה שנים שקטה הארץ, וכמה זה ביחס לתקופת השקט שאחרי עתניאל?", "a": "שמונים (80) שנה - כפול מארבעים השנה של תקופת עתניאל. זוהי תקופת השקט הארוכה ביותר בספר שופטים", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְהוּא שָׁב מִן הַפְּסִילִים\"\nשאלה: מי הוא \"הוא\" בפסוק, מהם \"הפסילים\", ומה אמר מיד כשחזר?", "a": "\"הוא\" הוא אהוד בן גרא. \"הפסילים\" הם ציון דרך ליד הגלגל (פסלים או אבני גבול). כשחזר אמר לעגלון \"דְּבַר סֵתֶר לִי אֵלֶיךָ הַמֶּלֶךְ\" - ואז נכנס אליו לבדו לעליית המקרה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיָּבֹא גַם הַנִּצָּב אַחַר הַלַּהַב\"\nשאלה: מהו \"הנצב\" המוזכר כאן, ומה המילה הנדירה שמסיימת את הפסוק הזה?", "a": "\"הנצב\" הוא ידית החרב (הקת) שנכנסה גם היא אחרי הלהב לתוך בטנו של עגלון. המילה הנדירה בסוף הפסוק היא \"הַפַּרְשְׁדֹנָה\" - מילה שמשמעותה שנויה במחלוקת (יש אומרים צואה, יש אומרים המרפסת/יציאה)", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיַּחְגֹּר אוֹתָהּ מִתַּחַת לְמַדָּיו\"\nשאלה: מהי \"אותה\" שנחגרה, ומה הפרט הגופני הייחודי של האיש שמסביר מדוע חגר דווקא על ירך ימינו?", "a": "\"אותה\" - החרב בעלת שני פיות שהכין אהוד. אהוד היה \"אִישׁ אִטֵּר יַד יְמִינוֹ\" (שמאלי), ולכן חגר על ירך ימין - כדי לשלוף ביד שמאל. זה גם הסתיר את החרב כי בודקים בצד שמאל", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְעֶגְלוֹן אִישׁ בָּרִיא מְאֹד\"\nשאלה: מתי מוזכר התיאור הפיזי הזה, ומדוע הוא קריטי להבנת מה שקורה בהמשך הסיפור?", "a": "התיאור מופיע בפסוק י\"ז כשאהוד מגיש את המנחה. הוא קריטי כי הוא מסביר מדוע החרב נבלעה בבטנו ולא נשלפה - \"וַיִּסְגֹּר הַחֵלֶב בְּעַד הַלַּהַב\" - השומן סגר על הלהב. בלי פרט זה לא מובן איך נעלמה חרב שלמה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּתְקַע בַּשּׁוֹפָר בְּהַר אֶפְרָיִם\"\nשאלה: מה הפעולה הראשונה שעשה אהוד מיד אחרי שתקע בשופר - מה אמר לבני ישראל?", "a": "אמר \"רִדְפוּ אַחֲרַי כִּי נָתַן יְהוָה אֶת אֹיְבֵיכֶם אֶת מוֹאָב בְּיֶדְכֶם\". ומיד אחר כך ירדו אחריו ולכדו את מעברות הירדן למואב", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"אִישׁ אִטֵּר יַד יְמִינוֹ\"\nשאלה: על מי נאמר תיאור זה, ומאיזה שבט היה?", "a": "על אהוד בן גרא. הוא היה \"בֶּן הַיְמִינִי\" - משבט בנימין. האירוניה: בן-ימיני שהוא איטר יד ימינו (שמאלי)", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁלַח אֶת יַד שְׂמֹאלוֹ\"\nשאלה: מי שלח את יד שמאלו, מה לקח ביד זו, ומהיכן?", "a": "אהוד בן גרא שלח את יד שמאלו, לקח את החרב מעל ירך ימינו ותקעה בבטנו של עגלון מלך מואב", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁלְחוּ בְנֵי יִשְׂרָאֵל בְּיָדוֹ מִנְחָה\"\nשאלה: למי נשלחה המנחה, ומה עשה השליח לאחר שהגיש אותה?", "a": "המנחה נשלחה לעגלון מלך מואב. אהוד הגיש את המנחה, שילח את נושאי המנחה, חזר מן הפסילים אשר את הגלגל, ואמר למלך \"דבר סתר לי אליך\" - ואז רצח אותו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"גֹּמֶד אָרְכָּהּ\"\nשאלה: מהו \"גומד\" - מהי יחידת המידה הזו, ומה נמדד בה כאן?", "a": "גומד הוא יחידת אורך קצרה, כחצי אמה (כ-25 ס\"מ). כאן נמדד אורך החרב שהכין אהוד בן גרא - \"וַיַּעַשׂ לוֹ אֵהוּד חֶרֶב וְלָהּ שְׁנֵי פֵיוֹת גֹּמֶד אָרְכָּהּ\". זוהי מילה נדירה מאוד שמופיעה רק פעם אחת בתנ\"ך (הפקס לגומנון)", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיֹּאמֶר הָס\"\nשאלה: מי אמר \"הס\", למי, ומה קרה מיד אחרי?", "a": "עגלון מלך מואב אמר \"הס\" (שתוק / שקט) לכל העומדים עליו, כשאהוד אמר לו \"דבר סתר לי אליך\". מיד אחרי, כל העומדים יצאו מעליו, ואהוד נכנס אליו לבדו לעליית המקרה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיֵּצֵא הַמִּסְדְּרוֹנָה\"\nשאלה: מי יצא \"המסדרונה\", ומהו \"המסדרון\" - ומה עשה מיד אחרי שיצא?", "a": "אהוד בן גרא יצא דרך המסדרון (פרוזדור/מעבר) לאחר שתקע את החרב בבטן עגלון. מיד אחרי יציאתו סגר את דלתות העלייה בעדו ונעל - \"וַיִּסְגֹּר דַּלְתוֹת הָעֲלִיָּה בַּעֲדוֹ וְנָעָל\"", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"כָּל שָׁמֵן וְכָל אִישׁ חָיִל\"\nשאלה: על מי נאמר תיאור זה, כמה היו, ומה המשמעות של \"כל שמן\"?", "a": "על כעשרת אלפים מואבים שהוכו בידי בני ישראל בהנהגת אהוד. \"כל שמן\" - כולם היו בריאים ושמנים (איתנים גופנית), וגם \"כל איש חיל\" - לוחמים מיומנים. הפרט \"שמן\" מקביל לתיאור עגלון עצמו כ\"איש בריא מאוד\"", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן\"\nשאלה: מה הפועל הייחודי כאן - מדוע נאמר \"ויחזק\" ולא \"וימכרם\" כמו בסיפור עתניאל?", "a": "בסיפור עתניאל נאמר \"וַיִּמְכְּרֵם בְּיַד כּוּשַׁן רִשְׁעָתַיִם\" - ה' מכר את ישראל. בסיפור אהוד נאמר \"וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן\" - ה' חיזק את עגלון על ישראל. הפועל \"חיזק\" שונה ומתאר פעולה אקטיבית של העצמת האויב, לא רק מסירת ישראל לידיו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְאַחֲרָיו הָיָה שַׁמְגַּר בֶּן עֲנָת\"\nשאלה: אחרי מי פעל האיש המוזכר בפסוק? (רמז: \"אחריו\")", "a": "אחרי אהוד בן גרא", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיַּךְ אֶת פְּלִשְׁתִּים בְּמַלְמַד הַבָּקָר\"\nשאלה: מהו \"מלמד הבקר\" המוזכר בפסוק, ומה מיוחד בשימוש בו?", "a": "מלמד הבקר הוא דרבן - כלי חקלאי ארוך ומחודד להנחיית שוורים בחריש. המיוחד הוא ששמגר הכה 600 פלישתים בכלי חקלאי פשוט ולא בנשק מלחמתי", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיּוֹשַׁע גַּם הוּא אֶת יִשְׂרָאֵל\"\nשאלה: למה כתוב \"גם הוא\" - למי הוא מושווה?", "a": "\"גם הוא\" - כמו אהוד בן גרא שקדם לו, גם שמגר הושיע את ישראל", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְאַחֲרָיו הָיָה שַׁמְגַּר בֶּן עֲנָת\"\nשאלה: זהו כל סיפור שמגר. מה חסר כאן בהשוואה לסיפורי שופטים אחרים? (ציינו לפחות שני דברים)", "a": "חסרים: (1) לא מוזכר חטא בני ישראל ושעבוד שקדמו לו, (2) לא נאמר כמה שנים שקטה הארץ אחריו, (3) לא מוזכר שרוח ה' היתה עליו, (4) לא נאמר שהוא \"שפט\" את ישראל", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"בִּימֵי שַׁמְגַּר בֶּן עֲנָת בִּימֵי יָעֵל\"\nשאלה: מאיזה פרק לקוח הפסוק הזה, ומה פירוש \"חדלו אורחות\"?", "a": "מתוך שירת דבורה (שופטים ה', ו'). \"חדלו אורחות\" - הדרכים לא היו בטוחות, אנשים הפסיקו ללכת בדרכים ראשיות מפני הסכנה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיַּךְ אֶת פְּלִשְׁתִּים שֵׁשׁ מֵאוֹת אִישׁ\"\nשאלה: מי הכה את הפלישתים, ומה הכלי שבו השתמש שלא מוזכר בקטע הזה?", "a": "שמגר בן ענת הכה אותם. הכלי הוא \"מלמד הבקר\" (דרבן) - כלי חקלאי להנחיית שוורים בחריש, לא נשק מלחמתי", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיּוֹשַׁע גַּם הוּא אֶת יִשְׂרָאֵל\"\nשאלה: מה חסר בסיפור שמגר שקיים בכל סיפורי השופטים האחרים? ציינו פרט אחד שקשור לסיום הסיפור.", "a": "לא נאמר \"וַתִּשְׁקֹט הָאָרֶץ\" - אין כל אזכור של שנות שקט לאחר הישועה. בכל שופט אחר (עתניאל - 40, אהוד - 80, דבורה - 40, גדעון - 40) מוזכרת תקופת שקט, ואצל שמגר - לא", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְאַחֲרָיו הָיָה שַׁמְגַּר בֶּן עֲנָת\"\nשאלה: המילה \"אחריו\" מתייחסת למישהו שלא מוזכר בפסוק. מי הוא, וכמה שנים שקטה הארץ בתקופתו?", "a": "\"אחריו\" מתייחס לאהוד בן גרא. בתקופת אהוד שקטה הארץ שמונים שנה - תקופת השקט הארוכה ביותר בספר שופטים", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"יֵלְכוּ אֳרָחוֹת עֲקַלְקַלּוֹת\"\nשאלה: מה פירוש \"אֳרָחוֹת עֲקַלְקַלּוֹת\", ומי היא יעל שמוזכרת לצד שמגר?", "a": "\"אורחות עקלקלות\" - דרכים עקומות ומסובכות. הולכי הדרכים נאלצו ללכת בשבילים עוקפים ולא בדרכים הראשיות מפני הסכנה. יעל היא אשת חבר הקיני, שהרגה את סיסרא שר צבא יבין ביתד האוהל", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"שַׁמְגַּר בֶּן עֲנָת\"\nשאלה: מה מיוחד בשם \"ענת\" (אבי שמגר) - למה הוא בעייתי?", "a": "\"ענת\" אינו שם עברי מובהק - זהו שם של אלה כנענית של מלחמה ופריון. העובדה ששם אביו הוא שם אלה כנענית העלתה דיון בקרב הפרשנים לגבי מוצאו של שמגר - האם היה ישראלי או שמא ממוצא זר", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיַּךְ אֶת פְּלִשְׁתִּים שֵׁשׁ מֵאוֹת\"\nשאלה: הנושא חסר בקטע - מי הכה, ומהי המשמעות של המספר ביחס לכלי שבו השתמש?", "a": "שמגר בן ענת הכה. 600 איש זהו מספר עצום, במיוחד בהתחשב בכך שהכלי היה מלמד הבקר (דרבן חקלאי) ולא נשק מלחמה - מה שמדגיש את הגבורה הנדירה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיּוֹשַׁע גַּם הוּא\"\nשאלה: מילת \"גם\" רומזת למישהו שהושיע לפניו. מי הוא, ומה הכלי שלו?", "a": "אהוד בן גרא הושיע לפניו. כלי אהוד היה חרב בעלת שני פיות שעשה לעצמו. לעומתו שמגר השתמש במלמד בקר", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"חָדְלוּ אֳרָחוֹת\"\nשאלה: מתוך איזו שירה לקוח הביטוי, ובשם מי הוא נאמר?", "a": "מתוך שירת דבורה (שופטים ה':ו'). נאמר בהקשר לימי שמגר בן ענת ובימי יעל - \"בִּימֵי שַׁמְגַּר בֶּן עֲנָת בִּימֵי יָעֵל חָדְלוּ אֳרָחוֹת\"", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"אִם תֵּלְכִי עִמִּי וְהָלָכְתִּי\"\nשאלה: מי אמר את הדברים האלה, ולמי?", "a": "ברק בן אבינועם אמר לדבורה הנביאה, כשהיא ציוותה עליו ללכת למלחמה נגד סיסרא בהר תבור", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"כִּי בְיַד אִשָּׁה יִמְכֹּר יְהוָה\"\nשאלה: מי אמרה את הדברים האלה, למי, ומדוע?", "a": "דבורה אמרה לברק, כי סירב ללכת למלחמה בלעדיה. היא ניבאה שהתפארת לא תהיה שלו, כי ביד אישה ימסור ה' את סיסרא (ואכן יעל הרגה את סיסרא)", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַתִּקַּח יָעֵל אֵשֶׁת חֶבֶר אֶת יְתַד\"\nשאלה: מה עשתה האישה המוזכרת בפסוק מיד אחרי הפעולות האלה?", "a": "באה אל סיסרא בלאט (בשקט), תקעה את היתד ברקתו (רקה שלו), והוא מת. הוא היה נרדם באוהלה לאחר שנס מהמלחמה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"סוּרָה אֲדֹנִי סוּרָה אֵלַי אַל תִּירָא\"\nשאלה: מי אמרה את הדברים האלה, למי, ומה עשתה לו בסוף?", "a": "יעל אשת חבר הקיני אמרה לסיסרא כשנס מהמלחמה. היא הכניסה אותו לאוהלה, כיסתה אותו בשמיכה, נתנה לו חלב - ואז כשנרדם תקעה יתד ברקתו והרגה אותו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"בְּעַד הַחַלּוֹן נִשְׁקְפָה וַתְּיַבֵּב אֵם סִיסְרָא\"\nשאלה: מה עשתה הדמות המתוארת כאן, ומה היא לא ידעה?", "a": "אם סיסרא הציצה מהחלון וייבבה (בכתה) - היא תהתה מדוע בנה מאחר לחזור. היא לא ידעה שסיסרא כבר מת, נהרג בידי יעל", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"קוּם כִּי זֶה הַיּוֹם אֲשֶׁר נָתַן\"\nשאלה: מי אמר את הדברים האלה, למי, ומה עשה השומע מיד אחרי?", "a": "דבורה אמרה לברק. מיד אחרי ברק ירד מהר תבור עם עשרת אלפים איש אחריו, וה' הומם את סיסרא ואת כל הרכב", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"הַשְׁקִינִי נָא מְעַט מַיִם כִּי צָמֵאתִי\"\nשאלה: מי ביקש מים, ממי, ומה קיבל במקום מים?", "a": "סיסרא ביקש מים מיעל אשת חבר הקיני. היא נתנה לו חלב במקום מים, ולאחר שנרדם תקעה יתד ברקתו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"עֲמֹד פֶּתַח הָאֹהֶל וְהָיָה אִם\"\nשאלה: מי נתן את ההוראה הזאת, למי, ומה עשתה היא במקום למלא אותה?", "a": "סיסרא ביקש מיעל לעמוד בפתח האוהל ולהכחיש את נוכחותו. במקום למלא את בקשתו, יעל לקחה את יתד האוהל ואת המקבת ותקעה את היתד ברקתו כשהיה נרדם", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"לֵךְ וְאַרְאֶךָּ אֶת הָאִישׁ\"\nשאלה: מי אמרה את הדברים האלה, למי, ומה ראה כשנכנס?", "a": "יעל אמרה לברק בן אבינועם שהיה רודף אחרי סיסרא. כשנכנס לאוהל ראה את סיסרא נופל מת והיתד ברקתו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְהוּא יוֹשֵׁב בַּחֲרֹשֶׁת הַגּוֹיִם\"\nשאלה: על מי מדבר הפסוק, מי היה אדוניו, וכמה רכב ברזל היו לו?", "a": "על סיסרא שר צבא יבין מלך כנען. סיסרא ישב בחרושת הגויים והיו לו תשע מאות (900) רכב ברזל, והוא לחץ את בני ישראל עשרים שנה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַתִּפְתַּח אֶת נֹאד הֶחָלָב וַתַּשְׁקֵהוּ וַתְּכַסֵּהוּ\"\nשאלה: מה ביקש ממנה האיש שהיא השקתה, ומדוע נתנה לו דבר אחר ממה שביקש?", "a": "סיסרא ביקש מים (\"הַשְׁקִינִי נָא מְעַט מַיִם כִּי צָמֵאתִי\") אך יעל נתנה לו חלב. הפרשנים מסבירים שהחלב גורם לעייפות ולישנוניות, מה שעזר לה - שהרי אחרי ששתה נרדם, ואז תקעה את היתד ברקתו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיָּנׇס בְּרַגְלָיו\"\nשאלה: מי נס ברגליו, ממה נס, ומדוע הפרט \"ברגליו\" משמעותי כל כך?", "a": "סיסרא נס ברגליו מהמלחמה. הפרט \"ברגליו\" משמעותי כי סיסרא היה שר צבא עם 900 רכב ברזל - הוא ירד מעל המרכבה ונס רגלי. מי שכל כוחו היה ברכב הברזל, נאלץ לברוח ברגל כאדם פשוט", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"כִּי שָׁלוֹם בֵּין יָבִין מֶלֶךְ חָצוֹר\"\nשאלה: מדוע מציין הכתוב את פרט השלום הזה, ולאוהל מי נס סיסרא בגלל שלום זה?", "a": "סיסרא נס לאוהל יעל אשת חבר הקיני כי סמך על השלום שבין יבין (אדוניו) לבית חבר הקיני. הכתוב מציין פרט זה כדי להסביר מדוע סיסרא הרגיש בטוח לגשת לאוהל - הוא לא ציפה לבגידה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְהוּא נִרְדָּם וַיָּעַף וַיָּמֹת\"\nשאלה: שלוש מילים מתארות שלושה שלבים. מה קרה בין \"נרדם\" ל\"ויעף\" - מה הפעולה שחסרה בקטע הזה?", "a": "בין ההירדמות למוות, יעל תקעה את יתד האוהל ברקתו: \"וַתִּתְקַע אֶת הַיָּתֵד בְּרַקָּתוֹ וַתִּצְנַח בָּאָרֶץ\". היתד חדרה דרך הרקה שלו עד הארץ. \"ויעף\" - נגוע, פגוע למוות", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"אוֹרוּ מֵרוֹז אָמַר מַלְאַךְ יְהוָה\"\nשאלה: מהי \"מרוז\", מדוע קוללה, ומה ההבדל בין גורלה לבין הברכה שניתנה מיד אחריה?", "a": "מרוז היא עיר (או ישוב) שקוללה כי לא באה לעזרת ה' במלחמה - \"כִּי לֹא בָאוּ לְעֶזְרַת ה' בַּגִּבּוֹרִים\". מיד אחרי הקללה הזו בשירת דבורה באה ברכת יעל: \"תְּבֹרַךְ מִנָּשִׁים יָעֵל\" - ניגוד חד בין מי שלא עזרה למי שפעלה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיָּהׇם יְהוָה אֶת סִיסְרָא וְאֶת כׇּל\"\nשאלה: מה \"המם\" ה' מלבד סיסרא עצמו, ומי ירד לקראתו מההר?", "a": "ה' המם את סיסרא ואת כל הרכב ואת כל המחנה לפי חרב לפני ברק. ברק ירד מהר תבור עם עשרת אלפים איש אחריו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַתְּכַסֵּהוּ בַּשְּׂמִיכָה\"\nשאלה: מי כיסתה, את מי, ומה עשתה לו אחר כך כשנרדם?", "a": "יעל אשת חבר הקיני כיסתה את סיסרא בשמיכה באוהלה. אחרי שנרדם, לקחה את יתד האוהל ואת המקבת ותקעה את היתד ברקתו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"תְּבֹרַךְ מִנָּשִׁים יָעֵל אֵשֶׁת חֶבֶר\"\nשאלה: מתוך איזו שירה נלקח הפסוק, ומי קוללה בפסוק שלפניו?", "a": "מתוך שירת דבורה (שופטים ה':כ\"ד). בפסוק שלפניו קוללה מרוז: \"אוֹרוּ מֵרוֹז... אֹרוּ אָרוֹר יֹשְׁבֶיהָ\" - כי לא באו לעזרת ה'. ניגוד חד: מרוז קוללה, יעל בורכה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"אֵשֶׁת לַפִּידוֹת\"\nשאלה: על מי נאמר \"אשת לפידות\", ומהו התואר המיוחד שניתן לה שלא ניתן לשום שופט זכר?", "a": "על דבורה. התואר המיוחד הוא \"אִשָּׁה נְבִיאָה\" - דבורה היא היחידה בספר שופטים שמתוארת כנביאה. הפסוק המלא: \"וּדְבוֹרָה אִשָּׁה נְבִיאָה אֵשֶׁת לַפִּידוֹת הִיא שֹׁפְטָה אֶת יִשְׂרָאֵל בָּעֵת הַהִיא\"", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"תַּחַת תֹּמֶר דְּבוֹרָה\"\nשאלה: היכן בדיוק ישב התומר הזה - ציין את שני המקומות שביניהם, ומה עשו בני ישראל שם?", "a": "תומר דבורה ישב \"בֵּין הָרָמָה וּבֵין בֵּית אֵל בְּהַר אֶפְרָיִם\". בני ישראל עלו אליה שם למשפט - \"וַיַּעֲלוּ אֵלֶיהָ בְּנֵי יִשְׂרָאֵל לַמִּשְׁפָּט\"", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"נִפְרָד מִקַּיִן\"\nשאלה: מי \"נפרד מקין\", מי הוא \"חובב\" המוזכר בהקשר, ולאן נטה את אוהלו?", "a": "חבר הקיני נפרד מקין (מבני שבטו הקינים). \"חובב\" הוא חותן משה - \"מִבְּנֵי חֹבָב חֹתֵן מֹשֶׁה\". חבר נטה את אוהלו \"עַד אֵילוֹן בְּצַעֲנַנִּים אֲשֶׁר אֶת קֶדֶשׁ\". פרט זה מסביר מדוע סיסרא נס דווקא לאוהל יעל אשת חבר", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"בְּסֵפֶל אַדִּירִים הִקְרִיבָה חֶמְאָה\"\nשאלה: מי הקריבה חמאה, למי, ומה ההבדל בין תיאור הפרוזה (פרק ד') לתיאור השירה (פרק ה')?", "a": "יעל הקריבה לסיסרא. בפרוזה (ד':י\"ט) נאמר שפתחה \"נֹאד הֶחָלָב\" - חלב. בשירה (ה':כ\"ה) התיאור מפואר יותר: \"מַיִם שָׁאַל חָלָב נָתָנָה בְּסֵפֶל אַדִּירִים הִקְרִיבָה חֶמְאָה\" - נתנה חמאה בספל מכובד. השירה מגדילה את הניגוד בין הכנסת האורחים לבגידה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"עוּרִי עוּרִי דְּבוֹרָה\"\nשאלה: כמה פעמים חוזרת המילה \"עורי\" בפסוק, ומה נאמר לברק באותו פסוק?", "a": "המילה \"עורי\" חוזרת ארבע פעמים: \"עוּרִי עוּרִי דְּבוֹרָה עוּרִי עוּרִי דַּבְּרִי שִׁיר\". לברק נאמר: \"קוּם בָּרָק וּשְׁבֵה שֶׁבְיְךָ בֶּן אֲבִינֹעַם\" - קום ושבה את שבויך. ההבדל: לדבורה - \"דברי שיר\", לברק - \"שבה שביך\" (מלחמה)", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"חַכְמוֹת שָׂרוֹתֶיהָ תַּעֲנֶינָּה\"\nשאלה: מי הן \"שרותיה\", את מי הן עונות, ומה התשובה שנתנו?", "a": "\"שרותיה\" הן השרות (נשות השרים) של אם סיסרא. הן עונות לאם סיסרא שתוהה מדוע בנה מאחר לחזור. התשובה: \"הֲלֹא יִמְצְאוּ יְחַלְּקוּ שָׁלָל רַחַם רַחֲמָתַיִם לְרֹאשׁ גֶּבֶר\" - הן מנחמות שהוא עסוק בחלוקת שלל. האירוניה: סיסרא כבר מת", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"כְּצֵאת הַשֶּׁמֶשׁ בִּגְבֻרָתוֹ\"\nשאלה: זהו הפסוק האחרון בשירת דבורה. מי הם \"אוהביו\" שנמשלו לשמש, ומי הם \"אויביך\" שנאמר עליהם \"כן יאבדו\"?", "a": "הפסוק המלא: \"כֵּן יֹאבְדוּ כׇל אוֹיְבֶיךָ יְהוָה וְאֹהֲבָיו כְּצֵאת הַשֶּׁמֶשׁ בִּגְבֻרָתוֹ\". \"אויביך\" - כל אויבי ה' (כמו סיסרא ויבין). \"אוהביו\" - אוהבי ה' (כמו דבורה, ברק, יעל). מיד אחרי פסוק זה נאמר \"וַתִּשְׁקֹט הָאָרֶץ אַרְבָּעִים שָׁנָה\"", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"יְהוָה עִמְּךָ גִּבּוֹר הֶחָיִל\"\nשאלה: מי אמר את הדברים האלה, למי, ומה היה אותו אדם עושה באותו רגע?", "a": "מלאך ה' אמר לגדעון. באותו רגע גדעון היה חובט חיטים בגת כדי להסתיר מפני מדין", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"אֲלָפִי הַדַּל בִּמְנַשֶּׁה וְאָנֹכִי הַצָּעִיר\"\nשאלה: מי אמר את הדברים האלה, ובתגובה למה?", "a": "גדעון אמר זאת כשה' שלח אותו להושיע את ישראל ממדין. הוא ניסה להסביר מדוע אינו מתאים - משפחתו הדלה ביותר במנשה והוא הצעיר בבית אביו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ הַמְלַקְקִים אוֹשִׁיעַ אֶתְכֶם\"\nשאלה: מי אמר את הדברים האלה, ומה פירוש \"המלקקים\" - כיצד נבחרו אנשים אלה?", "a": "ה' אמר לגדעון. \"המלקקים\" הם 300 האנשים שלקקו מים בלשונם כלקוק הכלב (במקום לכרוע על ברכיהם לשתות). זה היה שלב הסינון השני בעין חרוד, אחרי שקודם הלכו הביתה כל מי שירא וחרד (מ-32,000 נשארו 10,000, ואז מ-10,000 נשארו 300)", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"חֶרֶב לַה' וּלְגִדְעוֹן\"\nשאלה: מי צעק את קריאת הקרב הזאת, ואילו כלים היו בידיהם באותו רגע?", "a": "שלוש מאות לוחמי גדעון צעקו זאת. בידיהם היו שופרות, כדים ריקים ולפידים בתוך הכדים. הם תקעו בשופרות, שברו את הכדים וחשפו את הלפידים", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"לֹא אֶמְשֹׁל אֲנִי בָכֶם וְלֹא\"\nשאלה: מי אמר את הדברים האלה ובתגובה לאיזו בקשה?", "a": "גדעון אמר זאת כשבני ישראל ביקשו ממנו למלוך עליהם לאחר הניצחון על מדין. הוא סירב ואמר שה' ימשול בהם", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"בִּי אֲדֹנִי וְיֵשׁ יְהוָה עִמָּנוּ\"\nשאלה: מי אמר את הדברים האלה, למי, ומה היה עושה כשנאמרו לו \"ה' עמך גבור החיל\"?", "a": "גדעון אמר למלאך ה'. באותו רגע היה חובט חיטים בגת להסתיר מפני מדין. הוא שאל אם ה' עמם - למה מצאתם כל הצרות האלה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְהִנֵּה צְלִיל לֶחֶם שְׂעֹרִים מִתְהַפֵּךְ\"\nשאלה: מי חלם את החלום, ומה פירש רעהו - מה מסמל צליל לחם השעורים?", "a": "חייל מדיני חלם את החלום. רעהו פירש: \"אין זאת בלתי אם חרב גדעון בן יואש איש ישראל, נתן האלהים בידו את מדין ואת כל המחנה\" - צליל לחם השעורים מסמל את גדעון", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"הֲכַף זֶבַח וְצַלְמֻנָּע עַתָּה בְּיָדֶךָ\"\nשאלה: מי אמר את הדברים האלה, למי, ומה עשה גדעון להם אחרי שתפס את זבח וצלמונע?", "a": "שרי סוכות אמרו לגדעון כשביקש לחם ללוחמיו הרודפים אחרי מלכי מדין. הם סירבו לעזור. אחרי הניצחון גדעון חזר ודש את בשרם בקוצי מדבר ובברקנים כעונש", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"הוֹצֵא אֶת בִּנְךָ וְיָמֹת כִּי נָתַץ\"\nשאלה: מי דרש את הדבר הזה, ממי, ומה היתה תשובתו?", "a": "אנשי העיר (עפרה) דרשו מיואש אבי גדעון להוציא את בנו למיתה. יואש הגן על גדעון ואמר: \"האתם תריבון לבעל? אם אלהים הוא ירב לו כי נתץ את מזבחו\" - ולכן נקרא גדעון \"ירובעל\"", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיַּעַשׂ אוֹתוֹ גִדְעוֹן לְאֵפוֹד\"\nשאלה: ממה עשה גדעון את האפוד, ומה היתה התוצאה?", "a": "גדעון עשה את האפוד מנזמי הזהב שביקש מהשלל (1,700 שקל זהב). התוצאה היתה שכל ישראל זנו אחריו - \"ויהי לגדעון ולביתו למוקש\"", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"רַב הָעָם אֲשֶׁר אִתָּךְ\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה היה החשש שבגללו צריך למעט את העם?", "a": "ה' אמר לגדעון. החשש היה \"פֶּן יִתְפָּאֵר עָלַי יִשְׂרָאֵל לֵאמֹר יָדִי הוֹשִׁיעָה לִּי\" - שישראל ייחסו את הניצחון לעצמם ולא לה'. לכן הוקטן הצבא מ-32,000 ל-300", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּמֶץ טַל מִן הַגִּזָּה\"\nשאלה: מי סחט את הגיזה, ומה היה המבחן השני שביקש מיד אחרי - מה היה ההפך?", "a": "גדעון סחט את גיזת הצמר. במבחן הראשון - טל על הגיזה וחורב על הארץ. במבחן השני (ההפך) ביקש חורב על הגיזה וטל על כל הארץ - \"יְהִי נָא חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל\"", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"כָּמוֹךָ כְמוֹהֶם אֶחָד כְּתֹאַר בְּנֵי הַמֶּלֶךְ\"\nשאלה: מי אמר את הדברים האלה, למי, ומה היתה תוצאת התשובה הזו?", "a": "זבח וצלמונע (מלכי מדין) אמרו לגדעון כשהוא שאל אותם \"אֵיפֹה הָאֲנָשִׁים אֲשֶׁר הֲרַגְתֶּם בְּתָבוֹר\". הם תיארו את הנהרגים כדומים לגדעון - \"כתואר בני המלך\". גדעון אמר \"אַחַי בְּנֵי אִמִּי הֵם\" - הם היו אחיו, ולכן הרג את זבח וצלמונע", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְלֹא שָׁלַף הַנַּעַר חַרְבּוֹ כִּי יָרֵא\"\nשאלה: מי הנער שירא, מה התבקש לעשות, ומה קרה בסופו של דבר?", "a": "הנער הוא יתר בכורו של גדעון. גדעון ביקש ממנו \"קוּם הֲרֹג אוֹתָם\" - להרוג את זבח וצלמונע מלכי מדין. הנער פחד ולא שלף חרבו. אז זבח וצלמונע עצמם אמרו לגדעון \"קוּם אַתָּה וּפְגַע בָּנוּ כִּי כָאִישׁ גְּבוּרָתוֹ\" - וגדעון הרג אותם בעצמו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וּפִילַגְשׁוֹ אֲשֶׁר בִּשְׁכֶם יָלְדָה לּוֹ\"\nשאלה: מי הוא האב, כמה בנים \"לגיטימיים\" היו לו, ומה פירוש השם \"אבימלך\"?", "a": "האב הוא גדעון (ירובעל). היו לו שבעים בנים יוצאי ירכו מנשים רבות. \"אבימלך\" - פירושו \"אבי מלך\" (או \"אבי הוא מלך\"). האירוניה: גדעון סירב למלוך (\"ה' ימשול בכם\"), אך בנו מהפילגש בשכם ינסה לקחת את המלוכה בכוח", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְהוּא חֹבֵט חִטִּים בַּגַּת\"\nשאלה: מי הוא \"הוא\" שחובט חיטים, ומדוע חבט בגת ולא בגורן?", "a": "גדעון בן יואש חבט חיטים בגת (ולא בגורן הפתוח) כדי להסתיר מפני מדין שהיו שודדים את יבולי ישראל. באותו רגע הופיע מלאך ה' ואמר לו \"ה' עמך גבור החיל\"", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"פֶּן יִתְפָּאֵר עָלַי יִשְׂרָאֵל\"\nשאלה: מי אמר את הדברים, ומה עשה כדי למנוע את ההתפארות?", "a": "ה' אמר לגדעון. כדי למנוע מישראל להתפאר \"יָדִי הוֹשִׁיעָה לִּי\", ה' ציווה להקטין את הצבא - מ-32,000 ל-10,000 (מי שירא חזר), ואז ל-300 בלבד (מבחן השתייה בעין חרוד)", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"קוּם אַתָּה וּפְגַע בָּנוּ\"\nשאלה: מי אמר למי, ומדוע ביקשו דווקא ממנו?", "a": "זבח וצלמונע (מלכי מדין) אמרו לגדעון. הם ביקשו זאת לאחר שיתר בכורו של גדעון פחד ולא שלף חרבו להרגם. הם אמרו \"כִּי כָאִישׁ גְּבוּרָתוֹ\" - כי גבורת הגבר היא לפי גודלו, והעדיפו למות בידי לוחם מבוגר", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"אִישׁ נָבִיא אֶל בְּנֵי יִשְׂרָאֵל\"\nשאלה: מי הוא \"איש נביא\" זה - האם שמו מוזכר? ומה אמר לבני ישראל לפני שנגלה מלאך ה' לגדעון?", "a": "שמו לא מוזכר כלל - הוא נביא אנונימי ששלח ה' אל בני ישראל. הוא הזכיר להם את יציאת מצרים וההצלה מלוחציהם, ואמר בשם ה': \"אֲנִי יְהוָה אֱלֹהֵיכֶם לֹא תִירְאוּ אֶת אֱלֹהֵי הָאֱמֹרִי... וְלֹא שְׁמַעְתֶּם בְּקוֹלִי\". זהו הפרק היחיד בשופטים שנביא נשלח לפני המושיע", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"לֵךְ בְּכֹחֲךָ זֶה\"\nשאלה: מי אמר \"לך בכחך זה\", למי, ומהו \"כוחך זה\" - מה עשה האיש שהוכיח את כוחו?", "a": "ה' אמר לגדעון. \"כחך זה\" - לפי הפשט, ה' אומר שהכוח שכבר יש בו מספיק. הפסוק המלא: \"לֵךְ בְּכֹחֲךָ זֶה וְהוֹשַׁעְתָּ אֶת יִשְׂרָאֵל מִכַּף מִדְיָן הֲלֹא שְׁלַחְתִּיךָ\". גדעון בתגובה טען שאלפו הדל במנשה והוא הצעיר בבית אביו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"תַּחַת הָאֵלָה אֲשֶׁר בְּעָפְרָה\"\nשאלה: מי ישב תחת האלה, של מי היתה עפרה, ומה עשה בנו באותו רגע?", "a": "מלאך ה' ישב תחת האלה. עפרה היתה של יואש אבי העזרי (אבי גדעון). בנו גדעון באותו רגע \"חֹבֵט חִטִּים בַּגַּת לְהָנִיס מִפְּנֵי מִדְיָן\" - חבט חיטים בגת כדי להסתיר מפני מדין", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"שִׁבְעִים בָּנִים יֹצְאֵי יְרֵכוֹ\"\nשאלה: על מי נאמר שהיו לו שבעים בנים, מדוע היו לו כל כך הרבה, ומה קרה להם בסופו של דבר?", "a": "על גדעון (ירובעל). הסיבה: \"כִּי נָשִׁים רַבּוֹת הָיוּ לוֹ\" - היו לו נשים רבות. בסופו של דבר, אבימלך בנו מהפילגש בשכם הרג את כולם (שבעים איש) על אבן אחת - רק יותם הצעיר ניצל כי נחבא", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּקְבֵּר בְּקֶבֶר יוֹאָשׁ\"\nשאלה: מי נקבר בקבר יואש, היכן, ומה עשו בני ישראל מיד אחרי מותו?", "a": "גדעון בן יואש נקבר בקבר אביו \"בְּעָפְרָה אֲבִי הָעֶזְרִי\". מיד אחרי מותו: \"וַיָּשׁוּבוּ בְּנֵי יִשְׂרָאֵל וַיִּזְנוּ אַחֲרֵי הַבְּעָלִים וַיָּשִׂימוּ לָהֶם בַּעַל בְּרִית לֵאלֹהִים\" - חזרו לעבודה זרה ושמו את בעל ברית לאלוהים", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"הַמְשֹׁל בָּכֶם שִׁבְעִים אִישׁ\"\nשאלה: מי אמר את הדברים האלה, למי, ומי הם \"שבעים איש\" ומי הוא \"איש אחד\"?", "a": "אבימלך אמר לאחי אמו בשכם. \"שבעים איש\" הם אחיו - בני ירובעל (גדעון). \"איש אחד\" הוא אבימלך עצמו - הוא שכנע את בעלי שכם לתמוך בו כמלך יחיד", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיַּהֲרֹג אֶת אֶחָיו שִׁבְעִים אִישׁ\"\nשאלה: מי עשה את המעשה המתואר בפסוק, ומי ניצל מהטבח?", "a": "אבימלך הרג את אחיו. יותם, הבן הצעיר ביותר, ניצל כי נחבא", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"הֶחֳדַלְתִּי אֶת דִּשְׁנִי אֲשֶׁר בִּי\"\nשאלה: איזה עץ אומר את הדברים האלה במשל יותם, ומה ההצעה שסירב לה?", "a": "הזית אומר את הדברים האלה. הוא סירב להצעת העצים שימלוך עליהם - לא רצה לוותר על דשנו (שמנו) שבו מכבדים אלוהים ואנשים", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַתַּשְׁלֵךְ אִשָּׁה אַחַת פֶּלַח רֶכֶב\"\nשאלה: מה ביקש אבימלך מנושא כליו מיד אחרי האירוע המתואר בפסוק, ומדוע?", "a": "ביקש \"שלוף חרבך ומותתני\" כי לא רצה שיאמרו \"אישה הרגתהו\" - הוא העדיף למות בידי גבר", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיָּשֶׁב אֱלֹהִים אֵת רָעַת אֲבִימֶלֶךְ\"\nשאלה: נבואת מי התקיימה בפסוק הזה, ומה היא ניבאה?", "a": "נבואת יותם בן ירובעל (במשל העצים מהר גריזים) התקיימה. הוא ניבא שתצא אש מאבימלך ותאכל את בעלי שכם, ותצא אש מבעלי שכם ותאכל את אבימלך - ואכן שניהם נענשו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׂכֹּר בָּהֶם אֲנָשִׁים רֵיקִים וּפֹחֲזִים\"\nשאלה: מי קיבל את הכסף, מהיכן נלקח, ומה עשה בו?", "a": "אבימלך קיבל 70 כסף מבית בעל ברית (מקדש בשכם). הוא שכר בהם אנשים ריקים ופוחזים, ובא לבית אביו בעפרה והרג את 70 אחיו על אבן אחת", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"הֶחֳדַלְתִּי אֶת מָתְקִי וְאֶת תְּנוּבָתִי\"\nשאלה: איזה עץ אומר את הדברים האלה במשל יותם, ואיזה עץ סירב לפניו?", "a": "התאנה אומרת את הדברים. לפניה סירב הזית (\"החדלתי את דשני\"). אחריה סירבה גם הגפן, ולבסוף רק האטד (שיח קוצים) הסכים למלוך", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"תֵּצֵא אֵשׁ מִן הָאָטָד וְתֹאכַל\"\nשאלה: מי מייצג ה\"אטד\" במשל יותם, ומי הם \"ארזי הלבנון\"?", "a": "האטד (שיח קוצים חסר ערך) מייצג את אבימלך. \"ארזי הלבנון\" (העצים החשובים) מייצגים את בעלי שכם ואנשי ישראל. המשל מזהיר שהאטד ישרוף את כולם", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁלַח אֱלֹהִים רוּחַ רָעָה בֵּין אֲבִימֶלֶךְ\"\nשאלה: מדוע שלח אלוהים רוח רעה ביניהם - מה היה החטא המשותף?", "a": "כדי שיבוא חמס שבעים בני ירובעל ודמם יושם על אבימלך שהרג אותם, ועל בעלי שכם שחיזקו את ידיו להרוג את אחיו. שניהם היו שותפים לרצח", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"שְׁלֹף חַרְבְּךָ וּמוֹתְתֵנִי\"\nשאלה: מי אמר את הדברים האלה, למי, ומה קרה לפני שביקש זאת?", "a": "אבימלך אמר לנושא כליו (נערו). לפני כן, אישה אחת מתבץ השליכה עליו פלח רכב (אבן ריחיים עליונה) על ראשו ורצצה את גולגולתו כשניסה לשרוף את מגדל תבץ", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וּזְכַרְתֶּם כִּי עַצְמְכֶם וּבְשַׂרְכֶם אָנִי\"\nשאלה: מי אמר את הדברים האלה, למי, ומה הטיעון שלו - מדוע הוא \"עצמם ובשרם\"?", "a": "אבימלך אמר לאחי אמו בשכם. הטיעון: הוא בן הפילגש השכמית, ולכן הוא קרוב משפחתם מצד האם - \"עצמכם ובשרכם\". הוא ניצל את הקשר המשפחתי כדי לשכנע אותם לתמוך בו נגד 70 אחיו מצד אביו גדעון", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּוָּתֵר יוֹתָם בֶּן יְרֻבַּעַל הַקָּטֹן\"\nשאלה: מהיכן נחבא יותם, ומה עשה מיד אחרי שנודע לו על הטבח ועל המלכת אבימלך?", "a": "יותם נחבא בזמן הטבח של 70 אחיו בעפרה. אחרי שנודע לו, הלך ועמד בראש הר גריזים וצעק את משל העצים לבעלי שכם - ואז ברח לבאר מפני אבימלך אחיו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"הֶחֳדַלְתִּי אֶת תִּירוֹשִׁי הַמְשַׂמֵּחַ\"\nשאלה: איזה עץ אומר את הדברים האלה במשל יותם, מי סירב לפניו, ומי סירב לפני הסרבן הקודם?", "a": "הגפן אומרת את הדברים (סירבה לוותר על תירושה). לפניה סירבה התאנה (\"החדלתי את מתקי ואת תנובתי הטובה\"), ולפני התאנה סירב הזית (\"החדלתי את דשני\"). סדר הסירובים: זית, תאנה, גפן, ואז רק האטד הסכים", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּתֹּץ אֶת הָעִיר וַיִּזְרָעֶהָ מֶלַח\"\nשאלה: איזו עיר נהרסה ונזרעה מלח, מי הרס אותה, ומה המשמעות של זריעת מלח?", "a": "שכם נהרסה על ידי אבימלך. זריעת מלח מסמלת חורבן מוחלט וקללה - שהאדמה לא תוכל להצמיח דבר. זוהי פעולה סמלית של השמדה מוחלטת, שנעשתה נגד אותה עיר שהמליכה אותו מלכתחילה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"מָה רְאִיתֶם עָשִׂיתִי מַהֲרוּ עֲשׂוּ כָמוֹנִי\"\nשאלה: מי אמר את הדברים, מה עשה בעצמו כדוגמה, ומה קרה לאנשים שהיו בתוך המבנה?", "a": "אבימלך אמר לעם שאיתו. הוא עלה להר צלמון, כרת סוכת עצים בקרדומות ושם על שכמו. העם עשו כמוהו, שמו את הסוכות על הצריח (מקדש אל ברית), והציתו אש. כל אנשי מגדל שכם - כאלף איש ואישה - מתו בשריפה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּזְרָעֶהָ מֶלַח\"\nשאלה: איזו עיר נזרעה מלח, ומי זרע - מה היחס הקודם בינו לבין עיר זו?", "a": "אבימלך זרע מלח את שכם. האירוניה: בעלי שכם הם שהמליכו אותו מלכתחילה ונתנו לו 70 כסף. הוא הרס את אותה עיר שתמכה בו", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"אֲנָשִׁים רֵיקִים וּפֹחֲזִים\"\nשאלה: מי שכר אנשים אלה, מאיזה כסף, ומה עשה בעזרתם?", "a": "אבימלך שכר אותם בשבעים כסף מבית בעל ברית (מקדש בשכם). בעזרתם הלך לבית אביו בעפרה והרג את שבעים אחיו בני ירובעל על אבן אחת", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַתָּרִץ אֶת גֻּלְגָּלְתּוֹ\"\nשאלה: מי רצצה את גולגולתו, באיזה כלי, ובאיזו עיר קרה האירוע?", "a": "אישה אחת (ללא שם) רצצה את גולגולת אבימלך באמצעות פלח רכב (אבן ריחיים עליונה) בעיר תבץ. אבימלך ניסה לשרוף את מגדל העיר כשהאישה השליכה עליו את האבן מגג המגדל", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"גַּעַל בֶּן עֶבֶד\"\nשאלה: מי הוא געל בן עבד, מה עשה, ומי הוא זבול שפעל נגדו?", "a": "געל בן עבד הוא מסית שהגיע לשכם ושכנע את בעלי שכם למרוד באבימלך. הוא אמר \"מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם כִּי נַעַבְדֶנּוּ\". זבול היה \"שַׂר הָעִיר\" (פקיד שכם מטעם אבימלך) ששלח בסתר מלאכים לאבימלך להזהירו. זבול גם הוליך שולל את געל ואמר לו \"אֵת צֵל הֶהָרִים אַתָּה רֹאֶה כָּאֲנָשִׁים\" כשראה את צבא אבימלך מתקרב", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"עִם אֵלוֹן מֻצָּב\"\nשאלה: מה קרה \"עם אלון מוצב אשר בשכם\" - מה האירוע שהתקיים שם?", "a": "שם המליכו את אבימלך למלך. הפסוק: \"וַיֵּאָסְפוּ כָל בַּעֲלֵי שְׁכֶם וְכָל בֵּית מִלּוֹא וַיֵּלְכוּ וַיַּמְלִיכוּ אֶת אֲבִימֶלֶךְ לְמֶלֶךְ עִם אֵלוֹן מֻצָּב אֲשֶׁר בִּשְׁכֶם\". \"אלון מוצב\" - אלון (או עמוד) שהוצב כציון מקודש בשכם", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"שָׁלֹשׁ שָׁנִים\"\nשאלה: מי שלט שלוש שנים, ומה שלח אלוהים בסוף תקופה זו?", "a": "אבימלך שלט (\"וַיָּשַׂר\") על ישראל שלוש שנים. בסוף תקופה זו: \"וַיִּשְׁלַח אֱלֹהִים רוּחַ רָעָה בֵּין אֲבִימֶלֶךְ וּבֵין בַּעֲלֵי שְׁכֶם\" - אלוהים שלח רוח רעה ביניהם, ובעלי שכם בגדו באבימלך", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"בֶּן אֲמָתוֹ\"\nשאלה: מי מכונה \"בן אמתו\", מי קרא לו כך, ומה ההבדל בין \"אמה\" ל\"פילגש\"?", "a": "אבימלך מכונה \"בן אמתו\" על ידי יותם בנאומו מהר גריזים: \"וַתַּמְלִיכוּ אֶת אֲבִימֶלֶךְ בֶּן אֲמָתוֹ עַל בַּעֲלֵי שְׁכֶם כִּי אֲחִיכֶם הוּא\". \"אמה\" (שפחה) הוא כינוי מזלזל יותר מ\"פילגש\" - יותם מבזה את אבימלך ומדגיש את מוצאו הנחות מהפילגש", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"אַרְבָּעָה רָאשִׁים\"\nשאלה: מי חילק את כוחותיו לארבעה ראשים (קבוצות), נגד מי, ובאיזה זמן יצא לקרב?", "a": "אבימלך חילק את כוחותיו לארבע קבוצות כשארב לשכם נגד געל בן עבד ובעלי שכם. יצא לקרב בלילה: \"וַיָּקָם אֲבִימֶלֶךְ וְכָל הָעָם אֲשֶׁר עִמּוֹ לָיְלָה וַיֶּאֱרְבוּ עַל שְׁכֶם אַרְבָּעָה רָאשִׁים\". זבול שר העיר הוא שייעץ לו לארוב בלילה", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיָּקָם אַחֲרָיו תּוֹלָע בֶּן פּוּאָה בֶּן דּוֹדוֹ\"\nשאלה: אחרי מי קם תולע, ומה ייחוסו? כמה זמן שפט?", "a": "תולע קם אחרי אבימלך להושיע את ישראל. ייחוסו: \"בן פואה בן דודו, איש יששכר\" - ממשפחת שבט יששכר. ישב בשמיר בהר אפרים. שפט את ישראל עשרים ושלש שנה ומת ויקבר בשמיר. הכתוב אינו מספר על מעשיו - הוא שופט \"שקט\".", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְלוֹ שְׁלֹשִׁים בָּנִים רֹכְבִים עַל שְׁלֹשִׁים עֲיָרִים\"\nשאלה: מי מתואר בפסוק הזה? מה נוסף לגבי ילדיו ועיריו?", "a": "הפסוק מתאר את יאיר הגלעדי, השופט שקם אחרי תולע. \"ולו שלשים בנים רכבים על שלשים עיירים ושלשים עירים להם\" - שלשים בנים רוכבים על שלשים חמורים, ולהם שלשים עיירות הנקראות \"חוות יאיר\" בגלעד \"עד היום הזה\". שפט ישראל עשרים ושתים שנה.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיָּמָת יָאִיר וַיִּקָּבֵר בְּקָמוֹן\"\nשאלה: מה מיוחד בתיאור שני השופטים הקטנים האלה - תולע ויאיר - לעומת שאר שופטי ישראל?", "a": "שניהם מתוארים בקצרה מאוד - ללא מלחמות, ללא ניסים, ללא פעולות הצלה דרמטיות. הכתוב מספר רק על ייחוסם, שנות שפיטתם, ילדיהם/עיריהם, ומקום קבורתם. הם \"שופטים שקטים\" - תקופות יציבות יחסית בין הסיפורים הדרמטיים.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיּוֹסִיפוּ בְּנֵי יִשְׂרָאֵל לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה\"\nשאלה: מהן עבודות הזרה שהכתוב מונה כאן, ומה יוצא דופן בפרוט הזה?", "a": "הכתוב מונה שבעה סוגי עבודה זרה: הבעלים, העשתרות, אלהי ארם, אלהי צידון, אלהי מואב, אלהי בני עמון, אלהי פלשתים. זהו הפרוט הארוך ביותר של עבודות זרה בספר שופטים - שבעה גויים! הכתוב מדגיש את עומק הנפילה של הדור הזה.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"לְכוּ וְזַעֲקוּ אֶל הָאֱלֹהִים אֲשֶׁר בְּחַרְתֶּם בָּם\"\nשאלה: מי אמר את הדברים ולמי? מה הסיבה לתגובה יוצאת הדופן הזו?", "a": "ה' אמר לבני ישראל כשזעקו אליו בשעת מצוקתם. ה' השיב שכבר הצילם פעמים רבות (ממצרים, מהאמוריים, מעמון, מפלשתים) והם שוב ושוב חזרו לעבוד אלוהים אחרים. הפעם ה' סירב לדפוס הרגיל של \"חטא-זעקה-הצלה\" - ביקש מהם לגשת לאלוהים שבחרו בהם.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַתִּקְצַר נַפְשׁוֹ בַּעֲמַל יִשְׂרָאֵל\"\nשאלה: מה הפירוש של \"ותקצר נפשו בעמל ישראל\"? מה קרה לפני כן שהוביל לכך?", "a": "\"ותקצר נפשו\" - ה' לא יכול לסבול את הסבל שעובר על ישראל, קצרה סבלנותו מלראות את צרתם. לפני כן: ישראל הסירו את האלהים הנכרים מקרבם ועבדו את ה' - \"ותקצר נפשו בעמל ישראל\". ה' ריחם עליהם כשראה את תשובתם האמיתית.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְיִפְתָּח הַגִּלְעָדִי הָיָה גִּבּוֹר חַיִל וְהוּא בֶּן אִשָּׁה זוֹנָה\"\nשאלה: מה הרקע המשפחתי של יפתח, ומה קרה לו בגלל מוצאו?", "a": "יפתח היה גבור חיל, בן גלעד מאשה זונה. אחי יפתח מאשת גלעד הלגיטימית גרשו אותו: \"ויגרשו אותו ויאמרו לו לא תנחל בבית אבינו כי בן אשה אחרת אתה\". יפתח ברח וישב בארץ טוב - הגלוי והמנודה הפך לגיבור לאומי.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּתְלַקְּטוּ אֶל יִפְתָּח אֲנָשִׁים רֵיקִים\"\nשאלה: מי הם \"אנשים ריקים\" שהתלקטו ליפתח? מה ניתן ללמוד מהם על אופי יפתח?", "a": "\"אנשים ריקים\" - אנשים ללא קניין, נוודים, שוליים חברתיים שאין להם מה להפסיד. ישבו עם יפתח בארץ טוב ויצאו עמו. הדבר מלמד שיפתח בנה כוח אלטרנטיבי מחוץ לחברה הממוסדת - בדומה לדוד שברח לאדולם ואליו נאספו נושי חוב ומרי נפש.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"הֲלֹא אַתָּה שְׂנֵאתַנִי וַתְּגָרְשֵׁנִי מִבֵּית אָבִי\"\nשאלה: מי אמר את הדברים ולמי, ובאיזה הקשר? מה טען המדבר?", "a": "יפתח אמר לזקני גלעד כשבאו אליו לבקש שיוביל אותם נגד עמון. יפתח ציין את העוול שנעשה לו: גרשו אותו, ועכשיו בשעת צרה באים אליו. לא נשכח ולא עוקף את כאבו - דרש הכרה בעובדות לפני שהסכים לעזור.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְהָיִיתָ לָּנוּ לְרֹאשׁ לְכֹל יֹשְׁבֵי גִלְעָד\"\nשאלה: מה הסכם נכרת בין יפתח לזקני גלעד, ומה דרש יפתח כתנאי?", "a": "זקני גלעד הציעו ליפתח להיות \"ראש\" - מנהיג לכל יושבי גלעד. יפתח קבע תנאי: \"אם אתם מושיבים אותי לשוב להלחם בבני עמון ונתן ה' אותם לפני אנוכי אהיה לכם לראש\" - הסכם מותנה בניצחון. ואז: \"ויאמרו זקני גלעד אל יפתח ה' יהיה שמע בינותינו\".", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"לֹא לָקַח יִשְׂרָאֵל אֶת אֶרֶץ מוֹאָב\"\nשאלה: מה היתה טענת מלך עמון נגד ישראל, וכיצד הגיב יפתח בנאומו הדיפלומטי?", "a": "מלך עמון טען שישראל לקח את ארצו מארנון עד היבוק ועד הירדן. יפתח השיב בנאום מפורט: ישראל לא לקח מארץ מואב ולא מארץ עמון. ישראל עבר במדבר, שלח מלאכים לסיחון מלך האמורי (לא למואב/עמון) שסירב, וה' נתן את סיחון ביד ישראל. \"ה' אלהי ישראל הוריש את האמורי... ועתה ה' השופט ישפוט היום\".", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַתְּהִי עַל יִפְתָּח רוּחַ יְהוָה\"\nשאלה: מה קרה אחרי שרוח ה' היתה על יפתח? מה עשה לפני שיצא למלחמה?", "a": "אחרי שרוח ה' היתה עליו - עבר יפתח את גלעד ומנשה ועבר משם לבני עמון. לפני המלחמה נדר יפתח נדר: \"אם נתון תתן את בני עמון בידי - והיה היוצא אשר יצא מדלתי ביתי לקראתי בשובי בשלום מבני עמון והיה לה' והעליתיהו עולה\". נדר מסוכן עם תוצאות טרגיות.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיַּכֵּם מֵעֲרוֹעֵר וְעַד בּוֹאֲךָ מִנִּית עֶשְׂרִים עִיר\"\nשאלה: מה תוצאות המלחמה עם בני עמון?", "a": "יפתח ניצח ניצחון גדול: \"ויך אותם מערוער ועד בואך מנית עשרים עיר ועד אבל כרמים מכה גדולה מאד ויכנעו בני עמון מפני בני ישראל\". עשרים עיר - ניצחון מקיף ורחב. ואז חזר יפתח המצפתה ביתה - ושם נפגש עם בתו.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְהִנֵּה בִתּוֹ יֹצֵאת לִקְרָאתוֹ בְּתֻפִּים וּבִמְחֹלוֹת\"\nשאלה: מה קרה כשיפתח הגיע הביתה? מה אמר לבתו, ומה ענתה היא לו?", "a": "בתו יצאה ראשונה לקבל פניו בתופים ובמחולות - היא היתה בתו יחידה. יפתח קרע את בגדיו: \"אהה בתי הכרע הכרעתני... ואנוכי פתחתי פי אל ה' ולא אוכל לשוב\". הבת ענתה: \"אבי פתחת פיך אל ה' עשה לי כאשר יצא מפיך... רק הרף ממני שנים חדשים ואלכה ואיבכה על הרים אני ורעיותי על בתוליי\".", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַתְּהִי חֹק בְּיִשְׂרָאֵל\"\nשאלה: איזה חוק נהג בישראל בעקבות הסיפור הזה?", "a": "\"מימים ימימה תלכנה בנות ישראל לתנות לבת יפתח הגלעדי ארבעת ימים בשנה\" - בנות ישראל היו הולכות מדי שנה בשנה ארבעת ימים לזכר בת יפתח ולבכות על בתוליה. \"ותהי חוק בישראל\" - נהפך למנהג קבוע, מה שמלמד שהסיפור פגע עמוק בזיכרון הלאומי.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"לָמָּה עָבַרְתָּ לְהִלָּחֵם בִּבְנֵי עַמּוֹן וְלָנוּ לֹא קָרָאתָ\"\nשאלה: מי אמר את הדברים ולמי, ומה האיום שהוסיף?", "a": "אנשי אפרים אמרו ליפתח. עברו צפונה אל יפתח ותבעו: מדוע לא קראת לנו להשתתף במלחמה? האיום: \"את ביתך נשרף עליך באש\" - איימו לשרוף את ביתו. אפרים נהגו כך גם עם גדעון קודם לכן - שבט חשוב שלא סבל שמדירים אותו מהמלחמה.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"אִישׁ רִיב הָיִיתִי אֲנִי וְעַמִּי וּבְנֵי עַמּוֹן מְאֹד\"\nשאלה: מה טען יפתח בתשובתו לאנשי אפרים? האם תגובתו שונה מתגובת גדעון?", "a": "יפתח טען שקרא לאפרים ואפרים לא הציל אותו - \"ולא הושעתם אותי מידם\". לכן לקח את נפשו בידיו ועבר לבני עמון. שונה מגדעון: גדעון השקיט את אפרים בדיפלומטיה רכה (שופטים ח'). יפתח בחר בעימות ישיר ויצא למלחמה על אפרים.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"אֱמָר נָא שִׁבֹּלֶת וַיֹּאמֶר סִבֹּלֶת\"\nשאלה: מה היה מנגנון הבדיקה הזה, ומדוע היה יעיל?", "a": "אנשי גלעד לכדו את מעברות הירדן. כל פליט שאמר \"אפרתי אני\" הוצע לו לומר \"שיבולת\". אפרתי מבטא \"סיבולת\" - ס' במקום ש' - בגלל הבדל ניב. \"ולא יכין לדבר כן ויאחזוהו ויזבחוהו\". 42,000 מאפרים נפלו. זהו המקרה הראשון בתנ\"ך של שימוש בבדיקת שפה/דיאלקט כאמצעי זיהוי צבאי.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁפֹּט יִפְתָּח אֶת יִשְׂרָאֵל שֵׁשׁ שָׁנִים\"\nשאלה: כמה שנים שפט יפתח, והיכן נקבר?", "a": "יפתח שפט את ישראל שש שנים. נקבר \"בערי גלעד\" - לא עיר ספציפית. שש שנות שפיטה הן מעט יחסית לרוב השופטים - אולי לא שרד הרבה אחרי המלחמה הקשה עם אפרים ותוצאות נדרו.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְלוֹ שְׁלֹשִׁים בָּנִים וּשְׁלֹשִׁים בָּנוֹת שִׁלַּח הַחוּצָה\"\nשאלה: מי מתואר בפסוק? מה עשה עם בנותיו ועם כלותיו?", "a": "אבצן מבית לחם. \"ולו שלשים בנים ושלשים בנות שלח החוצה ושלשים בנות הביא מן החוץ לבניו\" - הוציא את בנותיו לנישואים מחוץ למשפחה, ולבניו הביא נשים מחוץ. שלשים ושלשים ושלשים - מספרים שלמים המעידים על מעמד ועושר. שפט שבע שנים.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְאַחֲרָיו שָׁפַט אֶת יִשְׂרָאֵל אֵילוֹן הַזְּבוּלֹנִי\"\nשאלה: מה ידוע על אלון הזבולוני? מה מיוחד בתיאורו?", "a": "אלון הזבולוני שפט את ישראל עשר שנים. נקבר \"באילון בארץ זבולון\". הוא השופט הקצר ביותר בפרטיו - הכתוב אינו מספר דבר על מעשיו, ילדיו, או הישגיו. רק שנים ומקום קבורה. אחד מהשופטים ה\"אלמונים\" לחלוטין.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וְלוֹ אַרְבָּעִים בָּנִים וּשְׁלֹשִׁים בְּנֵי בָנִים רֹכְבִים עַל שִׁבְעִים עֲיָרִים\"\nשאלה: מי מתואר כאן? מה הספרים מלמדים על מעמדו?", "a": "עבדון בן הלל הפרעתוני. 40 בנים ו-30 בני בנים - 70 נינים, כולם רוכבים על 70 עיירים (חמורים צעירים). מספרים אלה מוכיחים מעמד גבוה, עושר ויוקרה. שפט שמונה שנים. נקבר בפרעתון בארץ אפרים בהר העמלקי.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּתְּנֵם יְהוָה בְּיַד פְּלִשְׁתִּים אַרְבָּעִים שָׁנָה\"\nשאלה: מהי נקודת ההתחלה של פרשת שמשון, ומה הופך את השעבוד לפלישתים לשונה מהקודמים?", "a": "שמשון מופיע על רקע שעבוד ארבעים שנה לפלישתים - הארוך ביותר בספר שופטים. הייחוד: ישראל לא זעקו לה' בפרק זה! בכל שאר השעבודים הדפוס הוא חטא-שעבוד-זעקה-הצלה. כאן - ישראל לא מבקשים הצלה, מה שמלמד על הסתגלות לשעבוד ואולי אי-הכרה בו כעונש.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"הִנֵּה נָא אַתְּ עֲקָרָה וְלֹא יָלַדְתְּ וְהָרִית וְיָלַדְתְּ בֵּן\"\nשאלה: מי אמר את הדברים ולמי? מהן שלש ההנחיות שניתנו לאישה?", "a": "מלאך ה' אמר לאשת מנוח. שלש ההנחיות: \"ועתה השמרי נא ואל תשתי יין ושכר ואל תאכלי כל טמא\" - (1) לא יין, (2) לא שכר, (3) לא דבר טמא. הסיבה: \"כי הנה הרה וילדת בן ומורה לא יעלה על ראשו כי נזיר אלוהים יהיה הנער מן הבטן והוא יחל להושיע את ישראל מיד פלשתים\".", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"בִּי אֲדֹנָי הָאִישׁ הָאֱלֹהִים אֲשֶׁר שָׁלַחְתָּ יָבֹא נָא עוֹד אֵלֵינוּ\"\nשאלה: מי התפלל ואיזו בקשה ביקש? מה רצה לדעת?", "a": "מנוח התפלל. ביקש שמלאך ה' יבוא שוב - \"ויורנו מה נעשה לנער הנולד\". מנוח רצה ידע מעשי: \"מה יהיה משפט הנער ומעשהו\" - כיצד לגדל את הילד המיוחד. שאלה פרקטית של הורה אחראי.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי וְהוּא פֶלִאי\"\nשאלה: מה שאל מנוח את המלאך, ומה ענה המלאך?", "a": "מנוח שאל \"מה שמך\" כדי לכבדו. המלאך ענה: \"למה זה תשאל לשמי והוא פלאי\" - סירב לגלות שמו וציין שהוא \"פלאי\" (נסתר/נפלא). הדבר מקביל לסירובו של המלאך לגלות שמו ליעקב בפרשת המאבק. מלאכים בתנ\"ך אינם מגלים שמם - זה מדגיש את עליונותם.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיַּעַל מַלְאַךְ יְהוָה בְּלַהַב הַמִּזְבֵּחַ\"\nשאלה: מה עשו מנוח ואשתו לפני שהמלאך עלה בלהב? מה תגובתם אחרי?", "a": "מנוח הקריב על הצור גדי עיזים ומנחה לה'. כשעלה הלהב מן המזבח - עלה המלאך בלהב השמיימה. מנוח ואשתו נפלו על פניהם ארצה. מנוח אמר בפחד: \"מות נמות כי אלוהים ראינו\". אשתו השיבה בהיגיון קר: \"לו חפץ ה' להמיתנו לא לקח מידינו עולה ומנחה ולא הראנו את כל אלה\".", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"מוֹת נָמוּת כִּי אֱלֹהִים רָאִינוּ\"\nשאלה: מה השיבה אשת מנוח לדבריו? מה הגיון יש בתשובתה?", "a": "אשת מנוח ענתה בהגיון חד: \"לו חפץ ה' להמיתנו לא לקח מידינו עולה ומנחה ולא הראנו את כל אלה וכעת לא השמיענו כזאת\". כלומר: אם ה' רצה להרוג - לא היה מקבל קרבן, לא מראה ניסים, לא מבשר בן. אשת מנוח מוצגת כחכמה ורגועה יותר ממנוח עצמו.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"קְחָה לִּי אוֹתָהּ לְאִשָּׁה\"\nשאלה: מה ביקש שמשון, ומה תגובת הוריו? מה הסבר ניתן לכך שמה' הוא?", "a": "שמשון ביקש מהוריו שיקחו לו לאישה נערה פלישתית מתמנה. הוריו התנגדו: \"הלא יש בבנות אחיך ובכל עמי אשה כי אתה הולך לקחת אשה מפלשתים הערלים\". שמשון התעקש - \"קח אותה לי כי היא ישרה בעיני\". הסבר הכתוב: \"ומה' הוא מבקש תאנה מפלשתים\".", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"מֵהָאֹכֵל יָצָא מַאֲכָל וּמֵעַז יָצָא מָתוֹק\"\nשאלה: מה פשר החידה? מה הסמכים שבה?", "a": "החידה מתייחסת לאריה שהרג שמשון ולדבש שמצא בגוית הארי. \"מן האוכל\" = האריה, \"יצא מאכל\" = הדבש. \"מן העז\" = מן האריה החזק, \"יצא מתוק\" = יצא הדבש. מבנה a-b-a-b: מהדבר שאוכל (אריה) יצא מאכל (דבש), ומהחזק (אריה) יצא מתוק (דבש).", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"אִם לֹא תִּמְצָאוּן תִּתְּנוּ אַתֶּם לִי שְׁלֹשִׁים סְדִינִים\"\nשאלה: מהם תנאי ההימור שנקבעו על החידה?", "a": "תנאי ההימור: \"אם הגד תגידו לי בשבעת ימי המשתה ומצאתם - נתתי לכם שלשים סדינים ושלשים חליפות בגדים. ואם לא תוכלו להגיד לי - נתתם אתם לי שלשים סדינים ושלשים חליפות\". ההימור נגד שלשים שושבינים - סכום גדול.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"שְׂנֵאתַנִי וְלֹא אֲהַבְתָּנִי\"\nשאלה: מי אמרה זאת ולמי? מה הביא לידי כך ומה ענה לה שמשון?", "a": "אשת שמשון אמרה לו. השלשים לחצו עליה לגלות להם פתרון החידה - איימו לשרוף אותה ואת בית אביה. היא בכתה עליו שבעת ימים. שמשון ענה: \"הנה לאבי ולאמי לא הגדתי ולך אגיד?\" - סירב, אך ביום השביעי לחץ הבכי ויגד לה. היא גילתה לבני עמה.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"לוּלֵא חֲרַשְׁתֶּם בְּעֶגְלָתִי לֹא מְצָאתֶם חִידָתִי\"\nשאלה: מה הייתה תגובת שמשון כשנגלה שפתרו את חידתו? מה עשה מיד?", "a": "שמשון אמר: \"לולא חרשתם בעגלתי לא מצאתם חידתי\" - הם השתמשו באשתו (\"עגלתו\") לפתור. מיד ירד אשקלון, הכה שם שלשים איש, לקח חליפותם ונתן לפותרי החידה - קיים את ההימור. \"ויחר אפו ויעל בית אביו\". ואשתו ניתנה למרעהו.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיֶּאֱסֹר שְׁלֹשׁ מֵאוֹת שׁוּעָלִים\"\nשאלה: מה עשה שמשון עם השועלים ולשם מה?", "a": "שמשון תפס 300 שועלים, קשר אותם זנב לזנב, שם לפיד בין כל שני זנבות, הצית את הלפידים ושלח את השועלים בשדות פלשתים. שרפו \"גדיש ועד קמה ועד כרם זית\" - הרס את יבולם. הרקע: שמשון גילה שאשתו ניתנה לאחר, ונקם בפלשתים.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"בִּלְחִי הַחֲמוֹר חֲמוֹר חֲמֹרָתַיִם\"\nשאלה: מה הנסיבות שבהן אמר שמשון את הדברים האלה? מה קרה לפני ואחרי?", "a": "אנשי יהודה כפתו את שמשון ומסרוהו לפלשתים. כשהגיע לפלשתים קפצה עליו רוח ה', קרע את הכבלים, מצא לחי חמור טרי והרג בו אלף איש. לאחר מכן אמר: \"בלחי החמור חמור חמורתים, בלחי החמור הכיתי אלף איש\". אחרי כך צמא מאד - ה' בקע בוקע, יצאו מים ושתה. המקום נקרא \"עין הקורא\".", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיֶּאֱהַב אִשָּׁה בְּנַחַל שׂוֹרֵק וּשְׁמָהּ דְּלִילָה\"\nשאלה: מי פנה לדלילה ומה הציע לה? כמה שכר הובטח?", "a": "סרני פלשתים פנו לדלילה. הבקשה: \"פתי אותו וראי במה כחו גדול ובמה נוכל לו\". השכר: כל אחד מחמשת הסרנים הציע 1100 כסף - סך כולל 5500 כסף. שכר עצום עבור בגידה.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"שָׁלֹשׁ פְּעָמִים הֵטֵל בוֹ\"\nשאלה: מה שלשת הניסיונות הכוזבים שאמר שמשון לדלילה?", "a": "שלשת הניסיונות: (1) \"אם יאסרוני בשבעה יתרות לחות אשר לא חרבו... ויהיתי ככל האדם\" - ניסו ונכשלו. (2) \"אם אסור יאסרוני בעבותות חדשות... וחלשתי\" - נכשל. (3) \"אם תארגי את שבע מחלפות ראשי עם המסכת\" - גם נכשל. בכל פעם דלילה קוראת \"פלשתים עליך שמשון\" ושמשון פורק בנקל.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיְהִי כִּי הֵצִיקָה לּוֹ בִּדְבָרֶיהָ כָּל הַיָּמִים\"\nשאלה: מה גרם לשמשון לבסוף לגלות את סוד כוחו?", "a": "\"ותאלצהו ותקצר נפשו למות\" - דלילה הציקה לו ביגונה ובדבריה עד שנפשו קצרה למות. שמשון ויתר: \"ויגד לה את כל לבו ויאמר לה מורה לא עלה על ראשי כי נזיר אלוהים אני מבטן אמי אם גלחתי וסר ממני כחי וחלשתי והייתי ככל האדם\". הגירוי העקבי גבר על שיקול הדעת.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיָּגָלַח אֶת שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ\"\nשאלה: מה קרה אחרי הגילוח? מה הדגיש הכתוב על שינוי המצב?", "a": "דלילה קראה לסרנים, גילחה את שבע מחלפות ראשו על ברכיה. פלשתים אחזו בו. \"ויחל לענות וה' סר מעליו\" - שמשון ניסה לצאת \"כפעם בפעם\" ולא יכל. הכתוב מדגיש: \"וה' סר מעליו\" - עזיבת ה' היא הטרגדיה האמיתית. פלשתים עיוורו את עיניו וכבלוהו בנחושתיים.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיָּחֶל שְׂעַר רֹאשׁוֹ לְצַמֵּחַ\"\nשאלה: מה קרה לשמשון בבית האסורים, ומה הרמז שמרמז הכתוב בפסוק הזה?", "a": "בבית האסורים שמשון \"טוחן בבית האסורים\" - עבודת עבדים. הכתוב מציין \"ויחל שער ראשו לצמח כאשר גולח\" - שערו חזר לגדול. זהו רמז לתקווה - גדילת השיער פותחת אפשרות לחידוש הנזירות וחידוש הכוח.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"זָכְרֵנִי נָא וְחַזְּקֵנִי נָא אַךְ הַפַּעַם הַזֶּה הָאֱלֹהִים\"\nשאלה: מה ביקש שמשון מה'? מה מגלה הבקשה על סדר עדיפויותיו?", "a": "שמשון ביקש: \"ואנקמה נקם אחת משתי עיני מפלשתים\". לא ביקש להינצל - ביקש נקמה. \"תמות נפשי עם פלשתים\" - ידע שימות. הבקשה מגלה שנקמת כבודו חשובה לו יותר מהצלת חייו - גיבור שכל תכליתו הנקמה.", "source": "text_questions/shoftim.md", "type": "text"}, {"q": "טקסט: \"וַיִּמֹת בְּמוֹתוֹ יוֹתֵר מֵאֲשֶׁר הֵמִית בְּחַיָּיו\"\nשאלה: מה האירוע שבו נהרגו יותר אנשים ממה שהרג שמשון בחייו? כמה נהרגו?", "a": "שמשון תפס את שני עמודי הביניים של בית דגון בעת חגיגת הפלישתים ונשען עליהם - \"ויפל הבית על הסרנים ועל כל העם\". \"שלשת אלפים איש ואשה\" היו על הגג, בנוסף לאלה שבפנים. מות שמשון הרג יותר ממה שהרג בכל חייו. \"וישפוט את ישראל עשרים שנה\".", "source": "text_questions/shoftim.md", "type": "text"}]}};

// Book selection
document.querySelectorAll('#bookBtns .choice-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#bookBtns .choice-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedBook = btn.dataset.book;
    selectedStory = 'all';
    populateStories();
    checkReady();
  });
});

function populateStories() {
  const section = document.getElementById('storySection');
  const grid = document.getElementById('storyGrid');
  grid.innerHTML = '';

  if (!selectedBook || selectedBook === 'all') {
    section.style.display = 'none';
    return;
  }

  // Collect unique story sources from this book's story questions
  const bookData = allData[selectedBook];
