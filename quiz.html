סט: \"וַיִּשְׁמַע אַבְרָם לְקוֹל שָׂרָי\"\nשאלה: הביטוי \"וישמע אברם לקול שרי\" חוזר בסיפור אחר בצורה דומה. באיזה סיפור ה' אומר לאברהם \"כל אשר תאמר אליך שרה שמע בקולה\"?", "a": "בסיפור גירוש הגר וישמעאל (פרק כ\"א:י\"ב) - כשה' אומר לאברהם לשמוע בקול שרה ולגרש את הגר ובנה. בשני המקרים אברהם שומע בקול שרה לגבי הגר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"יִשְׁפֹּט יְהוָה בֵּינִי וּבֵינֶיךָ\"\nשאלה: שרי קוראת לה' לשפוט בינה לבין אברם. מדוע היא מאשימה דווקא את אברם, הלא הגר היא שזלזלה?", "a": "שרי מאשימה את אברם כי נתנה את שפחתה בחיקו ועכשיו הגר מזלזלת בה - \"אנכי נתתי שפחתי בחיקך ותרא כי הרתה ואקל בעיניה\". היא רואה את אברם כאחראי כי לא עצר את הגר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אוּלַי אִבָּנֶה מִמֶּנָּה\"\nשאלה: מי אומרת \"אולי אבנה ממנה\", ומה פירוש \"אבנה\"?", "a": "שרי אומרת לאברם. \"אבנה\" מלשון בן - שיהיה לה בן דרך שפחתה הגר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַתְּעַנֶּהָ שָׂרַי וַתִּבְרַח\"\nשאלה: מי עינה את מי, ומה הקשר לציווי המלאך \"והתעני תחת ידיה\"?", "a": "שרי עינתה את הגר. המלאך ציווה את הגר לחזור ו\"להתענות\" תחת ידי שרי - לקבל את העינוי מרצון.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"יָדוֹ בַכֹּל וְיַד כֹּל בּוֹ\"\nשאלה: על מי נאמרה הנבואה \"ידו בכל ויד כל בו\", ומהו הביטוי שלפני כן?", "a": "על ישמעאל. לפני כן: \"פרא אדם\" - אדם פראי/חופשי. ועל פני כל אחיו ישכון.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אֲנִי אֵל שַׁדַּי הִתְהַלֵּךְ לְפָנַי\"\nשאלה: באיזה שם הציג ה' את עצמו לפי הפסוק, ומה השם החדש שקיבל אברם בהמשך ההתגלות הזו?", "a": "ה' הציג עצמו בשם \"אל שדי\". אברם קיבל את השם אברהם - \"כי אב המון גויים נתתיך\". גם שרי קיבלה שם חדש - שרה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּפֹּל אַבְרָהָם עַל פָּנָיו וַיִּצְחָק\"\nשאלה: מה עשה אברהם לפי הפסוק כשנודע לו על הבטחת הבן, ומה ביקש מה' בתגובה?", "a": "אברהם נפל על פניו וצחק. ביקש מה': \"לו ישמעאל יחיה לפניך\" - ביקש שישמעאל בנו הקיים יזכה בברכה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הִמּוֹל לָכֶם כָּל זָכָר\"\nשאלה: מה הציווי המתואר בפסוק, ומה העונש על מי שלא מקיים אותו?", "a": "הציווי הוא ברית המילה - \"המול לכם כל זכר\". העונש: \"וערל זכר אשר לא יימול את בשר ערלתו ונכרתה הנפש ההיא מעמיה את בריתי הפר\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיָּמׇל אֶת בְּשַׂר עׇרְלָתָם בְּעֶצֶם\"\nשאלה: לפי הכתוב, בן כמה היה כל אחד מהם בהימולו?", "a": "אברהם היה בן תשעים ותשע שנה (99) וישמעאל היה בן שלוש עשרה שנה (13).", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"שָׂרָה אִשְׁתְּךָ יֹלֶדֶת לְךָ בֵּן\"\nשאלה: מה הבטיח ה' לגבי ישמעאל למרות שהברית תהיה עם יצחק?", "a": "ה' הבטיח: \"ולישמעאל שמעתיך, הנה ברכתי אותו והפריתי אותו והרביתי אותו במאוד מאוד - שנים עשר נשיאים יוליד ונתתיו לגוי גדול\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְהָיָה שִׁמְךָ אַבְרָהָם\"\nשאלה: גם שרי קיבלה שם חדש. מה ה' הבטיח לגביה מלבד בן?", "a": "שמה החדש: שרה. ה' הבטיח: \"וברכתי אותה... והיתה לגויים מלכי עמים ממנה יהיו\" - מלכים ייצאו ממנה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וּבֶן שְׁמֹנַת יָמִים יִמּוֹל לָכֶם\"\nשאלה: הציווי למול בן שמונת ימים חל על מי מלבד ילידי הבית?", "a": "גם על \"מקנת כסף מכל בן נכר אשר לא מזרעך הוא\" - עבדים שנקנו בכסף מבן נכר גם חייבים להימול.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּפֹּל אַבְרָהָם עַל פָּנָיו וַיִּצְחָק\"\nשאלה: אברהם \"ויצחק\". שרה גם תצחק בפרק י\"ח. מה ההבדל בתגובת ה' לצחוק כל אחד?", "a": "ה' לא הוכיח את אברהם על צחוקו. אך כששרה צחקה, ה' שאל \"למה זה צחקה שרה\". תגובה שונה לאותה תגובה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"בְּרִיתִי אָקִים אֶת יִצְחָק\"\nשאלה: מתי בדיוק ייוולד יצחק לפי הפסוק, ומה מלמדת המילה \"אקים\" על הברית עם ישמעאל?", "a": "\"למועד הזה בשנה האחרת\" - בעוד שנה בדיוק. \"אקים\" (את בריתי אקים את יצחק) מלמדת שהברית תהיה דווקא עם יצחק ולא עם ישמעאל.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"נִמּוֹל אַבְרָהָם וְיִשְׁמָעֵאל בְּנוֹ\"\nשאלה: \"בעצם היום הזה\" מדגיש שהמילה נעשתה מיד. מי עוד נימול חוץ מאברהם וישמעאל?", "a": "\"וכל אנשי ביתו יליד בית ומקנת כסף מאת בן נכר נמולו אתו\" - כל אנשי ביתו, הן ילידי בית והן עבדים שנקנו בכסף.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"שְׁנֵים עָשָׂר נְשִׂיאִם יוֹלִיד\"\nשאלה: על מי נאמרה ההבטחה \"שנים עשר נשיאים יוליד\", ובתגובה לאיזו בקשה?", "a": "על ישמעאל. בתגובה לבקשת אברהם \"לו ישמעאל יחיה לפניך\" - ה' ברך את ישמעאל למרות שהברית תהיה עם יצחק.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הַלְּבֶן מֵאָה שָׁנָה יִוָּלֵד\"\nשאלה: מי אמר את הדברים בלבו, ומה הגילאים שהזכיר?", "a": "אברהם אמר בלבו. הזכיר שני גילאים: בן מאה שנה (לעצמו) ובת תשעים שנה (לשרה). נפל על פניו וצחק.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת\"\nשאלה: מי ייוולד \"למועד הזה בשנה האחרת\", ועם מי תהיה הברית?", "a": "יצחק ייוולד. \"את בריתי אקים את יצחק\" - הברית תהיה עם יצחק, לא עם ישמעאל.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיְכַל לְדַבֵּר אִתּוֹ\"\nשאלה: מה עשה ה' מיד אחרי שסיים לדבר עם אברהם, ומהי משמעות הביטוי \"ויעל אלוהים מעל אברהם\"?", "a": "\"ויכל לדבר אתו ויעל אלוהים מעל אברהם\" - ה' עלה מעליו, כלומר שכינת ה' הסתלקה. ביטוי ייחודי המתאר את סיום ההתגלות כעלייה פיזית.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְהָיִיתָ לְאַב הֲמוֹן\"\nשאלה: שינוי השם מ\"אברם\" ל\"אברהם\" - מה נוסף בשם ומה הפירוש המדויק שנותן הכתוב?", "a": "נוספה האות ה'. הכתוב מפרש: \"כי אב המון גויים נתתיך\" - אב = אב, רהם = המון (גויים). שינוי השם מסמל מעבר מ\"אב רם\" (אב נשגב) ל\"אב המון גויים\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לִבְרִית עוֹלָם לִהְיוֹת\"\nשאלה: הביטוי \"ברית עולם\" מופיע פעמיים בפרק י\"ז. במה עוסקת כל הופעה?", "a": "הופעה ראשונה (פסוק ז'): \"והקימותי את בריתי ביני ובינך... לברית עולם להיות לך לאלוהים\" - ברית הקשר בין ה' לאברהם. הופעה שנייה (פסוק י\"ג): \"והיתה בריתי בבשרכם לברית עולם\" - ברית המילה הפיזית בבשר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"יֹשֵׁב פֶּתַח הָאֹהֶל כְּחֹם הַיּוֹם\"\nשאלה: כמה אנשים ראה אברהם מיד אחרי, ואילו מאכלים הגיש להם?", "a": "שלושה אנשים. הגיש: חמאה, חלב ובן בקר רך וטוב (שרה הכינה עוגות משלוש סאים קמח סולת).", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַתִּצְחַק שָׂרָה בְּקִרְבָּהּ לֵאמֹר\"\nשאלה: מי אמרה את הדברים האלה, ומה היתה תגובת ה' כשגילה זאת?", "a": "שרה אמרה זאת בקרבה (בלבה). ה' אמר לאברהם: \"למה זה צחקה שרה... היפלא מה' דבר?\" שרה הכחישה מיראה - \"לא צחקתי\", וה' אמר \"לא כי צחקת\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"זַעֲקַת סְדֹם וַעֲמֹרָה כִּי רָבָּה\"\nשאלה: מה פתח אברהם וטען כשנודע לו על כוונת ה'?", "a": "אברהם טען: \"האף תספה צדיק עם רשע?\" ו\"השופט כל הארץ לא יעשה משפט?\" - ופתח משא ומתן על מספר הצדיקים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה\"\nשאלה: הפסוק מתאר את הבקשה האחרונה של אברהם. מאיזה מספר התחיל, ומה מיוחד בהורדה הראשונה?", "a": "התחיל מ-50. ההורדה הראשונה היתה רק ב-5 (מ-50 ל-45: \"אולי יחסרון חמישים הצדיקים חמישה\"), ולא ב-10 כמו ההורדות האחרות (40, 30, 20, 10).", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְאַבְרָהָם עוֹדֶנּוּ עֹמֵד לִפְנֵי יְהֹוָה\"\nשאלה: כמה מן האנשים הלכו לסדום לפי הפסוק, ומה קרה בסוף השיחה בין אברהם לה'?", "a": "\"האנשים\" (שניים) הלכו לסדום. בסוף: \"וילך ה' כאשר כילה לדבר אל אברהם ואברהם שב למקומו\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אַל נָא תַעֲבֹר מֵעַל עַבְדֶּךָ\"\nשאלה: מי אומר את הדברים ולמי, ומהם הדברים שהציע מיד אחרי?", "a": "אברהם אומר לאורחים (שלושת האנשים/המלאכים). הציע מיד: \"יוקח נא מעט מים ורחצו רגליכם והישענו תחת העץ. ואקחה פת לחם וסעדו לבכם\" - מים לרחיצה ואוכל.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הֲיִפָּלֵא מֵיְהֹוָה דָּבָר\"\nשאלה: בתגובה למה נאמרו הדברים האלה, ומה עשתה שרה כששמעה אותם?", "a": "נאמרו בתגובה לצחוק שרה בקרבה ולמילותיה \"אחרי בלותי היתה לי עדנה ואדוני זקן\". שרה הכחישה: \"לא צחקתי\" כי יראה, וה' אמר \"לא כי צחקת\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְאָנֹכִי עָפָר וָאֵפֶר\"\nשאלה: מי מתאר את עצמו כ\"עפר ואפר\", ובאיזה הקשר נאמרו הדברים?", "a": "אברהם מתאר את עצמו כך בזמן המשא ומתן עם ה' על צדיקי סדום. הוא ביקש להוריד מ-50 ל-45: \"אולי יחסרון חמישים הצדיקים חמישה, התשחית בחמישה את כל העיר?\"", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"חָדַל לִהְיוֹת לְשָׂרָה אֹרַח כַּנָּשִׁים\"\nשאלה: מהו \"אורח כנשים\" שחדל להיות לשרה, ולמה הכתוב מציין זאת דווקא כאן?", "a": "\"אורח כנשים\" הוא הווסת החודשית. הכתוב מציין שפסקה אצל שרה כדי להדגיש את הנס - שלמרות שכבר לא בגיל פוריות, תלד בן.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אַיֵּה שָׂרָה אִשְׁתֶּךָ\"\nשאלה: מי שואל \"איה שרה אשתך\" - ומדוע מפתיע שהם ידעו את שמה?", "a": "שלושת האנשים/המלאכים שואלים. הם ידעו את שם שרה למרות שלא הוצגו לה - מה שמרמז שאינם אנשים רגילים אלא מלאכים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לָמָּה זֶּה צָחֲקָה שָׂרָה\"\nשאלה: ה' מצטט את שרה כאומרת \"ואני זקנתי\". אך מה אמרה שרה בפועל - ומה השמיט ה' מדבריה?", "a": "שרה אמרה: \"אחרי בלותי היתה לי עדנה ואדוני זקן\" - היא אמרה שבעלה זקן! ה' השמיט את \"ואדוני זקן\" ואמר רק \"ואני זקנתי\" - שינוי לשמור על שלום הבית.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הַמְכַסֶּה אֲנִי מֵאַבְרָהָם\"\nשאלה: מהי הסיבה שנותן ה' לכך שמגלה לאברהם את כוונתו לגבי סדום?", "a": "\"כי ידעתיו למען אשר יצווה את בניו ואת ביתו אחריו ושמרו דרך ה' לעשות צדקה ומשפט\" - ה' מגלה כי אברהם יחנך את בניו לצדקה ומשפט.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְאַבְרָהָם שָׁב לִמְקֹמוֹ\"\nשאלה: מה המספר האחרון שאברהם הגיע אליו לפני שה' הלך, ולמה לא המשיך מתחת לו?", "a": "המספר האחרון היה עשרה. אברהם לא המשיך מתחת לעשרה - הכתוב לא מסביר מדוע עצר שם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"מַהֲרִי שְׁלֹשׁ סְאִים קֶמַח סֹלֶת\"\nשאלה: מי מצווה את מי בפסוק הזה, ומה התבקשה לעשות?", "a": "אברהם מצווה את שרה. ביקש ממנה ללוש ולעשות עוגות מ\"שלוש סאים קמח סולת\" לאורחים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לֹא כִּי צָחָקְתְּ\"\nשאלה: מי אומר \"לא כי צחקת\" ולמי, ומה אמרה הנמענת לפני?", "a": "ה' אומר לשרה. שרה הכחישה מיראה ואמרה \"לא צחקתי\", וה' הוכיח אותה: \"לא כי צחקת\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הַאַף תִּסְפֶּה צַדִּיק עִם רָשָׁע\"\nשאלה: כמה אנשים הלכו לכיוון סדום לפני שנאמרו הדברים האלה?", "a": "שני אנשים (מלאכים) הלכו לסדום. אברהם נשאר עומד לפני ה' ופתח את המשא ומתן.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּתֵּן אֶל הַנַּעַר\"\nשאלה: אברהם נתן את בן הבקר \"אל הנער\". מי הוא \"הנער\" שהכין את הבשר, ומה בדיוק הביא אברהם לפני האורחים?", "a": "\"הנער\" הוא משרת/עבד שהכין את בן הבקר. אברהם הביא לפני האורחים: חמאה, חלב, ובן הבקר אשר עשה - שלושה מאכלים. \"והוא עומד עליהם תחת העץ\" - עמד ושירת אותם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אֵרְדָה נָּא וְאֶרְאֶה\"\nשאלה: ה' אומר \"ארדה נא ואראה הכצעקתה הבאה אלי עשו כלה ואם לא אדעה\". מהי משמעות \"כלה\" בפסוק, ומדוע ה' \"יורד\" לבדוק?", "a": "\"כלה\" פירושו כליון/השמדה מוחלטת - \"האם עשו כליון כגודל הצעקה שעלתה אלי\". ה' \"יורד\" לא מפני שאינו יודע, אלא כדי ללמד שאין דנים בלי חקירה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"חָלִלָה לְּךָ מֵעֲשֹׂת\"\nשאלה: הביטוי \"חלילה לך\" מופיע פעמיים רצופות בדברי אברהם. מה המשפט השופטי שאברהם מטיח כלפי ה'?", "a": "\"חלילה לך מעשות כדבר הזה להמית צדיק עם רשע והיה כצדיק כרשע חלילה לך - השופט כל הארץ לא יעשה משפט?\" - אברהם טוען שה' כשופט כל הארץ חייב לנהוג בצדק.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְלוֹט יֹשֵׁב בְּשַׁעַר סְדֹם\"\nשאלה: מה קרה לפני שהמלאכים הספיקו ללכת לישון בבית לוט?", "a": "אנשי העיר - אנשי סדום - נסבו על הבית \"מנער ועד זקן כל העם מקצה\" ודרשו \"הוציאם אלינו ונדעה אותם\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הָאֶחָד בָּא לָגוּר וַיִּשְׁפֹּט שָׁפוֹט\"\nשאלה: מי אומר את הדברים האלה וכלפי מי, ומה עשו המלאכים מיד אחרי?", "a": "אנשי סדום אומרים זאת כלפי לוט - כועסים שהוא בא כגר ומתנהג כשופט. המלאכים משכו את לוט פנימה, סגרו הדלת, והכו את אנשי סדום בסנוורים \"מקטון ועד גדול וילאו למצוא הפתח\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"קוּמוּ צְּאוּ מִן הַמָּקוֹם הַזֶּה\"\nשאלה: כיצד הגיבו חתני לוט לדבריו, ומדוע נאלצו המלאכים לאחוז ביד לוט?", "a": "חתני לוט חשבו שהוא מצחק - \"ויהי כמצחק בעיני חתניו\". המלאכים נאלצו לאחוז ביד לוט, ביד אשתו וביד שתי בנותיו כי לוט התמהמה - \"בחמלת ה' עליו\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הִמְטִיר עַל סְדֹם וְעַל עֲמֹרָה\"\nשאלה: מה קרה לאשת לוט בזמן האירוע המתואר בפסוק, ומה ראה אברהם למחרת?", "a": "אשת לוט הביטה מאחוריו (למרות אזהרת המלאכים \"אל תביט אחריך\") ונהפכה לנציב מלח. אברהם השקיף וראה \"והנה עלה קיטור הארץ כקיטור הכבשן\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם\"\nשאלה: בזכות מי ניצל לוט לפי הפסוק, ומה שמות שני הבנים שנולדו לבנותיו?", "a": "לוט ניצל בזכות אברהם - \"ויזכור אלוהים את אברהם\". הבכירה ילדה את מואב (אבי מואב) והצעירה ילדה את בן-עמי (אבי בני עמון).", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הָעִיר הַזֹּאת קְרֹבָה... וְהִוא מִצְעָר\"\nשאלה: מי מבקש את הבקשה הזו ומדוע, ומה השם שניתן לעיר?", "a": "לוט מבקש מהמלאכים. הוא חשש שלא יספיק להימלט ההרה - \"פן תדבקני הרעה ומתי\". ביקש לברוח לעיר קטנה קרובה. העיר נקראה צוער (מלשון \"מצער\" - קטנה).", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הִנֵּה נָא לִי שְׁתֵּי בָנוֹת\"\nשאלה: מי מציע את ההצעה הזו ולמי, ומהי הסיבה שנתן להגנה על אורחיו?", "a": "לוט מציע לאנשי סדום את שתי בנותיו כדי להגן על אורחיו. הסיבה: \"כי על כן באו בצל קורתי\" - חובת הכנסת אורחים. אך אנשי סדום סירבו וכעסו עוד יותר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אָבִינוּ זָקֵן וְאִישׁ אֵין בָּאָרֶץ\"\nשאלה: מי אומרת את הדברים ולמי, ומה היתה התוכנית שהציעה?", "a": "הבכירה (בת לוט הגדולה) אומרת לצעירה (אחותה הקטנה). התוכנית: \"לכה נשקה את אבינו יין ונשכבה עמו ונחיה מאבינו זרע\" - להשקות את לוט יין ולשכב עמו כדי להמשיך את הזרע.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּפְצַר בָּם מְאֹד\"\nשאלה: מה ענו המלאכים בתחילה כשלוט הזמינם, ומה המאכל הספציפי שהכין להם?", "a": "המלאכים ענו \"לא כי ברחוב נלין\" - סירבו בתחילה. לוט הפציר בהם מאוד. המאכל: מצות - \"ומצות אפה ויאכלו\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"כִּי מַשְׁחִתִים אֲנַחְנוּ אֶת הַמָּקוֹם הַזֶּה\"\nשאלה: מי אומר \"משחיתים אנחנו\" ובכך חושף את מטרת בואו? ומה ציוו את לוט לעשות?", "a": "המלאכים אומרים ללוט. ציוו: \"עוד מי לך פה, חתן ובניך ובנותיך וכל אשר לך בעיר הוצא מן המקום\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּתְמַהְמָהּ וַיַּחֲזִיקוּ הָאֲנָשִׁים בְּיָדוֹ\"\nשאלה: כמה נפשות ניצלו מסדום לפי הפסוק, ומה הסיבה שנתן הכתוב לכך שאחזו בהם?", "a": "ארבע נפשות: לוט, אשתו ושתי בנותיו. הסיבה: \"בחמלת ה' עליו\". בפועל רק שלוש ניצלו כי אשתו הפכה לנציב מלח.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"כִּי יָרֵא לָשֶׁבֶת בְּצוֹעַר\"\nשאלה: לוט ביקש לברוח לצוער כי פחד מההר. מדוע בסוף עזב את צוער?", "a": "לוט \"ירא לשבת בצוער\" - פחד שגם היא תיחרב, וישב במערה עם בנותיו בהר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְלֹא יָדַע בְּשִׁכְבָהּ וּבְקוּמָהּ\"\nשאלה: הביטוי הזה חוזר פעמיים בסיפור בנות לוט. על מי נאמר בפעם הראשונה ומה היה שונה בלילה השני?", "a": "בפעם הראשונה נאמר על הבכירה. בלילה השני הצעירה שכבה עם לוט. בשני הלילות הנוסח זהה - \"ולא ידע בשכבה ובקומה\" - לוט היה שיכור מיין.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"גׇּפְרִית וָאֵשׁ מֵאֵת יְהוָה\"\nשאלה: מה חוץ מסדום ועמורה נהפך לפי הפסוק?", "a": "\"ויהפוך את הערים האל ואת כל הככר ואת כל יושבי הערים וצמח האדמה\" - גם ערים נוספות, כל הככר, היושבים והצמחייה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הִמָּלֵט עַל נַפְשְׁךָ\"\nשאלה: שלושה איסורים ניתנו ללוט בבריחה. מהם?", "a": "(1) \"אל תביט אחריך\", (2) \"אל תעמוד בכל הככר\", (3) \"ההרה הימלט\" - לברוח להר. לוט ביקש במקום זה לברוח לצוער.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"קָרָא שְׁמוֹ מוֹאָב\"\nשאלה: מי קראה לבנה \"מואב\" - הבכירה או הצעירה, ומה שם בנה של האחרת?", "a": "הבכירה קראה לבנה מואב (אבי מואב). הצעירה קראה לבנה בן-עמי (אבי בני עמון).", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"מִנַּעַר וְעַד זָקֵן\"\nשאלה: הפסוק מתאר \"מנער ועד זקן כל העם מקצה\". מהי משמעות \"מקצה\" כאן, ומדוע חשוב הפרט הזה?", "a": "\"מקצה\" פירושו מכל קצוות העיר - אנשי סדום באו מכל חלקי העיר, לא רק מהשכנים הקרובים. זה מוכיח שכל העם היו רשעים, לא רק קבוצה מסוימת - ולכן לא נמצאו אפילו עשרה צדיקים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לֹא כִּי בָרְחוֹב נָלִין\"\nשאלה: המלאכים סירבו להיכנס לבית לוט ואמרו \"כי ברחוב נלין\". מה ההבדל בין הכנסת האורחים של אברהם לזו של לוט?", "a": "אברהם: שלושה אנשים אמרו מיד \"כן תעשה כאשר דיברת\" (הסכימו). לוט: המלאכים סירבו בתחילה \"לא כי ברחוב נלין\" ולוט נאלץ להפציר בהם מאוד. אברהם הגיש חמאה וחלב ובשר, ולוט הגיש מצות בלבד.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"כִּי לֹא אוּכַל לַעֲשׂוֹת\"\nשאלה: המלאך אומר ללוט \"מהר הימלט שמה כי לא אוכל לעשות דבר עד בואך שמה\". מה מרמזת האמירה הזו על מעמד צוער?", "a": "המלאך לא יכל להחריב את סדום עד שלוט הגיע לצוער - כלומר צוער ניצלה בזכות בקשת לוט. \"על כן קרא שם העיר צוער\" (מלשון מצער/קטנה). זה מראה שהחורבן היה מדויק ומבוקר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"בְּתׇם לְבָבִי וּבְנִקְיֹן כַּפַּי\"\nשאלה: מי אומר את הדברים, ומה ענה ה' על טענת תום הלב?", "a": "אבימלך מלך גרר אומר לה' בחלום. ה' ענה: \"גם אנכי ידעתי כי בתם לבבך עשית זאת ואחשוך גם אנכי אותך מחטוא לי, על כן לא נתתיך לנגוע אליה\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"רַק אֵין יִרְאַת אֱלֹהִים בַּמָּקוֹם\"\nשאלה: מהו הנימוק שנותן הדובר, ומה גילה בהמשך על הקשר המשפחתי האמיתי בינו לבין אשתו?", "a": "אברהם נימק שחשש שאין יראת אלוהים במקום. גילה: \"וגם אמנה אחותי בת אבי היא אך לא בת אמי ותהי לי לאישה\" - שרה היתה אחותו מצד האב.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיָּשֶׁב לוֹ אֵת שָׂרָה אִשְׁתּוֹ\"\nשאלה: מה עוד נתן אבימלך מלבד המתנות המוזכרות בפסוק?", "a": "אבימלך נתן אלף כסף לשרה שכינה \"כסות עיניים\", ואמר לאברהם \"הנה ארצי לפניך, בטוב בעיניך שב\" - הציע לו לגור בכל מקום שירצה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּתְפַּלֵּל אַבְרָהָם אֶל הָאֱלֹהִים וַיִּרְפָּא\"\nשאלה: באיזה תואר כונה אברהם לראשונה בסיפור זה, שבזכותו התפילה המתוארת כאן היתה אפשרית?", "a": "אברהם כונה \"נביא\" לראשונה: \"כי נביא הוא ויתפלל בעדך וחיה\" - ה' אמר לאבימלך שאברהם הוא נביא.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"עָצֹר עָצַר יְהוָה בְּעַד כָּל רֶחֶם\"\nשאלה: מהו העונש המתואר בפסוק, ומה הקשר לתפילת אברהם?", "a": "ה' עצר כל רחם לבית אבימלך בגלל לקיחת שרה. בעקבות תפילת אברהם, ה' ריפא את אבימלך ואת אשתו ואמהותיו \"וילדו\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְהִיא גַם הִוא אָמְרָה אָחִי\"\nשאלה: מי חוץ מאברהם אישר את השקר לפי הפסוק, ולמי אבימלך מתגונן?", "a": "גם שרה עצמה אישרה: \"והיא גם היא אמרה אחי הוא\". אבימלך מתגונן בפני ה' בחלום, וטוען \"בתם לבבי ובנקיון כפי\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הִנְּךָ מֵת עַל הָאִשָּׁה\"\nשאלה: מי אומר את הדברים האלה ולמי, ומה פירוש \"בעולת בעל\"?", "a": "ה' אומר לאבימלך בחלום הלילה. \"בעולת בעל\" פירושו אישה נשואה - שיש לה בעל.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אֲחֹתִי בַת אָבִי הִוא\"\nשאלה: מהו הפרט המפתיע שאברהם חושף על קשרו עם שרה?", "a": "שרה היא באמת אחותו מצד האב (\"בת אבי\") אך לא מצד האם (\"אך לא בת אמי\") - הטענה \"אחותי היא\" היתה חצי-אמת.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הִנֵּה אַרְצִי לְפָנֶיךָ\"\nשאלה: מה ההבדל בין תגובת אבימלך לתגובת פרעה בסיפור דומה?", "a": "פרעה גירש את אברהם - \"ויצו עליו פרעה אנשים וישלחו אותו\". אבימלך הזמין להישאר: \"הנה ארצי לפניך בטוב בעיניך שב\" - הפוך לגמרי.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אֶלֶף כֶּסֶף לְאָחִיךְ\"\nשאלה: אבימלך מכנה את אברהם \"אחיך\" בדברו עם שרה. מדוע בחר דווקא בכינוי הזה?", "a": "אבימלך משתמש ב\"אחיך\" בצורה עוקצנית - כי אברהם הציג עצמו כאחי שרה. הוא מזכיר את השקר תוך מתן אלף הכסף כ\"כסות עיניים\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"כִּי נָבִיא הוּא וְיִתְפַּלֵּל\"\nשאלה: מי מכונה \"נביא\" ומי אמר עליו כך?", "a": "אברהם מכונה \"נביא\" - ה' אמר לאבימלך בחלום: \"כי נביא הוא ויתפלל בעדך וחיה\". זו הפעם הראשונה שאברהם נקרא נביא.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"כְּסוּת עֵינַיִם לְכֹל\"\nשאלה: מהי \"כסות עיניים\" ולמי ניתנה?", "a": "אלף כסף שאבימלך נתן לשרה. \"כסות עיניים\" - כסף שנועד לכסות/לכפר על מה שקרה, לעיני כל.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"עָצֹר עָצַר בְּעַד כָּל רֶחֶם\"\nשאלה: מי נרפא בתפילת אברהם מלבד אבימלך עצמו?", "a": "\"וירפא אלוהים את אבימלך ואת אשתו ואמהותיו וילדו\" - גם אשתו וגם אמהותיו (פילגשיו/שפחותיו) נרפאו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הִתְעוּ אֹתִי אֱלֹהִים מִבֵּית\"\nשאלה: אברהם אומר \"כאשר התעו אותי אלוהים מבית אבי\". מהו הפועל \"התעו\" בלשון רבים, ומתי סיכם אברהם עם שרה את ההסכם?", "a": "\"התעו\" בלשון רבים (ולא \"התעה\" ביחיד) - צורה מיוחדת. אברהם גילה שההסכם עם שרה היה מתחילת נדודיו: \"ואומר לה זה חסדך אשר תעשי עמדי, אל כל המקום אשר נבוא שמה אמרי לי אחי הוא\" - הסכם מראש, לא החלטה מקומית.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הֲגוֹי גַּם צַדִּיק תַּהֲרֹג\"\nשאלה: אבימלך שואל \"הגוי גם צדיק תהרוג\" - ביטוי שמזכיר את טענת אברהם על סדום. מה ההקבלה בין שתי הטענות?", "a": "אברהם טען על סדום \"האף תספה צדיק עם רשע\" (י\"ח:כ\"ג). אבימלך טוען \"הגוי גם צדיק תהרוג\" (כ':ד'). שניהם מעלים את אותה טענה מוסרית כלפי ה': אין להעניש צדיק. ההבדל: אברהם דיבר על אחרים, אבימלך על עצמו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיהוָה פָּקַד אֶת שָׂרָה כַּאֲשֶׁר אָמָר\"\nשאלה: מה אמרה שרה לאחר הלידה המתוארת כאן?", "a": "שרה אמרה: \"צחוק עשה לי אלוהים, כל השומע יצחק לי\" ו\"מי מלל לאברהם היניקה בנים שרה כי ילדתי בן לזקוניו\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אֶת בֶּן הָגָר הַמִּצְרִית... מְצַחֵק\"\nשאלה: מה דרשה שרה מאברהם בעקבות מה שראתה, וכיצד הגיב?", "a": "שרה דרשה: \"גרש את האמה הזאת ואת בנה כי לא יירש בן האמה הזאת עם בני עם יצחק\". הדבר היה רע מאוד בעיני אברהם \"על אודות בנו\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"כֹּל אֲשֶׁר תֹּאמַר אֵלֶיךָ שָׂרָה\"\nשאלה: מה הסיבה שנתן ה' לכך שאברהם צריך לשמוע בקול שרה?", "a": "\"כי ביצחק יקרא לך זרע\" - הזרע העיקרי ייקרא על שם יצחק. ולישמעאל: \"וגם את בן האמה לגוי אשימנו כי זרעך הוא\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּכְלוּ הַמַּיִם מִן הַחֵמֶת\"\nשאלה: את קולו של מי שמע ה' - של האם או של הנער?", "a": "ה' שמע דווקא את קול הנער: \"וישמע אלוהים את קול הנער\". ואז פקח את עיני הגר ותרא באר מים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיְהִי אֱלֹהִים אֶת הַנַּעַר וַיִּגְדָּל\"\nשאלה: באיזה מדבר ישב הנער המתואר בפסוק, ומאיפה לקחה לו אמו אישה?", "a": "ישמעאל ישב במדבר פארן. אמו לקחה לו אישה מארץ מצרים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר וַיִּקַּח לֶחֶם\"\nשאלה: מה נתן אברהם להגר לפני שילוחה, ולאן הלכה הגר?", "a": "אברהם נתן לחם וחמת מים, שם על שכמה, ואת הילד. הגר הלכה \"ותתע במדבר באר שבע\" - תעתה במדבר באר שבע.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הַרְחֵק כִּמְטַחֲוֵי קֶשֶׁת\"\nשאלה: באיזה מרחק ישבה הגר מהילד ומדוע, ומה עשתה מיד אחרי?", "a": "ישבה מנגד \"הרחק כמטחווי קשת\" (כטווח ירייה של קשת) כי אמרה \"אל אראה במות הילד\". מיד אחרי: \"ותשב מנגד ותישא את קולה ותבך\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"מִשְׁתֶּה גָדוֹל בְּיוֹם הִגָּמֵל\"\nשאלה: מה האירוע שבעקבותיו נערך המשתה, ומה ראתה שרה מיד אחריו שגרם לה לדרוש את גירוש הגר?", "a": "המשתה נערך ביום שיצחק נגמל (הפסיק לינוק). מיד אחרי שרה ראתה את בן הגר \"מצחק\" - ובעקבות כך דרשה: \"גרש את האמה הזאת ואת בנה\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיְהִי אֱלֹהִים אֶת הַנַּעַר\"\nשאלה: מי הוא \"הנער\" בפסוק, ומה היה מקצועו?", "a": "הנער הוא ישמעאל. מקצועו: \"ויהי רובה קשת\" - היה קשת. ישב במדבר פארן.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּפְקַח אֱלֹהִים אֶת עֵינֶיהָ\"\nשאלה: את עיני מי פקח ה', ומה מפתיע - האם הבאר נוצרה עכשיו?", "a": "ה' פקח את עיני הגר. הפסוק אומר \"ויפקח את עיניה ותרא באר\" - לא כתוב שה' ברא באר, אלא שפקח עיניה לראות באר שכבר היתה שם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"כִּי בְיִצְחָק יִקָּרֵא לְךָ זָרַע\"\nשאלה: מי אומר את הדברים האלה ולמי, ומה נאמר מיד אחרי על בן האמה?", "a": "ה' אומר לאברהם. מיד אחרי: \"וגם את בן האמה לגוי אשימנו כי זרעך הוא\" - גם ישמעאל יהיה לגוי כי הוא זרע אברהם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"צְחֹק עָשָׂה לִי אֱלֹהִים\"\nשאלה: מה ההבדל בין הצחוק של שרה כאן לצחוק שלה בפרק י\"ח?", "a": "בפרק י\"ח שרה צחקה מחוסר אמונה וה' הוכיח אותה. כאן הצחוק הוא של שמחה - \"צחוק עשה לי אלוהים\" - צחוק חיובי אחרי הלידה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁמַע אֱלֹהִים אֶת קוֹל הַנַּעַר\"\nשאלה: ה' שמע את קול הנער. אך מי בכה לפי הפסוק הקודם - הנער או אמו?", "a": "דווקא הגר בכתה: \"ותישא את קולה ותבך\". אך ה' שמע את קול הנער - \"כי שמע אלוהים אל קול הנער באשר הוא שם\" - לא את קול האם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"בֶּן מְאַת שָׁנָה בְּהִוָּלֶד לוֹ\"\nשאלה: בן כמה היה אברהם כשנולד יצחק, ובן כמה ימים נימול?", "a": "אברהם היה בן מאה שנה. יצחק נימול בן שמונת ימים - \"כאשר ציווה אותו אלוהים\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַתֵּשֶׁב מִנֶּגֶד וַתִּשָּׂא קֹלָהּ\"\nשאלה: מי ישבה מנגד ובכתה, ואת קולו של מי שמע אלוהים?", "a": "הגר ישבה מנגד ובכתה. אך אלוהים שמע דווקא את \"קול הנער\" (ישמעאל) - לא את קול האם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיְהִי רֹבֶה קַשָּׁת\"\nשאלה: מי היה \"רובה קשת\", באיזה מדבר ישב, ומאיפה לקחה לו אמו אישה?", "a": "ישמעאל. ישב במדבר פארן. אמו הגר לקחה לו אישה מארץ מצרים - מולדתה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וּפִיכֹל שַׂר צְבָאוֹ\"\nשאלה: בסוף הפרק אבימלך ופיכול כורתים ברית עם אברהם. מי היה פיכול, ומהו הוויכוח שפרץ בין אברהם לאבימלך?", "a": "פיכול היה שר צבא אבימלך. הוויכוח: \"והוכיח אברהם את אבימלך על אודות באר המים אשר גזלו עבדי אבימלך\" - עבדי אבימלך גזלו באר שאברהם חפר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"שֶׁבַע כִּבְשֹׂת הַצֹּאן\"\nשאלה: מדוע הציב אברהם שבע כבשות לבדן, ומה הקשר בין שבע הכבשות לשם \"באר שבע\"?", "a": "אברהם הציב שבע כבשות כעדות שהוא חפר את הבאר: \"כי את שבע כבשות תיקח מידי בעבור תהיה לי לעדה כי חפרתי את הבאר הזאת\". השם \"באר שבע\" - \"כי שם נשבעו שניהם\" - מלשון שבועה ומלשון שבע.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּטַּע אֶשֶׁל בִּבְאֵר שָׁבַע\"\nשאלה: מה נטע אברהם בבאר שבע, ומהו שם ה' הייחודי שבו קרא שם?", "a": "אברהם נטע אשל (עץ). קרא בשם ה' בתואר ייחודי: \"אל עולם\" - \"ויקרא שם בשם ה' אל עולם\". שם זה מופיע כאן לראשונה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"קַח נָא אֶת בִּנְךָ אֶת יְחִידְךָ\"\nשאלה: הפסוק מתאר ציווי - כמה ימים ארך המסע עד שהגיעו, ומה אמר אברהם לנערים?", "a": "ביום השלישי נשא אברהם את עיניו וראה את המקום. לנערים אמר: \"שבו לכם פה עם החמור ואני והנער נלכה עד כה ונשתחווה ונשובה אליכם\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הִנֵּה הָאֵשׁ וְהָעֵצִים וְאַיֵּה הַשֶּׂה\"\nשאלה: מי שואל את השאלה הזו ומי עונה, ומה היתה התשובה?", "a": "יצחק שואל את אברהם אביו. אברהם ענה: \"אלוהים יראה לו השה לעולה בני\". ויצחק נשא את עצי העולה ואברהם לקח את האש והמאכלת.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אַבְרָהָם אַבְרָהָם וַיֹּאמֶר הִנֵּנִי\"\nשאלה: מה עשה אברהם בדיוק לפני שהמלאך קרא לו, ומה היתה הסיבה לעצירה?", "a": "אברהם שלח את ידו ולקח את המאכלת לשחוט את בנו. הסיבה: \"כי עתה ידעתי כי ירא אלוהים אתה ולא חשכת את בנך את יחידך ממני\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְהִנֵּה אַיִל אַחַר נֶאֱחַז בַּסְּבַךְ\"\nשאלה: מה קרא אברהם למקום, ומדוע מפתיע שנמצא דווקא איל?", "a": "קרא למקום \"ה' יראה\". המפתיע: אברהם אמר ליצחק \"אלוהים יראה לו השה לעולה\" - אך בפועל מה שנמצא היה איל ולא שה (כבש).", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"כְּכוֹכְבֵי הַשָּׁמַיִם וְכַחוֹל אֲשֶׁר\"\nשאלה: לאיזה שני דברים נדמה זרע אברהם בפסוק הזה, ולאן חזר אברהם לאחר מכן?", "a": "זרע אברהם נדמה לכוכבי השמים ולחול אשר על שפת הים. אברהם שב אל נעריו והלכו יחדיו אל באר שבע.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְהָאֱלֹהִים נִסָּה אֶת אַבְרָהָם\"\nשאלה: אברהם עונה \"הנני\" כאן. מתי בסיפור הוא עונה \"הנני\" שוב, ולמי?", "a": "אברהם עונה \"הנני\" שוב כשמלאך ה' קורא \"אברהם אברהם\" לעצור את השחיטה (כ\"ב:י\"א). גם כשיצחק קורא \"אבי\" אברהם עונה \"הנני בני\" (כ\"ב:ז').", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הָאֵשׁ וְאֶת הַמַּאֲכֶלֶת\"\nשאלה: מי נשא את עצי העולה, ומה המיוחד בביטוי \"וילכו שניהם יחדו\" שחוזר פעמיים?", "a": "יצחק נשא את עצי העולה. הביטוי חוזר בפסוק ו' ובפסוק ח' - לפני ואחרי שאלת יצחק \"ואיה השה לעולה\" - שניהם ממשיכים יחד למרות הידיעה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיַּעֲרֹךְ אֶת הָעֵצִים וַיַּעֲקֹד\"\nשאלה: מהם ארבעת השלבים שעשה אברהם לפי הפסוק, בסדר מדויק?", "a": "(1) בנה מזבח, (2) ערך עצים, (3) עקד את יצחק, (4) שם אותו על המזבח ממעל לעצים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְיִרַשׁ זַרְעֲךָ אֵת שַׁעַר אֹיְבָיו\"\nשאלה: מה הביטוי שמראה שהבטחה זו היא שבועה ולא רק הבטחה רגילה?", "a": "\"בי נשבעתי נאום ה'\" - ה' נשבע בעצמו. זוהי הפעם היחידה בסיפורי אברהם שה' נשבע, \"יען אשר עשית את הדבר הזה\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וּבְתוּאֵל יָלַד אֶת רִבְקָה\"\nשאלה: הפסוקים האחרונים של הפרק מספרים בשורה משפחתית. מי היא מלכה, ואיזו נכדה שלה חשובה לסיפור הבא?", "a": "מלכה היא אשת נחור אחי אברהם. הנכדה החשובה: רבקה בת בתואל - שתהיה אשת יצחק בסיפור השידוך.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּשָּׂא אַבְרָהָם אֶת עֵינָיו\"\nשאלה: מה ראה אברהם כשנשא עיניו אחרי שהמלאך עצר אותו, ובמה נאחז?", "a": "ראה \"איל אחר נאחז בסבך בקרניו\" - איל שנתפס בקרניו בסבך. העלה אותו לעולה תחת בנו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"בִּי נִשְׁבַּעְתִּי נְאֻם יְהוָה\"\nשאלה: מדוע נשבע ה' בעצמו, ומה המיוחד בשבועה הזו?", "a": "\"יען אשר עשית את הדבר הזה ולא חשכת את בנך את יחידך\" - בגלל מעשה העקדה. זוהי הפעם היחידה בסיפורי אברהם שה' נשבע.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"שְׁבוּ לָכֶם פֹּה עִם הַחֲמוֹר\"\nשאלה: למי אמר אברהם \"שבו לכם פה\", ומה הבטיח שיקרה?", "a": "אמר לשני נעריו. הבטיח: \"ואני והנער נלכה עד כה ונשתחווה ונשובה אליכם\" - אמר \"ונשובה\" בלשון רבים, כאילו שניהם יחזרו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"עוּץ בְּכֹרוֹ וְאֶת בּוּז\"\nשאלה: בסוף פרק כ\"ב, מלכה אשת נחור ילדה שמונה בנים. מנה את הבכור ואת האחרון שבהם, ומיהי הנכדה החשובה?", "a": "הבכור: עוץ. האחרון (השמיני): בתואל. הנכדה החשובה: \"ובתואל ילד את רבקה\" - רבקה שתהפוך לאשת יצחק. כל שמונת הבנים: עוץ, בוז, קמואל, כשד, חזו, פלדש, ידלף, בתואל.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וּפִילַגְשׁוֹ וּשְׁמָהּ רְאוּמָה\"\nשאלה: מלבד מלכה, לנחור היתה גם פילגש. מה שמה וכמה בנים ילדה?", "a": "שם הפילגש: ראומה. ילדה ארבעה בנים: טבח, גחם, תחש ומעכה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לֶךְ לְךָ אֶל אֶרֶץ הַמֹּרִיָּה\"\nשאלה: הביטוי \"לך לך\" מופיע פעמיים בסיפורי אברהם. היכן הפעם הראשונה והיכן השנייה, ומה ההקבלה?", "a": "הפעם הראשונה: \"לך לך מארצך\" (י\"ב:א') - ללכת לארץ לא ידועה. הפעם השנייה: \"לך לך אל ארץ המוריה\" (כ\"ב:ב') - ללכת לעקוד את בנו. שתי פעמים ה' מצווה \"לך לך\" למקום שיראה - ניסיון ראשון וניסיון אחרון.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּהְיוּ חַיֵּי שָׂרָה מֵאָה שָׁנָה\"\nשאלה: כמה שנים חיתה שרה לפי הפסוק, והיכן מתה?", "a": "127 שנים (מאה ועשרים ושבע). מתה בקריית ארבע היא חברון, בארץ כנען.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"גֵּר וְתוֹשָׁב אָנֹכִי עִמָּכֶם\"\nשאלה: כיצד כינו בני חת את אברהם בתגובה לדבריו?", "a": "בני חת כינו אותו \"נשיא אלוהים אתה בתוכנו\" והציעו לו לקבור במבחר קבריהם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הַשָּׂדֶה נָתַתִּי לָךְ וְהַמְּעָרָה\"\nשאלה: למרות ההצעה המתוארת בפסוק, מה עשה אברהם וכמה שילם?", "a": "אברהם התעקש לשלם ושקל לעפרון ארבע מאות שקל כסף \"עובר לסוחר\". סירב לקבל מתנה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"שְׂדֵה עֶפְרוֹן אֲשֶׁר בַּמַּכְפֵּלָה\"\nשאלה: מה בדיוק כלל הרכישה לפי הפסוק, מלבד המערה עצמה?", "a": "הרכישה כללה את השדה, את המערה, ואת כל העץ אשר בשדה אשר בכל גבולו סביב - לא רק את המערה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"קָבַר אַבְרָהָם אֶת שָׂרָה... מְעָרַת הַמַּכְפֵּלָה\"\nשאלה: מהו השם המלא של מקום הקבורה לפי הפסוק, ומי מכר את המקום?", "a": "\"מערת שדה המכפלה על פני ממרא היא חברון\". עפרון בן צוחר החתי מכר, והעסקה נעשתה לעיני בני חת \"בכל באי שער עירו\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"גֵּר וְתוֹשָׁב אָנֹכִי עִמָּכֶם\"\nשאלה: מה הסתירה בכינוי \"גר ותושב\" שאברהם משתמש בו?", "a": "\"גר\" הוא זר ו\"תושב\" הוא קבוע - שני המושגים סותרים. אברהם מביע שהוא זר שנשתקע ביניהם וזקוק לאחוזת קבר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף\"\nשאלה: מי אומר את המילים ומה מיוחד באופן שהוא מציג את המחיר?", "a": "עפרון אומר לאברהם. הוא מציג 400 שקל כסף כזניח - \"מה היא\" - כאילו דבר של מה בכך, למרות שזה סכום גבוה מאוד.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיָּבֹא אַבְרָהָם לִסְפֹּד לְשָׂרָה וְלִבְכֹּתָהּ\"\nשאלה: \"ויבא אברהם\" - מה מרמזת המילה \"ויבא\" על מקומו של אברהם כששרה מתה?", "a": "\"ויבא\" מרמז שאברהם הגיע ממקום אחר - לא היה ליד שרה כשמתה. שרה מתה בחברון ואברהם בא אליה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁתַּחוּ אַבְרָהָם לִפְנֵי עַם הָאָרֶץ\"\nשאלה: כמה פעמים השתחווה אברהם בסיפור הזה?", "a": "פעמיים: פעם ראשונה \"לעם הארץ לבני חת\" (כ\"ג:ז') ופעם שנייה \"לפני עם הארץ\" (כ\"ג:י\"ב) כשעפרון הציע את השדה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁקֹל אַבְרָהָם לְעֶפְרֹן\"\nשאלה: מהו \"עובר לסוחר\" ומה זה מלמד על סוג הכסף ששולם?", "a": "\"עובר לסוחר\" פירושו מטבע מקובל בסחר - כסף מזומן במשקל תקני. אברהם שילם במיטב הכסף, לא בכסף פגום.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"נְשִׂיא אֱלֹהִים אַתָּה בְּתוֹכֵנוּ\"\nשאלה: מי כינה את אברהם \"נשיא אלוהים\", ומה הציעו לו?", "a": "בני חת. הציעו: \"במבחר קברינו קבור את מתך, איש ממנו את קברו לא יכלה ממך\" - לקבור בכל קבר שיבחר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לְעֵינֵי בְנֵי עַמִּי נְתַתִּיהָ\"\nשאלה: מי אומר \"נתתיה לך\", ומה הציע לתת בחינם?", "a": "עפרון החתי. הציע את השדה והמערה בחינם: \"השדה נתתי לך והמערה אשר בו\". אך אברהם התעקש לשלם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"בְּקִרְיַת אַרְבַּע הִוא חֶבְרוֹן\"\nשאלה: הפסוק מזהה שני שמות לאותו מקום. מהם, ומה שם המערה שנקנתה שם?", "a": "קריית ארבע היא חברון. המערה: מערת המכפלה, על פני ממרא.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"בְּכֶסֶף מָלֵא יִתְּנֶנָּה\"\nשאלה: אברהם ביקש את המערה \"בכסף מלא\" - מדוע הדגיש \"מלא\" ומה זה מרמז על עפרון?", "a": "\"כסף מלא\" פירושו מחיר מלא בלי הנחה. אברהם הדגיש שרוצה לשלם מחיר מלא ולא לקבל מתנה, כדי שהקנייה תהיה חוקית ובלתי ניתנת לערעור. זה מנוגד להצעות עפרון \"נתתי לך\" שהיו נימוסיות בלבד.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה\"\nשאלה: הפסוק מפרט את הרכישה בדיוק משפטי. מהם שלושת הרכיבים שעברו לאברהם?", "a": "(1) השדה, (2) המערה אשר בו, (3) וכל העץ אשר בשדה אשר בכל גבולו סביב. פירוט משפטי מדויק \"לעיני בני חת בכל באי שער עירו\" - עדים רבים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"שִׂים נָא יָדְךָ תַּחַת יְרֵכִי\"\nשאלה: מה השביע אברהם את עבדו, ומה ענה כשהעבד שאל \"מה אם האישה לא תרצה לבוא\"?", "a": "השביעו שלא ייקח אישה ליצחק מבנות הכנעני אלא ילך אל ארצו ומולדתו. ענה: \"ה' ישלח מלאכו לפניך\", ואם לא תרצה - \"ונקית משבועתי, רק את בני לא תשב שמה\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הַטִּי נָא כַדֵּךְ וְאֶשְׁתֶּה\"\nשאלה: מי מתפלל את התפילה המתוארת בפסוק, ומה המבחן שהוא מציב?", "a": "עבד אברהם מתפלל ליד הבאר בעיר נחור. המבחן: הנערה שתציע לא רק להשקות אותו אלא גם את הגמלים - היא שה' הוכיח ליצחק.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"נֶזֶם זָהָב בֶּקַע מִשְׁקָלוֹ\"\nשאלה: מה היו התכשיטים ומשקלם לפי הפסוק, ומי היתה הנערה שקיבלה אותם?", "a": "נזם זהב (בקע משקלו) ושני צמידים (עשרה זהב משקלם). הנערה היתה רבקה, בת בתואל בן מלכה אשר ילדה לנחור אחי אברהם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"מֵיְהוָה יָצָא הַדָּבָר\"\nשאלה: כשנשאלה רבקה \"התלכי עם האיש הזה\" - מה ענתה?", "a": "רבקה ענתה בתשובה קצרה ונחרצת: \"אלך\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיֵּצֵא יִצְחָק לָשׂוּחַ בַּשָּׂדֶה\"\nשאלה: מה עשתה רבקה כשראתה את יצחק, ומאיפה בא יצחק?", "a": "רבקה נפלה מעל הגמל, לקחה צעיף והתכסתה. יצחק בא מבוא באר לחי ראי והוא יושב בארץ הנגב.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"מִשְׁתָּאֵה לָהּ מַחֲרִישׁ\"\nשאלה: מי הוא \"האיש\" ומה עשה לפני שפתח פיו?", "a": "עבד אברהם (אליעזר). עמד בשתיקה והביט ברבקה משקה הגמלים - \"משתאה לה מחריש\" - ממתין לראות אם ה' הצליח דרכו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"בַּת בְּתוּאֵל אָנֹכִי בֶּן מִלְכָּה\"\nשאלה: מהו קשר המשפחה המדויק של רבקה לאברהם?", "a": "נחור הוא אחי אברהם, בתואל הוא בן נחור - כלומר רבקה היא נכדת אחי אברהם, בת אחיינו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לֹא אֹכַל עַד אִם דִּבַּרְתִּי\"\nשאלה: מי אומר זאת, ומה הוצע לו שסירב לו?", "a": "עבד אברהם. הוצע לו אוכל - \"ויושם לפניו לאכול\" - אך סירב עד שיספר שליחותו. מראה מסירות לשליחות אדוניו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיֹּאמְרוּ נִקְרָא לַנַּעֲרָ וְנִשְׁאֲלָה אֶת פִּיהָ\"\nשאלה: מי אמר שצריך לשאול את רבקה, ומה רצו לפני כן?", "a": "אחיה (לבן) ואמה. לפני כן ביקשו \"תשב הנערה אתנו ימים או עשור\" - לעכב. העבד דחף: \"אל תאחרו אותי וה' הצליח דרכי\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיְבִאֶהָ יִצְחָק הָאֹהֱלָה שָׂרָה אִמּוֹ\"\nשאלה: לאיזה אוהל הכניס יצחק את רבקה, ומה נאמר על רגשותיו?", "a": "לאוהל שרה אמו. \"ויאהבה וינחם יצחק אחרי אמו\" - אהב את רבקה ומצא נחמה על מות אמו שרה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו\"\nשאלה: כמה גמלים לקח העבד, ולאיזו עיר הלך?", "a": "עשרה גמלים. הלך אל ארם נהריים, אל עיר נחור (אחי אברהם).", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"שְׁתֵה וְגַם גְּמַלֶּיךָ אַשְׁקֶה\"\nשאלה: מי אמרה את המילים האלה, ומדוע היו כל כך חשובות לעבד?", "a": "רבקה. העבד התפלל שהנערה שתציע להשקות גם את הגמלים תהיה \"אשר הוכחת לעבדך ליצחק\" - זה היה הסימן שקבע.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַתֹּאמֶר אֵלֵךְ\"\nשאלה: מי ענתה \"אלך\" - ומה שאלו אותה בדיוק?", "a": "רבקה. שאלו: \"התלכי עם האיש הזה\" - משפחתה שאלה אותה אם מוכנה ללכת עם עבד אברהם, והיא ענתה במילה אחת: \"אלך\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לְעֵת צֵאת הַשֹּׁאֲבֹת\"\nשאלה: באיזו שעה ביום הגיע העבד לבאר, ומדוע דווקא בזמן הזה?", "a": "\"לעת ערב לעת צאת השואבות\" - הגיע בערב, בזמן שנשות העיר יוצאות לשאוב מים. בחר בזמן הזה כדי לפגוש נערות ולבחון מיהי המיועדת ליצחק.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַתָּרׇץ הַנַּעֲרָ וַתַּגֵּד\"\nשאלה: רבקה רצה לספר \"לבית אמה\" - לא \"לבית אביה\". מי רץ לקראת העבד אחרי ששמע, ומה גרם לו לרוץ?", "a": "לבן אחיה רץ אל העבד. הסיבה: \"ויהי כראות את הנזם ואת הצמידים על ידי אחותו\" - כשראה את התכשיטים היקרים. הכתוב מדגיש שהתכשיטים הניעו את לבן.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אֲחֹתֵנוּ אַתְּ הֲיִי לְאַלְפֵי\"\nשאלה: מהי הברכה המדויקת שמשפחת רבקה ברכו אותה לפני צאתה, ומה הדמיון לברכת אברהם בעקדה?", "a": "ברכת המשפחה: \"אחותנו את היי לאלפי רבבה ויירש זרעך את שער שונאיו\". דומה לברכת המלאך לאברהם בעקדה: \"ויירש זרעך את שער אויביו\" (כ\"ב:י\"ז) - כמעט אותה לשון.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְאֶת מֵנִקְתָּהּ\"\nשאלה: מי יצאה עם רבקה מלבד עבד אברהם ואנשיו? ומה המילה \"מניקתה\" מרמזת?", "a": "\"וישלחו את רבקה אחותם ואת מניקתה ואת עבד אברהם ואת אנשיו\". \"מניקתה\" היא המינקת/אומנת שגידלה את רבקה מינקותה - אישה שליוותה אותה מלידתה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת\"\nשאלה: מה ביקש יצחק מעשו לפי הפסוק, ומי שמעה את הדברים ומה עשתה?", "a": "יצחק ביקש מעשו לצאת לשדה, לצוד ולהכין מטעמים כדי שיברכו. רבקה שמעה ופנתה ליעקב - הורתה לו להביא שני גדיי עיזים כדי שהיא תכין מטעמים ויעקב יקבל הברכה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"עֵשָׂו אָחִי אִישׁ שָׂעִר וְאָנֹכִי חָלָק\"\nשאלה: ממה חשש יעקב לפי הפסוק, ומה ענתה אמו?", "a": "יעקב חשש שאביו ימשש אותו ויגלה - \"והייתי בעיניו כמתעתע והבאתי עלי קללה ולא ברכה\". רבקה ענתה: \"עלי קללתך בני, אך שמע בקולי\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הַקֹּל קוֹל יַעֲקֹב וְהַיָּדַיִם יְדֵי\"\nשאלה: מי אומר את המשפט הזה, ומדוע הידיים נראו כמו ידי עשו?", "a": "יצחק אומר. רבקה הלבישה את ידי יעקב ואת חלקת צווארו בעורות גדיי העיזים כדי לחקות את שעירות עשו. למרות שהקול היה של יעקב, הידיים השעירות שכנעו את יצחק.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיֶּחֱרַד יִצְחָק חֲרָדָה גְדֹלָה\"\nשאלה: מה גרם ליצחק לחרוד לפי הפסוק, ומה טען עשו לגבי שמו של יעקב?", "a": "יצחק חרד כי גילה שמישהו אחר (יעקב) הביא לו מטעמים וקיבל את הברכה. עשו טען: \"הכי קרא שמו יעקב ויעקבני זה פעמיים - את בכורתי לקח והנה עתה לקח ברכתי\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"מִשְׁמַנֵּי הָאָרֶץ יִהְיֶה מוֹשָׁבֶךָ\"\nשאלה: למי נאמרת הברכה הזו, ומה ההמשך שלה?", "a": "הברכה נאמרת לעשו. ההמשך: \"ועל חרבך תחיה ואת אחיך תעבוד, והיה כאשר תריד ופרקת עולו מעל צווארך\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"מַה זֶּה מִהַרְתָּ לִמְצֹא בְּנִי\"\nשאלה: מי שואל את השאלה הזו ולמי, ומה ענה הנשאל?", "a": "יצחק שואל את יעקב (שהתחזה לעשו), תמה כיצד מצא ציד כל כך מהר. יעקב ענה: \"כי הקרה ה' אלוהיך לפני\" - השתמש בשם ה' כדי להסביר את המהירות.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׂטֹם עֵשָׂו אֶת יַעֲקֹב\"\nשאלה: מה תכנן עשו בלבו לפי הפסוק, ומי גילתה את התוכנית ומה הציעה?", "a": "עשו אמר בלבו: \"יקרבו ימי אבל אבי ואהרגה את יעקב אחי\". רבקה גילתה ואמרה ליעקב: \"הנה עשו אחיך מתנחם לך להרגך\" - והציעה לו לברוח אל לבן אחיה לחרן.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיָּרַח אֶת רֵיחַ בְּגָדָיו וַיְבָרְכֵהוּ\"\nשאלה: מה הריח שגרם ליצחק לברך, ומהן שלוש מתנות הברכה שנתן?", "a": "יצחק הריח את ריח בגדי עשו שיעקב לבש ואמר \"ראה ריח בני כריח שדה אשר ברכו ה'\". שלוש מתנות הברכה: (1) טל השמים, (2) משמני הארץ, (3) רוב דגן ותירוש.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"בָּא אָחִיךָ בְּמִרְמָה וַיִּקַּח בִּרְכָתֶךָ\"\nשאלה: מי אומר את הדברים ולמי, ומה אמר מיד לפני שמאשר שהברכה לא תבוטל?", "a": "יצחק אומר לעשו. מיד לפני: \"גם ברוך יהיה\" - למרות שגילה את המרמה, אישר שברכת יעקב תעמוד.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הַבְרָכָה אַחַת הִוא לְךָ אָבִי\"\nשאלה: מה עשה עשו מיד אחרי שאמר את הדברים האלה?", "a": "\"וישא עשו קולו ויבך\" - נשא קולו ובכה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"בִּגְדֵי עֵשָׂו הַחֲמֻדֹת אֲשֶׁר אִתָּהּ\"\nשאלה: היכן היו בגדי עשו לפי הפסוק, ומדוע זה איפשר את התוכנית?", "a": "הבגדים היו \"אתה בבית\" - בידי רבקה. למרות שעשו יצא לשדה, בגדיו החמודות נשמרו אצל אמו, מה שאיפשר את ההתחפשות.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אָנֹכִי עֵשָׂו בְּכֹרֶךָ\"\nשאלה: חוץ ממישוש הידיים, מה עוד עשה יצחק כדי לזהות את בנו?", "a": "ביקש שיגש וישק לו. כשנשק, הריח את ריח בגדיו: \"ראה ריח בני כריח שדה אשר ברכו ה'\" - הריח הכריע.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לָמָה אֶשְׁכַּל גַּם שְׁנֵיכֶם יוֹם אֶחָד\"\nשאלה: מי אומרת את הדברים, ומאילו שני בנים חוששת?", "a": "רבקה אומרת ליעקב. חוששת שעשו יהרוג את יעקב, וגואל הדם יהרוג את עשו - תשכל את שניהם ביום אחד. לכן הציעה לברוח ללבן.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"עָלַי קִלְלָתְךָ בְּנִי\"\nשאלה: מי אומרת \"עלי קללתך בני\" ולמי, ומאיזה חשש היא מרגיעה?", "a": "רבקה אומרת ליעקב. יעקב חשש שאם אביו ימשש אותו יגלה שהוא מתחזה ל\"והבאתי עלי קללה ולא ברכה\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הֲכִי קָרָא שְׁמוֹ יַעֲקֹב\"\nשאלה: מי אומר את הדברים, ומה שתי הפעמים שנעקב לדבריו?", "a": "עשו. שתי הפעמים: \"את בכורתי לקח\" (מכירת הבכורה) \"והנה עתה לקח ברכתי\" (גניבת הברכה). שם \"יעקב\" מתפרש כ\"עוקב/רמאי\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"גְּשָׁה נָּא וַאֲמֻשְׁךָ בְּנִי\"\nשאלה: מי ביקש למשש את מי, ומה גילה המישוש?", "a": "יצחק ביקש למשש את יעקב. המישוש גילה ידיים שעירות (בגלל עורות הגדיים) ולכן אמר \"הקול קול יעקב והידיים ידי עשו\" - אך לא הכירו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"יַעַבְדוּךָ עַמִּים\"\nשאלה: ברכת יעקב כוללת חלק על שלטון. השלם: \"יעבדוך עמים וישתחוו לך לאומים...\" - מה ההמשך?", "a": "\"הוה גביר לאחיך וישתחוו לך בני אמך אוררך ארור ומברכיך ברוך\" - שלושה רכיבים: (1) שלטון על עמים ולאומים, (2) אדנות על אחיו, (3) קללת מקלליו וברכת מברכיו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"קַצְתִּי בְחַיַּי מִפְּנֵי\"\nשאלה: מהו הנימוק הרשמי שנתנה רבקה ליצחק לשליחת יעקב לחרן, ומדוע לא גילתה את הסיבה האמיתית?", "a": "הנימוק הרשמי: \"קצתי בחיי מפני בנות חת, אם לוקח יעקב אישה מבנות חת כאלה מבנות הארץ למה לי חיים\" - חשש מנישואין לבנות חת. הסיבה האמיתית: עשו רוצה להרוג את יעקב. לא גילתה כדי לא לפגוע ביחסי יצחק ועשו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לֹא תִקַּח אִשָּׁה מִבְּנוֹת כְּנָעַן\"\nשאלה: לאן שלח יצחק את יעקב לפי הפסוק, ומה עשה עשו כשראה שבנות כנען רעות בעיני אביו?", "a": "יצחק שלח את יעקב לפדן ארם, לבית בתואל, לקחת אישה מבנות לבן. עשו הלך לישמעאל ולקח את מחלת בת ישמעאל אחות נביות על נשיו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּפְגַּע בַּמָּקוֹם וַיָּלֶן שָׁם\"\nשאלה: מדוע לן יעקב במקום הזה לפי הפסוק, ומה שם על ראשו?", "a": "לן שם \"כי בא השמש\" - כי נהיה חושך. לקח מאבני המקום ושם מראשותיו (כר לראשו).", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְהִנֵּה סֻלָּם מֻצָּב אַרְצָה וְרֹאשׁוֹ\"\nשאלה: מה הבטיח ה' ליעקב בחלום הזה לגבי שמירתו האישית?", "a": "\"הנה אנכי עמך ושמרתיך בכל אשר תלך והשבותיך אל האדמה הזאת כי לא אעזבך עד אשר אם עשיתי את אשר דיברתי לך\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אָכֵן יֵשׁ יְהוָה בַּמָּקוֹם הַזֶּה\"\nשאלה: כיצד תיאר יעקב את המקום אחרי הדברים האלה, ומה עשה עם האבן?", "a": "יעקב תיאר: \"מה נורא המקום הזה, אין זה כי אם בית אלוהים וזה שער השמים\". לקח האבן, שם אותה מצבה, יצק שמן על ראשה וקרא למקום \"בית אל\" (ושם העיר לפנים - לוז).", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּדַּר יַעֲקֹב נֶדֶר לֵאמֹר\"\nשאלה: מהם התנאים שיעקב הציב בנדרו, ומה התחייב לתת?", "a": "התנאים: (1) שה' ישמור אותו בדרך, (2) שייתן לו לחם לאכול ובגד ללבוש, (3) שישוב בשלום אל בית אביו. התחייב: \"והאבן הזאת יהיה בית אלוהים, וכל אשר תיתן לי עשר אעשרנו לך\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיֵּלֶךְ עֵשָׂו אֶל יִשְׁמָעֵאל\"\nשאלה: מדוע הלך עשו לישמעאל, ומה שם אחות מחלת שמוזכר בפסוק?", "a": "עשו ראה \"כי רעות בנות כנען בעיני יצחק אביו\". שם אחות מחלת: נביות - \"מחלת בת ישמעאל אחות נביות\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אָכֵן יֵשׁ יְהוָה בַּמָּקוֹם\"\nשאלה: מה לא ידע יעקב לפני החלום, ומה היה שם העיר לפני שקרא לה \"בית אל\"?", "a": "לא ידע שה' נמצא במקום - \"ואנכי לא ידעתי\". שם העיר לפנים היה לוז - \"ואולם לוז שם העיר לראשונה\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וּפָרַצְתָּ יָמָּה וָקֵדְמָה וְצָפֹנָה\"\nשאלה: הבטחה דומה ניתנה לאברם בפרק י\"ג. מה נוסף כאן שלא נאמר לאברם?", "a": "כאן נוסף: \"ונברכו בך כל משפחות האדמה ובזרעך\" - הבטחת הברכה האוניברסלית, המקבילה ל\"לך לך\" של אברם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְאֵל שַׁדַּי יְבָרֵךְ אֹתְךָ וְיַפְרְךָ וְיַרְבֶּךָ\"\nשאלה: מי מברך את יעקב בשם \"אל שדי\", ומתי שמענו שם זה לאחרונה?", "a": "יצחק מברך את יעקב. השם \"אל שדי\" הוא אותו שם שבו הציג ה' עצמו לאברהם בברית המילה (י\"ז:א'): \"אני אל שדי\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם וַיָּשֶׂם מְרַאֲשֹׁתָיו\"\nשאלה: מה עשה יעקב עם האבן למחרת, ומהי הפעולה הפיזית שביצע עליה?", "a": "שם אותה מצבה ויצק שמן על ראשה - \"ויקח את האבן אשר שם מראשותיו וישם אותה מצבה ויצוק שמן על ראשה\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"עֹלִים וְיֹרְדִים בּוֹ\"\nשאלה: מי עולים ויורדים, ועל מה? ומדוע \"עולים\" קודם ל\"יורדים\"?", "a": "מלאכי אלוהים עולים ויורדים בסולם. \"עולים\" לפני \"יורדים\" - המלאכים כבר היו בארץ עם יעקב ועולים חזרה לשמים, ואחרים יורדים להמשיך ללוותו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"עַשֵּׂר אֲעַשְּׂרֶנּוּ לָךְ\"\nשאלה: מי נודר לתת מעשר, ומהו התנאי שהציב לפני כן?", "a": "יעקב נדר. התנאי: \"אם יהיה אלוהים עמדי ושמרני בדרך הזה... ושבתי בשלום אל בית אבי\" - רק אם יחזור בשלום.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְאוּלָם לוּז שֵׁם הָעִיר\"\nשאלה: מה היה שם העיר לפנים, ומה השם שנתן לה יעקב?", "a": "שם העיר לפנים היה לוז. יעקב קרא לה \"בית אל\" - בית אלוהים, על שם החלום בו ראה את הסולם ואת ה'.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"מָחֲלַת בַּת יִשְׁמָעֵאל\"\nשאלה: עשו לקח את מחלת \"על נשיו\" - מה מרמזת המילה \"על נשיו\"?", "a": "\"על נשיו\" פירושו בנוסף לנשיו הקיימות - לא במקומן. לעשו כבר היו נשים מבנות כנען, ולקח את מחלת בת ישמעאל כאישה נוספת, לא כתחליף.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְהִנֵּה יְהוָה נִצָּב עָלָיו\"\nשאלה: ה' מציג עצמו ליעקב בחלום עם שלושה שמות/תארים. מהם?", "a": "\"אני ה' אלוהי אברהם אביך ואלוהי יצחק\" - (1) ה' (השם המפורש), (2) אלוהי אברהם אביך, (3) אלוהי יצחק. ה' מקשר את עצמו לאבות יעקב כדי להעביר את הברית הלאה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְנָתַן לִי לֶחֶם לֶאֱכֹל\"\nשאלה: בנדר יעקב, ה' הבטיח הבטחות גדולות (ארץ, זרע, שמירה). אך מה ביקש יעקב? מהו הפער בין ההבטחה לבקשה?", "a": "ה' הבטיח ארץ, זרע כעפר, וברכת כל המשפחות. יעקב ביקש רק: \"לחם לאכול ובגד ללבוש\" ושיחזור בשלום. הפער עצום - יעקב מבקש את המינימום הבסיסי, מתוך ענווה או חוסר ביטחון שההבטחות הגדולות אכן יתקיימו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּשָּׂא יַעֲקֹב רַגְלָיו\"\nשאלה: מה עשה יעקב לאחר שנשא את רגליו ולאן הלך? מה ניתן ללמוד מהביטוי המיוחד הזה?", "a": "יעקב הלך ארצה בני קדם לחרן לחפש את בית לבן דוד אמו. \"וַיִּשָּׂא יַעֲקֹב רַגְלָיו\" - ביטוי ייחודי שאינו מופיע במקום אחר. המדרש אומר שאחרי הבטחת ה' בחלום הסולם, נשא לבו את רגליו - הלך בשמחה ובביטחון שלא היו לו קודם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְהָאֶבֶן גְּדֹלָה עַל פִּי הַבְּאֵר\"\nשאלה: מה היה תפקיד האבן הגדולה, ומהי ההסכמה בין הרועים לגבי גלילת האבן?", "a": "האבן כיסתה את פי הבאר כדי שמים לא יתאדו ולמנוע זיהום. ההסכמה בין הרועים: רק כשנאספים כל העדרים יחד גוללים את האבן ומשקים - \"ונקדנו את האבן מעל פי הבאר והשקינו הצאן\". לפני כן לא יכול היחיד לגלול אותה לבדו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"עוֹד הַיּוֹם גָּדוֹל לֹא עֵת הֵאָסֵף הַמִּקְנֶה\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה ביקש מיד אחרי?", "a": "יעקב אמר לרועים שישבו ליד הבאר. לאחר שאמר שעוד יום גדול ואין זמן לאסוף המקנה, ביקש מהם: \"השקו הצאן ולכו רעו\" - ביקר אותם על שיושבים בטלים. יעקב בא ממשפחת רועים ורגיש לאי-סדר בניהול הצאן.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיְגַל אֶת הָאֶבֶן מִפִּי הַבְּאֵר לְבַדּוֹ\"\nשאלה: מי עשה את הפעולה המתוארת, ומה מיוחד בה לעומת הנוהג הרגיל?", "a": "יעקב גלל לבדו את האבן הגדולה מפי הבאר. הדבר המיוחד: הרועים הסבירו שנהוג לגלול רק כשמתאספים כל העדרים - כלומר נדרש מאמץ של קהל. יעקב עשה זאת לבדו, מה שמלמד על כוחו יוצא הדופן, ועל הרגשות החזקים שהתעוררו בו עם ראיית רחל.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּשַּׁק יַעֲקֹב לְרָחֵל וַיִּשָּׂא אֶת קֹלוֹ וַיֵּבְךְּ\"\nשאלה: מדוע בכה יעקב? מה הסביר לרחל לאחר מכן?", "a": "פירושים שונים: יעקב בכה כי שמח לפגוש קרוב משפחה אחרי הבריחה הארוכה, או לפי המדרש - כי ראה ברוח הקודש שרחל לא תיקבר עמו. לאחר הנשיקה הסביר לרחל \"כי אחי אביה הוא וכי בן רבקה הוא\" - שהוא קרוב משפחה, בן אחות לבן.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אַךְ עַצְמִי וּבְשָׂרִי אָתָּה\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה קרה לפני כן שהוביל לאמירה זו?", "a": "לבן אמר ליעקב. לפני כן: רחל רצה והגידה לאביה, לבן רץ לקראת יעקב, חיבקו ונישקו והביאו הביתה. יעקב סיפר ללבן \"את כל הדברים האלה\" - כל שקרה לו. ואז לבן הגיב \"אך עצמי ובשרי אתה\" - הכיר בו כבן משפחה קרוב.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הֲכִי אָחִי אַתָּה וַעֲבַדְתַּנִי חִנָּם\"\nשאלה: מה ביקש לבן מיעקב בשאלה זו, ומתי נשאלה?", "a": "אחרי חודש ימים שישב יעקב עם לבן, פנה אליו לבן: \"הגידה לי מה משכורתך\" - ביקש שיעקב יקבע שכר עבור עבודתו. לבן הכיר שיעקב עובד אצלו ולא ביקש לנצל אותו \"חינם\". זהו הרגע שמתחיל המשא ומתן שיוביל לנישואי יעקב.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְרָחֵל הָיְתָה יְפַת תֹּאַר וִיפַת מַרְאֶה\"\nשאלה: כיצד מתואר מראה לאה בהשוואה לרחל? מה פירוש \"ועיני לאה רכות\"?", "a": "הכתוב אומר \"ועיני לאה רכות\" לעומת \"ורחל היתה יפת תואר ויפת מראה\". \"ועיני לאה רכות\" - מחלוקת פרשנים: לפי פירוש אחד עיניים חלשות/עייפות, לפי אחר - עדינות ויפות. הניגוד מכוון: יופי רחל מוצג בשני ממדים (תואר ומראה), ואילו שבח לאה חלקי ומסויג.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"אֶעֱבָדְךָ שֶׁבַע שָׁנִים בְּרָחֵל בִּתְּךָ הַקְּטַנָּה\"\nשאלה: מדוע הדגיש יעקב \"הקטנה\"? מה מלמדת הדגשה זו על המצב המשפחתי?", "a": "יעקב הדגיש \"הקטנה\" כי ללבן שתי בנות - לאה הבכירה ורחל הצעירה. יעקב רצה דווקא את רחל שאהב, ולא את לאה. ההדגשה גם מכינה את הקורא לרמאות הבאה - שם לבן יטען שה\"מנהג\" הוא לתת הבכירה לפני הצעירה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַתִּהְיֶיןָ בְעֵינָיו כְּיָמִים אֲחָדִים בְּאַהֲבָתוֹ אֹתָהּ\"\nשאלה: למה שבע שנים נראו ליעקב כ\"ימים אחדים\"? מה מלמד פסוק זה על עומק אהבתו?", "a": "שבע שנים נראו ליעקב כימים אחדים \"באהבתו אותה\" - מרוב האהבה לרחל הזמן עבר מהר. זהו אחד הפסוקים הפואטיים ביותר בתנ\"ך לתיאור אהבה. הכתוב מציג זאת כשבח - אהבתו עמוקה כל כך שנסתרה מפניו גדולת הזמן שעבר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"לֹא יֵעָשֶׂה כֵן בִּמְקוֹמֵנוּ לָתֵת הַצְּעִירָה לִפְנֵי הַבְּכִירָה\"\nשאלה: מה טען לבן כהצדקה לרמאותו, ומה אמר ליעקב שיעשה?", "a": "לבן טען שהמנהג המקומי אוסר לתת הצעירה לפני הבכירה. ואז אמר ליעקב: \"מלא שבוע זאת\" - השלם את שבוע חתונת לאה, ואז יתן לו גם את רחל תמורת עוד שבע שנות עבודה. יעקב שנרמה קיבל את ההסדר ועבד עוד שבע שנים - סך הכל 14 שנה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיְהִי בַבֹּקֶר וְהִנֵּה הִוא לֵאָה\"\nשאלה: כיצד ייתכן שיעקב לא זיהה את לאה בלילה? מה עשה אחרי שגילה את האמת?", "a": "הסברים: היה חושך, לבן נתן ללאה מעטה/צעיף, ויעקב היה בהשפעת יין המשתה. לפי המדרש - יעקב קרא \"רחל\" בלילה ולאה ענתה. לאחר שגילה הלך ישר ללבן ושאל: \"מה זאת עשית לי, הלא ברחל עבדתי עמך ולמה רמיתני\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיֶּאֱהַב גַּם אֶת רָחֵל מִלֵּאָה\"\nשאלה: מה ההבדל בין יחסו של יעקב ללאה לעומת רחל, ואיך ה' \"פיצה\" את לאה?", "a": "הכתוב אומר \"ויאהב יעקב את רחל מלאה\" - אהב את רחל יותר. לאה \"שנואה\" - לא שנאה ממשית אלא פחות-אהובה. ה' פיצה את לאה בפריון: \"וירא ה' כי שנואה לאה ויפתח את רחמה ורחל עקרה\" - ה' ראה בצערה של לאה ונתן לה ילדים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיַּרְא יְהוָה כִּי שְׂנוּאָה לֵאָה וַיִּפְתַּח אֶת רַחְמָהּ\"\nשאלה: מה ההקשר להתערבות ה' כאן, ומה מצב רחל באותו הזמן?", "a": "לאה היתה פחות אהובה על ידי יעקב, ולכן ה' התחשב בה ופתח את רחמה. ורחל, האהובה - עדיין עקרה. זהו דפוס חוזר בתנ\"ך: האהובה עקרה (שרה, רבקה, רחל, חנה) ואילו ה' מתחשב בדחויה ופותח רחמה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"כִּי רָאָה יְהוָה בְּעָנְיִי כִּי עַתָּה יֶאֱהָבַנִי אִישִׁי\"\nשאלה: מי אמרה זאת ובאיזה הקשר? מהו שם הבן שנולד ואיך מסביר הכתוב את פירוש שמו?", "a": "לאה אמרה כשילדה את בכורה. הבן נקרא ראובן - \"כי ראה ה' בעניי\" וגם \"כי עתה יאהבני אישי\". שם ראובן נגזר מ\"ראה בן\" - \"הנה בן!\" ולאה קיוותה שלידת הבן הבכור תגרום ליעקב לאהוב אותה יותר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"כִּי שָׁמַע יְהוָה כִּי שְׂנוּאָה אָנֹכִי\"\nשאלה: מי אמרה זאת ומתי? מה שם הבן שנולד ומהי משמעות שמו?", "a": "לאה אמרה בלידת בנה השני. הבן נקרא שמעון - \"כי שמע ה' כי שנואה אנוכי\". שם שמעון נגזר מ\"שמע\" - שמע ה' את צערה. בניגוד לראובן שבו היה קצת תקווה (\"עתה יאהבני\"), בשמעון לאה עדיין מדגישה שהיא שנואה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הַפַּעַם יִלָּוֶה אִישִׁי אֵלַי\"\nשאלה: מי אמרה זאת ובאיזה הקשר? מהו שם הבן שנולד?", "a": "לאה אמרה בלידת בנה השלישי. הבן נקרא לוי - \"הפעם ילווה אישי אלי כי ילדתי לו שלשה בנים\". שם לוי נגזר מ\"ילווה\" - יצטרף, יתחבר. לאה מקווה שלאחר שלושה בנים יחוש יעקב חיבה עמוקה יותר.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הַפַּעַם אוֹדֶה אֶת יְהוָה\"\nשאלה: מי אמרה זאת ומה שם הבן שנולד? מה מיוחד בלידה זו לעומת הלידות הקודמות?", "a": "לאה אמרה בלידת בנה הרביעי, שנקרא יהודה - \"הפעם אודה את ה'\". בלידות הקודמות ביקשה לאה שיאהבה יעקב. עתה אינה מדברת על יחסה עם יעקב אלא על הכרת תודה לה' - שינוי עמוק. מיהודה יצאו מלכי יהודה ודוד המלך.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הָבָה לִּי בָנִים וְאִם אַיִן מֵתָה אָנֹכִי\"\nשאלה: מי אמרה את הדברים ולמי? מה היתה התגובה?", "a": "רחל אמרה ליעקב. יעקב כעס עליה: \"ויחר אף יעקב ברחל ויאמר התחת אלוהים אנוכי אשר מנע ממך פרי בטן\" - השיב בחריפות שאין זה בידו אלא בידי ה'. המדרש מבקר את יעקב על שלא ריחם על אשתו הסובלת ולא התפלל עבורה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"דָּנַנִּי אֱלֹהִים וְגַם שָׁמַע בְּקֹלִי\"\nשאלה: מי אמרה זאת ועל מי? מה שם הבן שנולד ומה פירושו?", "a": "רחל אמרה על הבן שנולד מבלהה שפחתה - \"דנני אלוהים וגם שמע בקולי ויתן לי בן\". הבן נקרא דן - מ\"דן\" (ה' דן את דיני). רחל נתנה את שפחתה בלהה ליעקב לאשה כדי לזכות בבנים \"על ברכיה\" - שיחשבו כבניה הרשמיים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"נַפְתּוּלֵי אֱלֹהִים נִפְתַּלְתִּי עִם אֲחֹתִי גַּם יָכֹלְתִּי\"\nשאלה: מי אמרה זאת ועל מה? מה שם הבן שנולד?", "a": "רחל אמרה בלידת הבן השני מבלהה שפחתה. הבן נקרא נפתלי - \"נפתולי אלוהים נפתלתי עם אחותי גם יכולתי\". רחל מדברת על \"מאבקה\" עם לאה - תפילה, שיטת השפחות - ועכשיו ניצחה. שם נפתלי מלשון \"נפתולים\" - מאבקים, התנגשויות.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הֲמַעַט קַחְתֵּךְ אֶת אִישִׁי וְלָקַחַת גַּם אֶת דּוּדָאֵי בְּנִי\"\nשאלה: מה הוביל לשיחה הזו? מה הסכם נערך בין שתי האחיות בעקבות כך?", "a": "ראובן מצא דודאים בשדה בעת קציר החיטים והביאם ללאה אמו. רחל ביקשה מלאה: \"תני נא לי מדודאי בנך\". לאה הגיבה בכעס. ההסכם שנקבע: רחל תיתן ללאה את יעקב ללינה הלילה תמורת הדודאים. רחל \"מכרה\" את ליל יעקב בדודאים.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּזְכֹּר אֱלֹהִים אֶת רָחֵל וַיִּשְׁמַע אֵלֶיהָ אֱלֹהִים\"\nשאלה: מה הלידה שנולדה לרחל, ומה שם הבן ומשמעותו?", "a": "רחל ילדה בן - יוסף. \"ותאמר אסף אלוהים את חרפתי\" וגם \"יסף ה' לי בן אחר\" - שני פירושים לשם יוסף: (1) מ\"אסף\" - ה' הסיר את חרפת העקרות, (2) מ\"יסף\" - יוסיף לי בן נוסף. כבר בלידת יוסף מתפללת רחל לבן נוסף - ואכן ייוולד בנימין.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"שַׁלְּחֵנִי וְאֵלְכָה אֶל מְקוֹמִי וּלְאַרְצִי\"\nשאלה: מה הביא את יעקב לבקש מלבן שישחררו, ומה טען בנימוקיו?", "a": "לידת יוסף היא הגורם - \"ויהי כאשר ילדה רחל את יוסף\". יעקב הרגיש שסיים את תפקידו (עבד 14 שנים, נולדו לו בנים). נימוקיו: \"תנה את נשי ואת ילדי אשר עבדתי אותך בהן ואלכה\" - ביקש לקחת את אשתו וילדיו שהרוויח בעבודתו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"נַחַשְׁתִּי וַיְבָרְכֵנִי יְהוָה בִּגְלָלֶךָ\"\nשאלה: מי אמר את הדברים האלה ולמי, ומה ביקש בתגובה?", "a": "לבן אמר ליעקב. לבן הכיר שה' ברכו בזכות יעקב - \"נחשתי\" (למדתי מנסיון) שהצלחתי בגלל יעקב. בתגובה ביקש מיעקב להישאר: \"נקבה שכרך ואתנה\" - קבע שכר ואתנו לך. לבן רצה לשמור את יעקב ולהמשיך ליהנות מברכתו.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"נָקֹד וְטָלוּא בָּעִזִּים וְחוּם בַּכְּשָׂבִים\"\nשאלה: מה ביקש יעקב כשכרו, ומה עשה לבן מיד אחר כך?", "a": "יעקב ביקש כשכרו: כל כבש ועז עם כתמים, עקודים או גוון חום - שאינם לבנים טהורים. אלה נחשבו מיעוט הצאן. לבן מיד פעל: \"ויסר ביום ההוא את העתודים העקודים והטלואים\" - הסיר את כל בעלי הסימנים המבוקשים והרחיקם שלשת ימים - כדי שלא יעברו ליעקב.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיַּצֵּג אֶת הַמַּקְלוֹת אֲשֶׁר פִּצַּל בָּרְהָטִים\"\nשאלה: מה עשה יעקב עם המקלות, ומה היה מנגנון הפעולה שלו?", "a": "יעקב לקח מקלות עץ לבנה, לוז וערמון - פיצל בהם פצלות לבנות וחשף את הלבן שבתוכם. הניח את המקלות הפצולים ברהטים (שוקות המים) לנגד עיני הצאן המתייחמות. הצאן שראו את המקלות בעת ההזדווגות יולדו נקודים ועקודים - ואלה שייכים ליעקב.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וְהָיָה בְּעֵת יַחֵם הַצֹּאן הַמְּקֻשָּׁרוֹת\"\nשאלה: מה אסטרטגיה נוספת נקט יעקב כדי להפריד בין חלקו לחלק לבן?", "a": "יעקב הפריד: כשהצאן החזקות (\"המקושרות\") התייחמו - הציב את המקלות לנגדן, כך הוולדות החזקות הפכו לנקודים/עקודים ושייכות ליעקב. בצאן החלשות (\"העטופות\") לא שם מקלות - הוולדות יצאו לבנות ושייכות ללבן. יעקב התעשר בצאן חזקה וטובה.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּפְרֹץ הָאִישׁ מְאֹד מְאֹד\"\nשאלה: מה תיאר הכתוב בפסוק זה, ועד כמה גדלה עושרו של יעקב?", "a": "הכתוב מתאר את עושרו הגדל של יעקב - \"ויפרץ האיש מאד מאד ויהי לו צאן רבות ושפחות ועבדים וגמלים וחמורים\". \"מאד מאד\" - ריבוי חריג, הכפלת הדגשה. יעקב שהגיע לחרן עם ידיים ריקות נהפך לאיש עשיר מאוד.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּשְׁמַע אֶת דִּבְרֵי בְנֵי לָבָן\"\nשאלה: מה אמרו בני לבן שהשפיע על יעקב? ומה עוד ראה יעקב בלבן עצמו?", "a": "בני לבן אמרו: \"לקח יעקב את כל אשר לאבינו ומאשר לאבינו עשה את כל הכבוד הזה\" - האשימו את יעקב שגזל מהם. בנוסף, יעקב \"ויפן פני לבן והנה איננו עמו כתמול שלשום\" - פני לבן השתנו לרעה. שתי ההתפתחויות יחד גרמו ליעקב להחליט לברוח.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"שׁוּב אֶל אֶרֶץ אֲבוֹתֶיךָ וּלְמוֹלַדְתֶּךָ וְאֶהְיֶה עִמָּךְ\"\nשאלה: מה אמר ה' ליעקב, ומה החיזוק שנתן לו?", "a": "ה' אמר ליעקב לשוב לארץ אבותיו ולמולדתו, והבטיח \"ואהיה עמך\" - ה' ילך עמו. זהו ציווי אלוהי ישיר שהוא הדחיפה הסופית לבריחה. בחלום גם חיזק ה' את יעקב, הראה לו מלאך וסיפר לו את אשר עשה לבן לו, ואמר \"אנוכי האל בית אל\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"הֲכִי נָכְרִיּוֹת נֶחְשַׁבְנוּ לוֹ\"\nשאלה: מי אמרו זאת ולמי, ומה טענו?", "a": "רחל ולאה אמרו ליעקב כשסיפר להן על ציווי ה' לשוב. הן תמכו בו בלב שלם ואמרו: \"הכי נכריות נחשבנו לו, כי מכרנו ויאכל גם אכול את כספנו\" - טענו שאביהן מתייחס אליהן כנכריות לא כבנות, מכר אותן ביעקב ואכל את כספן. לכן אמרו \"כל אשר אמר אלוהים אליך עשה\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַתִּגְנֹב רָחֵל אֶת הַתְּרָפִים אֲשֶׁר לְאָבִיהָ\"\nשאלה: מה הן התרפים? מדוע גנבה אותם רחל?", "a": "התרפים הם פסילים/אלילים ביתיים קטנים שנחשבו כסמל של שגשוג ומעמד המשפחה. מחלוקת בין הפרשנים על מניע רחל: לפי פירוש אחד - גנבתם כדי להפריד את אביה מעבודה זרה. לפי אחר - רצתה לשמרם כקשר לבית אביה. הם ממלאים תפקיד דרמטי מאוחר יותר כשלבן מחפש אותם.", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיִּגְנֹב יַעֲקֹב אֶת לֵב לָבָן הָאֲרַמִּי\"\nשאלה: מה פירוש \"ויגנב יעקב את לב לבן\"? מה עשה מבחינה מעשית?", "a": "\"ויגנב את לב לבן\" = הפתיע אותו, ברח בסתר ובלי להודיע - \"גנב את דעתו\". מבחינה מעשית: בחר ברגע שבו לבן הלך לגוז את צאנו ולא היה בסביבה. \"ויבקע הוא וכל אשר לו ויקם ויעבר את הנהר וישם את פניו הר הגלעד\". \"ולא הגיד לו כי ברח הוא\".", "source": "text_questions/bereshit.md", "type": "text"}, {"q": "טקסט: \"וַיֻּגַּד לְלָבָן בַּיּוֹם הַשְּׁלִישִׁי כִּי בָרַח יַעֲקֹב\"\nשאלה: כמה זמן לקח ללבן לשמוע על הבריחה, ומה עשה מיד? מה מנע ממנו לפגוע ביעקב?", "a": "לאחר שלשה ימים הגיד ללבן שיעקב ברח. לבן לקח את אחיו עמו ורדף אחרי יעקב שבעת ימים ודביקו בהר הגלעד. ה' הופיע ללבן בחלום הלילה ואמר לו \"השמר לך פן תדבר עם יעקב מטוב עד רע\" - ה' הגן על יעקב ומנע מלבן לפגוע בו.", "source": "text_questions/bereshit.md", "type": "text"}]}, "shemot": {"name": "שמות", "story": [{"q": "1. כמה נפשות ירדו למצרים מזרע יעקב?", "a": "שבעים נפש", "source": "01 slavery in egypt", "type": "story"}, {"q": "2. מי היה כבר במצרים כשבני ישראל ירדו?", "a": "יוסף", "source": "01 slavery in egypt", "type": "story"}, {"q": "3. מדוע קם המלך החדש נגד בני ישראל?", "a": "כי חשש שבני ישראל יצטרפו לאויבי מצרים בעת מלחמה ויעלו מן הארץ", "source": "01 slavery in egypt", "type": "story"}, {"q": "4. מה מינה פרעה על בני ישראל כדי לענותם?", "a": "שרי מסים", "source": "01 slavery in egypt", "type": "story"}, {"q": "5. מהן שתי ערי המסכנות שבנו בני ישראל לפרעה?", "a": "פיתום ורעמסס", "source": "01 slavery in egypt", "type": "story"}, {"q": "6. מה קרה ככל שעינו את בני ישראל יותר?", "a": "כן רבו וכן פרצו", "source": "01 slavery in egypt", "type": "story"}, {"q": "7. מהי עבודת הפרך שעבדו בני ישראל?", "a": "בחומר ובלבנים ובכל עבודה בשדה", "source": "01 slavery in egypt", "type": "story"}, {"q": "8. מה שמות שתי המיילדות העבריות?", "a": "שפרה ופועה", "source": "01 slavery in egypt", "type": "story"}, {"q": "9. מה ציווה פרעה את המיילדות לעשות?", "a": "להמית את הבנים הנולדים ולהחיות את הבנות", "source": "01 slavery in egypt", "type": "story"}, {"q": "10. מדוע לא ציתו המיילדות לפרעה?", "a": "כי יראו את האלוהים", "source": "01 slavery in egypt", "type": "story"}, {"q": "11. מה טענו המיילדות כשנשאלו מדוע לא המיתו את הילדים?", "a": "שהנשים העבריות חיות הן ויולדות לפני בוא המיילדת", "source": "01 slavery in egypt", "type": "story"}, {"q": "12. מה היה שכרן של המיילדות מאלוהים?", "a": "אלוהים עשה להן בתים", "source": "01 slavery in egypt", "type": "story"}, {"q": "13. מה הגזרה האחרונה שגזר פרעה על כל עמו?", "a": "כל הבן הילוד היאורה תשליכוהו וכל הבת תחיון", "source": "01 slavery in egypt", "type": "story"}, {"q": "14. מהן ארבע לשונות הריבוי של בני ישראל בפסוק ז'?", "a": "פרו, וישרצו, וירבו, ויעצמו", "source": "01 slavery in egypt", "type": "story"}, {"q": "15. מהו הפסוק \"וַיָּקׇם מֶלֶךְ חָדָשׁ עַל מִצְרָיִם אֲשֶׁר לֹא יָדַע אֶת יוֹסֵף\"?", "a": "שמות א', ח'", "source": "01 slavery in egypt", "type": "story"}, {"q": "16. מה פירוש המילה \"בפרך\"?", "a": "עבודה קשה ומפרכת", "source": "01 slavery in egypt", "type": "story"}, {"q": "17. כמה פעמים מופיעה המילה \"בפרך\" בפרק א'?", "a": "פעמיים", "source": "01 slavery in egypt", "type": "story"}, {"q": "18. לאן ציווה פרעה להשליך את הבנים הנולדים?", "a": "ליאור (הנילוס)", "source": "01 slavery in egypt", "type": "story"}, {"q": "19. ⭐⭐ מהם שמות בני יעקב המופיעים בפסוקים ב'-ד'?", "a": "ראובן, שמעון, לוי, יהודה, יששכר, זבולון, בנימין, דן, נפתלי, גד, אשר", "source": "01 slavery in egypt", "type": "story"}, {"q": "20. ⭐⭐⭐ מה שם האחת משתי המיילדות ומה שם השנייה (בסדר הנכון)?", "a": "שם האחת שפרה ושם השנית פועה (שמות א':ט\"ו)", "source": "01 slavery in egypt", "type": "story"}, {"q": "21. ⭐⭐ מה עשה אלוהים למיילדות בגלל שיראו אותו?", "a": "ויעש להם בתים (שמות א':כ\"א)", "source": "01 slavery in egypt", "type": "story"}, {"q": "1. ⭐ \"כָּל הַבֵּן הַיִּלּוֹד הַיְאֹרָה תַּשְׁלִיכֻהוּ\"", "a": "**מי אמר:** פרעה\n**למי:** כל עמו\n**הקשר:** גזירת פרעה להשליך כל בן זכר ליאור (שמות א':כ\"ב)", "source": "01 slavery in egypt", "type": "story"}, {"q": "2. ⭐⭐ \"כִּי חָיוֹת הֵנָּה... בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת\"", "a": "**מי אמר:** המיילדות (שפרה ופועה)\n**למי:** פרעה\n**הקשר:** המיילדות מסבירות לפרעה מדוע לא המיתו את הילדים (שמות א':י\"ט)", "source": "01 slavery in egypt", "type": "story"}, {"q": "3. ⭐⭐⭐ \"הִנֵּה עַם בְּנֵי יִשְׂרָאֵל רַב וְעָצוּם מִמֶּנּוּ\"", "a": "**מי אמר:** פרעה\n**למי:** עמו (המצרים)\n**הקשר:** פרעה מציג את בני ישראל כאיום לפני עמו ומציע \"נתחכמה לו\" (שמות א':ט')", "source": "01 slavery in egypt", "type": "story"}, {"q": "4. ⭐⭐⭐ \"מַדּוּעַ עֲשִׂיתֶן הַדָּבָר הַזֶּה וַתְּחַיֶּיןָ אֶת הַיְלָדִים\"", "a": "**מי אמר:** פרעה (מלך מצרים)\n**למי:** המיילדות (שפרה ופועה)\n**הקשר:** פרעה מזמן את המיילדות לחקירה כשמגלה שלא מילאו את פקודתו להמית את הבנים (שמות א':י\"ח)", "source": "01 slavery in egypt", "type": "story"}, {"q": "1. ⭐ גזר גזרות על עם שעבדו בארצו, הקשה את ליבו שוב ושוב, ורדף אחרי העם לים", "a": "**הדמות:** פרעה (פרעה של יציאת מצרים)\n**ספר:** שמות\n**הקשר:** פרעה גזר על בני ישראל עבודת פרך, השלכת ילדים ליאור, הקשה את ליבו בעשר המכות, ורדף אחרי ישראל אל ים סוף (פרקים א'-ה', י\"א-י\"ד)", "source": "01 slavery in egypt", "type": "story"}, {"q": "2. ⭐ מיילדות עבריות, סירבו לציית לפרעה, יראו את אלוהים, ה' עשה להן בתים", "a": "**הדמות:** שפרה ופועה\n**ספר:** שמות\n**הקשר:** שפרה ופועה היו המיילדות שסירבו להרוג את הבנים העבריים כפקודת פרעה, כי יראו את האלוהים, וה' עשה להן בתים (פרק א')", "source": "01 slavery in egypt", "type": "story"}, {"q": "1. ⭐⭐⭐ פרעה ציווה את המיילדות להרוג את הבנות ולהחיות את הבנים. נכון או לא נכון?", "a": "**לא נכון.** להפך! פרעה ציווה להמית את הבנים ולהחיות את הבנות: \"אם בן הוא והמתן אותו ואם בת היא וחיה\" (שמות א':ט\"ז).", "source": "01 slavery in egypt", "type": "story"}, {"q": "2. ⭐⭐⭐ הגזרה להשליך את הבנים ליאור הייתה מכוונת רק לבני ישראל. נכון או לא נכון?", "a": "**לא ברור מהפסוק.** הגזרה נאמרה \"לכל עמו\" (שמות א':כ\"ב), ונוסח הפסוק הוא \"כל הבן הילוד\" - בלי לציין \"העברי\" דווקא. יש מפרשים שהגזרה חלה על כל הבנים, כולל בני מצרים.", "source": "01 slavery in egypt", "type": "story"}, {"q": "3. ⭐⭐⭐ בני ישראל שירדו למצרים מנויים בפרק לפי סדר לידתם לאמותיהם. נכון או לא נכון?", "a": "**לא נכון.** הסדר בפרק הוא: ראובן, שמעון, לוי, יהודה, יששכר, זבולון, בנימין, דן, נפתלי, גד, אשר. זהו לא הסדר המקובל של לידה לפי האמהות, אלא סדר שונה שבו בנימין מופיע לפני דן ונפתלי (שמות א':ב'-ד').", "source": "01 slavery in egypt", "type": "story"}, {"q": "4. ⭐⭐⭐ פרעה ציווה את המיילדות להרוג את התינוקות על האובניים. נכון או לא נכון?", "a": "**לא נכון בדיוק.** פרעה ציווה להמית רק את הבנים: \"אם בן הוא והמתן אותו ואם בת היא וחיה\" (שמות א':ט\"ז). הגזרה לא כללה את הבנות.", "source": "01 slavery in egypt", "type": "story"}, {"q": "5. ⭐⭐⭐ הגזרה האחרונה של פרעה הייתה מכוונת רק למיילדות. נכון או לא נכון?", "a": "**לא נכון.** הגזרה האחרונה \"כל הבן הילוד היאורה תשליכוהו\" נאמרה \"לכל עמו\" (שמות א':כ\"ב) - לא למיילדות, אלא לכל המצרים.", "source": "01 slavery in egypt", "type": "story"}, {"q": "1. ⭐⭐ \"וַיָּקׇם מֶלֶךְ חָדָשׁ עַל מִצְרָיִם אֲשֶׁר לֹא _____ אֶת יוֹסֵף\"", "a": "**מילה חסרה:** יָדַע\n**מי אמר:** הכתוב (שמות א':ח')\n**הקשר:** תיאור עליית המלך החדש שלא הכיר את יוסף ואת זכויותיו - תחילת השעבוד (שמות א':ח')", "source": "01 slavery in egypt", "type": "story"}, {"q": "2. ⭐⭐ \"הָבָה נִתְחַכְּמָה לוֹ פֶּן _____ וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה\"", "a": "**מילה חסרה:** יִרְבֶּה\n**מי אמר:** פרעה לעמו\n**הקשר:** פרעה מציע תכנית להתמודד עם ריבוי בני ישראל (שמות א':י')", "source": "01 slavery in egypt", "type": "story"}, {"q": "3. ⭐⭐⭐ \"כִּי לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת כִּי _____ הֵנָּה\"", "a": "**מילה חסרה:** חָיוֹת\n**מי אמר:** המיילדות (שפרה ופועה) לפרעה\n**הקשר:** תירוץ המיילדות לפרעה מדוע לא המיתו את הילדים - הנשים העבריות יולדות לפני בוא המיילדת (שמות א':י\"ט)", "source": "01 slavery in egypt", "type": "story"}, {"q": "4. ⭐⭐ \"כׇּל הַבֵּן הַיִּלּוֹד _____ תַּשְׁלִיכֻהוּ וְכׇל הַבַּת תְּחַיּוּן\"", "a": "**מילה חסרה:** הַיְאֹרָה\n**מי אמר:** פרעה לכל עמו\n**הקשר:** הגזרה האחרונה של פרעה - להשליך כל בן שנולד ליאור (שמות א':כ\"ב)", "source": "01 slavery in egypt", "type": "story"}, {"q": "5. ⭐⭐⭐ \"וַיִּבֶן עָרֵי מִסְכְּנוֹת לְפַרְעֹה אֶת _____ וְאֶת רַעַמְסֵס\"", "a": "**מילה חסרה:** פִּתֹם\n**מי אמר:** הכתוב\n**הקשר:** תיאור ערי המסכנות שבנו בני ישראל לפרעה (שמות א':י\"א)", "source": "01 slavery in egypt", "type": "story"}, {"q": "1. מאיזה שבט היו הוריו של משה?", "a": "שבט לוי (איש מבית לוי נשא את בת לוי)", "source": "02 birth of moshe", "type": "story"}, {"q": "2. כמה זמן הצפינה אמו של משה אותו?", "a": "שלושה ירחים (חודשים)", "source": "02 birth of moshe", "type": "story"}, {"q": "3. ממה הייתה עשויה התיבה שבה הושם משה?", "a": "תיבת גומא שנחמרה בחמר ובזפת", "source": "02 birth of moshe", "type": "story"}, {"q": "4. היכן הניחה אם משה את התיבה?", "a": "בסוף על שפת היאור", "source": "02 birth of moshe", "type": "story"}, {"q": "5. מי התייצבה מרחוק לראות מה יקרה לתינוק?", "a": "אחותו (מרים)", "source": "02 birth of moshe", "type": "story"}, {"q": "6. מי מצאה את התיבה ביאור?", "a": "בת פרעה", "source": "02 birth of moshe", "type": "story"}, {"q": "7. מה הציעה אחות משה לבת פרעה?", "a": "להביא מינקת עברית שתניק את הילד", "source": "02 birth of moshe", "type": "story"}, {"q": "8. מדוע קראה בת פרעה לילד \"משה\"?", "a": "כי מן המים משיתהו", "source": "02 birth of moshe", "type": "story"}, {"q": "9. מה עשה משה כשראה מצרי מכה איש עברי?", "a": "הכה את המצרי וטמנו בחול", "source": "02 birth of moshe", "type": "story"}, {"q": "10. מה קרה כשמשה ניסה להפריד בין שני עברים ניצים?", "a": "אחד מהם אמר \"מי שמך לאיש שר ושופט עלינו\" וחשף את סוד הריגת המצרי", "source": "02 birth of moshe", "type": "story"}, {"q": "11. לאן ברח משה מפני פרעה?", "a": "לארץ מדיין", "source": "02 birth of moshe", "type": "story"}, {"q": "12. כמה בנות היו לכהן מדיין?", "a": "שבע בנות", "source": "02 birth of moshe", "type": "story"}, {"q": "13. מי היה חותנו של משה ומה היה תפקידו?", "a": "רעואל, כהן מדיין", "source": "02 birth of moshe", "type": "story"}, {"q": "14. מה שם אשתו של משה?", "a": "ציפורה בת רעואל", "source": "02 birth of moshe", "type": "story"}, {"q": "15. מה שם בנו של משה ומה משמעות השם?", "a": "גרשום - כי אמר \"גר הייתי בארץ נכריה\"", "source": "02 birth of moshe", "type": "story"}, {"q": "16. מה קרה בסוף הפרק כשמת מלך מצרים?", "a": "בני ישראל נאנחו מן העבודה וזעקו, ושוועתם עלתה אל האלוהים", "source": "02 birth of moshe", "type": "story"}, {"q": "17. את בריתו עם מי זכר אלוהים כששמע את נאקת בני ישראל?", "a": "את בריתו עם אברהם, יצחק ויעקב", "source": "02 birth of moshe", "type": "story"}, {"q": "18. היכן ישב משה כשהגיע למדיין?", "a": "על הבאר", "source": "02 birth of moshe", "type": "story"}, {"q": "19. ⭐⭐ מה עשה משה לפני שהכה את המצרי?", "a": "\"ויפן כה וכה וירא כי אין איש\" - הסתכל לכל הכיוונים לוודא שאין עדים (שמות ב':י\"ב)", "source": "02 birth of moshe", "type": "story"}, {"q": "20. ⭐⭐⭐ היכן טמן משה את המצרי שהרג?", "a": "בחול (שמות ב':י\"ב)", "source": "02 birth of moshe", "type": "story"}, {"q": "21. ⭐⭐ מה שם אבי ציפורה?", "a": "רעואל (שמות ב':י\"ח)", "source": "02 birth of moshe", "type": "story"}, {"q": "1. ⭐⭐ \"הַאֲלֵךְ וְקָרָאתִי לָךְ אִשָּׁה מֵינֶקֶת מִן הָעִבְרִיֹּת\"", "a": "**מי אמר:** מרים\n**למי:** בת פרעה\n**הקשר:** מרים מציעה להביא מינקת עברייה לתינוק משה (שמות ב':ז')", "source": "02 birth of moshe", "type": "story"}, {"q": "2. ⭐⭐ \"מִי שָׂמְךָ לְאִישׁ שַׂר וְשֹׁפֵט עָלֵינוּ\"", "a": "**מי אמר:** האיש העברי (הרשע)\n**למי:** משה\n**הקשר:** תגובה להתערבות משה בריב בין שני עברים (שמות ב':י\"ד)", "source": "02 birth of moshe", "type": "story"}, {"q": "3. ⭐⭐⭐ \"הֵילִיכִי אֶת הַיֶּלֶד הַזֶּה וְהֵינִקִהוּ לִי וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ\"", "a": "**מי אמר:** בת פרעה\n**למי:** אם משה (יוכבד)\n**הקשר:** בת פרעה שוכרת את אם משה כמינקת בשכר, בלי לדעת שזו אמו (שמות ב':ט')", "source": "02 birth of moshe", "type": "story"}, {"q": "4. ⭐⭐⭐ \"אִישׁ מִצְרִי הִצִּילָנוּ מִיַּד הָרֹעִים\"", "a": "**מי אמר:** בנות רעואל (בנות כהן מדיין)\n**למי:** רעואל אביהן\n**הקשר:** הבנות מתארות את משה כ\"איש מצרי\" כשמספרות לאביהן איך הציל אותן מהרועים (שמות ב':י\"ט)", "source": "02 birth of moshe", "type": "story"}, {"q": "1. ⭐ גדל בארמון פרעה, ברח למדיין, ראה סנה בוער, גמגם בדיבורו", "a": "**הדמות:** משה\n**ספר:** שמות\n**הקשר:** נולד בתקופת גזרת פרעה, גדל בארמון, הרג מצרי וברח, ה' התגלה אליו בסנה הבוער ושלח אותו לגאול את ישראל (פרקים ב'-ד')", "source": "02 birth of moshe", "type": "story"}, {"q": "2. ⭐⭐ הטמינה את בנה שלושה חודשים, שמה אותו בתיבה על היאור, שכרה להיות מינקת לבנה שלה", "a": "**הדמות:** יוכבד\n**ספר:** שמות\n**הקשר:** יוכבד אם משה הטמינה אותו שלושה חודשים, שמה אותו בתיבת גומא ביאור, ובת פרעה שכרה אותה כמינקת (פרק ב')", "source": "02 birth of moshe", "type": "story"}, {"q": "3. ⭐ ירדה לרחוץ ביאור, מצאה תינוק בוכה בתיבה, חמלה עליו וגידלה אותו", "a": "**הדמות:** בת פרעה\n**ספר:** שמות\n**הקשר:** בת פרעה ירדה לרחוץ ביאור, ראתה את התיבה, פתחה ומצאה תינוק בוכה, חמלה עליו וגידלה אותו כבנה (פרק ב')", "source": "02 birth of moshe", "type": "story"}, {"q": "4. ⭐⭐ עמדה מרחוק לשמור על אחיה, הציעה להביא מינקת, דיברה נגד משה ונענשה בצרעת", "a": "**הדמות:** מרים\n**ספר:** שמות, במדבר\n**הקשר:** מרים עמדה מרחוק לראות מה יקרה לתיבת משה, הציעה לבת פרעה להביא מינקת עברייה, ודיברה נגד משה בגלל האישה הכושית ונענשה בצרעת (שמות פרק ב', במדבר פרק י\"ב)", "source": "02 birth of moshe", "type": "story"}, {"q": "5. ⭐⭐ נשאה למנהיג ישראל בגלות, אביה כהן מדיין, מלה את בנה בדרך חזרה למצרים", "a": "**הדמות:** ציפורה\n**ספר:** שמות\n**הקשר:** ציפורה בת יתרו נישאה למשה במדיין, ומלה את בנה בדרך חזרה למצרים כאשר ה' ביקש להמית את משה (פרקים ב', ד')", "source": "02 birth of moshe", "type": "story"}, {"q": "1. ⭐ משה נולד בשבט לוי ואמו הטמינה אותו שלושה חודשים. נכון או לא נכון?", "a": "**נכון.** \"וילך איש מבית לוי ויקח את בת לוי. ותהר האשה ותלד בן... ותצפנהו שלשה ירחים\" (שמות ב':א'-ב').", "source": "02 birth of moshe", "type": "story"}, {"q": "2. ⭐ משה הרג את המצרי כי ראה אותו מכה איש עברי, ואז ברח למדיין. נכון או לא נכון?", "a": "**נכון.** \"וירא איש מצרי מכה איש עברי מאחיו. ויפן כה וכה וירא כי אין איש ויך את המצרי ויטמנהו בחול\" (שמות ב':י\"א-י\"ב). לאחר מכן ברח למדיין (ב':ט\"ו).", "source": "02 birth of moshe", "type": "story"}, {"q": "3. ⭐⭐⭐ בת פרעה קראה לתינוק \"משה\" כי היא הצילה אותו מהמוות. נכון או לא נכון?", "a": "**לא נכון.** בת פרעה קראה לו \"משה\" בגלל שמשתה אותו מן המים: \"כי מן המים משיתהו\" (שמות ב':י') - לא בגלל הצלה מהמוות אלא בגלל המשייה מהמים.", "source": "02 birth of moshe", "type":
